<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Pro — منصة التواصل المهني</title>
<meta name="theme-color" content="#f5f5f7">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--ac:#007AFF;--ok:#34C759;--dg:#FF3B30;--or:#FF9500;--pu:#AF52DE;
--bg:#f5f5f7;--cd:#fff;--cd2:#f2f2f7;--bd:rgba(60,60,67,.14);--ink:#1d1d1f;--mut:#86868b;--bar:rgba(246,246,248,.78);--sel:rgba(0,122,255,.12);
--sh:0 .5px 0 rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);--shl:0 20px 60px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.18);
--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--r:12px;color-scheme:light}
[data-theme=dark]{--ac:#0A84FF;--ok:#30D158;--dg:#FF453A;--or:#FF9F0A;--pu:#BF5AF2;--bg:#1c1c1e;--cd:#2c2c2e;--cd2:#3a3a3c;--bd:rgba(255,255,255,.12);--ink:#f5f5f7;--mut:#98989d;--bar:rgba(40,40,42,.78);--sel:rgba(10,132,255,.22);--sh:none;--shl:0 20px 60px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text','IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--sel);outline-offset:1px;border-radius:8px}
.blur{-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);background:var(--bar)}
/* toolbar */
header{position:fixed;inset:0 0 auto;z-index:30;height:calc(52px + var(--st));padding:var(--st) 12px 0;display:flex;align-items:center;gap:6px;border-bottom:.5px solid var(--bd)}
.lg{width:30px;height:30px;border-radius:8px;background:linear-gradient(160deg,#5AC8FA,#007AFF);color:#fff;display:grid;place-items:center;font-size:14px;flex:none;box-shadow:0 1px 3px rgba(0,122,255,.4)}
.ht{flex:1;min-width:0}.ht b{display:block;font-size:15px;font-weight:600;line-height:1.15}.ht small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{width:32px;height:32px;border-radius:8px;color:var(--mut);display:grid;place-items:center;font-size:15px;flex:none;transition:.12s}.hb:hover{background:var(--sel);color:var(--ac)}.hb.on{color:var(--ac);background:var(--sel)}
#hadd,.ab{display:none}.cadd #hadd{display:grid}.adm .ab{display:block}
main{max-width:860px;margin:0 auto;padding:calc(64px + var(--st)) 12px calc(96px + var(--sb))}
.tab{display:none}.tab.on{display:block;animation:fi .18s ease-out}@keyframes fi{from{opacity:0}}
/* dock */
nav{position:fixed;inset:auto 0 calc(10px + var(--sb));z-index:30;margin:auto;width:max-content;max-width:calc(100% - 20px);display:flex;gap:2px;padding:5px;border-radius:22px;border:.5px solid var(--bd);box-shadow:0 8px 30px rgba(0,0,0,.16)}
nav .nv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:68px;height:50px;border-radius:16px;color:var(--mut);font-size:10.5px;font-weight:500;transition:.15s}
nav .nv i{font-size:18px}nav .nv.on{background:var(--sel);color:var(--ac)}nav .nv:active{transform:scale(.92)}
.nb{position:absolute;top:2px;inset-inline-start:calc(50% + 4px);background:var(--dg);color:#fff;border-radius:8px;font-size:10px;min-width:16px;padding:0 4px;font-weight:700;text-align:center;line-height:16px}
/* groups & cards */
.gl{background:var(--cd);border-radius:var(--r);box-shadow:var(--sh)}
h3.t{font-size:13px;font-weight:600;color:var(--mut);margin:16px 6px 6px}
.pn{padding:12px;margin-bottom:10px}.pn>b{font-size:13px;font-weight:600}
.g4{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:6px}@media(min-width:560px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sc{padding:12px 8px;text-align:start;display:flex;flex-direction:column;gap:2px;min-width:0;transition:.15s;border-radius:var(--r)}.sc:active{transform:scale(.97)}
.sc .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:14px;margin-bottom:4px}
.sc b{font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.5px}.sc span{font-size:12px;color:var(--mut)}
.seg{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:2px 0 8px}.seg i{display:block;min-width:3px}
.cols{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}@media(min-width:640px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar2{position:relative;display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;min-height:34px;padding:0 10px;border-radius:8px;overflow:hidden;text-align:start;margin-top:5px;background:var(--cd2);font-size:12.5px}
.bar2 i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--sel);border-radius:8px}.bar2 span,.bar2 b{position:relative}.bar2 span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar2:hover i{background:var(--ac);opacity:.28}
/* search */
.stk{position:sticky;top:calc(52px + var(--st));z-index:5;padding:8px 0 6px;margin-top:-4px}
.sr{display:flex;align-items:center;gap:8px;padding:0 10px;height:36px;border-radius:10px;background:var(--cd2);border:.5px solid var(--bd)}
.sr:focus-within{box-shadow:0 0 0 3px var(--sel);border-color:var(--ac)}
.sr input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:15px}.sr i{color:var(--mut);font-size:13px}.sr button{width:22px;height:22px;color:var(--mut);border-radius:50%;display:grid;place-items:center;background:var(--bd);font-size:10px}
kbd{font:11px -apple-system,sans-serif;color:var(--mut);border:.5px solid var(--bd);border-radius:5px;padding:0 5px}
.seg2{display:flex;padding:2px;background:var(--cd2);border-radius:9px;gap:2px;margin:6px 0}
.seg2 button{flex:1;height:28px;border-radius:7px;font-size:12px;font-weight:500;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.seg2 button.on{background:var(--cd);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.fchips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 2px 6px}.fchips:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 4px 0 10px;background:var(--sel);color:var(--ac);border-radius:13px;font-size:12px;font-weight:500}
.fchip .x{width:18px;height:18px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:8px}
.fclr{height:26px;padding:0 10px;border-radius:13px;color:var(--dg);font-size:12px;font-weight:500}
.inf{font-size:12px;color:var(--mut);margin:2px 6px 6px}
/* list */
.ls{background:var(--cd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card{display:flex;align-items:center;gap:11px;padding:10px 12px;cursor:pointer;min-width:0;position:relative;transition:background .1s}
.card+.card::before{content:"";position:absolute;top:0;inset-inline:62px 0;height:.5px;background:var(--bd)}
.card:hover{background:var(--sel)}.card:active{background:var(--sel)}
.av{width:40px;height:40px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:600;flex:none;font-size:14px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.cm{flex:1;min-width:0}.cm b{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chs{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.ch{font-size:10.5px;padding:0 7px;border-radius:5px;background:var(--sel);color:var(--ac);line-height:17px;font-weight:500}.ch.o{background:var(--cd2);color:var(--mut)}.ch.v{background:rgba(52,199,89,.16);color:var(--ok)}
.ca{display:flex;flex:none}.ca button{width:30px;height:32px;color:var(--mut);font-size:13px;border-radius:7px}.ca button:hover{background:var(--cd2)}.ca .dl{color:var(--dg)}.ca .fv.on{color:var(--or)}
.vbadge{color:var(--ac);font-size:12px}
.em{text-align:center;padding:36px 12px;color:var(--mut);font-size:13px}.em i{font-size:30px;color:var(--mut);opacity:.6;display:block;margin-bottom:8px}.em b{display:block;color:var(--ink);font-size:14px}
.cr{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin:4px 0 8px;font-size:12.5px}.cr button{min-height:26px;padding:0 6px;color:var(--ac);font-weight:500;border-radius:6px}.cr button:hover{background:var(--sel)}.cr i{font-size:9px;color:var(--mut)}
.rw{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;text-align:start;font-size:14px;position:relative;background:var(--cd)}
.rw+.rw::before{content:"";position:absolute;top:0;inset-inline:44px 0;height:.5px;background:var(--bd)}
.rw:hover{background:var(--sel)}.rw span{flex:1;min-width:0;overflow-wrap:anywhere}.rw em{font-style:normal;color:var(--mut);font-size:12px}.rw>i:first-child{width:26px;height:26px;border-radius:7px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:12px}.rw>i:last-child{color:var(--mut);font-size:10px}
.meCard{background:linear-gradient(135deg,#0A84FF,#5E5CE6);color:#fff;border-radius:var(--r);padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:11px;cursor:pointer;box-shadow:0 4px 14px rgba(10,132,255,.3)}
.meCard .mav{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:16px;font-weight:700;flex:none}
.mBody{flex:1;min-width:0}.mName{font-weight:600;font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mSub{font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mTag{font-size:10px;background:rgba(255,255,255,.25);padding:0 7px;border-radius:6px;font-weight:500}
/* buttons */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 14px;border-radius:8px;background:var(--ac);color:#fff;font-weight:500;text-decoration:none;font-size:13px;min-width:0;transition:.12s;box-shadow:0 .5px 1px rgba(0,0,0,.18)}
.bt:active{transform:scale(.97);filter:brightness(.92)}
.bt.g{background:var(--cd);color:var(--ink);border:.5px solid var(--bd)}[data-theme=dark] .bt.g{background:var(--cd2)}
.bt.d{background:var(--dg)}.bt.w{background:var(--ok)}.bt.o{background:var(--or)}.bt:disabled{opacity:.4;cursor:not-allowed}
/* sheet modal */
#md{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;place-items:center;padding:12px;overflow-y:auto}#md.on{display:grid}
.mb{width:100%;max-width:440px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:14px;box-shadow:var(--shl);animation:pop .2s cubic-bezier(.2,.9,.3,1.2);margin:auto}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.tl{position:sticky;top:0;z-index:3;display:flex;gap:8px;padding:11px 14px 8px;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tl i{width:12px;height:12px;border-radius:50%;display:block;border:.5px solid rgba(0,0,0,.15)}.tl i:nth-child(1){background:#FF5F57;cursor:pointer}.tl i:nth-child(2){background:#FEBC2E}.tl i:nth-child(3){background:#28C840}
.mi{padding:4px 16px 16px}
.mi h2{font-size:17px;font-weight:600;text-align:center;margin-bottom:4px}.lead{text-align:center;color:var(--mut);font-size:12.5px;margin-bottom:12px}
.ac2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.ac2 .full{grid-column:1/-1}
.fl{display:block;margin-bottom:10px}.fl span{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-bottom:3px}
.fl input,.fl select{width:100%;height:36px;border-radius:8px;border:.5px solid var(--bd);background:var(--cd);padding:0 10px;font-size:14px;outline:0}
.fl input:focus,.fl select:focus{box-shadow:0 0 0 3px var(--sel);border-color:var(--ac)}.fl.er input{border-color:var(--dg)}
.fl.ck{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--cd);border-radius:8px}.fl.ck input{width:18px;height:18px}.fl.ck span{margin:0;color:var(--ink)}
.pr{display:flex;gap:8px;padding:8px 10px;align-items:center;font-size:13px;background:var(--cd);position:relative}.pr+.pr::before{content:"";position:absolute;top:0;inset-inline:10px 0;height:.5px;background:var(--bd)}
.pr small{display:block;color:var(--mut);font-size:11.5px}.pr div{min-width:0;overflow-wrap:anywhere}
.grp{border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
/* profile */
.vcard{border-radius:12px;overflow:hidden;background:var(--cd);position:relative;margin-bottom:10px;box-shadow:var(--sh)}
.vhead{background:linear-gradient(160deg,#0A84FF 0%,#5E5CE6 100%);color:#fff;padding:20px 14px 16px;text-align:center}
.vlogo{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:28px;margin:0 auto 10px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4)}
.vname{font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}.vname .vbadge{color:#fff}
.vsub{font-size:12.5px;opacity:.85;margin-top:2px}.vtags{display:flex;gap:5px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.vtag{font-size:11px;padding:1px 9px;border-radius:6px;background:rgba(255,255,255,.2);font-weight:500}.vtag.v{background:#fff;color:#007AFF}
.vqr{position:absolute;top:10px;inset-inline-end:10px;width:46px;height:46px;background:#fff;border-radius:7px;padding:3px;z-index:2}.vqr img{width:100%;height:100%}
.vrow{display:flex;gap:10px;padding:9px 14px;align-items:center;position:relative}.vrow+.vrow::before{content:"";position:absolute;top:0;inset-inline:52px 0;height:.5px;background:var(--bd)}
.vic{width:28px;height:28px;border-radius:7px;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none;font-size:12px}
.vk{font-size:11px;color:var(--mut)}.vv{font-size:14px;font-weight:500;overflow-wrap:anywhere}a.vv{color:var(--ac);text-decoration:none}
.vfoot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.vfoot .full{grid-column:1/-1}
/* filter rows */
.fsect,.fopt{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;text-align:start;background:var(--cd);position:relative}
.fsect+.fsect::before,.fopt+.fopt::before{content:"";position:absolute;top:0;inset-inline:48px 0;height:.5px;background:var(--bd)}
.fsect:hover,.fopt:hover{background:var(--sel)}
.fsect .ic{width:26px;height:26px;border-radius:7px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.val{font-size:12px;color:var(--ac);max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.num,.fopt .n{font-size:12px;color:var(--mut)}.chev{color:var(--mut);font-size:10px}
.fopt .box{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;color:transparent;font-size:10px;flex:none}.fopt.on .box{background:var(--ac);border-color:var(--ac);color:#fff}
.fopt.clear .name{color:var(--dg)}
.fback{display:flex;align-items:center;gap:4px;color:var(--ac);font-weight:500;font-size:13px;margin-bottom:6px}
.code-box{display:flex;align-items:center;gap:8px;padding:12px;background:var(--cd);border-radius:10px;margin:10px 0}.code{flex:1;font:700 22px ui-monospace,Menlo,monospace;letter-spacing:3px;text-align:center;direction:ltr;user-select:all;color:var(--ac)}
.cp{width:34px;height:34px;border-radius:8px;background:var(--ac);color:#fff;display:grid;place-items:center}
.code-hint{font-size:11.5px;color:var(--mut);text-align:center}.code-note{font-size:12.5px;color:var(--mut);padding:10px;background:var(--cd);border-radius:10px;line-height:1.8}
.auth-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;background:var(--cd);text-align:start;margin-bottom:8px;box-shadow:var(--sh)}
.auth-btn.primary{background:var(--ac);color:#fff}.auth-btn .ai{width:38px;height:38px;border-radius:10px;background:var(--sel);color:var(--ac);display:grid;place-items:center;font-size:16px}.auth-btn.primary .ai{background:rgba(255,255,255,.22);color:#fff}
.auth-btn .at{flex:1}.auth-btn b{display:block;font-size:14px}.auth-btn small{font-size:12px;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.stat{padding:8px 4px;background:var(--cd);border-radius:10px;text-align:center}.stat b{display:block;font-size:18px;color:var(--ac)}.stat span{font-size:10.5px;color:var(--mut)}.stat.warn b{color:var(--dg)}
.log-row{padding:6px 10px;font-size:11.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--cd)}.lg-time{font-size:10.5px;color:var(--mut);min-width:96px}.lg-act{font-weight:600;padding:0 6px;border-radius:5px;font-size:10.5px;background:var(--cd2)}
.lg-act.add{background:rgba(52,199,89,.18);color:var(--ok)}.lg-act.del{background:rgba(255,59,48,.16);color:var(--dg)}.lg-act.edit{background:var(--sel);color:var(--ac)}.lg-act.key,.lg-act.sync{background:rgba(255,149,0,.18);color:var(--or)}
/* pdf */
.pdf-stage{position:fixed;left:-99999px;top:0;width:1200px}
.pdf-card{width:1200px;min-height:520px;background:#fff;color:#1d1d1f;font-family:'IBM Plex Sans Arabic',-apple-system,sans-serif;direction:rtl;display:flex;position:relative;overflow:hidden}
.pdf-left{flex:0 0 470px;background:linear-gradient(160deg,#0A84FF,#5E5CE6);color:#fff;padding:60px 46px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.pdf-logo{width:150px;height:150px;border-radius:38px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:72px;margin-bottom:26px}
.pdf-name{font-size:34px;font-weight:700;line-height:1.25}.pdf-sub{font-size:17px;opacity:.88;margin-top:10px}
.pdf-tags{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}.pdf-tag{font-size:13px;padding:4px 14px;border-radius:9px;background:rgba(255,255,255,.22);font-weight:600}.pdf-tag.v{background:#fff;color:#007AFF}
.pdf-right{flex:1;padding:50px 44px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.pdf-row{display:flex;align-items:center;gap:18px}.pdf-row .ic{width:50px;height:50px;border-radius:13px;background:#007AFF;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.pdf-row .k{font-size:12px;color:#86868b;font-weight:600}.pdf-row .v{font-size:19px;font-weight:600;word-break:break-word}
.pdf-qr{position:absolute;bottom:26px;left:36px;text-align:center}.pdf-qr img{width:92px;height:92px;border-radius:10px;border:1px solid #d2d2d7;padding:4px;background:#fff}.pdf-qr small{display:block;font-size:10px;color:#86868b}

<script>
(()=>{'use strict';
const FBC={apiKey:"AIzaSyBQKPqut41Jqs28Zn_z-I_ffD-iNCnFpdU",authDomain:"said-rahil-default-rtdb.firebaseio.com",databaseURL:"https://said-rahil-default-rtdb.firebaseio.com/",projectId:"said-rahil",storageBucket:"said-rahil.firebasestorage.app"};

const S={db:[],fbCache:[],csvCache:[],csvBusy:false,viewSrc:'fb',f:{type:[],cat:[],dom:[],ville:[],spe:[],q:''},tab:'home',fav:[],admin:sessionStorage.getItem('cp-admin')==='1',
  exp:{t:'',d:'',s:''},expQ:'',expSort:'name',dSort:'name',onlyFav:false,cur:null,fb:null,lim:60,busy:false,fp:'sections',fk:null,sortF:{},tmpUid:null,tmpRec:null,usersList:null,usersTab:'with',usersQuery:'',user:null};
try{S.fav=JSON.parse(localStorage.getItem('cp-fav')||'[]')}catch{}
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase().replace(/\s+/g,' ').trim();
const hit=(v,q)=>{const n=norm(v);return norm(q).split(' ').every(t=>n.includes(t))};
const inits=n=>String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const color=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const avatar=(n,c='av')=>`<div class="${c}" style="background:linear-gradient(160deg,${color(n)},${color(n)}bb)">${esc(inits(n))}</div>`;
const fmtPhone=p=>{let d=String(p||'').replace(/[^\d+]/g,'');if(!d)return'';if(d.startsWith('00'))d='+'+d.slice(2);if(d.startsWith('+'))return d;if(d.startsWith('0'))return'+212'+d.slice(1);if(d.startsWith('212'))return'+'+d;return d};
const validPhone=p=>/^\+\d{9,15}$/.test(fmtPhone(p));
const phoneVariants=p=>{const d=String(p||'').replace(/\D/g,'');if(!d)return[];const o=new Set([String(p).trim(),'+'+d]);if(d.startsWith('212')){o.add('0'+d.slice(3));o.add(d)}if(d.startsWith('0')){o.add('+212'+d.slice(1));o.add('212'+d.slice(1));o.add(d)}if(d.length===9){o.add('+212'+d);o.add('0'+d);o.add('212'+d)}return[...o].filter(Boolean)};
const uid=()=>`${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
const url=w=>{if(!w)return'';const u=/^https?:\/\//i.test(w)?w:'https://'+w;return/^https?:\/\/\S+$/i.test(u)?u:''};
const shown=v=>v&&v!=='Autre'&&v!=='Général'?v:'';
const sub=r=>[shown(r.domaine),r.ville].filter(Boolean).join(' · ');
let tt;const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)};
const setLoading=b=>$('#ld').classList.toggle('on',b);
const openOverlay=h=>{$('#md').innerHTML=`<div class="mb"><div class="tl"><i data-a="cls" title="إغلاق"></i><i></i><i></i></div><div class="mi">${h}</div></div>`;$('#md').classList.add('on');document.body.style.overflow='hidden'};
const closeOverlay=()=>{$('#md').classList.remove('on');document.body.style.overflow=''};
const uniq=k=>[...new Set(S.db.map(r=>(r[k]||'').trim()).filter(Boolean))];
const byId=id=>S.db.find(r=>r.id===id);
const lbl=(k,v)=>k==='type'?TL[v]||v:k==='cat'?CL[v]||v:v;
const clearFilters=()=>{S.f={type:[],cat:[],dom:[],ville:[],spe:[],q:''};S.onlyFav=false;$('#q').value='';S.lim=60};
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0)+(S.onlyFav?1:0);
const applySource=()=>{S.db=S.admin&&S.viewSrc==='csv'&&S.csvCache.length?S.csvCache:S.fbCache};
const themeIcon=()=>$('#hth').innerHTML=`<i class="fa-solid ${document.documentElement.dataset.theme==='dark'?'fa-sun':'fa-moon'}"></i>`;
function theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('cp-theme',d)}catch{}themeIcon()}
const showDir=()=>{S.tab='dir';$$('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-dir'));nav();directory();scrollTo(0,0)};

/* NAV */
function nav(){
  const nf=activeCount();
  const it=[['home','الرئيسية','fa-house'],['dir','الدليل','fa-address-book'],['fil','فلتر','fa-sliders'],['exp','المستكشف','fa-sitemap']];
  $('#nav').innerHTML=it.map(([id,l,ic])=>id==='fil'
    ?`<button class="nv${nf?' on':''}" data-a="fopen" aria-label="فلتر"><i class="fa-solid ${ic}"></i>${l}${nf?`<span class="nb">${nf}</span>`:''}</button>`
    :`<button class="nv${S.tab===id?' on':''}" data-a="tab" data-v="${id}"><i class="fa-solid ${ic}"></i>${l}</button>`).join('');
}
function go(t){S.tab=t;$$('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+t));nav();({home:dashboard,dir:directory,exp:explorer})[t]();scrollTo(0,0)}

/* FILTER ENGINE */
function match(r,skip){
  for(const k in FLD){if(k===skip)continue;const a=S.f[k];if(a.length&&!a.some(v=>norm(r[FLD[k]])===norm(v)))return false}
  if(S.onlyFav&&!S.fav.includes(r.id))return false;
  return !S.f.q||hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.f.q);
}
const results=()=>S.db.filter(r=>match(r)).sort((a,b)=>S.dSort==='new'?(b.createdAt||0)-(a.createdAt||0):a.name.localeCompare(b.name,'ar'));
function facet(k,by='count'){const m=new Map();S.db.filter(r=>match(r,k)).forEach(r=>{const v=(r[FLD[k]]||'').trim();if(v)m.set(v,(m.get(v)||0)+1)});
  return[...m].sort(by==='count'?(a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'):(a,b)=>a[0].localeCompare(b[0],'ar'))}

/* DIRECTORY */
const vBadge=r=>r.verified?'<i class="fa-solid fa-circle-check vbadge" title="موثّق"></i>':'';
const card=r=>`<div class="card" data-a="open" data-v="${esc(r.id)}" role="button" tabindex="0">${avatar(r.name)}<div class="cm"><b>${esc(r.name)} ${vBadge(r)}</b><small>${esc(sub(r))}</small><div class="chs"><span class="ch">${TL[r.type]}</span><span class="ch o">${CL[r.categorie]}</span></div></div><div class="ca"><button class="fv${S.fav.includes(r.id)?' on':''}" data-a="fav" data-v="${esc(r.id)}" aria-label="مفضلة"><i class="fa-${S.fav.includes(r.id)?'solid':'regular'} fa-star"></i></button><button data-a="shr" data-v="${esc(r.id)}" aria-label="مشاركة"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>${canEdit(r)?`<button data-a="edit" data-v="${esc(r.id)}" aria-label="تعديل"><i class="fa-solid fa-pen"></i></button>`:''}${S.admin?`<button class="dl" data-a="del" data-v="${esc(r.id)}" aria-label="حذف"><i class="fa-solid fa-trash"></i></button>`:''}</div></div>`;
const empty=t=>`<div class="em"><i class="fa-regular fa-folder-open"></i><b>${t}</b></div>`;
function meCard(){const me=S.user?.profileId&&byId(S.user.profileId);if(!me)return'';
  return `<div class="meCard" data-a="open" data-v="${esc(me.id)}" role="button" tabindex="0"><div class="mav">${esc(inits(me.name))}</div><div class="mBody"><div class="mName">${esc(me.name)} ${vBadge(me)} <span class="mTag">ملفي</span></div><div class="mSub">${esc(sub(me))}</div></div><i class="fa-solid fa-chevron-left"></i></div>`}
function directory(){
  const chips=[];
  for(const k in FLD)for(const v of S.f[k])chips.push(`<span class="fchip">${esc(lbl(k,v))}<button class="x" data-a="chipx" data-k="${k}" data-v="${esc(v)}" aria-label="إزالة"><i class="fa-solid fa-xmark"></i></button></span>`);
  if(S.onlyFav)chips.push(`<span class="fchip">المفضلة<button class="x" data-a="favonly" aria-label="إزالة"><i class="fa-solid fa-xmark"></i></button></span>`);
  if(S.f.q.trim())chips.push(`<span class="fchip">بحث: ${esc(S.f.q.trim())}<button class="x" data-a="qx" aria-label="إزالة"><i class="fa-solid fa-xmark"></i></button></span>`);
  if(chips.length>1)chips.push(`<button class="fclr" data-a="clr">مسح الكل</button>`);
  $('#fchips').innerHTML=chips.join('');
  $('#dsort').innerHTML=`<button class="${S.dSort==='name'?'on':''}" data-a="dsort" data-v="name"><i class="fa-solid fa-arrow-down-a-z"></i> أبجدي</button><button class="${S.dSort==='new'?'on':''}" data-a="dsort" data-v="new"><i class="fa-regular fa-clock"></i> الأحدث</button><button class="${S.onlyFav?'on':''}" data-a="favonly"><i class="fa-solid fa-star"></i> المفضلة</button>`;
  $('#meSlot').innerHTML=meCard();
  const r=results();
  $('#inf').textContent=`${r.length} من أصل ${S.db.length}`;$('#qx').hidden=!S.f.q;
  $('#ls').innerHTML=r.length?`<div class="ls">${r.slice(0,S.lim).map(card).join('')}</div>`+(r.length>S.lim?`<button class="bt g" style="width:100%;margin-top:8px" data-a="more">عرض المزيد (${r.length-S.lim})</button>`:''):empty('لا توجد نتائج مطابقة');
}

/* FILTER SHEET */
function openFilter(k=null,v=null){
  S.fp=k?'pick':'sections';S.fk=k;
  if(k){clearFilters();if(v)S.f[k]=[v]}
  renderFilter();
}
function renderFilter(){
  let h='';
  if(S.fp==='sections'){
    h=`<h2>الفلاتر</h2><p class="lead">اختر قسمًا لتصفية الدليل</p><div class="grp">`+SECTIONS.map(s=>{const a=S.f[s.k];
      const val=a.length===1?lbl(s.k,a[0]):a.length>1?`${a.length} مختارة`:'';
      return `<button class="fsect" data-a="fsect" data-v="${s.k}"><span class="ic"><i class="fa-solid ${s.icon}"></i></span><span class="name">${s.label}</span>${val?`<span class="val">${esc(val)}</span>`:`<span class="num">${facet(s.k).length}</span>`}<i class="fa-solid fa-chevron-left chev"></i></button>`}).join('')+`</div>`;
    const n=activeCount();
    h+=`<div class="ac2"><button class="bt g" data-a="fclr"${n?'':' disabled'}>مسح</button><button class="bt" data-a="fdone">عرض النتائج</button></div>`;
  }else{
    const sect=SECTIONS.find(s=>s.k===S.fk),cs=S.sortF[S.fk]||'count',sel=S.f[S.fk];
    h=`<button class="fback" data-a="fback"><i class="fa-solid fa-chevron-right"></i> الفلاتر</button><h2>${sect.label}</h2><p class="lead">يمكن اختيار أكثر من قيمة</p>
    <div class="seg2"><button class="${cs==='count'?'on':''}" data-a="fsort" data-v="count"><i class="fa-solid fa-arrow-down-wide-short"></i> الأكثر</button><button class="${cs==='name'?'on':''}" data-a="fsort" data-v="name"><i class="fa-solid fa-arrow-down-a-z"></i> أبجدي</button></div><div class="grp">`+
    (facet(S.fk,cs).map(([v,n])=>{const on=sel.some(x=>norm(x)===norm(v));return `<button class="fopt${on?' on':''}" data-a="fpick" data-v="${esc(v)}"><span class="box"><i class="fa-solid fa-check"></i></span><span class="name">${esc(lbl(S.fk,v))}</span><span class="n">${n}</span></button>`}).join('')||'<p class="em">لا قيم</p>')+
    (sel.length?`<button class="fopt clear" data-a="fclearsec"><span class="box" style="visibility:hidden"></span><span class="name">إزالة المحدد (${sel.length})</span></button>`:'')+`</div><div class="ac2"><button class="bt full" data-a="fdone">عرض النتائج (${results().length})</button></div>`;
  }
  openOverlay(h);
}

/* EXPLORER */
const grp=(l,k)=>{const m=new Map();l.forEach(r=>{const v=r[k]||'—';m.set(v,(m.get(v)||0)+1)});return[...m]};
const matchExp=r=>!S.expQ||hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email,TL[r.type],CL[r.categorie]].join(' '),S.expQ);
function explorer(){
  const{t,d,s}=S.exp,cs=[['الرئيسية','']];if(t)cs.push([TL[t]+'ون','t']);if(d)cs.push([d,'d']);if(s)cs.push([s,'s']);
  const srt=a=>a.sort(S.expSort==='count'?(x,y)=>y[1]-x[1]||x[0].localeCompare(y[0],'ar'):(x,y)=>x[0].localeCompare(y[0],'ar'));
  const row=(ic,n,c,a,v)=>`<button class="rw" data-a="${a}" data-v="${esc(v)}"><i class="fa-solid ${ic}"></i><span>${esc(n)}</span><em>${c}</em><i class="fa-solid fa-chevron-left"></i></button>`;
  const base=S.db.filter(r=>!t||r.type===t).filter(matchExp);let h;
  if(S.expQ)h=base.length?`<div class="ls">${base.map(card).join('')}</div>`:empty('لا نتائج');
  else if(!t)h=`<div class="ls">`+srt(['fournisseurs','experts'].map(x=>[x,S.db.filter(r=>r.type===x).length])).map(([x,c])=>row(x==='experts'?'fa-user-tie':'fa-truck-field',TL[x]+'ون',c,'xt',x)).join('')+`</div>`;
  else if(!d)h=`<div class="ls">`+srt(grp(base,'domaine')).map(g=>row(domIcon(g[0]),g[0],g[1],'xd',g[0])).join('')+`</div>`;
  else if(!s)h=`<div class="ls">`+srt(grp(base.filter(r=>r.domaine===d),'specialite')).map(g=>row('fa-screwdriver-wrench',g[0],g[1],'xs',g[0])).join('')+`</div>`;
  else h=`<div class="ls">${base.filter(r=>r.domaine===d&&r.specialite===s).map(card).join('')}</div>`;
  $('#t-exp').innerHTML=`<div class="stk"><div class="sr"><i class="fa-solid fa-magnifying-glass"></i><input id="xq" value="${esc(S.expQ)}" placeholder="بحث…" aria-label="بحث"><button id="xqc" ${S.expQ?'':'hidden'} aria-label="مسح"><i class="fa-solid fa-xmark"></i></button></div></div>
  <div class="seg2"><button class="${S.expSort==='count'?'on':''}" data-a="expSort" data-v="count"><i class="fa-solid fa-arrow-down-wide-short"></i> الأكثر</button><button class="${S.expSort==='name'?'on':''}" data-a="expSort" data-v="name"><i class="fa-solid fa-arrow-down-a-z"></i> أبجدي</button></div>
  <div class="cr">${cs.map((c,i)=>(i?'<i class="fa-solid fa-chevron-left"></i>':'')+`<button data-a="xc" data-v="${c[1]}">${esc(c[0])}</button>`).join('')}</div>${h||empty('لا عناصر')}`;
  const xq=$('#xq');xq.oninput=ev=>{clearTimeout(xq._t);xq._t=setTimeout(()=>{S.expQ=ev.target.value;explorer();const el=$('#xq');if(el){el.focus();el.setSelectionRange(9999,9999)}},200)};
  const xc=$('#xqc');if(xc)xc.onclick=()=>{S.expQ='';explorer()};
}

/* DASHBOARD */
function dashboard(){
  const c=(k,v)=>S.db.filter(r=>r[k]===v).length;
  const st=[['fa-truck-field','موردون',c('type','fournisseurs'),'type:fournisseurs','#007AFF'],['fa-user-tie','خبراء',c('type','experts'),'type:experts','#5856D6'],['fa-city','مدن',uniq('ville').length,'pick:ville','#FF9500'],['fa-industry','قطاعات',uniq('domaine').length,'pick:dom','#34C759']];
  const cats=Object.keys(CL).map(k=>[CI[k],CL[k],c('categorie',k),'cat:'+k,CC[k]]);

function mapRaw(raw){const o=[];for(const[T,tv]of Object.entries(TK))for(const[C,cv]of Object.entries(CK))toArr(raw?.[tv]?.[cv]).forEach(i=>i.name&&o.push({...i,type:T,categorie:C,id:i.id||uid(),domaine:i.domaine||'Autre',specialite:i.specialite||'Général'}));return o}
async function loadDB(){
  let raw=null,ok=false;
  try{if(!S.fb)throw 0;raw=(await S.fb.ref('professionals').once('value')).val();ok=true}catch{toast('تعذر الاتصال')}
  S.fbCache=mapRaw(raw);
  if(ok&&S.fbCache.length)try{localStorage.setItem('cp-cache',JSON.stringify(S.fbCache))}catch{}
  if(!S.fbCache.length&&!ok)try{S.fbCache=JSON.parse(localStorage.getItem('cp-cache')||'[]')}catch{}
  applySource();
}
function splitCSV(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const h=l[i];if(h==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(h===','&&!q){o.push(c);c=''}else c+=h}o.push(c);return o}
const parseCSV=(txt,type,cat)=>{const cl=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c=>cl(c[1])).map(c=>({id:sid(type,cl(c[1]),cl(c[5])),name:cl(c[1]),domaine:cl(c[2])||'Autre',specialite:cl(c[3])||'Général',ville:cl(c[4]),phone:fmtPhone(cl(c[5])),email:cl(c[6]),web:cl(c[7]),type,categorie:cat}))};
async function csvAll(){const g=async(u,t,c)=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return parseCSV(await r.text(),t,c)};
  const[e,f]=await Promise.all([g(CSV_EXPERTS,'experts','yad-amila'),g(CSV_FOURNISSEURS,'fournisseurs','services')]);const m=new Map();[...f,...e].forEach(r=>m.has(r.id)||m.set(r.id,r));return[...m.values()]}
async function csvFetch(silent=false){
  if(!S.admin||!needFb())return;
  if(S.csvBusy){if(!silent)toast('جاري الجلب…');return}
  S.csvBusy=true;if(!silent)setLoading(true);if(S.tab==='home')dashboard();
  try{S.csvCache=await csvAll();S.viewSrc='csv';applySource();if(!silent)toast(`${S.csvCache.length} ملف`);go('home')}
  catch(e){console.error(e);if(!silent)toast('فشل الجلب')}
  finally{S.csvBusy=false;if(!silent)setLoading(false);if(S.tab==='home')dashboard()}
}
async function csvPush(){
  if(!S.admin||!needFb()||S.busy)return;if(!S.csvCache.length)return toast('اجلب CSV أولاً');
  const old=S.fbCache,cr=new Map(old.map(r=>[r.id,r.createdAt])),vr=new Map(old.map(r=>[r.id,r.verified])),owned=new Map(old.filter(r=>r.owner).map(r=>[r.id,r])),oldIds=new Set(old.map(r=>r.id));
  let added=0,updated=0,kept=0;const now=Date.now(),tree={};
  const put=r=>{const{type,categorie,...x}=r,T=TK[type],C=CK[categorie];tree[T]=tree[T]||{};(tree[T][C]=tree[T][C]||[]).push(x)};
  S.csvCache.forEach(r=>{if(owned.has(r.id)){kept++;return}const v={...r,createdAt:cr.get(r.id)||now};if(vr.get(r.id))v.verified=true;oldIds.has(r.id)?updated++:added++;put(v)});
  owned.forEach(put);
  if(!confirm(`مزامنة:\n➕ ${added} جديد\n✏️ ${updated} محدّث\n🔒 ${kept} محمي\n\nمتابعة؟`))return;
  S.busy=true;setLoading(true);
  try{await S.fb.ref('professionals').set(tree);log('csv-push',`${added}+ ${updated}~`);await loadDB();S.viewSrc='fb';applySource();go('home');toast(`تم: ${added} جديد، ${updated} محدّث`)}
  catch(e){console.error(e);toast('فشلت المزامنة')}finally{S.busy=false;setLoading(false)}
}
function exportCSV(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',h=['id','name','domaine','specialite','ville','phone','email','web','type','categorie','verified'];
  const csv='\ufeff'+[h.join(','),...S.db.map(r=>h.map(k=>q(r[k])).join(','))].join('\r\n');

function h53(s,seed=0){let a=0xdeadbeef^seed,b=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}

function renderUsersPanel(){
  if(!S.usersList)return;const{users,logs,profs}=S.usersList,ids=new Set(users.filter(([,u])=>u.profileId).map(([,u])=>u.profileId)),noAcc=profs.filter(p=>!p.owner&&!ids.has(p.id));
  const stats=`<div class="stats"><div class="stat"><b>${profs.length}</b><span>ملفات</span></div><div class="stat"><b>${users.length}</b><span>حسابات</span></div><div class="stat ${noAcc.length?'warn':''}"><b>${noAcc.length}</b><span>بدون حساب</span></div><div class="stat"><b>${users.filter(([,u])=>u.resetCode&&u.resetExpiry>Date.now()).length}</b><span>رموز نشطة</span></div></div>`;
  const tabs=`<div class="seg2"><button class="${S.usersTab==='with'?'on':''}" data-a="utab" data-v="with">حسابات (${users.length})</button><button class="${S.usersTab==='no'?'on':''}" data-a="utab" data-v="no">بدون حساب (${noAcc.length})</button></div>`;
  let c;
  if(S.usersTab==='with'){const q=S.usersQuery,fl=users.filter(([,u])=>!q||hit([u.name,u.ident].join(' '),q));
    c=`<label class="fl"><input type="search" id="uq" placeholder="بحث…" value="${esc(q)}"></label><div class="grp" style="max-height:260px;overflow-y:auto">${fl.length?fl.map(([id,u])=>`<div class="pr"><div style="flex:1"><b>${esc(u.name)}</b><small dir="ltr">${esc(u.ident)}</small>${u.resetCode&&u.resetExpiry>Date.now()?'<small style="color:var(--or)">🔑 رمز نشط</small>':''}</div><button class="hb" style="color:var(--ac)" data-a="agGen" data-v="${esc(id)}"><i class="fa-solid fa-key"></i></button><button class="hb" style="color:var(--dg)" data-a="udel" data-v="${esc(id)}"><i class="fa-solid fa-user-slash"></i></button></div>`).join(''):'<p class="em">لا نتائج</p>'}</div>`}
  else c=`<div class="grp" style="max-height:300px;overflow-y:auto">${noAcc.length?noAcc.map(p=>`<div class="pr"><div style="flex:1"><b>${esc(p.name)}</b><small dir="ltr">${esc(fmtPhone(p.phone)||'—')}</small><small>${esc(sub(p))}</small></div><button class="bt o" style="min-height:30px;padding:0 9px;font-size:11.5px" data-a="agCreate" data-v="${esc(p.id)}"><i class="fa-solid fa-user-plus"></i> إنشاء + رمز</button></div>`).join(''):'<p class="em">كلها مرتبطة ✓</p>'}</div>`;
  const lc={add:'add',delete:'del',edit:'edit','csv-push':'sync','reset-gen':'key',signup:'add','pass-change':'edit','account-auto':'add'};
  const lh=logs.slice(0,15).map(l=>`<div class="log-row"><span class="lg-time">${esc(new Date(l.t).toLocaleString('ar-MA'))}</span><span class="lg-act ${lc[l.a]||''}">${esc(l.a)}</span><span style="flex:1">${esc(l.d)} · ${esc(l.u)}</span></div>`).join('')||'<p class="em">لا نشاط</p>';
  openOverlay(`<h2>لوحة الإدارة</h2>${stats}${tabs}${c}<h3 class="t">سجل النشاط</h3><div class="grp" style="max-height:200px;overflow-y:auto">${lh}</div><div class="ac2"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
  const uq=$('#uq');if(uq)uq.oninput=e=>{clearTimeout(uq._t);uq._t=setTimeout(()=>{S.usersQuery=e.target.value;renderUsersPanel();const el=$('#uq');if(el){el.focus();el.setSelectionRange(9999,9999)}},150)}}
async function udel(id){if(!S.admin||!needFb()||!confirm('حذف المستخدم؟'))return;try{await S.fb.ref('users/'+id).remove();log('user-del',id);toast('تم الحذف');adminPanel()}catch{toast('خطأ')}}

/* ACTIONS */
const copy=m=>v=>navigator.clipboard?.writeText(v).then(()=>toast(m)).catch(()=>toast('تعذر'));
const A={
  theme,adm,add:()=>canAdd()?form(null):toast('غير مسموح'),acc:account,usr:adminPanel,udel,udelme:deleteMyAccount,
  alogin:openLogin,asignup:openSignup,doLogin,doSignup,setDurable,forgotopen:forgotOpen,fqFind,changepass:changePassword,doChangePass,
  uout(){S.user=null;saveSess();adminUI();closeOverlay();toast('تم تسجيل الخروج');go(S.tab)},
  findme:()=>claimSet(null),claimsearch:claimSearch,claimsend:claimSet,resetreq:resetReq,rgenfile:rgenFile,admingen:adminGen,agFind,agGen,agCreate,
  utab(v){S.usersTab=v;S.usersQuery='';renderUsersPanel()},copylink:copy('تم نسخ الرابط'),rcopy:copy('تم النسخ'),
  srcfb(){if(!S.admin)return;S.viewSrc='fb';applySource();go('home')},
  srccsv(){if(!S.admin)return;if(!S.csvCache.length){toast('جاري جلب CSV…');csvFetch();return}S.viewSrc='csv';applySource();go('home')},
  csvfetch:()=>csvFetch(false),csvpush:csvPush,
  tab:v=>S.tab===v?(v==='dir'?(clearFilters(),directory(),nav()):v==='exp'?(S.exp={t:'',d:'',s:''},S.expQ='',explorer()):scrollTo({top:0,behavior:'smooth'})):go(v),
  cls:closeOverlay,open:profile,shr:share,pdf:makePDF,fav:v=>favToggle(v,false),favp:v=>favToggle(v,true),favonly(){S.onlyFav=!S.onlyFav;S.lim=60;directory();nav()},
  edit:id=>{const r=byId(id);canEdit(r)?form(r):toast('غير مسموح')},del:delAsk,delok:delOk,save,exp:exportCSV,vrf:verifyToggle,dsort(v){S.dSort=v;directory()},
  login(){if($('#pw').value===ADMIN_PASS){S.admin=true;sessionStorage.setItem('cp-admin','1');adminUI();closeOverlay();toast('مرحباً أيها المدير');csvFetch(true);go(S.tab)}else{$('#pw').parentElement.classList.add('er');toast('كلمة المرور خاطئة')}},
  stat(v){const m=v.match(/^pick:(.+)$/);if(m)return openFilter(m[1]);const i=v.indexOf(':');clearFilters();S.f[v.slice(0,i)]=[v.slice(i+1)];showDir()},
  /* الضغط على قطاع/مدينة في الرئيسية → عرض النتائج في الدليل */
  bardirect(v,el){clearFilters();S.f[el.dataset.k]=[v];showDir()},
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=60;directory();nav()},
  clr(){clearFilters();directory();nav()},more(){S.lim+=60;directory()},qx(){S.f.q='';$('#q').value='';directory()},
  xt:v=>{S.exp={t:v,d:'',s:''};S.expQ='';explorer()},xd:v=>{S.exp.d=v;S.exp.s='';S.expQ='';explorer()},xs:v=>{S.exp.s=v;S.expQ='';explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:''}:v==='t'?{t:x.t,d:'',s:''}:v==='d'?{t:x.t,d:x.d,s:''}:x;S.expQ='';explorer()},expSort(v){S.expSort=v;explorer()},
  fopen:()=>openFilter(),fclr(){clearFilters();renderFilter();directory();nav()},fsect(v){S.fp='pick';S.fk=v;renderFilter()},fback(){S.fp='sections';S.fk=null;renderFilter()},
  fsort(v){S.sortF[S.fk]=v;renderFilter()},fclearsec(){S.f[S.fk]=[];S.lim=60;renderFilter();directory();nav()},
  fpick(v){const a=S.f[S.fk],i=a.findIndex(x=>norm(x)===norm(v));i>=0?a.splice(i,1):a.push(v);S.lim=60;renderFilter();directory();nav()},
  fdone(){closeOverlay();showDir()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}else if(e.target.id==='md')closeOverlay()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeOverlay();
  if(e.key==='Enter'&&e.target.classList?.contains('card')||e.key==='Enter'&&e.target.classList?.contains('meCard'))A.open(e.target.dataset.v);
  if((e.key==='/'||(e.key==='k'&&(e.metaKey||e.ctrlKey)))&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&!$('#md').classList.contains('on')){e.preventDefault();go('dir');setTimeout(()=>$('#q').focus(),30)}
});
let dt;$('#q').addEventListener('input',e=>{clearTimeout(dt);dt=setTimeout(()=>{S.f.q=e.target.value;S.lim=60;directory()},200)});

/* INIT */
(async()=>{
  themeIcon();adminUI();nav();
  try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
  await loadDB();await refreshUser();adminUI();go('home');setLoading(false);
  if(S.admin)csvFetch(true);
  const m=location.hash.match(/^#p=(.+)$/);if(m)setTimeout(()=>{const r=byId(m[1]);if(r)profile(r.id)},300);
})();
})();
</script>
</body>
