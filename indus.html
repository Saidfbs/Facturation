<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Pro — منصة التواصل المهني B2B</title>
<meta name="theme-color" content="#14181D">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --ink:#14181D;--ink2:#3A434E;--mute:#6C7782;--line:#C9CFD6;--bg:#DADDE1;--sf:#fff;--sf2:#EEF0F2;
  --steel:#14181D;--steel2:#1F252C;--or:#FF6B00;--or2:#FFC20E;--orsoft:rgba(255,107,0,.12);--teal:#0B7A75;--red:#D32F2F;--green:#2E9E4F;
  --sh:0 3px 0 rgba(20,24,29,.16);--hd:#14181D;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --fh:'Oswald','IBM Plex Sans Arabic',sans-serif;--hz:repeating-linear-gradient(-45deg,#FFC20E 0 10px,#14181D 10px 20px);color-scheme:light}
[data-theme=dark]{--ink:#EEF1F4;--ink2:#B9C2CC;--mute:#8793A0;--line:#2D363F;--bg:#0E1114;--sf:#171B20;--sf2:#1F252C;
  --orsoft:rgba(255,107,0,.16);--sh:0 3px 0 rgba(0,0,0,.5);--hd:#0A0C0F;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font:14px/1.55 'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:linear-gradient(rgba(20,24,29,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(20,24,29,.05) 1px,transparent 1px);background-size:32px 32px}
[data-theme=dark] body{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--or2);outline-offset:2px}

header{position:fixed;inset:0 0 auto;z-index:30;padding-top:var(--st);background:var(--hd);color:#fff}
header::after{content:"";position:absolute;inset:auto 0 0;height:6px;background:var(--hz)}
.hin{max-width:1000px;margin:0 auto;height:64px;display:flex;align-items:center;gap:10px;padding:0 14px 6px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:42px;height:42px;background:var(--or2);color:var(--steel);display:grid;place-items:center;font-size:19px;flex:none;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.brand b{display:block;font:700 19px/1.1 var(--fh);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;color:rgba(255,255,255,.55);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px;flex:none}
.ib{height:42px;min-width:42px;padding:0 12px;border-radius:4px;background:var(--sf);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px;transition:.15s;color:var(--ink2);box-shadow:var(--sh)}
.ib:hover{border-color:var(--or);color:var(--or)}
.ib:active{transform:translateY(2px);box-shadow:none}
header .ib{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:#fff;box-shadow:none}
header .ib:hover{background:var(--or2);color:var(--steel);border-color:var(--or2)}
.ib.pri,header .ib.pri{background:var(--or);border-color:var(--or);color:#fff}
header .ib.pri:hover{background:var(--or2);color:var(--steel)}
.ib.on{background:var(--steel);color:var(--or2);border-color:var(--steel)}
.ib.out:hover,header .ib.out:hover{background:var(--red);border-color:var(--red);color:#fff}
.ib .t{display:none}@media(min-width:720px){.ib .t{display:inline}}
.ava{width:26px;height:26px;border-radius:3px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}

main{max-width:1000px;margin:0 auto;padding:calc(92px + var(--st)) 14px calc(110px + var(--sb))}
.tab{display:none}.tab.on{display:block;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
h3.t{font:700 15px var(--fh);letter-spacing:.05em;margin:26px 0 12px;display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--line)}
h3.t::before{content:"";width:8px;height:18px;background:var(--or);transform:skewX(-14deg)}

.hero{padding:30px 24px;background:var(--steel) repeating-linear-gradient(-45deg,transparent 0 18px,rgba(255,255,255,.025) 18px 20px);color:#fff;position:relative;overflow:hidden;border-radius:6px;box-shadow:var(--sh);border-top:8px solid transparent;border-image:var(--hz) 8 0 0 0}
.hero::after{content:"\f013";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset-inline-end:-30px;bottom:-50px;font-size:190px;color:rgba(255,194,14,.1);line-height:1;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h2{font-size:23px;font-weight:700;line-height:1.35;position:relative;z-index:1}
.hero p{margin-top:8px;color:rgba(255,255,255,.7);font-size:13.5px;max-width:460px;position:relative;z-index:1}
.adm{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:12px 16px;border-radius:4px;background:var(--steel);color:var(--or2);font-weight:700;font-size:13px;border-inline-start:6px solid var(--or2)}
.adm small{color:rgba(255,255,255,.5);font-weight:500;margin-inline-start:auto}

.g4{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-top:14px}
@media(min-width:620px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{background:var(--sf);border:1.5px solid var(--line);border-top:5px solid var(--steel);border-radius:4px;padding:14px;text-align:start;box-shadow:var(--sh);transition:.15s;display:flex;flex-direction:column;gap:2px}
[data-theme=dark] .sc{border-top-color:var(--or2)}
.sc:hover{transform:translateY(-2px);border-top-color:var(--or)}
.sc i{width:38px;height:38px;border-radius:3px;display:grid;place-items:center;background:var(--steel);color:var(--or2);margin-bottom:10px;font-size:15px}
.sc b{font:700 30px/1 var(--fh);font-variant-numeric:tabular-nums}
.sc span{color:var(--mute);font-size:12px;font-weight:600}
.seg{display:flex;height:14px;gap:3px}.seg i{display:block;min-width:4px;transform:skewX(-20deg)}
.cols{display:grid;gap:12px;grid-template-columns:1fr;margin-top:6px}
@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.pn{background:var(--sf);border:1.5px solid var(--line);border-radius:4px;padding:14px;box-shadow:var(--sh)}
.pn>b{font:600 13px var(--fh);letter-spacing:.05em;color:var(--ink2);display:block;margin-bottom:8px}
.sl{max-height:250px;overflow-y:auto}
.bar{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 12px;border-radius:3px;overflow:hidden;margin-top:4px;background:var(--sf2);font-size:13px;font-weight:600;border-inline-start:3px solid var(--steel)}
.bar:hover{border-inline-start-color:var(--or)}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--orsoft)}
.bar span,.bar b{position:relative}.bar b{font:700 12px var(--fh);background:var(--or2);color:var(--steel);padding:1px 9px;border-radius:2px}

.sr{display:flex;align-items:center;gap:8px;height:52px;padding:0 8px 0 14px;background:var(--sf);border:2px solid var(--ink);border-radius:4px;box-shadow:var(--sh);transition:.15s}
[data-theme=dark] .sr{border-color:var(--line)}
.sr:focus-within{border-color:var(--or);box-shadow:0 0 0 4px var(--orsoft)}
.sr>i{color:var(--or)}.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:14.5px}
.sr input::placeholder{color:var(--mute)}
.sr button{width:38px;height:38px;border-radius:3px;display:grid;place-items:center;color:var(--mute);position:relative;flex:none}
.sr .fb{background:var(--or);color:#fff}
.bub{position:absolute;top:-6px;inset-inline-end:-6px;min-width:18px;height:18px;border-radius:2px;background:var(--or2);color:var(--steel);font-size:10px;font-weight:800;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 12px;border-radius:3px;background:var(--steel);color:var(--or2);font-weight:700;font-size:12px}
.chip button{width:22px;height:22px;border-radius:2px;background:rgba(255,255,255,.14);color:var(--or2);font-size:9px;display:grid;place-items:center}
.inf{color:var(--mute);font-size:12.5px;margin:12px 2px 10px;font-weight:600}

.ls{display:grid;gap:8px}
@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}
.card{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--sf);border:1.5px solid var(--line);border-inline-start:5px solid var(--steel);border-radius:4px;box-shadow:var(--sh);cursor:pointer;transition:.15s;min-width:0}
[data-theme=dark] .card{border-inline-start-color:var(--or2)}
.card:hover{transform:translateX(-3px);border-inline-start-color:var(--or)}
.av{width:48px;height:48px;border-radius:3px;color:#fff;display:grid;place-items:center;font:700 16px var(--fh);flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.cm{flex:1;min-width:0}
.cm b{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tg{font-size:10.5px;padding:2px 9px;border-radius:2px;background:var(--sf2);color:var(--ink2);font-weight:700;border:1px solid var(--line)}
.tg.a{background:var(--steel);color:var(--or2);border-color:var(--steel)}
.vb{color:var(--teal)}
.ca{display:flex;flex-direction:column;gap:2px;flex:none}
.ca button{width:32px;height:32px;border-radius:3px;color:var(--mute);font-size:13px}
.ca button:hover{background:var(--sf2);color:var(--ink)}.ca .fv.on{color:#E8A700}.ca .dl:hover{color:var(--red)}
.me{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:12px;border-radius:4px;color:#fff;cursor:pointer;background:var(--steel);border-inline-start:6px solid var(--or2);box-shadow:var(--sh)}
.me .av{background:var(--or)}.me b{display:block}.me small{opacity:.7}
.em{text-align:center;padding:46px 16px;border:2px dashed var(--line);border-radius:4px;color:var(--mute);background:var(--sf)}
.em i{font-size:30px;display:block;margin-bottom:10px;color:var(--or)}.em b{display:block;color:var(--ink);margin-bottom:2px}

.cr{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:12px 0;font-size:12.5px}
.cr button{padding:5px 12px;border-radius:3px;background:var(--sf);border:1.5px solid var(--line);font-weight:700}
.cr button:last-child{background:var(--steel);color:var(--or2);border-color:var(--steel)}.cr i{font-size:9px;color:var(--mute)}
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:8px;border-radius:4px;background:var(--sf);border:1.5px solid var(--line);border-inline-start:5px solid var(--steel);text-align:start;font-weight:700;transition:.15s;box-shadow:var(--sh)}
.rw:hover{border-inline-start-color:var(--or);transform:translateX(-3px)}
.rw>i:first-child{width:36px;height:36px;border-radius:3px;background:var(--steel);color:var(--or2);display:grid;place-items:center;font-size:14px}
.rw span{flex:1}.rw em{font:700 13px var(--fh);font-style:normal;background:var(--or2);color:var(--steel);padding:1px 10px;border-radius:2px}
.rw>i:last-child{font-size:10px;color:var(--mute)}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:4px;font:700 14px var(--fh);letter-spacing:.04em;background:var(--or);color:#fff;transition:.12s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22)}
.bt:hover{background:#E85F00}.bt:active{transform:translateY(2px);box-shadow:none}.bt:disabled{opacity:.5}
.bt.g{background:var(--sf2);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.bt.d{background:var(--red)}.bt.w{background:#25D366}.bt.full{width:100%}
.bt.k{background:var(--steel);color:var(--or2)}

#md{position:fixed;inset:0;z-index:60;background:rgba(8,10,12,.72);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
#md.on{display:flex}
@media(min-width:620px){#md{align-items:center;padding:16px}}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--sf);padding:22px 20px calc(22px + var(--sb));box-shadow:0 10px 0 rgba(0,0,0,.25);border-top:8px solid transparent;border-image:var(--hz) 8 0 0 0;animation:up .22s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font:700 19px var(--fh);letter-spacing:.04em;margin-bottom:4px;padding-inline-start:12px;border-inline-start:5px solid var(--or)}
.lead{color:var(--mute);font-size:12.5px;margin-bottom:16px;padding-inline-start:17px}
.fl{display:block;margin-bottom:12px}.fl span{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.fl input,.fl select{width:100%;height:46px;padding:0 14px;border-radius:4px;border:1.5px solid var(--line);background:var(--sf2);font-size:14px}
.fl input:focus,.fl select:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px var(--orsoft)}
.fl.er input{border-color:var(--red)}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.ac .full{grid-column:1/-1}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--sf2);border-radius:4px;margin-bottom:16px;border:1.5px solid var(--line)}
.sw button{height:38px;border-radius:3px;font-weight:700;color:var(--mute)}.sw .on{background:var(--steel);color:var(--or2)}
.fg{margin-bottom:16px}.fg>b{display:block;font-size:12.5px;margin-bottom:8px;color:var(--ink2)}
.cs{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow-y:auto}
.opt{padding:6px 12px;border-radius:3px;border:1.5px solid var(--line);background:var(--sf2);font-weight:700;font-size:12.5px}
.opt i{font-style:normal;color:var(--mute);margin-inline-start:4px;font-size:11px}
.opt.on{background:var(--steel);border-color:var(--steel);color:var(--or2)}.opt.on i{color:var(--or2)}

.ph{margin:-22px -20px 0;padding:30px 20px 22px;text-align:center;color:#fff;background:var(--steel) repeating-linear-gradient(-45deg,transparent 0 18px,rgba(255,255,255,.025) 18px 20px);position:relative;overflow:hidden}
.pl{width:78px;height:78px;margin:0 auto 12px;background:var(--or);display:grid;place-items:center;font-size:30px;position:relative;z-index:1;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}
.pn2{font:700 20px var(--fh);letter-spacing:.03em;position:relative;z-index:1}.ps{font-size:12.5px;opacity:.7;margin-top:2px;position:relative;z-index:1}
.ph .tags{justify-content:center;position:relative;z-index:1}.ph .tg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.pa{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 6px}.pa .ib{height:40px}
.vr{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.vr:last-child{border:0}
.vr>i,.vr>a{width:38px;height:38px;border-radius:3px;background:var(--steel);color:var(--or2);display:grid;place-items:center;flex:none}
.vr small{display:block;color:var(--mute);font-size:11px;font-weight:700}.vr b{font-weight:600;overflow-wrap:anywhere}
.acc{text-align:center}.acc .av{margin:0 auto 10px;width:70px;height:70px;font-size:24px}.acc h2{border:0;padding:0}.acc .lead{padding:0}

#bn{position:fixed;inset-inline:0;bottom:0;z-index:29;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + var(--sb));background:var(--hd);border-top:5px solid transparent;border-image:var(--hz) 5 0 0 0}
.bi{height:54px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.55);position:relative;transition:.15s}
.bi i{font-size:16px}.bi:hover{color:#fff}.bi.on{background:var(--or2);color:var(--steel)}
.bi .bub{top:4px;inset-inline-end:22px;background:var(--or);color:#fff}
#ts{position:fixed;inset-inline:0;bottom:calc(96px + var(--sb));margin:auto;width:max-content;max-width:calc(100% - 32px);z-index:90;background:var(--steel);color:#fff;padding:12px 18px;border-radius:4px;border-inline-start:5px solid var(--or2);font-weight:600;font-size:13px;display:flex;gap:12px;align-items:center;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#ts.on{opacity:1;transform:none;pointer-events:auto}#ts button{color:var(--or2);font-weight:800}
#ld{position:fixed;inset:0;z-index:99;background:var(--steel);display:none;place-items:center}#ld.on{display:grid}
#ld i{font-size:40px;color:var(--or2);animation:sp 1.4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

.pdf-stage{position:fixed;left:-99999px;top:0;width:1200px}
.pdf-card{width:1200px;min-height:560px;display:flex;direction:rtl;background:#DADDE1;color:#14181D;font-family:'IBM Plex Sans Arabic','Oswald',sans-serif;position:relative;overflow:hidden}
.pdf-l{flex:0 0 440px;background:#14181D;color:#fff;padding:70px 40px 60px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.pdf-l::before,.pdf-card::after{content:"";position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(-45deg,#FFC20E 0 14px,#14181D 14px 28px)}
.pdf-l::before{top:0}.pdf-card::after{bottom:0}
.pdf-logo{width:150px;height:150px;background:#FF6B00;color:#fff;display:flex;align-items:center;justify-content:center;font-size:66px;margin-bottom:26px;clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,30px 100%,0 calc(100% - 30px))}
.pdf-name{font:700 36px/1.25 'Oswald','IBM Plex Sans Arabic',sans-serif;letter-spacing:.03em}
.pdf-sub{font-size:16px;opacity:.65;margin-top:10px}
.pdf-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.pdf-tag{font-size:13px;padding:5px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);font-weight:700}
.pdf-tag.v{background:#FFC20E;color:#14181D;border-color:#FFC20E}
.pdf-r{flex:1;padding:50px 40px 120px;display:flex;flex-direction:column;justify-content:center;gap:14px;background-image:linear-gradient(rgba(20,24,29,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(20,24,29,.06) 1px,transparent 1px);background-size:32px 32px}
.pdf-row{display:flex;align-items:center;gap:18px;padding:14px 18px;background:#fff;border-inline-start:6px solid #FF6B00;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.pdf-row .ic{width:48px;height:48px;background:#14181D;color:#FFC20E;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.pdf-row .k{font-size:11px;color:#5C6670;font-weight:700;margin-bottom:2px}.pdf-row .v{font-size:17px;font-weight:600;word-break:break-word}
.pdf-ft{position:absolute;bottom:34px;left:40px;right:480px;display:flex;align-items:center;justify-content:space-between;direction:ltr}
.pdf-ft b{font:700 22px 'Oswald',sans-serif;letter-spacing:.12em;color:#14181D}
.pdf-ft img{width:84px;height:84px;background:#fff;padding:3px;border:3px solid #FF6B00}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="ld" class="on"><i class="fa-solid fa-circle-notch"></i></div>

<header><div class="hin">
  <div class="brand"><div class="logo"><i class="fa-solid fa-briefcase"></i></div>
    <div><b>Connect Pro</b><small id="sub">شبكة الأعمال الصناعية</small></div></div>
  <div class="acts" id="acts"></div>
</div></header>

<main>
  <section class="tab on" id="t-home"></section>
  <section class="tab" id="t-dir"></section>
  <section class="tab" id="t-exp"></section>
  <section class="tab" id="t-fav"></section>
</main>

<nav id="bn" aria-label="التنقل الرئيسي">
  <button class="bi" data-a="tab" data-v="home"><i class="fa-solid fa-house"></i>الرئيسية</button>
  <button class="bi" data-a="tab" data-v="dir"><i class="fa-solid fa-address-book"></i>الدليل</button>
  <button class="bi" data-a="tab" data-v="exp"><i class="fa-solid fa-diagram-project"></i>المستكشف</button>
  <button class="bi" data-a="tab" data-v="fav"><i class="fa-solid fa-star"></i>المفضلة<span class="bub" id="fb" hidden>0</span></button>
</nav>

<div id="md"></div>
<div id="ts" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script>
(()=>{'use strict';
const FBC={apiKey:"AIzaSyBQKPqut41Jqs28Zn_z-I_ffD-iNCnFpdU",authDomain:"said-rahil-default-rtdb.firebaseio.com",databaseURL:"https://said-rahil-default-rtdb.firebaseio.com/",projectId:"said-rahil",storageBucket:"said-rahil.firebasestorage.app"};
const ADMIN_PASS='1';
const TK={fournisseurs:'FOURNISSEURS',experts:'EXPERTS'},CK={services:'SERVICES',products:'PRODUITS',maqola:'MAQAOLA','yad-amila':'YAD AMILA'};
const TL={fournisseurs:'مورّد',experts:'خبير'},CL={services:'خدمات',products:'منتجات',maqola:'مقاولة','yad-amila':'يد عاملة'};
const FLD={type:'type',cat:'categorie',dom:'domaine',ville:'ville'};
const DOMI={'البناء':'fa-helmet-safety','التجارة':'fa-store','تكنولوجيا':'fa-laptop-code','الصناعة':'fa-industry','السياحة':'fa-plane','الصحة':'fa-heart-pulse','التعليم':'fa-graduation-cap','الفلاحة':'fa-seedling','النقل':'fa-truck','المالية':'fa-coins','الغذاء':'fa-utensils','الطاقة':'fa-bolt'};
const PAL=[['#FF6A1A','#FF9A3D'],['#0F766E','#14B8A6'],['#2563EB','#6366F1'],['#7C3AED','#EC4899'],['#DC2626','#F97316'],['#475569','#1E293B'],['#CA8A04','#EAB308']];
const CC=['#FF6A1A','#EAB308','#0F766E','#6366F1'];

const S={db:[],tab:'home',lim:40,f:{type:[],cat:[],dom:[],ville:[]},q:'',fav:[],user:null,admin:sessionStorage.getItem('cp-admin')==='1',exp:{t:'',d:'',s:''},fb:null,editId:null,delId:null};
try{S.fav=JSON.parse(localStorage.getItem('cp-fav')||'[]')}catch{}

/* helpers */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase().replace(/\s+/g,' ').trim();
const hit=(v,q)=>{const n=norm(v);return norm(q).split(' ').every(t=>n.includes(t))};
const inits=n=>{const p=String(n||'').trim().split(/\s+/).filter(Boolean);return !p.length?'?':p.length===1?p[0].slice(0,2).toUpperCase():(p[0][0]+p[1][0]).toUpperCase()};
const grad=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;const[a,b]=PAL[h%PAL.length];return `linear-gradient(140deg,${a},${b})`};
const fmtPhone=p=>{let d=String(p||'').replace(/[^\d+]/g,'');if(!d)return'';if(d.startsWith('00'))d='+'+d.slice(2);if(d.startsWith('+'))return d;if(d.startsWith('0'))return'+212'+d.slice(1);if(d.startsWith('212'))return'+'+d;return d};
const validPhone=p=>/^\+\d{9,15}$/.test(fmtPhone(p));
const uid=()=>`${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
const url=w=>{if(!w)return'';const u=/^https?:\/\//i.test(w)?w:'https://'+w;return/^https?:\/\/\S+$/i.test(u)?u:''};
const shown=v=>v&&v!=='Autre'&&v!=='Général'?v:'';
const sha=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch{return'f'+btoa(unescape(encodeURIComponent(s)))}};
const uidOf=async i=>'u_'+(await sha('cp:'+i)).slice(0,24);
const safeEq=(a,b)=>{if(!a||!b||a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a.charCodeAt(i)^b.charCodeAt(i);return d===0};
const debounce=(fn,w=200)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),w)}};
const uniq=k=>[...new Set(S.db.map(r=>(r[k]||'').trim()).filter(Boolean))].filter(v=>!['Autre','Général'].includes(v));
const byId=id=>S.db.find(r=>r.id===id);
const lbl=(k,v)=>k==='type'?TL[v]||v:k==='cat'?CL[v]||v:v;
const domIcon=d=>DOMI[String(d||'').trim()]||'fa-briefcase';
const toArr=v=>v?Object.values(v).filter(Boolean):[];
const path=(t,c)=>`professionals/${TK[t]}/${CK[c]}`;
const canEdit=r=>!!r&&(S.admin||(!!S.user&&S.user.profileId===r.id));
const canAdd=()=>S.admin||(!!S.user&&!S.user.profileId);
const isFav=id=>S.fav.includes(id);
const needFb=()=>S.fb?true:(toast('Firebase غير متاح'),false);
const log=(a,d)=>{try{S.fb?.ref('logs').push({t:Date.now(),u:S.admin?'admin':S.user?.name||'زائر',a,d:String(d||'')}).catch(()=>{})}catch{}};
const baseUrl=()=>location.protocol==='file:'?(localStorage.getItem('cp-base')||''):location.origin+location.pathname;

let tt,undoFn=null;
function toast(m,u=null){const t=$('#ts');t.innerHTML=`<span>${esc(m)}</span>${u?'<button data-a="undo">تراجع</button>':''}`;undoFn=u;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>{t.classList.remove('on');undoFn=null},u?5000:2500)}
const busy=b=>$('#ld').classList.toggle('on',b);
function openM(h){$('#md').innerHTML=`<div class="sheet">${h}</div>`;$('#md').classList.add('on');document.body.style.overflow='hidden';setTimeout(()=>$('#md input,#md select')?.focus(),60)}
function closeM(){$('#md').classList.remove('on');document.body.style.overflow=''}
const empty=(t,s='',i='fa-folder-open')=>`<div class="em"><i class="fa-solid ${i}"></i><b>${esc(t)}</b>${s?`<small>${esc(s)}</small>`:''}</div>`;
const fld=(id,l,t='text',x='',v='')=>`<label class="fl" id="w_${id}"><span>${l}</span><input id="${id}" type="${t}" value="${esc(v)}" ${x}></label>`;
const sel=(id,l,o,v)=>`<label class="fl"><span>${l}</span><select id="${id}">${Object.entries(o).map(([k,t])=>`<option value="${k}"${k===v?' selected':''}>${t}</option>`).join('')}</select></label>`;

/* data */
function mapRaw(raw){const o=[];for(const[T,tv]of Object.entries(TK))for(const[C,cv]of Object.entries(CK))toArr(raw?.[tv]?.[cv]).forEach(i=>{if(i.name)o.push({...i,type:T,categorie:C,id:i.id||uid(),domaine:i.domaine||'Autre',specialite:i.specialite||'Général'})});return o}
async function loadDB(){
  let raw=null,ok=false;
  try{if(!S.fb)throw 0;raw=(await S.fb.ref('professionals').once('value')).val();ok=true}catch{}
  S.db=mapRaw(raw);
  if(ok&&S.db.length)try{localStorage.setItem('cp-cache',JSON.stringify(S.db))}catch{}
  if(!ok&&!S.db.length)try{S.db=JSON.parse(localStorage.getItem('cp-cache')||'[]')}catch{}
}
async function refreshUser(){
  let id;try{id=JSON.parse(localStorage.getItem('cp-user')||'null')?.id}catch{}
  S.user=null;if(!id||!S.fb)return;
  try{const u=(await S.fb.ref('users/'+id).once('value')).val();if(u)S.user={id,name:u.name,ident:u.ident,profileId:u.profileId||''}}catch{}
}
const saveSess=()=>{try{S.user?localStorage.setItem('cp-user',JSON.stringify({id:S.user.id})):localStorage.removeItem('cp-user')}catch{}};

/* filtering */
function match(r,skip){
  for(const k in FLD){if(k===skip)continue;const a=S.f[k];if(a.length&&!a.some(v=>norm(r[FLD[k]])===norm(v)))return false}
  if(S.q){if(/^(موثق|verified)$/i.test(S.q))return!!r.verified;return hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.q)}
  return true;
}
const results=()=>S.db.filter(r=>match(r)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const activeCount=()=>Object.values(S.f).reduce((n,a)=>n+a.length,0)+(S.q?1:0);
const clearF=()=>{S.f={type:[],cat:[],dom:[],ville:[]};S.q='';S.lim=40};
function facet(k){const m=new Map();S.db.filter(r=>match(r,k)).forEach(r=>{const v=(r[FLD[k]]||'').trim();if(v&&v!=='Autre'&&v!=='Général')m.set(v,(m.get(v)||0)+1)});return[...m].sort((a,b)=>b[1]-a[1])}

/* views */
const vb=r=>r.verified?'<i class="fa-solid fa-circle-check vb" title="موثّق"></i>':'';
const card=r=>`<div class="card" data-a="open" data-v="${esc(r.id)}" role="button" tabindex="0">
  <div class="av" style="background:${grad(r.name)}">${esc(inits(r.name))}</div>
  <div class="cm"><b>${esc(r.name)} ${vb(r)}</b><small>${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</small>
    <div class="tags"><span class="tg a">${TL[r.type]}</span><span class="tg">${CL[r.categorie]}</span></div></div>
  <div class="ca">
    <button class="fv${isFav(r.id)?' on':''}" data-a="fav" data-v="${esc(r.id)}" aria-label="المفضلة"><i class="fa-${isFav(r.id)?'solid':'regular'} fa-star"></i></button>
    <button data-a="shr" data-v="${esc(r.id)}" aria-label="مشاركة"><i class="fa-solid fa-share-nodes"></i></button>
    ${canEdit(r)?`<button data-a="edit" data-v="${esc(r.id)}" aria-label="تعديل"><i class="fa-solid fa-pen"></i></button>`:''}
    ${S.admin?`<button class="dl" data-a="del" data-v="${esc(r.id)}" aria-label="حذف"><i class="fa-solid fa-trash"></i></button>`:''}
  </div></div>`;

function topbar(){
  let h=`<button class="ib" data-a="theme" title="تبديل المظهر" aria-label="تبديل المظهر"><i class="fa-solid ${document.documentElement.dataset.theme==='dark'?'fa-sun':'fa-moon'}"></i></button>`;
  if(canAdd())h+=`<button class="ib pri" data-a="add" title="إضافة شركة" aria-label="إضافة شركة"><i class="fa-solid fa-plus"></i><span class="t">إضافة</span></button>`;
  h+=S.user
    ?`<button class="ib" data-a="acc" title="حسابي" aria-label="حسابي"><span class="ava" style="background:${grad(S.user.name)}">${esc(inits(S.user.name))}</span><span class="t">حسابي</span></button>`
    :!S.admin?`<button class="ib" data-a="auth" title="تسجيل الدخول" aria-label="تسجيل الدخول"><i class="fa-solid fa-right-to-bracket"></i><span class="t">دخول</span></button>`:'';
  h+=S.admin
    ?`<button class="ib out" data-a="alogout" title="خروج المدير" aria-label="خروج المدير"><i class="fa-solid fa-right-from-bracket"></i><span class="t">خروج</span></button>`
    :`<button class="ib" data-a="alogin" title="دخول المدير" aria-label="دخول المدير"><i class="fa-solid fa-shield-halved"></i></button>`;
  $('#acts').innerHTML=h;
}

function home(){
  const c=(k,v)=>S.db.filter(r=>r[k]===v).length;
  const st=[['fa-truck-field','موردون',c('type','fournisseurs'),'type:fournisseurs'],['fa-user-tie','خبراء',c('type','experts'),'type:experts'],['fa-city','مدن',uniq('ville').length,'f'],['fa-industry','قطاعات',uniq('domaine').length,'f']];
  const cats=Object.keys(CL).map((k,i)=>['cat:'+k,CL[k],c('categorie',k),CC[i]]);
  const sc=(i,l,n,a)=>`<button class="sc" data-a="stat" data-v="${a}"><i class="fa-solid ${i}"></i><b>${n}</b><span>${l}</span></button>`;
  const top=(f,k)=>{const m=new Map();S.db.forEach(r=>{const v=(r[f]||'').trim();if(v&&!['Autre','Général'].includes(v))m.set(v,(m.get(v)||0)+1)});
    const g=[...m].sort((a,b)=>b[1]-a[1]);if(!g.length)return'<p class="inf">لا بيانات</p>';
    return`<div class="sl">${g.map(([v,n])=>`<button class="bar" data-a="bar" data-k="${k}" data-v="${esc(v)}"><i style="width:${Math.round(n/g[0][1]*100)}%"></i><span>${esc(v)}</span><b>${n}</b></button>`).join('')}</div>`};
  $('#sub').textContent=`${S.db.length} شركة · ${uniq('domaine').length} قطاع`;
  $('#t-home').innerHTML=`
  ${S.admin?`<div class="adm"><i class="fa-solid fa-shield-halved"></i>وضع المدير<small>تحكم كامل في الملفات</small></div>`:''}
  <div class="hero"><h2>منصة التواصل الصناعي B2B</h2><p>دليل الشركات والخبراء — ابحث، تواصل، وابنِ شبكتك الصناعية في المغرب.</p></div>
  <h3 class="t">نظرة عامة</h3>
  <div class="g4" style="margin-top:0">${st.map(x=>sc(...x)).join('')}</div>
  <h3 class="t">توزيع الشركات</h3>
  <div class="seg">${cats.filter(x=>x[2]).map(x=>`<i style="flex:${x[2]} 0 0;background:${x[3]}"></i>`).join('')}</div>
  <div class="g4">${cats.map((x,i)=>sc(['fa-screwdriver-wrench','fa-boxes-stacked','fa-helmet-safety','fa-people-carry-box'][i],x[1],x[2],x[0])).join('')}</div>
  <div class="cols"><div class="pn"><b>أكثر القطاعات نشاطاً</b>${top('domaine','dom')}</div><div class="pn"><b>أكثر المدن</b>${top('ville','ville')}</div></div>`;
}

function meCard(){
  const me=S.user?.profileId&&byId(S.user.profileId);if(!me)return'';
  return`<div class="me" data-a="open" data-v="${esc(me.id)}" role="button" tabindex="0"><div class="av">${esc(inits(me.name))}</div><div style="flex:1;min-width:0"><b>${esc(me.name)}</b><small>شركتي</small></div><i class="fa-solid fa-chevron-left"></i></div>`;
}
function dirShell(){
  $('#t-dir').innerHTML=`<div class="sr"><i class="fa-solid fa-magnifying-glass"></i>
    <input id="q" type="search" placeholder="ابحث عن شركة، خبير، قطاع..." value="${esc(S.q)}" autocomplete="off" aria-label="بحث">
    <button data-a="qx" id="qx" hidden aria-label="مسح"><i class="fa-solid fa-xmark"></i></button>
    <button class="fb" data-a="fmodal" aria-label="تصفية"><i class="fa-solid fa-sliders"></i><span class="bub" id="fc" hidden>0</span></button></div>
    <div class="chips" id="chips"></div><div class="inf" id="inf"></div><div id="me"></div><div class="ls" id="ls"></div>`;
  $('#q').addEventListener('input',debounce(e=>{S.q=e.target.value;S.lim=40;dirList()},200));
  dirList();
}
function dirList(){
  const chips=[];
  for(const k in FLD)for(const v of S.f[k])chips.push(`<span class="chip">${esc(lbl(k,v))}<button data-a="chipx" data-k="${k}" data-v="${esc(v)}" aria-label="إزالة"><i class="fa-solid fa-xmark"></i></button></span>`);
  $('#chips').innerHTML=chips.join('');
  const r=results(),n=activeCount();
  $('#inf').textContent=`${r.length} شركة من أصل ${S.db.length}`;
  $('#qx').hidden=!S.q;$('#fc').hidden=!n;$('#fc').textContent=n;$('#me').innerHTML=meCard();
  $('#ls').innerHTML=r.length?r.slice(0,S.lim).map(card).join('')+(r.length>S.lim?`<button class="bt g" style="grid-column:1/-1" data-a="more">عرض المزيد (${r.length-S.lim})</button>`:''):empty('لا توجد نتائج','جرّب تغيير البحث أو التصفية','fa-magnifying-glass');
}

function explorer(){
  const{t,d,s}=S.exp;
  const cs=[['الرئيسية','']];if(t)cs.push([TL[t]+'ون','t']);if(d)cs.push([d,'d']);if(s)cs.push([s,'s']);
  const base=S.db.filter(r=>!t||r.type===t);
  const grp=(l,k)=>{const m=new Map();l.forEach(r=>{const v=r[k]||'—';m.set(v,(m.get(v)||0)+1)});return[...m].sort((a,b)=>b[1]-a[1])};
  const row=(i,n,c,a,v)=>`<button class="rw" data-a="${a}" data-v="${esc(v)}"><i class="fa-solid ${i}"></i><span>${esc(n)}</span><em>${c}</em><i class="fa-solid fa-chevron-left"></i></button>`;
  let body;
  if(!t)body=['fournisseurs','experts'].map(x=>row(x==='experts'?'fa-user-tie':'fa-truck-field',TL[x]+'ون',S.db.filter(r=>r.type===x).length,'xt',x)).join('');
  else if(!d)body=grp(base,'domaine').map(g=>row(domIcon(g[0]),g[0],g[1],'xd',g[0])).join('');
  else if(!s)body=grp(base.filter(r=>r.domaine===d),'specialite').map(g=>row('fa-screwdriver-wrench',g[0],g[1],'xs',g[0])).join('');
  else body='<div class="ls">'+base.filter(r=>r.domaine===d&&r.specialite===s).map(card).join('')+'</div>';
  $('#t-exp').innerHTML=`<div class="cr">${cs.map((c,i)=>(i?'<i class="fa-solid fa-chevron-left"></i>':'')+`<button data-a="xc" data-v="${c[1]}">${esc(c[0])}</button>`).join('')}</div>${body||empty('لا عناصر')}`;
}
function favorites(){
  const f=S.fav.map(byId).filter(Boolean);
  $('#t-fav').innerHTML=`<h3 class="t" style="margin-top:0">المفضلة (${f.length})</h3>${f.length?`<div class="ls">${f.map(card).join('')}</div>`:empty('لا مفضلات بعد','اضغط النجمة على أي شركة لإضافتها هنا','fa-star')}`;
}
function go(t){
  if(S.tab==='dir'&&t!=='dir')clearF();
  if(S.tab==='exp'&&t!=='exp')S.exp={t:'',d:'',s:''};
  S.tab=t;
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+t));
  ({home,dir:dirShell,exp:explorer,fav:favorites})[t]();
  document.querySelectorAll('.bi').forEach(e=>e.classList.toggle('on',e.dataset.v===t));
  topbar();favBadge();scrollTo(0,0);
}
const rerender=()=>go(S.tab);
function favBadge(){const b=$('#fb');b.hidden=!S.fav.length;b.textContent=S.fav.length>99?'99+':S.fav.length}

/* filter sheet */
function filterModal(){
  const F=[['type','النوع'],['cat','التصنيف'],['dom','القطاع'],['ville','المدينة']];
  openM(`<h2>تصفية النتائج</h2><p class="lead">اختر قيمة أو أكثر من كل فئة</p>`+F.map(([k,l])=>`<div class="fg"><b>${l}</b><div class="cs">${facet(k).map(([v,n])=>`<button class="opt${S.f[k].some(x=>norm(x)===norm(v))?' on':''}" data-a="fp" data-k="${k}" data-v="${esc(v)}">${esc(lbl(k,v))}<i>${n}</i></button>`).join('')||'<small>—</small>'}</div></div>`).join('')+
  `<div class="ac"><button class="bt g" data-a="fclr">مسح الكل</button><button class="bt" data-a="fdone">عرض النتائج</button></div>`);
}

/* profile */
function profile(id){
  const r=byId(id);if(!r)return toast('الملف غير موجود');
  const p=fmtPhone(r.phone),w=url(r.web);
  const rows=[];
  if(shown(r.domaine))rows.push(['fa-industry','القطاع',esc(r.domaine)]);
  if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',esc(r.specialite)]);
  if(r.ville)rows.push(['fa-location-dot','المدينة',esc(r.ville)]);
  if(p)rows.push(['fa-phone','الهاتف',`<span dir="ltr">${esc(p)}</span>`,'tel:'+esc(p)]);
  if(r.email)rows.push(['fa-envelope','البريد',`<span dir="ltr">${esc(r.email)}</span>`,'mailto:'+esc(r.email)]);
  if(w)rows.push(['fa-globe','الموقع',`<span dir="ltr">${esc(r.web)}</span>`,esc(w),1]);
  openM(`<div class="ph"><div class="pl"><i class="fa-solid ${domIcon(r.domaine)}"></i></div>
    <div class="pn2">${esc(r.name)} ${r.verified?'<i class="fa-solid fa-circle-check" style="color:var(--or2)"></i>':''}</div>
    <div class="ps">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div>
    <div class="tags" style="margin-top:10px"><span class="tg">${TL[r.type]}</span><span class="tg">${CL[r.categorie]}</span></div></div>
    <div class="pa">
      ${p?`<a class="ib" style="color:#25D366" href="https://wa.me/${esc(p.replace(/\D/g,''))}" target="_blank" rel="noopener" aria-label="واتساب"><i class="fa-brands fa-whatsapp"></i></a>`:''}
      <button class="ib" data-a="pdf" data-v="${esc(r.id)}" aria-label="بطاقة PDF" title="بطاقة PDF"><i class="fa-solid fa-file-pdf"></i></button>
      <button class="ib" data-a="shr" data-v="${esc(r.id)}" aria-label="مشاركة"><i class="fa-solid fa-share-nodes"></i></button>
      <button class="ib" data-a="fav" data-v="${esc(r.id)}" aria-label="المفضلة"><i class="fa-${isFav(r.id)?'solid':'regular'} fa-star"></i></button>
      ${canEdit(r)?`<button class="ib" data-a="edit" data-v="${esc(r.id)}" aria-label="تعديل"><i class="fa-solid fa-pen"></i></button>`:''}
      ${S.admin?`<button class="ib${r.verified?' on':''}" data-a="vrf" data-v="${esc(r.id)}" aria-label="توثيق"><i class="fa-solid fa-circle-check"></i></button><button class="ib out" data-a="del" data-v="${esc(r.id)}" aria-label="حذف"><i class="fa-solid fa-trash"></i></button>`:''}
      <button class="ib" data-a="cls" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button></div>
    ${rows.map(([i,k,v,h,ext])=>`<div class="vr">${h?`<a href="${h}"${ext?' target="_blank" rel="noopener"':''}><i class="fa-solid ${i}"></i></a>`:`<i class="fa-solid ${i}"></i>`}<div><small>${k}</small><b>${v}</b></div></div>`).join('')}`);
}
async function share(id){
  const r=byId(id);if(!r)return;
  const text=[`🏢 ${r.name}`,`🏷️ ${TL[r.type]} · ${CL[r.categorie]}`,shown(r.domaine)&&`🏭 ${r.domaine}`,r.ville&&`📍 ${r.ville}`,fmtPhone(r.phone)&&`📞 ${fmtPhone(r.phone)}`,r.email&&`✉️ ${r.email}`,url(r.web)&&`🌐 ${url(r.web)}`,baseUrl()&&`🔗 ${baseUrl()}#p=${r.id}`].filter(Boolean).join('\n');
  if(navigator.share){try{await navigator.share({title:r.name,text});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);toast('تم النسخ')}catch{toast('تعذر النسخ')}
}
function toggleFav(id){
  const i=S.fav.indexOf(id);i>=0?S.fav.splice(i,1):S.fav.push(id);
  try{localStorage.setItem('cp-fav',JSON.stringify(S.fav))}catch{}
  toast(i>=0?'أُزيلت من المفضلة':'أُضيفت للمفضلة');
  if(!$('#md').classList.contains('on'))rerender();else{favBadge();profile(id)}
}

/* PDF business card */
async function loadPdfLibs(){
  if(window.html2canvas&&window.jspdf)return;
  const ld=u=>new Promise((a,b)=>{const e=document.createElement('script');e.src=u;e.onload=a;e.onerror=b;document.head.appendChild(e)});
  try{await Promise.all([window.html2canvas?0:ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),window.jspdf?0:ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')])}
  catch{throw new Error('تعذر تحميل مكتبة PDF — تحقق من الاتصال')}
}
function pdfHtml(r){
  const p=fmtPhone(r.phone),w=url(r.web),rows=[];
  if(shown(r.domaine))rows.push(['fa-industry','القطاع',r.domaine]);
  if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',r.specialite]);
  if(r.ville)rows.push(['fa-location-dot','المدينة',r.ville]);
  if(p)rows.push(['fa-phone','الهاتف',p]);
  if(r.email)rows.push(['fa-envelope','البريد',r.email]);
  if(w)rows.push(['fa-globe','الموقع',r.web]);
  const base=baseUrl(),qr=base?`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(base+'#p='+r.id)}&color=14181D&bgcolor=FFFFFF&margin=0" crossorigin="anonymous" alt="QR">`:'';
  return`<div class="pdf-card" data-pdf-root>
    <div class="pdf-l"><div class="pdf-logo"><i class="fa-solid ${domIcon(r.domaine)}"></i></div>
      <div class="pdf-name">${esc(r.name)}</div><div class="pdf-sub">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div>
      <div class="pdf-tags"><span class="pdf-tag">${TL[r.type]}</span><span class="pdf-tag">${CL[r.categorie]}</span>${r.verified?'<span class="pdf-tag v">✓ موثّق</span>':''}</div></div>
    <div class="pdf-r">${rows.map(([i,k,v])=>`<div class="pdf-row"><div class="ic"><i class="fa-solid ${i}"></i></div><div><div class="k">${k}</div><div class="v">${esc(v)}</div></div></div>`).join('')}</div>
    <div class="pdf-ft"><b>CONNECT PRO</b>${qr}</div></div>`;
}
async function makePDF(id){
  const r=byId(id);if(!r)return;busy(true);let h=null;
  try{
    try{await loadPdfLibs()}catch(e){toast(e.message);return}
    h=document.createElement('div');h.className='pdf-stage';h.innerHTML=pdfHtml(r);document.body.appendChild(h);
    try{await document.fonts?.ready}catch{}
    await new Promise(res=>setTimeout(res,800));
    const cv=await html2canvas(h.querySelector('[data-pdf-root]'),{scale:2,backgroundColor:'#DADDE1',useCORS:true,logging:false});
    const{jsPDF}=window.jspdf,W=200,H=W*cv.height/cv.width;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[W,H]});
    pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);
    pdf.save(`ConnectPro-${r.name.replace(/\s+/g,'_')}.pdf`);log('pdf',r.name);toast('تم توليد بطاقة PDF');
  }catch(e){console.error(e);toast('خطأ في توليد PDF')}
  finally{h?.remove();busy(false)}
}

/* CRUD */
function form(r){
  S.editId=r?.id||null;r=r||{type:'fournisseurs',categorie:'services'};
  openM(`<h2>${r.id?'تعديل الشركة':'إضافة شركة جديدة'}</h2><p class="lead">${r.id?'حدّث بيانات الشركة':'سجّل شركتك في الشبكة المهنية'}</p>
    ${fld('f_n','اسم الشركة *','text','placeholder="مثال: شركة النور للصناعة"',r.name||'')}
    ${sel('f_t','النوع',TL,r.type)}${sel('f_c','التصنيف',CL,r.categorie)}
    ${fld('f_d','القطاع','text','list="dd"',shown(r.domaine))}${fld('f_s','التخصص','text','',shown(r.specialite))}
    ${fld('f_vl','المدينة','text','list="dv"',r.ville||'')}${fld('f_p','الهاتف','tel','dir="ltr" placeholder="+212 6 12 34 56 78"',r.phone||'')}
    ${fld('f_m','البريد الإلكتروني','email','dir="ltr"',r.email||'')}${fld('f_w','الموقع الإلكتروني','url','dir="ltr"',r.web||'')}
    ${S.admin?`<label class="fl" style="display:flex;gap:10px;align-items:center"><input id="f_v" type="checkbox" ${r.verified?'checked':''} style="width:18px;height:18px;accent-color:var(--or)"><span style="margin:0">ملف موثّق</span></label>`:''}
    <datalist id="dd">${uniq('domaine').map(v=>`<option value="${esc(v)}">`).join('')}</datalist><datalist id="dv">${uniq('ville').map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
    <div class="ac"><button class="bt g" data-a="cls">إلغاء</button><button class="bt" data-a="save"><i class="fa-solid fa-check"></i> حفظ</button></div>`);
}
async function save(){
  const g=i=>$('#'+i).value.trim();
  document.querySelectorAll('.fl.er').forEach(e=>e.classList.remove('er'));
  const bad=(i,m)=>{$('#w_'+i).classList.add('er');toast(m);return false};
  let ok=true;
  if(!g('f_n'))ok=bad('f_n','الاسم مطلوب');
  if(g('f_m')&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g('f_m')))ok=bad('f_m','بريد غير صالح');
  if(g('f_w')&&!url(g('f_w')))ok=bad('f_w','رابط غير صالح');
  if(g('f_p')&&!validPhone(g('f_p')))ok=bad('f_p','هاتف غير صالح');
  if(!ok||!needFb())return;
  const t=g('f_t'),c=g('f_c'),old=S.editId?byId(S.editId):null;
  if(old?!canEdit(old):!canAdd())return toast('غير مسموح');
  const it={id:old?.id||uid(),name:g('f_n'),domaine:g('f_d')||'Autre',specialite:g('f_s')||'Général',ville:g('f_vl'),phone:fmtPhone(g('f_p')),email:g('f_m'),web:g('f_w'),createdAt:old?.createdAt||Date.now()};
  const vEl=$('#f_v');if(S.admin&&vEl)it.verified=!!vEl.checked;else if(old?.verified)it.verified=true;
  const ow=old?old.owner:(S.admin?'':S.user.id);if(ow)it.owner=ow;
  busy(true);
  try{
    if(old&&(old.type!==t||old.categorie!==c))await S.fb.ref(`${path(old.type,old.categorie)}/${old.id}`).remove();
    await S.fb.ref(`${path(t,c)}/${it.id}`).update(it);
    if(!old&&!S.admin){S.user.profileId=it.id;await S.fb.ref('users/'+S.user.id+'/profileId').set(it.id)}
    log(old?'edit':'add',it.name);await loadDB();closeM();rerender();toast(old?'تم التعديل':'تمت الإضافة');
  }catch(e){console.error(e);toast('خطأ في الحفظ')}finally{busy(false)}
}
function delAsk(id){
  const r=byId(id);if(!r||!S.admin)return;S.delId=r.id;
  openM(`<h2>حذف الشركة</h2><p class="lead">هل تريد حذف <b style="color:var(--ink)">${esc(r.name)}</b>؟ يمكنك التراجع بعد الحذف.</p>
    <div class="ac"><button class="bt g" data-a="cls">إلغاء</button><button class="bt d" data-a="delok"><i class="fa-solid fa-trash"></i> حذف</button></div>`);
}
async function delOk(){
  const r=S.delId&&byId(S.delId);if(!r||!S.admin||!needFb())return;const snap={...r};busy(true);
  try{
    await S.fb.ref(`${path(r.type,r.categorie)}/${r.id}`).remove();
    S.fav=S.fav.filter(x=>x!==r.id);try{localStorage.setItem('cp-fav',JSON.stringify(S.fav))}catch{}
    log('delete',r.name);await loadDB();closeM();rerender();
    toast(`حُذفت: ${r.name}`,async()=>{try{const{type,categorie,...x}=snap;await S.fb.ref(`${path(type,categorie)}/${x.id}`).set(x);await loadDB();rerender();toast('تم التراجع')}catch{toast('تعذر التراجع')}});
  }catch(e){console.error(e);toast('خطأ في الحذف')}finally{busy(false)}
}
async function verify(id){
  if(!S.admin||!needFb())return;const r=byId(id);if(!r)return;busy(true);
  try{await S.fb.ref(`${path(r.type,r.categorie)}/${id}/verified`).set(!r.verified);log('verify',r.name);await loadDB();toast(r.verified?'تم إلغاء التوثيق':'تم التوثيق');profile(id);rerender()}
  catch{toast('خطأ')}finally{busy(false)}
}

/* auth */
function adminLogin(){
  if(S.user&&!confirm('سيتم تسجيل الخروج من حساب العضو للدخول كمدير. متابعة؟'))return;
  openM(`<h2>دخول المدير</h2><p class="lead">أدخل كلمة المرور للتحكم الكامل</p>${fld('pw','كلمة المرور','password','autocomplete="current-password"')}
    <div class="ac"><button class="bt g" data-a="cls">إلغاء</button><button class="bt k" data-a="alogin2"><i class="fa-solid fa-lock-open"></i> دخول</button></div>`);
  $('#pw').onkeydown=e=>e.key==='Enter'&&A.alogin2();
}
function authModal(mode='in'){
  const sw=`<div class="sw"><button class="${mode==='in'?'on':''}" data-a="auth" data-v="in">دخول</button><button class="${mode==='up'?'on':''}" data-a="auth" data-v="up">حساب شركة</button></div>`;
  openM(mode==='in'
  ?`<h2>تسجيل الدخول</h2><p class="lead">الهاتف والرمز السري</p>${sw}${fld('li_i','رقم الهاتف','tel','dir="ltr" autocomplete="username" placeholder="+212 6 12 34 56 78"',localStorage.getItem('cp-lastphone')||'')}${fld('li_p','الرمز السري','password','autocomplete="current-password"')}
    <div class="ac"><button class="bt g" data-a="cls">إلغاء</button><button class="bt" data-a="doLogin">دخول</button></div>`
  :`<h2>إنشاء حساب شركة</h2><p class="lead">أضف شركتك إلى الشبكة المهنية</p>${sw}${fld('su_n','اسم الشركة *','text','autocomplete="organization"')}${fld('su_i','رقم الهاتف *','tel','dir="ltr" autocomplete="tel"')}${fld('su_p','الرمز السري (6 أحرف فأكثر) *','password','autocomplete="new-password"')}
    ${sel('su_t','النوع',TL,'fournisseurs')}${sel('su_c','التصنيف',CL,'services')}${fld('su_d','القطاع','text','list="dd2"')}${fld('su_v','المدينة','text','list="dv2"')}
    <datalist id="dd2">${uniq('domaine').map(v=>`<option value="${esc(v)}">`).join('')}</datalist><datalist id="dv2">${uniq('ville').map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
    <div class="ac"><button class="bt g" data-a="cls">إلغاء</button><button class="bt" data-a="doSignup">إنشاء</button></div>`);
}
async function doLogin(){
  if(!needFb())return;const raw=$('#li_i').value.trim(),p=$('#li_p').value;
  if(!raw||!p)return toast('أدخل البيانات');
  busy(true);
  try{
    const u=await uidOf(fmtPhone(raw)),r=(await S.fb.ref('users/'+u).once('value')).val();
    if(!r)return toast('لا يوجد حساب بهذا الرقم');
    if(!safeEq(r.hash,await sha(r.salt+p)))return toast('الرمز غير صحيح');
    try{localStorage.setItem('cp-lastphone',fmtPhone(r.ident))}catch{}
    S.admin=false;sessionStorage.removeItem('cp-admin');
    S.user={id:u,name:r.name,ident:r.ident,profileId:r.profileId||''};saveSess();log('login','');closeM();toast('مرحباً '+r.name);rerender();
  }catch(e){console.error(e);toast('خطأ')}finally{busy(false)}
}
async function doSignup(){
  if(!needFb())return;
  const n=$('#su_n').value.trim(),i=fmtPhone($('#su_i').value),p=$('#su_p').value,t=$('#su_t').value,c=$('#su_c').value,d=$('#su_d').value.trim()||'Autre',v=$('#su_v').value.trim();
  if(!n)return toast('اسم الشركة مطلوب');if(!validPhone(i))return toast('هاتف غير صالح');if(p.length<6)return toast('الرمز قصير');
  busy(true);
  try{
    const u=await uidOf(i);
    if((await S.fb.ref('users/'+u).once('value')).val())return toast('الحساب موجود');
    const salt=uid();await S.fb.ref('users/'+u).set({name:n,ident:i,salt,hash:await sha(salt+p),createdAt:Date.now()});
    const ex=S.db.find(r=>!r.owner&&fmtPhone(r.phone)===i);let pid;
    if(ex){await S.fb.ref(`${path(ex.type,ex.categorie)}/${ex.id}`).update({owner:u});pid=ex.id}
    else{const it={id:uid(),name:n,domaine:d,specialite:'Général',ville:v,phone:i,email:'',web:'',owner:u,createdAt:Date.now()};await S.fb.ref(`${path(t,c)}/${it.id}`).set(it);pid=it.id}
    await S.fb.ref('users/'+u+'/profileId').set(pid);
    await loadDB();S.admin=false;sessionStorage.removeItem('cp-admin');S.user={id:u,name:n,ident:i,profileId:pid};saveSess();
    try{localStorage.setItem('cp-lastphone',i)}catch{}
    log('signup',n);closeM();toast('تم إنشاء الحساب');rerender();
  }catch(e){console.error(e);toast('خطأ')}finally{busy(false)}
}
function account(){
  const u=S.user;if(!u)return;
  openM(`<div class="acc"><div class="av" style="background:${grad(u.name)}">${esc(inits(u.name))}</div><h2>${esc(u.name)}</h2><p class="lead" dir="ltr">${esc(u.ident)}</p></div>
    <div class="ac">
      ${u.profileId?`<button class="bt full" data-a="open" data-v="${esc(u.profileId)}"><i class="fa-solid fa-building"></i> عرض شركتي</button><button class="bt g full" data-a="edit" data-v="${esc(u.profileId)}"><i class="fa-solid fa-pen"></i> تعديل بيانات الشركة</button>`:`<button class="bt full" data-a="add"><i class="fa-solid fa-plus"></i> إضافة شركتي</button>`}
      <button class="bt g" data-a="uout"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
      <button class="bt d" data-a="udelme"><i class="fa-solid fa-user-slash"></i> حذف الحساب</button>
    </div>`);
}
async function deleteMe(){
  if(!S.user||!needFb()||!confirm('حذف حسابك؟ يبقى ملف الشركة في الدليل.'))return;busy(true);
  try{const u=S.user,p=u.profileId&&byId(u.profileId);
    if(p)await S.fb.ref(`${path(p.type,p.categorie)}/${p.id}/owner`).remove();
    await S.fb.ref('users/'+u.id).remove();S.user=null;saveSess();await loadDB();closeM();toast('تم حذف الحساب');rerender()}
  catch{toast('خطأ')}finally{busy(false)}
}

/* actions */
const A={
  theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('cp-theme',d)}catch{}topbar()},
  add(){closeM();canAdd()?form(null):toast('غير مسموح')},
  auth:v=>authModal(v||'in'),doLogin,doSignup,acc:account,udelme:deleteMe,
  uout(){S.user=null;saveSess();closeM();toast('تم تسجيل الخروج');rerender()},
  alogin:adminLogin,
  alogin2(){
    if($('#pw').value===ADMIN_PASS){S.user=null;saveSess();S.admin=true;sessionStorage.setItem('cp-admin','1');closeM();toast('مرحباً — وضع المدير');rerender()}
    else{$('#pw').parentElement.classList.add('er');toast('كلمة المرور خاطئة')}
  },
  alogout(){S.admin=false;sessionStorage.removeItem('cp-admin');toast('تم الخروج من وضع المدير');rerender()},
  tab:v=>{if(S.tab===v){if(v==='dir'){clearF();dirShell()}else if(v==='exp'){S.exp={t:'',d:'',s:''};explorer()}else scrollTo({top:0,behavior:'smooth'})}else go(v)},
  cls:closeM,open(id){profile(id)},shr:share,pdf:makePDF,fav:toggleFav,edit(id){const r=byId(id);canEdit(r)?form(r):toast('غير مسموح')},
  del:delAsk,delok:delOk,save,vrf:verify,
  undo(){if(undoFn){undoFn();undoFn=null;$('#ts').classList.remove('on')}},
  stat(v){if(v==='f'){filterModal();return}const i=v.indexOf(':');clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];go('dir')},
  bar(v,el){clearF();S.f[el.dataset.k]=[v];go('dir')},
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(v));S.lim=40;dirList()},
  qx(){S.q='';$('#q').value='';dirList()},more(){S.lim+=40;dirList()},
  fmodal:filterModal,
  fp(v,el){const k=el.dataset.k,a=S.f[k],i=a.findIndex(x=>norm(x)===norm(v));i>=0?a.splice(i,1):a.push(v);el.classList.toggle('on',i<0);S.lim=40;if(S.tab==='dir')dirList()},
  fclr(){clearF();filterModal();if(S.tab==='dir'){$('#q').value='';dirList()}},
  fdone(){closeM();if(S.tab!=='dir'){const keep={...S.f},q=S.q;S.tab='';S.f=keep;S.q=q;go('dir')}},
  xt:v=>{S.exp={t:v,d:'',s:''};explorer()},xd:v=>{S.exp.d=v;S.exp.s='';explorer()},xs:v=>{S.exp.s=v;explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:''}:v==='t'?{t:x.t,d:'',s:''}:v==='d'?{t:x.t,d:x.d,s:''}:x;explorer()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}
  else if(e.target.id==='md')closeM();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeM();
  if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v);
});

(async()=>{
  try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
  await loadDB();await refreshUser();
  go('home');busy(false);
  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(m[1]);r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
</script>
