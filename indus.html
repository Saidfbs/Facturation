<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Pro — منصة التواصل الصناعي B2B</title>
<meta name="theme-color" content="#1A2332">
<meta name="description" content="دليل الشركات والخبراء الصناعيين في المغرب">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Connect Pro">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --steel-900:#1A2332;--steel-800:#243044;--steel-700:#2E3D54;--steel-600:#3D4F6A;--steel-500:#556A8A;
  --orange-600:#E65100;--orange-500:#FF6B00;--orange-400:#FF8A33;--orange-soft:#FFF3E0;
  --yellow-500:#FFC20E;--yellow-soft:#FFF9E6;
  --bg:#F4F6F8;--surface:#FFFFFF;--surface-2:#F0F2F5;--surface-hover:#E4E6EB;
  --border:#D0D7DE;--border-strong:#B0B9C2;
  --text-primary:#1A2332;--text-secondary:#5F6B7A;--text-tertiary:#8A96A5;--text-inverse:#FFFFFF;
  --success:#10B981;--success-soft:#D1FAE5;
  --danger:#EF4444;--danger-soft:#FEE2E2;
  --warning:#F59E0B;--warning-soft:#FEF3C7;
  --info:#3B82F6;--info-soft:#DBEAFE;
  --sh-xs:0 1px 2px rgba(26,35,50,.06);
  --sh-sm:0 2px 4px rgba(26,35,50,.08);
  --sh-md:0 4px 12px rgba(26,35,50,.10);
  --sh-lg:0 8px 24px rgba(26,35,50,.12);
  --sh-xl:0 16px 48px rgba(26,35,50,.18);
  --r-sm:8px;--r-md:8px;--r-lg:8px;--r-xl:8px;--r-full:999px;
  --btn-size:42px;--header-h:64px;--botnav-h:64px;
  --fh:'Oswald','IBM Plex Sans Arabic',sans-serif;
  --fb:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0E131C;--surface:#1A2332;--surface-2:#243044;--surface-hover:#2E3D54;
  --border:#2E3D54;--border-strong:#3D4F6A;
  --text-primary:#F4F6F8;--text-secondary:#A0AAB8;--text-tertiary:#6C7A8A;
  --orange-soft:rgba(255,107,0,.15);
  --success-soft:rgba(16,185,129,.15);
  --danger-soft:rgba(239,68,68,.15);
  --warning-soft:rgba(245,158,11,.15);
  --info-soft:rgba(59,130,246,.15);
  --sh-xs:0 1px 2px rgba(0,0,0,.3);
  --sh-sm:0 2px 4px rgba(0,0,0,.4);
  --sh-md:0 4px 12px rgba(0,0,0,.5);
  --sh-lg:0 8px 24px rgba(0,0,0,.6);
  --sh-xl:0 16px 48px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font:14px/1.6 var(--fb);background:var(--bg);color:var(--text-primary);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:40px 40px;background-position:-1px -1px;
}
[data-theme=dark] body{
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--orange-500);outline-offset:2px}

header{
  position:fixed;inset:0 0 auto;z-index:30;padding-top:var(--st);
  background:var(--steel-900);border-bottom:3px solid var(--yellow-500);box-shadow:var(--sh-md);
}
.hin{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{
  width:38px;height:38px;background:var(--orange-500);color:#fff;
  display:grid;place-items:center;font-size:18px;flex:none;border-radius:var(--r-md);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);
}
.brand-text{min-width:0}
.brand b{
  display:block;font:700 19px/1.1 var(--fh);letter-spacing:.03em;
  text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand small{
  display:block;color:var(--text-tertiary);font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
}
.acts{display:flex;align-items:center;gap:6px;flex:none}
.ib{
  width:var(--btn-size);height:var(--btn-size);border-radius:var(--r-md);
  background:var(--steel-800);border:1px solid var(--steel-600);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--text-secondary);transition:.15s ease;
  position:relative;flex-shrink:0;padding:0;
}
.ib:hover{background:var(--steel-700);color:#fff;border-color:var(--steel-500)}
.ib:active{transform:scale(.95)}
.ib i{font-size:16px;line-height:1}
.ib.pri{background:var(--orange-500);border-color:var(--orange-600);color:#fff}
.ib.pri:hover{background:var(--orange-600)}
.ib.grn{background:#10B981;border-color:#0EA371;color:#fff}
.ib.grn:hover{background:#0EA371}

.pwa-bar{width:100%;display:none;gap:6px;margin-top:6px}
.pwa-bar.on{display:flex}
.pwa-bar .pwa-btn{
  flex:1;height:38px;border-radius:var(--r-md);background:var(--orange-500);
  color:#fff;font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;
}
.pwa-bar .pwa-close{
  width:38px;height:38px;border-radius:var(--r-md);background:var(--steel-800);
  color:var(--text-secondary);display:grid;place-items:center;
}

main{
  max-width:1000px;margin:0 auto;
  padding:calc(var(--header-h) + 16px + var(--st)) 12px calc(var(--botnav-h) + 20px + var(--sb));
}
.tab{display:none}
.tab.on{display:block;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}

h3.t{
  font:700 15px var(--fh);letter-spacing:.04em;margin:20px 0 12px;
  display:flex;align-items:center;gap:8px;padding-bottom:6px;
  border-bottom:2px solid var(--border);color:var(--text-primary);
}
h3.t::before{content:"";width:4px;height:16px;background:var(--orange-500);border-radius:2px}

.hero{
  padding:24px 20px;background:var(--surface);border-radius:var(--r-md);
  box-shadow:var(--sh-sm);border-inline-start:4px solid var(--orange-500);
  position:relative;overflow:hidden;
}
.hero::after{
  content:"\f013";font-family:"Font Awesome 6 Free";font-weight:900;
  position:absolute;inset-inline-end:-20px;bottom:-30px;font-size:140px;
  color:var(--surface-2);line-height:1;pointer-events:none;animation:spin 40s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h2{font-size:20px;font-weight:700;line-height:1.35;position:relative;z-index:1}
.hero p{margin-top:6px;color:var(--text-secondary);font-size:13px;max-width:460px;position:relative;z-index:1}

.g4{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);margin-top:10px}
@media(min-width:620px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:14px 12px;text-align:center;box-shadow:var(--sh-xs);transition:.15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
}
.sc:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--orange-500)}
.sc i{
  width:38px;height:38px;border-radius:var(--r-md);display:grid;place-items:center;
  background:var(--surface-2);color:var(--orange-500);font-size:16px;margin-bottom:4px;
}
.sc b{font:700 24px/1 var(--fh);color:var(--text-primary);font-variant-numeric:tabular-nums}
.sc span{color:var(--text-secondary);font-size:11.5px;font-weight:600}

.seg{display:flex;height:10px;gap:2px;border-radius:var(--r-full);overflow:hidden}
.seg i{display:block;min-width:3px}

.cols{display:grid;gap:10px;grid-template-columns:1fr;margin-top:6px}
@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.pn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;box-shadow:var(--sh-xs)}
.pn>b{
  font:600 12.5px var(--fh);letter-spacing:.04em;color:var(--text-secondary);
  display:block;margin-bottom:8px;text-transform:uppercase;
}
.sl{max-height:250px;overflow-y:auto}
.bar{
  position:relative;display:flex;justify-content:space-between;align-items:center;
  gap:8px;width:100%;min-height:38px;padding:0 12px;border-radius:var(--r-sm);
  overflow:hidden;margin-top:4px;background:var(--surface-2);font-size:12.5px;
  font-weight:600;color:var(--text-primary);transition:.15s;border-inline-start:3px solid transparent;
}
.bar:hover{background:var(--surface-hover);border-inline-start-color:var(--orange-500)}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--orange-soft)}
.bar span,.bar b{position:relative}
.bar b{
  font:700 11px var(--fh);background:var(--steel-900);color:#fff;
  padding:2px 8px;border-radius:var(--r-full);min-width:24px;text-align:center;
}
[data-theme=dark] .bar b{background:var(--orange-500)}

.sr{
  display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 14px;
  background:var(--surface);border:2px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--sh-xs);transition:.15s;
}
.sr:focus-within{border-color:var(--orange-500);box-shadow:0 0 0 3px var(--orange-soft)}
.sr>i{color:var(--text-tertiary);font-size:14px;flex:none}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:14px}
.sr input::placeholder{color:var(--text-tertiary)}
.sr .fbtn{
  width:36px;height:36px;border-radius:var(--r-md);background:var(--surface-2);
  color:var(--text-secondary);display:grid;place-items:center;flex:none;position:relative;transition:.15s;
}
.sr .fbtn:hover,.sr .fbtn.has-filters{background:var(--orange-500);color:#fff}
.sr .fbtn .bub{
  position:absolute;top:-4px;inset-inline-end:-4px;min-width:16px;height:16px;padding:0 4px;
  border-radius:var(--r-full);background:var(--yellow-500);color:var(--steel-900);
  font-size:9px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface);
}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;
  border-radius:var(--r-full);background:var(--orange-soft);color:var(--orange-600);
  font-weight:600;font-size:11.5px;
}
[data-theme=dark] .chip{color:var(--orange-400)}
.chip button{width:20px;height:20px;border-radius:50%;color:inherit;font-size:9px;display:grid;place-items:center}
.chip button:hover{background:rgba(0,0,0,.1)}
.inf{color:var(--text-secondary);font-size:12px;margin:10px 4px 8px;font-weight:500}

.ls{display:grid;gap:8px}
@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}
.card{
  display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-xs);
  cursor:pointer;transition:.15s;min-width:0;border-inline-start:3px solid transparent;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--border-strong);border-inline-start-color:var(--orange-500)}
.av{
  width:44px;height:44px;border-radius:var(--r-md);color:#fff;
  display:grid;place-items:center;font:700 15px var(--fh);flex:none;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);
}
.cm{flex:1;min-width:0}
.cm b{
  display:flex;align-items:center;gap:5px;font-size:14.5px;font-weight:700;
  color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cm small{
  display:block;color:var(--text-secondary);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tg{
  font-size:10.5px;padding:2px 8px;border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--text-secondary);font-weight:600;border:1px solid transparent;
}
.tg.a{background:var(--steel-900);color:#fff}
.tg.v{background:var(--success-soft);color:var(--success)}
.vb{color:var(--orange-500)}
.ca{display:flex;flex-direction:column;gap:2px;flex:none}
.ca button{
  width:32px;height:32px;border-radius:var(--r-md);color:var(--text-tertiary);
  font-size:13px;display:grid;place-items:center;transition:.15s;
}
.ca button:hover{background:var(--surface-hover);color:var(--text-primary)}
.ca .fv.on{color:var(--yellow-500)}

.em{
  text-align:center;padding:40px 16px;border:2px dashed var(--border-strong);
  border-radius:var(--r-md);color:var(--text-secondary);background:var(--surface);
}
.em i{font-size:28px;display:block;margin-bottom:10px;color:var(--text-tertiary)}
.em b{display:block;color:var(--text-primary);margin-bottom:4px;font-size:13.5px}
.em small{display:block;font-size:12px;margin-top:4px}

.cr{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:10px 0;font-size:12.5px}
.cr button{
  padding:6px 14px;border-radius:var(--r-md);background:var(--surface);
  border:1px solid var(--border);font-weight:600;color:var(--text-secondary);transition:.15s;
}
.cr button:hover{background:var(--surface-hover);color:var(--text-primary)}
.cr button:last-child{background:var(--orange-soft);color:var(--orange-600);border-color:var(--orange-500)}
.cr i{font-size:9px;color:var(--text-tertiary)}

.rw{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:6px;
  border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);
  text-align:start;font-weight:600;color:var(--text-primary);transition:.15s;box-shadow:var(--sh-xs);
}
.rw:hover{transform:translateY(-1px);box-shadow:var(--sh-sm);border-color:var(--border-strong)}
.rw>i:first-child{
  width:36px;height:36px;border-radius:var(--r-md);background:var(--surface-2);
  color:var(--orange-500);display:grid;place-items:center;font-size:14px;flex:none;
}
.rw span{flex:1;font-size:13.5px}
.rw em{
  font:700 11px var(--fh);font-style:normal;background:var(--steel-900);color:#fff;
  padding:2px 8px;border-radius:var(--r-full);min-width:24px;text-align:center;
}
.rw>i:last-child{font-size:10px;color:var(--text-tertiary)}

.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 20px;border-radius:var(--r-md);
  font-weight:600;background:var(--orange-500);color:#fff;transition:.15s;
  border:1px solid transparent;min-width:0;font-family:var(--fh);letter-spacing:.02em;font-size:14px;
}
.bt:hover{background:var(--orange-600)}
.bt:active{transform:scale(.98)}
.bt:disabled{opacity:.5;cursor:not-allowed}
.bt.g{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border);font-family:var(--fb)}
.bt.g:hover{background:var(--surface-hover)}
.bt.d{background:var(--danger);font-family:var(--fb)}
.bt.w{background:#25D366;font-family:var(--fb)}
.bt.k{background:var(--steel-900);color:#fff;font-family:var(--fb)}
.bt.full{width:100%}
.bt i{font-size:14px}

#md{
  position:fixed;inset:0;z-index:60;background:rgba(26,35,50,.6);
  backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;
  padding:16px;overflow-y:auto;
}
#md.on{display:flex}
.sheet{
  width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;
  background:var(--surface);padding:24px 20px;border-radius:var(--r-lg);
  box-shadow:var(--sh-xl);animation:up .22s cubic-bezier(.2,.9,.3,1);
  position:relative;margin:auto;
}
@keyframes up{from{transform:translateY(20px) scale(.96);opacity:0}}
.sheet h2{font:700 20px var(--fh);letter-spacing:.02em;margin:6px 0 6px;color:var(--text-primary)}
.lead{color:var(--text-secondary);font-size:12.5px;margin-bottom:18px;line-height:1.5}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.ac .full{grid-column:1/-1}

.confirm-sheet{max-width:420px}
.confirm-sheet .confirm-icon{
  width:56px;height:56px;border-radius:var(--r-md);display:grid;place-items:center;
  margin-bottom:14px;font-size:24px;background:var(--orange-soft);color:var(--orange-500);
}
.confirm-sheet .confirm-icon.danger{background:var(--danger-soft);color:var(--danger)}
.confirm-sheet .confirm-icon.success{background:var(--success-soft);color:var(--success)}
.confirm-sheet .confirm-icon.warning{background:var(--warning-soft);color:var(--warning)}
.confirm-sheet h2{margin-bottom:6px}
.confirm-sheet p{color:var(--text-secondary);font-size:13px;line-height:1.6;margin-bottom:6px}
.confirm-sheet .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}

.choice-list{display:grid;gap:10px;margin-top:12px}
.choice-item{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--border);text-align:start;
  transition:.15s;color:var(--text-primary);
}
.choice-item:hover{background:var(--surface-hover);border-color:var(--orange-500);transform:translateY(-1px)}
.choice-item .chi{
  width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center;
  font-size:18px;flex:none;
}
.choice-item.form .chi{background:var(--orange-soft);color:var(--orange-500)}
.choice-item.sheet .chi{background:var(--success-soft);color:var(--success)}
.choice-item .cht{flex:1;min-width:0}
.choice-item .cht b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.choice-item .cht small{display:block;font-size:11.5px;color:var(--text-secondary)}
.choice-item .chev{color:var(--text-tertiary);font-size:11px}

.fmodal-h{margin-bottom:16px}
.fmodal-h h2{font-size:18px;margin-bottom:2px;font-weight:700;font-family:var(--fh);letter-spacing:.02em;padding:0;border:0}
.fmodal-h .sub{font-size:12px;color:var(--text-secondary)}
.fsect{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;
  border-radius:var(--r-md);text-align:start;background:var(--surface);
  border:1px solid var(--border);margin-bottom:6px;transition:.15s;
}
.fsect:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.fsect.on{background:var(--orange-soft);border-color:var(--orange-500)}
.fsect .ic{
  width:36px;height:36px;border-radius:var(--r-md);background:var(--surface-2);
  color:var(--text-secondary);display:grid;place-items:center;flex:none;font-size:14px;
}
.fsect.on .ic{background:var(--orange-500);color:#fff}
.fsect .name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary);font-size:13.5px}
.fsect.on .name{color:var(--orange-600)}
.fsect .val{font-size:11.5px;color:var(--orange-600);font-weight:700;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsect .num{
  font-size:11.5px;color:var(--text-secondary);min-width:26px;text-align:center;
  font-weight:700;background:var(--surface-2);padding:3px 9px;border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;
}
.fsect.on .num{background:var(--orange-500);color:#fff}
.fsect .chev{color:var(--text-tertiary);font-size:11px}
.fback{
  display:flex;align-items:center;gap:6px;color:var(--orange-600);
  font-weight:600;font-size:13px;margin-bottom:14px;padding:6px 10px;
  border-radius:var(--r-md);transition:.15s;width:fit-content;
}

// PWA MANIFEST

(function(){
  const svgIcon=(size)=>`data:image/svg+xml;charset=utf-8,${encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}">
      <rect width="512" height="512" fill="#1A2332" rx="80"/>
      <rect x="24" y="24" width="464" height="464" fill="none" stroke="#FFC20E" stroke-width="16" rx="56"/>
      <rect x="96" y="176" width="320" height="200" rx="16" fill="#FF6B00"/>
      <rect x="176" y="136" width="160" height="60" rx="8" fill="none" stroke="#FFFFFF" stroke-width="20"/>
      <rect x="216" y="240" width="80" height="60" rx="8" fill="#1A2332"/>
      <rect x="96" y="360" width="320" height="16" fill="#FFC20E"/>
    </svg>`
  )}`;
  const manifest={
    name:"Connect Pro — منصة التواصل الصناعي",
    short_name:"Connect Pro",
    description:"دليل الشركات والخبراء الصناعيين في المغرب",
    start_url:location.pathname,
    scope:location.pathname.replace(/[^/]*$/,''),
    display:"standalone",orientation:"portrait",
    background_color:"#1A2332",theme_color:"#1A2332",dir:"rtl",lang:"ar",
    icons:[
      {src:svgIcon(192),sizes:"192x192",type:"image/svg+xml",purpose:"any maskable"},
      {src:svgIcon(512),sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}
    ]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('link');
  link.rel='manifest';link.href=url;document.head.appendChild(link);
  const apple=document.createElement('link');
  apple.rel='apple-touch-icon';apple.href=svgIcon(192);document.head.appendChild(apple);
  const fav=document.createElement('link');
  fav.rel='icon';fav.type='image/svg+xml';fav.href=svgIcon(32);document.head.appendChild(fav);
})();

// ============================================================
// SERVICE WORKER
// ============================================================
(function(){
  if(!('serviceWorker' in navigator))return;
  const swCode=`
    const CACHE='connectpro-v10';
    const ASSETS=[location.pathname,
      'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap',
      'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css'];
    self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS).catch(()=>{})))});
    self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
    self.addEventListener('fetch',e=>{
      const req=e.request;
      if(req.method!=='GET')return;
      const isDoc=req.mode==='navigate'||(req.headers.get('accept')||'').includes('text/html');
      if(isDoc){
        e.respondWith(fetch(req).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(req,copy)).catch(()=>{});return res}).catch(()=>caches.match(req).then(r=>r||caches.match(location.pathname))));
      }else{
        e.respondWith(caches.match(req).then(r=>r||fetch(req).then(res=>{if(res.status===200){const copy=res.clone();caches.open(CACHE).then(c=>c.put(req,copy)).catch(()=>{})}return res})));
      }
    });
  `;
  const blob=new Blob([swCode],{type:'text/javascript'});
  const url=URL.createObjectURL(blob);
  navigator.serviceWorker.register(url,{scope:'./'}).catch(err=>console.warn('SW register failed',err));
  function setOffline(off){document.getElementById('offline-badge').classList.toggle('on',off)}
  window.addEventListener('online',()=>setOffline(false));
  window.addEventListener('offline',()=>setOffline(true));
  if(!navigator.onLine)setOffline(true);
})();
</script>

// CSV PARSER
// ============================================================
function splitCSV(l){
  const o=[];let c='',q=false;
  for(let i=0;i<l.length;i++){
    const h=l[i];
    if(h==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}
    else if(h===','&&!q){o.push(c);c=''}
    else c+=h;
  }
  o.push(c);return o;
}
const parseCSV=(txt,type,cat)=>{
  const cl=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');
  return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c=>cl(c[1])).map(c=>{
    const name=cl(c[1]);
    const phone=fmtPhone(cl(c[5]));
    const email=cl(c[6]).toLowerCase().trim();
    const seed=type+'|'+(email||norm(name)+'|'+phone);
    let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
    return {
      id:'p'+h.toString(36),
      name,
      domaine:cl(c[2])||'Autre',
      specialite:cl(c[3])||'Général',
      ville:cl(c[4]),
      phone,email,
      web:cl(c[7]),
      type,categorie:cat
    };
  });
};
async function fetchFromCSV(){
  const g=async(u)=>{
    const r=await fetch(u+'&cachebust='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.text();
  };
  const [expTxt,fourTxt]=await Promise.all([g(CSV_EXPERTS),g(CSV_FOURNISSEURS)]);
  const experts=parseCSV(expTxt,'experts','yad-amila');
  const fournisseurs=parseCSV(fourTxt,'fournisseurs','services');
  const map=new Map();
  [...fournisseurs,...experts].forEach(r=>{if(!map.has(r.id))map.set(r.id,r)});
  return [...map.values()];
}
async function loadDB(){
  try{
    const data=await fetchFromCSV();
    if(data&&data.length){
      S.db=data;
      S.dbIndex=new Map(S.db.map(r=>[r.id,r]));
      S.dataSource='csv';
      try{localStorage.setItem('cp-csv-cache',JSON.stringify({t:Date.now(),d:S.db}))}catch{}
      clearFacetCache();
      return;
    }
  }catch(e){console.warn('CSV fetch failed',e)}
  try{
    const cached=JSON.parse(localStorage.getItem('cp-csv-cache')||'null');
    if(cached&&cached.d&&cached.d.length){
      S.db=cached.d;
      S.dbIndex=new Map(S.db.map(r=>[r.id,r]));
      S.dataSource='cache';
    }
  }catch{}
  clearFacetCache();
}

// ============================================================
// VISITOR TRACKING → Firebase
// ============================================================
function deviceType(){
  const ua=navigator.userAgent;
  if(/iPad|Tablet|PlayBook|Silk/i.test(ua))return 'tablet';
  if(/Mobile|Android|iPhone|iPod|Opera Mini|IEMobile/i.test(ua))return 'mobile';
  return 'desktop';
}
function detectOS(){
  const ua=navigator.userAgent;
  if(/Windows NT 10/.test(ua))return 'Windows 10/11';
  if(/Windows NT/.test(ua))return 'Windows';
  if(/Mac OS X/.test(ua))return 'macOS';
  if(/Android/.test(ua))return 'Android';
  if(/iPhone|iPad|iPod/.test(ua))return 'iOS';
  if(/Linux/.test(ua))return 'Linux';
  return 'Unknown';
}
function detectBrowser(){
  const ua=navigator.userAgent;
  if(/Edg\//.test(ua))return 'Edge';
  if(/OPR\//.test(ua)||/Opera/.test(ua))return 'Opera';
  if(/Chrome\//.test(ua)&&!/Chromium/.test(ua))return 'Chrome';
  if(/Firefox\//.test(ua))return 'Firefox';
  if(/Safari\//.test(ua)&&!/Chrome/.test(ua))return 'Safari';
  return 'Unknown';
}
async function getGeo(){
  return new Promise(resolve=>{
    if(!navigator.geolocation)return resolve(null);
    const to=setTimeout(()=>resolve(null),8000);
    navigator.geolocation.getCurrentPosition(
      p=>{clearTimeout(to);resolve({lat:+p.coords.latitude.toFixed(4),lng:+p.coords.longitude.toFixed(4),acc:p.coords.accuracy})},
      ()=>{clearTimeout(to);resolve(null)},
      {enableHighAccuracy:false,timeout:7000,maximumAge:600000}
    );
  });
}
async function reverseGeo(lat,lng){
  try{
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=ar`);
    if(!r.ok)return null;
    const j=await r.json();
    return {
      country:j.countryName||'',
      city:j.city||j.locality||j.principalSubdivision||'',
      region:j.principalSubdivision||''
    };
  }catch{return null}
}
async function trackVisitor(){
  if(!S.fb)return;
  // مرة واحدة لكل جلسة
  if(sessionStorage.getItem('cp-tracked')==='1')return;
  sessionStorage.setItem('cp-tracked','1');

  const ua=navigator.userAgent;
  const ref=document.referrer||'direct';
  const payload={
    t:Date.now(),
    ua,
    deviceType:deviceType(),
    os:detectOS(),
    browser:detectBrowser(),
    lang:navigator.language||'',
    langs:(navigator.languages||[]).join(','),
    timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'',
    screen:`${screen.width}x${screen.height}`,
    viewport:`${innerWidth}x${innerHeight}`,
    dpr:window.devicePixelRatio||1,
    platform:navigator.platform||'',
    cores:navigator.hardwareConcurrency||null,
    mem:navigator.deviceMemory||null,
    touch:'ontouchstart' in window,
    referrer:ref,
    path:location.pathname,
    hash:location.hash||'',
    online:navigator.onLine
  };

  // الموقع الجغرافي (اختياري — بعد إذن المستخدم)
  try{
    const geo=await getGeo();
    if(geo){
      payload.lat=geo.lat;
      payload.lng=geo.lng;
      payload.acc=Math.round(geo.acc);
      const rev=await reverseGeo(geo.lat,geo.lng);
      if(rev){
        payload.country=rev.country;
        payload.city=rev.city;
        payload.region=rev.region;
      }
    }
  }catch{}

  // البريد الإلكتروني المحفوظ مسبقاً (إن وجد)
  try{
    const savedEmail=localStorage.getItem('cp-visitor-email');
    if(savedEmail&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(savedEmail))payload.email=savedEmail;
  }catch{}

  try{
    await S.fb.ref('visitors').push(payload);
  }catch(e){console.warn('tracking failed',e)}
}
function askEmailOnce(){
  if(!S.fb)return;
  if(localStorage.getItem('cp-visitor-email'))return;
  if(localStorage.getItem('cp-email-asked')==='1')return;
  setTimeout(()=>{
    if($('#md').classList.contains('on'))return; // لا تقاطع مودال مفتوح

      <label class="fl"><span>البريد الإلكتروني</span>
        <input id="vemail" type="email" dir="ltr" autocomplete="email" placeholder="you@example.com">

function match(r,skip){
  for(const k in FLD){
    if(k===skip)continue;
    const a=S.f[k];
    if(a.length&&!a.some(v=>norm(r[FLD[k]])===norm(v)))return false;
  }
  if(S.q)return hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.q);
  return true;
}
const results=()=>S.db.filter(r=>match(r)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0)+(S.q?1:0);
const clearF=()=>{S.f={type:[],cat:[],dom:[],spe:[],ville:[]};S.q='';S.lim=40;clearFacetCache()};

const facetKey=k=>k+':'+S.f.type.length+','+S.f.cat.length+','+S.f.dom.length+','+S.f.spe.length+','+S.f.ville.length+','+S.q;
function facet(k,sortBy='count'){
  const m=new Map();
  S.db.filter(r=>match(r,k)).forEach(r=>{
    const v=(r[FLD[k]]||'').trim();
    if(v)m.set(v,(m.get(v)||0)+1);
  });
  const arr=[...m];
  if(sortBy==='count')return arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
  return arr.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
}
function getFacet(k,sortBy='count'){
  const key=facetKey(k)+':'+sortBy;
  if(S.facetCache[key])return S.facetCache[key];
  const v=facet(k,sortBy);
  S.facetCache[key]=v;
  return v;
}
function getFacets(){
  if(S.facets)return S.facets;
  const f={};SECTIONS.forEach(s=>{f[s.k]=getFacet(s.k)});
  S.facets=f;return f;
}
const clearFacetCache=()=>{S.facetCache={};S.facets=null};

  const base=S.db.filter(r=>!t||r.type===t).filter(matchExp);
  const grp=(l,k)=>{const m=new Map();l.forEach(r=>{const v=r[k]||'—';m.set(v,(m.get(v)||0)+1)});return[...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'))};
  const row=(i,n,c,a,v)=>`<button class="rw" data-a="${a}" data-v="${esc(v)}"><i class="fa-solid ${i}"></i><span>${esc(n)}</span><em>${c}</em><i class="fa-solid fa-chevron-left"></i></button>`;
  if(S.exp.q)return base.length?'<div class="ls">'+base.map(card).join('')+'</div>':empty('لا نتائج');
  if(!t)return['fournisseurs','experts'].map(x=>row(x==='experts'?'fa-user-tie':'fa-truck-field',TL[x]+'ون',S.db.filter(r=>r.type===x).length,'xt',x)).join('');
  if(!d)return grp(base,'domaine').map(g=>row(domIcon(g[0]),g[0],g[1],'xd',g[0])).join('');
  if(!s)return grp(base.filter(r=>r.domaine===d),'specialite').map(g=>row('fa-screwdriver-wrench',g[0],g[1],'xs',g[0])).join('');
  return'<div class="ls">'+base.filter(r=>r.domaine===d&&r.specialite===s).map(card).join('')+'</div>';
}

// ============================================================
// FAVORITES
// ============================================================
function favorites(){
  const f=S.fav.map(byId).filter(Boolean);
  $('#t-fav').innerHTML=`<h3 class="t" style="margin-top:0">المفضلة (${f.length})</h3>${f.length?`<div class="ls">${f.map(card).join('')}</div><button class="bt g" data-a="favclr" style="margin-top:10px;width:100%"><i class="fa-solid fa-trash"></i> مسح الكل</button>`:empty('لا مفضلات بعد','اضغط النجمة على أي شركة','fa-star')}`;
}

// ============================================================
// NAV
// ============================================================
function go(t){
  if(S.tab==='dir'&&t!=='dir')clearF();
  if(S.tab==='exp'&&t!=='exp')S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};
  S.tab=t;
  $$('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+t));
  ({home,dir:dirShell,exp:explorer,fav:favorites})[t]();
  $$('.bi').forEach(e=>e.classList.toggle('on',e.dataset.v===t));
  topbar();favBadge();scrollTo(0,0);
}
const rerender=()=>go(S.tab);
function favBadge(){const b=$('#fb');if(!b)return;b.hidden=!S.fav.length;b.textContent=S.fav.length>99?'99+':S.fav.length}

// ============================================================
// PROFILE
// ============================================================
function profile(id){
  const r=byId(id);if(!r)return toast('الملف غير موجود');
  const p=fmtPhone(r.phone),w=url(r.web);
  const rows=[];
  if(shown(r.domaine))rows.push(['fa-industry','القطاع',esc(r.domaine)]);
  if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',esc(r.specialite)]);
  if(r.ville)rows.push(['fa-location-dot','المدينة',esc(r.ville)]);
  if(p)rows.push(['fa-phone','الهاتف',`<span dir="ltr">${esc(p)}</span>`,'tel:'+esc(p)]);
  if(r.email)rows.push(['fa-envelope','البريد',`<span dir="ltr">${esc(r.email)}</span>`,'mailto:'+esc(r.email)]);
  if(w)rows.push(['fa-globe','الموقع',`<span dir="ltr">${esc(r.web)}</span>`,esc(w),1]);
  openM(`<div class="ph"><div class="pl"><i class="fa-solid ${domIcon(r.domaine)}"></i></div>
    <div class="pn2">${esc(r.name)} ${r.verified?'<i class="fa-solid fa-circle-check" style="color:var(--yellow-500)"></i>':''}</div>
    <div class="ps">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div>
    <div class="tags" style="margin-top:10px"><span class="tg">${TL[r.type]}</span><span class="tg">${CL[r.categorie]}</span>${r.verified?'<span class="tg">موثّق</span>':''}</div></div>
    <div class="pa">
      ${p?`<a class="ib wa" href="https://wa.me/${esc(p.replace(/\D/g,''))}" target="_blank" rel="noopener" title="واتساب"><i class="fa-brands fa-whatsapp"></i></a>`:''}
      <button class="ib" data-a="shr" data-v="${esc(r.id)}" title="مشاركة"><i class="fa-solid fa-share-nodes"></i></button>
      <button class="ib" data-a="cls" title="إغلاق"><i class="fa-solid fa-xmark"></i></button></div>
    ${rows.map(([i,k,v,h,ext])=>`<div class="vr">${h?`<a href="${h}"${ext?' target="_blank" rel="noopener"':''}><i class="fa-solid ${i}"></i></a>`:`<i class="fa-solid ${i}"></i>`}<div><small>${k}</small><b>${v}</b></div></div>`).join('')}`);
}

// ============================================================
// SHARE / FAV
// ============================================================
async function share(id){
  const r=byId(id);if(!r)return;
  const text=[`🏢 ${r.name}`,`🏷️ ${TL[r.type]} · ${CL[r.categorie]}`,shown(r.domaine)&&`🏭 ${r.domaine}`,r.ville&&`📍 ${r.ville}`,fmtPhone(r.phone)&&`📞 ${fmtPhone(r.phone)}`,r.email&&`✉️ ${r.email}`,url(r.web)&&`🌐 ${url(r.web)}`,`🔗 ${baseUrl()}#p=${r.id}`].filter(Boolean).join('\n');
  if(navigator.share){try{await navigator.share({title:r.name,text});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);toast('تم النسخ')}catch{toast('تعذر النسخ')}
  setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener'),0);
}
function toggleFav(id){
  const i=S.fav.indexOf(id);i>=0?S.fav.splice(i,1):S.fav.push(id);
  try{localStorage.setItem('cp-fav',JSON.stringify(S.fav))}catch{}
  toast(i>=0?'أُزيلت':'أُضيفت');
  favBadge();
  if(!$('#md').classList.contains('on'))rerender();else profile(id);
}

// ============================================================
// ACTIONS
// ============================================================
const A={
  theme(){
    const d=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=d;
    try{localStorage.setItem('cp-theme',d)}catch{}
    topbar();toast(d==='dark'?'الوضع الداكن':'الوضع الفاتح');
  },
  refresh(){
    busy(true);
    loadDB().then(()=>{
      S.lastSync=Date.now();
      rerender();busy(false);toast('تم التحديث من CSV');
    }).catch(()=>{busy(false);toast('تعذر التحديث')});
  },
  openForms(){
    openM(`<h2>نماذج الإدخال</h2>
      <p class="lead">اختر نوع التسجيل — سيُفتح نموذج Google</p>
      <div class="choice-list">
        <a class="choice-item form" href="${FORM_EXPERTS}" target="_blank" rel="noopener">
          <span class="chi"><i class="fa-solid fa-user-tie"></i></span>
          <span class="cht"><b>تسجيل خبير</b><small>أدخل بياناتك كخبير</small></span>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
        <a class="choice-item form" href="${FORM_FOURNISSEURS}" target="_blank" rel="noopener">
          <span class="chi"><i class="fa-solid fa-truck-field"></i></span>
          <span class="cht"><b>تسجيل مورّد</b><small>أدخل بياناتك كمورّد</small></span>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
      </div>
      <div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
  },
  openSheets(){
    openM(`<h2>فتح الأوراق</h2>
      <p class="lead">اختر الورقة لعرضها في Google Sheets</p>
      <div class="choice-list">
        <a class="choice-item sheet" href="${SHEET_EXPERTS}" target="_blank" rel="noopener">
          <span class="chi"><i class="fa-solid fa-table"></i></span>
          <span class="cht"><b>ورقة الخبراء</b><small>عرض جدول الخبراء</small></span>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
        <a class="choice-item sheet" href="${SHEET_FOURNISSEURS}" target="_blank" rel="noopener">
          <span class="chi"><i class="fa-solid fa-table"></i></span>
          <span class="cht"><b>ورقة الموردين</b><small>عرض جدول الموردين</small></span>
          <i class="fa-solid fa-chevron-left chev"></i>
        </a>
      </div>
      <div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
  },
  confirmAccept,confirmCancel,
  saveEmail:saveVisitorEmail,
  skipEmail(){closeM();toast('حسناً')},
  tab(v){
    if(S.tab===v){
      if(v==='dir'){clearF();dirShell()}
      else if(v==='exp'){S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};explorer()}
      else scrollTo({top:0,behavior:'smooth'});
    }else go(v);
  },
  cls:closeM,open(id){profile(id)},shr:share,fav:toggleFav,
  undo(){if(undoFn){undoFn();undoFn=null;$('#ts').classList.remove('on')}},
  stat(v){
    if(v==='f'){openFilter();return}
    const i=v.indexOf(':');
    clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];go('dir');
  },
  bar(v,el){clearF();S.f[el.dataset.k]=[v];go('dir')},
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=40;clearFacetCache();dirList()},
  qx(){S.q='';$('#q').value='';S.lim=40;clearFacetCache();dirList()},
  more(){S.lim+=40;dirList()},
  fmodal:()=>openFilter(),
  fsect(v){S.filterPanel.mode='pick';S.filterPanel.key=v;renderFilter()},
  fback(){S.filterPanel.mode='sections';S.filterPanel.key=null;renderFilter()},
  fsort(v){S.sortF[S.filterPanel.key]=v;renderFilter()},
  fclearsec(){S.f[S.filterPanel.key]=[];S.lim=40;clearFacetCache();renderFilter();if(S.tab==='dir')dirList()},
  fpick(v){
    const k=S.filterPanel.key,arr=S.f[k];
    const i=arr.findIndex(x=>norm(x)===norm(v));
    if(i>=0)arr.splice(i,1);else arr.push(v);
    S.lim=40;clearFacetCache();renderFilter();if(S.tab==='dir')dirList();
  },
  fclr(){clearF();renderFilter();if(S.tab==='dir'){$('#q')&&($('#q').value='');dirList()}},
  fdone(){closeM();if(S.tab!=='dir'){S.tab='';go('dir')}else{dirList()}},
  xt:v=>{S.exp={t:v,d:'',s:'',q:'',sort:S.exp.sort};explorer()},
  xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';explorer()},
  xs:v=>{S.exp.s=v;S.exp.q='';explorer()},
  qxexp(){S.exp.q='';explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:'',sort:x.sort}:v==='t'?{t:x.t,d:'',s:'',q:'',sort:x.sort}:v==='d'?{t:x.t,d:x.d,s:'',q:'',sort:x.sort}:x;explorer()},
  favclr(){
    askConfirm({
      title:'مسح المفضلة',message:'إزالة كل الشركات من المفضلة؟',
      icon:'fa-star',tone:'warning',confirmLabel:'مسح الكل',
      onConfirm:()=>{S.fav=[];try{localStorage.removeItem('cp-fav')}catch{};favorites();favBadge()}
    });
  },
  installPWA(){
    if(!S.installEvent)return toast('التثبيت غير متاح');
    S.installEvent.prompt();
    S.installEvent.userChoice.then(({outcome})=>{
      if(outcome==='accepted'){S.installEvent=null;$('#pwaBar').classList.remove('on');toast('جاري التثبيت...')}
    });
  },
  closePWA(){
    S.pwaDismissed=true;
    try{localStorage.setItem('cp-pwa-dismissed','1')}catch{}
    $('#pwaBar').classList.remove('on');
  }
};

// ============================================================
// EVENTS
// ============================================================
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}
  else if(e.target.id==='md')closeM();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeM();
  if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v);
});
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  S.installEvent=e;
  if(!S.pwaDismissed)$('#pwaBar').classList.add('on');
});
window.addEventListener('appinstalled',()=>{
  S.installEvent=null;$('#pwaBar').classList.remove('on');toast('تم تثبيت التطبيق');
});

// ============================================================
// BOOT
// ============================================================
(async()=>{
  try{
    if(window.firebase){
      firebase.initializeApp(FBC);
      S.fb=firebase.database();
    }
  }catch(e){console.warn('Firebase init failed',e)}

  await loadDB();
  S.lastSync=Date.now();
  go('home');
  busy(false);

  // تسجيل بيانات الزائر (بدون انتظار)
  trackVisitor().catch(e=>console.warn('track',e));
  askEmailOnce();

  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(m[1]);r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
</script>
</body>
</html>
