<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Pro — منصة التواصل المهني B2B</title>
<meta name="theme-color" content="#14181D">
<meta name="description" content="دليل الشركات والخبراء الصناعيين في المغرب">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Connect Pro">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --ink:#14181D;--ink2:#3A434E;--mute:#6C7782;--line:#C9CFD6;--bg:#DADDE1;--sf:#fff;--sf2:#EEF0F2;
  --steel:#14181D;--steel2:#1F252C;--or:#FF6B00;--or2:#FFC20E;--orsoft:rgba(255,107,0,.12);
  --teal:#0B7A75;--red:#D32F2F;--green:#2E9E4F;
  --sh:0 3px 0 rgba(20,24,29,.16);--hd:#14181D;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --fh:'Oswald','IBM Plex Sans Arabic',sans-serif;
  --hz:repeating-linear-gradient(-45deg,#FFC20E 0 10px,#14181D 10px 20px);
  color-scheme:light;
}
[data-theme=dark]{
  --ink:#EEF1F4;--ink2:#B9C2CC;--mute:#8793A0;--line:#2D363F;--bg:#0E1114;--sf:#171B20;--sf2:#1F252C;
  --orsoft:rgba(255,107,0,.16);--sh:0 3px 0 rgba(0,0,0,.5);--hd:#0A0C0F;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font:14px/1.55 'IBM Plex Sans Arabic',system-ui,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:
    linear-gradient(rgba(20,24,29,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(20,24,29,.05) 1px,transparent 1px);
  background-size:32px 32px;
}
[data-theme=dark] body{
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--or2);outline-offset:2px}

/* ============ HEADER ============ */
header{
  position:fixed;inset:0 0 auto;z-index:30;
  padding-top:var(--st);background:var(--hd);color:#fff;
}
header::after{content:"";position:absolute;inset:auto 0 0;height:6px;background:var(--hz)}
.hin{
  max-width:1000px;margin:0 auto;min-height:64px;
  display:flex;align-items:center;gap:8px;
  padding:6px 14px 12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;order:1}
.logo{
  width:42px;height:42px;background:var(--or2);color:var(--steel);
  display:grid;place-items:center;font-size:19px;flex:none;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
}
.brand b{display:block;font:700 19px/1.1 var(--fh);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;color:rgba(255,255,255,.55);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:5px;flex:none;order:2}
.ib{
  height:40px;min-width:40px;padding:0 10px;border-radius:4px;
  background:var(--sf);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-weight:600;font-size:12px;transition:.15s;color:var(--ink2);
  box-shadow:var(--sh);position:relative;
}
.ib:hover{border-color:var(--or);color:var(--or)}
.ib:active{transform:translateY(2px);box-shadow:none}
header .ib{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:#fff;box-shadow:none}
header .ib:hover{background:var(--or2);color:var(--steel);border-color:var(--or2)}
.ib.pri,header .ib.pri{background:var(--or);border-color:var(--or);color:#fff}
header .ib.pri:hover{background:var(--or2);color:var(--steel)}
.ib.on{background:var(--steel);color:var(--or2);border-color:var(--steel)}
.ib.out:hover,header .ib.out:hover{background:var(--red);border-color:var(--red);color:#fff}
.ib .t{display:none}
@media(min-width:720px){.ib .t{display:inline}}
.ava{width:24px;height:24px;border-radius:3px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}

/* ============ GLOBAL SEARCH (header) ============ */
.gsearch{
  order:3;width:100%;
  display:none;
}
.gsearch.on{display:block}
.gsearch-wrap{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.18);
  border-radius:4px;height:42px;padding:0 12px;
  transition:.15s;
}
.gsearch-wrap:focus-within{
  background:rgba(255,255,255,.1);
  border-color:var(--or2);
  box-shadow:0 0 0 3px rgba(255,194,14,.15);
}
.gsearch-wrap>i{color:var(--or2);font-size:14px;flex:none}
.gsearch-wrap input{
  flex:1;min-width:0;height:100%;border:0;background:none;outline:0;
  color:#fff;font-size:13.5px;
}
.gsearch-wrap input::placeholder{color:rgba(255,255,255,.45)}
.gsearch-wrap .kbd{
  display:none;flex:none;
  padding:2px 6px;border-radius:3px;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);
  font-size:10px;font-weight:700;font-family:monospace;
}
@media(min-width:720px){.gsearch-wrap .kbd{display:inline-block}}
.gsearch-wrap .clr{
  width:28px;height:28px;border-radius:3px;flex:none;
  display:grid;place-items:center;color:rgba(255,255,255,.5);
}
.gsearch-wrap .clr:hover{background:rgba(255,255,255,.1);color:#fff}

/* PWA install banner */
.pwa-bar{
  order:4;width:100%;
  display:none;
}
.pwa-bar.on{display:flex;gap:8px}
.pwa-bar .pwa-btn{
  flex:1;height:38px;border-radius:3px;
  background:var(--or);color:#fff;font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);
}
.pwa-bar .pwa-btn:hover{background:#E85F00}
.pwa-bar .pwa-close{
  width:38px;height:38px;border-radius:3px;
  background:rgba(255,255,255,.08);color:#fff;
  display:grid;place-items:center;font-size:12px;
}

/* ============ MAIN ============ */
main{
  max-width:1000px;margin:0 auto;
  padding:calc(104px + var(--st)) 14px calc(110px + var(--sb));
  transition:padding-top .2s;
}
main.has-gsearch{padding-top:calc(154px + var(--st))}
.tab{display:none}.tab.on{display:block;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}}

h3.t{
  font:700 15px var(--fh);letter-spacing:.05em;
  margin:26px 0 12px;display:flex;align-items:center;gap:10px;
  padding-bottom:8px;border-bottom:2px solid var(--line);
}
h3.t::before{content:"";width:8px;height:18px;background:var(--or);transform:skewX(-14deg)}

/* ============ HERO ============ */
.hero{
  padding:30px 24px;
  background:var(--steel) repeating-linear-gradient(-45deg,transparent 0 18px,rgba(255,255,255,.025) 18px 20px);
  color:#fff;position:relative;overflow:hidden;
  border-radius:6px;box-shadow:var(--sh);
  border-top:8px solid transparent;border-image:var(--hz) 8 0 0 0;
}
.hero::after{
  content:"\f013";font-family:"Font Awesome 6 Free";font-weight:900;
  position:absolute;inset-inline-end:-30px;bottom:-50px;
  font-size:190px;color:rgba(255,194,14,.1);line-height:1;
  animation:spin 40s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h2{font-size:23px;font-weight:700;line-height:1.35;position:relative;z-index:1}
.hero p{margin-top:8px;color:rgba(255,255,255,.7);font-size:13.5px;max-width:460px;position:relative;z-index:1}
.hero-actions{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.hero-actions .bt{min-height:38px;font-size:12px;padding:0 16px}

.adm{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
  padding:12px 16px;border-radius:4px;
  background:var(--steel);color:var(--or2);font-weight:700;font-size:13px;
  border-inline-start:6px solid var(--or2);
}
.adm small{color:rgba(255,255,255,.5);font-weight:500;margin-inline-start:auto}

/* ============ STATS ============ */
.g4{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-top:14px}
@media(min-width:620px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{
  background:var(--sf);border:1.5px solid var(--line);
  border-top:5px solid var(--steel);border-radius:4px;
  padding:14px;text-align:start;box-shadow:var(--sh);
  transition:.15s;display:flex;flex-direction:column;gap:2px;
}
[data-theme=dark] .sc{border-top-color:var(--or2)}
.sc:hover{transform:translateY(-2px);border-top-color:var(--or)}
.sc i{
  width:38px;height:38px;border-radius:3px;
  display:grid;place-items:center;
  background:var(--steel);color:var(--or2);
  margin-bottom:10px;font-size:15px;
}
.sc b{font:700 30px/1 var(--fh);font-variant-numeric:tabular-nums}
.sc span{color:var(--mute);font-size:12px;font-weight:600}

.seg{display:flex;height:14px;gap:3px}
.seg i{display:block;min-width:4px;transform:skewX(-20deg)}
.cols{display:grid;gap:12px;grid-template-columns:1fr;margin-top:6px}
@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.pn{
  background:var(--sf);border:1.5px solid var(--line);
  border-radius:4px;padding:14px;box-shadow:var(--sh);
}
.pn>b{
  font:600 13px var(--fh);letter-spacing:.05em;
  color:var(--ink2);display:block;margin-bottom:8px;
}
.sl{max-height:250px;overflow-y:auto}
.bar{
  position:relative;display:flex;justify-content:space-between;align-items:center;
  gap:10px;width:100%;min-height:40px;padding:0 12px;border-radius:3px;
  overflow:hidden;margin-top:4px;background:var(--sf2);font-size:13px;font-weight:600;
  border-inline-start:3px solid var(--steel);
}
.bar:hover{border-inline-start-color:var(--or)}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--orsoft)}
.bar span,.bar b{position:relative}
.bar b{
  font:700 12px var(--fh);background:var(--or2);color:var(--steel);
  padding:1px 9px;border-radius:2px;
}

/* ============ SEARCH BAR ============ */
.sr{
  display:flex;align-items:center;gap:8px;height:52px;
  padding:0 8px 0 14px;background:var(--sf);
  border:2px solid var(--ink);border-radius:4px;
  box-shadow:var(--sh);transition:.15s;
}
[data-theme=dark] .sr{border-color:var(--line)}
.sr:focus-within{border-color:var(--or);box-shadow:0 0 0 4px var(--orsoft)}
.sr>i{color:var(--or)}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:14.5px}
.sr input::placeholder{color:var(--mute)}
.sr button{
  width:38px;height:38px;border-radius:3px;
  display:grid;place-items:center;color:var(--mute);
  position:relative;flex:none;
}
.sr .fb{background:var(--or);color:#fff}
.bub{
  position:absolute;top:-6px;inset-inline-end:-6px;
  min-width:18px;height:18px;border-radius:2px;
  background:var(--or2);color:var(--steel);
  font-size:10px;font-weight:800;
  display:grid;place-items:center;
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  height:30px;padding:0 4px 0 12px;border-radius:3px;
  background:var(--steel);color:var(--or2);font-weight:700;font-size:12px;
}
.chip button{
  width:22px;height:22px;border-radius:2px;
  background:rgba(255,255,255,.14);color:var(--or2);font-size:9px;
  display:grid;place-items:center;
}
.inf{color:var(--mute);font-size:12.5px;margin:12px 2px 10px;font-weight:600}

/* ============ CARDS ============ */
.ls{display:grid;gap:8px}
@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}
.card{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  background:var(--sf);border:1.5px solid var(--line);
  border-inline-start:5px solid var(--steel);
  border-radius:4px;box-shadow:var(--sh);cursor:pointer;
  transition:.15s;min-width:0;
}
[data-theme=dark] .card{border-inline-start-color:var(--or2)}
.card:hover{transform:translateX(-3px);border-inline-start-color:var(--or)}
.av{
  width:48px;height:48px;border-radius:3px;color:#fff;
  display:grid;place-items:center;font:700 16px var(--fh);flex:none;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);
}
.cm{flex:1;min-width:0}
.cm b{
  display:flex;align-items:center;gap:6px;
  font-size:14.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cm small{
  display:block;color:var(--mute);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tg{
  font-size:10.5px;padding:2px 9px;border-radius:2px;
  background:var(--sf2);color:var(--ink2);font-weight:700;border:1px solid var(--line);
}
.tg.a{background:var(--steel);color:var(--or2);border-color:var(--steel)}
.vb{color:var(--teal)}
.ca{display:flex;flex-direction:column;gap:2px;flex:none}
.ca button{
  width:32px;height:32px;border-radius:3px;
  color:var(--mute);font-size:13px;
}
.ca button:hover{background:var(--sf2);color:var(--ink)}
.ca .fv.on{color:#E8A700}
.ca .dl:hover{color:var(--red)}

.me{
  display:flex;align-items:center;gap:12px;padding:14px;
  margin-bottom:12px;border-radius:4px;color:#fff;cursor:pointer;
  background:var(--steel);border-inline-start:6px solid var(--or2);box-shadow:var(--sh);
}
.me .av{background:var(--or)}
.me b{display:block}.me small{opacity:.7}
.em{
  text-align:center;padding:46px 16px;
  border:2px dashed var(--line);border-radius:4px;
  color:var(--mute);background:var(--sf);
}
.em i{font-size:30px;display:block;margin-bottom:10px;color:var(--or)}
.em b{display:block;color:var(--ink);margin-bottom:2px}
.em small{display:block;font-size:12px;margin-top:4px}

/* ============ BREADCRUMB / EXPLORER ============ */
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:12px 0;font-size:12.5px}
.cr button{
  padding:5px 12px;border-radius:3px;
  background:var(--sf);border:1.5px solid var(--line);font-weight:700;
}
.cr button:last-child{background:var(--steel);color:var(--or2);border-color:var(--steel)}
.cr i{font-size:9px;color:var(--mute)}
.rw{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:12px 14px;margin-bottom:8px;border-radius:4px;
  background:var(--sf);border:1.5px solid var(--line);
  border-inline-start:5px solid var(--steel);text-align:start;font-weight:700;
  transition:.15s;box-shadow:var(--sh);
}
.rw:hover{border-inline-start-color:var(--or);transform:translateX(-3px)}
.rw>i:first-child{
  width:36px;height:36px;border-radius:3px;
  background:var(--steel);color:var(--or2);
  display:grid;place-items:center;font-size:14px;
}
.rw span{flex:1}
.rw em{font:700 13px var(--fh);font-style:normal;background:var(--or2);color:var(--steel);padding:1px 10px;border-radius:2px}
.rw>i:last-child{font-size:10px;color:var(--mute)}

/* ============ BUTTONS ============ */
.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 20px;border-radius:4px;
  font:700 14px var(--fh);letter-spacing:.04em;
  background:var(--or);color:#fff;transition:.12s;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.22);
}
.bt:hover{background:#E85F00}
.bt:active{transform:translateY(2px);box-shadow:none}
.bt:disabled{opacity:.5}
.bt.g{background:var(--sf2);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.bt.d{background:var(--red)}
.bt.w{background:#25D366}
.bt.full{width:100%}
.bt.k{background:var(--steel);color:var(--or2)}

/* ============ MODAL ============ */
#md{
  position:fixed;inset:0;z-index:60;
  background:rgba(8,10,12,.72);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center;
}
#md.on{display:flex}
@media(min-width:620px){#md{align-items:center;padding:16px}}
.sheet{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--sf);padding:22px 20px calc(22px + var(--sb));
  box-shadow:0 10px 0 rgba(0,0,0,.25);
  border-top:8px solid transparent;
  border-image:var(--hz) 8 0 0 0;
  animation:up .22s cubic-bezier(.2,.9,.3,1);
  position:relative;
}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{
  font:700 19px var(--fh);letter-spacing:.04em;margin-bottom:4px;
  padding-inline-start:12px;border-inline-start:5px solid var(--or);
}
.lead{color:var(--mute);font-size:12.5px;margin-bottom:16px;padding-inline-start:17px}

.fl{display:block;margin-bottom:12px}
.fl span{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.fl input,.fl select{
  width:100%;height:46px;padding:0 14px;border-radius:4px;
  border:1.5px solid var(--line);background:var(--sf2);font-size:14px;
}
.fl input:focus,.fl select:focus{
  outline:0;border-color:var(--or);box-shadow:0 0 0 3px var(--orsoft);
}
.fl.er input{border-color:var(--red)}

.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.ac .full{grid-column:1/-1}

/* ============ SWITCH ============ */
.sw{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;
  padding:4px;background:var(--sf2);border-radius:4px;
  margin-bottom:16px;border:1.5px solid var(--line);
}
.sw button{height:38px;border-radius:3px;font-weight:700;color:var(--mute)}
.sw .on{background:var(--steel);color:var(--or2)}

/* ============ FILTER MODAL ============ */
.fmodal-h{margin-bottom:18px;padding-inline-start:12px;border-inline-start:5px solid var(--or)}
.fmodal-h h2{font-size:18px;margin-bottom:2px;font-weight:700;font-family:var(--fh);letter-spacing:.03em;padding:0;border:0}
.fmodal-h .sub{font-size:12px;color:var(--mute)}
.fsect{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:14px 16px;border-radius:4px;text-align:start;
  background:var(--sf);border:1.5px solid var(--line);
  border-inline-start:5px solid var(--steel);
  margin-bottom:8px;transition:.15s;
}
.fsect:hover{border-inline-start-color:var(--or);background:var(--sf2);transform:translateX(-2px)}
.fsect.on{background:var(--orsoft);border-inline-start-color:var(--or)}
.fsect .ic{
  width:40px;height:40px;border-radius:3px;
  background:var(--steel);color:var(--or2);
  display:grid;place-items:center;flex:none;font-size:15px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);
}
.fsect.on .ic{background:var(--or);color:#fff}
.fsect .name{
  flex:1;font-weight:700;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink);font-size:14px;
}
.fsect .val{
  font-size:12px;color:var(--or);font-weight:700;
  max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.fsect .num{
  font-size:12px;color:var(--steel);min-width:28px;text-align:center;
  font-weight:800;background:var(--or2);
  padding:3px 10px;border-radius:2px;
  font-variant-numeric:tabular-nums;
}

}

.auth-btn.admin .ai{background:rgba(0,0,0,.2);color:#fff}
.auth-btn .at{flex:1;min-width:0}
.auth-btn .at b{

}
.code-note b{color:var(--or)}

/* ============ GLOBAL SEARCH RESULTS (dropdown) ============ */
.gsearch-results{
  position:absolute;top:calc(100% + 4px);inset-inline:0;
  background:var(--sf);border:1.5px solid var(--or);
  border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.3);
  max-height:60vh;overflow-y:auto;z-index:40;
  display:none;
}
.gsearch-results.on{display:block}
.gsearch-results .gsr-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-bottom:1px solid var(--line);
  width:100%;text-align:start;cursor:pointer;
  transition:.15s;
}
.gsearch-results .gsr-item:last-child{border-bottom:0}
.gsearch-results .gsr-item:hover{background:var(--sf2)}
.gsearch-results .gsr-item .gsr-av{
  width:36px;height:36px;border-radius:3px;
  display:grid;place-items:center;color:#fff;
  font-weight:700;font-size:12px;flex:none;
}
.gsearch-results .gsr-item .gsr-body{flex:1;min-width:0}
.gsearch-results .gsr-item b{
  display:block;font-size:13px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--ink);
}
.gsearch-results .gsr-item small{
  display:block;color:var(--mute);font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;
}
.gsearch-results .gsr-item .gsr-arrow{color:var(--mute);font-size:11px;flex:none}
.gsearch-results .gsr-empty{
  padding:24px 16px;text-align:center;
  color:var(--mute);font-size:12.5px;
}
.gsearch-results .gsr-header{
  padding:8px 14px;background:var(--sf2);
  font-size:10.5px;font-weight:700;color:var(--mute);
  text-transform:uppercase;letter-spacing:.06em;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;
}

/* ============ BOTTOM NAV ============ */
#bn{
  position:fixed;inset-inline:0;bottom:0;z-index:29;
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 6px calc(6px + var(--sb));
  background:var(--hd);
  border-top:5px solid transparent;
  border-image:var(--hz) 5 0 0 0;
}
.bi{
  height:54px;border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;font-weight:700;color:rgba(255,255,255,.55);
  position:relative;transition:.15s;
}
.bi i{font-size:16px}
.bi:hover{color:#fff}
.bi.on{background:var(--or2);color:var(--steel)}
.bi .bub{top:4px;inset-inline-end:22px;background:var(--or);color:#fff}

/* ============ TOAST ============ */
#ts{
  position:fixed;inset-inline:0;bottom:calc(96px + var(--sb));
  margin:auto;width:max-content;max-width:calc(100% - 32px);
  z-index:90;background:var(--steel);color:#fff;
  padding:12px 18px;border-radius:4px;
  border-inline-start:5px solid var(--or2);
  font-weight:600;font-size:13px;
  display:flex;gap:12px;align-items:center;
  opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;
  box-shadow:0 6px 0 rgba(0,0,0,.25);
}
#ts.on{opacity:1;transform:none;pointer-events:auto}
#ts button{color:var(--or2);font-weight:800}

/* ============ LOADER ============ */
#ld{
  position:fixed;inset:0;z-index:99;
  background:var(--steel);
  display:none;place-items:center;
}
#ld.on{display:grid}
#ld i{font-size:40px;color:var(--or2);animation:sp 1.4s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ OFFLINE BADGE ============ */
#offline-badge{
  position:fixed;top:calc(var(--st) + 4px);inset-inline-end:8px;
  z-index:80;padding:4px 10px;border-radius:3px;
  background:var(--red);color:#fff;font-size:11px;font-weight:700;
  display:none;align-items:center;gap:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
#offline-badge.on{display:inline-flex}

/* ============ PDF ============ */
.pdf-stage{position:fixed;left:-99999px;top:0;width:1200px}
.pdf-card{
  width:1200px;min-height:560px;display:flex;direction:rtl;

}
.pdf-l{

}
.pdf-name{font:700 36px/1.25 'Oswald','IBM Plex Sans Arabic',sans-serif;letter-spacing:.03em}
.pdf-sub{font-size:16px;opacity:.65;margin-top:10px}
.pdf-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.pdf-tag{

}
.pdf-tag.v{background:#FFC20E;color:#14181D;border-color:#FFC20E}
.pdf-r{
  flex:1;padding:50px 40px 120px;

}
.pdf-row .ic{

.pdf-ft{

}
.pdf-ft b{font:700 22px 'Oswald',sans-serif;letter-spacing:.12em;color:#14181D}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:480px){
  .hin{min-height:56px;padding:4px 10px 10px;gap:5px}
  .logo{width:36px;height:36px;font-size:16px}
  .brand b{font-size:15px}
  .brand small{font-size:10px}
  .ib{height:36px;min-width:36px;padding:0 8px;font-size:11px}
  main{padding:calc(96px + var(--st)) 10px calc(104px + var(--sb))}

  .hero{padding:24px 18px}

  .ph{margin:-20px -16px 0}
  .bi{font-size:9.5px}
  .bi i{font-size:14px}
}
</style>

// ============================================================
// SERVICE WORKER — registered from blob
// ============================================================
(function() {
  if (!('serviceWorker' in navigator)) return;
  const swCode = `
    const CACHE = 'connectpro-v3';
    const ASSETS = [
      location.pathname,
      'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap',
      'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css'
    ];
    self.addEventListener('install', e => {
      self.skipWaiting();
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS).catch(() => {})));
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
      ).then(() => self.clients.claim()));
    });
    self.addEventListener('fetch', e => {
      const req = e.request;
      if (req.method !== 'GET') return;
      // Network-first for HTML; cache-first for others
      const isDoc = req.mode === 'navigate' || (req.headers.get('accept') || '').includes('text/html');
      if (isDoc) {
        e.respondWith(
          fetch(req).then(res => {
            const copy = res.clone();
            caches.open(CACHE).then(c => c.put(req, copy)).catch(() => {});
            return res;
          }).catch(() => caches.match(req).then(r => r || caches.match(location.pathname)))
        );
      } else {
        e.respondWith(
          caches.match(req).then(r => r || fetch(req).then(res => {
            if (res.status === 200) {
              const copy = res.clone();
              caches.open(CACHE).then(c => c.put(req, copy)).catch(() => {});
            }
            return res;
          }))
        );
      }
    });
  `;
  const blob = new Blob([swCode], { type: 'text/javascript' });
  const url = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url, { scope: './' }).catch(err => {
    console.warn('SW register failed', err);
  });

  // Online/offline badge
  function setOffline(off) {
    document.getElementById('offline-badge').classList.toggle('on', off);
  }
  window.addEventListener('online', () => setOffline(false));
  window.addEventListener('offline', () => setOffline(true));
  if (!navigator.onLine) setOffline(true);
})();
</script>

    return hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.q);

}

  if(sortBy==='count')return arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
  return arr.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
}

function renderFilter(){
  let html='';

  if(S.filterPanel.mode==='sections'){
    html=`<div class="fmodal-h"><h2>تصفية النتائج</h2><div class="sub">اختر فئة للتصفية</div></div>`;
    html+=SECTIONS.map(s=>{

      let val='';
      if(arr.length===1)val=lbl(s.k,arr[0]);
      else if(arr.length>1)val=`${arr.length} مختارة`;
      const count=facets[s.k].length;
      return`<button class="fsect${active?' on':''}" data-a="fsect" data-v="${s.k}">
        <span class="ic"><i class="fa-solid ${s.icon}"></i></span>

      </div>`;
    const avail=getFacet(S.filterPanel.key,curSort);
    const selected=S.f[S.filterPanel.key];
    html+=avail.map(([v,n])=>{
      const on=selected.some(x=>norm(x)===norm(v));
      const disabled=n===0&&!on;
      return`<button class="fopt${on?' on':''}" data-a="fpick" data-v="${esc(v)}" ${disabled?'disabled':''}>
        <span class="box"><i class="fa-solid fa-check"></i></span>

  </div>`;
  openM(html);
}

async function loadPdfLibs(){
  if(window.html2canvas&&window.jspdf)return;
  const ld=u=>new Promise((a,b)=>{const e=document.createElement('script');e.src=u;e.onload=a;e.onerror=b;document.head.appendChild(e)});
  try{await Promise.all([window.html2canvas?0:ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),window.jspdf?0:ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')])}
  catch{throw new Error('تعذر تحميل مكتبة PDF — تحقق من الاتصال')}
}
function pdfHtml(r){
  const p=fmtPhone(r.phone),w=url(r.web),rows=[];
  if(shown(r.domaine))rows.push(['fa-industry','القطاع',r.domaine]);
  if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',r.specialite]);
  if(r.ville)rows.push(['fa-location-dot','المدينة',r.ville]);
  if(p)rows.push(['fa-phone','الهاتف',p]);
  if(r.email)rows.push(['fa-envelope','البريد',r.email]);
  if(w)rows.push(['fa-globe','الموقع',r.web]);
  const base=baseUrl(),qr=base?`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(base+'#p='+r.id)}&color=14181D&bgcolor=FFFFFF&margin=0" crossorigin="anonymous" alt="QR">`:'';
  return`<div class="pdf-card" data-pdf-root>
    <div class="pdf-l"><div class="pdf-logo"><i class="fa-solid ${domIcon(r.domaine)}"></i></div>
      <div class="pdf-name">${esc(r.name)}</div><div class="pdf-sub">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div>
      <div class="pdf-tags"><span class="pdf-tag">${TL[r.type]}</span><span class="pdf-tag">${CL[r.categorie]}</span>${r.verified?'<span class="pdf-tag v">✓ موثّق</span>':''}</div></div>
    <div class="pdf-r">${rows.map(([i,k,v])=>`<div class="pdf-row"><div class="ic"><i class="fa-solid ${i}"></i></div><div><div class="k">${k}</div><div class="v">${esc(v)}</div></div></div>`).join('')}</div>
    <div class="pdf-ft"><b>CONNECT PRO</b>${qr}</div></div>`;
}
async function makePDF(id){
  const r=byId(id);if(!r)return;busy(true);let h=null;
  try{
    try{await loadPdfLibs()}catch(e){toast(e.message);return}
    h=document.createElement('div');h.className='pdf-stage';h.innerHTML=pdfHtml(r);document.body.appendChild(h);
    try{await document.fonts?.ready}catch{}
    await new Promise(res=>setTimeout(res,800));
    const cv=await html2canvas(h.querySelector('[data-pdf-root]'),{scale:2,backgroundColor:'#DADDE1',useCORS:true,logging:false});
    const{jsPDF}=window.jspdf,W=200,H=W*cv.height/cv.width;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[W,H]});
    pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);
    pdf.save(`ConnectPro-${r.name.replace(/\s+/g,'_')}.pdf`);log('pdf',r.name);toast('تم توليد بطاقة PDF');
  }catch(e){console.error(e);toast('خطأ في توليد PDF')}
  finally{h?.remove();busy(false)}
}

async function doLogin(){
  if(!needFb())return;
  const raw=$('#li_i').value.trim(),p=$('#li_p').value;
  if(!raw||!p)return toast('أدخل البيانات');
  busy(true);
  try{
    let found=null;
    for(const v of phoneVariants(raw)){
      try{
        const key=encodeURIComponent(fmtPhone(v));
        const uidv=(await S.fb.ref('users_index/'+key).once('value')).val();
        if(uidv){const rec=(await S.fb.ref('users/'+uidv).once('value')).val();if(rec){found={uid:uidv,rec};break}}
      }catch{}
    }
    if(!found){
      const u=await uidOf(fmtPhone(raw));
      const r=(await S.fb.ref('users/'+u).once('value')).val();
      if(r)found={uid:u,rec:r};
    }
    if(!found)return toast('لا يوجد حساب بهذا الرقم');
    const{uid:u,rec:r}=found;
    const okPass=await sha(r.salt+p);
    if(!safeEq(r.hash,okPass))return toast('الرمز غير صحيح');
    try{localStorage.setItem('cp-lastphone',fmtPhone(r.ident));localStorage.setItem('cp-saved-pass',p);localStorage.setItem('cp-saved-phone',fmtPhone(r.ident))}catch{}
    S.admin=false;sessionStorage.removeItem('cp-admin');
    S.user={id:u,name:r.name,ident:r.ident,profileId:r.profileId||'',claim:r.claim||''};
    saveSess();log('login','');closeM();toast('مرحباً '+r.name);rerender();
  }catch(e){console.error(e);toast('خطأ')}finally{busy(false)}
}
async function doSignup(){
  if(!needFb())return;
  const n=$('#su_n').value.trim(),i=fmtPhone($('#su_i').value),p=$('#su_p').value;
  const t=$('#su_t').value,c=$('#su_c').value,d=$('#su_d').value.trim()||'Autre',sp=$('#su_s').value.trim()||'Général',v=$('#su_v').value.trim(),m=$('#su_m').value.trim(),w=$('#su_w').value.trim();
  if(!n)return toast('اسم الشركة مطلوب');
  if(!validPhone(i))return toast('هاتف غير صالح');
  if(p.length<6)return toast('الرمز قصير');
  busy(true);
  try{
    const u=await uidOf(i);
    if((await S.fb.ref('users/'+u).once('value')).val())return toast('الحساب موجود');
    const salt=uid();
    await S.fb.ref('users/'+u).set({name:n,ident:i,salt,hash:await sha(salt+p),createdAt:Date.now()});
    try{await S.fb.ref('users_index/'+encodeURIComponent(i)).set(u)}catch{}
    const ex=S.db.find(r=>!r.owner&&fmtPhone(r.phone)===i);
    let pid;
    if(ex){await S.fb.ref(`${path(ex.type,ex.categorie)}/${ex.id}`).update({owner:u});pid=ex.id}
    else{const it={id:uid(),name:n,domaine:d,specialite:sp,ville:v,phone:i,email:m,web:w,owner:u,createdAt:Date.now()};await S.fb.ref(`${path(t,c)}/${it.id}`).set(it);pid=it.id}
    await S.fb.ref('users/'+u+'/profileId').set(pid);
    await loadDB();
    S.admin=false;sessionStorage.removeItem('cp-admin');
    S.user={id:u,name:n,ident:i,profileId:pid,claim:''};saveSess();
    try{localStorage.setItem('cp-lastphone',i);localStorage.setItem('cp-saved-pass',p);localStorage.setItem('cp-saved-phone',i)}catch{}
    log('signup',n);closeM();toast('تم إنشاء الحساب');rerender();
  }catch(e){console.error(e);toast('خطأ')}finally{busy(false)}
}

async function findUserByPhone(rawPhone){
  if(!S.fb||!rawPhone)return null;
  const phone=fmtPhone(rawPhone);
  try{
    for(const v of phoneVariants(rawPhone)){
      const k=encodeURIComponent(fmtPhone(v));

  }catch{}
  for(const v of phoneVariants(rawPhone)){
    try{const u=await uidOf(ident(v));const r=(await S.fb.ref('users/'+u).once('value')).val();if(r)return{uid:u,rec:r}}catch{}
  }
  return null;
}
async function rgenFile(id){
  if(!S.admin||!needFb())return;
  const r=byId(id);if(!r)return;
  const raw=r.phone?String(r.phone).trim():'';
  if(!raw)return toast('لا رقم هاتف');
  busy(true);
  try{
    let found=await findUserByPhone(raw);
    let autoCreated=false;
    if(!found){
      if(!confirm(`لا حساب بهذا الرقم.\nإنشاء حساب فوريًا لـ ${fmtPhone(raw)}؟`))return;
      const u=await uidOf(fmtPhone(raw));
      const salt=uid();const tempCode=genCode();
      const rec={name:r.name,ident:fmtPhone(raw),salt,hash:await sha(salt+tempCode),profileId:r.id,createdAt:Date.now()};
      await S.fb.ref('users/'+u).set(rec);
      try{await S.fb.ref('users_index/'+encodeURIComponent(fmtPhone(raw))).set(u)}catch{}
      await S.fb.ref(`${path(r.type,r.categorie)}/${r.id}`).update({owner:u});
      found={uid:u,rec};autoCreated=true;log('account-auto',r.name);
    }
    const{uid:uidVal,rec}=found;
    const code=genCode();

    const expiry=Date.now()+RESET_TTL;

    log('reset-gen',rec.name);

    const profileUrl=`${baseUrl()}#p=${r.id}`;

        <p class="lead">أرسله إلى <b>${esc(rec.name)}</b><br><span style="font-size:11px;color:var(--mute)">${esc(rec.ident)}</span></p>

      ]
    });
    toast('تم التوليد');
  }catch(e){console.error(e);toast('خطأ')}finally{busy(false)}
}

/* ============================================================

async function adminPanel(){
  if(!S.admin||!needFb())return;
  busy(true);
  let usersList=null;
  try{
    const[usersRaw,logsRaw,profsRaw]=await Promise.all([
      S.fb.ref('users').once('value'),
      S.fb.ref('logs').limitToLast(50).once('value'),
      S.fb.ref('professionals').once('value')
    ]);
    usersList={users:Object.entries(usersRaw.val()||{}),logs:Object.values(logsRaw.val()||{}).reverse(),profs:mapRaw(profsRaw.val())};
    try{
      const cutoff=Date.now()-30*24*3600e3;
      const allLogs=logsRaw.val()||{};
      const toDelete=Object.entries(allLogs).filter(([,l])=>l.t<cutoff);
      if(toDelete.length){const updates={};toDelete.forEach(([k])=>{updates[k]=null});S.fb.ref('logs').update(updates).catch(()=>{})}
    }catch{}
  }catch(e){console.error(e);toast('تعذر');busy(false);return}
  busy(false);
  renderAdminPanel(usersList);
}
function renderAdminPanel(usersList){
  if(!usersList)return;
  const{users,logs,profs}=usersList;
  const userProfileIds=new Set(users.filter(([,u])=>u.profileId).map(([,u])=>u.profileId));
  const profilesNoAccount=profs.filter(p=>!p.owner&&!userProfileIds.has(p.id));
  const stats=`<div class="stats">
    <div class="stat"><b>${profs.length}</b><span>شركات</span></div>
    <div class="stat"><b>${users.length}</b><span>حسابات</span></div>
    <div class="stat ${profilesNoAccount.length?'warn':''}"><b>${profilesNoAccount.length}</b><span>بدون حساب</span></div>
    <div class="stat"><b>${users.filter(([,u])=>u.resetCode&&u.resetExpiry>Date.now()).length}</b><span>رموز نشطة</span></div>
  </div>`;
  const toolsRow=`<div class="srcbar" style="margin-bottom:12px">
    <button data-a="admingen"><i class="fa-solid fa-key"></i> توليد رمز</button>
  </div>`;
  let content=`<div style="max-height:340px;overflow-y:auto">
    ${users.length?users.map(([id,u])=>`<div class="pr">
      <div style="flex:1">
        <b style="font-size:13px;color:var(--ink)">${esc(u.name)}</b>
        <small dir="ltr">${esc(u.ident)}</small>
        ${u.resetCode&&u.resetExpiry>Date.now()?'<small style="color:var(--or)"><i class="fa-solid fa-key"></i> رمز نشط</small>':''}
      </div>
      <button class="ib" style="height:32px;min-width:32px;padding:0;color:var(--or)" data-a="agGen" data-v="${esc(id)}" title="توليد رمز"><i class="fa-solid fa-key"></i></button>
      <button class="ib out" style="height:32px;min-width:32px;padding:0" data-a="udel" data-v="${esc(id)}" title="حذف"><i class="fa-solid fa-user-slash"></i></button>
    </div>`).join(''):empty('لا نتائج')}</div>`;
  const logColor={add:'add',delete:'del',edit:'edit','csv-push':'sync','reset-gen':'key','admin-gen':'key',signup:'add',login:'login','pass-change':'edit','account-auto':'add'};
  const logsHtml=logs.slice(0,15).map(l=>{
    const cls=logColor[l.a]||'';
    return`<div class="log-row"><span class="lg-time">${esc(new Date(l.t).toLocaleString('ar-MA',{numberingSystem:'latn'}))}</span><span class="lg-act ${cls}">${esc(l.a)}</span><span style="flex:1">${esc(l.d)} · ${esc(l.u)}</span></div>`;
  }).join('')||empty('لا نشاط');
  openM(`<h2>لوحة التحكم الإدارية</h2>${toolsRow}${stats}${content}
    <h3 class="t" style="margin-top:16px">سجل النشاط</h3>
    <div style="max-height:220px;overflow-y:auto">${logsHtml}</div>
    <div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  S.installEvent=e;
  if(!S.pwaDismissed){
    const bar=$('#pwaBar');
    bar.classList.add('on');
    const main=$('#mainArea');
    if(main) main.style.paddingTop='';
  }
});
window.addEventListener('appinstalled',()=>{
  S.installEvent=null;
  $('#pwaBar').classList.remove('on');
  toast('تم تثبيت التطبيق بنجاح');
});
async function installPWA(){
  if(!S.installEvent)return toast('التثبيت غير متاح حاليًا');
  S.installEvent.prompt();
  const{outcome}=await S.installEvent.userChoice;
  if(outcome==='accepted'){
    S.installEvent=null;
    $('#pwaBar').classList.remove('on');
    toast('جاري التثبيت...');
  }else{
    toast('تم إلغاء التثبيت');
  }
}

/* ============================================================
   HANDLERS
   ============================================================ */
const A={
  theme(){
    const d=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=d;
    try{localStorage.setItem('cp-theme',d)}catch{}
    topbar();
    toast(d==='dark'?'الوضع الداكن':'الوضع الفاتح');
  },
  gsearchToggle,
  gqClear(){
    $('#gq').value='';S.gq='';$('#gqClear').hidden=true;$('#gResults').classList.remove('on');
    $('#gq').focus();
  },
  gsearchOpen,
  shareApp,
  add(){closeM();canAdd()?form(null):toast('غير مسموح')},
  auth:v=>authModal(v||'in'),doLogin,doSignup,acc:account,udelme:deleteMe,
  uout(){S.user=null;saveSess();closeM();toast('تم تسجيل الخروج');rerender()},
  alogin:adminLogin,
  alogin2(){
    const pw=$('#pw').value;
    if(pw===ADMIN_PASS){
      const save=$('#pw_save')?.checked;
      if(save)localStorage.setItem('cp-admin-pw',pw);
      else localStorage.removeItem('cp-admin-pw');
      S.user=null;saveSess();
      try{localStorage.removeItem('cp-saved-pass');localStorage.removeItem('cp-saved-phone')}catch{}
      S.admin=true;sessionStorage.setItem('cp-admin','1');
      closeM();toast('مرحباً — وضع المدير');rerender();
    }else{
      $('#pw').parentElement.classList.add('er');toast('كلمة المرور خاطئة');
    }
  },
  alogout(){S.admin=false;sessionStorage.removeItem('cp-admin');toast('تم الخروج من وضع المدير');rerender()},
  installPWA(){
    if(!S.installEvent){
      toast('استخدم قائمة المتصفح ← "تثبيت التطبيق"');
      return;
    }
    installPWA();
  },
  closePWA(){
    S.pwaDismissed=true;
    try{localStorage.setItem('cp-pwa-dismissed','1')}catch{}
    $('#pwaBar').classList.remove('on');
  },
  tab:v=>{
    if(S.tab===v){
      if(v==='dir'){clearF();dirShell()}
      else if(v==='exp'){S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};explorer()}
      else scrollTo({top:0,behavior:'smooth'});
    }else go(v);
  },
  cls:closeM,open(id){profile(id)},shr:share,pdf:makePDF,fav:toggleFav,
  edit(id){const r=byId(id);canEdit(r)?form(r):toast('غير مسموح')},
  del:delAsk,delok:delOk,save,vrf:verify,
  undo(){if(undoFn){undoFn();undoFn=null;$('#ts').classList.remove('on')}},
  stat(v){
    if(v==='f'){openFilter();return}
    const i=v.indexOf(':');
    clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];go('dir');
  },
  bar(v,el){clearF();S.f[el.dataset.k]=[v];go('dir')},
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=40;clearFacetCache();dirList()},
  qx(){S.q='';$('#q').value='';S.lim=40;clearFacetCache();dirList()},
  more(){S.lim+=40;dirList()},
  fopen:()=>openFilter(),fmodal:()=>openFilter(),
  fsect(v){S.filterPanel.mode='pick';S.filterPanel.key=v;renderFilter()},
  fback(){S.filterPanel.mode='sections';S.filterPanel.key=null;renderFilter()},
  fsort(v){S.sortF[S.filterPanel.key]=v;renderFilter()},
  fclearsec(){S.f[S.filterPanel.key]=[];S.lim=40;clearFacetCache();renderFilter();if(S.tab==='dir')dirList()},
  fpick(v){
    const k=S.filterPanel.key,arr=S.f[k];
    const i=arr.findIndex(x=>norm(x)===norm(v));
    if(i>=0)arr.splice(i,1);else arr.push(v);
    S.lim=40;clearFacetCache();renderFilter();if(S.tab==='dir')dirList();
  },
  fclr(){clearF();renderFilter();if(S.tab==='dir'){$('#q')&&($('#q').value='');dirList()}},
  fdone(){closeM();if(S.tab!=='dir'){S.tab='';go('dir')}else{dirList()}},
  xt:v=>{S.exp={t:v,d:'',s:'',q:'',sort:S.exp.sort};explorer()},
  xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';explorer()},
  xs:v=>{S.exp.s=v;S.exp.q='';explorer()},
  qxexp(){S.exp.q='';explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:'',sort:x.sort}:v==='t'?{t:x.t,d:'',s:'',q:'',sort:x.sort}:v==='d'?{t:x.t,d:x.d,s:'',q:'',sort:x.sort}:x;explorer()},
  findme:claimCancel,claimsearch:claimSearch,claimsend:claimSend,
  resetreq:resetReq,rgenfile:rgenFile,
  admingen:adminGen,agFind,agGen,agCreate,
  rcopy(v){navigator.clipboard?.writeText(v).then(()=>toast('تم النسخ')).catch(()=>toast('تعذر'))},
  forgot:forgotOpen,fqFind,
  changepass:changePassword,doChangePass,
  usr:adminPanel,
  udel:async(id)=>{
    if(!S.admin||!needFb()||!confirm('حذف المستخدم؟'))return;
    try{
      const rec=(await S.fb.ref('users/'+id).once('value')).val();
      await S.fb.ref('users/'+id).remove();
      if(rec?.ident)try{await S.fb.ref('users_index/'+encodeURIComponent(fmtPhone(rec.ident))).remove()}catch{}
      log('user-del',id);toast('تم');adminPanel();
    }catch{toast('خطأ')}
  },
  favclr(){if(confirm('مسح كل المفضلة؟')){S.fav=[];try{localStorage.removeItem('cp-fav')}catch{};favorites();favBadge()}}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}
  else if(e.target.id==='md')closeM();
  else if(!e.target.closest('.gsearch')&&!e.target.closest('[data-a="gsearchToggle"]')){
    const r=$('#gResults');
    if(r)r.classList.remove('on');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeM();$('#gResults')?.classList.remove('on')}
  if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v);
  // Ctrl+K for global search
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(!$('#gsearch').classList.contains('on'))gsearchToggle();
    setTimeout(()=>$('#gq')?.focus(),100);
  }
});
