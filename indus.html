html{overflow-x:hidden}main,.pb,.sb,.chips,.list{width:100%;min-width:0}.st,.it,.row,.btn,.dr,.tag{min-width:0;max-width:100%}.btn{padding:0 10px;text-align:center;overflow-wrap:anywhere}.hero>div:last-child{min-width:0}.hero h3,.em,.tag,.row .im,.crumb,.ban p{overflow-wrap:anywhere}.row .im{min-width:0}.st span,.st small{overflow-wrap:anywhere}.ph h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(()=>{'use strict';
/* ═══ CONFIG ═══ */
const FB_CFG={apiKey:"AIzaSyBQKPqut41Jqs28Zn_z-I_ffD-iNCnFpdU",authDomain:"said-rahil-default-rtdb.firebaseio.com",databaseURL:"https://said-rahil-default-rtdb.firebaseio.com/",projectId:"said-rahil",storageBucket:"said-rahil.firebasestorage.app"};

const PAL=['#0B5CAD','#1B7F5C','#8A4B08','#7A3E9D','#B3261E','#0F6E7A','#4C5A9E','#5B6B1F','#9A3B5C','#3F4B57'];
const IC={home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',compass:'M12 2a10 10 0 100 20 10 10 0 000-20zM15.5 8.5l-2 5-5 2 2-5z',users:'M9 11a4 4 0 100-8 4 4 0 000 8zM2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 010 7M22 21c0-3-2-5-4-5.5',truck:'M2 6h12v10H2zM14 9h4l4 4v3h-8zM6 19a2 2 0 100-4 2 2 0 000 4zM18 19a2 2 0 100-4 2 2 0 000 4z',expert:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 3.5-6 8-6s8 2 8 6M16 17l2 2 3-3',pin:'M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12zM12 12a2.5 2.5 0 100-5 2.5 2.5 0 000 5z',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',wrench:'M14.7 6.3a4 4 0 005 5L21 13l-8 8-4-4 8-8zM3 21l5-5',box:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',hammer:'M3 21l9-9M14 4l6 6-3 3-6-6zM9 9l-4 4',hat:'M3 17h18M5 17a7 7 0 0114 0M12 6v5',search:'M11 18a7 7 0 100-14 7 7 0 000 14zM21 21l-5-5',x:'M6 6l12 12M18 6L6 18',moon:'M21 13A9 9 0 1111 3a7 7 0 0010 10z',sun:'M12 16a4 4 0 100-8 4 4 0 000 8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5',plus:'M12 5v14M5 12h14',sync:'M21 12a9 9 0 01-15 6.7L3 16M3 12a9 9 0 0115-6.7L21 8M3 21v-5h5M21 3v5h-5',phone:'M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z',chat:'M21 12a9 9 0 01-13.5 7.8L3 21l1.3-4.4A9 9 0 1121 12z',mail:'M3 5h18v14H3zM3 6l9 7 9-7',globe:'M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',share:'M18 8a3 3 0 100-6 3 3 0 000 6zM6 15a3 3 0 100-6 3 3 0 000 6zM18 22a3 3 0 100-6 3 3 0 000 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4',copy:'M9 9h11v11H9zM5 15V4h11',card:'M4 4h16v16H4zM9 11a2 2 0 100-4 2 2 0 000 4zM6 17c0-2 1.5-3 3-3s3 1 3 3M14 9h4M14 13h4',edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',chev:'M9 6l6 6-6 6',back:'M15 6l-6 6 6 6',tool:'M4 20l6-6M14 4l6 6-3 3-6-6z'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;

/* ═══ STATE ═══ */
const S={db:[],f:{type:'',categorie:'',ville:'',domaine:'',specialite:'',q:''},exp:{t:'',d:'',s:''},tab:'home',lim:60,fb:null,off:false,cur:null,list:[],cb:null,csv:null,busy:false};

/* ═══ HELPERS ═══ */
const $=s=>document.querySelector(s);
const escHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const e=escHtml;
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const getColor=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const getInitials=n=>String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const formatPhone=p=>{let d=String(p||'').replace(/[^\d+]/g,'');if(!d)return'';if(d.startsWith('00'))return'+'+d.slice(2);if(d.startsWith('+'))return d;if(d.startsWith('0'))return'+212'+d.slice(1);if(d.startsWith('212'))return'+'+d;return d};
const uid=()=>`${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
const webUrl=w=>{if(!w)return'';const u=/^https?:\/\//i.test(w)?w:'https://'+w;return/^https?:\/\/[^\s]+$/i.test(u)?u:''};
const debounce=(f,t)=>{let i;return(...a)=>{clearTimeout(i);i=setTimeout(()=>f(...a),t)}};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3000)};
const showLoading=b=>$('#bz').classList.toggle('on',b);
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();return ok}}
const uniq=k=>{const m=new Map();S.db.forEach(r=>{const v=(r[k]||'').trim();if(v&&!m.has(norm(v)))m.set(norm(v),v)});return[...m.values()].sort((a,b)=>a.localeCompare(b,'fr'))};
const count=(k,v)=>S.db.filter(r=>norm(r[k])===norm(v)).length;

/* ═══ SEARCH ENGINE ═══ */
class SearchEngine{
  constructor(){this.idx=[]}
  normalizeStr(s){return norm(s)}
  buildIndex(recs){this.idx=recs.map(r=>{const n=norm(r.name),d=norm(r.domaine),s=norm(r.specialite),v=norm(r.ville);
    return{r,n,v,t:norm([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' ')),k:new Set([n,d,s,v].join(' ').split(' ').filter(w=>w.length>2))}})}
  applyFilters(list,f){const m=(a,b)=>!b||norm(a)===norm(b);return list.filter(x=>m(x.r.type,f.type)&&m(x.r.categorie,f.categorie)&&m(x.r.ville,f.ville)&&m(x.r.domaine,f.domaine)&&m(x.r.specialite,f.specialite))}
  search(q,f){const L=this.applyFilters(this.idx,f),nq=norm(q);
    if(nq.length<2)return L.map(x=>x.r);
    const terms=nq.split(' ');const out=[];
    for(const x of L){let sc=0,ok=true;
      for(const t of terms){const p=x.t.indexOf(t);if(p<0){ok=false;break}
        sc+=10-Math.min(p,10);if([...x.k].some(w=>w.includes(t)))sc+=5;if(x.n.includes(t))sc+=3;if(x.v.includes(t))sc+=2}
      if(ok)out.push({...x.r,_score:sc})}
    return out.sort((a,b)=>b._score-a._score)}
}

/* ═══ DATA: load + CSV sync ═══ */
function mapRaw(raw){
  const out=[];
  for(const[T,tv]of Object.entries(TK))for(const[C,cv]of Object.entries(CK))
    toArr(raw?.[tv]?.[cv]).forEach(it=>it.name&&out.push({...it,type:T,categorie:C,id:it.id||uid(),domaine:it.domaine||'Autre',specialite:it.specialite||'Général'}));
  return out.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
}
async function loadDB(){
  let raw=null;
  try{if(!S.fb)throw 0;raw=(await S.fb.ref('professionals').once('value')).val();S.off=false}
  catch{S.off=true;const c=await loadCSVs();S.db=c.map(r=>({...r,id:r.id||uid()}));eng.buildIndex(S.db);return}
  S.db=mapRaw(raw);eng.buildIndex(S.db);
}
function splitCSV(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o}
function parseCSV(text,type,cat){
  const clean=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');
  return text.split(/\r?\n/).slice(1).map(splitCSV).filter(c=>clean(c[1])).map(c=>({id:uid(),name:clean(c[1]),domaine:clean(c[2])||'Autre',specialite:clean(c[3])||'Général',ville:clean(c[4]),phone:formatPhone(clean(c[5])),email:clean(c[6]),web:clean(c[7]),type,categorie:cat}));
}
async function loadCSVs(){
  if(S.csv)return S.csv;
  const get=async(u,t,c)=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return parseCSV(await r.text(),t,c)};
  const[ex,fo]=await Promise.all([get(CSV_EXPERTS,'experts','yad-amila'),get(CSV_FOURNISSEURS,'fournisseurs','services')]);
  return S.csv=[...fo,...ex];
}
async function syncData(auto){
  if(S.busy)return;if(!auto&&!confirm('Synchroniser depuis Google Sheets ? Les données actuelles seront remplacées.'))return;
  S.busy=true;showLoading(true);
  try{
    S.csv=null;const all=await loadCSVs();
    const tree={FOURNISSEURS:{SERVICES:all.filter(r=>r.type==='fournisseurs').map(({type,categorie,...r})=>r)},EXPERTS:{'YAD AMILA':all.filter(r=>r.type==='experts').map(({type,categorie,...r})=>r)}};
    if(S.fb&&!S.off)await S.fb.ref('professionals').set(tree);
    await loadDB();if(!auto)resetF();refresh();toast(auto?'Données synchronisées':'Synchronisation réussie');
  }catch(x){console.error(x);toast('Échec de la synchronisation. Vérifiez votre connexion.')}
  finally{S.busy=false;showLoading(false)}
}

  if(!S.db.length&&!S.off)await syncData(true);
  document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset.v,el)});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closePage()});
  $('#q').addEventListener('input',debounce(ev=>{S.f.q=ev.target.value;S.lim=60;renderRep()},200));
  refresh();
  setTimeout(()=>$('#ld').classList.add('off'),Math.max(0,600-(Date.now()-t0)));
  if(S.off)toast('Mode hors ligne : lecture seule');
  setInterval(()=>syncData(true),60*60*1000);
}
init();
})();
</script>
