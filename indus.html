<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Pro — منصة التواصل المهني</title>
<meta name="theme-color" content="#075E54">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --wd:#075E54;--wl:#128C7E;--wt:#25D366;--lk:#128C7E;--acs:#DCF8C6;
  --bg:#ECE5DD;--cd:#fff;--bd:#D1D7DB;--ink:#111B21;--mut:#667781;
  --dg:#B3261E;--ok:#1B7F5C;--red:#D9243C;
  --sh:0 1px 2px rgba(11,20,26,.1);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  color-scheme:light
}
[data-theme=dark]{
  --bg:#0B141A;--cd:#111B21;--bd:#2A3942;--ink:#E9EDEF;--mut:#8696A0;
  --dg:#FF8A80;--lk:#25D366;--acs:#005C4B;--wl:#25D366;--wd:#111B21;
  --sh:none;color-scheme:dark
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font:14px/1.45 'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--wt);outline-offset:2px;border-radius:6px}

/* HEADER — WhatsApp style */
header{position:fixed;inset:0 0 auto;height:calc(54px + var(--st));padding-top:var(--st);z-index:30;background:var(--wd);color:#fff;display:flex;align-items:center;gap:6px;padding-inline:8px;border-bottom:1px solid rgba(255,255,255,.08)}
.lg{width:36px;height:36px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.ht{flex:1;min-width:0}.ht b{display:block;font-size:15px;line-height:1.2}.ht small{display:block;font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{width:36px;height:36px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:15px;flex:none}.hb:hover,.hb.on{background:rgba(255,255,255,.14)}.hb.on{color:#25D366}
#hadd{display:none}.ab{display:none}.cadd #hadd{display:grid}.adm .ab{display:block}
main{max-width:800px;margin:0 auto;padding:calc(64px + var(--st)) 8px calc(80px + var(--sb))}
.tab{display:none}.tab.on{display:block}

/* NAV — 4 buttons now */
nav{position:fixed;inset:auto 0 0;height:calc(54px + var(--sb));padding-bottom:var(--sb);z-index:30;background:var(--cd);border-top:1px solid var(--bd);display:flex;align-items:stretch}
nav button.nv{flex:1;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:0;position:relative;min-width:0;padding:0 1px}
nav button.nv.on{color:var(--wl);font-weight:700}
nav button.nv.on::before{content:"";position:absolute;top:0;width:26px;height:2px;background:var(--wt);border-radius:0 0 2px 2px}
nav i{font-size:16px}
.nb{position:absolute;top:3px;inset-inline-start:calc(50% + 5px);background:#25D366;color:#fff;border-radius:7px;font-size:9.5px;min-width:15px;padding:0 3px;font-weight:700;text-align:center}

.gl{background:var(--cd);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh)}
.g4{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:8px}@media(min-width:560px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sc{padding:8px 4px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;border-radius:9px}
.sc i{color:var(--wl);font-size:16px;margin-bottom:1px}.sc b{font-size:18px;line-height:1.15}.sc span{font-size:11px;color:var(--mut)}
h3.t{font-size:14px;margin:10px 2px 6px;color:var(--ink)}
.pn{padding:10px;margin-bottom:8px;border-radius:10px}
.av{width:38px;height:38px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}

/* Search */
.sr{display:flex;align-items:center;gap:6px;padding:0 10px;height:42px;border-radius:10px}
.sr input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:15px}.sr i{color:var(--mut);font-size:14px}.sr button{width:30px;height:30px;color:var(--mut);border-radius:50%;display:grid;place-items:center}
.sr button:hover{background:var(--acs)}

/* Chips */
.fchips{display:flex;flex-wrap:wrap;gap:4px;padding:4px 2px 6px}
.fchips:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 6px 0 8px;background:var(--wl);color:#fff;border-radius:13px;font-size:11.5px}
.fchip .x{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;font-size:8px}
.fchip .x:hover{background:rgba(255,255,255,.4)}
.fchips .fclr{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--bd);background:var(--cd);color:var(--dg);font-size:11.5px;font-weight:600}
.inf{font-size:11.5px;color:var(--mut);margin:2px 4px 6px}

/* Cards */
.ls{display:grid;gap:6px}
.card{display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;min-width:0;background:var(--cd);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh)}
.card:hover{border-color:var(--wl)}
.cm{flex:1;min-width:0}.cm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;font-size:13.5px}
.cm small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chs{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}.ch{font-size:10px;padding:0 6px;border-radius:6px;background:var(--wl);color:#fff;line-height:16px}.ch.o{background:transparent;border:1px solid var(--bd);color:var(--mut)}.ch.v{background:var(--ok);color:#fff}
.ca{display:flex;flex:none}.ca button{width:28px;height:32px;color:var(--mut);font-size:13px}.ca .dl{color:var(--dg)}
.vbadge{color:var(--ok);font-size:11px}
.em{text-align:center;padding:24px 10px;color:var(--mut);font-size:13px}.em i{font-size:28px;color:var(--wl);display:block;margin-bottom:6px}

/* Breadcrumb */
.cr{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin-bottom:6px;font-size:12.5px}.cr button{min-height:28px;padding:0 5px;color:var(--wl);font-weight:700;font-size:12.5px}.cr i{font-size:9px;color:var(--mut)}

/* Rows */
.rw{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;margin-bottom:6px;text-align:start;background:var(--cd);border:1px solid var(--bd);border-radius:10px;font-size:13px}.rw span{flex:1;min-width:0;overflow-wrap:anywhere}.rw em{font-style:normal;color:var(--mut);font-size:11.5px}.rw>i:first-child{color:var(--wl);width:18px;font-size:13px}

/* Buttons */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:38px;padding:0 12px;border-radius:10px;background:var(--wl);color:#fff;font-weight:700;text-decoration:none;min-width:0;font-size:13px}
.bt.g{background:transparent;border:1px solid var(--bd);color:var(--ink)}.bt.d{background:var(--dg);color:#fff}.bt.w{background:#25D366;color:#fff}.bt.o{background:#F2A900;color:#111B21}
.bt:disabled{opacity:.5;cursor:not-allowed}

/* Modal */
#md{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);display:none;place-items:center;padding:8px;overflow-y:auto}
#md.on{display:grid}
.mb{width:100%;max-width:420px;max-height:94vh;overflow-y:auto;padding:14px;background:var(--bg);border:1px solid var(--bd);border-radius:16px;animation:sc .16s ease-out;margin:auto}
[data-theme=dark] .mb{background:#111B21}
@keyframes sc{from{transform:scale(.92);opacity:0}}
.mb h2{font-size:16px;text-align:center;margin-bottom:8px;color:var(--ink)}
.mb .lead{text-align:center;color:var(--mut);font-size:12px;margin-bottom:10px}
.ac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}.ac .full{grid-column:1/-1}
.fl{display:block;margin-bottom:8px}.fl span{font-size:12px;font-weight:700}.fl input,.fl select{width:100%;height:40px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);padding:0 8px;font-size:14px}.fl.er input{border-color:var(--dg)}

/* Profile card */
.pr{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12.5px}.pr i{color:var(--wl);width:16px;margin-top:3px}.pr small{display:block;color:var(--mut);font-size:11px}.pr div{min-width:0;overflow-wrap:anywhere}
.vcard{border-radius:16px;overflow:hidden;background:var(--cd);border:1px solid var(--bd);margin-bottom:10px;box-shadow:0 4px 14px rgba(11,20,26,.1);position:relative}
.vhead{background:linear-gradient(135deg,#075E54 0%,#128C7E 100%);color:#fff;padding:16px 14px 14px;text-align:center;position:relative;overflow:hidden}
.vhead::before{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:rgba(37,211,102,.18)}
.vhead::after{content:"";position:absolute;inset-inline-start:-25px;bottom:-25px;width:80px;height:80px;border-radius:50%;background:rgba(18,140,126,.22)}
.vlogo{width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;font-size:26px;margin:0 auto 8px;font-weight:700;border:3px solid rgba(255,255,255,.18);position:relative;z-index:1}
.vname{font-size:16px;font-weight:700;line-height:1.2;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.vname .vbadge{color:#25D366;font-size:13px}
.vsub{font-size:11.5px;opacity:.85;margin-top:3px;position:relative;z-index:1}
.vtags{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap;position:relative;z-index:1}
.vtag{font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.22);font-weight:600}
.vtag.v{background:var(--ok);border-color:var(--ok)}
.vqr{position:absolute;top:10px;inset-inline-end:10px;width:44px;height:44px;background:#fff;border-radius:6px;padding:2px;z-index:5;display:grid;place-items:center}
.vqr img{width:100%;height:100%;border-radius:4px}
.vbody{padding:8px 12px}
.vrow{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--bd);align-items:flex-start}
.vrow:last-child{border-bottom:0}
.vrow .vic{width:28px;height:28px;border-radius:50%;background:var(--acs);color:var(--wl);display:grid;place-items:center;flex:none;font-size:12px}
.vrow .vtxt{flex:1;min-width:0}
.vrow .vk{font-size:10.5px;color:var(--mut);font-weight:600;margin-bottom:0}
.vrow .vv{font-size:13px;color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.vrow a.vv{color:var(--wl);text-decoration:none}
.vrow a.vv:hover{text-decoration:underline}
.vfoot{padding:8px 12px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.vfoot .bt{min-height:36px;font-size:12px;padding:0 8px}
.vfoot .full{grid-column:1/-1}

/* Filter modal */
.fmodal-h{text-align:center;margin-bottom:10px}
.fmodal-h h2{font-size:16px;margin-bottom:2px}
.fmodal-h .sub{font-size:11.5px;color:var(--mut)}
.fsect{display:flex;align-items:center;gap:8px;width:100%;padding:10px;border-radius:10px;text-align:start;background:var(--cd);border:1px solid var(--bd);margin-bottom:6px;transition:.15s}
.fsect:hover{border-color:var(--wl)}
.fsect.on{background:var(--acs);border-color:var(--wl)}
.fsect .ic{width:26px;height:26px;border-radius:50%;background:var(--acs);color:var(--wl);display:grid;place-items:center;flex:none;font-size:12px}
.fsect.on .ic{background:var(--wl);color:#fff}
.fsect .name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:13px}
.fsect .val{font-size:11.5px;color:var(--wl);font-weight:700;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsect .num{font-size:11px;color:var(--mut);min-width:20px;text-align:center}
.fsect .chev{color:var(--mut);font-size:10px}
.fback{display:flex;align-items:center;gap:4px;color:var(--wl);font-weight:700;font-size:12.5px;margin-bottom:8px;padding:4px 2px}
.fback i{font-size:10px}
.sortbar{display:flex;gap:4px;margin-bottom:8px}
.sortbtn{flex:1;height:30px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);color:var(--mut);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:3px}
.sortbtn.on{background:var(--acs);border-color:var(--wl);color:var(--wl)}
.sortbtn i{font-size:10px}
.fopt{display:flex;align-items:center;gap:8px;width:100%;padding:10px;border-radius:10px;text-align:start;background:var(--cd);border:1px solid var(--bd);margin-bottom:5px;transition:.15s}
.fopt:hover{border-color:var(--wl)}
.fopt.on{background:var(--acs);border-color:var(--wl)}
.fopt .box{width:18px;height:18px;border-radius:5px;flex:none;border:2px solid var(--bd);display:grid;place-items:center;color:transparent;font-size:10px}
.fopt.on .box{border-color:var(--wl);background:var(--wl);color:#fff}
.fopt .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:13px}
.fopt.on .name{font-weight:700;color:var(--wl)}
.fopt .n{font-size:11.5px;color:var(--mut)}
.fopt:disabled{opacity:.4;cursor:not-allowed}
.fopt:disabled:hover{border-color:var(--bd)}
.fopt.clear{border-style:dashed;color:var(--dg)}
.fopt.clear .name{color:var(--dg)}

/* Me card */
.meCard{background:linear-gradient(135deg,#075E54,#128C7E);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;border:2px solid #25D366}
.meCard .mav{width:42px;height:42px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;font-size:17px;font-weight:700;flex:none}
.meCard .mBody{flex:1;min-width:0}
.meCard .mName{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.meCard .mSub{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.meCard .mTag{display:inline-block;font-size:9.5px;background:rgba(37,211,102,.3);border:1px solid #25D366;padding:1px 6px;border-radius:7px;margin-top:3px}
.meCard .mChev{color:rgba(255,255,255,.7);font-size:13px}

/* Code box */
.code-box{display:flex;align-items:center;gap:6px;padding:10px;background:var(--acs);border:2px dashed var(--wl);border-radius:10px;margin:8px 0}
.code-box .code{flex:1;font-family:'Courier New',monospace;font-size:18px;font-weight:700;letter-spacing:2px;color:var(--wl);text-align:center;direction:ltr;user-select:all;padding:4px 0}
.code-box .cp{width:34px;height:34px;border-radius:50%;background:var(--wl);color:#fff;display:grid;place-items:center;flex:none;font-size:13px}
.code-box .cp:hover{opacity:.85}
.code-hint{font-size:11px;color:var(--mut);text-align:center;margin-top:4px}
.code-note{font-size:11.5px;color:var(--mut);padding:8px;background:var(--bg);border-radius:8px;margin:8px 0;line-height:1.6}
.code-note b{color:var(--wl)}

/* Auth */
.auth-hub{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.auth-btn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);text-align:start;transition:.15s}
.auth-btn:hover{border-color:var(--wl);transform:translateY(-1px);box-shadow:0 3px 10px rgba(11,20,26,.08)}
.auth-btn.primary{background:linear-gradient(135deg,#075E54,#128C7E);color:#fff;border-color:transparent}
.auth-btn.primary:hover{box-shadow:0 5px 14px rgba(7,94,84,.22)}
.auth-btn .ai{width:40px;height:40px;border-radius:50%;background:var(--acs);color:var(--wl);display:grid;place-items:center;font-size:17px;flex:none}
.auth-btn.primary .ai{background:#25D366;color:#fff}
.auth-btn .at{flex:1;min-width:0}
.auth-btn .at b{display:block;font-size:14px;margin-bottom:1px}
.auth-btn .at small{font-size:11px;opacity:.75;line-height:1.3}
.auth-btn.primary .at small{opacity:.85}
.auth-btn .chev{color:var(--mut);font-size:12px}
.auth-btn.primary .chev{color:rgba(255,255,255,.7)}

/* Source bar */
.srcbar{display:flex;gap:4px;margin-bottom:8px;padding:3px;background:var(--cd);border:1px solid var(--bd);border-radius:10px}
.srcbar button{flex:1;height:34px;border-radius:8px;font-size:12px;font-weight:700;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:4px}
.srcbar button.on{background:var(--wl);color:#fff}
.srcbar button i{font-size:11px}
.sortbar2{display:flex;gap:4px;margin-bottom:8px}
.sortbar2 button{flex:1;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);color:var(--mut);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.sortbar2 button.on{background:var(--acs);border-color:var(--wl);color:var(--wl)}
.sortbar2 button i{font-size:10px}

/* PDF */
.pdf-stage{position:fixed;left:-99999px;top:0;width:1200px;height:auto}
.pdf-card{width:1200px;background:#fff;color:#111B21;font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;display:flex;flex-direction:row;min-height:520px;overflow:hidden;position:relative}
.pdf-left{flex:0 0 480px;background:#075E54;color:#fff;padding:60px 50px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}
.pdf-left::before{content:"";position:absolute;right:-120px;top:-120px;width:320px;height:320px;border-radius:50%;background:rgba(37,211,102,.15)}
.pdf-left::after{content:"";position:absolute;left:-100px;bottom:-100px;width:280px;height:280px;border-radius:50%;background:rgba(18,140,126,.22)}
.pdf-shape{position:absolute;top:0;right:0;width:150px;height:100%;overflow:hidden;z-index:1}
.pdf-shape::before{content:"";position:absolute;top:-10%;left:0;width:100%;height:55%;background:#25D366;transform:skewY(-22deg);transform-origin:top left}
.pdf-shape::after{content:"";position:absolute;top:45%;left:0;width:100%;height:55%;background:#25D366;transform:skewY(22deg);transform-origin:top left}
.pdf-logo{width:170px;height:170px;border-radius:50%;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:700;border:18px solid #25D366;margin-bottom:24px;position:relative;z-index:2;box-sizing:content-box}
.pdf-name{font-size:34px;font-weight:700;line-height:1.2;position:relative;z-index:2;margin-top:6px}
.pdf-sub{font-size:17px;opacity:.85;margin-top:10px;position:relative;z-index:2}
.pdf-tags{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap;position:relative;z-index:2}
.pdf-tag{font-size:13px;padding:5px 14px;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);font-weight:600}
.pdf-tag.v{background:#25D366;border-color:#25D366;color:#075E54}
.pdf-right{flex:1;background:#fff;padding:50px 40px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.pdf-row{display:flex;align-items:center;gap:18px;padding:8px 0}
.pdf-row .ic{width:52px;height:52px;border-radius:50%;background:transparent;color:#25D366;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:26px}
.pdf-row .k{font-size:12px;color:#667781;font-weight:600;margin-bottom:3px}
.pdf-row .v{font-size:18px;color:#111B21;font-weight:600;word-break:break-word}
.pdf-qr{position:absolute;bottom:28px;left:40px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:5}
.pdf-qr img{width:90px;height:90px;border:3px solid #075E54;border-radius:8px;background:#fff;padding:3px}

.stk{position:sticky;top:calc(54px + var(--st));z-index:5;background:var(--bg);padding:6px 0 2px}
.hz{height:5px;border-radius:3px;margin-bottom:8px;background:repeating-linear-gradient(-45deg,#25D366 0 8px,#075E54 8px 16px)}
.seg{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}.seg i{display:block;min-width:3px}
.cols{display:grid;gap:0 8px;grid-template-columns:minmax(0,1fr)}@media(min-width:640px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}

.bar2 i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--acs)}.bar2 span,.bar2 b{position:relative}.bar2 span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}
.stat{padding:8px;background:var(--cd);border:1px solid var(--bd);border-radius:9px;text-align:center}
.stat b{display:block;font-size:18px;color:var(--wl);margin-bottom:1px}
.stat span{font-size:10.5px;color:var(--mut)}
.stat.warn b{color:var(--dg)}
.log-row{padding:6px 0;border-bottom:1px solid var(--bd);font-size:11.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.log-row .lg-time{font-size:10px;color:var(--mut);min-width:100px}
.log-row .lg-act{font-weight:600;padding:0 5px;border-radius:3px;font-size:10px}
.log-row .lg-act.add{background:#D1FAE5;color:#065F46}
.log-row .lg-act.del{background:#FEE2E2;color:#991B1B}
.log-row .lg-act.edit{background:#DBEAFE;color:#1E40AF}
.log-row .lg-act.sync{background:#FEF3C7;color:#92400E}
.log-row .lg-act.key{background:#FCE7F3;color:#9D174D}

<body>
<div id="ld" class="on" role="status" aria-label="Chargement"><i class="fa-solid fa-circle-notch"></i></div>
<header>
  <div class="lg"><i class="fa-solid fa-comments"></i></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script>
(()=>{'use strict';
const FBC={apiKey:"AIzaSyBQKPqut41Jqs28Zn_z-I_ffD-iNCnFpdU",authDomain:"said-rahil-default-rtdb.firebaseio.com",databaseURL:"https://said-rahil-default-rtdb.firebaseio.com/",projectId:"said-rahil",storageBucket:"said-rahil.firebasestorage.app"};
const CSV_EXPERTS="https://docs.google.com/spreadsheets/d/e/2PACX-1vSjj2c3fjfHowy8yxOfpVAsfXLRVgSQPJQ7PVc4wvI2dI7g0hQwF32QoByKExzadiHivu3oKYRpgWKK/pub?gid=42570462&single=true&output=csv";
const CSV_FOURNISSEURS="https://docs.google.com/spreadsheets/d/e/2PACX-1vT9oFi63lhgtX8h-DstURguy8B5Vv6GmzTqDWIWSEVXDcicvyeZd7iyVX8gZ2ldtMC8YRRVsUOzG92G/pub?gid=587124901&single=true&output=csv";
const ADMIN_PASS='1';
const ADMIN_WHATSAPP='212690292010';
const RESET_TTL=24*60*60*1000;
const TK={fournisseurs:'FOURNISSEURS',experts:'EXPERTS'},CK={services:'SERVICES',products:'PRODUITS',maqola:'MAQAOLA','yad-amila':'YAD AMILA'};
const TL={fournisseurs:'مورّد',experts:'خبير'},CL={services:'خدمات',products:'منتجات',maqola:'مقاولة','yad-amila':'يد عاملة'};
const CI={services:'fa-screwdriver-wrench',products:'fa-boxes-stacked',maqola:'fa-helmet-safety',['yad-amila']:'fa-people-carry-box'};
const DOMI={'البناء':'fa-hard-hat','التجارة':'fa-store','تكنولوجيا':'fa-laptop-code','الصناعة':'fa-industry','السياحة':'fa-plane','الصحة':'fa-heart-pulse','الثقافة':'fa-landmark','التعليم':'fa-graduation-cap','الفلاحة':'fa-seedling','النقل':'fa-truck','المالية':'fa-coins','الغذاء':'fa-utensils','الطاقة':'fa-bolt'};
const domIcon=d=>DOMI[String(d||'').trim()]||'fa-briefcase';
const FLD={type:'type',cat:'categorie',dom:'domaine',spe:'specialite',ville:'ville'},FN={type:'النوع',cat:'التصنيف',dom:'القطاع',spe:'التخصص',ville:'المدينة'};
const PAL=['#075E54','#128C7E','#34699A','#7A3E9D','#B3541E','#8A6D0B','#9A3B5C','#2F6F4F','#4C5A9E','#5B6B1F'];
const SECTIONS=[
  {k:'type', label:'النوع',    icon:'fa-tag'},
  {k:'cat',  label:'التصنيف',  icon:'fa-layer-group'},
  {k:'dom',  label:'القطاع',   icon:'fa-industry'},
  {k:'spe',  label:'التخصص',   icon:'fa-screwdriver-wrench'},
  {k:'ville',label:'المدينة',  icon:'fa-location-dot'},
];
const S={
  db:[],fbCache:[],csvCache:[],csvBusy:false,viewSrc:'fb',
  f:{type:[],cat:[],dom:[],ville:[],spe:[],q:''},
  tab:'home',fav:[],
  admin:sessionStorage.getItem('cp-admin')==='1',
  exp:{t:'',d:'',s:''},expQ:'',expSort:'name',
  cur:null,fb:null,lim:60,busy:false,fp:'sections',fk:null,sortF:{},mode:null,tmpUid:null,tmpRec:null,
  usersList:null,usersTab:'with',usersQuery:''
};
try{S.fav=JSON.parse(localStorage.getItem('cp-fav')||'[]')}catch{}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase().replace(/\s+/g,' ').trim();
const hit=(v,q)=>{const n=norm(v);return norm(q).split(' ').every(t=>n.includes(t))};
const getInits=n=>String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const color=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const fmtPhone=p=>{let d=String(p||'').replace(/[^\d+]/g,'');if(!d)return'';if(d.startsWith('00'))d='+'+d.slice(2);if(d.startsWith('+'))return d;if(d.startsWith('0'))return'+212'+d.slice(1);if(d.startsWith('212'))return'+'+d;return d};
const validPhone=p=>{const f=fmtPhone(p);return /^\+\d{9,15}$/.test(f)};
const phoneVariants=p=>{const d=String(p||'').replace(/[^\d]/g,'');if(!d)return[];const out=new Set();out.add(String(p).trim());out.add('+'+d);if(d.startsWith('212')){out.add('0'+d.slice(3));out.add(d);out.add('+'+d)}if(d.startsWith('0')){out.add('+212'+d.slice(1));out.add('212'+d.slice(1));out.add(d)}if(d.length===9){out.add('+212'+d);out.add('0'+d);out.add('212'+d)}return[...out].filter(Boolean)};
const uid=()=>`${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
const url=w=>{if(!w)return'';const u=/^https?:\/\//i.test(w)?w:'https://'+w;return/^https?:\/\/\S+$/i.test(u)?u:''};
const shown=v=>v&&v!=='Autre'&&v!=='Général'?v:'';
let tt;const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2500)};
const setLoading=b=>$('#ld').classList.toggle('on',b);
const openOverlay=h=>{$('#md').innerHTML=`<div class="mb">${h}</div>`;$('#md').classList.add('on');document.body.style.overflow='hidden'};
const closeOverlay=()=>{$('#md').classList.remove('on');document.body.style.overflow=''};
const uniq=k=>[...new Set(S.db.map(r=>(r[k]||'').trim()).filter(Boolean))];
const byId=id=>S.db.find(r=>r.id===id);
const lbl=(k,v)=>k==='type'?TL[v]||v:k==='cat'?CL[v]||v:v;
const clearFilters=()=>{S.f={type:[],cat:[],dom:[],ville:[],spe:[],q:''};$('#q').value='';S.lim=60};
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0);
function applySource(){if(S.admin&&S.viewSrc==='csv'&&S.csvCache.length){S.db=S.csvCache;}else{S.db=S.fbCache;}}
function theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('cp-theme',d)}catch{}themeIcon()}
const themeIcon=()=>$('#hth').innerHTML=`<i class="fa-solid ${document.documentElement.dataset.theme==='dark'?'fa-sun':'fa-moon'}"></i>`;

/* NAV — 4 buttons now (removed favorites tab) */
function nav(){
  const items=[
    {id:'home', label:'الرئيسية', icon:'fa-house'},
    {id:'dir',  label:'الدليل',   icon:'fa-address-book'},
    {id:'fil',  label:'فلتر',     icon:'fa-sliders'},
    {id:'exp',  label:'المستكشف', icon:'fa-sitemap'}
  ];
  const nf=activeCount();
  $('#nav').innerHTML=items.map(i=>{
    if(i.id==='fil')return `<button class="nv${nf>0?' on':''}" data-a="fopen" aria-label="فلتر"><i class="fa-solid ${i.icon}"></i>${i.label}${nf>0?`<span class="nb">${nf}</span>`:''}</button>`;
    return `<button class="nv ${S.tab===i.id?'on':''}" data-a="tab" data-v="${i.id}"><i class="fa-solid ${i.icon}"></i>${i.label}</button>`;
  }).join('');
}
function go(t){S.tab=t;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+t));nav();({home:dashboard,dir:directory,exp:explorer})[t]();scrollTo(0,0)}

/* FILTER */
function match(r,skip){
  for(const k in FLD){
    if(k===skip)continue;
    const arr=S.f[k];
    if(arr.length && !arr.some(v=>norm(r[FLD[k]])===norm(v)))return false;
  }
  return !S.f.q || hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.f.q);
}
const results=()=>S.db.filter(r=>match(r)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
function facet(k,sortBy='count'){
  const m=new Map();
  S.db.filter(r=>match(r,k)).forEach(r=>{const v=(r[FLD[k]]||'').trim();if(v)m.set(v,(m.get(v)||0)+1)});
  const arr=[...m];
  if(sortBy==='count') return arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
  return arr.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
}

/* CARD — no star/fav button */
const vBadge=r=>r.verified?'<i class="fa-solid fa-circle-check vbadge" title="موثّق"></i>':'';
const card=r=>`<div class="card" data-a="open" data-v="${esc(r.id)}" role="button" tabindex="0"><div class="av" style="background:${color(r.name)}">${esc(getInits(r.name))}</div><div class="cm"><b>${esc(r.name)} ${vBadge(r)}</b><small>${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</small><div class="chs"><span class="ch">${TL[r.type]}</span><span class="ch o">${CL[r.categorie]}</span>${r.verified?'<span class="ch v">موثّق</span>':''}</div></div><div class="ca"><button data-a="shr" data-v="${esc(r.id)}" aria-label="مشاركة"><i class="fa-solid fa-share-nodes"></i></button>${canEdit(r)?`<button data-a="edit" data-v="${esc(r.id)}" aria-label="تعديل"><i class="fa-solid fa-pen"></i></button>`:''}${S.admin?`<button class="dl" data-a="del" data-v="${esc(r.id)}" aria-label="حذف"><i class="fa-solid fa-trash"></i></button>`:''}</div></div>`;
const empty=t=>`<div class="em"><i class="fa-regular fa-face-frown"></i><b>${t}</b></div>`;
function meCard(){
  if(!S.user||!S.user.profileId)return '';
  const me=byId(S.user.profileId);if(!me)return '';
  return `<div class="meCard" data-a="open" data-v="${esc(me.id)}" role="button" tabindex="0">
    <div class="mav">${esc(getInits(me.name))}</div>
    <div class="mBody">
      <div class="mName">${esc(me.name)} ${vBadge(me)} <span class="mTag">ملفي</span></div>
      <div class="mSub">${esc([shown(me.domaine),me.ville].filter(Boolean).join(' · '))}</div>
    </div>
    <i class="fa-solid fa-chevron-left mChev"></i>
  </div>`;
}
function directory(){
  const chips=[];
  for(const k of Object.keys(FLD)){
    for(const v of S.f[k]){
      chips.push(`<span class="fchip">${esc(lbl(k,v))}<button class="x" data-a="chipx" data-k="${k}" data-v="${esc(v)}" aria-label="إزالة"><i class="fa-solid fa-xmark"></i></button></span>`);
    }
  }
  if(S.f.q.trim())chips.push(`<span class="fchip">بحث: ${esc(S.f.q.trim())}<button class="x" data-a="qx" aria-label="إزالة"><i class="fa-solid fa-xmark"></i></button></span>`);
  if(chips.length>1)chips.push(`<button class="fclr" data-a="clr">مسح الكل</button>`);
  $('#fchips').innerHTML=chips.join('');
  $('#meSlot').innerHTML=meCard();
  const r=results();
  $('#inf').textContent=`${r.length} من أصل ${S.db.length}`;
  $('#qx').hidden=!S.f.q;
  $('#ls').innerHTML=r.length
    ? r.slice(0,S.lim).map(card).join('') + (r.length>S.lim?`<button class="bt g" data-a="more">عرض المزيد (${r.length-S.lim})</button>`:'')
    : empty('لا توجد نتائج مطابقة');
}

/* FILTER MODAL */
function openFilter(presetK=null,presetV=null){
  S.fp=presetK?'pick':'sections';S.fk=presetK;
  if(presetK){
    S.f={type:[],cat:[],dom:[],ville:[],spe:[],q:''};
    $('#q').value='';
    S.lim=60;
    if(presetV)S.f[presetK]=[presetV];
  }
  renderFilter();$('#md').classList.add('on');document.body.style.overflow='hidden';
}
function renderFilter(){
  let html='';
  if(S.fp==='sections'){
    html=`<div class="fmodal-h"><h2>الفلاتر</h2><div class="sub">اختر قسمًا</div></div>`;
    html+=SECTIONS.map(s=>{
      const arr=S.f[s.k];const active=arr.length>0;
      let val='';
      if(arr.length===1)val=lbl(s.k,arr[0]);
      else if(arr.length>1)val=`${arr.length} مختارة`;
      const count=facet(s.k).length;
      return `<button class="fsect${active?' on':''}" data-a="fsect" data-v="${s.k}">
        <span class="ic"><i class="fa-solid ${s.icon}"></i></span>
        <span class="name">${esc(s.label)}</span>
        ${val?`<span class="val">${esc(val)}</span>`:`<span class="num">${count}</span>`}
        <span class="chev"><i class="fa-solid fa-chevron-left"></i></span>
      </button>`;
    }).join('');
    const n=activeCount();
    html+=`<div class="ac">
      <button class="bt g" data-a="fclr"${n?'':' disabled'}>مسح</button>
      <button class="bt" data-a="fdone">عرض (${n})</button>
    </div>`;
  }else{
    const sect=SECTIONS.find(s=>s.k===S.fk);
    const curSort=S.sortF[S.fk]||'count';
    html=`<button class="fback" data-a="fback"><i class="fa-solid fa-chevron-right"></i> رجوع</button>
      <div class="fmodal-h"><h2>${esc(sect.label)}</h2><div class="sub">اختيار متعدد</div></div>
      <div class="sortbar">
        <button class="sortbtn${curSort==='count'?' on':''}" data-a="fsort" data-v="count"><i class="fa-solid fa-arrow-down-wide-short"></i> الأكثر</button>
        <button class="sortbtn${curSort==='name'?' on':''}" data-a="fsort" data-v="name"><i class="fa-solid fa-arrow-down-a-z"></i> أبجدي</button>
      </div>`;
    const avail=facet(S.fk,curSort);
    const selected=S.f[S.fk];
    html+=avail.map(([v,n])=>{
      const on=selected.some(x=>norm(x)===norm(v));
      const disabled=n===0&&!on;
      return `<button class="fopt${on?' on':''}" data-a="fpick" data-v="${esc(v)}" ${disabled?'disabled':''}>
        <span class="box"><i class="fa-solid fa-check"></i></span>
        <span class="name">${esc(lbl(S.fk,v))}</span>
        <span class="n">${n}</span>
      </button>`;
    }).join('')||'<p class="em">لا قيم</p>';
    if(selected.length)html+=`<button class="fopt clear" data-a="fclearsec"><span class="box" style="border-color:transparent;color:transparent"></span><span class="name">إزالة (${selected.length})</span></button>`;
  }
  openOverlay(html);
}

/* EXPLORER */
const grp=(l,k)=>{const m=new Map();l.forEach(r=>{const v=r[k]||'—';m.set(v,(m.get(v)||0)+1)});return[...m].sort((a,b)=>a[0].localeCompare(b[0],'ar'))};
const matchExp=r=>!S.expQ||hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email,TL[r.type],CL[r.categorie]].join(' '),S.expQ);
function explorer(){
  const{t,d,s}=S.exp,cs=[['الرئيسية','']];if(t)cs.push([TL[t]+'ون','t']);if(d)cs.push([d,'d']);if(s)cs.push([s,'s']);
  const sortBar=`<div class="sortbar2">
    <button class="${S.expSort==='count'?'on':''}" data-a="expSort" data-v="count"><i class="fa-solid fa-arrow-down-wide-short"></i> الأكثر</button>
    <button class="${S.expSort==='name'?'on':''}" data-a="expSort" data-v="name"><i class="fa-solid fa-arrow-down-a-z"></i> أبجدي</button>
  </div>`;
  const row=(ic,n,c,a,v)=>`<button class="rw" data-a="${a}" data-v="${esc(v)}"><i class="fa-solid ${ic}"></i><span>${esc(n)}</span><em>${c}</em><i class="fa-solid fa-chevron-left"></i></button>`;
  let h='',base=S.db.filter(r=>!t||r.type===t).filter(matchExp);
  const sortGroups=(arr)=>{
    if(S.expSort==='count') return arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
    return arr.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
  };
  if(S.expQ){
    h = base.length?'<div class="ls">'+base.map(card).join('')+'</div>':empty('لا نتائج');

async function makePDF(id){
  const r=byId(id);if(!r)return;
  if(!window.html2canvas||!window.jspdf){toast('PDF غير متاح');return}
  setLoading(true);
  let holder=null;
  try{
    holder=document.createElement('div');holder.className='pdf-stage';
    holder.innerHTML=buildPdfHtml(r);document.body.appendChild(holder);
    await new Promise(r=>setTimeout(r,700));
    const node=holder.querySelector('#pdf-src');
    const canvas=await html2canvas(node,{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});
    const img=canvas.toDataURL('image/jpeg',0.95);
    const {jsPDF}=window.jspdf;
    const ratio=canvas.height/canvas.width;
    const wmm=200,hmm=wmm*ratio;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[wmm,hmm]});
    pdf.addImage(img,'JPEG',0,0,wmm,hmm);
    pdf.save(`ConnectPro-${r.name.replace(/\s+/g,'_')}.pdf`);
    log('pdf',r.name);toast('تم توليد PDF');
  }catch(e){console.error(e);toast('خطأ')}
  finally{holder?.remove();setLoading(false)}
}

function h53(s,seed=0){let a=0xdeadbeef^seed,b=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
const sid=(t,n,p)=>'p'+h53(t+'|'+norm(n)+'|'+fmtPhone(p));
const sha=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch{return'f'+h53(s)+h53(s,7)}};
const ident=v=>{v=String(v).trim();return v.includes('@')?v.toLowerCase():fmtPhone(v)};
const uidOf=async i=>'u_'+(await sha('cp:'+i)).slice(0,24);

const log=(a,d)=>{try{S.fb?.ref('logs').push({t:Date.now(),u:S.admin?'admin':S.user?.name||'زائر',a,d:String(d||'')}).catch(()=>{})}catch{}};

function findMatch(i){return S.db.find(r=>!r.owner&&(i.includes('@')?norm(r.email)===norm(i):fmtPhone(r.phone)===fmtPhone(i)))}
function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
async function findUserByPhone(rawPhone){
  if(!S.fb||!rawPhone)return null;
  const raw=String(rawPhone).trim();
  const phone=fmtPhone(raw);
  const variants=phoneVariants(raw);
  for(const v of variants){
    const u=await uidOf(ident(v));
    const r=(await S.fb.ref('users/'+u).once('value')).val();
    if(r)return {uid:u,rec:r};
  }
  const all=(await S.fb.ref('users').once('value')).val()||{};
  const target=fmtPhone(raw);
  const targetDigits=target.replace(/\D/g,'');
  for(const [uid,u] of Object.entries(all)){
    if(!u||!u.ident)continue;
    const uIdent=String(u.ident).trim();
    const uPhone=fmtPhone(uIdent);
    const uDigits=uPhone.replace(/\D/g,'');
    if(uPhone===target)return {uid,rec:u};
    if(uDigits&&targetDigits&&uDigits===targetDigits)return {uid,rec:u};
    if(uDigits.length>=9&&targetDigits.length>=9&&uDigits.slice(-9)===targetDigits.slice(-9))return {uid,rec:u};
  }
  return null;
}
async function createAccountFor(profile){
  if(!S.admin||!needFb())return null;

  const exists=await findUserByPhone(phone);

  const u=await uidOf(ident(phone));
  const salt=uid();const tempCode=genCode();const hash=await sha(salt+tempCode);
  const rec={name:profile.name,ident:phone,salt,hash,profileId:profile.id,createdAt:Date.now()};
  await S.fb.ref('users/'+u).set(rec);

}

    <p class="lead">أدخل رمزك الحالي ثم الجديد</p>
    <label class="fl"><span>الرمز الحالي</span><input id="cp_old" type="password" autocomplete="current-password"></label>
    <label class="fl"><span>الرمز الجديد (6+)</span><input id="cp_new" type="password" autocomplete="new-password"></label>
    <label class="fl"><span>تأكيد الرمز الجديد</span><input id="cp_new2" type="password" autocomplete="new-password"></label>
    <div class="ac">
      <button class="bt g" data-a="cls">إلغاء</button>
      <button class="bt" data-a="doChangePass">حفظ</button>
    </div>`);
  setTimeout(()=>$('#cp_old').focus(),50);
}
async function doChangePass(){
  if(!S.user||!needFb())return;
  const oldP=$('#cp_old').value,newP=$('#cp_new').value,newP2=$('#cp_new2').value;
  if(!oldP||!newP)return toast('أدخل الرمزين');
  if(newP.length<6)return toast('الرمز الجديد قصير');
  if(newP!==newP2)return toast('التأكيد غير مطابق');
  setLoading(true);
  try{
    const r=(await S.fb.ref('users/'+S.user.id).once('value')).val();
    if(!r){toast('الحساب غير موجود');return}
    const okOld=await sha(r.salt+oldP);
    if(r.hash!==okOld){toast('الرمز الحالي غير صحيح');return}
    const salt=uid();
    const hash=await sha(salt+newP);
    await S.fb.ref('users/'+S.user.id).update({salt,hash,resetCode:null,resetExpiry:null});
    log('pass-change',S.user.name);
    closeOverlay();toast('تم تغيير الرمز السري');
  }catch(e){console.error(e);toast('خطأ')}
  finally{setLoading(false)}
}

/* GEN FROM FILE */
async function rgenFile(id){
  if(!S.admin||!needFb())return;
  const r=byId(id);if(!r)return;
  const raw=r.phone?String(r.phone).trim():'';
  if(!raw)return toast('لا رقم');
  setLoading(true);
  try{
    let found=await findUserByPhone(raw);
    let autoCreated=false;
    if(!found){
      if(!confirm(`لا حساب بهذا الرقم.\nإنشاء حساب فوريًا لـ ${fmtPhone(raw)}؟`))return;
      const created=await createAccountFor(r);
      if(!created){toast('تعذر');return}
      found=created;autoCreated=true;
    }
    const {uid:uidVal,rec}=found;
    const code=genCode();
    const hash=await sha('reset:'+code+':'+rec.salt);
    const expiry=Date.now()+RESET_TTL;
    await S.fb.ref('users/'+uidVal).update({resetCode:hash,resetExpiry:expiry});
    log('reset-gen',rec.name);const wa=fmtPhone(rec.ident).replace(/\D/g,'');
    const msg=`مرحباً ${rec.name}،\nرمزك السري المؤقت: *${code}*\n\nادخل → تسجيل الدخول → رقمك → الرمز.\n\nصالح 24 ساعة.`;
    openOverlay(`<h2>تم التوليد</h2>${autoCreated?'<div class="code-note" style="background:#D1FAE5;color:#065F46"><b>✓ تم إنشاء حساب تلقائيًا</b></div>':''}
      <p class="lead">أرسله إلى <b>${esc(rec.name)}</b> (${esc(rec.ident)})</p>
      <div class="code-box"><div class="code" id="rcode">${code}</div><button class="cp" data-a="rcopy" data-v="${esc(code)}"><i class="fa-solid fa-copy"></i></button></div>
      <div class="code-hint">ينتهي: ${esc(new Date(expiry).toLocaleString('ar-MA'))}</div>
      <div class="ac"><button class="bt g" data-a="cls">إغلاق</button><a class="bt w" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> إرسال</a></div>`);
    toast('تم التوليد');
  }catch(e){console.error(e);toast('خطأ')}finally{setLoading(false)}
}

function adminGen(){
  if(!S.admin||!needFb())return;
  openOverlay(`<h2>توليد رمز</h2><p class="lead">أدخل الرقم أو البريد</p>
    <label class="fl"><span>الهاتف / البريد</span><input id="ag_phone" type="text" dir="ltr" placeholder="+2126..." autocomplete="off"></label>
    <div class="ac"><button class="bt g" data-a="cls">إلغاء</button><button class="bt" data-a="agFind">بحث</button></div>
    <div id="ag_result" style="margin-top:10px"></div>`);
  setTimeout(()=>$('#ag_phone').focus(),50);
  $('#ag_phone').onkeydown=e=>e.key==='Enter'&&A.agFind();
}
async function agFind(){
  if(!S.admin||!needFb())return;
  const raw=$('#ag_phone').value.trim();
  if(!raw)return toast('أدخل');
  setLoading(true);
  try{
    const found=await findUserByPhone(raw);
    if(!found){
      const profile=S.db.find(r=>fmtPhone(r.phone)===fmtPhone(raw));
      if(profile){
        $('#ag_result').innerHTML=`<div class="em" style="padding:14px;margin-bottom:8px"><i class="fa-solid fa-user-plus" style="color:var(--ok)"></i><b>يوجد ملف بدون حساب</b><div style="font-size:11px;margin-top:3px">${esc(profile.name)}</div></div><button class="bt w full" data-a="agCreate" data-v="${esc(profile.id)}"><i class="fa-solid fa-user-plus"></i> إنشاء حساب + رمز</button>`;
        return;
      }
      const all=(await S.fb.ref('users').once('value')).val()||{};
      $('#ag_result').innerHTML=`<div class="em" style="padding:14px"><i class="fa-solid fa-user-xmark"></i><b>لا يوجد</b><div style="font-size:11px;margin-top:3px">حسابات: ${Object.keys(all).length}</div></div>`;
      return;
    }
    const {uid:uidVal,rec}=found;
    $('#ag_result').innerHTML=`<div style="border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px"><div class="av" style="background:${color(rec.name)}">${esc(getInits(rec.name))}</div><div style="flex:1"><b style="font-size:13px">${esc(rec.name)}</b><br><small dir="ltr" style="color:var(--mut);font-size:11px">${esc(rec.ident)}</small></div></div></div><button class="bt w full" data-a="agGen" data-v="${esc(uidVal)}"><i class="fa-solid fa-key"></i> توليد رمز</button>`;
  }catch(e){console.error(e);toast('خطأ')}finally{setLoading(false)}
}
async function agCreate(profileId){
  if(!S.admin||!needFb())return;
  const profile=byId(profileId);if(!profile)return;
  setLoading(true);
  try{
    const created=await createAccountFor(profile);
    if(!created){toast('تعذر');return}
    toast('تم — جاري التوليد...');
    await agGen(created.uid);
  }catch(e){console.error(e);toast('خطأ')}finally{setLoading(false)}
}
async function agGen(uidVal){
  if(!S.admin||!needFb())return;
  setLoading(true);
  try{
    const rec=(await S.fb.ref('users/'+uidVal).once('value')).val();
    if(!rec){toast('غير موجود');return}
    const code=genCode();const hash=await sha('reset:'+code+':'+rec.salt);const expiry=Date.now()+RESET_TTL;
    await S.fb.ref('users/'+uidVal).update({resetCode:hash,resetExpiry:expiry});
    log('admin-gen',rec.name);const wa=fmtPhone(rec.ident).replace(/\D/g,'');
    const msg=`مرحباً ${rec.name}،\nرمزك السري المؤقت: *${code}*\n\nادخل → تسجيل الدخول → رقمك → الرمز.\n\nصالح 24 ساعة.`;
    openOverlay(`<h2>تم التوليد</h2><p class="lead">أرسله إلى <b>${esc(rec.name)}</b></p>
      <div class="code-box"><div class="code" id="rcode">${code}</div><button class="cp" data-a="rcopy" data-v="${esc(code)}"><i class="fa-solid fa-copy"></i></button></div>
      <div class="code-hint">ينتهي: ${esc(new Date(expiry).toLocaleString('ar-MA'))}</div>
      <div class="ac"><button class="bt g" data-a="cls">إغلاق</button><a class="bt w" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> إرسال</a></div>`);
    toast('تم');
  }catch(e){console.error(e);toast('خطأ')}finally{setLoading(false)}

/* ADMIN PANEL */
async function adminPanel(){
  if(!S.admin||!needFb())return;
  setLoading(true);
  try{
    const [usersRaw,logsRaw,profsRaw]=await Promise.all([S.fb.ref('users').once('value'),S.fb.ref('logs').limitToLast(50).once('value'),S.fb.ref('professionals').once('value')]);
    S.usersList={users:Object.entries(usersRaw.val()||{}),logs:Object.values(logsRaw.val()||{}).reverse(),profs:mapRaw(profsRaw.val())};
    S.usersTab='with';S.usersQuery='';
    renderUsersPanel();
  }catch(e){console.error(e);toast('تعذر')}finally{setLoading(false)}
}
function renderUsersPanel(){
  if(!S.usersList)return;
  const {users,logs,profs}=S.usersList;
  const userProfileIds=new Set(users.filter(([,u])=>u.profileId).map(([,u])=>u.profileId));
  const profilesNoAccount=profs.filter(p=>!p.owner && !userProfileIds.has(p.id));
  const stats=`<div class="stats">
    <div class="stat"><b>${profs.length}</b><span>ملفات</span></div>
    <div class="stat"><b>${users.length}</b><span>حسابات</span></div>
    <div class="stat ${profilesNoAccount.length?'warn':''}"><b>${profilesNoAccount.length}</b><span>بدون حساب</span></div>
    <div class="stat"><b>${users.filter(([,u])=>u.resetCode&&u.resetExpiry>Date.now()).length}</b><span>رموز نشطة</span></div>
  </div>`;
  const tabs=`<div class="srcbar" style="margin-bottom:8px">
    <button class="${S.usersTab==='with'?'on':''}" data-a="utab" data-v="with">حسابات (${users.length})</button>
    <button class="${S.usersTab==='no'?'on':''}" data-a="utab" data-v="no">بدون حساب (${profilesNoAccount.length})</button>
  </div>`;
  let content='';
  if(S.usersTab==='with'){
    const q=S.usersQuery;
    const filtered=users.filter(([,u])=>!q||hit([u.name,u.ident].join(' '),q));
    content=`<label class="fl"><input type="search" id="uq" placeholder="بحث..." value="${esc(q)}"></label>
      <div style="max-height:260px;overflow-y:auto">${filtered.length?filtered.map(([id,u])=>`<div class="pr"><div style="flex:1"><b>${esc(u.name)}</b><small dir="ltr">${esc(u.ident)}</small>${u.resetCode&&u.resetExpiry>Date.now()?'<small style="color:#92400E">🔑 رمز نشط</small>':''}</div><button class="hb" style="color:var(--wl);width:30px;height:30px" data-a="agGen" data-v="${esc(id)}"><i class="fa-solid fa-key"></i></button><button class="hb" style="color:var(--dg);width:30px;height:30px" data-a="udel" data-v="${esc(id)}"><i class="fa-solid fa-user-slash"></i></button></div>`).join(''):'<p class="em">لا نتائج</p>'}</div>`;
  }else{
    content=`<div style="max-height:300px;overflow-y:auto">${profilesNoAccount.length?profilesNoAccount.map(p=>`<div class="pr"><div style="flex:1"><b>${esc(p.name)}</b><small dir="ltr">${esc(fmtPhone(p.phone)||'—')}</small><small>${esc([shown(p.domaine),p.ville].filter(Boolean).join(' · '))}</small></div><button class="bt o" style="min-height:30px;padding:0 8px;font-size:11px" data-a="agCreate" data-v="${esc(p.id)}"><i class="fa-solid fa-user-plus"></i> إنشاء + رمز</button></div>`).join(''):'<p class="em">كلها مرتبطة ✓</p>'}</div>`;
  }
  const logColor={add:'add',delete:'del',edit:'edit','csv-push':'sync','reset-gen':'key','admin-gen':'key',signup:'add',login:'login','pass-change':'edit','account-auto':'add'};
  const logsHtml=logs.slice(0,15).map(l=>{
    const cls=logColor[l.a]||'';
    return `<div class="log-row"><span class="lg-time">${esc(new Date(l.t).toLocaleString('ar-MA'))}</span><span class="lg-act ${cls}">${esc(l.a)}</span><span style="flex:1">${esc(l.d)} · ${esc(l.u)}</span></div>`;
  }).join('')||'<p class="em">لا نشاط</p>';
  openOverlay(`<h2>لوحة الإدارة</h2>${stats}${tabs}${content}<h3 class="t" style="margin-top:12px">سجل النشاط</h3><div style="max-height:200px;overflow-y:auto">${logsHtml}</div><div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
  const uq=$('#uq');
  if(uq)uq.oninput=e=>{clearTimeout(uq._t);uq._t=setTimeout(()=>{S.usersQuery=e.target.value;renderUsersPanel();const el=$('#uq');if(el){el.focus();el.setSelectionRange(9999,9999)}},150)};
}
async function udel(id){if(!S.admin||!needFb()||!confirm('حذف المستخدم؟'))return;try{await S.fb.ref('users/'+id).remove();log('user-del',id);toast('تم');adminPanel()}catch{toast('خطأ')}}

/* EVENTS */
const A={
  theme,adm,add:()=>canAdd()?form(null):toast('غير مسموح'),acc:account,usr:adminPanel,udel,udelme:deleteMyAccount,
  alogin:openLogin,asignup:openSignup,doLogin,doSignup,setDurable,forgotopen:forgotOpen,fqFind,
  changepass:changePassword,doChangePass,
  uout(){S.user=null;saveSess();adminUI();closeOverlay();toast('خرجت');go(S.tab)},
  findme:claimCancel,claimsearch:claimSearch,claimsend:claimSend,resetreq:resetReq,rgenfile:rgenFile,
  admingen:adminGen,agFind,agGen,agCreate,
  utab(v){S.usersTab=v;S.usersQuery='';renderUsersPanel()},
  copylink(v){navigator.clipboard?.writeText(v).then(()=>toast('تم نسخ الرابط')).catch(()=>toast('تعذر'))},
  rcopy(v){navigator.clipboard?.writeText(v).then(()=>toast('تم النسخ')).catch(()=>toast('تعذر'))},
  srcfb(){if(!S.admin)return;S.viewSrc='fb';applySource();go('home')},
  srccsv(){if(!S.admin)return;if(!S.csvCache.length){toast('اجلب CSV أولاً');csvFetch();return}S.viewSrc='csv';applySource();go('home')},
  csvfetch:()=>csvFetch(false),csvpush:csvPush,
  tab:v=>S.tab===v?(v==='dir'?(clearFilters(),directory()):v==='exp'?(S.exp={t:'',d:'',s:''},S.expQ='',explorer()):scrollTo({top:0,behavior:'smooth'})):go(v),
  cls:closeOverlay,open:profile,shr:share,pdf:makePDF,
  edit:id=>{const r=byId(id);canEdit(r)?form(r):toast('غير مسموح')},
  del:delAsk,delok:delOk,save,exp:exportCSV,vrf:verifyToggle,
  login(){if($('#pw').value===ADMIN_PASS){S.admin=true;sessionStorage.setItem('cp-admin','1');adminUI();closeOverlay();toast('مرحباً');csvFetch(true);go(S.tab)}else{$('#pw').parentElement.classList.add('er');toast('كلمة خاطئة')}},
  stat(v){
    const i=v.indexOf(':'),k=v.slice(0,i),x=v.slice(i+1);
    const pickMatch=v.match(/^pick:(.+)$/);
    if(pickMatch){openFilter(pickMatch[1]);return}
    clearFilters();S.f[k]=[x];go('dir');
  },
  /* Dashboard bar → direct filter (already working) */
  bardirect(v,el){
    const k=el.dataset.k;
    clearFilters();
    S.f[k]=[v];
    S.tab='dir';
    document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-dir'));
    nav();
    directory();
    scrollTo(0,0);
  },
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=60;directory();nav()},
  clr(){clearFilters();directory();nav()},
  more(){S.lim+=60;directory()},
  qx(){S.f.q='';$('#q').value='';directory()},
  favclr(){if(confirm('مسح كل المفضلة؟')){S.fav=[];try{localStorage.removeItem('cp-fav')}catch{}nav();bookmarks()}},
  xt:v=>{S.exp={t:v,d:'',s:''};S.expQ='';explorer()},xd:v=>{S.exp.d=v;S.exp.s='';S.expQ='';explorer()},xs:v=>{S.exp.s=v;S.expQ='';explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:''}:v==='t'?{t:x.t,d:'',s:''}:v==='d'?{t:x.t,d:x.d,s:''}:x;S.expQ='';explorer()},
  expSort(v){S.expSort=v;explorer()},
  fopen:openFilter,fcls:closeOverlay,
  fclr(){clearFilters();renderFilter();directory();nav()},
  fsect(v){S.fp='pick';S.fk=v;renderFilter()},
  fback(){S.fp='sections';S.fk=null;renderFilter()},
  fsort(v){S.sortF[S.fk]=v;renderFilter()},
  fclearsec(){S.f[S.fk]=[];S.lim=60;renderFilter();directory();nav()},
  fpick(v){
    const k=S.fk,arr=S.f[k];
    const i=arr.findIndex(x=>norm(x)===norm(v));
    if(i>=0)arr.splice(i,1);else arr.push(v);
    S.lim=60;
    if(arr.length===0&&i>=0){renderFilter();directory();nav();return}
    closeOverlay();S.tab='dir';
    document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-dir'));
    nav();directory();scrollTo(0,0);
  },
  fdone(){closeOverlay();S.tab='dir';document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-dir'));nav();directory();scrollTo(0,0)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}else if(e.target.id==='md')closeOverlay()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeOverlay();
  if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v);
});
let dt;$('#q').addEventListener('input',e=>{clearTimeout(dt);dt=setTimeout(()=>{S.f.q=e.target.value;S.lim=60;directory()},200)});

/* INIT */
(async()=>{
  themeIcon();adminUI();nav();
  try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
  await loadDB();await refreshUser();adminUI();go('home');setLoading(false);
  if(S.admin)csvFetch(true);
  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(m[1]);if(r)profile(r.id)},300);
})();
})();
</script>
