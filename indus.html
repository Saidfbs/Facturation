<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Pro — منصة التواصل المهني B2B</title>
<meta name="theme-color" content="#0B1F3A">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --navy-950:#060F1F; --navy-900:#0B1F3A; --navy-800:#122B4E; --navy-700:#1B3A63; --navy-600:#274B7C;
  --teal-700:#0E7490; --teal-600:#0891B2; --teal-500:#06B6D4; --teal-400:#22D3EE;
  --teal-soft:rgba(6,182,212,.10); --teal-glow:rgba(6,182,212,.35);
  --amber-600:#D97706; --amber-500:#F59E0B; --amber-400:#FBBF24; --amber-soft:rgba(245,158,11,.12);
  --success:#10B981; --success-soft:rgba(16,185,129,.12);
  --danger:#EF4444; --danger-soft:rgba(239,68,68,.10);
  --warning:#F59E0B; --warning-soft:rgba(245,158,11,.12);
  --info:#3B82F6; --info-soft:rgba(59,130,246,.10);
  --bg:#F5F7FA; --bg-2:#EBEFF5; --surface:#FFFFFF; --surface-2:#F8FAFC; --surface-hover:#F1F5F9;
  --border:#E2E8F0; --border-strong:#CBD5E1; --border-focus:var(--teal-500);
  --ink-900:#0F172A; --ink-700:#334155; --ink-500:#64748B; --ink-400:#94A3B8; --ink-300:#CBD5E1;
  --sh-xs:0 1px 2px rgba(15,23,42,.04);
  --sh-sm:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --sh-md:0 4px 12px rgba(15,23,42,.07), 0 2px 4px rgba(15,23,42,.04);
  --sh-lg:0 12px 28px rgba(15,23,42,.10), 0 4px 8px rgba(15,23,42,.04);
  --sh-xl:0 24px 48px rgba(15,23,42,.14), 0 8px 16px rgba(15,23,42,.06);
  --sh-hover:0 16px 32px -8px rgba(15,23,42,.12), 0 4px 8px rgba(15,23,42,.04);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-full:999px;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --navh:66px; --botnavh:64px;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#070D18; --bg-2:#0C1526; --surface:#101B2E; --surface-2:#152238; --surface-hover:#1B2A44;
  --border:#1E2E48; --border-strong:#2C3E5C; --border-focus:var(--teal-400);
  --ink-900:#F1F5F9; --ink-700:#CBD5E1; --ink-500:#94A3B8; --ink-400:#64748B; --ink-300:#475569;
  --teal-soft:rgba(34,211,238,.12); --amber-soft:rgba(251,191,36,.14);
  --success-soft:rgba(16,185,129,.15); --danger-soft:rgba(239,68,68,.14);
  --warning-soft:rgba(245,158,11,.14); --info-soft:rgba(59,130,246,.14);
  --sh-xs:0 1px 2px rgba(0,0,0,.3);
  --sh-sm:0 2px 6px rgba(0,0,0,.35);
  --sh-md:0 4px 14px rgba(0,0,0,.4);
  --sh-lg:0 12px 32px rgba(0,0,0,.45);
  --sh-xl:0 24px 48px rgba(0,0,0,.55);
  --sh-hover:0 16px 32px -8px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font:14px/1.55 'Inter','IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);color:var(--ink-900);min-height:100vh;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;border-radius:6px}
a{color:inherit;text-decoration:none}

/* ============ HEADER ============ */
header{
  position:fixed;inset:0 0 auto;height:calc(var(--navh) + var(--st));padding-top:var(--st);
  z-index:30;background:linear-gradient(135deg,var(--navy-900) 0%,var(--navy-800) 100%);
  color:#fff;display:flex;align-items:center;padding-inline:14px;
  box-shadow:0 2px 12px rgba(11,31,58,.15);border-bottom:1px solid rgba(255,255,255,.06);
}
header::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 90% 20%, rgba(6,182,212,.18), transparent 40%),
    radial-gradient(circle at 10% 80%, rgba(245,158,11,.08), transparent 40%);
  pointer-events:none;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative;z-index:1}
.lg{width:42px;height:42px;background:linear-gradient(135deg,var(--teal-500),var(--teal-600));
  color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:700;font-size:18px;flex:none;
  box-shadow:0 4px 12px var(--teal-glow), inset 0 1px 0 rgba(255,255,255,.2)}
.ht{flex:1;min-width:0;padding:0 14px;line-height:1.25;position:relative;z-index:1}
.ht b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;color:#fff}
.ht small{display:block;font-size:11.5px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hb{width:40px;height:40px;color:rgba(255,255,255,.85);display:grid;place-items:center;font-size:15px;flex:none;
  border-radius:10px;transition:.18s;margin-inline-start:3px;position:relative;z-index:1}
.hb:hover{background:rgba(255,255,255,.1);color:#fff}
.hb.on{background:var(--teal-soft);color:var(--teal-400);box-shadow:inset 0 0 0 1px rgba(34,211,238,.3)}
.hb i{font-size:16px}

/* ============ MAIN ============ */
main{
  max-width:980px;margin:0 auto;
  padding:calc(var(--navh) + 14px + var(--st)) 14px calc(var(--botnavh) + 24px + var(--sb));
  min-height:100vh;
}
.tab{display:none}
.tab.on{display:block;animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}

/* ============ STATS ============ */
.gl{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh-xs)}
.g4{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px}
@media(min-width:560px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}

.sc{padding:18px 12px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-sm);
  transition:.22s cubic-bezier(.2,.9,.4,1);position:relative;overflow:hidden;cursor:pointer}
.sc::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg, var(--teal-soft), transparent 60%);opacity:0;transition:.22s}
.sc:hover{transform:translateY(-2px);box-shadow:var(--sh-hover);border-color:var(--teal-500)}
.sc:hover::before{opacity:1}
.sc i{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;
  background:linear-gradient(135deg,var(--teal-soft),rgba(6,182,212,.05));color:var(--teal-600);
  font-size:19px;margin-bottom:10px;position:relative;z-index:1}
[data-theme=dark] .sc i{color:var(--teal-400)}
.sc b{font-size:24px;line-height:1.1;font-weight:800;color:var(--ink-900);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;position:relative;z-index:1}
.sc span{font-size:11.5px;color:var(--ink-500);margin-top:4px;font-weight:500;position:relative;z-index:1}

h3.t{font-size:13px;margin:20px 0 10px;color:var(--ink-700);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;gap:8px}
h3.t::before{content:"";width:4px;height:14px;background:linear-gradient(180deg,var(--teal-500),var(--teal-600));border-radius:2px}

.pn{padding:16px;margin-bottom:12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-sm)}
.av{width:44px;height:44px;border-radius:12px;color:#fff;display:grid;place-items:center;
  font-weight:700;flex:none;font-size:15px;letter-spacing:-.02em;box-shadow:0 2px 6px rgba(0,0,0,.12)}

/* ============ SEARCH BAR WITH FILTER BUTTON ============ */
.sr{display:flex;align-items:center;gap:8px;height:46px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-sm);transition:.18s;margin-bottom:12px;
  padding-inline-start:14px;padding-inline-end:6px}
.sr:focus-within{border-color:var(--border-focus);box-shadow:0 0 0 4px var(--teal-soft), var(--sh-sm)}
.sr input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:14.5px;color:var(--ink-900)}
.sr input::placeholder{color:var(--ink-400)}
.sr>i.fa-magnifying-glass{color:var(--ink-400);font-size:15px;flex:none}
.sr .clr-search{width:32px;height:32px;color:var(--ink-500);border-radius:8px;display:grid;place-items:center;transition:.15s;flex:none}
.sr .clr-search:hover{background:var(--surface-hover);color:var(--ink-700)}
.sr .fbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--teal-500),var(--teal-600));color:#fff;
  box-shadow:0 2px 8px var(--teal-glow);transition:.18s;position:relative}
.sr .fbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--teal-glow)}
.sr .fbtn .bub{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;padding:0 5px;
  background:var(--amber-500);color:var(--navy-900);border-radius:9px;font-size:10px;font-weight:800;
  display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.2);border:2px solid var(--surface);line-height:1}

/* ============ CHIPS ============ */
.fchips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 10px}
.fchips:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 12px;
  background:linear-gradient(135deg,var(--teal-600),var(--teal-700));color:#fff;
  border-radius:var(--r-full);font-size:12px;font-weight:500;box-shadow:0 2px 6px var(--teal-glow)}
.fchip .x{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;
  display:grid;place-items:center;font-size:10px;transition:.15s}
.fchip .x:hover{background:rgba(255,255,255,.35)}
.fchips .fclr{height:30px;padding:0 14px;border-radius:var(--r-full);background:var(--surface);
  border:1px solid var(--border);color:var(--danger);font-size:12px;font-weight:600;transition:.15s}
.fchips .fclr:hover{background:var(--danger-soft);border-color:var(--danger)}
.inf{font-size:12.5px;color:var(--ink-500);margin:4px 0 12px;font-weight:500}

/* ============ CARD ============ */
.ls{display:grid;gap:8px}
.card{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-width:0;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-xs);
  transition:.18s cubic-bezier(.2,.9,.4,1);position:relative}
.card:hover{border-color:var(--teal-500);box-shadow:var(--sh-hover);transform:translateY(-1px)}
.cm{flex:1;min-width:0}
.cm b{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:600;color:var(--ink-900);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.cm small{display:block;color:var(--ink-500);font-size:12.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.chs{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.ch{font-size:10.5px;padding:3px 9px;border-radius:6px;background:var(--info-soft);color:var(--info);
  line-height:16px;font-weight:600;letter-spacing:.01em}
.ch.o{background:var(--bg-2);color:var(--ink-500)}
[data-theme=dark] .ch.o{background:var(--surface-2)}
.ch.v{background:var(--success-soft);color:var(--success)}
.ca{display:flex;flex:none;gap:2px}
.ca button{width:34px;height:34px;color:var(--ink-400);font-size:14px;border-radius:8px;transition:.15s}
.ca button:hover{background:var(--surface-hover);color:var(--ink-700)}
.ca .dl{color:var(--danger)}
.ca .dl:hover{background:var(--danger-soft)}
.ca .fav{color:var(--ink-400)}
.ca .fav.on{color:var(--amber-500)}
.vbadge{color:var(--teal-500);font-size:14px}

.em{text-align:center;padding:48px 16px;color:var(--ink-500);font-size:13px;
  background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r-md)}
.em svg{width:64px;height:64px;margin:0 auto 14px;display:block;opacity:.35;color:var(--ink-400)}
.em b{display:block;color:var(--ink-700);margin-bottom:4px;font-weight:600;font-size:14px}
.em small{display:block;color:var(--ink-400);font-size:12px;margin-top:4px}

/* ============ SKELETON ============ */
@keyframes sk{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{background:linear-gradient(90deg,var(--bg-2) 25%,var(--surface-hover) 50%,var(--bg-2) 75%);
  background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:6px}
.sk-card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-md)}
.sk-av{width:44px;height:44px;border-radius:12px;flex:none}
.sk-body{flex:1;display:flex;flex-direction:column;gap:6px}
.sk-line{height:12px;border-radius:4px}
.sk-line.w60{width:60%}
.sk-line.w40{width:40%}
.sk-line.w80{width:80%}

/* ============ BREADCRUMB ============ */
.cr{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin-bottom:12px;font-size:12.5px;
  padding:8px 10px;background:var(--surface-2);border-radius:var(--r-sm);width:fit-content}
.cr button{min-height:26px;padding:0 8px;color:var(--teal-600);font-weight:500;font-size:12.5px;border-radius:5px;transition:.15s}
[data-theme=dark] .cr button{color:var(--teal-400)}
.cr button:hover{background:var(--teal-soft)}
.cr i{font-size:9px;color:var(--ink-300)}

/* ============ ROWS ============ */
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin-bottom:8px;text-align:start;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);font-size:14px;
  box-shadow:var(--sh-xs);transition:.18s}
.rw:hover{border-color:var(--teal-500);background:var(--surface-hover);transform:translateY(-1px);box-shadow:var(--sh-md)}
.rw span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500;color:var(--ink-900)}
.rw em{font-style:normal;color:var(--teal-600);font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums;background:var(--teal-soft);padding:3px 10px;border-radius:var(--r-full)}
[data-theme=dark] .rw em{color:var(--teal-400)}
.rw>i:first-child{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;
  background:var(--teal-soft);color:var(--teal-600);font-size:15px;flex:none}
[data-theme=dark] .rw>i:first-child{color:var(--teal-400)}
.rw>i:last-child{color:var(--ink-300);font-size:11px}

/* ============ BUTTONS ============ */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;
  border-radius:var(--r-md);background:linear-gradient(135deg,var(--teal-600),var(--teal-700));color:#fff;
  font-weight:600;min-width:0;font-size:13.5px;transition:.18s;
  box-shadow:0 2px 8px var(--teal-glow), inset 0 1px 0 rgba(255,255,255,.15);border:0;letter-spacing:-.01em}
.bt:hover{transform:translateY(-1px);box-shadow:0 4px 14px var(--teal-glow), inset 0 1px 0 rgba(255,255,255,.2)}
.bt:active{transform:translateY(0)}
.bt.g{background:var(--surface);color:var(--ink-700);border:1px solid var(--border-strong);box-shadow:var(--sh-xs)}
.bt.g:hover{background:var(--surface-hover);border-color:var(--ink-300)}
.bt.d{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.3)}
.bt.d:hover{background:linear-gradient(135deg,#DC2626,#B91C1C)}
.bt.w{background:linear-gradient(135deg,#25D366,#1EBE5D);color:#fff;box-shadow:0 2px 8px rgba(37,211,102,.3)}
.bt.w:hover{background:linear-gradient(135deg,#1EBE5D,#17A34A)}
.bt.o{background:linear-gradient(135deg,var(--amber-500),var(--amber-600));color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.3)}
.bt.o:hover{background:linear-gradient(135deg,var(--amber-600),#B45309)}
.bt.gold{background:linear-gradient(135deg,var(--amber-400),var(--amber-500));color:var(--navy-900);box-shadow:0 2px 8px rgba(245,158,11,.3)}
.bt.gold:hover{background:linear-gradient(135deg,var(--amber-500),var(--amber-600))}
.bt:disabled{opacity:.5;cursor:not-allowed;transform:none}
.bt.full{width:100%}

/* ============ MODAL ============ */
#md{position:fixed;inset:0;z-index:50;background:rgba(11,31,58,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;place-items:center;padding:12px;overflow-y:auto}
#md.on{display:grid}
.mb{width:100%;max-width:500px;max-height:92vh;overflow-y:auto;padding:24px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-xl);animation:sc .24s cubic-bezier(.2,.9,.4,1);
  margin:auto;box-shadow:var(--sh-xl)}
@keyframes sc{from{transform:scale(.94) translateY(8px);opacity:0}}
.mb h2{font-size:19px;text-align:start;margin-bottom:6px;font-weight:700;color:var(--ink-900);
  letter-spacing:-.02em;padding-inline-start:12px;border-inline-start:3px solid var(--teal-500)}
.mb .lead{text-align:start;color:var(--ink-500);font-size:13px;margin-bottom:20px;line-height:1.55;padding-inline-start:15px}

.ac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
.ac .full{grid-column:1/-1}

.fl{display:block;margin-bottom:14px}
.fl span{font-size:12px;font-weight:600;display:block;margin-bottom:6px;color:var(--ink-700);letter-spacing:.01em}
.fl input,.fl select{width:100%;height:46px;border-radius:var(--r-md);border:1px solid var(--border-strong);
  background:var(--surface-2);padding:0 14px;font-size:14px;color:var(--ink-900);transition:.18s;font-family:inherit}
.fl input::placeholder{color:var(--ink-400)}
.fl input:focus,.fl select:focus{outline:none;border-color:var(--border-focus);box-shadow:0 0 0 4px var(--teal-soft);background:var(--surface)}
.fl.er input{border-color:var(--danger);box-shadow:0 0 0 4px var(--danger-soft)}

/* ============ PROFILE ============ */
.vcard{border-radius:var(--r-xl);overflow:hidden;background:var(--surface);margin-bottom:12px;
  box-shadow:var(--sh-xl);border:1px solid var(--border);position:relative}
.prof-top-actions{display:flex;gap:5px;padding:12px 14px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-wrap:wrap;justify-content:center;position:relative;z-index:10}
.ptbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--border);color:var(--ink-700);font-size:14px;
  transition:.18s;text-decoration:none;flex:none;position:relative;cursor:pointer}
.ptbtn:hover{background:var(--surface-hover);border-color:var(--teal-500);color:var(--teal-600);
  transform:translateY(-1px);box-shadow:var(--sh-sm)}
[data-theme=dark] .ptbtn:hover{color:var(--teal-400)}
.ptbtn.wa{color:#25D366}
.ptbtn.wa:hover{border-color:#25D366;background:rgba(37,211,102,.1);color:#25D366}
.ptbtn.pdf{color:var(--danger)}
.ptbtn.pdf:hover{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.ptbtn.key{color:var(--amber-600)}
.ptbtn.key:hover{border-color:var(--amber-500);background:var(--amber-soft);color:var(--amber-600)}
.ptbtn.vrf.on{color:var(--success);background:var(--success-soft);border-color:var(--success)}
.ptbtn.del{color:var(--danger)}
.ptbtn.del:hover{background:var(--danger-soft);border-color:var(--danger)}
.ptbtn.close{color:var(--ink-500)}
.ptbtn.close:hover{background:var(--bg-2);color:var(--ink-900);border-color:var(--border-strong)}

@media(hover:hover) and (pointer:fine){
  .ptbtn::after{content:attr(title);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) scale(.9);
    background:var(--navy-900);color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap;
    opacity:0;pointer-events:none;transition:.15s;z-index:20;box-shadow:var(--sh-md);letter-spacing:.01em}
  .ptbtn:hover::after{opacity:1;transform:translateX(-50%) scale(1)}
}

.vhead{background:linear-gradient(135deg,var(--navy-900) 0%,var(--navy-700) 100%);color:#fff;
  padding:32px 20px 28px;text-align:center;position:relative;overflow:hidden}
.vhead::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 90% 10%, rgba(6,182,212,.25), transparent 40%),
    radial-gradient(circle at 10% 90%, rgba(245,158,11,.12), transparent 40%);
  pointer-events:none}
.vlogo{width:88px;height:88px;border-radius:20px;background:linear-gradient(135deg,var(--teal-500),var(--teal-700));
  color:#fff;display:grid;place-items:center;font-size:36px;margin:0 auto 16px;font-weight:700;
  border:3px solid rgba(255,255,255,.15);position:relative;z-index:1;
  box-shadow:0 8px 24px var(--teal-glow), inset 0 1px 0 rgba(255,255,255,.2)}
.vname{font-size:21px;font-weight:700;line-height:1.2;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;letter-spacing:-.02em}
.vname .vbadge{color:var(--teal-400);font-size:16px}
.vsub{font-size:13px;color:rgba(255,255,255,.75);margin-top:8px;position:relative;z-index:1;letter-spacing:.01em}
.vtags{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.vtag{font-size:11px;padding:5px 12px;border-radius:var(--r-full);background:rgba(255,255,255,.1);color:#fff;
  border:1px solid rgba(255,255,255,.15);font-weight:600;letter-spacing:.02em}
.vtag.v{background:linear-gradient(135deg,var(--teal-500),var(--teal-600));border-color:transparent}
.vqr{position:absolute;top:64px;inset-inline-end:16px;width:56px;height:56px;background:#fff;border-radius:10px;
  padding:4px;z-index:5;display:grid;place-items:center;box-shadow:var(--sh-md)}
.vqr img{width:100%;height:100%;border-radius:6px}
.vbody{padding:16px 20px}
.vrow{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.vrow:last-child{border-bottom:0}
.vrow .vic{width:38px;height:38px;border-radius:10px;background:var(--teal-soft);color:var(--teal-600);
  display:grid;place-items:center;flex:none;font-size:14px}
[data-theme=dark] .vrow .vic{color:var(--teal-400)}
.vrow a.vic.act{text-decoration:none;cursor:pointer;transition:.18s}
.vrow a.vic.act:hover{background:var(--teal-500);color:#fff;transform:scale(1.08);box-shadow:0 4px 12px var(--teal-glow)}
.vrow .vtxt{flex:1;min-width:0}
.vrow .vk{font-size:11px;color:var(--ink-400);font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.vrow .vv{font-size:14px;color:var(--ink-900);font-weight:500;overflow-wrap:anywhere}

/* ============ ACCOUNT ============ */
.acc-header{text-align:center;padding:8px 0 18px}
.acc-avatar{width:88px;height:88px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;
  font-size:32px;font-weight:700;color:#fff;box-shadow:var(--sh-lg);border:3px solid var(--teal-500)}
.acc-name{font-size:19px;font-weight:700;color:var(--ink-900);margin-bottom:4px;letter-spacing:-.02em}
.acc-ident{font-size:12px;color:var(--ink-500);direction:ltr;margin-bottom:12px}
.acc-status{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--teal-soft);
  color:var(--teal-600);border-radius:var(--r-full);font-size:12px;font-weight:600}
[data-theme=dark] .acc-status{color:var(--teal-400)}
.acc-status.warn{background:var(--warning-soft);color:var(--warning)}
.acc-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}

/* ============ FILTER MODAL ============ */
.fmodal-h{margin-bottom:18px;padding-inline-start:12px;border-inline-start:3px solid var(--teal-500)}
.fmodal-h h2{font-size:18px;margin-bottom:2px;font-weight:700;color:var(--ink-900);letter-spacing:-.02em}
.fmodal-h .sub{font-size:12px;color:var(--ink-500)}
.fsect{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:var(--r-md);
  text-align:start;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;transition:.18s}
.fsect:hover{border-color:var(--teal-500);background:var(--surface-hover);transform:translateX(-2px)}
.fsect.on{background:var(--teal-soft);border-color:var(--teal-500)}
.fsect .ic{width:40px;height:40px;border-radius:10px;background:var(--surface-2);color:var(--ink-700);
  display:grid;place-items:center;flex:none;font-size:15px;transition:.18s}
.fsect.on .ic{background:var(--teal-500);color:#fff;box-shadow:0 4px 12px var(--teal-glow)}
.fsect .name{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-900);font-size:14px}
.fsect.on .name{font-weight:600}
.fsect .val{font-size:12px;color:var(--teal-600);font-weight:700;max-width:55%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
[data-theme=dark] .fsect .val{color:var(--teal-400)}
.fsect .num{font-size:12px;color:var(--ink-400);min-width:28px;text-align:center;font-weight:600;
  font-variant-numeric:tabular-nums;background:var(--bg-2);padding:3px 10px;border-radius:var(--r-full)}
[data-theme=dark] .fsect .num{background:var(--surface-2)}
.fsect .chev{color:var(--ink-300);font-size:11px}
.fback{display:flex;align-items:center;gap:6px;color:var(--teal-600);font-weight:600;font-size:13px;
  margin-bottom:14px;padding:8px 8px;border-radius:var(--r-sm);transition:.15s}
[data-theme=dark] .fback{color:var(--teal-400)}
.fback:hover{background:var(--teal-soft)}

.sortbar{display:flex;gap:8px;margin-bottom:16px}
.sortbtn{flex:1;height:38px;border-radius:var(--r-sm);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--ink-500);font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.sortbtn:hover{background:var(--surface-hover);color:var(--ink-700)}
.sortbtn.on{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.sortbtn i{font-size:10px}

.fopt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-radius:var(--r-md);
  text-align:start;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;transition:.15s}
.fopt:hover{border-color:var(--teal-500);background:var(--surface-hover)}
.fopt.on{background:var(--teal-soft);border-color:var(--teal-500)}
.fopt .box{width:22px;height:22px;border-radius:6px;flex:none;border:2px solid var(--border-strong);
  display:grid;place-items:center;color:transparent;font-size:11px;transition:.15s}
.fopt.on .box{border-color:var(--teal-500);background:var(--teal-500);color:#fff}
.fopt .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-900);font-size:13.5px;font-weight:500}
.fopt.on .name{font-weight:600}
.fopt .n{font-size:12px;color:var(--ink-400);font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--bg-2);padding:3px 10px;border-radius:var(--r-full)}
[data-theme=dark] .fopt .n{background:var(--surface-2)}
.fopt.clear{border-style:dashed}
.fopt.clear .name{color:var(--danger)}

.filter-footer{position:sticky;bottom:-24px;margin:18px -24px -24px;padding:14px 24px calc(14px + var(--sb));
  background:var(--surface);border-top:1px solid var(--border);display:flex;gap:10px;z-index:5}
.filter-footer .bt{flex:1}
.filter-footer .count-badge{display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.2);padding:2px 10px;border-radius:var(--r-full);
  font-size:11px;font-weight:700;margin-inline-start:6px}

/* ============ ME CARD ============ */
.meCard{background:linear-gradient(135deg,var(--navy-900),var(--navy-700));color:#fff;border-radius:var(--r-md);
  padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;
  box-shadow:var(--sh-md);transition:.22s;border:1px solid rgba(6,182,212,.2);position:relative;overflow:hidden}
.meCard::before{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:120px;height:120px;
  border-radius:50%;background:radial-gradient(circle,var(--teal-glow),transparent 70%)}
.meCard:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.meCard .mav{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--teal-500),var(--teal-700));
  color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none;
  box-shadow:0 4px 12px var(--teal-glow)}
.meCard .mBody{flex:1;min-width:0;position:relative;z-index:1}
.meCard .mName{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px}
.meCard .mSub{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:3px}
.meCard .mTag{display:inline-block;font-size:10px;background:rgba(6,182,212,.25);color:var(--teal-400);
  padding:2px 8px;border-radius:6px;margin-top:4px;font-weight:600}
.meCard .mChev{color:rgba(255,255,255,.5);font-size:14px}

/* ============ HERO ============ */
.hero{background:linear-gradient(135deg,var(--navy-900) 0%,var(--navy-700) 100%);color:#fff;
  padding:28px 22px;border-radius:var(--r-xl);margin-bottom:16px;position:relative;overflow:hidden;
  box-shadow:var(--sh-lg)}
.hero::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 85% 15%, rgba(6,182,212,.3), transparent 45%),
    radial-gradient(circle at 15% 85%, rgba(245,158,11,.15), transparent 45%);
  pointer-events:none}
.hero h2{font-size:20px;font-weight:700;margin-bottom:8px;position:relative;z-index:1;
  letter-spacing:-.02em;line-height:1.3}
.hero p{font-size:13px;color:rgba(255,255,255,.8);margin-bottom:18px;position:relative;z-index:1;line-height:1.6}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero-actions .bt{min-height:42px;font-size:13.5px;padding:0 20px}
.hero-actions .bt.gold{background:linear-gradient(135deg,var(--amber-400),var(--amber-500));color:var(--navy-900)}
.hero-actions .bt.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.hero-actions .bt.ghost:hover{background:rgba(255,255,255,.15)}

/* ============ CODE BOX ============ */
.code-box{display:flex;align-items:center;gap:12px;padding:18px;background:var(--teal-soft);
  border:2px dashed var(--teal-500);border-radius:var(--r-md);margin:16px 0}
.code-box .code{flex:1;font-family:'SF Mono','Consolas','Courier New',monospace;font-size:26px;
  font-weight:700;letter-spacing:6px;color:var(--teal-700);text-align:center;direction:ltr;user-select:all}
[data-theme=dark] .code-box .code{color:var(--teal-400)}
.code-box .cp{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--teal-500),var(--teal-700));
  color:#fff;display:grid;place-items:center;flex:none;font-size:15px;transition:.15s;
  box-shadow:0 4px 12px var(--teal-glow)}
.code-box .cp:hover{transform:scale(1.05)}
.code-hint{font-size:12px;color:var(--ink-500);text-align:center;margin-top:8px}
.code-note{font-size:12.5px;color:var(--ink-700);padding:16px;background:var(--warning-soft);
  border-inline-start:3px solid var(--warning);border-radius:var(--r-sm);margin:16px 0;line-height:1.7}
.code-note b{color:var(--warning)}

/* ============ AUTH HUB ============ */
.auth-hub{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.auth-btn{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--border);text-align:start;transition:.18s;box-shadow:var(--sh-sm)}
.auth-btn:hover{border-color:var(--teal-500);transform:translateY(-1px);box-shadow:var(--sh-md)}
.auth-btn.primary{background:linear-gradient(135deg,var(--navy-900),var(--navy-700));color:#fff;
  border-color:transparent;box-shadow:var(--sh-lg)}
.auth-btn.primary:hover{box-shadow:var(--sh-xl)}
.auth-btn.admin{background:linear-gradient(135deg,var(--amber-500),var(--amber-600));color:#fff;border-color:transparent}
.auth-btn.admin:hover{box-shadow:var(--sh-lg)}
.auth-btn .ai{width:46px;height:46px;border-radius:12px;background:var(--teal-soft);color:var(--teal-600);
  display:grid;place-items:center;font-size:19px;flex:none}
.auth-btn.primary .ai{background:rgba(6,182,212,.2);color:var(--teal-400);border:1px solid rgba(6,182,212,.3)}
.auth-btn.admin .ai{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.2)}
.auth-btn .at{flex:1;min-width:0}
.auth-btn .at b{display:block;font-size:15px;margin-bottom:2px;font-weight:600}
.auth-btn .at small{font-size:12px;opacity:.7;line-height:1.3}
.auth-btn .chev{color:var(--ink-400);font-size:13px}
.auth-btn.primary .chev{color:rgba(255,255,255,.5)}
.auth-btn.admin .chev{color:rgba(255,255,255,.5)}

/* ============ SOURCE BAR ============ */
.srcbar{display:flex;gap:4px;margin-bottom:14px;padding:4px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--r-md)}
.srcbar button{flex:1;height:38px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;
  color:var(--ink-500);display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.srcbar button:hover{color:var(--ink-700)}
.srcbar button.on{background:var(--surface);color:var(--teal-600);box-shadow:var(--sh-xs)}
[data-theme=dark] .srcbar button.on{color:var(--teal-400)}
.srcbar button i{font-size:12px}

.sortbar2{display:flex;gap:8px;margin-bottom:14px}
.sortbar2 button{flex:1;height:38px;border-radius:var(--r-sm);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--ink-500);font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.sortbar2 button:hover{background:var(--surface-hover);color:var(--ink-700)}
.sortbar2 button.on{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.sortbar2 button i{font-size:10px}

/* ============ PDF ============ */
.pdf-stage{position:fixed;left:-99999px;top:0;width:1200px;height:auto}
.pdf-card{width:1200px;background:#fff;color:#0F172A;font-family:'IBM Plex Sans Arabic','Inter',sans-serif;
  direction:rtl;display:flex;flex-direction:row;min-height:520px;overflow:hidden;position:relative}
.pdf-left{flex:0 0 480px;background:linear-gradient(135deg,#0B1F3A 0%,#1B3A63 100%);color:#fff;
  padding:60px 50px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;position:relative;overflow:hidden}
.pdf-left::before{content:"";position:absolute;right:-120px;top:-120px;width:320px;height:320px;
  border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,.25),transparent 70%)}
.pdf-logo{width:160px;height:160px;border-radius:32px;background:linear-gradient(135deg,#06B6D4,#0E7490);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:76px;
  border:8px solid rgba(255,255,255,.15);margin-bottom:24px;position:relative;z-index:2;
  box-shadow:0 20px 40px rgba(6,182,212,.4)}
.pdf-name{font-size:34px;font-weight:700;line-height:1.2;position:relative;z-index:2;margin-top:6px;letter-spacing:-.02em}
.pdf-sub{font-size:17px;opacity:.8;margin-top:10px;position:relative;z-index:2}
.pdf-tags{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap;position:relative;z-index:2}
.pdf-tag{font-size:13px;padding:6px 14px;border-radius:8px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);font-weight:600}
.pdf-tag.v{background:#06B6D4;border-color:#06B6D4;color:#fff}
.pdf-right{flex:1;background:#F5F7FA;padding:50px 40px;display:flex;flex-direction:column;
  justify-content:center;gap:20px}
.pdf-row{display:flex;align-items:center;gap:18px;padding:14px 18px;background:#fff;border-radius:12px;
  border-inline-start:4px solid #06B6D4;box-shadow:0 2px 8px rgba(15,23,42,.06)}
.pdf-row .ic{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#06B6D4,#0E7490);
  color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.pdf-row .k{font-size:11px;color:#64748B;font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.pdf-row .v{font-size:17px;color:#0F172A;font-weight:600;word-break:break-word}
.pdf-qr{position:absolute;bottom:28px;left:40px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5}
.pdf-qr img{width:90px;height:90px;border:3px solid #06B6D4;border-radius:12px;background:#fff;padding:3px}
.pdf-qr small{font-size:9px;color:#64748B;font-weight:600}

/* ============ TOAST ============ */
#ts{position:fixed;inset-inline:0;bottom:calc(var(--botnavh) + 16px + var(--sb));margin:auto;width:max-content;
  max-width:calc(100% - 32px);background:var(--navy-900);color:#fff;padding:14px 22px;
  border-radius:var(--r-md);z-index:80;opacity:0;pointer-events:none;
  transition:.24s cubic-bezier(.2,.9,.4,1);transform:translateY(16px);font-size:13px;font-weight:500;
  box-shadow:var(--sh-xl);border-inline-start:4px solid var(--teal-500);letter-spacing:-.005em;
  display:flex;align-items:center;gap:14px;word-break:break-word}
#ts.on{opacity:1;transform:none;pointer-events:auto}
#ts .undo{background:rgba(255,255,255,.15);color:var(--teal-400);padding:5px 14px;border-radius:8px;
  font-size:12px;font-weight:700;transition:.15s;flex:none}
#ts .undo:hover{background:rgba(255,255,255,.25)}

/* ============ LOADER ============ */
#ld{position:fixed;inset:0;z-index:99;background:linear-gradient(135deg,var(--navy-900),var(--navy-700));
  display:none;place-items:center}
#ld.on{display:grid}
#ld i{font-size:44px;color:var(--teal-500);animation:sp 1.2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ DASHBOARD MISC ============ */
.seg{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:3px}
.seg i{display:block;min-width:4px}
.cols{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:640px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}

.bar2{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  min-height:44px;padding:0 14px;border-radius:var(--r-sm);overflow:hidden;text-align:start;margin-top:6px;
  background:var(--surface-2);border:1px solid transparent;font-size:13px;transition:.15s}
.bar2:hover{background:var(--surface-hover);border-color:var(--teal-500)}
.bar2 i{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,var(--teal-soft),transparent)}
.bar2 span,.bar2 b{position:relative}
.bar2 span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--ink-700)}
.bar2 b{font-weight:700;color:var(--teal-600);font-variant-numeric:tabular-nums;background:var(--surface);
  padding:2px 10px;border-radius:var(--r-full);font-size:11.5px}
[data-theme=dark] .bar2 b{color:var(--teal-400);background:var(--surface)}

.scroll-list{max-height:250px;overflow-y:auto;overflow-x:hidden;padding-inline-end:4px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.scroll-list::-webkit-scrollbar{width:6px}
.scroll-list::-webkit-scrollbar-track{background:transparent}
.scroll-list::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

/* ============ ADMIN ============ */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  text-align:center;box-shadow:var(--sh-xs);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--teal-500),var(--teal-700))}
.stat b{display:block;font-size:22px;color:var(--ink-900);margin-bottom:3px;font-weight:800;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const norm = s => String(s ?? '')
  .normalize('NFD')
  .replace(/[\u0300-\u036f\u064B-\u065F\u0640]/g, '')
  .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
  .toLowerCase().replace(/\s+/g, ' ').trim();
const hit = (v, q) => { const n = norm(v); return norm(q).split(' ').every(t => n.includes(t)); };

const getInits = n => {
  const parts = String(n || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
};
const color = n => { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PAL[h % PAL.length]; };

const fmtPhone = p => {
  let d = String(p || '').replace(/[^\d+]/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = '+' + d.slice(2);
  if (d.startsWith('+')) return d;
  if (d.startsWith('0')) return '+212' + d.slice(1);
  if (d.startsWith('212')) return '+' + d;
  return d;
};
const validPhone = p => /^\+\d{9,15}$/.test(fmtPhone(p));
const phoneVariants = p => {
  const d = String(p || '').replace(/[^\d]/g, '');
  if (!d) return [];
  const out = new Set();
  out.add(String(p).trim()); out.add('+' + d);
  if (d.startsWith('212')) { out.add('0'+d.slice(3)); out.add(d); out.add('+'+d); }
  if (d.startsWith('0')) { out.add('+212'+d.slice(1)); out.add('212'+d.slice(1)); out.add(d); }
  if (d.length === 9) { out.add('+212'+d); out.add('0'+d); out.add('212'+d); }
  return [...out].filter(Boolean);
};
const ident = v => { v = String(v).trim(); return v.includes('@') ? v.toLowerCase() : fmtPhone(v); };

const uid = () => `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

const safeEq = (a, b) => { if (!a || !b || a.length !== b.length) return false; let d = 0; for (let i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i); return d === 0; };

function debounce(fn, wait = 200) {
  let t;
  return function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}

function h53(s, seed = 0) {
  let a = 0xdeadbeef ^ seed, b = 0x41c6ce57 ^ seed;
  for (let i = 0, c; i < s.length; i++) {
    c = s.charCodeAt(i);
    a = Math.imul(a ^ c, 2654435761);
    b = Math.imul(b ^ c, 1597334677);
  }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36);
}
const sid = (t, n, p) => 'p' + h53(t + '|' + norm(n) + '|' + fmtPhone(p));
const sha = async s => {
  try {
    return [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))]
      .map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { return 'f' + h53(s) + h53(s, 7); }
};
const uidOf = async i => 'u_' + (await sha('cp:' + i)).slice(0, 24);

function trapFocus(container) {
  if (!container) return;
  const focusable = container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  container.onkeydown = e => {
    if (e.key !== 'Tab') return;
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  setTimeout(() => first.focus(), 50);
}

const facetKey = k => k + ':' + S.filter.type.length + ',' + S.filter.cat.length + ',' + S.filter.dom.length + ',' + S.filter.spe.length + ',' + S.filter.ville.length + ',' + S.filter.q;

function facet(k, sortBy = 'count') {
  const m = new Map();
  S.db.filter(r => match(r, k)).forEach(r => {
    const v = (r[FLD[k]] || '').trim();
    if (v) m.set(v, (m.get(v) || 0) + 1);
  });
  const arr = [...m];
  if (sortBy === 'count') return arr.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ar'));
  return arr.sort((a, b) => a[0].localeCompare(b[0], 'ar'));
}
function getFacet(k, sortBy = 'count') {
  const key = facetKey(k) + ':' + sortBy;
  if (S.data.facetCache[key]) return S.data.facetCache[key];
  const v = facet(k, sortBy);
  S.data.facetCache[key] = v;
  return v;
}
function getFacets() {
  if (S.data.facets) return S.data.facets;
  const f = {};
  SECTIONS.forEach(s => { f[s.k] = getFacet(s.k); });
  S.data.facets = f;
  return f;
}
const clearFacetCache = () => { S.data.facetCache = {}; S.data.facets = null; };

function match(r, skip) {
  for (const k in FLD) {
    if (k === skip) continue;
    const arr = S.filter[k];
    if (arr.length && !arr.some(v => norm(r[FLD[k]]) === norm(v))) return false;
  }
  if (S.filter.q) {
    if (/^(موثق|verified|vérifié)$/i.test(S.filter.q)) return !!r.verified;
    return hit([r.name, r.domaine, r.specialite, r.ville, r.phone, r.email].join(' '), S.filter.q);
  }
  return true;
}
const results = () => S.db.filter(r => match(r)).sort((a, b) => a.name.localeCompare(b.name, 'ar'));

function splitCSV(l) {
  const o = []; let c = '', q = false;
  for (let i = 0; i < l.length; i++) {
    const h = l[i];
    if (h === '"') { if (q && l[i+1] === '"') { c += '"'; i++; } else q = !q; }
    else if (h === ',' && !q) { o.push(c); c = ''; }
    else c += h;
  }
  o.push(c); return o;
}
const parseCSV = (txt, type, cat) => {
  const cl = s => (s || '').replace(/^["'\s]+|["'\s]+$/g, '');
  return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c => cl(c[1])).map(c => ({
    id: sid(type, cl(c[1]), cl(c[5])),
    name: cl(c[1]), domaine: cl(c[2]) || 'Autre',
    specialite: cl(c[3]) || 'Général', ville: cl(c[4]),
    phone: fmtPhone(cl(c[5])), email: cl(c[6]), web: cl(c[7]),
    type, categorie: cat
  }));
};
async function csvAll() {
  const g = async (u, t, c) => { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return parseCSV(await r.text(), t, c); };
  const [e, f] = await Promise.all([g(CSV_EXPERTS, 'experts', 'yad-amila'), g(CSV_FOURNISSEURS, 'fournisseurs', 'services')]);
  const m = new Map();
  [...f, ...e].forEach(r => m.has(r.id) || m.set(r.id, r));

}

async function csvPush() {
  if (!S.admin || !needFb() || S.busy) return;
  if (!S.csvCache.length) return toast('اجلب CSV أولاً');
  const old = S.fbCache;
  const cr = new Map(old.map(r => [r.id, r.createdAt]));
  const vr = new Map(old.map(r => [r.id, r.verified]));
  const owned = new Map(old.filter(r => r.owner).map(r => [r.id, r]));
  const oldIds = new Set(old.map(r => r.id));
  let added = 0, updated = 0, kept = 0;
  const now = Date.now();
  const tree = {};
  const put = r => {
    const { type, categorie, ...x } = r;
    const T = TK[type], C = CK[categorie];
    tree[T] = tree[T] || {};
    (tree[T][C] = tree[T][C] || []).push(x);
  };
  S.csvCache.forEach(r => {
    if (owned.has(r.id)) { kept++; return; }
    const v = { ...r, createdAt: cr.get(r.id) || now };
    if (vr.get(r.id)) v.verified = true;
    if (oldIds.has(r.id)) updated++; else added++;
    put(v);
  });
  owned.forEach(put);
  if (!confirm(`مزامنة:\n➕ ${added} جديد\n✏️ ${updated} محدّث\n🔒 ${kept} محمي\n\nمتابعة؟`)) return;
  S.busy = true;
  setLoading(true);
  try {
    await S.fb.ref('professionals').set(tree);
    log('csv-push', `${added}+ ${updated}~`);
    await loadDB();
    S.viewSrc = 'fb';
    applySource();
    go('home');
    toast(`تم: ${added} جديد، ${updated} محدّث`);
  } catch (e) { console.error(e); toast('فشلت'); }
  finally { S.busy = false; setLoading(false); }
}

function genCode() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 8; i++) s += A[Math.floor(Math.random() * A.length)];

}

async function findUserByPhone(rawPhone) {
  if (!S.fb || !rawPhone) return null;
  const phone = fmtPhone(rawPhone);
  const digits = phone.replace(/\D/g, '');

  try {
    const keys = [encodeURIComponent(phone), encodeURIComponent(rawPhone)];
    for (const k of keys) {
      const v = (await S.fb.ref('users_index/' + k).once('value')).val();
      if (v) {
        const rec = (await S.fb.ref('users/' + v).once('value')).val();
        if (rec) return { uid: v, rec };
      }
    }
    for (const v of phoneVariants(rawPhone)) {
      const k = encodeURIComponent(fmtPhone(v));
      const v2 = (await S.fb.ref('users_index/' + k).once('value')).val();
      if (v2) {
        const rec = (await S.fb.ref('users/' + v2).once('value')).val();
        if (rec) return { uid: v2, rec };
      }
    }
  } catch {}

  for (const v of phoneVariants(rawPhone)) {
    try {
      const u = await uidOf(ident(v));
      const r = (await S.fb.ref('users/' + u).once('value')).val();
      if (r) return { uid: u, rec: r };
    } catch {}
  }

  try {
    const all = (await S.fb.ref('users').once('value')).val() || {};
    if (Object.keys(all).length > 500) return null;
    for (const [u, rec] of Object.entries(all)) {
      if (!rec || !rec.ident) continue;
      const uPhone = fmtPhone(String(rec.ident).trim());
      const uDigits = uPhone.replace(/\D/g, '');
      if (uPhone === phone || uDigits === digits) return { uid: u, rec };
      if (uDigits.length >= 9 && digits.length >= 9 && uDigits.slice(-9) === digits.slice(-9)) return { uid: u, rec };
    }
  } catch {}
  return null;
}

async function createAccountFor(profile) {
  if (!S.admin || !needFb()) return null;
  const phone = fmtPhone(profile.phone);
  if (!validPhone(phone)) { toast('هاتف الملف غير صالح'); return null; }
  const exists = await findUserByPhone(phone);
  if (exists) { toast('يوجد حساب'); return exists; }
  const u = await uidOf(ident(phone));
  const salt = uid();
  const tempCode = genCode();
  const hash = await sha(salt + tempCode);
  const rec = { name: profile.name, ident: phone, salt, hash, profileId: profile.id, createdAt: Date.now() };
  await S.fb.ref('users/' + u).set(rec);
  await indexUser(phone, u);
  const p = path(profile.type, profile.categorie);
  await S.fb.ref(`${p}/${profile.id}`).update({ owner: u });
  log('account-auto', profile.name);
  return { uid: u, rec, tempCode };
}

/* ============================================================
   DIRECTORY
   ============================================================ */
function directory() {
  const chips = [];
  for (const k of Object.keys(FLD)) {
    for (const v of S.filter[k]) {
      chips.push(`<span class="fchip">${esc(lbl(k, v))}<button class="x" data-a="chipx" data-k="${k}" data-v="${esc(v)}" aria-label="إزالة"><i class="fa-solid fa-xmark"></i></button></span>`);
    }
  }
  if (S.filter.q.trim()) chips.push(`<span class="fchip">بحث: ${esc(S.filter.q.trim())}<button class="x" data-a="qx" aria-label="إزالة"><i class="fa-solid fa-xmark"></i></button></span>`);
  if (chips.length > 1) chips.push(`<button class="fclr" data-a="clr">مسح الكل</button>`);
  $('#fchips').innerHTML = chips.join('');
  $('#meSlot').innerHTML = meCard();

  const r = results();
  $('#inf').textContent = `${r.length} شركة من أصل ${S.db.length}`;
  $('#qx').hidden = !S.filter.q;
  updateFilterBadge();

  if (S.loading) {
    $('#ls').innerHTML = Array.from({ length: 5 }).map(skCard).join('');
    return;
  }
  if (!r.length) { $('#ls').innerHTML = empty('لا توجد نتائج مطابقة', 'جرّب تغيير الفلاتر أو البحث'); return; }

  const visible = r.slice(0, S.ui.lim);
  $('#ls').innerHTML = visible.map(card).join('') +
    (r.length > S.ui.lim ? `<button class="bt g" data-a="more" id="moreBtn">عرض المزيد (${r.length - S.ui.lim})</button>` : '');
  if (r.length > S.ui.lim) {
    const btn = $('#moreBtn');
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        io.disconnect();
        const next = r.slice(S.ui.lim, S.ui.lim + 60);
        S.ui.lim += 60;
        const oldBtn = $('#moreBtn');
        if (oldBtn) oldBtn.remove();
        const frag = document.createElement('div');
        frag.innerHTML = next.map(card).join('');
        while (frag.firstChild) $('#ls').appendChild(frag.firstChild);
        if (r.length > S.ui.lim) {
          const newBtn = document.createElement('button');
          newBtn.className = 'bt g';
          newBtn.dataset.a = 'more';
          newBtn.id = 'moreBtn';
          newBtn.textContent = `عرض المزيد (${r.length - S.ui.lim})`;
          $('#ls').appendChild(newBtn);
          const io2 = new IntersectionObserver(([e2]) => { if (e2.isIntersecting) { io2.disconnect(); A.more(); } });
          io2.observe(newBtn);
        }
      }
    });
    io.observe(btn);
  }
}

function favorites() {
  const favs = S.fav.map(byId).filter(Boolean);
  $('#t-fav').innerHTML = `
    <h3 class="t" style="margin-top:0">المفضلة (${favs.length})</h3>
    ${favs.length ? `<div class="ls">${favs.map(card).join('')}</div>
      <button class="bt g" data-a="favclr" style="margin-top:12px;width:100%"><i class="fa-solid fa-trash"></i> مسح الكل</button>`
      : empty('لا مفضلات بعد', 'اضغط النجمة على أي شركة لإضافتها هنا')}`;
  updateFavBadge();
}
function toggleFav(id) {
  const i = S.fav.indexOf(id);
  if (i >= 0) S.fav.splice(i, 1); else S.fav.push(id);
  try { localStorage.setItem('cp-fav', JSON.stringify(S.fav)); } catch {}
  if (S.tab === 'fav') favorites();
  else if (S.tab === 'dir') directory();
  else if (S.tab === 'home') dashboard();
  updateFavBadge();
  toast(i >= 0 ? 'أُزيلت من المفضلة' : 'أُضيفت للمفضلة');
  if ($('#drawer').classList.contains('on')) renderDrawer();
}

/* ============================================================
   FILTER MODAL
   ============================================================ */
function openFilter(presetK = null, presetV = null) {
  S.fp = presetK ? 'pick' : 'sections';
  S.fk = presetK;
  if (presetK) {
    clearFilters();
    if (presetV) S.filter[presetK] = [presetV];
  }
  renderFilter();
  $('#md').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function renderFilter() {
  let html = '';
  const facets = getFacets();
  if (S.fp === 'sections') {
    html = `<div class="fmodal-h"><h2>تصفية النتائج</h2><div class="sub">اختر فئة للتصفية</div></div>`;
    html += SECTIONS.map(s => {
      const arr = S.filter[s.k];
      const active = arr.length > 0;
      let val = '';
      if (arr.length === 1) val = lbl(s.k, arr[0]);
      else if (arr.length > 1) val = `${arr.length} مختارة`;
      const count = facets[s.k].length;
      return `<button class="fsect${active ? ' on' : ''}" data-a="fsect" data-v="${s.k}">
        <span class="ic"><i class="fa-solid ${s.icon}"></i></span>
        <span class="name">${esc(s.label)}</span>
        ${val ? `<span class="val">${esc(val)}</span>` : `<span class="num">${count}</span>`}
        <span class="chev"><i class="fa-solid fa-chevron-left"></i></span>
      </button>`;
    }).join('');
  } else {
    const sect = SECTIONS.find(s => s.k === S.fk);
    const curSort = S.sortF[S.fk] || 'count';
    html = `<button class="fback" data-a="fback"><i class="fa-solid fa-chevron-right"></i> رجوع</button>
      <div class="fmodal-h"><h2>${esc(sect.label)}</h2><div class="sub">اختيار متعدد</div></div>
      <div class="sortbar">
        <button class="sortbtn${curSort === 'count' ? ' on' : ''}" data-a="fsort" data-v="count"><i class="fa-solid fa-arrow-down-wide-short"></i> الأكثر</button>
        <button class="sortbtn${curSort === 'name' ? ' on' : ''}" data-a="fsort" data-v="name"><i class="fa-solid fa-arrow-down-a-z"></i> أبجدي</button>
      </div>`;
    const avail = getFacet(S.fk, curSort);
    const selected = S.filter[S.fk];
    html += avail.map(([v, n]) => {
      const on = selected.some(x => norm(x) === norm(v));
      const disabled = n === 0 && !on;
      return `<button class="fopt${on ? ' on' : ''}" data-a="fpick" data-v="${esc(v)}" ${disabled ? 'disabled' : ''}>
        <span class="box"><i class="fa-solid fa-check"></i></span>
        <span class="name">${esc(lbl(S.fk, v))}</span>
        <span class="n">${n}</span>
      </button>`;
    }).join('') || '<p class="em">لا قيم</p>';
    if (selected.length) html += `<button class="fopt clear" data-a="fclearsec"><span class="box" style="border-color:transparent;color:transparent"></span><span class="name">إزالة (${selected.length})</span></button>`;
  }
  const n = activeCount();
  const resCount = results().length;
  html += `<div class="filter-footer">
    <button class="bt g" data-a="fclr"${n ? '' : ' disabled'}>مسح</button>
    <button class="bt" data-a="fdone">عرض <span class="count-badge">${resCount}</span></button>
  </div>`;
  openOverlay(html);
  trapFocus($('.mb'));
}

const grp = (l, k) => { const m = new Map(); l.forEach(r => { const v = r[k] || '—'; m.set(v, (m.get(v) || 0) + 1); }); return [...m]; };
const matchExp = r => !S.exp.q || hit([r.name, r.domaine, r.specialite, r.ville, r.phone, r.email, TL[r.type], CL[r.categorie]].join(' '), S.exp.q);

function explorer() {
  const { t, d, s } = S.exp;
  const cs = [['الرئيسية', '']];
  if (t) cs.push([TL[t] + 'ون', 't']);

  </div>`;
  $('#t-exp').innerHTML = `
    <div class="sr">

      <input id="xq" value="${esc(S.exp.q)}" placeholder="ابحث في المستكشف..." aria-label="بحث">
      <button class="clr-search" id="xqc" ${S.exp.q ? '' : 'hidden'} aria-label="مسح"><i class="fa-solid fa-xmark"></i></button>
    </div>
    ${sortBar}
    <div class="cr">${cs.map((c, i) => (i ? '<i class="fa-solid fa-chevron-left"></i>' : '') + `<button data-a="xc" data-v="${c[1]}">${esc(c[0])}</button>`).join('')}</div>
    <div id="xl">${renderExplorerList() || empty('لا عناصر')}</div>`;

function renderExplorerList() {
  const { t, d, s } = S.exp;
  const base = S.db.filter(r => !t || r.type === t).filter(matchExp);
  const row = (ic, n, c, a, v) => `<button class="rw" data-a="${a}" data-v="${esc(v)}"><i class="fa-solid ${ic}"></i><span>${esc(n)}</span><em>${c}</em><i class="fa-solid fa-chevron-left"></i></button>`;
  const sortGroups = arr => S.exp.sort === 'count' ? arr.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ar')) : arr.sort((a, b) => a[0].localeCompare(b[0], 'ar'));
  if (S.exp.q) return base.length ? '<div class="ls">' + base.map(card).join('') + '</div>' : empty('لا نتائج');
  if (!t) return sortGroups(['fournisseurs', 'experts'].map(x => [x, S.db.filter(r => r.type === x).length]))
    .map(([x, c]) => row(x === 'experts' ? 'fa-user-tie' : 'fa-truck-field', TL[x] + 'ون', c, 'xt', x)).join('');
  if (!d) return sortGroups(grp(base, 'domaine')).map(g => row('fa-industry', g[0], g[1], 'xd', g[0])).join('');
  if (!s) return sortGroups(grp(base.filter(r => r.domaine === d), 'specialite')).map(g => row('fa-screwdriver-wrench', g[0], g[1], 'xs', g[0])).join('');
  return '<div class="ls">' + base.filter(r => r.domaine === d && r.specialite === s).map(card).join('') + '</div>';
}

  const rows = [];
  if (shown(r.domaine)) rows.push(['fa-industry', 'القطاع', esc(r.domaine)]);
  if (shown(r.specialite)) rows.push(['fa-screwdriver-wrench', 'التخصص', esc(r.specialite)]);
  if (r.ville) rows.push(['fa-location-dot', 'المدينة', esc(r.ville)]);
  if (p) rows.push(['fa-phone', 'الهاتف', `<span dir="ltr">${esc(p)}</span>`, `tel:${esc(p)}`]);
  if (r.email) rows.push(['fa-envelope', 'البريد', `<span dir="ltr">${esc(r.email)}</span>`, `mailto:${esc(r.email)}`]);
  if (w) rows.push(['fa-globe', 'الموقع', `<span dir="ltr">${esc(r.web)}</span>`, esc(w), true]);

  const vtags = `<span class="vtag">${esc(TL[r.type])}</span><span class="vtag">${esc(CL[r.categorie])}</span>${r.verified ? '<span class="vtag v"><i class="fa-solid fa-circle-check"></i> موثّق</span>' : ''}`;
  const profileUrl = `${baseUrl()}#p=${r.id}`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(profileUrl)}&color=0B1F3A&bgcolor=FFFFFF&margin=0`;

  const topBtns = [
    p && `<a class="ptbtn wa" href="https://wa.me/${esc(p.replace(/\D/g, ''))}" target="_blank" rel="noopener" title="واتساب" aria-label="واتساب"><i class="fa-brands fa-whatsapp"></i></a>`,

    S.admin && `<button class="ptbtn del" data-a="del" data-v="${esc(r.id)}" title="حذف" aria-label="حذف"><i class="fa-solid fa-trash"></i></button>`,
    `<button class="ptbtn close" data-a="cls" title="إغلاق" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>`
  ].filter(Boolean).join('');

  return `<div class="vcard">

      <div class="vlogo"><i class="fa-solid ${domIcon(r.domaine)}"></i></div>
      <div class="vname">${esc(r.name)} ${r.verified ? '<i class="fa-solid fa-circle-check vbadge"></i>' : ''}</div>

          : `<div class="vic"><i class="fa-solid ${ic}"></i></div>`}
        <div class="vtxt"><div class="vk">${k}</div><div class="vv">${v}</div></div>
      </div>`).join('')}
    </div>
  </div>`;
}

function info(r) {
  const lines = [];
  lines.push(`🏢 ${r.name}`); lines.push(SEP);
  lines.push(`🏷️ النوع: ${TL[r.type]}`);
  lines.push(`📂 التصنيف: ${CL[r.categorie]}`);
  if (shown(r.domaine)) lines.push(`🏭 القطاع: ${r.domaine}`);
  if (shown(r.specialite)) lines.push(`🛠️ التخصص: ${r.specialite}`);
  if (r.ville) lines.push(`📍 المدينة: ${r.ville}`);
  if (fmtPhone(r.phone)) lines.push(`📞 الهاتف: ${fmtPhone(r.phone)}`);
  if (r.email) lines.push(`✉️ البريد: ${r.email}`);
  if (r.web) lines.push(`🌐 الموقع: ${url(r.web)}`);
  if (r.verified) lines.push(`✅ موثّق`);
  lines.push(SEP);
  lines.push(`🔗 ${baseUrl()}#p=${r.id}`);
  return lines.join('\n');
}
async function share(id) {
  const r = byId(id);
  if (!r) return;
  const text = info(r);
  if (navigator.share) {
    try { await navigator.share({ title: r.name, text }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast('تم النسخ'); }
  catch { toast('تعذر النسخ'); }
  setTimeout(() => { window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener'); }, 0);
}

function buildPdfHtml(r) {
  const p = fmtPhone(r.phone), w = url(r.web);
  const rows = [];
  if (shown(r.domaine)) rows.push(['fa-industry', 'القطاع', esc(r.domaine)]);
  if (shown(r.specialite)) rows.push(['fa-screwdriver-wrench', 'التخصص', esc(r.specialite)]);
  if (r.ville) rows.push(['fa-location-dot', 'المدينة', esc(r.ville)]);
  if (p) rows.push(['fa-phone', 'الهاتف', esc(p)]);
  if (r.email) rows.push(['fa-envelope', 'البريد', esc(r.email)]);
  if (w) rows.push(['fa-globe', 'الموقع', esc(r.web)]);
  const tags = `<span class="pdf-tag">${esc(TL[r.type])}</span><span class="pdf-tag">${esc(CL[r.categorie])}</span>${r.verified ? '<span class="pdf-tag v">✓ موثّق</span>' : ''}`;
  const profileUrl = `${baseUrl()}#p=${r.id}`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(profileUrl)}&color=0B1F3A&bgcolor=FFFFFF&margin=0`;
  return `
    <div class="pdf-card" data-pdf-root>
      <div class="pdf-left">
        <div class="pdf-logo"><i class="fa-solid ${domIcon(r.domaine)}"></i></div>
        <div class="pdf-name">${esc(r.name)}</div>
        <div class="pdf-sub">${esc([shown(r.domaine), r.ville].filter(Boolean).join(' · '))}</div>
        <div class="pdf-tags">${tags}</div>
      </div>
      <div class="pdf-right">
        ${rows.map(([ic, k, v]) => `<div class="pdf-row"><div class="ic"><i class="fa-solid ${ic}"></i></div><div><div class="k">${k}</div><div class="v">${v}</div></div></div>`).join('')}
      </div>
      <div class="pdf-qr">
        <img src="${qrUrl}" alt="QR" crossorigin="anonymous">
        <small>امسح للزيارة</small>
      </div>
    </div>`;
}
async function makePDF(id) {
  const r = byId(id);
  if (!r) return;
  setLoading(true);
  let holder = null;
  try {
    try { await loadPdfLibs(); }
    catch (e) { toast(e.message || 'تعذر تحميل PDF'); return; }
    holder = document.createElement('div');
    holder.className = 'pdf-stage';
    holder.innerHTML = buildPdfHtml(r);
    document.body.appendChild(holder);
    await new Promise(res => setTimeout(res, 700));
    const node = holder.querySelector('[data-pdf-root]');
    const canvas = await html2canvas(node, { scale: 2, backgroundColor: '#fff', useCORS: true, logging: false });
    const img = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const ratio = canvas.height / canvas.width;
    const wmm = 200, hmm = wmm * ratio;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [wmm, hmm] });
    pdf.addImage(img, 'JPEG', 0, 0, wmm, hmm);
    pdf.save(`ConnectPro-${r.name.replace(/\s+/g, '_')}.pdf`);
    log('pdf', r.name);
    toast('تم توليد PDF');
  } catch (e) { console.error(e); toast('خطأ في توليد PDF'); }
  finally { holder?.remove(); setLoading(false); }
}

async function save() {
  const g = i => $('#' + i).value.trim();
  document.querySelectorAll('.fl.er').forEach(e => e.classList.remove('er'));
  const bad = (i, m) => { $('#w_' + i).classList.add('er'); toast(m); return false; };
  let ok = true;
  if (!g('f_n')) ok = bad('f_n', 'الاسم مطلوب');
  if (g('f_m') && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g('f_m'))) ok = bad('f_m', 'بريد غير صالح');
  if (g('f_w') && !url(g('f_w'))) ok = bad('f_w', 'رابط غير صالح');
  if (g('f_p') && !validPhone(g('f_p'))) ok = bad('f_p', 'هاتف غير صالح');
  if (!ok || !needFb()) return;

  const t = g('f_t'), c = g('f_c');
  const old = S.editingId ? byId(S.editingId) : null;
  if (old ? !canEdit(old) : !canAdd()) return toast('غير مسموح');

  const vEl = $('#f_v');
  const it = {
    id: old?.id || uid(), name: g('f_n'),
    domaine: g('f_d') || 'Autre', specialite: g('f_s') || 'Général',
    ville: g('f_v_ville'), phone: fmtPhone(g('f_p')),
    email: g('f_m'), web: g('f_w'),
    createdAt: old?.createdAt || Date.now()
  };
  if (S.admin && vEl) it.verified = !!vEl.checked;
  else if (old?.verified) it.verified = true;
  const ow = old ? old.owner : (S.admin ? '' : S.user.id);
  if (ow) it.owner = ow;

  setLoading(true);
  try {
    if (old && (old.type !== t || old.categorie !== c)) {
      await S.fb.ref(`${path(old.type, old.categorie)}/${old.id}`).remove();
    }
    await S.fb.ref(`${path(t, c)}/${it.id}`).update(it);
    if (!old && !S.admin) {
      S.user.profileId = it.id;
      await S.fb.ref('users/' + S.user.id + '/profileId').set(it.id);
    }
    log(old ? 'edit' : 'add', it.name);
    await loadDB();
    adminUI();
    closeOverlay();
    go(S.tab);
    toast(old ? 'تم التعديل' : 'تمت الإضافة');
  } catch (e) { console.error(e); toast('خطأ في الحفظ'); }
  finally { setLoading(false); }
}

async function doLogin() {
  if (!needFb()) return;
  const rawPhone = $('#li_i').value.trim(), p = $('#li_p').value;
  if (!rawPhone || !p) return toast('أدخل البيانات');
  setLoading(true);
  try {
    const found = await findUserByPhone(rawPhone);
    if (!found) { toast('لا يوجد حساب'); return; }
    const { uid: u, rec: r } = found;
    const okPass = await sha(r.salt + p);
    const okReset = r.resetCode && r.resetExpiry > Date.now() && safeEq(r.resetCode, await sha('reset:' + p + ':' + r.salt));
    if (!safeEq(r.hash, okPass) && !okReset) { toast('الرمز غير صحيح'); return; }
    try {
      localStorage.setItem('cp-lastphone', fmtPhone(r.ident));
      localStorage.setItem('cp-saved-phone', fmtPhone(r.ident));
      localStorage.setItem('cp-saved-pass', p);
    } catch {}
    if (okReset) {
      S.modal.tmpUid = u; S.modal.tmpRec = r;
      modal({
        title: 'تعيين رمز دائم',
        lead: 'الرمز المؤقت صحيح. اختر رمزًا دائمًا.',
        body: `${field('np', 'الرمز الجديد (6+)', 'password', 'autocomplete="new-password" placeholder="••••••••"')}`,
        actions: [
          { label: 'إلغاء', cls: 'g', action: 'cls' },
          { label: 'حفظ ودخول', action: 'setDurable' }
        ]
      });
      return;
    }
    if (S.admin) {
      S.admin = false;
      sessionStorage.removeItem('cp-admin');
      S.viewSrc = 'fb';
      applySource();
    }
    S.user = { id: u, name: r.name, ident: r.ident, profileId: r.profileId || '', claim: r.claim || '' };
    saveSess();
    adminUI();
    log('login', '');
    closeOverlay();
    toast('مرحباً ' + r.name);
    go(S.tab);
  } catch (e) { console.error(e); toast('خطأ'); }
  finally { setLoading(false); }
}

async function doSignup() {
  if (!needFb()) return;
  const n = $('#su_n').value.trim(), i = ident($('#su_i').value), p = $('#su_p').value;
  const t = $('#su_t').value, c = $('#su_c').value;
  const d = $('#su_d').value.trim() || 'Autre';
  const sp = $('#su_s').value.trim() || 'Général';
  const v = $('#su_v').value.trim();
  const m = $('#su_m').value.trim(), w = $('#su_w').value.trim();
  if (!n) return toast('اسم الشركة مطلوب');
  if (!validPhone(i) && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(i)) return toast('بيانات غير صالحة');
  if (p.length < 6) return toast('الرمز قصير');
  setLoading(true);
  try {
    const exists = await findUserByPhone(i);
    if (exists) { toast('الحساب موجود'); return; }
    const u = await uidOf(i);
    const salt = uid();
    const rec = { name: n, ident: fmtPhone(i), salt, hash: await sha(salt + p), createdAt: Date.now() };
    await S.fb.ref('users/' + u).set(rec);
    await indexUser(fmtPhone(i), u);
    const existing = findMatch(i);
    let profileId = '';
    if (existing) {
      await S.fb.ref(`${path(existing.type, existing.categorie)}/${existing.id}`).update({ owner: u });
      profileId = existing.id;
    } else {
      const item = { id: uid(), name: n, type: t, categorie: c, domaine: d, specialite: sp, ville: v, phone: fmtPhone(i), email: m, web: w, owner: u, createdAt: Date.now() };
      await S.fb.ref(`${path(t, c)}/${item.id}`).set(item);
      profileId = item.id;
    }
    await S.fb.ref('users/' + u + '/profileId').set(profileId);
    if (S.admin) {
      S.admin = false;
      sessionStorage.removeItem('cp-admin');
      S.viewSrc = 'fb';
      applySource();
    }
    S.user = { id: u, name: n, ident: fmtPhone(i), profileId, claim: '' };
    saveSess();
    adminUI();
    log('signup', n);
    closeOverlay();
    try {
      localStorage.setItem('cp-lastphone', fmtPhone(i));
      localStorage.setItem('cp-saved-phone', fmtPhone(i));
      localStorage.setItem('cp-saved-pass', p);
    } catch {}
    toast('تم إنشاء الحساب');
    go(S.tab);
  } catch (e) { console.error(e); toast('خطأ'); }
  finally { setLoading(false); }
}

async function adminPanel() {
  if (!S.admin || !needFb()) return;
  setLoading(true);
  try {
    const [usersRaw, logsRaw, profsRaw] = await Promise.all([
      S.fb.ref('users').once('value'),
      S.fb.ref('logs').limitToLast(50).once('value'),
      S.fb.ref('professionals').once('value')
    ]);
    S.usersList = {
      users: Object.entries(usersRaw.val() || {}),
      logs: Object.values(logsRaw.val() || {}).reverse(),
      profs: mapRaw(profsRaw.val())
    };
    try {
      const cutoff = Date.now() - 30 * 24 * 3600e3;
      const allLogs = logsRaw.val() || {};
      const toDelete = Object.entries(allLogs).filter(([, l]) => l.t < cutoff);
      if (toDelete.length) {
        const updates = {};
        toDelete.forEach(([k]) => { updates[k] = null; });
        S.fb.ref('logs').update(updates).catch(() => {});
      }
    } catch {}
    S.usersTab = 'with';
    S.usersQuery = '';
    renderUsersPanel();
  } catch (e) { console.error(e); toast('تعذر'); }
  finally { setLoading(false); }
}
function renderUsersPanel() {
  if (!S.usersList) return;
  const { users, logs, profs } = S.usersList;
  const userProfileIds = new Set(users.filter(([, u]) => u.profileId).map(([, u]) => u.profileId));
  const profilesNoAccount = profs.filter(p => !p.owner && !userProfileIds.has(p.id));
  const stats = `<div class="stats">
    <div class="stat"><b>${profs.length}</b><span>شركات</span></div>
    <div class="stat"><b>${users.length}</b><span>حسابات</span></div>
    <div class="stat ${profilesNoAccount.length ? 'warn' : ''}"><b>${profilesNoAccount.length}</b><span>بدون حساب</span></div>
    <div class="stat"><b>${users.filter(([, u]) => u.resetCode && u.resetExpiry > Date.now()).length}</b><span>رموز نشطة</span></div>
  </div>`;
  const toolsRow = `<div class="srcbar" style="margin-bottom:12px">
    <button data-a="csvfetch"><i class="fa-solid fa-cloud-arrow-down"></i> جلب CSV</button>
    <button data-a="exp"><i class="fa-solid fa-file-csv"></i> تصدير</button>
    <button data-a="admingen"><i class="fa-solid fa-key"></i> توليد</button>
  </div>`;
  const tabs = `<div class="srcbar" style="margin-bottom:12px">
    <button class="${S.usersTab === 'with' ? 'on' : ''}" data-a="utab" data-v="with">حسابات (${users.length})</button>
    <button class="${S.usersTab === 'no' ? 'on' : ''}" data-a="utab" data-v="no">بدون حساب (${profilesNoAccount.length})</button>
  </div>`;
  let content = '';
  if (S.usersTab === 'with') {
    const q = S.usersQuery;
    const filtered = users.filter(([, u]) => !q || hit([u.name, u.ident].join(' '), q));
    content = `<label class="fl"><input type="search" id="uq" placeholder="بحث في الحسابات..." value="${esc(q)}"></label>
      <div style="max-height:300px;overflow-y:auto">${filtered.length
        ? filtered.map(([id, u]) => `<div class="pr">
            <div style="flex:1">
              <b style="font-size:13px;color:var(--ink-900)">${esc(u.name)}</b>
              <small dir="ltr">${esc(u.ident)}</small>
              ${u.resetCode && u.resetExpiry > Date.now() ? '<small style="color:var(--warning)"><i class="fa-solid fa-key"></i> رمز نشط</small>' : ''}
            </div>
            <button class="hb" style="color:var(--teal-600);width:34px;height:34px;border-radius:8px" data-a="agGen" data-v="${esc(id)}" title="توليد رمز"><i class="fa-solid fa-key"></i></button>
            <button class="hb" style="color:var(--danger);width:34px;height:34px;border-radius:8px" data-a="udel" data-v="${esc(id)}" title="حذف"><i class="fa-solid fa-user-slash"></i></button>
          </div>`).join('')
        : empty('لا نتائج')}</div>`;
  } else {
    content = `<div style="max-height:340px;overflow-y:auto">${profilesNoAccount.length
      ? profilesNoAccount.map(p => `<div class="pr">
          <div style="flex:1">
            <b style="font-size:13px;color:var(--ink-900)">${esc(p.name)}</b>
            <small dir="ltr">${esc(fmtPhone(p.phone) || '—')}</small>
            <small>${esc([shown(p.domaine), p.ville].filter(Boolean).join(' · '))}</small>
          </div>
          <button class="bt o" style="min-height:32px;padding:0 12px;font-size:11px;border-radius:8px" data-a="agCreate" data-v="${esc(p.id)}"><i class="fa-solid fa-user-plus"></i> إنشاء + رمز</button>
        </div>`).join('')
      : '<p class="em" style="padding:16px"><i class="fa-solid fa-circle-check" style="color:var(--success);font-size:32px;display:block;margin-bottom:8px"></i>كل الشركات مرتبطة ✓</p>'}</div>`;
  }
  const logColor = { add:'add', delete:'del', edit:'edit', 'csv-push':'sync', 'reset-gen':'key', 'admin-gen':'key', signup:'add', login:'login', 'pass-change':'edit', 'account-auto':'add' };
  const logsHtml = logs.slice(0, 15).map(l => {
    const cls = logColor[l.a] || '';
    return `<div class="log-row"><span class="lg-time">${esc(new Date(l.t).toLocaleString('ar-MA', { numberingSystem: 'latn' }))}</span><span class="lg-act ${cls}">${esc(l.a)}</span><span style="flex:1">${esc(l.d)} · ${esc(l.u)}</span></div>`;
  }).join('') || empty('لا نشاط');
  openOverlay(`<div class="mb">
    <h2>لوحة التحكم الإدارية</h2>${toolsRow}${stats}${tabs}${content}
    <h3 class="t" style="margin-top:16px">سجل النشاط الأخير</h3>
    <div style="max-height:220px;overflow-y:auto">${logsHtml}</div>
    <div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>
  </div>`);
  trapFocus($('.mb'));
  const uq = $('#uq');
  if (uq) uq.oninput = debounce(e => {
    S.usersQuery = e.target.value;
    renderUsersPanel();
    const el = $('#uq');
    if (el) { el.focus(); el.setSelectionRange(9999, 9999); }
  }, 200);
}
async function udel(id) {
  if (!S.admin || !needFb() || !confirm('حذف المستخدم؟')) return;
  try {
    const rec = (await S.fb.ref('users/' + id).once('value')).val();
    await S.fb.ref('users/' + id).remove();
    if (rec?.ident) await unindexUser(rec.ident);
    log('user-del', id);
    toast('تم');
    adminPanel();
  } catch { toast('خطأ'); }
}

/* ============================================================
   DRAWER — navigation removed (bottom nav handles it now)
   ============================================================ */
function renderDrawer() {
  const isDark = document.documentElement.dataset.theme === 'dark';
  let userHtml;
  if (S.admin) {
    userHtml = `
      <div class="drawer-user-av admin-av"><i class="fa-solid fa-shield-halved"></i></div>
      <div class="drawer-user-info">
        <div class="drawer-user-name">وضع المدير</div>
        <div class="drawer-user-sub" style="direction:rtl;text-align:start">التحكم الكامل</div>
        <span class="drawer-user-badge admin-badge"><i class="fa-solid fa-bolt"></i> Admin</span>
      </div>`;
  } else if (S.user) {
    const st = S.user.profileId ? 'شركتك مرتبطة' : S.user.claim ? 'طلب ربط قيد المراجعة' : 'لا شركة مرتبطة';
