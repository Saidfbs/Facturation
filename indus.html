        <span class="drawer-user-badge"><i class="fa-solid fa-circle-check"></i> ${esc(st)}</span>
      </div>`;
  } else {
    userHtml = `
      <div class="drawer-user-av" style="background:var(--surface-2);color:var(--ink-400)">
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="drawer-user-info">
        <div class="drawer-user-name">مرحباً بك</div>
        <div class="drawer-user-sub" style="direction:rtl;text-align:start">سجّل للوصول الكامل</div>
      </div>`;
  }
  $('#drawerUser').innerHTML = userHtml;

  let body = '';

  /* Tools */
  body += `<div class="drawer-section">أدوات</div>`;
  body += `
    <button class="drawer-item" data-a="drawerTheme">
      <span class="ic"><i class="fa-solid ${isDark ? 'fa-sun' : 'fa-moon'}"></i></span>
      <span class="label">${isDark ? 'الوضع الفاتح' : 'الوضع الداكن'}<small>تبديل المظهر</small></span>
    </button>`;

  /* Admin tools */
  if (S.admin) {
    body += `<div class="drawer-divider"></div>`;
    body += `<div class="drawer-section">الإدارة</div>`;
    body += `
      <button class="drawer-item" data-a="drawerAdmin">
        <span class="ic"><i class="fa-solid fa-shield-halved"></i></span>
        <span class="label">لوحة التحكم<small>${S.fbCache.length} شركة</small></span>
      </button>
      ${canAdd() ? `<button class="drawer-item" data-a="drawerAdd"><span class="ic"><i class="fa-solid fa-plus"></i></span><span class="label">إضافة شركة<small>ملف جديد</small></span></button>` : ''}`;
  }

  /* Account */
  body += `<div class="drawer-divider"></div>`;
  body += `<div class="drawer-section">الحساب</div>`;

  if (S.admin) {
    body += `
      <button class="drawer-item active" data-a="noop" style="cursor:default">
        <span class="ic" style="background:var(--amber-soft);color:var(--amber-600)"><i class="fa-solid fa-shield-halved"></i></span>
        <span class="label">وضع المدير<small>مُسجّل حالياً كمدير</small></span>
      </button>
      <button class="drawer-item" data-a="drawerAdminToUser">
        <span class="ic"><i class="fa-solid fa-user"></i></span>
        <span class="label">الدخول كعضو<small>تحويل إلى حساب شركة</small></span>
      </button>
      <button class="drawer-item danger-item" data-a="drawerAdminLogout">
        <span class="ic"><i class="fa-solid fa-right-from-bracket"></i></span>
        <span class="label">الخروج من وضع المدير<small>للعودة إلى الزائر</small></span>
      </button>`;
  } else if (S.user) {
    body += `
      <button class="drawer-item active" data-a="noop" style="cursor:default">
        <span class="ic"><i class="fa-solid fa-user"></i></span>
        <span class="label">${esc(S.user.name)}<small>مسجّل كعضو</small></span>
      </button>
      <button class="drawer-item" data-a="drawerAccount">
        <span class="ic"><i class="fa-solid fa-user-gear"></i></span>
        <span class="label">إدارة الحساب<small>تعديل، رمز سري، حذف</small></span>
      </button>
      <button class="drawer-item" data-a="drawerUserToAdmin">
        <span class="ic" style="background:var(--amber-soft);color:var(--amber-600)"><i class="fa-solid fa-shield-halved"></i></span>
        <span class="label">الدخول كمدير<small>تبديل إلى لوحة التحكم</small></span>
      </button>
      <button class="drawer-item danger-item" data-a="drawerLogout">
        <span class="ic"><i class="fa-solid fa-right-from-bracket"></i></span>
        <span class="label">تسجيل الخروج<small>من حساب العضو</small></span>
      </button>`;
  } else {
    body += `
      <button class="drawer-item" data-a="drawerLogin">
        <span class="ic"><i class="fa-solid fa-right-to-bracket"></i></span>
        <span class="label">تسجيل الدخول كعضو<small>الهاتف + الرمز السري</small></span>
      </button>
      <button class="drawer-item" data-a="drawerAdminLogin">
        <span class="ic" style="background:var(--amber-soft);color:var(--amber-600)"><i class="fa-solid fa-shield-halved"></i></span>
        <span class="label">الدخول كمدير<small>لوحة التحكم</small></span>
      </button>`;
  }

  $('#drawerBody').innerHTML = body;
  $('#drawerFooter').innerHTML = '';
}
function openDrawer() {
  renderDrawer();
  $('#drawerBg').classList.add('on');
  $('#drawer').classList.add('on');
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    const btn = $('#drawer').querySelector('button');
    if (btn) btn.focus();
  }, 350);
}
function closeDrawer() {
  $('#drawerBg').classList.remove('on');
  $('#drawer').classList.remove('on');
  document.body.style.overflow = '';
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function go(t) {
  if (S.tab === 'dir' && t !== 'dir') { clearFilters(); }
  if (S.tab === 'exp' && t !== 'exp') { S.exp = { t: '', d: '', s: '', q: '', sort: S.exp.sort }; }
  S.tab = t;
  TABS.forEach(e => e.classList.toggle('on', e.id === 't-' + t));
  ({ home: dashboard, dir: directory, exp: explorer, fav: favorites })[t]?.();
  updateBotNav();
  scrollTo(0, 0);
  if ($('#drawer').classList.contains('on')) renderDrawer();
}

function logoutUser() {
  S.user = null;
  saveSess();
  try { localStorage.removeItem('cp-saved-pass'); localStorage.removeItem('cp-saved-phone'); } catch {}
  adminUI();
  toast('تم تسجيل الخروج من حساب العضو');
  go(S.tab);
}
function logoutAdmin() {
  S.admin = false;
  sessionStorage.removeItem('cp-admin');
  S.viewSrc = 'fb';
  applySource();
  adminUI();
  toast('تم الخروج من وضع المدير');
  go(S.tab);
}

/* ============================================================
   A — handlers
   ============================================================ */
const A = {
  theme, adm,
  noop() {},
  add: () => canAdd() ? form(null) : toast('غير مسموح'),
  acc: account, usr: adminPanel, udel, udelme: deleteMyAccount,
  alogin: openLogin, asignup: openSignup, doLogin, doSignup, setDurable,
  forgotopen: forgotOpen, fqFind,
  changepass: changePassword, doChangePass,
  togfav: toggleFav,
  drawer: openDrawer,
  drawerClose: closeDrawer,
  drawerTheme() { theme(); renderDrawer(); },
  drawerAdd() { closeDrawer(); setTimeout(() => canAdd() ? form(null) : toast('غير مسموح'), 200); },
  drawerAccount() { closeDrawer(); setTimeout(account, 200); },
  drawerAdmin() { closeDrawer(); setTimeout(adminPanel, 200); },
  drawerLogin() { closeDrawer(); setTimeout(openLogin, 200); },
  drawerAdminLogin() { closeDrawer(); setTimeout(adm, 200); },
  drawerLogout() {
    closeDrawer();
    setTimeout(() => {
      logoutUser();
      setTimeout(openDrawer, 300);
    }, 150);
  },
  drawerAdminLogout() {
    closeDrawer();
    setTimeout(() => {
      logoutAdmin();
      setTimeout(openDrawer, 300);
    }, 150);
  },
  drawerAdminToUser() {
    closeDrawer();
    setTimeout(() => {
      if (!confirm('سيتم الخروج من وضع المدير والتحويل لتسجيل الدخول كعضو. متابعة؟')) return;
      logoutAdmin();
      setTimeout(openLogin, 300);
    }, 150);
  },
  drawerUserToAdmin() {
    closeDrawer();
    setTimeout(() => {
      if (!confirm('سيتم تسجيل الخروج من حساب العضو والدخول كمدير. متابعة؟')) return;
      S.user = null;
      saveSess();
      try { localStorage.removeItem('cp-saved-pass'); localStorage.removeItem('cp-saved-phone'); } catch {}
      adminUI();
      setTimeout(adm, 300);
    }, 150);
  },
  doUndo() { if (undoAction) { undoAction(); undoAction = null; $('#ts').classList.remove('on'); } },
  uout() {
    S.user = null;
    saveSess();
    try { localStorage.removeItem('cp-saved-pass'); localStorage.removeItem('cp-saved-phone'); } catch {}
    adminUI();
    closeOverlay();
    toast('تم تسجيل الخروج');
    go(S.tab);
  },
  findme: claimCancel, claimsearch: claimSearch, claimsend: claimSend,
  resetreq: resetReq, rgenfile: rgenFile,
  admingen: adminGen, agFind, agGen, agCreate,
  utab(v) { S.usersTab = v; S.usersQuery = ''; renderUsersPanel(); },
  rcopy(v) { navigator.clipboard?.writeText(v).then(() => toast('تم النسخ')).catch(() => toast('تعذر')); },
  srcfb() { if (!S.admin) return; S.viewSrc = 'fb'; applySource(); go('home'); },
  srccsv() { if (!S.admin) return; if (!S.csvCache.length) { toast('اجلب CSV أولاً'); csvFetch(); return; } S.viewSrc = 'csv'; applySource(); go('home'); },
  csvfetch: () => csvFetch(false), csvpush: csvPush,
  tab: v => {
    if (S.tab === v) {
      if (v === 'dir') { clearFilters(); directory(); }
      else if (v === 'exp') { S.exp = { t: '', d: '', s: '', q: '', sort: S.exp.sort }; explorer(); }
      else { scrollTo({ top: 0, behavior: 'smooth' }); }
    } else {
      go(v);
    }
  },
  cls: closeOverlay, open: profile, shr: share, pdf: makePDF,
  edit: id => { const r = byId(id); canEdit(r) ? form(r) : toast('غير مسموح'); },
  del: delAsk, delok: delOk, save, exp: exportCSV, vrf: verifyToggle,
  favclr() { if (confirm('مسح كل المفضلة؟')) { S.fav = []; try { localStorage.removeItem('cp-fav'); } catch {} favorites(); } },
  manageacc: manageAccount,
  login() {
    const pw = $('#pw').value;
    if (pw === ADMIN_PASS) {
      const save = $('#pw_save')?.checked;
      if (save) localStorage.setItem('cp-admin-pw', pw);
      else localStorage.removeItem('cp-admin-pw');
      S.user = null;
      saveSess();
      try { localStorage.removeItem('cp-saved-pass'); localStorage.removeItem('cp-saved-phone'); } catch {}
      S.admin = true;
      sessionStorage.setItem('cp-admin', '1');
      adminUI();
      closeOverlay();
      toast('مرحباً (وضع المدير)');
      csvFetch(true);
      go(S.tab);
    } else {
      $('#pw').parentElement.classList.add('er');
      toast('كلمة المرور خاطئة');
    }
  },
  stat(v) {
    const i = v.indexOf(':'), k = v.slice(0, i), x = v.slice(i + 1);
    const pickMatch = v.match(/^pick:(.+)$/);
    if (pickMatch) { openFilter(pickMatch[1]); return; }
    clearFilters();
    S.filter[k] = [x];
    go('dir');
  },
  bardirect(v, el) {
    const filterKey = el.dataset.k;
    clearFilters();
    S.filter[filterKey] = [v];
    go('dir');
  },
  chipx(v, el) { const k = el.dataset.k; S.filter[k] = S.filter[k].filter(x => norm(x) !== norm(el.dataset.v)); S.ui.lim = 60; clearFacetCache(); directory(); },
  clr() { clearFilters(); directory(); },
  more() { S.ui.lim += 60; directory(); },
  qx() { S.filter.q = ''; $('#q').value = ''; directory(); },
  xt: v => { S.exp = { t: v, d: '', s: '', q: '', sort: S.exp.sort }; explorer(); },
  xd: v => { S.exp.d = v; S.exp.s = ''; S.exp.q = ''; explorer(); },
  xs: v => { S.exp.s = v; S.exp.q = ''; explorer(); },
  xc(v) {
    const x = S.exp;
    S.exp = v === '' ? { t: '', d: '', s: '', q: '', sort: x.sort }
      : v === 't' ? { t: x.t, d: '', s: '', q: '', sort: x.sort }
      : v === 'd' ? { t: x.t, d: x.d, s: '', q: '', sort: x.sort }
      : x;
    explorer();
  },
  expSort(v) { S.exp.sort = v; explorer(); },
  fopen: openFilter, fcls: closeOverlay,
  fclr() { clearFilters(); renderFilter(); directory(); },
  fsect(v) { S.fp = 'pick'; S.fk = v; renderFilter(); },
  fback() { S.fp = 'sections'; S.fk = null; renderFilter(); },
  fsort(v) { S.sortF[S.fk] = v; renderFilter(); },
  fclearsec() { S.filter[S.fk] = []; S.ui.lim = 60; clearFacetCache(); renderFilter(); directory(); },
  fpick(v) {
    const k = S.fk, arr = S.filter[k];
    const i = arr.findIndex(x => norm(x) === norm(v));
    if (i >= 0) arr.splice(i, 1);
    else arr.push(v);
    S.ui.lim = 60;
    clearFacetCache();
    renderFilter();
    directory();
  },
  fdone() {
    closeOverlay();
    S.tab = 'dir';
    TABS.forEach(e => e.classList.toggle('on', e.id === 't-dir'));
    directory();
    updateBotNav();
    scrollTo(0, 0);
  }
};

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) { e.stopPropagation(); A[el.dataset.a](el.dataset.v, el); }
  else if (e.target.id === 'md') closeOverlay();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeOverlay(); closeDrawer(); }
  if (e.key === 'Enter' && e.target.classList?.contains('card')) A.open(e.target.dataset.v);
});

const onQueryInput = debounce(e => {
  S.filter.q = e.target.value;
  S.ui.lim = 60;
  clearFacetCache();
  directory();
}, 200);
$('#q').addEventListener('input', onQueryInput);

/* ============================================================
   INIT
   ============================================================ */
(async () => {
  adminUI();
  updateFavBadge();
  updateBotNav();
  try {
    if (window.firebase) {
      firebase.initializeApp(FBC);
      S.fb = firebase.database();
    }
  } catch (e) { console.warn(e); }
  await loadDB();
  await refreshUser();
  adminUI();
  updateFavBadge();
  go('home');
  setLoading(false);
  if (S.admin) csvFetch(true);
  const m = location.hash.match(/^#p=(.+)$/);
  if (m) setTimeout(() => { const r = byId(m[1]); if (r) profile(r.id); else toast('الرابط غير صالح'); }, 300);
})();

})();
</script>
