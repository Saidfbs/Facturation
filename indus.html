<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Réseau Industriel — Maroc</title>
<meta name="theme-color" content="#517DA2">
<meta name="description" content="نربط الموردين والشركات في مكان واحد">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== Réseau Industriel — Telegram-inspired design system ===== */
:root{
  --hd:#517DA2;--hdt:#fff;--pri:#3390EC;--btn:#3390EC;--btn2:#2B7FD6;--ok:#4FAE4E;
  --bg:#DDE8D3;--sf:#fff;--sf2:#F4F4F5;--sf3:#E7EBEF;--bd:#E6E8EA;
  --tx:#0F1419;--tx2:#707579;--tx3:#A2ACB0;--out:#EFFDDE;--in:#fff;
  --bad:#E53935;--star:#F5A400;--fb:#1877F2;--wa:#25D366;
  --sh:0 1px 2px rgba(16,35,47,.15);--sh2:0 10px 30px rgba(16,35,47,.35);
  --r:14px;--ff:'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:light;
}
[data-theme=dark]{
  --hd:#242F3D;--hdt:#fff;--pri:#6AB2F2;--bg:#0E1621;--sf:#17212B;--sf2:#1D2A38;--sf3:#2B3A4A;--bd:#0E1621;
  --tx:#F5F5F5;--tx2:#7F91A4;--tx3:#5B6B7C;--out:#2B5278;--in:#182533;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font:14px/1.55 var(--ff);color:var(--tx);min-height:100vh;min-height:100dvh;background-color:var(--bg);
  background-image:radial-gradient(rgba(60,90,70,.10) 1.4px,transparent 1.6px),radial-gradient(rgba(60,90,70,.07) 1px,transparent 1.2px);
  background-size:30px 30px;background-position:0 0,15px 15px}
[data-theme=dark] body{background-image:radial-gradient(rgba(106,178,242,.06) 1.4px,transparent 1.6px),radial-gradient(rgba(255,255,255,.03) 1px,transparent 1.2px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--tx3);border-radius:3px}

/* Header */
header{position:fixed;inset:0 0 auto;z-index:30;padding-top:var(--st);background:var(--hd);color:var(--hdt);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.hin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,#72D5FD,#2A9EF1);color:#fff;display:grid;place-items:center;flex:none;font-size:17px}
.brand b{display:block;font-size:17px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;opacity:.75;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:2px}
.ib{width:40px;height:40px;border-radius:50%;color:inherit;display:inline-grid;place-items:center;transition:background .15s;flex:none;font-size:16px}
.ib:hover{background:rgba(255,255,255,.14)}.ib:active{background:rgba(255,255,255,.24)}
main{max-width:1100px;margin:0 auto;padding:calc(68px + var(--st)) 12px calc(88px + var(--sb))}
.tab{display:none}.tab.on{display:block;animation:fu .2s}
@keyframes fu{from{opacity:0;transform:translateY(6px)}}

/* Hero bubble */
.dp{width:max-content;margin:4px auto 12px;padding:3px 14px;border-radius:14px;background:rgba(0,0,0,.28);color:#fff;font-size:12px;font-weight:600}
.hero{padding:20px 20px 30px;border-radius:18px 18px 18px 4px;background:var(--in);position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero::before{content:"\f3fe";font-family:"Font Awesome 6 Brands";position:absolute;inset-inline-end:-10px;bottom:-30px;font-size:140px;opacity:.07;color:var(--pri)}
.hero>*{position:relative}
.hero .bdg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;background:var(--btn);color:#fff;padding:2px 12px;border-radius:12px;margin-bottom:10px}
.hero h2{font-size:21px;font-weight:700;line-height:1.35}
.hero p{color:var(--tx2);font-size:13.5px;margin-top:6px;max-width:520px}
.hero .bt{margin-top:16px}
.hero .tk{position:absolute;bottom:6px;inset-inline-end:12px;font-size:11px;color:var(--tx2);display:flex;gap:4px;align-items:center}
.hero .tk i{color:var(--pri);font-size:12px}

/* Section heads */
.sec{display:flex;align-items:center;gap:10px;margin:22px 4px 10px}
.sec>i{width:34px;height:34px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-size:13px}
.sec b{flex:1;font-size:15px;font-weight:700;color:var(--pri)}
.sec small{display:block;color:var(--tx2);font-size:12px;font-weight:400}
.sec em{font-style:normal;background:var(--ok);color:#fff;font-weight:700;font-size:12px;padding:0 8px;min-width:22px;height:22px;line-height:22px;border-radius:11px;text-align:center}

/* Stats */
.g4{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{background:var(--in);padding:12px;border-radius:var(--r);display:flex;align-items:center;gap:12px;text-align:start;box-shadow:var(--sh);transition:background .15s}
.sc:hover{background:var(--sf2)}.sc:active{transform:scale(.97)}
.sc>i{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,#72D5FD,#2A9EF1);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.g4 .sc:nth-child(4n+2)>i{background:linear-gradient(140deg,#A0DE7E,#54CB68)}
.g4 .sc:nth-child(4n+3)>i{background:linear-gradient(140deg,#E0A2F3,#D669ED)}
.g4 .sc:nth-child(4n)>i{background:linear-gradient(140deg,#FFCD6A,#FFA85C)}
.sc b{font-size:22px;font-weight:700;line-height:1.1}.sc span{font-size:12.5px;color:var(--tx2);font-weight:500}
.seg{display:flex;height:8px;gap:2px;margin-bottom:8px;border-radius:4px;overflow:hidden;background:var(--sf3)}.seg i{display:block}

/* Search / filters */
.sr{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 14px;background:var(--sf);border-radius:23px;box-shadow:var(--sh);border:2px solid transparent}
.sr:focus-within{border-color:var(--btn)}.sr>i{color:var(--tx3)}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0}
.sr .x{width:32px;height:32px;border-radius:50%;color:var(--tx3)}.sr .x:hover{background:var(--sf2)}
.fbtn{width:36px;height:36px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;position:relative}
.fbtn:hover{background:var(--btn2)}
.bub{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--ok);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--sf)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 14px;border-radius:16px;background:var(--out);color:var(--tx);font-weight:600;font-size:12.5px;box-shadow:var(--sh)}
.chip button{width:24px;height:24px;border-radius:50%;font-size:10px;color:var(--tx2)}.chip button:hover{background:rgba(0,0,0,.1)}
.inf{color:var(--tx2);font-size:12.5px;margin:12px 4px 8px;font-weight:500}
.pill{display:flex;gap:6px;margin:12px 0;overflow-x:auto;padding-bottom:2px}
.pill button{flex:none;height:34px;padding:0 16px;border-radius:17px;background:var(--sf);color:var(--tx2);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.pill button:hover{background:var(--sf2)}.pill button.on{background:var(--btn);color:#fff}

/* Chat-list cards */
.ls{display:grid;background:var(--sf);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;padding:10px 14px;background:var(--sf);cursor:pointer;transition:background .12s;position:relative}
.card::after{content:"";position:absolute;inset-inline:80px 0;bottom:0;height:1px;background:var(--bd)}
.card:hover{background:var(--sf2)}.card:active{background:var(--sf3)}
.card.mine{background:var(--out)}
.av{width:54px;height:54px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:600;font-size:18px;flex:none;align-self:center}
.cm{min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
.ti{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ti i{color:var(--pri);font-size:13px}
.ir{display:flex;flex-wrap:wrap;gap:0 10px;font-size:12.5px;color:var(--tx2)}.ir i{color:var(--tx3);font-size:11px;margin-inline-end:4px}
/* type + category + visits + rating — always a single line */
.tags{display:flex;flex-wrap:nowrap;gap:4px;align-items:center;overflow:hidden;white-space:nowrap}
.tg{flex:none;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--sf2);color:var(--tx2);display:inline-flex;align-items:center;gap:4px}
.tg.four{background:rgba(51,144,236,.14);color:var(--pri)}
.tg.exp{background:rgba(79,174,78,.16);color:#3E9A3D}[data-theme=dark] .tg.exp{color:#7BD67A}
.tg.me{background:var(--ok);color:#fff}.tg.v{background:rgba(51,144,236,.16);color:var(--pri)}
.tg.r{background:rgba(255,179,0,.2);color:#8A5A00}.tg.r i{color:var(--star)}[data-theme=dark] .tg.r{color:#FFD257}
.tg.vw i{color:var(--pri)}
.ca{display:grid;grid-template-columns:repeat(2,32px);gap:0;align-self:center}
.ca button,.ca a{width:32px;height:32px;border-radius:50%;color:var(--tx3);display:grid;place-items:center;font-size:14px;transition:.12s}
.ca button:hover,.ca a:hover{background:var(--sf3);color:var(--pri)}
.ca .on{color:var(--star)}.ca .wa{color:var(--wa)}.ca .pdf{color:var(--bad)}
.chip2{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--in);cursor:pointer;width:100%;text-align:start;margin-bottom:2px;box-shadow:var(--sh);border-radius:12px}
.chip2:hover{background:var(--sf2)}
.chip2 .av{width:42px;height:42px;font-size:15px}.chip2 .bd{flex:1;min-width:0}
.chip2 b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip2 small{color:var(--tx2);font-size:12px}
.em{text-align:center;padding:40px 16px;color:var(--tx2);background:var(--sf);grid-column:1/-1;border-radius:var(--r)}
.em i{font-size:30px;display:block;margin-bottom:8px;color:var(--tx3)}.em b{display:block;color:var(--tx);font-size:16px}

/* Explorer */
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:12px 0}
.cr button{padding:5px 14px;border-radius:16px;background:var(--sf);font-weight:600;font-size:12.5px;box-shadow:var(--sh)}.cr button:hover{background:var(--sf2)}
.cr button:last-child{background:var(--btn);color:#fff}.cr i{font-size:9px;color:var(--tx3)}
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;margin-bottom:2px;background:var(--sf);text-align:start;font-weight:600;box-shadow:var(--sh);border-radius:12px}
.rw:hover{background:var(--sf2)}
.rw>i:first-child{width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,#72D5FD,#2A9EF1);color:#fff;display:grid;place-items:center}
.rw span{flex:1}.rw em{font-style:normal;background:var(--ok);color:#fff;border-radius:11px;padding:0 10px;font-size:12.5px;font-weight:700;min-width:24px;text-align:center}
.rw>i:last-child{font-size:10px;color:var(--tx3)}

/* Buttons */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 24px;border-radius:21px;font-weight:700;background:var(--btn);color:#fff;transition:.12s}
.bt:hover{background:var(--btn2)}.bt:active{transform:scale(.97)}.bt:disabled{opacity:.45;pointer-events:none}
.bt.g{background:var(--sf2);color:var(--tx)}.bt.g:hover{background:var(--sf3)}.bt.full{width:100%}

/* Modal */
#md{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
#md.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);overflow-y:auto;background:var(--sf);padding:24px 20px 20px;border-radius:18px;box-shadow:var(--sh2);animation:mi .2s;position:relative;margin:auto}
@keyframes mi{from{transform:translateY(24px);opacity:0}}
.sheet h2{font-size:20px;font-weight:700;margin-bottom:4px}.lead{color:var(--tx2);font-size:13px;margin-bottom:14px}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.ac .full{grid-column:1/-1}
.fs{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;text-align:start;border-radius:12px;margin-bottom:2px}
.fs:hover{background:var(--sf2)}.fs.on{background:var(--out)}
.fs .ic{width:40px;height:40px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;flex:none}
.fs .nm{flex:1;font-weight:600;word-break:break-word}.fs .val{color:var(--pri);font-size:12px;max-width:55%;text-align:end}
.fs .n{background:var(--sf2);padding:0 9px;border-radius:10px;font-size:12px;font-weight:700}.fs.on .n{background:var(--btn);color:#fff}
.fs .box{width:22px;height:22px;border-radius:50%;border:2px solid var(--tx3);display:grid;place-items:center;color:transparent;font-size:10px;flex:none}
.fs.on .box{background:var(--btn);border-color:var(--btn);color:#fff}
.fs.clr{color:var(--bad);justify-content:center}
.fb{color:var(--pri);font-weight:700;padding:6px 10px;margin-bottom:8px;border-radius:16px}.fb:hover{background:var(--sf2)}
.ff{position:sticky;bottom:-20px;margin:16px -20px -20px;padding:12px 20px;background:var(--sf);border-top:1px solid var(--bd);display:flex;gap:8px}.ff .bt{flex:1}
.cc{background:rgba(0,0,0,.2);padding:0 8px;border-radius:10px}

/* Profile */
.ph{margin:-24px -20px 0;padding:30px 20px 18px;text-align:center;color:#fff;background:var(--hd);border-radius:18px 18px 0 0}
.pl{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(140deg,#72D5FD,#2A9EF1);color:#fff;display:grid;place-items:center;font-size:32px}
.pn2{font-size:20px;font-weight:700}.ps{font-size:12.5px;opacity:.85}
.ph .tags{justify-content:center;margin-top:10px}.ph .tg{background:rgba(255,255,255,.2);color:#fff}.ph .tg.r{color:#fff}.ph .tg.r i{color:#FFD257}.ph .tg.vw i{color:#fff}
.pa{display:flex;gap:10px;justify-content:center;margin:18px 0 6px}
.pa .ib{width:46px;height:46px;background:var(--sf2);color:var(--pri);font-size:17px}.pa .ib:hover{background:var(--sf3)}
.pa .wa{background:var(--wa);color:#fff}.pa .wa:hover{background:#1FB955}.pa .pdf{color:var(--bad)}
.rb{margin:14px 0;padding:14px;background:var(--out);border-radius:14px 14px 4px 14px;text-align:center}
.rb small{display:block;color:var(--tx2);font-size:12px;margin-bottom:4px}
.rb .avg{font-size:13px;font-weight:700;margin-bottom:4px}
.stars{display:flex;justify-content:center;gap:2px;direction:ltr}
.stars button{width:42px;height:42px;font-size:26px;color:var(--tx3);transition:.1s;border-radius:50%}
.stars button.on{color:var(--star)}.stars button:hover{transform:scale(1.15);color:var(--star)}
.vr{display:flex;gap:12px;align-items:center;padding:10px 0;box-shadow:inset 0 -1px 0 var(--bd)}.vr:last-child{box-shadow:none}
.vr>i,.vr>a{width:42px;height:42px;border-radius:50%;background:var(--sf2);color:var(--pri);display:grid;place-items:center;flex:none}
.vr>a:hover{background:var(--btn);color:#fff}
.vr small{display:block;color:var(--tx3);font-size:11.5px}.vr b{overflow-wrap:anywhere;font-weight:600}

/* About */
.ah{text-align:center;padding:30px 20px;color:#fff;background:var(--hd);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--sh)}
.ah .bg{width:72px;height:72px;border-radius:50%;background:linear-gradient(140deg,#72D5FD,#2A9EF1);color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:30px}
.ah h2{font-size:17px;font-weight:700;letter-spacing:.03em}.ah p{font-size:13px;opacity:.9}
.as{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.as div{text-align:center;padding:12px 4px;background:var(--in);border-radius:var(--r);box-shadow:var(--sh)}
.as b{display:block;font-size:22px;color:var(--pri);font-weight:700}.as span{font-size:12px;color:var(--tx2)}
.lk{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--sf);margin-bottom:2px;box-shadow:var(--sh);border-radius:12px}
.lk .li{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:19px;flex:none}
.lk.fb .li{background:var(--fb)}.lk.wa .li{background:var(--wa)}
.lk .bd{flex:1;min-width:0}.lk b{display:block;font-size:14.5px;font-weight:600}.lk small{color:var(--tx2)}
.lk .a{display:flex;gap:4px}
.lk .a a,.lk .a button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sf2);color:var(--pri)}
.lk .a a:hover,.lk .a button:hover{background:var(--btn);color:#fff}
.wab{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;margin-top:8px;border-radius:25px;background:var(--wa);color:#fff;font-weight:700;font-size:15px;box-shadow:var(--sh);transition:.12s}
.wab:hover{background:#1FB955}.wab:active{transform:scale(.98)}.wab i{font-size:22px}
.cho{display:flex;align-items:center;gap:12px;padding:10px;background:var(--sf2);border-radius:12px;margin-bottom:6px;width:100%;text-align:start}
.cho .li{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--btn);flex:none}
.cho.s .li{background:#54CB68}
.cho>div:nth-child(2){flex:1;min-width:0}.cho b{display:block;font-weight:600}.cho small{color:var(--tx2)}
.cho .a{display:flex;gap:4px;flex:none}
.cho .a a,.cho .a button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sf3)}
.cho .a a{background:var(--btn);color:#fff}.cho .a a:hover,.cho .a button:hover{background:var(--btn2);color:#fff}

/* Bottom nav */
#bn{position:fixed;inset-inline:0;bottom:0;z-index:29;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + var(--sb));background:var(--sf);box-shadow:0 -1px 0 var(--bd)}
.bi{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--tx2);position:relative;padding:2px 0}
.bi i{width:56px;height:28px;border-radius:14px;display:grid;place-items:center;font-size:17px;transition:background .15s}
.bi:hover i{background:var(--sf2)}.bi.on{color:var(--pri);font-weight:700}.bi.on i{background:rgba(51,144,236,.14)}
.fvb{position:absolute;top:-2px;inset-inline-end:calc(50% - 26px);min-width:18px;height:18px;border-radius:9px;background:var(--ok);color:#fff;font-weight:700;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.fvb[hidden]{display:none}

/* Toast / loader / offline */
#ts{position:fixed;inset-inline:0;bottom:calc(84px + var(--sb));margin:auto;width:max-content;max-width:calc(100% - 32px);z-index:90;background:rgba(33,43,54,.92);color:#fff;padding:10px 20px;border-radius:22px;font-weight:500;font-size:13px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;box-shadow:var(--sh2)}
#ts.on{opacity:1;transform:none}

function parseRows(t){const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const h=t[i];
    if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}

    else c+=h}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows}

function expList(){const{t,d,s,sort}=S.exp,base=S.db.filter(r=>!t||r.type===t).filter(matchExp);
  const grp=(l,k)=>{const m=new Map();l.forEach(r=>{const v=r[k]||'—';m.set(v,(m.get(v)||0)+1)});return[...m].sort(sort==='name'?(a,b)=>a[0].localeCompare(b[0],'ar'):(a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'))};
  const row=(i,n,c,a,v)=>`<button class="rw" data-a="${a}" data-v="${esc(v)}"><i class="fa-solid ${i}"></i><span>${esc(n)}</span><em>${c}</em><i class="fa-solid fa-chevron-left"></i></button>`;
  if(S.exp.q)return base.length?'<div class="ls">'+base.map(card).join('')+'</div>':empty('لا نتائج');
  if(!t)return['fournisseurs','experts'].map(x=>({n:TL[x]+'ون',c:S.db.filter(r=>r.type===x).length,k:x,i:x==='experts'?'fa-user-tie':'fa-truck-field'})).sort((a,b)=>sort==='name'?a.n.localeCompare(b.n,'ar'):b.c-a.c).map(x=>row(x.i,x.n,x.c,'xt',x.k)).join('');

/* Navigation (the open tab is saved and restored on reload) */
function go(t,keep=false){if(!TABS.includes(t))t='home';
  if(!keep){if(S.tab==='dir'&&t!=='dir')clearF();if(S.tab==='exp'&&t!=='exp')S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort}}
  S.tab=t;lsSet('cp-tab',t);
  $$('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+t));({home,dir:dirShell,fav:favShell,exp:explorer,about})[t]();
  $$('.bi').forEach(e=>e.classList.toggle('on',e.dataset.v===t));topbar();window.scrollTo(0,0)}
const rerender=()=>go(S.tab,true);
const refreshBg=()=>{if(S.tab==='dir')dirList();else if(S.tab==='home')home();else if(S.tab==='fav')favShell();else if(S.tab==='exp'){const x=$('#xl');if(x)x.innerHTML=expList()}};

/* ================= Rating & Profile ================= */
const rateInner=r=>{const t=getRate(r.id),my=S.myR[rk(r)]||0;
  return`<small>${my?'تقييمك الحالي — يمكنك تغييره':'قيّم هذا الحساب'}</small>${t.n?`<div class="avg"><span style="color:var(--star)">${starsHtml(t.avg)}</span> ${t.avg.toFixed(1)} <small style="display:inline">(${t.n} تقييم)</small></div>`:''}<div class="stars">${[1,2,3,4,5].map(i=>`<button class="${my>=i?'on':''}" data-a="rate" data-v="${esc(r.id)}" data-n="${i}" aria-label="${i}"><i class="fa-${my>=i?'solid':'regular'} fa-star"></i></button>`).join('')}</div>`};
async function rate(id,el){const r=byId(id),n=+el.dataset.n;if(!r||!n)return;if(!S.fb)return toast('التقييم غير متاح بدون اتصال');
  const k=rk(r),prev=S.myR[k]||0;
  try{const res=await S.fb.ref('ratings/'+k).transaction(c=>{c=c||{};c.nom=r.name;c.somme=(c.somme||0)-prev+n;c.nombre=(c.nombre||0)+(prev?0:1);c.dernier=Date.now();return c});
    S.rates.set(k,res.snapshot.val());S.myR[k]=n;lsSet('cp-my-rates',S.myR);
    const b=$('#rb');if(b)b.innerHTML=rateInner(r);toast('شكراً على تقييمك ⭐');refreshBg()}
  catch(e){console.warn(e);toast('تعذر حفظ التقييم')}}

const SEP='➖➖➖➖➖➖➖➖➖➖➖➖';
async function share(id){const r=byId(id);if(!r)return;const p=fmtPhone(r.phone),w=url(r.web),t=getRate(id);
  const L=[`👤 ${r.name}`,SEP,`🏷️ النوع: ${TL[r.type]}`,`📂 التصنيف: ${CL[r.categorie]}`];
  if(shown(r.domaine))L.push(`🏭 القطاع: ${r.domaine}`);if(shown(r.specialite))L.push(`🛠️ التخصص: ${r.specialite}`);if(r.ville)L.push(`📍 المدينة: ${r.ville}`);
  if(p)L.push(`📞 الهاتف: ${p}`);if(r.email)L.push(`✉️ البريد: ${r.email}`);if(w)L.push(`🌐 الموقع: ${w}`);if(t.n)L.push(`⭐ التقييم: ${t.avg.toFixed(1)}/5 (${t.n})`);
  const link=baseUrl()?`${baseUrl()}#p=${r.id}`:'';if(link)L.push(SEP,`🔗 ${link}`);const text=L.join('\n');
  if(navigator.share){try{await navigator.share({title:r.name,text});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);toast('تم النسخ')}catch{toast('تعذر النسخ')}
  setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener'),0)}
async function shareLink(v,el){const u=el?.dataset?.url||'',n=el?.dataset?.name||'';if(!/^https?:\/\//i.test(u))return toast('رابط غير صالح');

/* ================= PDF ================= */
async function loadPdf(){if(window.html2canvas&&window.jspdf)return;
  const ld=u=>new Promise((a,b)=>{const e=document.createElement('script');e.src=u;e.onload=a;e.onerror=b;document.head.appendChild(e)});
  try{await Promise.all([window.html2canvas?0:ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),window.jspdf?0:ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')])}
  catch{throw new Error('تعذر تحميل مكتبة PDF')}}
function pdfHtml(r){const p=fmtPhone(r.phone),w=url(r.web),t=getRate(r.id),rows=[];
  if(shown(r.domaine))rows.push(['fa-industry','القطاع',r.domaine]);if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',r.specialite]);if(r.ville)rows.push(['fa-location-dot','المدينة',r.ville]);
  if(p)rows.push(['fa-phone','الهاتف',p]);if(r.email)rows.push(['fa-envelope','البريد',r.email]);if(w)rows.push(['fa-globe','الموقع',r.web]);if(t.n)rows.push(['fa-star','التقييم',`${t.avg.toFixed(1)} / 5  (${t.n})`]);
  const b=baseUrl(),qr=b?`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(b+'#p='+r.id)}&margin=0" crossorigin="anonymous" alt="QR">`:'';
  return`<div class="pc" data-root><div class="pl2"><div class="lg"><i class="fa-solid ${domIcon(r.domaine)}"></i></div><div class="nm">${esc(r.name)}</div><div class="sb">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div></div><div class="pr">${rows.map(([i,k,v])=>`<div class="prw"><div class="ic"><i class="fa-solid ${i}"></i></div><div><div class="k">${k}</div><div class="v">${esc(v)}</div></div></div>`).join('')}</div><div class="pft"><b>RÉSEAU INDUSTRIEL</b>${qr}</div></div>`}
async function makePDF(id){const r=byId(id);if(!r)return;busy(true);let h=null;
  try{await loadPdf();h=document.createElement('div');h.className='pdf-stage';h.innerHTML=pdfHtml(r);document.body.appendChild(h);
    try{await document.fonts?.ready}catch{}await new Promise(x=>setTimeout(x,700));
    const cv=await html2canvas(h.querySelector('[data-root]'),{scale:2,backgroundColor:'#E7EBEF',useCORS:true,logging:false}),{jsPDF}=window.jspdf,W=200,H=W*cv.height/cv.width;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[W,H]});pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);
    pdf.save(`Reseau-${r.name.replace(/\s+/g,'_')}.pdf`);toast('تم توليد بطاقة PDF')}
  catch(e){toast(e.message||'خطأ في توليد PDF')}finally{h?.remove();busy(false)}}

/* ================= Actions ================= */
const linkItem=(l,s,u,cls,ic)=>`<div class="cho ${cls}"><div class="li"><i class="fa-solid ${ic}"></i></div><div><b>${esc(l)}</b><small>${esc(s)}</small></div><div class="a"><a href="${u}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i></a><button data-a="shrLink" data-url="${esc(u)}" data-name="${esc(l)}"><i class="fa-solid fa-share-nodes"></i></button></div></div>`;
const A={
  theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(d);lsSet('cp-theme',d);topbar();toast(d==='dark'?'الوضع الداكن':'الوضع الفاتح')},
  pdf:makePDF,cls:closeM,open:profile,shr:share,fav:toggleFav,shrLink:shareLink,rate,
  openForms(){openM(`<h2>نماذج الإدخال</h2><p class="lead">اختر نوع التسجيل — سيُفتح نموذج Google</p>${linkItem('تسجيل خبير','أدخل بياناتك كخبير',FORM_E,'','fa-user-tie')}${linkItem('تسجيل مورّد','أدخل بياناتك كمورّد',FORM_F,'','fa-truck-field')}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
  openSheets(){openM(`<h2>فتح الأوراق</h2><p class="lead">اختر الورقة لعرضها في Google Sheets</p>${linkItem('ورقة الخبراء','عرض جدول الخبراء',SHEET_E,'s','fa-table')}${linkItem('ورقة الموردين','عرض جدول الموردين',SHEET_F,'s','fa-table')}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
  tab(v){if(S.tab===v){window.scrollTo({top:0,behavior:'smooth'});if(v==='exp'){S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};explorer()}else if(v==='dir'){clearF();dirShell()}else if(v==='fav')favShell()}else go(v)},
  stat(v){if(v==='f'){openFilter();return}const i=v.indexOf(':');clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];go('dir')},
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=40;clearFc();dirList()},
  qx(){S.q='';const q=$('#q');if(q)q.value='';S.lim=40;clearFc();dirList()},
  more(){S.lim+=40;dirList()},
  dirsort(v){S.dirSort=v;S.lim=40;dirShell()},
  fmodal:()=>openFilter(),
  fsect(v){S.fp={mode:'pick',key:v};renderFilter()},
  fback(){S.fp={mode:'sections',key:null};renderFilter()},
  fsort(v){S.sortF[S.fp.key]=v;renderFilter()},
  fclearsec(){S.f[S.fp.key]=[];S.lim=40;clearFc();renderFilter()},
  fpick(v){const a=S.f[S.fp.key],i=a.findIndex(x=>norm(x)===norm(v));i>=0?a.splice(i,1):a.push(v);S.lim=40;clearFc();renderFilter()},
  fclr(){clearF();renderFilter()},
  fdone(){closeM();if(S.tab!=='dir')go('dir',true);else dirList()},
  xsort(v){S.exp.sort=v;explorer()},
  xt:v=>{S.exp={t:v,d:'',s:'',q:'',sort:S.exp.sort};explorer()},
  xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';explorer()},
  xs:v=>{S.exp.s=v;S.exp.q='';explorer()},
  qxexp(){S.exp.q='';explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:'',sort:x.sort}:v==='t'?{...x,d:'',s:'',q:''}:v==='d'?{...x,s:'',q:''}:x;explorer()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}
  else if(e.target.id==='md')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.classList?.contains('card'))profile(e.target.dataset.v)});
const setOff=o=>$('#off').classList.toggle('on',o);
addEventListener('online',()=>setOff(false));addEventListener('offline',()=>setOff(true));if(!navigator.onLine)setOff(true);

/* ================= Boot ================= */
(async()=>{
  setTheme(document.documentElement.dataset.theme||'light');
  try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
  await loadDB();await loadVL();S.last=Date.now();
  const saved=ls('cp-tab','home');           // restore the last open section
  go(TABS.includes(saved)?saved:'home',true);busy(false);
  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(decodeURIComponent(m[1]));r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
</script>
</body>
</html>
