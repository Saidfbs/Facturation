<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Pro — منصة التواصل المهني B2B</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="دليل الشركات والخبراء الصناعيين في المغرب">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Connect Pro">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============================================================
   DESIGN TOKENS — Facebook-inspired light palette
   ============================================================ */
:root{
  /* Primary — Facebook Blue */
  --blue-600:#166FE5;
  --blue-500:#1877F2;
  --blue-400:#4293F7;
  --blue-soft:#E7F0FE;
  --blue-glow:rgba(24,119,242,.22);
  
  /* Accent — Industrial Yellow (kept from original) */
  --accent-600:#D4A017;
  --accent-500:#EAB308;
  --accent-400:#FBBF24;
  --accent-soft:#FEF3C7;
  
  /* Semantic */
  --success:#22C55E;
  --success-soft:#DCFCE7;
  --danger:#EF4444;
  --danger-soft:#FEE2E2;
  --warning:#F59E0B;
  --warning-soft:#FEF3C7;
  --info:#3B82F6;
  --info-soft:#DBEAFE;
  
  /* Neutrals — Facebook-like */
  --bg:#F0F2F5;
  --surface:#FFFFFF;
  --surface-2:#F5F6F8;
  --surface-hover:#E4E6EB;
  --surface-pressed:#D8DADF;
  --border:#E4E6EB;
  --border-strong:#CED0D4;
  
  /* Text */
  --text-primary:#050505;
  --text-secondary:#65676B;
  --text-tertiary:#8A8D91;
  --text-inverse:#FFFFFF;
  
  /* Shadows */
  --sh-xs:0 1px 2px rgba(0,0,0,.06);
  --sh-sm:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 2px 8px rgba(0,0,0,.10);
  --sh-lg:0 4px 16px rgba(0,0,0,.12);
  
  /* Radii — Facebook uses medium rounded */
  --r-sm:6px;
  --r-md:8px;
  --r-lg:12px;
  --r-xl:16px;
  --r-full:999px;
  
  /* Sizing */
  --btn-size:40px;
  --header-h:56px;
  --botnav-h:60px;
  
  /* Fonts */
  --fh:'Oswald','IBM Plex Sans Arabic',sans-serif;
  --fb:'IBM Plex Sans Arabic',system-ui,sans-serif;
  
  /* Safe areas */
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  
  /* Hazard stripe (kept but lighter) */
  --hz:repeating-linear-gradient(-45deg, #EAB308 0 8px, #F0F2F5 8px 16px);
  
  color-scheme:light;
}

[data-theme=dark]{
  --bg:#18191A;
  --surface:#242526;
  --surface-2:#3A3B3C;
  --surface-hover:#3E4042;
  --surface-pressed:#4E4F50;
  --border:#3E4042;
  --border-strong:#4E4F50;
  
  --text-primary:#E4E6EB;
  --text-secondary:#B0B3B8;
  --text-tertiary:#8A8D91;
  
  --blue-soft:rgba(24,119,242,.18);
  --accent-soft:rgba(234,179,8,.18);
  --success-soft:rgba(34,197,94,.16);
  --danger-soft:rgba(239,68,68,.16);
  --warning-soft:rgba(245,158,11,.16);
  --info-soft:rgba(59,130,246,.16);
  
  --sh-xs:0 1px 2px rgba(0,0,0,.4);
  --sh-sm:0 1px 3px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.3);
  --sh-md:0 2px 8px rgba(0,0,0,.5);
  --sh-lg:0 4px 16px rgba(0,0,0,.6);
  
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font:14px/1.5 var(--fb);
  background:var(--bg);
  color:var(--text-primary);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px}

/* ============================================================
   HEADER — Facebook style with unified buttons
   ============================================================ */
header{
  position:fixed;inset:0 0 auto;z-index:30;
  padding-top:var(--st);
  background:var(--surface);
  border-bottom:1px solid var(--border);
  box-shadow:var(--sh-xs);
}
header::after{
  content:"";position:absolute;inset:auto 0 0;height:3px;
  background:var(--hz);
}
.hin{
  max-width:1000px;margin:0 auto;
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  min-height:var(--header-h);
  flex-wrap:wrap;
}

/* Brand */
.brand{
  display:flex;align-items:center;gap:10px;
  flex:1;min-width:0;order:1;
}
.logo{
  width:36px;height:36px;
  background:var(--blue-500);color:#fff;
  display:grid;place-items:center;
  font-size:18px;flex:none;
  border-radius:var(--r-md);
  box-shadow:0 2px 4px var(--blue-glow);
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));
}
.brand-text{min-width:0}
.brand b{
  display:block;
  font:700 18px/1.1 var(--fh);
  letter-spacing:.02em;
  text-transform:uppercase;
  color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand small{
  display:block;
  color:var(--text-secondary);
  font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:1px;
}

/* Unified action buttons row */
.acts{
  display:flex;align-items:center;gap:4px;
  flex:none;order:2;
}

/* THE UNIFIED ICON BUTTON */
.ib{
  width:var(--btn-size);
  height:var(--btn-size);
  min-width:var(--btn-size);
  border-radius:var(--r-md);
  background:var(--surface-2);
  border:1px solid transparent;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  font-weight:600;
  color:var(--text-secondary);
  transition:.15s ease;
  position:relative;
  flex-shrink:0;
  padding:0;
}
.ib:hover{
  background:var(--surface-hover);
  color:var(--text-primary);
}
.ib:active{
  background:var(--surface-pressed);
  transform:scale(.96);
}
.ib i{font-size:16px;line-height:1}

/* Button variants — same size, different colors */
.ib.pri{
  background:var(--blue-500);
  color:#fff;
}
.ib.pri:hover{background:var(--blue-600);color:#fff}

.ib.on{
  background:var(--blue-soft);
  color:var(--blue-500);
  border-color:var(--blue-500);
}
.ib.on:hover{background:var(--blue-soft);color:var(--blue-500)}

.ib.warn{
  background:var(--accent-soft);
  color:var(--accent-600);
  border-color:var(--accent-500);
}
.ib.warn:hover{background:var(--accent-500);color:#fff}

.ib.danger{
  background:var(--danger-soft);
  color:var(--danger);
}
.ib.danger:hover{background:var(--danger);color:#fff}

/* User avatar button */
.ib .ava{
  width:26px;height:26px;
  border-radius:var(--r-sm);
  display:grid;place-items:center;
  font-size:11px;font-weight:800;
  color:#fff;
}
.ib.avatar-on{
  padding:0;
  overflow:hidden;
}
.ib.avatar-on .ava{
  width:100%;height:100%;
  border-radius:var(--r-md);
  font-size:14px;
}

/* Badge on buttons */
.ib .badge-dot{
  position:absolute;top:6px;inset-inline-end:6px;
  width:8px;height:8px;border-radius:50%;
  background:var(--accent-500);
  box-shadow:0 0 0 2px var(--surface);
  pointer-events:none;
}
.ib.on .badge-dot{background:var(--blue-500)}

/* ============================================================
   SEARCH BAR — wide, prominent (Facebook style)
   ============================================================ */
.search-row{
  order:3;width:100%;padding:0 0 4px;
  display:none;
}
.search-row.on{display:block}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--surface-2);
  border:1px solid transparent;
  border-radius:var(--r-full);
  height:40px;
  padding:0 8px 0 14px;
  transition:.15s;
}
.search-box:focus-within{
  background:var(--surface);
  border-color:var(--blue-500);
  box-shadow:0 0 0 3px var(--blue-soft);
}
.search-box>i{color:var(--text-secondary);font-size:14px;flex:none}
.search-box input{
  flex:1;min-width:0;height:100%;
  border:0;background:none;outline:0;
  font-size:14px;color:var(--text-primary);
}
.search-box input::placeholder{color:var(--text-tertiary)}
.search-box .search-close{
  width:32px;height:32px;
  border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-secondary);
  flex:none;
  font-size:13px;
}
.search-box .search-close:hover{background:var(--surface-hover);color:var(--text-primary)}
.search-box .search-kbd{
  display:none;
  flex:none;
  padding:2px 6px;
  border-radius:3px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-tertiary);
  font-size:10px;font-weight:700;font-family:monospace;
}
@media(min-width:720px){.search-box .search-kbd{display:inline-block}}

/* PWA bar */
.pwa-bar{
  order:4;width:100%;
  display:none;gap:6px;padding:0 0 4px;
}
.pwa-bar.on{display:flex}
.pwa-bar .pwa-btn{
  flex:1;height:38px;border-radius:var(--r-md);
  background:var(--blue-500);color:#fff;
  font-weight:600;font-size:12.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:var(--sh-xs);
}
.pwa-bar .pwa-btn:hover{background:var(--blue-600)}
.pwa-bar .pwa-close{
  width:38px;height:38px;border-radius:var(--r-md);
  background:var(--surface-2);color:var(--text-secondary);
  display:grid;place-items:center;font-size:13px;
}
.pwa-bar .pwa-close:hover{background:var(--surface-hover);color:var(--text-primary)}

/* ============================================================
   MAIN
   ============================================================ */
main{
  max-width:1000px;margin:0 auto;
  padding:calc(var(--header-h) + 16px + var(--st)) 12px calc(var(--botnav-h) + 20px + var(--sb));
  transition:padding-top .2s;
}
main.has-search{padding-top:calc(var(--header-h) + 68px + var(--st))}
.tab{display:none}
.tab.on{display:block;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}

/* Section title */
h3.t{
  font:700 14px var(--fh);
  letter-spacing:.04em;
  margin:20px 0 10px;
  display:flex;align-items:center;gap:8px;
  padding-bottom:6px;
  border-bottom:1px solid var(--border);
  color:var(--text-primary);
}
h3.t::before{
  content:"";width:4px;height:16px;
  background:var(--blue-500);
  border-radius:2px;
}

/* ============================================================
   HERO — light & clean (Facebook-style card)
   ============================================================ */
.hero{
  padding:24px 20px;
  background:var(--surface);
  color:var(--text-primary);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-sm);
  position:relative;overflow:hidden;
  border-inline-start:4px solid var(--blue-500);
}
.hero::after{
  content:"\f013";
  font-family:"Font Awesome 6 Free";font-weight:900;
  position:absolute;inset-inline-end:-20px;bottom:-40px;
  font-size:150px;color:var(--blue-soft);
  line-height:1;pointer-events:none;
  animation:spin 40s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h2{
  font-size:20px;font-weight:700;line-height:1.35;
  position:relative;z-index:1;
  color:var(--text-primary);
}
.hero p{
  margin-top:6px;
  color:var(--text-secondary);
  font-size:13px;
  max-width:460px;
  position:relative;z-index:1;
  line-height:1.55;
}

.adm{
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;
  padding:10px 14px;
  border-radius:var(--r-md);
  background:var(--accent-soft);
  color:var(--accent-600);
  font-weight:600;font-size:12.5px;
  border:1px solid var(--accent-500);
}
.adm small{
  color:var(--text-secondary);
  font-weight:500;
  margin-inline-start:auto;
  font-size:11px;
}

/* ============================================================
   STATS
   ============================================================ */
.g4{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);margin-top:10px}
@media(min-width:620px){.g4{grid-template-columns:repeat(4,1fr)}}

.sc{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:14px 12px;
  text-align:center;
  box-shadow:var(--sh-xs);
  transition:.15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;
}
.sc:hover{
  transform:translateY(-1px);
  box-shadow:var(--sh-md);
  border-color:var(--blue-400);
}
.sc i{
  width:36px;height:36px;
  border-radius:var(--r-md);
  display:grid;place-items:center;
  background:var(--blue-soft);color:var(--blue-500);
  font-size:15px;
  margin-bottom:4px;
}
.sc b{
  font:700 24px/1 var(--fh);
  color:var(--text-primary);
  font-variant-numeric:tabular-nums;
}
.sc span{
  color:var(--text-secondary);
  font-size:11.5px;
  font-weight:600;
}

.seg{
  display:flex;height:10px;gap:2px;
  border-radius:var(--r-full);overflow:hidden;
}
.seg i{display:block;min-width:3px}

.cols{display:grid;gap:10px;grid-template-columns:1fr;margin-top:6px}
@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}

.pn{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:14px;
  box-shadow:var(--sh-xs);
}
.pn>b{
  font:600 12.5px var(--fh);
  letter-spacing:.04em;
  color:var(--text-secondary);
  display:block;
  margin-bottom:8px;
  text-transform:uppercase;
}
.sl{max-height:250px;overflow-y:auto}

.bar{
  position:relative;
  display:flex;justify-content:space-between;align-items:center;
  gap:8px;
  width:100%;min-height:38px;
  padding:0 12px;
  border-radius:var(--r-sm);
  overflow:hidden;
  margin-top:4px;
  background:var(--surface-2);
  font-size:12.5px;font-weight:600;
  color:var(--text-primary);
  transition:.15s;
}
.bar:hover{background:var(--surface-hover)}
.bar i{
  position:absolute;inset-block:0;inset-inline-start:0;
  background:var(--blue-soft);
}
.bar span,.bar b{position:relative}
.bar b{
  font:700 11px var(--fh);
  background:var(--blue-500);color:#fff;
  padding:2px 8px;
  border-radius:var(--r-full);
  min-width:24px;
  text-align:center;
}

/* ============================================================
   SEARCH BOX (directory)
   ============================================================ */
.sr{
  display:flex;align-items:center;gap:8px;
  height:48px;
  padding:0 6px 0 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-full);
  box-shadow:var(--sh-xs);
  transition:.15s;
}
.sr:focus-within{
  border-color:var(--blue-500);
  box-shadow:0 0 0 3px var(--blue-soft);
}
.sr>i{color:var(--text-secondary);font-size:14px;flex:none}
.sr input{
  flex:1;min-width:0;height:100%;
  border:0;background:none;outline:0;
  font-size:14px;
}
.sr input::placeholder{color:var(--text-tertiary)}

/* Filter button inside search (unified size) */
.sr .fbtn{
  width:36px;height:36px;
  border-radius:50%;
  background:var(--surface-2);
  color:var(--text-secondary);
  display:grid;place-items:center;
  flex:none;
  position:relative;
  transition:.15s;
  font-size:14px;
}
.sr .fbtn:hover{background:var(--blue-500);color:#fff}
.sr .fbtn.has-filters{
  background:var(--blue-500);color:#fff;
}
.sr .fbtn .bub{
  position:absolute;top:-3px;inset-inline-end:-3px;
  min-width:16px;height:16px;
  padding:0 4px;
  border-radius:var(--r-full);
  background:var(--accent-500);color:#fff;
  font-size:9px;font-weight:800;
  display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--surface);
  line-height:1;
}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  height:28px;
  padding:0 4px 0 10px;
  border-radius:var(--r-full);
  background:var(--blue-soft);
  color:var(--blue-500);
  font-weight:600;font-size:11.5px;
}
[data-theme=dark] .chip{background:var(--blue-soft);color:var(--blue-400)}
.chip button{
  width:20px;height:20px;
  border-radius:50%;
  background:transparent;
  color:var(--blue-500);
  font-size:9px;
  display:grid;place-items:center;
}
.chip button:hover{background:rgba(0,0,0,.1)}

.inf{
  color:var(--text-secondary);
  font-size:12px;
  margin:10px 4px 8px;
  font-weight:500;
}

/* ============================================================
   CARDS — Facebook post style
   ============================================================ */
.ls{display:grid;gap:8px}
@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}

.card{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  box-shadow:var(--sh-xs);
  cursor:pointer;
  transition:.15s;
  min-width:0;
}
.card:hover{
  transform:translateY(-1px);
  box-shadow:var(--sh-md);
  border-color:var(--border-strong);
}
.av{
  width:44px;height:44px;
  border-radius:var(--r-full);
  color:#fff;
  display:grid;place-items:center;
  font:700 15px var(--fb);
  flex:none;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.cm{flex:1;min-width:0}
.cm b{
  display:flex;align-items:center;gap:5px;
  font-size:14.5px;font-weight:700;
  color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cm small{
  display:block;
  color:var(--text-secondary);
  font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:1px;
}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tg{
  font-size:10.5px;
  padding:2px 8px;
  border-radius:var(--r-full);
  background:var(--surface-2);
  color:var(--text-secondary);
  font-weight:600;
}
.tg.a{background:var(--blue-soft);color:var(--blue-500)}
.tg.v{background:var(--success-soft);color:var(--success)}

.vb{color:var(--blue-500)}

/* Card action buttons — unified size 32×32 */
.ca{
  display:flex;flex-direction:column;gap:2px;flex:none;
}
.ca button{
  width:32px;height:32px;
  border-radius:50%;
  color:var(--text-tertiary);
  font-size:13px;
  display:grid;place-items:center;
  transition:.15s;
}
.ca button:hover{background:var(--surface-hover);color:var(--text-primary)}
.ca .fv.on{color:var(--accent-500)}
.ca .dl:hover{background:var(--danger-soft);color:var(--danger)}

/* Me card */
.me{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  margin-bottom:10px;
  border-radius:var(--r-md);
  color:var(--text-primary);
  cursor:pointer;
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--sh-xs);
  transition:.15s;
}
.me:hover{box-shadow:var(--sh-sm)}
.me .av{width:40px;height:40px;font-size:14px}
.me b{display:block;font-size:13.5px;color:var(--text-primary)}
.me small{display:block;color:var(--text-secondary);font-size:11.5px;margin-top:1px}
.me .me-chev{color:var(--text-tertiary);font-size:12px;margin-inline-start:auto}

/* Empty state */
.em{
  text-align:center;
  padding:40px 16px;
  border:2px dashed var(--border-strong);
  border-radius:var(--r-md);
  color:var(--text-secondary);
  background:var(--surface);
}
.em i{font-size:28px;display:block;margin-bottom:10px;color:var(--text-tertiary)}
.em b{display:block;color:var(--text-primary);margin-bottom:4px;font-size:13.5px}
.em small{display:block;font-size:12px;margin-top:4px}

/* ============================================================
   BREADCRUMB
   ============================================================ */
.cr{
  display:flex;flex-wrap:wrap;align-items:center;gap:4px;
  margin:10px 0;font-size:12.5px;
}
.cr button{
  padding:5px 12px;
  border-radius:var(--r-full);
  background:var(--surface-2);
  border:1px solid transparent;
  font-weight:600;
  color:var(--text-secondary);
  transition:.15s;
}
.cr button:hover{background:var(--surface-hover);color:var(--text-primary)}
.cr button:last-child{
  background:var(--blue-soft);
  color:var(--blue-500);
  border-color:var(--blue-500);
}
.cr i{font-size:9px;color:var(--text-tertiary)}

.rw{
  display:flex;align-items:center;gap:12px;
  width:100%;
  padding:12px 14px;
  margin-bottom:6px;
  border-radius:var(--r-md);
  background:var(--surface);
  border:1px solid var(--border);
  text-align:start;
  font-weight:600;
  color:var(--text-primary);
  transition:.15s;
  box-shadow:var(--sh-xs);
}
.rw:hover{
  transform:translateX(-2px);
  box-shadow:var(--sh-sm);
  border-color:var(--border-strong);
}
.rw>i:first-child{
  width:36px;height:36px;
  border-radius:var(--r-md);
  background:var(--blue-soft);color:var(--blue-500);
  display:grid;place-items:center;
  font-size:14px;
  flex:none;
}
.rw span{flex:1;font-size:13.5px}
.rw em{
  font:700 11px var(--fh);
  font-style:normal;
  background:var(--blue-500);color:#fff;
  padding:2px 8px;
  border-radius:var(--r-full);
  min-width:24px;
  text-align:center;
}
.rw>i:last-child{font-size:10px;color:var(--text-tertiary)}

/* ============================================================
   UNIFIED BUTTONS (for modals)
   ============================================================ */
.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;
  padding:0 20px;
  border-radius:var(--r-md);
  font-weight:600;
  font-size:13.5px;
  background:var(--blue-500);
  color:#fff;
  transition:.15s;
  border:1px solid transparent;
  min-width:0;
}
.bt:hover{background:var(--blue-600)}
.bt:active{transform:scale(.98)}
.bt:disabled{opacity:.5;cursor:not-allowed}
.bt.g{
  background:var(--surface-2);
  color:var(--text-primary);
  border:1px solid var(--border);
}
.bt.g:hover{background:var(--surface-hover)}
.bt.d{background:var(--danger)}
.bt.d:hover{background:#DC2626}
.bt.w{background:#25D366}
.bt.w:hover{background:#1EBE5D}
.bt.full{width:100%}
.bt i{font-size:14px}

/* ============================================================
   MODAL / SHEET
   ============================================================ */
#md{
  position:fixed;inset:0;z-index:60;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(2px);
  display:none;align-items:flex-end;justify-content:center;
}
#md.on{display:flex}
@media(min-width:620px){#md{align-items:center;padding:16px}}

.sheet{
  width:100%;max-width:520px;
  max-height:92vh;overflow-y:auto;
  background:var(--surface);
  padding:20px 18px calc(18px + var(--sb));
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:var(--sh-lg);
  animation:up .22s cubic-bezier(.2,.9,.3,1);
  position:relative;
}
@media(min-width:620px){.sheet{border-radius:var(--r-lg)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet::before{
  content:"";position:absolute;top:8px;inset-inline-start:50%;
  transform:translateX(-50%);
  width:36px;height:4px;
  border-radius:var(--r-full);
  background:var(--border-strong);
}
.sheet h2{
  font:700 18px var(--fh);
  letter-spacing:.02em;
  margin:6px 0 4px;
  color:var(--text-primary);
  padding-inline-start:0;
  border:0;
}
.lead{
  color:var(--text-secondary);
  font-size:12.5px;
  margin-bottom:16px;
  line-height:1.5;
}

/* Form fields */
.fl{display:block;margin-bottom:12px}
.fl span{
  display:block;
  font-size:12px;
  font-weight:600;
  color:var(--text-secondary);
  margin-bottom:5px;
}
.fl input,.fl select{
  width:100%;height:44px;
  padding:0 14px;
  border-radius:var(--r-md);
  border:1px solid var(--border-strong);
  background:var(--surface-2);
  font-size:14px;
  color:var(--text-primary);
  transition:.15s;
}
.fl input::placeholder{color:var(--text-tertiary)}
.fl input:focus,.fl select:focus{
  outline:0;
  border-color:var(--blue-500);
  background:var(--surface);
  box-shadow:0 0 0 3px var(--blue-soft);
}
.fl.er input{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}

/* Modal actions */
.ac{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:16px;
}
.ac .full{grid-column:1/-1}

/* Switch */
.sw{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;
  padding:4px;background:var(--surface-2);
  border-radius:var(--r-md);
  margin-bottom:16px;
}
.sw button{
  height:36px;border-radius:var(--r-sm);
  font-weight:600;font-size:13px;
  color:var(--text-secondary);
  transition:.15s;
}
.sw button:hover{color:var(--text-primary)}
.sw .on{background:var(--surface);color:var(--blue-500);box-shadow:var(--sh-xs)}

/* ============================================================
   FILTER MODAL
   ============================================================ */
.fmodal-h{margin-bottom:16px}
.fmodal-h h2{
  font-size:17px;margin-bottom:2px;
  font-weight:700;font-family:var(--fh);letter-spacing:.02em;
  padding:0;border:0;
  color:var(--text-primary);
}
.fmodal-h .sub{font-size:12px;color:var(--text-secondary)}

.fsect{
  display:flex;align-items:center;gap:12px;
  width:100%;
  padding:12px 14px;
  border-radius:var(--r-md);
  text-align:start;
  background:var(--surface);
  border:1px solid var(--border);
  margin-bottom:6px;
  transition:.15s;
}
.fsect:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.fsect.on{
  background:var(--blue-soft);
  border-color:var(--blue-500);
}
.fsect .ic{
  width:36px;height:36px;
  border-radius:var(--r-md);
  background:var(--surface-2);
  color:var(--text-secondary);
  display:grid;place-items:center;
  flex:none;font-size:14px;
}
.fsect.on .ic{background:var(--blue-500);color:#fff}
.fsect .name{
  flex:1;font-weight:600;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-primary);font-size:13.5px;
}
.fsect.on .name{color:var(--blue-500)}
.fsect .val{
  font-size:11.5px;
  color:var(--blue-500);font-weight:700;
  max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.fsect .num{
  font-size:11.5px;
  color:var(--text-secondary);
  min-width:26px;text-align:center;font-weight:700;
  background:var(--surface-2);
  padding:3px 9px;
  border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;
}
.fsect.on .num{background:var(--blue-500);color:#fff}
.fsect .chev{color:var(--text-tertiary);font-size:11px}

.fback{
  display:flex;align-items:center;gap:6px;
  color:var(--blue-500);
  font-weight:600;font-size:13px;
  margin-bottom:14px;
  padding:6px 10px;
  border-radius:var(--r-md);
  transition:.15s;
  width:fit-content;
}
.fback:hover{background:var(--blue-soft)}

.sortbar{display:flex;gap:6px;margin-bottom:14px}
.sortbtn{
  flex:1;height:36px;border-radius:var(--r-full);
  border:1px solid var(--border-strong);
  background:var(--surface);
  color:var(--text-secondary);
  font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:.15s;
}
.sortbtn:hover{background:var(--surface-hover)}
.sortbtn.on{
  background:var(--blue-500);
  border-color:var(--blue-500);
  color:#fff;
}
.sortbtn i{font-size:10px}

.fopt{
  display:flex;align-items:center;gap:12px;
  width:100%;
  padding:11px 14px;
  border-radius:var(--r-md);
  text-align:start;
  background:var(--surface);
  border:1px solid var(--border);
  margin-bottom:5px;
  transition:.15s;
}
.fopt:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.fopt.on{
  background:var(--blue-soft);
  border-color:var(--blue-500);
}
.fopt .box{
  width:20px;height:20px;
  border-radius:var(--r-sm);
  flex:none;
  border:2px solid var(--border-strong);
  display:grid;place-items:center;
  color:transparent;font-size:10px;
  transition:.15s;
}
.fopt.on .box{
  border-color:var(--blue-500);
  background:var(--blue-500);
  color:#fff;
}
.fopt .name{
  flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-primary);
  font-size:13px;font-weight:600;
}
.fopt.on .name{font-weight:700;color:var(--blue-500)}
.fopt .n{
  font-size:11px;
  color:var(--text-secondary);
  font-weight:700;
  background:var(--surface-2);
  padding:2px 8px;
  border-radius:var(--r-full);
  font-variant-numeric:tabular-nums;
}
.fopt.on .n{background:var(--blue-500);color:#fff}
.fopt.clear{border-style:dashed}
.fopt.clear .name{color:var(--danger)}

.filter-footer{
  position:sticky;
  bottom:-18px;
  margin:16px -18px -18px;
  padding:12px 18px calc(12px + var(--sb));
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;gap:8px;z-index:5;
}
.filter-footer .bt{flex:1;min-height:44px}
.filter-footer .count-badge{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.2);
  padding:2px 8px;border-radius:var(--r-full);
  font-size:11px;font-weight:800;
  margin-inline-start:4px;
}

/* ============================================================
   PROFILE
   ============================================================ */
.ph{
  margin:-20px -18px 0;
  padding:32px 18px 20px;
  text-align:center;
  color:#fff;
  background:linear-gradient(135deg,var(--blue-500) 0%,var(--blue-600) 100%);
  position:relative;overflow:hidden;
}
.ph::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 90% 10%, rgba(255,255,255,.15), transparent 40%),
    radial-gradient(circle at 10% 90%, rgba(255,255,255,.1), transparent 40%);
  pointer-events:none;
}
.pl{
  width:72px;height:72px;
  margin:0 auto 12px;
  background:rgba(255,255,255,.18);
  color:#fff;
  display:grid;place-items:center;
  font-size:28px;
  position:relative;z-index:1;
  border-radius:var(--r-lg);
  border:2px solid rgba(255,255,255,.3);
  backdrop-filter:blur(4px);
}
.pn2{
  font:700 19px var(--fh);
  letter-spacing:.02em;
  position:relative;z-index:1;
}
.ps{
  font-size:12.5px;
  opacity:.85;
  margin-top:2px;
  position:relative;z-index:1;
}
.ph .tags{
  justify-content:center;
  position:relative;z-index:1;
  margin-top:10px;
}
.ph .tg{
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
}

/* Profile actions — unified 40×40 buttons */
.pa{
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  margin:14px 0 8px;
}
.pa .ib{
  width:40px;height:40px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text-secondary);
}
.pa .ib:hover{background:var(--surface-hover);color:var(--text-primary)}
.pa .ib.wa{color:#25D366}
.pa .ib.wa:hover{background:#25D366;color:#fff;border-color:#25D366}
.pa .ib.pdf{color:var(--danger)}
.pa .ib.pdf:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.pa .ib.key{color:var(--accent-600)}
.pa .ib.key:hover{background:var(--accent-500);color:#fff;border-color:var(--accent-500)}
.pa .ib.vrf.on{background:var(--success);color:#fff;border-color:var(--success)}
.pa .ib.del:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

.vr{
  display:flex;gap:12px;align-items:center;
  padding:11px 0;
  border-bottom:1px solid var(--border);
}
.vr:last-child{border:0}
.vr>i,.vr>a{
  width:36px;height:36px;
  border-radius:var(--r-md);
  background:var(--blue-soft);
  color:var(--blue-500);
  display:grid;place-items:center;
  flex:none;font-size:14px;
}
.vr>a:hover{background:var(--blue-500);color:#fff}
.vr small{
  display:block;
  color:var(--text-secondary);
  font-size:11px;
  font-weight:600;
  margin-bottom:2px;
  text-transform:uppercase;
  letter-spacing:.03em;
}
.vr b{font-weight:600;overflow-wrap:anywhere;color:var(--text-primary)}

.acc{text-align:center}
.acc .av{margin:0 auto 10px;width:68px;height:68px;font-size:22px}
.acc h2{border:0;padding:0;margin-top:4px}
.acc .lead{padding:0}

/* ============================================================
   AUTH
   ============================================================ */
.auth-hub{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.auth-btn{
  display:flex;align-items:center;gap:14px;
  padding:14px;
  border-radius:var(--r-md);
  background:var(--surface);
  border:1px solid var(--border);
  text-align:start;
  transition:.15s;
  box-shadow:var(--sh-xs);
}
.auth-btn:hover{
  border-color:var(--border-strong);
  box-shadow:var(--sh-sm);
  transform:translateY(-1px);
}
.auth-btn.primary{
  background:var(--blue-500);
  color:#fff;
  border-color:var(--blue-500);
}
.auth-btn.primary:hover{background:var(--blue-600)}
.auth-btn.admin{
  background:var(--accent-500);
  color:#fff;
  border-color:var(--accent-500);
}
.auth-btn.admin:hover{background:var(--accent-600)}
.auth-btn .ai{
  width:40px;height:40px;
  border-radius:var(--r-md);
  background:var(--blue-soft);
  color:var(--blue-500);
  display:grid;place-items:center;
  font-size:16px;flex:none;
}
.auth-btn.primary .ai{background:rgba(255,255,255,.2);color:#fff}
.auth-btn.admin .ai{background:rgba(255,255,255,.2);color:#fff}
.auth-btn .at{flex:1;min-width:0}
.auth-btn .at b{
  display:block;font-size:14px;margin-bottom:2px;font-weight:700;
  color:inherit;
}
.auth-btn .at small{font-size:11.5px;opacity:.75;line-height:1.3}
.auth-btn .chev{color:var(--text-tertiary);font-size:11px}
.auth-btn.primary .chev,.auth-btn.admin .chev{color:rgba(255,255,255,.6)}

/* ============================================================
   ADMIN STATS
   ============================================================ */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat{
  padding:12px;
  background:var(--surface-2);
  border-radius:var(--r-md);
  text-align:center;
  border:1px solid var(--border);
}
.stat b{
  display:block;
  font-family:var(--fh);
  font-size:20px;
  color:var(--text-primary);
  margin-bottom:2px;
  font-weight:700;
  letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}
.stat span{
  font-size:10px;
  color:var(--text-secondary);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.stat.warn b{color:var(--danger)}

.log-row{
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:11px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
.log-row:last-child{border-bottom:0}
.log-row .lg-time{
  font-size:10px;
  color:var(--text-tertiary);
  min-width:96px;
  font-variant-numeric:tabular-nums;
  font-weight:500;
}
.log-row .lg-act{
  font-weight:700;
  padding:2px 7px;
  border-radius:var(--r-full);
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:.03em;
}
.log-row .lg-act.add{background:var(--success-soft);color:var(--success)}
.log-row .lg-act.del{background:var(--danger-soft);color:var(--danger)}
.log-row .lg-act.edit{background:var(--info-soft);color:var(--info)}
.log-row .lg-act.sync{background:var(--warning-soft);color:var(--warning)}
.log-row .lg-act.key{background:var(--accent-soft);color:var(--accent-600)}
.log-row .lg-act.login{background:var(--info-soft);color:var(--info)}

.pr{
  display:flex;gap:8px;padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;align-items:center;
}
.pr:last-child{border-bottom:0}
.pr i{color:var(--blue-500);width:14px;font-size:12px}
.pr small{display:block;color:var(--text-secondary);font-size:11px;margin-top:1px}
.pr div{min-width:0;overflow-wrap:anywhere}

/* ============================================================
   CODE BOX
   ============================================================ */
.code-box{
  display:flex;align-items:center;gap:10px;
  padding:16px;
  background:var(--blue-soft);
  border:2px dashed var(--blue-500);
  border-radius:var(--r-md);
  margin:14px 0;
}
.code-box .code{
  flex:1;
  font-family:'SF Mono','Consolas','Courier New',monospace;
  font-size:24px;
  font-weight:800;
  letter-spacing:5px;
  color:var(--blue-500);
  text-align:center;
  direction:ltr;
  user-select:all;
}
.code-box .cp{
  width:40px;height:40px;
  border-radius:var(--r-md);
  background:var(--blue-500);
  color:#fff;
  display:grid;place-items:center;
  flex:none;font-size:14px;
  transition:.15s;
}
.code-box .cp:hover{background:var(--blue-600)}
.code-hint{
  font-size:11.5px;
  color:var(--text-secondary);
  text-align:center;
  margin-top:8px;
  font-weight:500;
}
.code-note{
  font-size:12.5px;
  color:var(--text-primary);
  padding:14px;
  background:var(--warning-soft);
  border-inline-start:3px solid var(--warning);
  border-radius:var(--r-sm);
  margin:14px 0;
  line-height:1.6;
}
.code-note b{color:var(--warning)}

/* ============================================================
   GLOBAL SEARCH RESULTS
   ============================================================ */
.gsearch-results{
  position:absolute;
  top:calc(100% + 6px);
  inset-inline:0;
  background:var(--surface);
  border:1px solid var(--border-strong);
  border-radius:var(--r-md);
  box-shadow:var(--sh-lg);
  max-height:60vh;
  overflow-y:auto;
  z-index:40;
  display:none;
}
.gsearch-results.on{display:block}
.gsearch-results .gsr-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  border-bottom:1px solid var(--border);
  width:100%;text-align:start;cursor:pointer;
  transition:.15s;
}
.gsearch-results .gsr-item:last-child{border-bottom:0}
.gsearch-results .gsr-item:hover{background:var(--surface-hover)}
.gsearch-results .gsr-item .gsr-av{
  width:32px;height:32px;
  border-radius:var(--r-full);
  display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:11px;flex:none;
}
.gsearch-results .gsr-item .gsr-body{flex:1;min-width:0}
.gsearch-results .gsr-item b{
  display:block;
  font-size:13px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text-primary);
}
.gsearch-results .gsr-item small{
  display:block;
  color:var(--text-secondary);
  font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:1px;
}
.gsearch-results .gsr-item .gsr-arrow{color:var(--text-tertiary);font-size:10px;flex:none}
.gsearch-results .gsr-empty{
  padding:24px 16px;
  text-align:center;
  color:var(--text-secondary);
  font-size:12.5px;
}
.gsearch-results .gsr-header{
  padding:8px 12px;
  background:var(--surface-2);
  font-size:10.5px;font-weight:700;
  color:var(--text-secondary);
  text-transform:uppercase;
  letter-spacing:.04em;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;
}

/* ============================================================
   BOTTOM NAV — Facebook style
   ============================================================ */
#bn{
  position:fixed;inset-inline:0;bottom:0;z-index:29;
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:4px 4px calc(4px + var(--sb));
  background:var(--surface);
  border-top:1px solid var(--border);

          :`<button class="bt ${a.cls||''}${a.full?' full':''}" data-a="${a.action}"${a.disabled?' disabled':''}${a.data?` data-v="${a.data}"`:''}>${a.icon?`<i class="fa-solid ${a.icon}"></i> `:''}${a.label}</button>`
      ).join('')}</div>`
    :'';
  openM(`<h2>${esc(title)}</h2>${lead?`<p class="lead">${lead}</p>`:''}${body}${actionsHtml}`);
  if(onMount){const el=$('.sheet');onMount(el)}
}

function mapRaw(raw){
  const o=[];
  for(const[T,tv]of Object.entries(TK))
    for(const[C,cv]of Object.entries(CK))
      toArr(raw?.[tv]?.[cv]).forEach(i=>{
        if(i.name)o.push({...i,type:T,categorie:C,id:i.id||uid(),domaine:i.domaine||'Autre',specialite:i.specialite||'Général'})
      });
  return o;
}
async function loadDB(){
  let raw=null,ok=false;
  try{if(!S.fb)throw 0;raw=(await S.fb.ref('professionals').once('value')).val();ok=true}catch{}
  S.db=mapRaw(raw);
  S.dbIndex=new Map(S.db.map(r=>[r.id,r]));
  if(ok&&S.db.length)try{localStorage.setItem('cp-cache',JSON.stringify(S.db))}catch{}
  if(!ok&&!S.db.length)try{S.db=JSON.parse(localStorage.getItem('cp-cache')||'[]');S.dbIndex=new Map(S.db.map(r=>[r.id,r]))}catch{}
  clearFacetCache();
}
async function refreshUser(){
  let id;try{id=JSON.parse(localStorage.getItem('cp-user')||'null')?.id}catch{}
  S.user=null;if(!id||!S.fb)return;
  try{const u=(await S.fb.ref('users/'+id).once('value')).val();if(u)S.user={id,name:u.name,ident:u.ident,profileId:u.profileId||'',claim:u.claim||''}}catch{}
  if(!S.user)saveSess();
}
const saveSess=()=>{try{S.user?localStorage.setItem('cp-user',JSON.stringify({id:S.user.id})):localStorage.removeItem('cp-user')}catch{}};

function match(r,skip){
  for(const k in FLD){
    if(k===skip)continue;
    const a=S.f[k];
    if(a.length&&!a.some(v=>norm(r[FLD[k]])===norm(v)))return false;
  }
  if(S.q){
    if(/^(موثق|verified)$/i.test(S.q))return!!r.verified;
    return hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.q);
  }
  return true;
}
const results=()=>S.db.filter(r=>match(r)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0)+(S.q?1:0);
const clearF=()=>{S.f={type:[],cat:[],dom:[],spe:[],ville:[]};S.q='';S.lim=40;clearFacetCache()};

const facetKey=k=>k+':'+S.f.type.length+','+S.f.cat.length+','+S.f.dom.length+','+S.f.spe.length+','+S.f.ville.length+','+S.q;
function facet(k,sortBy='count'){
  const m=new Map();
  S.db.filter(r=>match(r,k)).forEach(r=>{
    const v=(r[FLD[k]]||'').trim();
    if(v)m.set(v,(m.get(v)||0)+1);
  });
  const arr=[...m];
  if(sortBy==='count')return arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
  return arr.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
}
function getFacet(k,sortBy='count'){
  const key=facetKey(k)+':'+sortBy;
  if(S.facetCache[key])return S.facetCache[key];
  const v=facet(k,sortBy);
  S.facetCache[key]=v;
  return v;
}
function getFacets(){
  if(S.facets)return S.facets;
  const f={};SECTIONS.forEach(s=>{f[s.k]=getFacet(s.k)});
  S.facets=f;return f;
}
const clearFacetCache=()=>{S.facetCache={};S.facets=null};

      return`<button class="fsect${active?' on':''}" data-a="fsect" data-v="${s.k}">

      </div>`;
    const avail=getFacet(S.filterPanel.key,curSort);

      const on=selected.some(x=>norm(x)===norm(v));

async function loadPdfLibs(){
  if(window.html2canvas&&window.jspdf)return;
  const ld=u=>new Promise((a,b)=>{const e=document.createElement('script');e.src=u;e.onload=a;e.onerror=b;document.head.appendChild(e)});
  try{await Promise.all([window.html2canvas?0:ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),window.jspdf?0:ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')])}
  catch{throw new Error('تعذر تحميل مكتبة PDF — تحقق من الاتصال')}
}
function pdfHtml(r){
  const p=fmtPhone(r.phone),w=url(r.web),rows=[];
  if(shown(r.domaine))rows.push(['fa-industry','القطاع',r.domaine]);
  if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',r.specialite]);
  if(r.ville)rows.push(['fa-location-dot','المدينة',r.ville]);
  if(p)rows.push(['fa-phone','الهاتف',p]);
  if(r.email)rows.push(['fa-envelope','البريد',r.email]);
  if(w)rows.push(['fa-globe','الموقع',r.web]);
  const base=baseUrl(),qr=base?`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(base+'#p='+r.id)}&color=050505&bgcolor=FFFFFF&margin=0" crossorigin="anonymous" alt="QR">`:'';
  return`<div class="pdf-card" data-pdf-root>
    <div class="pdf-l"><div class="pdf-logo"><i class="fa-solid ${domIcon(r.domaine)}"></i></div>
      <div class="pdf-name">${esc(r.name)}</div><div class="pdf-sub">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div>
      <div class="pdf-tags"><span class="pdf-tag">${TL[r.type]}</span><span class="pdf-tag">${CL[r.categorie]}</span>${r.verified?'<span class="pdf-tag v">✓ موثّق</span>':''}</div></div>
    <div class="pdf-r">${rows.map(([i,k,v])=>`<div class="pdf-row"><div class="ic"><i class="fa-solid ${i}"></i></div><div><div class="k">${k}</div><div class="v">${esc(v)}</div></div></div>`).join('')}</div>
    <div class="pdf-ft"><b>CONNECT PRO</b>${qr}</div></div>`;
}
async function makePDF(id){
  const r=byId(id);if(!r)return;busy(true);let h=null;
  try{
    try{await loadPdfLibs()}catch(e){toast(e.message);return}
    h=document.createElement('div');h.className='pdf-stage';h.innerHTML=pdfHtml(r);document.body.appendChild(h);
    try{await document.fonts?.ready}catch{}
    await new Promise(res=>setTimeout(res,700));
    const cv=await html2canvas(h.querySelector('[data-pdf-root]'),{scale:2,backgroundColor:'#F0F2F5',useCORS:true,logging:false});
    const{jsPDF}=window.jspdf,W=200,H=W*cv.height/cv.width;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[W,H]});
    pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);
    pdf.save(`ConnectPro-${r.name.replace(/\s+/g,'_')}.pdf`);log('pdf',r.name);toast('تم توليد بطاقة PDF');
  }catch(e){console.error(e);toast('خطأ في توليد PDF')}
  finally{h?.remove();busy(false)}
}

async function doLogin(){
  if(!needFb())return;
  const raw=$('#li_i').value.trim(),p=$('#li_p').value;
  if(!raw||!p)return toast('أدخل البيانات');
  busy(true);
  try{
    let found=null;
    for(const v of phoneVariants(raw)){
      try{
        const key=encodeURIComponent(fmtPhone(v));
        const uidv=(await S.fb.ref('users_index/'+key).once('value')).val();
        if(uidv){const rec=(await S.fb.ref('users/'+uidv).once('value')).val();if(rec){found={uid:uidv,rec};break}}
      }catch{}
    }
    if(!found){
      const u=await uidOf(fmtPhone(raw));
      const r=(await S.fb.ref('users/'+u).once('value')).val();
      if(r)found={uid:u,rec:r};
    }
    if(!found)return toast('لا يوجد حساب بهذا الرقم');
    const{uid:u,rec:r}=found;
    const okPass=await sha(r.salt+p);
    if(!safeEq(r.hash,okPass))return toast('الرمز غير صحيح');
    try{localStorage.setItem('cp-lastphone',fmtPhone(r.ident));localStorage.setItem('cp-saved-pass',p);localStorage.setItem('cp-saved-phone',fmtPhone(r.ident))}catch{}
    S.admin=false;sessionStorage.removeItem('cp-admin');
    S.user={id:u,name:r.name,ident:r.ident,profileId:r.profileId||'',claim:r.claim||''};
    saveSess();log('login','');closeM();toast('مرحباً '+r.name);rerender();
  }catch(e){console.error(e);toast('خطأ')}finally{busy(false)}
}
async function doSignup(){
  if(!needFb())return;
  const n=$('#su_n').value.trim(),i=fmtPhone($('#su_i').value),p=$('#su_p').value;
  const t=$('#su_t').value,c=$('#su_c').value,d=$('#su_d').value.trim()||'Autre',sp=$('#su_s').value.trim()||'Général',v=$('#su_v').value.trim(),m=$('#su_m').value.trim(),w=$('#su_w').value.trim();
  if(!n)return toast('اسم الشركة مطلوب');
  if(!validPhone(i))return toast('هاتف غير صالح');
  if(p.length<6)return toast('الرمز قصير');
  busy(true);
  try{
    const u=await uidOf(i);

async function findUserByPhone(rawPhone){
  if(!S.fb||!rawPhone)return null;
  const phone=fmtPhone(rawPhone);
  try{
    for(const v of phoneVariants(rawPhone)){
      const k=encodeURIComponent(fmtPhone(v));
      const uidv=(await S.fb.ref('users_index/'+k).once('value')).val();
      if(uidv){const rec=(await S.fb.ref('users/'+uidv).once('value')).val();if(rec)return{uid:uidv,rec}}
    }
  }catch{}
  for(const v of phoneVariants(rawPhone)){
    try{const u=await uidOf(ident(v));const r=(await S.fb.ref('users/'+u).once('value')).val();if(r)return{uid:u,rec:r}}catch{}
  }
  return null;
}

        <small dir="ltr">${esc(u.ident)}</small>
        ${u.resetCode&&u.resetExpiry>Date.now()?'<small style="color:var(--accent-600)"><i class="fa-solid fa-key"></i> رمز نشط</small>':''}
      </div>
      <button class="ib" style="width:32px;height:32px;font-size:12px;color:var(--blue-500)" data-a="agGen" data-v="${esc(id)}" title="توليد"><i class="fa-solid fa-key"></i></button>
      <button class="ib danger" style="width:32px;height:32px;font-size:12px" data-a="udel" data-v="${esc(id)}" title="حذف"><i class="fa-solid fa-user-slash"></i></button>
    </div>`).join(''):empty('لا نتائج')}</div>`;
  const logColor={add:'add',delete:'del',edit:'edit','csv-push':'sync','reset-gen':'key','admin-gen':'key',signup:'add',login:'login','pass-change':'edit','account-auto':'add'};
  const logsHtml=logs.slice(0,15).map(l=>{
    const cls=logColor[l.a]||'';
    return`<div class="log-row"><span class="lg-time">${esc(new Date(l.t).toLocaleString('ar-MA',{numberingSystem:'latn'}))}</span><span class="lg-act ${cls}">${esc(l.a)}</span><span style="flex:1">${esc(l.d)} · ${esc(l.u)}</span></div>`;
  }).join('')||empty('لا نشاط');
  openM(`<h2>لوحة التحكم</h2>${toolsRow}${stats}${content}
    <h3 class="t" style="margin-top:14px">سجل النشاط</h3>
    <div style="max-height:200px;overflow-y:auto">${logsHtml}</div>
    <div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
}

/* ============================================================
   PWA
   ============================================================ */
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  S.installEvent=e;
  if(!S.pwaDismissed)$('#pwaBar').classList.add('on');
});
window.addEventListener('appinstalled',()=>{
  S.installEvent=null;
  $('#pwaBar').classList.remove('on');
  toast('تم تثبيت التطبيق');
});
async function installPWA(){
  if(!S.installEvent)return toast('التثبيت غير متاح');
  S.installEvent.prompt();
  const{outcome}=await S.installEvent.userChoice;
  if(outcome==='accepted'){
    S.installEvent=null;
    $('#pwaBar').classList.remove('on');
    toast('جاري التثبيت...');
  }
}

/* ============================================================
   HANDLERS
   ============================================================ */
const A={
  theme(){
    const d=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=d;
    try{localStorage.setItem('cp-theme',d)}catch{}
    topbar();
    toast(d==='dark'?'الوضع الداكن':'الوضع الفاتح');
  },
  toggleSearch,
  closeSearch,
  gsearchOpen,
  shareApp,
  add(){closeM();canAdd()?form(null):toast('غير مسموح')},
  auth:v=>authModal(v||'in'),doLogin,doSignup,acc:account,udelme:deleteMe,
  uout(){S.user=null;saveSess();closeM();toast('تم تسجيل الخروج');rerender()},
  alogin:adminLogin,
  alogin2(){
    const pw=$('#pw').value;
    if(pw===ADMIN_PASS){
      const save=$('#pw_save')?.checked;
      if(save)localStorage.setItem('cp-admin-pw',pw);
      else localStorage.removeItem('cp-admin-pw');
      S.user=null;saveSess();
      try{localStorage.removeItem('cp-saved-pass');localStorage.removeItem('cp-saved-phone')}catch{}
      S.admin=true;sessionStorage.setItem('cp-admin','1');
      closeM();toast('مرحباً — وضع المدير');rerender();
    }else{
      $('#pw').parentElement.classList.add('er');toast('كلمة المرور خاطئة');
    }
  },
  alogout(){S.admin=false;sessionStorage.removeItem('cp-admin');toast('تم الخروج من وضع المدير');rerender()},
  installPWA,
  closePWA(){
    S.pwaDismissed=true;
    try{localStorage.setItem('cp-pwa-dismissed','1')}catch{}
    $('#pwaBar').classList.remove('on');
  },
  tab:v=>{
    if(S.tab===v){
      if(v==='dir'){clearF();dirShell()}
      else if(v==='exp'){S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};explorer()}
      else scrollTo({top:0,behavior:'smooth'});
    }else go(v);
  },
  cls:closeM,open(id){profile(id)},shr:share,pdf:makePDF,fav:toggleFav,
  edit(id){const r=byId(id);canEdit(r)?form(r):toast('غير مسموح')},
  del:delAsk,delok:delOk,save,vrf:verify,
  undo(){if(undoFn){undoFn();undoFn=null;$('#ts').classList.remove('on')}},
  stat(v){
    if(v==='f'){openFilter();return}
    const i=v.indexOf(':');
    clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];go('dir');
  },
  bar(v,el){clearF();S.f[el.dataset.k]=[v];go('dir')},
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=40;clearFacetCache();dirList()},
  qx(){S.q='';$('#q').value='';S.lim=40;clearFacetCache();dirList()},
  more(){S.lim+=40;dirList()},
  fopen:()=>openFilter(),fmodal:()=>openFilter(),
  fsect(v){S.filterPanel.mode='pick';S.filterPanel.key=v;renderFilter()},
  fback(){S.filterPanel.mode='sections';S.filterPanel.key=null;renderFilter()},
  fsort(v){S.sortF[S.filterPanel.key]=v;renderFilter()},
  fclearsec(){S.f[S.filterPanel.key]=[];S.lim=40;clearFacetCache();renderFilter();if(S.tab==='dir')dirList()},
  fpick(v){
    const k=S.filterPanel.key,arr=S.f[k];
    const i=arr.findIndex(x=>norm(x)===norm(v));
    if(i>=0)arr.splice(i,1);else arr.push(v);
    S.lim=40;clearFacetCache();renderFilter();if(S.tab==='dir')dirList();
  },
  fclr(){clearF();renderFilter();if(S.tab==='dir'){$('#q')&&($('#q').value='');dirList()}},
  fdone(){closeM();if(S.tab!=='dir'){S.tab='';go('dir')}else{dirList()}},
  xt:v=>{S.exp={t:v,d:'',s:'',q:'',sort:S.exp.sort};explorer()},
  xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';explorer()},
  xs:v=>{S.exp.s=v;S.exp.q='';explorer()},
  qxexp(){S.exp.q='';explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:'',sort:x.sort}:v==='t'?{t:x.t,d:'',s:'',q:'',sort:x.sort}:v==='d'?{t:x.t,d:x.d,s:'',q:'',sort:x.sort}:x;explorer()},
  findme:claimCancel,claimsearch:claimSearch,claimsend:claimSend,
  resetreq:resetReq,rgenfile:rgenFile,
  admingen:adminGen,agFind,agGen,agCreate,
  rcopy(v){navigator.clipboard?.writeText(v).then(()=>toast('تم النسخ')).catch(()=>toast('تعذر'))},
  forgot:forgotOpen,fqFind,
  changepass:changePassword,doChangePass,
  usr:adminPanel,
  udel:async(id)=>{
    if(!S.admin||!needFb()||!confirm('حذف المستخدم؟'))return;
    try{
      const rec=(await S.fb.ref('users/'+id).once('value')).val();
      await S.fb.ref('users/'+id).remove();
      if(rec?.ident)try{await S.fb.ref('users_index/'+encodeURIComponent(fmtPhone(rec.ident))).remove()}catch{}
      log('user-del',id);toast('تم');adminPanel();
    }catch{toast('خطأ')}
  },
  favclr(){if(confirm('مسح كل المفضلة؟')){S.fav=[];try{localStorage.removeItem('cp-fav')}catch{};favorites();favBadge()}}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}
  else if(e.target.id==='md')closeM();
  else if(!e.target.closest('.search-box')&&!e.target.closest('[data-a="toggleSearch"]')){
    const r=$('#gResults');
    if(r)r.classList.remove('on');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeM();$('#gResults')?.classList.remove('on')}
  if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(!S.searchOpen)toggleSearch();
    else setTimeout(()=>$('#gq')?.focus(),100);
  }
});

// Wire search input
const gqEl=document.getElementById('gq');
if(gqEl){
  gqEl.addEventListener('input',debounce(gsearchRun,150));
  gqEl.addEventListener('focus',()=>{if(gqEl.value.trim())gsearchRun()});
}

(async()=>{
  try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
  await loadDB();await refreshUser();
  go('home');busy(false);
  if(S.admin)topbar();
  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(m[1]);r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
</script>
