<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Réseau Industriel — Maroc</title>
<meta name="theme-color" content="#1C2127">
<meta name="description" content="نربط الموردين والشركات في مكان واحد">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Réseau Ind">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== Réseau Industriel — industrial steel & safety-yellow design system ===== */
:root{
  --acc:#FFB400;--acc2:#E6A200;--acc3:#B37D00;--on:#14181D;--blue:#B85C00;--steel:#1C2127;--steel2:#2A3138;
  --green:#2E9E5B;--purple:#7A5AC8;--orange:#E8590C;--red:#C62828;--star:#FFB400;--fb:#1877F2;--wa:#25D366;
  --bg:#E8EAED;--sf:#FFFFFF;--sf2:#F3F4F6;--sf3:#DDE0E5;--bd:#CBD0D7;--bd2:#A9B0BA;
  --hov:rgba(20,24,29,.05);--act:rgba(20,24,29,.1);--sel:rgba(255,180,0,.2);
  --tx:#14181D;--tx2:#4B5563;--tx3:#7B8490;--pane:#1C2127;--ov:rgba(10,12,15,.65);
  --ff:'IBM Plex Sans Arabic','Segoe UI',system-ui,-apple-system,sans-serif;--fn:'Barlow Condensed','IBM Plex Sans Arabic',sans-serif;
  --sh:0 1px 0 rgba(20,24,29,.06),0 2px 8px rgba(20,24,29,.08);--sh2:0 24px 60px rgba(0,0,0,.5);
  --haz:repeating-linear-gradient(-45deg,#FFB400 0 9px,#14181D 9px 18px);
  --grid:rgba(20,24,29,.05);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--pw:232px;color-scheme:light;
}
[data-theme=dark]{
  --acc2:#FFC83D;--acc3:#FFD773;--blue:#FFC83D;--steel:#0B0D0F;--steel2:#1A1F25;
  --green:#4CC57C;--purple:#A68CEB;--orange:#FF8A4C;--red:#FF6B6B;
  --bg:#101316;--sf:#1A1E23;--sf2:#21262C;--sf3:#2B3139;--bd:#2E353D;--bd2:#46505B;
  --hov:rgba(255,255,255,.06);--act:rgba(255,255,255,.11);--sel:rgba(255,180,0,.17);
  --tx:#F1F3F5;--tx2:#B5BCC5;--tx3:#848D98;--pane:#0B0D0F;--ov:rgba(0,0,0,.75);--grid:rgba(255,255,255,.035);
  --sh:0 1px 0 rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font:14.5px/1.6 var(--ff);color:var(--tx);background:var(--bg);min-height:100vh;min-height:100dvh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--bd2)}
.chm{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}

/* Header */
header{position:fixed;inset:0 0 auto;z-index:30;padding-top:var(--st);background:#1C2127;color:#fff}
header::after{content:"";position:absolute;inset:auto 0 0;height:5px;background:var(--haz)}
[data-theme=dark] header{background:#0B0D0F}
.hin{display:flex;align-items:center;padding:0 6px 5px 4px;min-height:60px;max-width:1400px;margin:auto}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:0 10px}
.logo{width:40px;height:40px;background:var(--acc);color:var(--on);display:grid;place-items:center;flex:none;font-size:18px}
.brand b{display:block;font-family:var(--fn);font-size:18px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:#AEB6C0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex}
.ib{width:44px;height:44px;display:inline-grid;place-items:center;transition:background .12s;flex:none;font-size:15px}
header .ib{color:#E6E9ED}
header .ib:hover{background:rgba(255,255,255,.12);color:var(--acc)}.ib:active{background:var(--act)}
main{padding:calc(76px + var(--st)) 14px calc(86px + var(--sb))}
.tab{display:none;max-width:900px;margin:0 auto}.tab.on{display:block;animation:fu .25s ease-out}
@keyframes fu{from{opacity:0;transform:translateY(10px)}}
.lt{font-family:var(--fn),var(--ff);font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1.2;margin:6px 2px 16px;padding-inline-start:12px;border-inline-start:6px solid var(--acc)}

/* Navigation: docked bar (phone) / side rail (desktop) */
#bn{position:fixed;z-index:29;inset-inline:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);padding:0 0 var(--sb);background:var(--pane);border-top:3px solid var(--acc)}
.bi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:58px;font-size:11px;font-weight:500;color:#AEB6C0;position:relative;transition:background .12s,color .12s}
.bi i{font-size:18px;height:22px;display:grid;place-items:center}
.bi:hover{background:rgba(255,255,255,.07);color:#fff}
.bi.on{color:var(--acc);font-weight:700;background:rgba(255,180,0,.1)}
.bi::before{content:"";position:absolute;background:var(--acc);inset-inline:0;top:-3px;height:3px;transform:scaleX(0);transition:transform .15s}
.bi.on::before{transform:none}
.fvb{position:absolute;top:5px;inset-inline-end:calc(50% - 24px);min-width:18px;height:18px;background:var(--acc);color:var(--on);font-weight:700;font-size:11px;display:grid;place-items:center;padding:0 5px}
.fvb[hidden]{display:none}
@media(min-width:900px){
  #bn{inset:calc(65px + var(--st)) auto 0 auto;inset-inline-start:0;width:var(--pw);display:flex;flex-direction:column;padding:12px 0;border-top:0;border-inline-end:3px solid var(--acc)}
  .bi{flex-direction:row;justify-content:flex-start;gap:16px;height:48px;padding:0 20px;font-size:14px;flex:none}
  .bi i{width:22px;font-size:16px}
  .bi::before{inset:0 auto 0 auto;inset-inline-start:0;width:4px;height:auto;top:0;transform:scaleY(0)}
  .bi.on::before{transform:none}
  .fvb{top:14px;inset-inline-end:18px}
  main{padding-inline-start:calc(var(--pw) + 28px);padding-inline-end:28px;padding-bottom:30px}
  .tab{margin:0}
}

/* Hero */
.hero{padding:24px 22px 34px;background:#1C2127;color:#fff;position:relative;overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px}
[data-theme=dark] .hero{background-color:#0B0D0F}
.hero::before{content:"\f013";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset-inline-end:-26px;top:-24px;font-size:190px;color:var(--acc);opacity:.14}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:10px;background:var(--haz)}
.hero>*{position:relative;z-index:1}
.hero .bdg{display:inline-flex;align-items:center;gap:6px;font-family:var(--fn);font-size:14px;letter-spacing:.1em;font-weight:700;background:var(--acc);color:var(--on);padding:1px 12px;margin-bottom:12px}
.hero h2{font-size:27px;font-weight:700;line-height:1.3}
.hero p{color:#C9CFD6;font-size:14.5px;margin-top:6px;max-width:520px}
.hero .bt{margin-top:16px}

/* Section heads */
.sec{display:flex;align-items:center;gap:10px;margin:28px 2px 10px;padding-bottom:7px;border-bottom:2px solid var(--bd2)}
.sec>i{font-size:13px;color:var(--acc);background:var(--steel);width:28px;height:28px;display:grid;place-items:center}
.sec b{flex:1;font-size:15px;font-weight:700}
.sec small{font-weight:400;font-size:12px;color:var(--tx2);margin-inline-start:8px}
.sec em{font-style:normal;font-family:var(--fn);background:var(--acc);color:var(--on);font-weight:700;font-size:15px;padding:0 9px;min-width:26px;height:22px;line-height:22px;text-align:center}

/* Stat tiles */
.g4{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{--tc:var(--acc);background:linear-gradient(160deg,#2C333B,#1C2127);color:#fff;padding:12px 14px;min-height:104px;border-top:4px solid var(--tc);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:start;transition:transform .12s,filter .12s;position:relative;overflow:hidden;box-shadow:var(--sh)}
[data-theme=dark] .sc{background:linear-gradient(160deg,#20262D,#12161A)}
.sc::after{content:"";position:absolute;inset:auto -14px -14px auto;width:60px;height:60px;border:10px solid rgba(255,255,255,.05);border-radius:50%}
.sc:hover{filter:brightness(1.12)}.sc:active{transform:scale(.97)}
.sc>i{font-size:17px;color:var(--on);background:var(--tc);width:34px;height:34px;display:grid;place-items:center}
.sc b{font-family:var(--fn);font-size:36px;font-weight:700;line-height:1;color:#fff}.sc span{font-size:13px;color:#C9CFD6}
.sc div{width:100%}
.g4 .sc:nth-child(4n+2){--tc:#2E9E5B}.g4 .sc:nth-child(4n+3){--tc:#2F7DD1}.g4 .sc:nth-child(4n){--tc:#E8590C}
.sc>i{color:#fff}.g4 .sc:nth-child(4n+1)>i{color:var(--on)}
.seg{display:flex;height:12px;gap:2px;margin:2px 0 10px;background:var(--sf3)}.seg i{display:block}

/* Search / filters */
.sr{display:flex;align-items:center;gap:4px;height:48px;padding:0 0 0 0;background:var(--sf);border:2px solid var(--bd2);transition:border-color .12s}
.sr:hover{border-color:var(--tx3)}.sr:focus-within{border-color:var(--acc)}
.sr>i{color:var(--tx2);font-size:14px;width:38px;text-align:center}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:15px}
.sr input::placeholder{color:var(--tx3)}
.sr .x{width:34px;height:100%;color:var(--tx2);font-size:13px}.sr .x:hover{background:var(--hov)}
.fbtn{width:48px;height:calc(100% + 4px);margin:-2px;background:var(--acc);color:var(--on);display:grid;place-items:center;position:relative;flex:none;font-size:16px}
.fbtn:hover{background:var(--acc2)}
.bub{position:absolute;top:3px;inset-inline-end:3px;min-width:18px;height:18px;background:var(--steel);color:var(--acc);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 0 0 12px;background:var(--steel);color:#fff;font-weight:500;font-size:13px;border-inline-start:3px solid var(--acc)}
.chip button{width:28px;height:28px;font-size:11px;color:#C9CFD6}.chip button:hover{color:var(--acc)}
.inf{color:var(--tx2);font-size:13px;margin:10px 2px 8px}
/* Segmented pivot */
.pill{display:flex;gap:2px;margin:12px 0;overflow-x:auto;background:var(--sf3);padding:3px;scrollbar-width:none}
.pill::-webkit-scrollbar{display:none}
.pill button{flex:1 0 auto;height:36px;padding:0 14px;color:var(--tx2);font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .12s}
.pill button:hover{background:var(--hov);color:var(--tx)}
.pill button.on{background:var(--steel);color:var(--acc);font-weight:700}

/* Cards */
.ls{display:grid;gap:6px}
@media(min-width:1100px){.ls{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:12px;padding:10px 10px 10px 12px;background:var(--sf);cursor:pointer;transition:background .12s,border-color .12s,transform .12s;position:relative;border:1px solid var(--bd);border-inline-start:5px solid var(--bd2);box-shadow:var(--sh)}
.card:hover{border-color:var(--bd2);border-inline-start-color:var(--acc);background:var(--sf2)}.card:active{transform:scale(.99)}
.card.mine{background:var(--sel);border-inline-start-color:var(--acc)}
.av{width:50px;height:50px;color:#fff;display:grid;place-items:center;font-family:var(--fn),var(--ff);font-weight:700;font-size:20px;letter-spacing:.03em;flex:none;align-self:center;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.cm{min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.ti{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ti i{color:#2F7DD1;font-size:13px}
.ir{display:flex;flex-wrap:wrap;gap:0 12px;font-size:12.5px;color:var(--tx2)}.ir i{color:var(--blue);font-size:11px;margin-inline-end:4px}
.tags{display:flex;flex-wrap:nowrap;gap:4px;align-items:center;overflow-x:auto;white-space:nowrap;margin-top:3px;scrollbar-width:none}
.tags::-webkit-scrollbar{display:none}
.tg{flex:none;font-size:11.5px;font-weight:600;padding:0 8px;line-height:21px;background:var(--sf3);color:var(--tx2);display:inline-flex;align-items:center;gap:4px}
.tg.four{background:#2F7DD1;color:#fff}
.tg.exp{background:var(--acc);color:var(--on)}
.tg.me{background:var(--purple);color:#fff}
.tg.v{background:var(--green);color:#fff}
.tg.vw i{color:var(--blue)}
.tg.r{background:var(--steel);color:#fff}.tg.r i{color:var(--star)}
.tg.mr{background:var(--sel);color:var(--tx);box-shadow:inset 0 0 0 1px var(--acc)}.tg.mr i{color:var(--star)}
.ca{display:grid;grid-template-columns:repeat(2,34px);gap:0;align-self:center}
.ca button,.ca a{width:34px;height:34px;color:var(--tx3);display:grid;place-items:center;font-size:14px;transition:.12s}
.ca button:hover,.ca a:hover{background:var(--act);color:var(--tx)}
.ca .on{color:var(--star)}.ca .wa{color:var(--wa)}
.stack{display:grid;gap:6px}
.chip2{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--sf);cursor:pointer;width:100%;text-align:start;border:1px solid var(--bd);border-inline-start:5px solid var(--acc);box-shadow:var(--sh)}
.chip2:hover{background:var(--sf2)}.chip2:active{background:var(--act)}
.chip2 .av{width:40px;height:40px;font-size:16px}.chip2 .bd{flex:1;min-width:0}
.chip2 b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip2 small{color:var(--tx2);font-size:12.5px}
.em{text-align:center;padding:44px 16px;color:var(--tx2);background:var(--sf);border:2px dashed var(--bd2);grid-column:1/-1}
.em i{font-size:34px;display:block;margin-bottom:10px;color:var(--tx3)}.em b{display:block;color:var(--tx);font-size:16px;font-weight:700}

/* Explorer */
.cr{display:flex;flex-wrap:nowrap;align-items:center;gap:2px;margin:12px 0;overflow-x:auto;scrollbar-width:none}
.cr button{flex:none;padding:3px 12px;font-weight:600;font-size:14px;color:var(--tx2)}
.cr button:hover{background:var(--hov);color:var(--tx)}
.cr button:last-child{color:var(--on);background:var(--acc)}.cr i{font-size:10px;color:var(--tx3);flex:none}
.rwl{display:grid;gap:6px}
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;background:var(--sf);text-align:start;font-weight:600;border:1px solid var(--bd);border-inline-start:5px solid var(--bd2);box-shadow:var(--sh);transition:.12s}
.rw:hover{background:var(--sf2);border-inline-start-color:var(--acc)}.rw:active{background:var(--act)}
.rw>i:first-child{width:38px;height:38px;background:var(--steel);color:var(--acc);display:grid;place-items:center;font-size:15px}
.rw span{flex:1}.rw em{font-style:normal;font-family:var(--fn);font-size:17px;font-weight:700;background:var(--sf3);padding:0 10px;min-width:30px;text-align:center}
.rw>i:last-child{font-size:11px;color:var(--tx3)}

/* Buttons */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 22px;font-weight:700;font-size:14px;background:var(--acc);color:var(--on);border:0;border-bottom:3px solid rgba(0,0,0,.28);transition:background .12s,transform .08s}
.bt:hover{background:var(--acc2)}.bt:active{transform:translateY(2px);border-bottom-width:1px}
.bt:disabled{opacity:.4;pointer-events:none}
.bt.g{background:var(--sf3);color:var(--tx);border-bottom-color:var(--bd2)}.bt.g:hover{background:var(--bd)}
.bt.full{width:100%}

/* Dialog — bottom sheet on phones */
#md{position:fixed;inset:0;z-index:60;background:var(--ov);display:none;align-items:flex-end;justify-content:center;padding:0;overflow-y:auto}
#md.on{display:flex;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.sheet{width:100%;max-width:540px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--sf);padding:0 20px calc(20px + var(--sb));box-shadow:var(--sh2);animation:mi .25s cubic-bezier(.2,.9,.2,1);position:relative}
.sheet::before{content:"";display:block;height:10px;margin:0 -20px 20px;background:var(--haz)}
@keyframes mi{from{transform:translateY(50px);opacity:0}}
@media(min-width:640px){#md{align-items:center;padding:14px}.sheet{max-height:calc(100vh - 28px);padding-bottom:20px}}
.sheet h2{font-size:21px;font-weight:700;margin-bottom:4px}.lead{color:var(--tx2);font-size:14px;margin-bottom:14px}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.ac .full{grid-column:1/-1}
.fl{display:grid;gap:4px}
.fs{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;text-align:start;position:relative;background:var(--sf2);border-inline-start:4px solid transparent}
.fs:hover{background:var(--hov)}.fs:active{background:var(--act)}
.fs .ic{width:34px;height:34px;background:var(--steel);color:var(--acc);display:grid;place-items:center;flex:none;font-size:13px}
.fs .nm{flex:1;word-break:break-word;font-weight:500}.fs .val{color:var(--blue);font-weight:600;font-size:12.5px;max-width:50%;text-align:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs .n{color:var(--tx2);font-family:var(--fn);font-size:16px;font-weight:700;min-width:24px;text-align:end}
.fs .box{width:22px;height:22px;border:2px solid var(--tx3);display:grid;place-items:center;color:transparent;font-size:11px;flex:none}
.fs.on .box{background:var(--acc);border-color:var(--acc);color:var(--on)}
.fs.on{background:var(--sel);border-inline-start-color:var(--acc)}
.fs.clr{color:var(--red);justify-content:center;font-weight:600}
.fb{color:var(--blue);font-weight:700;padding:4px 8px 4px 0;margin-bottom:6px;display:inline-flex;gap:6px;align-items:center}.fb:hover{text-decoration:underline}
.ff{position:sticky;bottom:-20px;margin:16px -20px -20px;padding:12px 20px calc(12px + var(--sb));background:var(--sf2);border-top:2px solid var(--bd2);display:flex;gap:8px}.ff .bt{flex:1}
.cc{background:rgba(0,0,0,.18);padding:0 8px;font-family:var(--fn);font-size:16px}

/* Profile */
.ph{text-align:center;padding:2px 0 4px}
.pl{width:92px;height:92px;margin:0 auto 10px;color:#fff;display:grid;place-items:center;font-size:36px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.pn2{font-size:22px;font-weight:700;line-height:1.3}.pn2 i{color:#2F7DD1;font-size:17px}.ps{font-size:13.5px;color:var(--tx2)}
.ph .tags{justify-content:center;margin-top:10px}
.pa{display:flex;gap:4px;justify-content:center;margin:16px 0 14px;border-block:2px solid var(--bd);padding:4px 0}
.pa .ib{flex:1;max-width:110px;width:auto;height:auto;flex-direction:column;gap:4px;padding:10px 0 8px;font-size:18px;color:var(--tx)}
.pa .ib small{font-size:11.5px;font-weight:500;color:var(--tx2)}
.pa .ib:hover{background:var(--hov)}
.pa .wa{color:var(--wa)}
.rb{margin:0 0 14px;padding:12px;background:var(--sf2);border:1px solid var(--bd);border-top:4px solid var(--acc);text-align:center}

/* n = 1..5 sets/changes my vote, n = 0 removes it. The aggregate is recomputed from all votes, so it always matches. */
async function doRate(id,n){const r=byId(id);if(!r)return;if(!S.fb)return toast('التقييم غير متاح بدون اتصال');
  const k=rk(r),legacy=S.myR[k]||0;
  try{const res=await S.fb.ref('ratings/'+k).transaction(c=>{c=c||{};
      if(!c.base)c.base={s:c.votes?0:(c.somme||0),n:c.votes?0:(c.nombre||0)};
      const votes=c.votes||{};
      if(votes[UID]==null&&legacy){c.base.s=Math.max(0,c.base.s-legacy);c.base.n=Math.max(0,c.base.n-1)}  /* one-time migration of an old local-only rating */
      if(n)votes[UID]=n;else delete votes[UID];
      const vals=Object.values(votes).map(Number).filter(x=>x>=1&&x<=5);
      c.nom=r.name;c.votes=vals.length?votes:null;c.somme=c.base.s+vals.reduce((a,b)=>a+b,0);c.nombre=c.base.n+vals.length;c.dernier=Date.now();
      return c});
    if(!res.committed)throw new Error('not committed');
    S.rates.set(k,res.snapshot.val()||{});S.rl=true;
    delete S.myR[k];lsSet('cp-my-rates',S.myR);
    if(n)S.myV[k]=n;else delete S.myV[k];lsSet('cp-my-votes',S.myV);
    paintRate(r);toast(n?'تم حفظ تقييمك ⭐':'تم إلغاء تقييمك');refreshBg()}
  catch(e){console.warn(e);toast('تعذر حفظ التقييم')}}
const rate=(id,el)=>{const n=+el.dataset.n;if(!n)return;doRate(id,n===myRate(byId(id))?0:n)};

async function syncRate(r){if(!S.fb)return;const k=rk(r);
  try{const v=(await S.fb.ref('ratings/'+k).once('value')).val();if(v)S.rates.set(k,v);else S.rates.delete(k);
    if($('#md').classList.contains('on')&&$('#rb'))paintRate(r);refreshBg()}catch(e){console.warn(e)}}

function profile(id){const r=byId(id);if(!r)return toast('الملف غير موجود');
  const p=fmtPhone(r.phone),w=url(r.web),rows=[];
  if(shown(r.domaine))rows.push(['fa-industry','القطاع',esc(r.domaine)]);
  if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',esc(r.specialite)]);
  if(r.ville)rows.push(['fa-location-dot','المدينة',esc(r.ville)]);
  if(p)rows.push(['fa-phone','الهاتف',`<span dir="ltr">${esc(p)}</span>`,'tel:'+esc(p)]);
  if(r.email)rows.push(['fa-envelope','البريد',`<span dir="ltr">${esc(r.email)}</span>`,'mailto:'+esc(r.email)]);
  if(w)rows.push(['fa-globe','الموقع',`<span dir="ltr">${esc(r.web)}</span>`,esc(w),1]);
  const mine=S.me&&S.me.id===r.id;
  openM(`<div class="ph"><div class="pl" style="background:${grad(r.name)}"><i class="fa-solid ${domIcon(r.domaine)}"></i></div><div class="pn2">${esc(r.name)} ${vb(r)}</div><div class="ps">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div>
  <div class="tags" id="ptags">${tagRow(r,r.verified?'<span class="tg">موثّق</span>':'')}</div></div>
  <div class="pa">${p?`<a class="ib wa" href="https://wa.me/${esc(waP(p))}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i><small>واتساب</small></a>`:''}<button class="ib" data-a="shr" data-v="${esc(r.id)}"><i class="fa-solid fa-share-nodes"></i><small>مشاركة</small></button><button class="ib" data-a="cls"><i class="fa-solid fa-xmark"></i><small>إغلاق</small></button></div>
  <div class="rb" id="rb">${rateInner(r)}</div>
  <div class="vl">${rows.map(([i,k,v,h,ext])=>`<div class="vr">${h?`<a href="${h}"${ext?' target="_blank" rel="noopener"':''}><i class="fa-solid ${i}"></i></a>`:`<i class="fa-solid ${i}"></i>`}<div><small>${k}</small><b>${v}</b></div></div>`).join('')}</div>
  ${mine?'<p class="inf" style="text-align:center;color:var(--blue)"><i class="fa-solid fa-circle-check"></i> هذا حسابك الحالي</p>':''}`);
  syncRate(r);
  recordVisit(r).then(()=>{const pt=$('#ptags');if(pt&&$('#md').classList.contains('on'))pt.innerHTML=tagRow(r,r.verified?'<span class="tg">موثّق</span>':'');refreshBg()})}

/* ================= Share ================= */
const SEP='➖➖➖➖➖➖➖➖➖➖➖➖';
async function share(id){const r=byId(id);if(!r)return;const p=fmtPhone(r.phone),w=url(r.web),t=getRate(id);
  const L=[`👤 ${r.name}`,SEP,`🏷️ النوع: ${TL[r.type]}`,`📂 التصنيف: ${CL[r.categorie]}`];
  if(shown(r.domaine))L.push(`🏭 القطاع: ${r.domaine}`);if(shown(r.specialite))L.push(`🛠️ التخصص: ${r.specialite}`);if(r.ville)L.push(`📍 المدينة: ${r.ville}`);
  if(p)L.push(`📞 الهاتف: ${p}`);if(r.email)L.push(`✉️ البريد: ${r.email}`);if(w)L.push(`🌐 الموقع: ${w}`);if(t.n)L.push(`⭐ التقييم: ${t.avg.toFixed(1)}/5 (${t.n})`);
  const link=baseUrl()?`${baseUrl()}#p=${r.id}`:'';if(link)L.push(SEP,`🔗 ${link}`);const text=L.join('\n');
  if(navigator.share){try{await navigator.share({title:r.name,text});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);toast('تم النسخ')}catch{toast('تعذر النسخ')}
  setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener'),0)}
async function shareLink(v,el){const u=el?.dataset?.url||'',n=el?.dataset?.name||'';if(!/^https?:\/\//i.test(u))return toast('رابط غير صالح');
  if(navigator.share){try{await navigator.share({title:n||'مشاركة',text:n?`${n}\n${u}`:u});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(u);toast('تم نسخ الرابط')}catch{toast('تعذر النسخ')}}
function toggleFav(id){const i=S.fav.indexOf(id);i>=0?S.fav.splice(i,1):S.fav.push(id);lsSet('cp-fav',S.fav);
  toast(i>=0?'أُزيلت من المفضلة':'أُضيفت إلى المفضلة');topbar();if(!$('#md').classList.contains('on'))rerender()}

/* ================= Actions ================= */
const linkItem=(l,s,u,cls,ic)=>`<div class="cho ${cls}"><div class="li"><i class="fa-solid ${ic}"></i></div><div><b>${esc(l)}</b><small>${esc(s)}</small></div><div class="a"><a href="${u}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i></a><button data-a="shrLink" data-url="${esc(u)}" data-name="${esc(l)}"><i class="fa-solid fa-share-nodes"></i></button></div></div>`;
const A={
  theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(d);lsSet('cp-theme',d);topbar();toast(d==='dark'?'الوضع الداكن':'الوضع الفاتح')},
  cls:closeM,open:profile,shr:share,fav:toggleFav,shrLink:shareLink,rate,unrate,
  openForms(){openM(`<h2>نماذج الإدخال</h2><p class="lead">اختر نوع التسجيل — سيُفتح نموذج Google</p><div class="fl">${linkItem('تسجيل خبير','أدخل بياناتك كخبير',FORM_E,'','fa-user-tie')}${linkItem('تسجيل مورّد','أدخل بياناتك كمورّد',FORM_F,'','fa-truck-field')}</div><div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
  openSheets(){openM(`<h2>فتح الأوراق</h2><p class="lead">اختر الورقة لعرضها في Google Sheets</p><div class="fl">${linkItem('ورقة الخبراء','عرض جدول الخبراء',SHEET_E,'s','fa-table')}${linkItem('ورقة الموردين','عرض جدول الموردين',SHEET_F,'s','fa-table')}</div><div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
  tab(v){if(S.tab===v){window.scrollTo({top:0,behavior:'smooth'});if(v==='exp'){S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};explorer()}else if(v==='dir'){clearF();dirShell()}else if(v==='fav')favShell()}else go(v)},
  stat(v){if(v==='f'){openFilter();return}const i=v.indexOf(':');clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];go('dir')},
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=40;clearFc();dirList()},
  qx(){S.q='';const q=$('#q');if(q)q.value='';S.lim=40;clearFc();dirList()},
  more(){S.lim+=40;dirList()},
  dirsort(v){S.dirSort=v;S.lim=40;saveUI();dirShell()},
  fmodal:()=>openFilter(),
  fsect(v){S.fp={mode:'pick',key:v};renderFilter()},
  fback(){S.fp={mode:'sections',key:null};renderFilter()},
  fsort(v){S.sortF[S.fp.key]=v;renderFilter()},
  fclearsec(){S.f[S.fp.key]=[];S.lim=40;clearFc();renderFilter()},
  fpick(v){const a=S.f[S.fp.key],i=a.findIndex(x=>norm(x)===norm(v));i>=0?a.splice(i,1):a.push(v);S.lim=40;clearFc();renderFilter()},
  fclr(){clearF();renderFilter()},
  fdone(){closeM();if(S.tab!=='dir')go('dir',true);else dirList()},
  xsort(v){S.exp.sort=v;explorer()},
  xt:v=>{S.exp={t:v,d:'',s:'',q:'',sort:S.exp.sort};explorer()},
  xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';explorer()},
  xs:v=>{S.exp.s=v;S.exp.q='';explorer()},
  qxexp(){S.exp.q='';explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:'',sort:x.sort}:v==='t'?{...x,d:'',s:'',q:''}:v==='d'?{...x,s:'',q:''}:x;explorer()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}
  else if(e.target.id==='md')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.classList?.contains('card'))profile(e.target.dataset.v)});
const setOff=o=>$('#off').classList.toggle('on',o);
addEventListener('online',()=>setOff(false));addEventListener('offline',()=>setOff(true));if(!navigator.onLine)setOff(true);

/* ================= Boot ================= */
(async()=>{
  setTheme(document.documentElement.dataset.theme||'light');
  try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
  await loadDB();await loadVL();S.last=Date.now();
  fixExp();saveUI();
  const saved=ls('cp-tab','home');            // restore the last open tab (sorts / filters / explorer path restore with it)
  go(TABS.includes(saved)?saved:'home',true);busy(false);
  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(decodeURIComponent(m[1]));r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
</script>
</body>
</html>
