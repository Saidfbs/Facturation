<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Pro — منصة التواصل المهني</title>
<meta name="theme-color" content="#0078D7">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ============ WINDOWS 10 FLUENT DESIGN SYSTEM ============ */
:root{
  /* Windows 10 accent colors */
  --w-accent:#0078D7;
  --w-accent-hover:#106EBE;
  --w-accent-light:#C7E0F4;
  --w-accent-soft:rgba(0,120,215,.1);

  /* Windows 10 neutrals */
  --w-bg:#F2F2F2;
  --w-bg-2:#FAFAFA;
  --w-card:#FFFFFF;
  --w-panel:#F8F8F8;
  --w-border:#E1E1E1;
  --w-border-2:#D1D1D1;
  --w-hover:#E5E5E5;
  --w-press:#CCCCCC;

  /* Text */
  --w-text:#171717;
  --w-text-2:#605E5C;
  --w-text-3:#797775;
  --w-text-4:#A19F9D;

  /* Accent palette */
  --w-blue:#0078D7;
  --w-green:#107C10;
  --w-red:#E81123;
  --w-orange:#CA5010;
  --w-yellow:#FFB900;
  --w-purple:#8764B8;
  --w-teal:#038387;

  /* Shadows — Windows 10 style */
  --w-sh-2:0 1.6px 3.6px rgba(0,0,0,.13), 0 0.3px 0.9px rgba(0,0,0,.11);
  --w-sh-4:0 3.2px 7.2px rgba(0,0,0,.13), 0 0.6px 1.8px rgba(0,0,0,.11);
  --w-sh-8:0 6.4px 14.4px rgba(0,0,0,.13), 0 1.2px 3.6px rgba(0,0,0,.11);
  --w-sh-16:0 12.8px 28.8px rgba(0,0,0,.13), 0 2.4px 7.2px rgba(0,0,0,.11);

  /* Radius — Windows 10 (sharp corners!) */
  --w-r:0px;
  --w-r-sm:0px;
  --w-r-md:0px;
  --w-r-lg:0px;

  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  color-scheme:light;
}

[data-theme=dark]{
  --w-accent:#4CC2FF;
  --w-accent-hover:#75D0FF;
  --w-accent-light:#0D3A5A;
  --w-accent-soft:rgba(76,194,255,.15);

  --w-bg:#1F1F1F;
  --w-bg-2:#2B2B2B;
  --w-card:#2B2B2B;
  --w-panel:#2D2D2D;
  --w-border:#3F3F3F;
  --w-border-2:#4A4A4A;
  --w-hover:#3F3F3F;
  --w-press:#4A4A4A;

  --w-text:#F2F2F2;
  --w-text-2:#C8C8C8;
  --w-text-3:#A8A8A8;
  --w-text-4:#808080;

  --w-blue:#4CC2FF;
  --w-green:#6CCB5F;
  --w-red:#FF99A4;
  --w-orange:#FFB178;
  --w-yellow:#FFE88A;
  --w-purple:#C9A1E0;
  --w-teal:#5CC2C9;

  --w-sh-2:0 1.6px 3.6px rgba(0,0,0,.3), 0 0.3px 0.9px rgba(0,0,0,.25);
  --w-sh-4:0 3.2px 7.2px rgba(0,0,0,.3), 0 0.6px 1.8px rgba(0,0,0,.25);
  --w-sh-8:0 6.4px 14.4px rgba(0,0,0,.35), 0 1.2px 3.6px rgba(0,0,0,.3);
  --w-sh-16:0 12.8px 28.8px rgba(0,0,0,.4), 0 2.4px 7.2px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font:14px/1.4 'Segoe UI','IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  background:var(--w-bg);color:var(--w-text);min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--w-accent);outline-offset:-2px}

/* ============ HEADER — Windows 10 App Bar ============ */
header{
  position:fixed;inset:0 0 auto;
  height:calc(48px + var(--st));padding-top:var(--st);
  z-index:30;
  background:var(--w-card);
  color:var(--w-text);
  display:flex;align-items:center;gap:0;
  padding-inline:0;
  border-bottom:1px solid var(--w-border);
  box-shadow:var(--w-sh-2);
}
.lg{
  width:48px;height:48px;
  background:var(--w-accent);color:#fff;
  display:grid;place-items:center;
  font-weight:600;font-size:18px;flex:none;
  margin:0;
}
.lg i{font-size:18px}
.ht{
  flex:1;min-width:0;
  padding:0 12px;line-height:1.2;
  display:flex;flex-direction:column;justify-content:center;
}
.ht b{display:block;font-size:15px;font-weight:600;letter-spacing:0}
.ht small{display:block;font-size:11.5px;color:var(--w-text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.hb{
  width:48px;height:48px;
  color:var(--w-text);
  display:grid;place-items:center;
  font-size:16px;flex:none;transition:background .1s;
  border-inline-start:1px solid transparent;
}
.hb:hover{background:var(--w-hover)}
.hb:active{background:var(--w-press)}
.hb.on{background:var(--w-accent-soft);color:var(--w-accent);border-inline-start-color:var(--w-accent)}
#hadd{display:none}
.cadd #hadd{display:grid}

/* Windows 10 titlebar area indicator */
header::before{
  content:"";position:absolute;inset-block:0;inset-inline-start:0;
  width:3px;background:var(--w-accent);
  z-index:1;
}

main{
  max-width:840px;margin:0 auto;
  padding:calc(56px + var(--st)) 0 calc(60px + var(--sb));
}
.tab{display:none}.tab.on{display:block}

/* ============ NAV — Windows 10 Pivot / Tabs ============ */
nav{
  position:fixed;inset:auto 0 0;
  height:calc(56px + var(--sb));padding-bottom:var(--sb);
  z-index:30;
  background:var(--w-card);
  border-top:1px solid var(--w-border);
  box-shadow:var(--w-sh-2);
  display:flex;align-items:stretch;
}
nav button.nv{
  flex:1;color:var(--w-text-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10.5px;gap:3px;position:relative;min-width:0;padding:0 2px;
  transition:.1s;font-weight:500;
}
nav button.nv:hover{background:var(--w-hover);color:var(--w-text)}
nav button.nv.on{color:var(--w-accent);font-weight:600}
nav button.nv.on::before{
  content:"";position:absolute;top:0;inset-inline:15%;height:3px;
  background:var(--w-accent);
  border-radius:0 0 2px 2px;
}
nav i{font-size:18px}
.nb{
  position:absolute;top:5px;inset-inline-start:calc(50% + 10px);
  background:var(--w-red);color:#fff;
  border-radius:10px;
  font-size:9.5px;min-width:18px;height:18px;padding:0 5px;
  font-weight:700;text-align:center;line-height:18px;
  border:2px solid var(--w-card);
}

/* ============ CARDS — Windows 10 Tiles ============ */
.gl{
  background:var(--w-card);
  border:1px solid var(--w-border);
  box-shadow:var(--w-sh-2);
}
.g4{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));margin:0 8px 10px}
@media(min-width:560px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}

.sc{
  padding:14px 6px;text-align:center;min-width:0;
  display:flex;flex-direction:column;align-items:center;
  background:var(--w-card);
  border:1px solid var(--w-border);
  box-shadow:var(--w-sh-2);
  transition:.1s;cursor:pointer;position:relative;
}
.sc:hover{
  background:var(--w-panel);
  box-shadow:var(--w-sh-4);
  border-color:var(--w-accent);
}
.sc:active{background:var(--w-hover)}
.sc i{color:var(--w-accent);font-size:22px;margin-bottom:4px}
.sc b{font-size:22px;line-height:1.1;font-weight:600;color:var(--w-text);letter-spacing:-.3px}
.sc span{font-size:11px;color:var(--w-text-2);margin-top:2px;font-weight:400}

h3.t{
  font-size:15px;margin:16px 12px 8px;
  color:var(--w-text);font-weight:600;
  letter-spacing:0;display:flex;align-items:center;gap:6px;
}
h3.t::before{
  content:"";width:4px;height:16px;background:var(--w-accent);
  display:inline-block;
}
.pn{
  padding:14px;margin:0 8px 8px;
  background:var(--w-card);
  border:1px solid var(--w-border);
  box-shadow:var(--w-sh-2);
}

.av{
  width:40px;height:40px;
  color:#fff;
  display:grid;place-items:center;font-weight:600;flex:none;
  font-size:15px;
  /* Windows-style square with slight radius */
  border-radius:2px;
}

/* ============ SEARCH — Windows 10 Search Box ============ */
.sr{
  display:flex;align-items:center;gap:8px;
  padding:0 12px;height:36px;
  background:var(--w-card);
  margin:0 8px 10px;
  border:1px solid var(--w-border-2);
  transition:.1s;
}
.sr:focus-within{
  border-color:var(--w-accent);
  box-shadow:inset 0 0 0 1px var(--w-accent);
}
.sr input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:14px;color:var(--w-text)}
.sr input::placeholder{color:var(--w-text-3)}
.sr i{color:var(--w-text-2);font-size:14px}
.sr button{width:28px;height:28px;color:var(--w-text-2);display:grid;place-items:center;border-radius:2px}
.sr button:hover{background:var(--w-hover)}

/* ============ CHIPS ============ */
.fchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 10px}
.fchips:empty{display:none}
.fchip{
  display:inline-flex;align-items:center;gap:6px;height:28px;
  padding:0 4px 0 10px;
  background:var(--w-accent);color:#fff;
  font-size:12px;font-weight:500;
  border-radius:2px;
}
.fchip .x{
  width:20px;height:20px;
  background:rgba(255,255,255,.2);color:#fff;
  display:grid;place-items:center;font-size:10px;
}
.fchip .x:hover{background:rgba(255,255,255,.4)}
.fchips .fclr{
  height:28px;padding:0 12px;
  border:1px solid var(--w-border-2);
  background:var(--w-card);
  color:var(--w-red);font-size:12px;font-weight:600;
  border-radius:2px;
}
.fchips .fclr:hover{background:var(--w-hover)}
.inf{font-size:12.5px;color:var(--w-text-2);margin:0 12px 8px}

/* ============ CARDS LIST ============ */
.ls{
  display:grid;gap:0;
  background:var(--w-card);
  margin:0 8px;
  border:1px solid var(--w-border);
  box-shadow:var(--w-sh-2);
}
.card{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;cursor:pointer;
  min-width:0;
  background:var(--w-card);
  border-bottom:1px solid var(--w-border);
  transition:.1s;
}
.card:last-child{border-bottom:0}
.card:hover{background:var(--w-panel)}
.card:active{background:var(--w-hover)}
.cm{flex:1;min-width:0}
.cm b{
  display:flex;align-items:center;gap:5px;
  font-size:14px;font-weight:600;color:var(--w-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cm small{
  display:block;color:var(--w-text-2);
  font-size:12.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-top:2px;
}
.chs{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.ch{
  font-size:10.5px;padding:1px 8px;
  background:var(--w-accent-soft);color:var(--w-accent);
  line-height:16px;font-weight:600;
  border-radius:2px;
}
.ch.o{background:var(--w-panel);color:var(--w-text-2);border:1px solid var(--w-border)}
.ch.v{background:rgba(16,124,16,.12);color:var(--w-green)}
.ca{display:flex;flex:none;gap:0;align-items:center}
.ca button{
  width:32px;height:32px;
  color:var(--w-text-2);font-size:14px;
  display:grid;place-items:center;
  border-radius:2px;
}
.ca button:hover{background:var(--w-hover);color:var(--w-text)}
.ca .dl{color:var(--w-red)}
.vbadge{color:var(--w-accent);font-size:13px}
.em{
  text-align:center;padding:40px 16px;
  color:var(--w-text-2);font-size:13px;
  background:var(--w-card);
  margin:0 8px;
  border:1px solid var(--w-border);
  box-shadow:var(--w-sh-2);
}
.em i{font-size:40px;color:var(--w-text-4);display:block;margin-bottom:10px}
.em b{display:block;color:var(--w-text);margin-bottom:4px;font-weight:600;font-size:14px}

/* ============ BREADCRUMB ============ */
.cr{
  display:flex;flex-wrap:wrap;gap:2px;align-items:center;
  margin:0 12px 10px;font-size:13px;
}
.cr button{
  min-height:28px;padding:0 8px;
  color:var(--w-accent);font-weight:500;font-size:13px;
  border-radius:2px;
}
.cr button:hover{background:var(--w-accent-soft)}
.cr i{font-size:10px;color:var(--w-text-3)}

/* ============ LIST ROWS ============ */
.rw{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:14px 16px;text-align:start;
  background:var(--w-card);
  border-bottom:1px solid var(--w-border);
  font-size:13.5px;
  transition:.1s;
}
.rw:last-child{border-bottom:0}
.rw:hover{background:var(--w-panel)}
.rw:active{background:var(--w-hover)}
.rw span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500;color:var(--w-text)}
.rw em{font-style:normal;color:var(--w-text-2);font-size:12.5px;font-weight:600}
.rw>i:first-child{
  color:var(--w-accent);width:24px;
  font-size:16px;text-align:center;
}
.rw>i:last-child{color:var(--w-text-4);font-size:12px}
#t-exp > div[id="xl"]{
  display:grid;
  background:var(--w-card);
  margin:0 8px;
  border:1px solid var(--w-border);
  box-shadow:var(--w-sh-2);
}

/* ============ BUTTONS — Windows 10 Style ============ */
.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:32px;padding:0 16px;
  background:var(--w-accent);color:#fff;
  font-weight:600;text-decoration:none;
  min-width:0;font-size:13.5px;transition:.1s;
  border:1px solid transparent;
  border-radius:2px;
}
.bt:hover{background:var(--w-accent-hover)}
.bt:active{background:var(--w-accent);filter:brightness(.9)}
.bt.g{
  background:var(--w-card);color:var(--w-text);
  border:1px solid var(--w-border-2);
}
.bt.g:hover{background:var(--w-hover);border-color:var(--w-text-3)}
.bt.g:active{background:var(--w-press)}
.bt.d{background:var(--w-red);color:#fff}
.bt.d:hover{background:#C50F1F}
.bt.w{background:#25D366;color:#fff}
.bt.w:hover{background:#1EBE5D}
.bt.o{background:var(--w-orange);color:#fff}
.bt.o:hover{background:#B0450D}
.bt:disabled{opacity:.5;cursor:not-allowed}

/* ============ MODAL — Windows 10 Dialog ============ */
#md{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  display:none;place-items:center;padding:10px;overflow-y:auto;
}
#md.on{display:grid}
.mb{
  width:100%;max-width:460px;max-height:92vh;overflow-y:auto;
  padding:20px;
  background:var(--w-card);
  border:1px solid var(--w-border);
  animation:dialog-in .15s cubic-bezier(.2,.9,.4,1);
  margin:auto;
  box-shadow:var(--w-sh-16);
  border-radius:2px;
}
@keyframes dialog-in{
  from{transform:scale(.94);opacity:0}
}
.mb h2{
  font-size:18px;text-align:start;margin-bottom:14px;
  font-weight:600;color:var(--w-text);
  padding-inline-start:10px;
  border-inline-start:3px solid var(--w-accent);
  line-height:1.3;
}
.mb .lead{
  text-align:start;color:var(--w-text-2);
  font-size:13px;margin-bottom:14px;line-height:1.5;
  padding-inline-start:10px;
}

.ac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
.ac .full{grid-column:1/-1}

.fl{display:block;margin-bottom:12px}
.fl span{
  font-size:12.5px;font-weight:600;display:block;
  margin-bottom:6px;color:var(--w-text);
}
.fl input,.fl select{
  width:100%;height:32px;
  border:1px solid var(--w-border-2);
  background:var(--w-card);
  padding:0 10px;font-size:14px;color:var(--w-text);
  transition:.1s;
  border-radius:2px;
}
.fl input:focus,.fl select:focus{
  outline:none;border-color:var(--w-accent);
  box-shadow:inset 0 0 0 1px var(--w-accent);
}
.fl.er input{border-color:var(--w-red);box-shadow:inset 0 0 0 1px var(--w-red)}

/* ============ PROFILE CARD — Windows 10 Hero Card ============ */
.vcard{
  overflow:hidden;
  background:var(--w-card);
  margin-bottom:12px;
  box-shadow:var(--w-sh-16);
  border:1px solid var(--w-border);
  position:relative;
  border-radius:2px;
}
.vhead{
  background:linear-gradient(135deg,var(--w-accent) 0%,#005A9E 100%);
  color:#fff;padding:24px 16px 20px;
  text-align:center;position:relative;overflow:hidden;
}
.vhead::before{
  content:"";position:absolute;inset-inline-end:-40px;top:-40px;
  width:140px;height:140px;
  background:rgba(255,255,255,.08);
  transform:rotate(45deg);
}
.vhead::after{
  content:"";position:absolute;inset-inline-start:-30px;bottom:-30px;
  width:100px;height:100px;
  background:rgba(255,255,255,.06);
  transform:rotate(45deg);
}
.vlogo{
  width:72px;height:72px;
  background:var(--w-accent);color:#fff;
  display:grid;place-items:center;font-size:32px;
  margin:0 auto 12px;font-weight:600;
  border:3px solid rgba(255,255,255,.3);
  position:relative;z-index:1;
  box-shadow:var(--w-sh-8);
  border-radius:2px;
}
.vname{
  font-size:20px;font-weight:600;line-height:1.2;
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
}
.vname .vbadge{color:#fff;font-size:16px}
.vsub{font-size:13px;opacity:.9;margin-top:6px;position:relative;z-index:1}
.vtags{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap;position:relative;z-index:1}
.vtag{
  font-size:11px;padding:3px 10px;
  background:rgba(255,255,255,.18);color:#fff;
  border:1px solid rgba(255,255,255,.25);font-weight:600;
  border-radius:2px;
}
.vtag.v{background:var(--w-green);border-color:var(--w-green)}
.vqr{
  position:absolute;top:12px;inset-inline-end:12px;
  width:48px;height:48px;background:#fff;
  padding:3px;z-index:5;
  display:grid;place-items:center;
  box-shadow:var(--w-sh-4);
  border-radius:2px;
}
.vqr img{width:100%;height:100%}
.vbody{padding:6px 16px}
.vrow{
  display:flex;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--w-border);
  align-items:flex-start;
}
.vrow:last-child{border-bottom:0}
.vrow .vic{
  width:32px;height:32px;
  background:var(--w-accent-soft);
  color:var(--w-accent);
  display:grid;place-items:center;flex:none;font-size:14px;
  border-radius:2px;
}
.vrow .vtxt{flex:1;min-width:0}
.vrow .vk{font-size:11px;color:var(--w-text-2);font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
.vrow .vv{font-size:14px;color:var(--w-text);font-weight:500;overflow-wrap:anywhere}
.vrow a.vv{color:var(--w-accent);text-decoration:none}
.vrow a.vv:hover{text-decoration:underline}

/* ============ ICON GRID — Windows 10 Command Bar ============ */
.icon-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(46px,1fr));
  gap:4px;
  padding:12px;
  border-top:1px solid var(--w-border);

/* ============ FILTER MODAL ============ */

.pdf-stage{position:fixed;left:-99999px;top:0;width:1200px;height:auto}

#ts{
  position:fixed;inset-inline:0;bottom:calc(70px + var(--sb));

/* Ripple effect — Windows 10 style */
@keyframes ripple{
  to{transform:scale(4);opacity:0}
}
.ripple{
  position:absolute;border-radius:50%;

/* FILTER */
function match(r,skip){
  for(const k in FLD){
    if(k===skip)continue;
    const arr=S.f[k];
    if(arr.length && !arr.some(v=>norm(r[FLD[k]])===norm(v)))return false;
  }
  return !S.f.q || hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.f.q);
}
const results=()=>S.db.filter(r=>match(r)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
function facet(k,sortBy='count'){
  const m=new Map();
  S.db.filter(r=>match(r,k)).forEach(r=>{const v=(r[FLD[k]]||'').trim();if(v)m.set(v,(m.get(v)||0)+1)});
  const arr=[...m];
  if(sortBy==='count') return arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
  return arr.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
}

async function makePDF(id){
  const r=byId(id);if(!r)return;
  if(!window.html2canvas||!window.jspdf){toast('PDF غير متاح');return}
  setLoading(true);
  let holder=null;
  try{
    holder=document.createElement('div');holder.className='pdf-stage';
    holder.innerHTML=buildPdfHtml(r);document.body.appendChild(holder);
    await new Promise(r=>setTimeout(r,700));
    const node=holder.querySelector('#pdf-src');
    const canvas=await html2canvas(node,{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});
    const img=canvas.toDataURL('image/jpeg',0.95);
    const {jsPDF}=window.jspdf;
    const ratio=canvas.height/canvas.width;
    const wmm=200,hmm=wmm*ratio;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[wmm,hmm]});
    pdf.addImage(img,'JPEG',0,0,wmm,hmm);
    pdf.save(`ConnectPro-${r.name.replace(/\s+/g,'_')}.pdf`);
    log('pdf',r.name);toast('تم توليد PDF');
  }catch(e){console.error(e);toast('خطأ')}
  finally{holder?.remove();setLoading(false)}
}

function mapRaw(raw){const o=[];for(const[T,tv]of Object.entries(TK))for(const[C,cv]of Object.entries(CK))toArr(raw?.[tv]?.[cv]).forEach(i=>i.name&&o.push({...i,type:T,categorie:C,id:i.id||uid(),domaine:i.domaine||'Autre',specialite:i.specialite||'Général'}));return o}
async function loadDB(){
  let raw=null,ok=false;
  try{if(!S.fb)throw 0;raw=(await S.fb.ref('professionals').once('value')).val();ok=true}catch{toast('تعذر الاتصال')}
  S.fbCache=mapRaw(raw);

function splitCSV(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const h=l[i];if(h==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(h===','&&!q){o.push(c);c=''}else c+=h}o.push(c);return o}
const parseCSV=(txt,type,cat)=>{const cl=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c=>cl(c[1])).map(c=>({id:sid(type,cl(c[1]),cl(c[5])),name:cl(c[1]),domaine:cl(c[2])||'Autre',specialite:cl(c[3])||'Général',ville:cl(c[4]),phone:fmtPhone(cl(c[5])),email:cl(c[6]),web:cl(c[7]),type,categorie:cat}))};
async function csvAll(){const g=async(u,t,c)=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return parseCSV(await r.text(),t,c)};
  const[e,f]=await Promise.all([g(CSV_EXPERTS,'experts','yad-amila'),g(CSV_FOURNISSEURS,'fournisseurs','services')]);const m=new Map();[...f,...e].forEach(r=>m.has(r.id)||m.set(r.id,r));return[...m.values()]}
async function csvFetch(silent=false){

async function csvPush(){
  if(!S.admin||!needFb()||S.busy)return;
  if(!S.csvCache.length)return toast('اجلب CSV أولاً');
  const old=S.fbCache,cr=new Map(old.map(r=>[r.id,r.createdAt])),vr=new Map(old.map(r=>[r.id,r.verified])),owned=new Map(old.filter(r=>r.owner).map(r=>[r.id,r])),oldIds=new Set(old.map(r=>r.id));
  let added=0,updated=0,kept=0;const now=Date.now();const tree={};
  const put=r=>{const{type,categorie,...x}=r,T=TK[type],C=CK[categorie];tree[T]=tree[T]||{};(tree[T][C]=tree[T][C]||[]).push(x)};
  S.csvCache.forEach(r=>{if(owned.has(r.id)){kept++;return}const v={...r,createdAt:cr.get(r.id)||now};if(vr.get(r.id))v.verified=true;if(oldIds.has(r.id))updated++;else added++;put(v)});
  owned.forEach(put);
  if(!confirm(`مزامنة:\n➕ ${added} جديد\n✏️ ${updated} محدّث\n🔒 ${kept} محمي\n\nمتابعة؟`))return;
  S.busy=true;setLoading(true);
  try{await S.fb.ref('professionals').set(tree);log('csv-push',`${added}+ ${updated}~`);await loadDB();S.viewSrc='fb';applySource();go('home');toast(`تم: ${added} جديد، ${updated} محدّث`)}
  catch(e){console.error(e);toast('فشلت')}
  finally{S.busy=false;setLoading(false)}
}

function h53(s,seed=0){let a=0xdeadbeef^seed,b=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
const sid=(t,n,p)=>'p'+h53(t+'|'+norm(n)+'|'+fmtPhone(p));
const sha=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch{return'f'+h53(s)+h53(s,7)}};
const ident=v=>{v=String(v).trim();return v.includes('@')?v.toLowerCase():fmtPhone(v)};
const uidOf=async i=>'u_'+(await sha('cp:'+i)).slice(0,24);
const canEdit=r=>!!r&&(S.admin||(!!S.user&&S.user.profileId===r.id));
const canAdd=()=>S.admin||(!!S.user&&!S.user.profileId&&!S.user.claim);
const saveSess=()=>{try{S.user?localStorage.setItem('cp-user',JSON.stringify({id:S.user.id})):localStorage.removeItem('cp-user')}catch{}};
const log=(a,d)=>{try{S.fb?.ref('logs').push({t:Date.now(),u:S.admin?'admin':S.user?.name||'زائر',a,d:String(d||'')}).catch(()=>{})}catch{}};
async function refreshUser(){let id;try{id=JSON.parse(localStorage.getItem('cp-user')||'null')?.id}catch{}
  S.user=null;if(!id||!S.fb)return;
  try{const u=(await S.fb.ref('users/'+id).once('value')).val();if(u)S.user={id,name:u.name,ident:u.ident,profileId:u.profileId||'',claim:u.claim||''}}catch{}
  if(!S.user)saveSess()}
const field=(id,l,t='text',x='')=>`<label class="fl" id="w_${id}"><span>${l}</span><input id="${id}" type="${t}" ${x}></label>`;
function findMatch(i){return S.db.find(r=>!r.owner&&(i.includes('@')?norm(r.email)===norm(i):fmtPhone(r.phone)===fmtPhone(i)))}
function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
async function findUserByPhone(rawPhone){
  if(!S.fb||!rawPhone)return null;
  const raw=String(rawPhone).trim();
  const variants=phoneVariants(raw);
  for(const v of variants){
    const u=await uidOf(ident(v));
    const r=(await S.fb.ref('users/'+u).once('value')).val();
    if(r)return {uid:u,rec:r};
  }
  const all=(await S.fb.ref('users').once('value')).val()||{};
  const target=fmtPhone(raw);
  const targetDigits=target.replace(/\D/g,'');
  for(const [uid,u] of Object.entries(all)){
    if(!u||!u.ident)continue;
    const uPhone=fmtPhone(String(u.ident).trim());
    const uDigits=uPhone.replace(/\D/g,'');
    if(uPhone===target)return {uid,rec:u};
    if(uDigits&&targetDigits&&uDigits===targetDigits)return {uid,rec:u};
    if(uDigits.length>=9&&targetDigits.length>=9&&uDigits.slice(-9)===targetDigits.slice(-9))return {uid,rec:u};
  }
  return null;
}
async function createAccountFor(profile){
  if(!S.admin||!needFb())return null;
  const phone=fmtPhone(profile.phone);
  if(!validPhone(phone)){toast('هاتف الملف غير صالح');return null}
  const exists=await findUserByPhone(phone);
  if(exists){toast('يوجد حساب');return exists}
  const u=await uidOf(ident(phone));
  const salt=uid();const tempCode=genCode();const hash=await sha(salt+tempCode);
  const rec={name:profile.name,ident:phone,salt,hash,profileId:profile.id,createdAt:Date.now()};
  await S.fb.ref('users/'+u).set(rec);
  const p=path(profile.type,profile.categorie);
  await S.fb.ref(p).set((await fbArr(p)).map(x=>x.id===profile.id?{...x,owner:u}:x));
  log('account-auto',profile.name);return {uid:u,rec,tempCode};
}

  finally{setLoading(false)}
}

/* GEN FROM FILE */
async function rgenFile(id){
  if(!S.admin||!needFb())return;
  const r=byId(id);if(!r)return;
  const raw=r.phone?String(r.phone).trim():'';
  if(!raw)return toast('لا رقم');
  setLoading(true);
  try{
    let found=await findUserByPhone(raw);
    let autoCreated=false;
    if(!found){
      if(!confirm(`لا حساب بهذا الرقم.\nإنشاء حساب فوريًا لـ ${fmtPhone(raw)}؟`))return;
      const created=await createAccountFor(r);
      if(!created){toast('تعذر');return}
      found=created;autoCreated=true;
    }
    const {uid:uidVal,rec}=found;
    const code=genCode();
    const hash=await sha('reset:'+code+':'+rec.salt);
    const expiry=Date.now()+RESET_TTL;
    await S.fb.ref('users/'+uidVal).update({resetCode:hash,resetExpiry:expiry});
    log('reset-gen',rec.name);const wa=fmtPhone(rec.ident).replace(/\D/g,'');
    const profileUrl=`${location.origin}${location.pathname}#p=${r.id}`;
    const msg=`مرحباً ${rec.name}،\nرمزك السري المؤقت: *${code}*\n\nادخل → تسجيل الدخول → رقمك → الرمز.\n\nصالح 24 ساعة.\n\n🔗 ملفك: ${profileUrl}`;
    openOverlay(`<h2>تم التوليد</h2>${autoCreated?'<div class="code-note" style="background:rgba(16,124,16,.1);color:var(--w-green)"><b>✓ تم إنشاء حساب تلقائيًا</b></div>':''}
      <p class="lead">أرسله إلى <b>${esc(rec.name)}</b> (${esc(rec.ident)})</p>
      <div class="code-box"><div class="code" id="rcode">${code}</div><button class="cp" data-a="rcopy" data-v="${esc(code)}"><i class="fa-solid fa-copy"></i></button></div>
      <div class="code-hint">ينتهي: ${esc(new Date(expiry).toLocaleString('ar-MA'))}</div>
      <div class="ac"><button class="bt g" data-a="cls">إغلاق</button><a class="bt w" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> إرسال</a></div>`);
    toast('تم التوليد');
  }catch(e){console.error(e);toast('خطأ')}finally{setLoading(false)}
}

function adminGen(){
  if(!S.admin||!needFb())return;
  openOverlay(`<h2>توليد رمز</h2><p class="lead">أدخل الرقم أو البريد</p>
    <label class="fl"><span>الهاتف / البريد</span><input id="ag_phone" type="text" dir="ltr" placeholder="+2126..." autocomplete="off"></label>
    <div class="ac"><button class="bt g" data-a="cls">إلغاء</button><button class="bt" data-a="agFind">بحث</button></div>
    <div id="ag_result" style="margin-top:12px"></div>`);
  setTimeout(()=>$('#ag_phone').focus(),50);
  $('#ag_phone').onkeydown=e=>e.key==='Enter'&&A.agFind();
}
async function agFind(){
  if(!S.admin||!needFb())return;
  const raw=$('#ag_phone').value.trim();
  if(!raw)return toast('أدخل');
  setLoading(true);
  try{
    const found=await findUserByPhone(raw);
    if(!found){
      const profile=S.db.find(r=>fmtPhone(r.phone)===fmtPhone(raw));
      if(profile){
        $('#ag_result').innerHTML=`<div class="em" style="padding:16px;margin-bottom:8px"><i class="fa-solid fa-user-plus" style="color:var(--w-green)"></i><b>يوجد ملف بدون حساب</b><div style="font-size:12px;margin-top:3px">${esc(profile.name)}</div></div><button class="bt w full" data-a="agCreate" data-v="${esc(profile.id)}"><i class="fa-solid fa-user-plus"></i> إنشاء حساب + رمز</button>`;
        return;
      }
      const all=(await S.fb.ref('users').once('value')).val()||{};
      $('#ag_result').innerHTML=`<div class="em" style="padding:16px"><i class="fa-solid fa-user-xmark"></i><b>لا يوجد</b><div style="font-size:12px;margin-top:3px">حسابات: ${Object.keys(all).length}</div></div>`;
      return;
    }
    const {uid:uidVal,rec}=found;
    $('#ag_result').innerHTML=`<div style="padding:12px;margin-bottom:12px;background:var(--w-panel);border:1px solid var(--w-border)"><div style="display:flex;align-items:center;gap:12px"><div class="av" style="background:${color(rec.name)}">${esc(getInits(rec.name))}</div><div style="flex:1"><b style="font-size:14px">${esc(rec.name)}</b><br><small dir="ltr" style="color:var(--w-text-2);font-size:12px">${esc(rec.ident)}</small></div></div></div><button class="bt w full" data-a="agGen" data-v="${esc(uidVal)}"><i class="fa-solid fa-key"></i> توليد رمز</button>`;
  }catch(e){console.error(e);toast('خطأ')}finally{setLoading(false)}
}
async function agCreate(profileId){
  if(!S.admin||!needFb())return;
  const profile=byId(profileId);if(!profile)return;
  setLoading(true);
  try{
    const created=await createAccountFor(profile);
    if(!created){toast('تعذر');return}
    toast('تم — جاري التوليد...');
    await agGen(created.uid);
  }catch(e){console.error(e);toast('خطأ')}finally{setLoading(false)}
}

  if(!S.admin||!needFb())return;
  setLoading(true);
  try{
    const rec=(await S.fb.ref('users/'+uidVal).once('value')).val();
    if(!rec){toast('غير موجود');return}
    const code=genCode();const hash=await sha('reset:'+code+':'+rec.salt);const expiry=Date.now()+RESET_TTL;
    await S.fb.ref('users/'+uidVal).update({resetCode:hash,resetExpiry:expiry});
    log('admin-gen',rec.name);const wa=fmtPhone(rec.ident).replace(/\D/g,'');
    const msg=`مرحباً ${rec.name}،\nرمزك السري المؤقت: *${code}*\n\nادخل → تسجيل الدخول → رقمك → الرمز.\n\nصالح 24 ساعة.`;
    openOverlay(`<h2>تم التوليد</h2><p class="lead">أرسله إلى <b>${esc(rec.name)}</b></p>
      <div class="code-box"><div class="code" id="rcode">${code}</div><button class="cp" data-a="rcopy" data-v="${esc(code)}"><i class="fa-solid fa-copy"></i></button></div>
      <div class="code-hint">ينتهي: ${esc(new Date(expiry).toLocaleString('ar-MA'))}</div>
      <div class="ac"><button class="bt g" data-a="cls">إغلاق</button><a class="bt w" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> إرسال</a></div>`);
    toast('تم');
  }catch(e){console.error(e);toast('خطأ')}finally{setLoading(false)}
}

/* ADMIN PANEL */
async function adminPanel(){
  if(!S.admin||!needFb())return;
  setLoading(true);
  try{
    const [usersRaw,logsRaw,profsRaw]=await Promise.all([S.fb.ref('users').once('value'),S.fb.ref('logs').limitToLast(50).once('value'),S.fb.ref('professionals').once('value')]);
    S.usersList={users:Object.entries(usersRaw.val()||{}),logs:Object.values(logsRaw.val()||{}).reverse(),profs:mapRaw(profsRaw.val())};
    S.usersTab='with';S.usersQuery='';
    renderUsersPanel();
  }catch(e){console.error(e);toast('تعذر')}finally{setLoading(false)}
}
function renderUsersPanel(){
  if(!S.usersList)return;
  const {users,logs,profs}=S.usersList;
  const userProfileIds=new Set(users.filter(([,u])=>u.profileId).map(([,u])=>u.profileId));
  const profilesNoAccount=profs.filter(p=>!p.owner && !userProfileIds.has(p.id));
  const stats=`<div class="stats">
    <div class="stat"><b>${profs.length}</b><span>ملفات</span></div>
    <div class="stat"><b>${users.length}</b><span>حسابات</span></div>
    <div class="stat ${profilesNoAccount.length?'warn':''}"><b>${profilesNoAccount.length}</b><span>بدون حساب</span></div>
    <div class="stat"><b>${users.filter(([,u])=>u.resetCode&&u.resetExpiry>Date.now()).length}</b><span>رموز نشطة</span></div>
  </div>`;
  const toolsRow=`<div class="srcbar" style="margin-bottom:10px">
    <button data-a="csvfetch"><i class="fa-solid fa-cloud-arrow-down"></i> جلب CSV</button>
    <button data-a="exp"><i class="fa-solid fa-file-csv"></i> تصدير</button>
    <button data-a="admingen"><i class="fa-solid fa-key"></i> توليد</button>
  </div>`;
  const tabs=`<div class="srcbar" style="margin-bottom:10px">
    <button class="${S.usersTab==='with'?'on':''}" data-a="utab" data-v="with">حسابات (${users.length})</button>
    <button class="${S.usersTab==='no'?'on':''}" data-a="utab" data-v="no">بدون حساب (${profilesNoAccount.length})</button>
  </div>`;
  let content='';
  if(S.usersTab==='with'){
    const q=S.usersQuery;
    const filtered=users.filter(([,u])=>!q||hit([u.name,u.ident].join(' '),q));
    content=`<label class="fl"><input type="search" id="uq" placeholder="بحث..." value="${esc(q)}"></label>
      <div style="max-height:280px;overflow-y:auto">${filtered.length?filtered.map(([id,u])=>`<div class="pr"><div style="flex:1"><b>${esc(u.name)}</b><small dir="ltr">${esc(u.ident)}</small>${u.resetCode&&u.resetExpiry>Date.now()?'<small style="color:var(--w-orange)">🔑 رمز نشط</small>':''}</div><button class="hb" style="color:var(--w-accent);width:34px;height:34px;border-radius:2px" data-a="agGen" data-v="${esc(id)}"><i class="fa-solid fa-key"></i></button><button class="hb" style="color:var(--w-red);width:34px;height:34px;border-radius:2px" data-a="udel" data-v="${esc(id)}"><i class="fa-solid fa-user-slash"></i></button></div>`).join(''):'<p class="em">لا نتائج</p>'}</div>`;
  }else{
    content=`<div style="max-height:320px;overflow-y:auto">${profilesNoAccount.length?profilesNoAccount.map(p=>`<div class="pr"><div style="flex:1"><b>${esc(p.name)}</b><small dir="ltr">${esc(fmtPhone(p.phone)||'—')}</small><small>${esc([shown(p.domaine),p.ville].filter(Boolean).join(' · '))}</small></div><button class="bt o" style="min-height:34px;padding:0 12px;font-size:12px" data-a="agCreate" data-v="${esc(p.id)}"><i class="fa-solid fa-user-plus"></i> إنشاء + رمز</button></div>`).join(''):'<p class="em">كلها مرتبطة ✓</p>'}</div>`;
  }
  const logColor={add:'add',delete:'del',edit:'edit','csv-push':'sync','reset-gen':'key','admin-gen':'key',signup:'add',login:'login','pass-change':'edit','account-auto':'add'};
  const logsHtml=logs.slice(0,15).map(l=>{
    const cls=logColor[l.a]||'';
    return `<div class="log-row"><span class="lg-time">${esc(new Date(l.t).toLocaleString('ar-MA'))}</span><span class="lg-act ${cls}">${esc(l.a)}</span><span style="flex:1">${esc(l.d)} · ${esc(l.u)}</span></div>`;
  }).join('')||'<p class="em">لا نشاط</p>';
  openOverlay(`<h2>لوحة الإدارة</h2>${toolsRow}${stats}${tabs}${content}<h3 class="t" style="margin-top:14px;margin-right:0">سجل النشاط</h3><div style="max-height:220px;overflow-y:auto">${logsHtml}</div><div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
  const uq=$('#uq');
  if(uq)uq.oninput=e=>{clearTimeout(uq._t);uq._t=setTimeout(()=>{S.usersQuery=e.target.value;renderUsersPanel();const el=$('#uq');if(el){el.focus();el.setSelectionRange(9999,9999)}},150)};
}
async function udel(id){if(!S.admin||!needFb()||!confirm('حذف المستخدم؟'))return;try{await S.fb.ref('users/'+id).remove();log('user-del',id);toast('تم');adminPanel()}catch{toast('خطأ')}}

/* EVENTS */
const A={
  theme,adm,add:()=>canAdd()?form(null):toast('غير مسموح'),acc:account,usr:adminPanel,udel,udelme:deleteMyAccount,
  alogin:openLogin,asignup:openSignup,doLogin,doSignup,setDurable,forgotopen:forgotOpen,fqFind,
  changepass:changePassword,doChangePass,
  uout(){
    S.user=null;saveSess();
    try{localStorage.removeItem('cp-saved-pass');localStorage.removeItem('cp-saved-phone')}catch{}
    adminUI();closeOverlay();toast('خرجت');go(S.tab)
  },
  findme:claimCancel,claimsearch:claimSearch,claimsend:claimSend,resetreq:resetReq,rgenfile:rgenFile,
  admingen:adminGen,agFind,agGen,agCreate,
  utab(v){S.usersTab=v;S.usersQuery='';renderUsersPanel()},
  copylink(v){navigator.clipboard?.writeText(v).then(()=>toast('تم نسخ الرابط')).catch(()=>toast('تعذر'))},
  rcopy(v){navigator.clipboard?.writeText(v).then(()=>toast('تم النسخ')).catch(()=>toast('تعذر'))},
  srcfb(){if(!S.admin)return;S.viewSrc='fb';applySource();go('home')},
  srccsv(){if(!S.admin)return;if(!S.csvCache.length){toast('اجلب CSV أولاً');csvFetch();return}S.viewSrc='csv';applySource();go('home')},
  csvfetch:()=>csvFetch(false),csvpush:csvPush,
  tab:v=>S.tab===v?(v==='dir'?(clearFilters(),directory()):v==='exp'?(S.exp={t:'',d:'',s:''},S.expQ='',explorer()):scrollTo({top:0,behavior:'smooth'})):go(v),
  cls:closeOverlay,open:profile,shr:share,pdf:makePDF,
  edit:id=>{const r=byId(id);canEdit(r)?form(r):toast('غير مسموح')},
  del:delAsk,delok:delOk,save,exp:exportCSV,vrf:verifyToggle,
  login(){
    const pw=$('#pw').value;
    if(pw===ADMIN_PASS){
      const save=$('#pw_save')?.checked;
      if(save)localStorage.setItem('cp-admin-pw',pw);
      else localStorage.removeItem('cp-admin-pw');
      S.user=null;saveSess();
      try{localStorage.removeItem('cp-saved-pass');localStorage.removeItem('cp-saved-phone')}catch{}
      S.admin=true;sessionStorage.setItem('cp-admin','1');
      adminUI();closeOverlay();toast('مرحباً (وضع المدير)');
      csvFetch(true);go(S.tab);
    }else{
      $('#pw').parentElement.classList.add('er');
      toast('كلمة خاطئة');
    }
  },
  stat(v){
    const i=v.indexOf(':'),k=v.slice(0,i),x=v.slice(i+1);
    const pickMatch=v.match(/^pick:(.+)$/);
    if(pickMatch){openFilter(pickMatch[1]);return}
    clearFilters();S.f[k]=[x];go('dir');
  },
  bardirect(v,el){
    const filterKey=el.dataset.k;
    clearFilters();
    S.f[filterKey]=[v];
    go('dir');
  },
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=60;directory();nav()},
  clr(){clearFilters();directory();nav()},
  more(){S.lim+=60;directory()},
  qx(){S.f.q='';$('#q').value='';directory()},
  favclr(){if(confirm('مسح كل المفضلة؟')){S.fav=[];try{localStorage.removeItem('cp-fav')}catch{}nav()}},
  xt:v=>{S.exp={t:v,d:'',s:''};S.expQ='';explorer()},xd:v=>{S.exp.d=v;S.exp.s='';S.expQ='';explorer()},xs:v=>{S.exp.s=v;S.expQ='';explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:''}:v==='t'?{t:x.t,d:'',s:''}:v==='d'?{t:x.t,d:x.d,s:''}:x;S.expQ='';explorer()},
  expSort(v){S.expSort=v;explorer()},
  fopen:openFilter,fcls:closeOverlay,
  fclr(){clearFilters();renderFilter();directory();nav()},
  fsect(v){S.fp='pick';S.fk=v;renderFilter()},
  fback(){S.fp='sections';S.fk=null;renderFilter()},
  fsort(v){S.sortF[S.fk]=v;renderFilter()},
  fclearsec(){S.f[S.fk]=[];S.lim=60;renderFilter();directory();nav()},
  fpick(v){
    const k=S.fk,arr=S.f[k];
    const i=arr.findIndex(x=>norm(x)===norm(v));
    if(i>=0)arr.splice(i,1);else arr.push(v);
    S.lim=60;
    if(arr.length===0&&i>=0){renderFilter();directory();nav();return}
    closeOverlay();S.tab='dir';
    document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-dir'));
    nav();directory();scrollTo(0,0);
  },
  fdone(){closeOverlay();S.tab='dir';document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-dir'));nav();directory();scrollTo(0,0)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}else if(e.target.id==='md')closeOverlay()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeOverlay();
  if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v);
});
let dt;$('#q').addEventListener('input',e=>{clearTimeout(dt);dt=setTimeout(()=>{S.f.q=e.target.value;S.lim=60;directory()},200)});

/* INIT */
(async()=>{
  themeIcon();adminUI();nav();
  try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
  await loadDB();await refreshUser();adminUI();go('home');setLoading(false);
  if(S.admin)csvFetch(true);
  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(m[1]);if(r)profile(r.id)},300);
})();
})();
</script>
