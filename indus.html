<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Pro — منصة التواصل المهني</title>
<meta name="theme-color" content="#0F2438">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--wd:#0F2438;--wl:#0B5CAD;--wt:#F2A900;--lk:#0B5CAD;--acs:#E3EEF9;--bg:#ECEFF2;--cd:#fff;--bd:#D3D9DF;--ink:#101C28;--mut:#566474;--dg:#B3261E;--ok:#1B7F5C;--red:#D9243C;--sh:0 1px 2px rgba(16,28,40,.08);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);color-scheme:light}
[data-theme=dark]{--bg:#0D1620;--cd:#15222F;--bd:#25364A;--ink:#E7EDF3;--mut:#9AABBB;--dg:#FF8A80;--lk:#6AB0F3;--acs:#1B3148;--wl:#2E78C7;--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font:15px/1.5 'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--wt);outline-offset:2px;border-radius:8px}
header{position:fixed;inset:0 0 auto;height:calc(60px + var(--st));padding-top:var(--st);z-index:30;background:var(--wd);color:#fff;display:flex;align-items:center;gap:8px;padding-inline:10px;border-bottom:3px solid var(--wt)}
.lg{width:40px;height:40px;border-radius:10px;background:var(--wt);color:var(--wd);display:grid;place-items:center;font-weight:700;flex:none}
.ht{flex:1;min-width:0}.ht b{display:block;font-size:17px;line-height:1.2}.ht small{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{width:42px;height:42px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:17px;flex:none}.hb:hover,.hb.on{background:rgba(255,255,255,.18)}.hb.on{color:var(--wt)}
#hadd{display:none}.ab{display:none}.cadd #hadd{display:grid}.adm .ab{display:block}@media(max-width:360px){.hb{width:36px;height:40px}.ht small{display:none}}
main{max-width:800px;margin:0 auto;padding:calc(72px + var(--st)) 12px calc(88px + var(--sb))}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;inset:auto 0 0;height:calc(62px + var(--sb));padding-bottom:var(--sb);z-index:30;background:var(--cd);border-top:1px solid var(--bd);display:flex;align-items:stretch}
nav button.nv{flex:1;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;gap:1px;position:relative;min-width:0;padding:0 2px}
nav button.nv.on{color:var(--lk);font-weight:700}
nav button.nv.on::before{content:"";position:absolute;top:0;width:32px;height:3px;background:var(--wt);border-radius:0 0 3px 3px}
nav i{font-size:18px}
.nb{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);background:var(--wl);color:#fff;border-radius:9px;font-size:10.5px;min-width:17px;padding:0 3px;font-weight:700;text-align:center}
.gl{background:var(--cd);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh)}
.g4{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}@media(min-width:560px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sc{padding:12px 8px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center}
.sc i{color:var(--lk);font-size:20px;margin-bottom:2px}.sc b{font-size:24px;line-height:1.2}.sc span{font-size:13px;color:var(--mut)}
h3.t{font-size:16px;margin:14px 2px 8px;color:var(--ink)}
.pn{padding:14px;margin-bottom:12px}
.av{width:46px;height:46px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.sr{display:flex;align-items:center;gap:8px;padding:0 12px;height:48px;position:relative}
.sr input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:16px}.sr i{color:var(--mut)}.sr button{width:36px;height:36px;color:var(--mut);border-radius:50%;display:grid;place-items:center}
.sr button:hover{background:var(--acs)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 2px 8px}
.fchips:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 10px;background:var(--wl);color:#fff;border-radius:15px;font-size:12.5px}
.fchip .x{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;font-size:9px}
.fchip .x:hover{background:rgba(255,255,255,.4)}
.fchips .fclr{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--bd);background:var(--cd);color:var(--dg);font-size:12.5px;font-weight:600}
.inf{font-size:13px;color:var(--mut);margin:2px 4px 8px}
.ls{display:grid;gap:8px}
.card{display:flex;align-items:center;gap:10px;padding:10px;cursor:pointer;min-width:0;background:var(--cd);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh)}
.card:hover{border-color:var(--lk)}
.cm{flex:1;min-width:0}.cm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.cm small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chs{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.ch{font-size:11.5px;padding:0 8px;border-radius:8px;background:var(--wl);color:#fff}.ch.o{background:transparent;border:1px solid var(--bd);color:var(--mut)}.ch.v{background:var(--ok);color:#fff}
.ca{display:flex;flex:none}.ca button{width:34px;height:40px;color:var(--mut)}.ca .on{color:#e5a900}.ca .dl{color:var(--dg)}
.vbadge{color:var(--ok);font-size:13px}
.em{text-align:center;padding:36px 12px;color:var(--mut)}.em i{font-size:36px;color:var(--lk);display:block;margin-bottom:8px}
.cr{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin-bottom:8px;font-size:14px}.cr button{min-height:34px;padding:0 6px;color:var(--lk);font-weight:700}.cr i{font-size:10px;color:var(--mut)}
.rw{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;margin-bottom:8px;text-align:start;background:var(--cd);border:1px solid var(--bd);border-radius:12px}.rw span{flex:1;min-width:0;overflow-wrap:anywhere}.rw em{font-style:normal;color:var(--mut)}.rw>i:first-child{color:var(--lk);width:20px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--wl);color:#fff;font-weight:700;text-decoration:none;min-width:0}
.bt.g{background:transparent;border:1px solid var(--bd);color:var(--ink)}.bt.d{background:var(--dg);color:#fff}.bt.w{background:var(--ok);color:#fff}.bt.o{background:var(--wt);color:var(--wd)}
.bt:disabled{opacity:.5;cursor:not-allowed}
#md{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:none;place-items:center;padding:12px;overflow-y:auto}
#md.on{display:grid}
.mb{width:100%;max-width:440px;max-height:92vh;overflow-y:auto;padding:18px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;animation:sc .18s ease-out;margin:auto}
[data-theme=dark] .mb{background:#15222F}
@keyframes sc{from{transform:scale(.9);opacity:0}}
.mb h2{font-size:18px;text-align:center;margin-bottom:10px;color:var(--ink)}
.mb .lead{text-align:center;color:var(--mut);font-size:13px;margin-bottom:12px}
.ac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}.ac .full{grid-column:1/-1}
.fl{display:block;margin-bottom:10px}.fl span{font-size:13px;font-weight:700}.fl input,.fl select{width:100%;height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);padding:0 10px;font-size:16px}.fl.er input{border-color:var(--dg)}
.pr{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.pr i{color:var(--lk);width:20px;margin-top:5px}.pr small{display:block;color:var(--mut);font-size:12px}.pr div{min-width:0;overflow-wrap:anywhere}
.vcard{border-radius:20px;overflow:hidden;background:var(--cd);border:1px solid var(--bd);margin-bottom:14px;box-shadow:0 6px 20px rgba(15,36,56,.12)}
.vhead{background:linear-gradient(135deg,var(--wd) 0%,#1a3a5c 100%);color:#fff;padding:22px 18px 18px;text-align:center;position:relative;overflow:hidden}
.vhead::before{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(242,169,0,.14)}
.vhead::after{content:"";position:absolute;inset-inline-start:-30px;bottom:-30px;width:100px;height:100px;border-radius:50%;background:rgba(11,92,173,.18)}
.vlogo{width:78px;height:78px;border-radius:22px;background:var(--wt);color:var(--wd);display:grid;place-items:center;font-size:34px;margin:0 auto 12px;font-weight:700;border:3px solid rgba(255,255,255,.18);position:relative;z-index:1}
.vname{font-size:20px;font-weight:700;line-height:1.25;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.vname .vbadge{color:var(--wt);font-size:16px}
.vsub{font-size:13px;opacity:.85;margin-top:4px;position:relative;z-index:1}
.vtags{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap;position:relative;z-index:1}
.vtag{font-size:11.5px;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.22);font-weight:600}
.vtag.v{background:var(--ok);border-color:var(--ok)}
.vbody{padding:14px 18px}
.vrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--bd);align-items:flex-start}
.vrow:last-child{border-bottom:0}
.vrow .vic{width:34px;height:34px;border-radius:10px;background:var(--acs);color:var(--lk);display:grid;place-items:center;flex:none;font-size:14px}
.vrow .vtxt{flex:1;min-width:0}
.vrow .vk{font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:1px}
.vrow .vv{font-size:14.5px;color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.vrow a.vv{color:var(--wl);text-decoration:none}
.vrow a.vv:hover{text-decoration:underline}
.vfoot{padding:12px 18px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vfoot .bt{min-height:42px;font-size:13.5px}
.vfoot .full{grid-column:1/-1}
.fmodal-h{text-align:center;margin-bottom:14px}
.fmodal-h h2{font-size:18px;margin-bottom:2px}
.fmodal-h .sub{font-size:12.5px;color:var(--mut)}
.fsect{display:flex;align-items:center;gap:10px;width:100%;padding:13px 12px;border-radius:12px;text-align:start;background:var(--cd);border:1px solid var(--bd);margin-bottom:8px;transition:.15s}
.fsect:hover{border-color:var(--lk)}
.fsect.on{background:var(--acs);border-color:var(--wl)}
.fsect .ic{width:30px;height:30px;border-radius:9px;background:var(--acs);color:var(--lk);display:grid;place-items:center;flex:none;font-size:13px}
.fsect.on .ic{background:var(--wl);color:#fff}
.fsect .name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.fsect .val{font-size:12.5px;color:var(--wl);font-weight:700;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsect .num{font-size:12px;color:var(--mut);min-width:22px;text-align:center}
.fsect .chev{color:var(--mut);font-size:11px}
.fback{display:flex;align-items:center;gap:6px;color:var(--lk);font-weight:700;font-size:13.5px;margin-bottom:10px;padding:6px 4px}
.fback i{font-size:11px}
.sortbar{display:flex;gap:6px;margin-bottom:10px}
.sortbtn{flex:1;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--mut);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.sortbtn.on{background:var(--acs);border-color:var(--wl);color:var(--wl)}
.sortbtn i{font-size:11px}
.fopt{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:12px;text-align:start;background:var(--cd);border:1px solid var(--bd);margin-bottom:6px;transition:.15s}
.fopt:hover{border-color:var(--lk)}
.fopt.on{background:var(--acs);border-color:var(--wl)}
.fopt .box{width:20px;height:20px;border-radius:6px;flex:none;border:2px solid var(--bd);display:grid;place-items:center;color:transparent;font-size:11px}
.fopt.on .box{border-color:var(--wl);background:var(--wl);color:#fff}
.fopt .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.fopt.on .name{font-weight:700;color:var(--wl)}
.fopt .n{font-size:12.5px;color:var(--mut)}
.fopt:disabled{opacity:.4;cursor:not-allowed}
.fopt:disabled:hover{border-color:var(--bd)}
.fopt.clear{border-style:dashed;color:var(--dg)}
.fopt.clear .name{color:var(--dg)}
.code-box{display:flex;align-items:center;gap:8px;padding:12px;background:var(--acs);border:2px dashed var(--wl);border-radius:12px;margin:10px 0}
.code-box .code{flex:1;font-family:'Courier New',monospace;font-size:22px;font-weight:700;letter-spacing:3px;color:var(--wl);text-align:center;direction:ltr;user-select:all;padding:6px 0}
.code-box .cp{width:40px;height:40px;border-radius:10px;background:var(--wl);color:#fff;display:grid;place-items:center;flex:none}
.code-box .cp:hover{opacity:.85}
.code-hint{font-size:12px;color:var(--mut);text-align:center;margin-top:6px}
.code-note{font-size:12.5px;color:var(--mut);padding:10px;background:var(--bg);border-radius:10px;margin:10px 0;line-height:1.7}
.code-note b{color:var(--wl)}
.auth-hub{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.auth-btn{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);text-align:start;transition:.15s}
.auth-btn:hover{border-color:var(--wl);transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,36,56,.1)}
.auth-btn.primary{background:linear-gradient(135deg,var(--wd),#1a3a5c);color:#fff;border-color:transparent}
.auth-btn.primary:hover{box-shadow:0 6px 18px rgba(15,36,56,.25)}
.auth-btn .ai{width:48px;height:48px;border-radius:14px;background:var(--acs);color:var(--lk);display:grid;place-items:center;font-size:20px;flex:none}
.auth-btn.primary .ai{background:var(--wt);color:var(--wd)}
.auth-btn .at{flex:1;min-width:0}
.auth-btn .at b{display:block;font-size:15.5px;margin-bottom:2px}
.auth-btn .at small{font-size:12px;opacity:.75;line-height:1.4}
.auth-btn.primary .at small{opacity:.85}
.auth-btn .chev{color:var(--mut);font-size:14px}
.auth-btn.primary .chev{color:rgba(255,255,255,.7)}
.srcbar{display:flex;gap:6px;margin-bottom:12px;padding:4px;background:var(--cd);border:1px solid var(--bd);border-radius:12px}
.srcbar button{flex:1;height:40px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.srcbar button.on{background:var(--wl);color:#fff}
.srcbar button i{font-size:13px}
.sortbar2{display:flex;gap:6px;margin-bottom:10px}
.sortbar2 button{flex:1;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--mut);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
.sortbar2 button.on{background:var(--acs);border-color:var(--wl);color:var(--wl)}
.sortbar2 button i{font-size:12px}
.pdf-stage{position:fixed;left:-99999px;top:0;width:1200px;height:auto}
.pdf-card{width:1200px;background:#fff;color:#101C28;font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;display:flex;flex-direction:row;min-height:520px;overflow:hidden;position:relative}
.pdf-left{flex:0 0 480px;background:#0F2438;color:#fff;padding:60px 50px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}
.pdf-left::before{content:"";position:absolute;right:-120px;top:-120px;width:320px;height:320px;border-radius:50%;background:rgba(242,169,0,.15)}
.pdf-left::after{content:"";position:absolute;left:-100px;bottom:-100px;width:280px;height:280px;border-radius:50%;background:rgba(11,92,173,.22)}
.pdf-shape{position:absolute;top:0;right:0;width:150px;height:100%;overflow:hidden;z-index:1}
.pdf-shape::before{content:"";position:absolute;top:-10%;left:0;width:100%;height:55%;background:#D9243C;transform:skewY(-22deg);transform-origin:top left}
.pdf-shape::after{content:"";position:absolute;top:45%;left:0;width:100%;height:55%;background:#D9243C;transform:skewY(22deg);transform-origin:top left}
.pdf-logo{width:170px;height:170px;border-radius:50%;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:700;border:18px solid #D9243C;margin-bottom:24px;position:relative;z-index:2;box-sizing:content-box}
.pdf-name{font-size:34px;font-weight:700;line-height:1.2;position:relative;z-index:2;margin-top:6px}
.pdf-sub{font-size:17px;opacity:.85;margin-top:10px;position:relative;z-index:2}
.pdf-tags{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap;position:relative;z-index:2}
.pdf-tag{font-size:13px;padding:5px 14px;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);font-weight:600}
.pdf-tag.v{background:#1B7F5C;border-color:#1B7F5C}
.pdf-right{flex:1;background:#fff;padding:50px 40px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.pdf-row{display:flex;align-items:center;gap:18px;padding:8px 0}
.pdf-row .ic{width:52px;height:52px;border-radius:50%;background:transparent;color:#D9243C;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:26px}
.pdf-row .k{font-size:12px;color:#566474;font-weight:600;margin-bottom:3px}
.pdf-row .v{font-size:18px;color:#101C28;font-weight:600;word-break:break-word}
.pdf-qr{position:absolute;bottom:28px;left:40px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:5}
.pdf-qr img{width:90px;height:90px;border:3px solid #0F2438;border-radius:8px;background:#fff;padding:3px}
.pdf-qr small{font-size:9px;color:#566474;font-weight:600}
#ts{position:fixed;inset-inline:0;bottom:calc(84px + var(--sb));margin:auto;width:max-content;max-width:calc(100% - 24px);background:var(--wd);color:#fff;padding:10px 18px;border-radius:10px;border-inline-start:4px solid var(--wt);z-index:80;opacity:0;pointer-events:none;transition:.2s;transform:translateY(12px)}#ts.on{opacity:1;transform:none}
#ld{position:fixed;inset:0;z-index:99;background:var(--wd);display:none;place-items:center}#ld.on{display:grid}#ld i{font-size:44px;color:var(--wt);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.stk{position:sticky;top:calc(60px + var(--st));z-index:5;background:var(--bg);padding:8px 0 2px}
.hz{height:6px;border-radius:3px;margin-bottom:10px;background:repeating-linear-gradient(-45deg,var(--wt) 0 10px,var(--wd) 10px 20px)}
.seg{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}.seg i{display:block;min-width:4px}
.cols{display:grid;gap:0 12px;grid-template-columns:minmax(0,1fr)}@media(min-width:640px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar2{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 10px;border-radius:8px;overflow:hidden;text-align:start;margin-top:6px;background:var(--bg)}
.bar2 i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--acs)}.bar2 span,.bar2 b{position:relative}.bar2 span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(()=>{'use strict';
/* ═══ CONFIG ═══ */
const FBC={apiKey:"AIzaSyBQKPqut41Jqs28Zn_z-I_ffD-iNCnFpdU",authDomain:"said-rahil-default-rtdb.firebaseio.com",databaseURL:"https://said-rahil-default-rtdb.firebaseio.com/",projectId:"said-rahil",storageBucket:"said-rahil.firebasestorage.app"};
const CSV_EXPERTS="https://docs.google.com/spreadsheets/d/e/2PACX-1vSjj2c3fjfHowy8yxOfpVAsfXLRVgSQPJQ7PVc4wvI2dI7g0hQwF32QoByKExzadiHivu3oKYRpgWKK/pub?gid=42570462&single=true&output=csv";

const CI={services:'fa-screwdriver-wrench',products:'fa-boxes-stacked',maqola:'fa-helmet-safety',['yad-amila']:'fa-people-carry-box'};
const DOMI={'البناء':'fa-hard-hat','التجارة':'fa-store','تكنولوجيا':'fa-laptop-code','الصناعة':'fa-industry','السياحة':'fa-plane','الصحة':'fa-heart-pulse','الثقافة':'fa-landmark','التعليم':'fa-graduation-cap','الفلاحة':'fa-seedling','النقل':'fa-truck','المالية':'fa-coins','الغذاء':'fa-utensils','الطاقة':'fa-bolt'};

const PAL=['#075E54','#128C7E','#34699A','#7A3E9D','#B3541E','#8A6D0B','#9A3B5C','#2F6F4F','#4C5A9E','#5B6B1F'];

];

/* ═══ STATE ═══ */
const S={
  db:[],fbCache:[],csvCache:[],csvBusy:false,viewSrc:'fb',
  f:{type:[],cat:[],dom:[],ville:[],spe:[],q:''},
  tab:'home',fav:[],
  admin:sessionStorage.getItem('cp-admin')==='1',

};
try{S.fav=JSON.parse(localStorage.getItem('cp-fav')||'[]')}catch{}

/* ═══ HELPERS ═══ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase().replace(/\s+/g,' ').trim();
const hit=(v,q)=>{const n=norm(v);return norm(q).split(' ').every(t=>n.includes(t))};
const getInits=n=>String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const color=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};

/* ═══ تنسيق الهاتف الموحد ═══ */
const fmtPhone=p=>{
  let d=String(p||'').replace(/[^\d+]/g,'');
  if(!d)return'';
  if(d.startsWith('00'))d='+'+d.slice(2);
  if(d.startsWith('+'))return d;
  if(d.startsWith('0'))return'+212'+d.slice(1);
  if(d.startsWith('212'))return'+'+d;
  return d;
};
/* صيغ الهاتف للتجربة */
const phoneVariants=p=>{
  const d=String(p||'').replace(/[^\d]/g,'');
  if(!d)return[];
  const out=new Set();
  out.add(String(p).trim());
  out.add('+'+d);
  if(d.startsWith('212')){out.add('0'+d.slice(3));out.add(d);out.add('+'+d);}
  if(d.startsWith('0')){out.add('+212'+d.slice(1));out.add('212'+d.slice(1));out.add(d);}
  if(d.length===9){out.add('+212'+d);out.add('0'+d);out.add('212'+d);}
  return [...out].filter(Boolean);
};

const uid=()=>`${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
const url=w=>{if(!w)return'';const u=/^https?:\/\//i.test(w)?w:'https://'+w;return/^https?:\/\/\S+$/i.test(u)?u:''};
const shown=v=>v&&v!=='Autre'&&v!=='Général'?v:'';
let tt;const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3000)};
const setLoading=b=>$('#ld').classList.toggle('on',b);
const openOverlay=h=>{$('#md').innerHTML=`<div class="mb">${h}</div>`;$('#md').classList.add('on');document.body.style.overflow='hidden'};
const closeOverlay=()=>{$('#md').classList.remove('on');document.body.style.overflow=''};
const uniq=k=>[...new Set(S.db.map(r=>(r[k]||'').trim()).filter(Boolean))];
const byId=id=>S.db.find(r=>r.id===id);
const lbl=(k,v)=>k==='type'?TL[v]||v:k==='cat'?CL[v]||v:v;
const clearFilters=()=>{S.f={type:[],cat:[],dom:[],ville:[],spe:[],q:''};$('#q').value='';S.lim=60};
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0);
function applySource(){
  if(S.admin&&S.viewSrc==='csv'&&S.csvCache.length){S.db=S.csvCache;}
  else{S.db=S.fbCache;}
}

/* ═══ THEME ═══ */
function theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('cp-theme',d)}catch{}themeIcon()}
const themeIcon=()=>$('#hth').innerHTML=`<i class="fa-solid ${document.documentElement.dataset.theme==='dark'?'fa-sun':'fa-moon'}"></i>`;

/* ═══ NAV ═══ */
function nav(){
  const items=[
    {id:'home', label:'الرئيسية', icon:'fa-house'},
    {id:'dir',  label:'الدليل',   icon:'fa-address-book'},
    {id:'fil',  label:'فلتر',     icon:'fa-sliders'},
    {id:'exp',  label:'المستكشف', icon:'fa-sitemap'},
    {id:'fav',  label:'المفضلة',  icon:'fa-star'}
  ];
  const nf=activeCount();
  $('#nav').innerHTML=items.map(i=>{
    if(i.id==='fil'){
      return `<button class="nv${nf>0?' on':''}" data-a="fopen" aria-label="فتح الفلاتر"><i class="fa-solid ${i.icon}"></i>${i.label}${nf>0?`<span class="nb">${nf}</span>`:''}</button>`;
    }
    return `<button class="nv ${S.tab===i.id?'on':''}" data-a="tab" data-v="${i.id}"><i class="fa-solid ${i.icon}"></i>${i.label}${i.id==='fav'&&S.fav.length?`<span class="nb">${S.fav.length}</span>`:''}</button>`;
  }).join('');

function go(t){S.tab=t;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+t));nav();({home:dashboard,dir:directory,exp:explorer,fav:bookmarks})[t]();scrollTo(0,0)}

/* ═══ FILTER ENGINE ═══ */
function match(r,skip){
  for(const k in FLD){
    if(k===skip)continue;
    const arr=S.f[k];
    if(arr.length && !arr.some(v=>norm(r[FLD[k]])===norm(v)))return false;
  }
  return !S.f.q || hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.f.q);
}
const results=()=>S.db.filter(r=>match(r)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
function facet(k,sortBy='count'){
  const m=new Map();
  S.db.filter(r=>match(r,k)).forEach(r=>{
    const v=(r[FLD[k]]||'').trim();
    if(v)m.set(v,(m.get(v)||0)+1);
  });
  const arr=[...m];
  if(sortBy==='count') return arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
  return arr.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
}

/* ═══ DIRECTORY ═══ */
const vBadge=r=>r.verified?' <i class="fa-solid fa-circle-check vbadge" title="موثّق"></i>':'';
const card=r=>`<div class="card" data-a="open" data-v="${esc(r.id)}" role="button" tabindex="0"><div class="av" style="background:${color(r.name)}">${esc(getInits(r.name))}</div><div class="cm"><b>${esc(r.name)}${vBadge(r)}</b><small>${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</small><div class="chs"><span class="ch">${TL[r.type]}</span><span class="ch o">${CL[r.categorie]}</span>${r.verified?'<span class="ch v">موثّق</span>':''}</div></div><div class="ca"><button data-a="fav" data-v="${esc(r.id)}" aria-label="مفضلة" class="${S.fav.includes(r.id)?'on':''}"><i class="fa-${S.fav.includes(r.id)?'solid':'regular'} fa-star"></i></button><button data-a="shr" data-v="${esc(r.id)}" aria-label="مشاركة"><i class="fa-solid fa-share-nodes"></i></button>${canEdit(r)?`<button data-a="edit" data-v="${esc(r.id)}" aria-label="تعديل"><i class="fa-solid fa-pen"></i></button>`:''}${S.admin?`<button class="dl" data-a="del" data-v="${esc(r.id)}" aria-label="حذف"><i class="fa-solid fa-trash"></i></button>`:''}</div></div>`;
const empty=t=>`<div class="em"><i class="fa-regular fa-face-frown"></i><b>${t}</b></div>`;

function directory(){
  const chips=[];
  for(const k of Object.keys(FLD)){
    for(const v of S.f[k]){
      chips.push(`<span class="fchip">${esc(lbl(k,v))}<button class="x" data-a="chipx" data-k="${k}" data-v="${esc(v)}" aria-label="إزالة"><i class="fa-solid fa-xmark"></i></button></span>`);
    }
  }
  if(S.f.q.trim())chips.push(`<span class="fchip">بحث: ${esc(S.f.q.trim())}<button class="x" data-a="qx" aria-label="إزالة"><i class="fa-solid fa-xmark"></i></button></span>`);
  if(chips.length>1)chips.push(`<button class="fclr" data-a="clr">مسح الكل</button>`);
  $('#fchips').innerHTML=chips.join('');
  const r=results();
  $('#inf').textContent=`${r.length} من أصل ${S.db.length}`;
  $('#qx').hidden=!S.f.q;
  $('#ls').innerHTML=r.length
    ? r.slice(0,S.lim).map(card).join('') + (r.length>S.lim?`<button class="bt g" data-a="more">عرض المزيد (${r.length-S.lim})</button>`:'')
    : empty('لا توجد نتائج مطابقة');
}

/* ═══ FILTER MODAL ═══ */
function openFilter(presetK=null,presetV=null){
  S.fp=presetK?'pick':'sections';S.fk=presetK;
  if(presetK&&presetV){
    const arr=S.f[presetK];
    if(!arr.some(x=>norm(x)===norm(presetV)))arr.push(presetV);
    S.lim=60;
  }
  renderFilter();$('#md').classList.add('on');document.body.style.overflow='hidden';
}
function renderFilter(){
  let html='';
  if(S.fp==='sections'){
    html=`<div class="fmodal-h"><h2>الفلاتر</h2><div class="sub">اختر قسمًا لتصفية النتائج</div></div>`;
    html+=SECTIONS.map(s=>{
      const arr=S.f[s.k];
      const active=arr.length>0;
      let val='';
      if(arr.length===1)val=lbl(s.k,arr[0]);
      else if(arr.length>1)val=`${arr.length} مختارة`;
      const count=facet(s.k).length;
      return `<button class="fsect${active?' on':''}" data-a="fsect" data-v="${s.k}">
        <span class="ic"><i class="fa-solid ${s.icon}"></i></span>
        <span class="name">${esc(s.label)}</span>
        ${val?`<span class="val">${esc(val)}</span>`:`<span class="num">${count}</span>`}
        <span class="chev"><i class="fa-solid fa-chevron-left"></i></span>
      </button>`;
    }).join('');
    const n=activeCount();
    html+=`<div class="ac">
      <button class="bt g" data-a="fclr"${n?'':' disabled'}>مسح الكل</button>
      <button class="bt" data-a="fdone">عرض النتائج${n?` (${n})`:''}</button>
    </div>`;
  }else{
    const sect=SECTIONS.find(s=>s.k===S.fk);
    const curSort=S.sortF[S.fk]||'count';
    html=`<button class="fback" data-a="fback"><i class="fa-solid fa-chevron-right"></i> رجوع</button>
      <div class="fmodal-h"><h2>${esc(sect.label)}</h2><div class="sub">اختيار متعدد مسموح</div></div>
      <div class="sortbar">
        <button class="sortbtn${curSort==='count'?' on':''}" data-a="fsort" data-v="count"><i class="fa-solid fa-arrow-down-wide-short"></i> الأكثر</button>
        <button class="sortbtn${curSort==='name'?' on':''}" data-a="fsort" data-v="name"><i class="fa-solid fa-arrow-down-a-z"></i> أبجدي</button>
      </div>`;
    const avail=facet(S.fk,curSort);
    const selected=S.f[S.fk];
    html+=avail.map(([v,n])=>{
      const on=selected.some(x=>norm(x)===norm(v));
      const disabled=n===0&&!on;
      return `<button class="fopt${on?' on':''}" data-a="fpick" data-v="${esc(v)}" ${disabled?'disabled':''}>
        <span class="box"><i class="fa-solid fa-check"></i></span>
        <span class="name">${esc(lbl(S.fk,v))}</span>
        <span class="n">${n}</span>
      </button>`;
    }).join('')||'<p class="em">لا توجد قيم متاحة</p>';
    if(selected.length)html+=`<button class="fopt clear" data-a="fclearsec"><span class="box" style="border-color:transparent;color:transparent"></span><span class="name">إزالة كل قيم هذا القسم (${selected.length})</span></button>`;
  }
  openOverlay(html);
}

/* ═══ EXPLORER ═══ */
const grp=(l,k)=>{const m=new Map();l.forEach(r=>{const v=r[k]||'—';m.set(v,(m.get(v)||0)+1)});return[...m].sort((a,b)=>a[0].localeCompare(b[0],'ar'))};
const matchExp=r=>!S.expQ||hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email,TL[r.type],CL[r.categorie]].join(' '),S.expQ);
function explorer(){
  const{t,d,s}=S.exp,cs=[['الرئيسية','']];if(t)cs.push([TL[t]+'ون','t']);if(d)cs.push([d,'d']);if(s)cs.push([s,'s']);
  const sortBar=`<div class="sortbar2">
    <button class="${S.expSort==='count'?'on':''}" data-a="expSort" data-v="count"><i class="fa-solid fa-arrow-down-wide-short"></i> الأكثر</button>
    <button class="${S.expSort==='name'?'on':''}" data-a="expSort" data-v="name"><i class="fa-solid fa-arrow-down-a-z"></i> أبجدي</button>
  </div>`;
  const row=(ic,n,c,a,v)=>`<button class="rw" data-a="${a}" data-v="${esc(v)}"><i class="fa-solid ${ic}"></i><span>${esc(n)}</span><em>${c}</em><i class="fa-solid fa-chevron-left"></i></button>`;
  let h='',base=S.db.filter(r=>!t||r.type===t).filter(matchExp);
  const sortGroups=(arr)=>{
    if(S.expSort==='count') return arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
    return arr.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
  };
  if(S.expQ){
    h = base.length?'<div class="ls">'+base.map(card).join('')+'</div>':empty('لا نتائج مطابقة للبحث');
  } else if(!t)h=sortGroups(['fournisseurs','experts'].map(x=>[x,S.db.filter(r=>r.type===x).length])).map(([x,c])=>row(x==='experts'?'fa-user-tie':'fa-truck-field',TL[x]+'ون',c,'xt',x)).join('');
  else if(!d)h=sortGroups(grp(base,'domaine')).map(g=>row('fa-industry',g[0],g[1],'xd',g[0])).join('');
  else if(!s)h=sortGroups(grp(base.filter(r=>r.domaine===d),'specialite')).map(g=>row('fa-screwdriver-wrench',g[0],g[1],'xs',g[0])).join('');
  else h='<div class="ls">'+base.filter(r=>r.domaine===d&&r.specialite===s).map(card).join('')+'</div>';
  $('#t-exp').innerHTML=`<div class="sr gl" style="margin-bottom:8px"><i class="fa-solid fa-magnifying-glass"></i><input id="xq" value="${esc(S.expQ)}" placeholder="بحث متطور: اسم، قطاع، تخصص، مدينة، هاتف..." aria-label="بحث سريع"><button id="xqc" ${S.expQ?'':'hidden'} aria-label="مسح"><i class="fa-solid fa-xmark"></i></button></div>${sortBar}<div class="cr">${cs.map((c,i)=>(i?'<i class="fa-solid fa-chevron-left"></i>':'')+`<button data-a="xc" data-v="${c[1]}">${esc(c[0])}</button>`).join('')}</div><div id="xl">${h||empty('لا توجد عناصر')}</div>`;
  const xq=$('#xq');
  xq.oninput=ev=>{clearTimeout(xq._t);xq._t=setTimeout(()=>{S.expQ=ev.target.value;explorer();const el=$('#xq');if(el){el.focus();el.setSelectionRange(9999,9999)}},200)};
  const xqc=$('#xqc');if(xqc)xqc.onclick=()=>{S.expQ='';explorer()};
}

/* ═══ BOOKMARKS ═══ */
function bookmarks(){const l=S.fav.map(byId).filter(Boolean);
  $('#t-fav').innerHTML=l.length?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3 class="t" style="margin:0">المفضلة (${l.length})</h3><button class="bt g" data-a="favclr">مسح الكل</button></div><div class="ls">${l.map(card).join('')}</div>`:`<div class="em gl" style="padding:50px 12px"><i class="fa-regular fa-star"></i><b>لا توجد ملفات محفوظة</b>اضغط على النجمة في أي بطاقة لحفظها</div>`}
function toggleFav(id){const i=S.fav.indexOf(id);i<0?S.fav.push(id):S.fav.splice(i,1);try{localStorage.setItem('cp-fav',JSON.stringify(S.fav))}catch{}nav();({home:dashboard,dir:directory,exp:explorer,fav:bookmarks})[S.tab]();if($('#md').classList.contains('on')&&S.cur)profile(S.cur.id)}

/* ═══ DASHBOARD ═══ */
function dashboard(){
  const c=(k,v)=>S.db.filter(r=>r[k]===v).length;
  const st=[['fa-truck-field','موردون',c('type','fournisseurs'),'type:fournisseurs'],['fa-user-tie','خبراء',c('type','experts'),'type:experts'],['fa-city','مدن',uniq('ville').length,'ville:__pick__'],['fa-industry','قطاعات',uniq('domaine').length,'dom:__pick__']];

async function makePDF(id){
  const r=byId(id);if(!r)return;
  if(!window.html2canvas||!window.jspdf){toast('مكتبة PDF غير محمّلة');return}
  setLoading(true);
  let holder=null;
  try{
    holder=document.createElement('div');
    holder.className='pdf-stage';
    holder.innerHTML=buildPdfHtml(r);
    document.body.appendChild(holder);
    await new Promise(r=>setTimeout(r,700));
    const node=holder.querySelector('#pdf-src');
    const canvas=await html2canvas(node,{scale:2,backgroundColor:'#fff',useCORS:true,logging:false});
    const img=canvas.toDataURL('image/jpeg',0.95);
    const {jsPDF}=window.jspdf;
    const ratio=canvas.height/canvas.width;
    const wmm=200,hmm=wmm*ratio;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[wmm,hmm]});
    pdf.addImage(img,'JPEG',0,0,wmm,hmm);
    pdf.save(`ConnectPro-${r.name.replace(/\s+/g,'_')}.pdf`);
    log('pdf',r.name);toast('تم توليد PDF');
  }catch(e){console.error(e);toast('تعذر توليد PDF')}
  finally{holder?.remove();setLoading(false)}
}

function mapRaw(raw){const o=[];for(const[T,tv]of Object.entries(TK))for(const[C,cv]of Object.entries(CK))toArr(raw?.[tv]?.[cv]).forEach(i=>i.name&&o.push({...i,type:T,categorie:C,id:i.id||uid(),domaine:i.domaine||'Autre',specialite:i.specialite||'Général'}));return o}
async function loadDB(){

  try{if(!S.fb)throw 0;raw=(await S.fb.ref('professionals').once('value')).val();ok=true}catch{toast('تعذر الاتصال بـ Firebase')}
  S.fbCache=mapRaw(raw);

function splitCSV(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const h=l[i];if(h==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(h===','&&!q){o.push(c);c=''}else c+=h}o.push(c);return o}
const parseCSV=(txt,type,cat)=>{const cl=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c=>cl(c[1])).map(c=>({id:sid(type,cl(c[1]),cl(c[5])),name:cl(c[1]),domaine:cl(c[2])||'Autre',specialite:cl(c[3])||'Général',ville:cl(c[4]),phone:fmtPhone(cl(c[5])),email:cl(c[6]),web:cl(c[7]),type,categorie:cat}))};
async function csvAll(){const g=async(u,t,c)=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return parseCSV(await r.text(),t,c)};
  const[e,f]=await Promise.all([g(CSV_EXPERTS,'experts','yad-amila'),g(CSV_FOURNISSEURS,'fournisseurs','services')]);const m=new Map();[...f,...e].forEach(r=>m.has(r.id)||m.set(r.id,r));return[...m.values()]}

async function csvFetch(silent=false){
  if(!S.admin||!needFb())return;
  if(S.csvBusy){if(!silent)toast('جاري الجلب...');return}
  S.csvBusy=true;
  if(!silent)setLoading(true);
  if(S.tab==='home'&&S.admin)dashboard();
  try{
    S.csvCache=await csvAll();
    S.viewSrc='csv';applySource();
    if(!silent)toast(`تم جلب ${S.csvCache.length} ملف — عاينها ثم اضغط "مزامنة"`);
    go('home');
  }catch(e){console.error(e);if(!silent)toast('فشل الجلب، تحقق من الاتصال')}
  finally{S.csvBusy=false;if(!silent)setLoading(false);if(S.tab==='home'&&S.admin)dashboard()}
}

async function csvPush(){

  if(!S.csvCache.length)return toast('لا توجد بيانات CSV — اجلبها أولاً');
  const old=S.fbCache;
  const cr=new Map(old.map(r=>[r.id,r.createdAt]));
  const vr=new Map(old.map(r=>[r.id,r.verified]));
  const owned=new Map(old.filter(r=>r.owner).map(r=>[r.id,r]));
  const oldIds=new Set(old.map(r=>r.id));
  let added=0,updated=0,kept=0;
  const now=Date.now();
  const tree={};

  S.csvCache.forEach(r=>{

  });

  if(!confirm(`📊 مزامنة CSV → Firebase:\n\n➕ ${added} جديد\n✏️ ${updated} محدّث\n🔒 ${kept} محمي (عدّله المستخدمون)\n\nمتابعة؟`))return;

}

function h53(s,seed=0){let a=0xdeadbeef^seed,b=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
const sid=(t,n,p)=>'p'+h53(t+'|'+norm(n)+'|'+fmtPhone(p));
const sha=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch{return'f'+h53(s)+h53(s,7)}};
const ident=v=>{v=String(v).trim();return v.includes('@')?v.toLowerCase():fmtPhone(v)};
const uidOf=async i=>'u_'+(await sha('cp:'+i)).slice(0,24);
const canEdit=r=>!!r&&(S.admin||(!!S.user&&S.user.profileId===r.id));
const canAdd=()=>S.admin||(!!S.user&&!S.user.profileId&&!S.user.claim);

async function findUserByPhone(rawPhone){
  if(!S.fb||!rawPhone)return null;
  const variants=phoneVariants(rawPhone);
  /* 1) جرّب uidOf لكل صيغة */
  for(const v of variants){
    const u=await uidOf(ident(v));
    const r=(await S.fb.ref('users/'+u).once('value')).val();
    if(r)return {uid:u,rec:r};
  }
  /* 2) مسح شامل */
  const all=(await S.fb.ref('users').once('value')).val()||{};
  const target=fmtPhone(rawPhone);
  for(const [uid,u] of Object.entries(all)){
    if(!u||!u.ident)continue;
    const cmp=u.ident.includes('@')?u.ident.toLowerCase():fmtPhone(u.ident);
    if(cmp===target||cmp===rawPhone)return {uid,rec:u};
  }
  return null;
}

async function doLogin(){

  finally{setLoading(false)}
}
async function agGen(uidVal){
  if(!S.admin||!needFb())return;
  setLoading(true);
  try{
    const rec=(await S.fb.ref('users/'+uidVal).once('value')).val();
    if(!rec){toast('الحساب غير موجود');return}
    const code=genCode();
    const hash=await sha('reset:'+code+':'+rec.salt);
    const expiry=Date.now()+RESET_TTL;
    await S.fb.ref('users/'+uidVal).update({resetCode:hash,resetExpiry:expiry});
    log('admin-gen',rec.name+' / '+rec.ident);
    const wa=fmtPhone(rec.ident).replace(/\D/g,'');
    const msg=`مرحباً ${rec.name}،\nرمزك السري المؤقت هو: *${code}*\n\nادخل إلى المنصة → تسجيل الدخول → ضع رقمك → ثم ضع هذا الرمز في حقل الرمز السري.\n\nصالح لمدة ساعة.`;
    openOverlay(`<h2>تم توليد الرمز</h2>
      <p class="lead">أرسل هذا الرمز إلى <b>${esc(rec.name)}</b> (${esc(rec.ident)})</p>
      <div class="code-box">
        <div class="code" id="rcode">${code}</div>
        <button class="cp" data-a="rcopy" data-v="${esc(code)}" aria-label="نسخ"><i class="fa-solid fa-copy"></i></button>
      </div>
      <div class="code-hint">ينتهي: ${esc(new Date(expiry).toLocaleString('ar-MA'))}</div>
      <div class="ac">
        <button class="bt g" data-a="cls">إغلاق</button>
        <a class="bt w" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> إرسال</a>
      </div>`);
    toast('تم التوليد');
  }catch(e){console.error(e);toast('حدث خطأ')}
  finally{setLoading(false)}
}

async function adminPanel(){if(!S.admin||!needFb())return;setLoading(true);
  try{const us=Object.entries((await S.fb.ref('users').once('value')).val()||{}),lg=Object.values((await S.fb.ref('logs').limitToLast(25).once('value')).val()||{}).reverse(),ib=(c,a,id,l,i)=>`<button class="hb" style="color:${c}" data-a="${a}" data-v="${esc(id)}" aria-label="${l}"><i class="fa-solid ${i}"></i></button>`;
    openOverlay(`<h2>المستخدمون (${us.length})</h2>${us.map(([id,u])=>`<div class="pr"><div style="flex:1"><b>${esc(u.name)}</b><small dir="ltr">${esc(u.ident)}</small>${u.profileId?'<small>مرتبط</small>':''}${u.resetCode&&u.resetExpiry>Date.now()?'<small style="color:#92400E">🔑 رمز نشط</small>':''}</div>${ib('var(--dg)','udel',id,'حذف','fa-user-slash')}</div>`).join('')||'<p class="em">لا يوجد مستخدمون</p>'}<h2 style="margin-top:14px">سجل النشاط</h2>${lg.map(l=>`<div class="pr"><div><small>${esc(new Date(l.t).toLocaleString('ar-MA'))} · ${esc(l.u)}</small>${esc(l.a)} ${esc(l.d)}</div></div>`).join('')||'<p class="em">لا نشاط</p>'}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)}
  catch(e){console.error(e);toast('تعذر التحميل')}finally{setLoading(false)}}
async function appr(id){if(!S.admin||!needFb())return;setLoading(true);
  try{const u=(await S.fb.ref('users/'+id).once('value')).val(),it=byId(u?.claim);if(!it){toast('الملف غير موجود');return}
    const p=path(it.type,it.categorie);await S.fb.ref(p).set((await fbArr(p)).map(x=>x.id===it.id?{...x,owner:id}:x));
    await S.fb.ref('users/'+id).update({profileId:it.id,claim:null});log('approve',u.name+' ← '+it.name);await loadDB();toast('تم القبول')}
  catch(e){console.error(e);toast('خطأ')}finally{setLoading(false);adminPanel()}}
async function rej(id){if(!S.admin||!needFb())return;try{await S.fb.ref('users/'+id).update({claim:null});log('reject',id);toast('تم الرفض')}catch{toast('خطأ')}adminPanel()}
async function udel(id){if(!S.admin||!needFb()||!confirm('حذف المستخدم؟'))return;try{await S.fb.ref('users/'+id).remove();log('user-del',id);toast('تم الحذف')}catch{toast('خطأ')}adminPanel()}

/* ═══ EVENTS ═══ */
const A={
  theme,adm,add:()=>canAdd()?form(null):toast('غير مسموح'),acc:account,usr:adminPanel,appr,rej,udel,
  alogin:openLogin,asignup:openSignup,doLogin,doSignup,setDurable,
  uout(){S.user=null;saveSess();adminUI();closeOverlay();toast('تم الخروج');go(S.tab)},
  findme:claimCancel,claimsearch:claimSearch,claimsend:claimSend,resetreq:resetReq,rgenfile:rgenFile,
  admingen:adminGen,agFind,agGen,
  rcopy(v){navigator.clipboard?.writeText(v).then(()=>toast('تم النسخ')).catch(()=>toast('تعذر النسخ'))},
  srcfb(){if(!S.admin)return;S.viewSrc='fb';applySource();go('home')},
  srccsv(){if(!S.admin)return;if(!S.csvCache.length){toast('اضغط "جلب من CSV" أولاً');csvFetch();return}S.viewSrc='csv';applySource();go('home')},
  csvfetch:()=>csvFetch(false),csvpush:csvPush,
  tab:v=>S.tab===v?(v==='dir'?(clearFilters(),directory()):v==='exp'?(S.exp={t:'',d:'',s:''},S.expQ='',explorer()):scrollTo({top:0,behavior:'smooth'})):go(v),
  cls:closeOverlay,open:profile,fav:toggleFav,shr:share,pdf:makePDF,
  edit:id=>{const r=byId(id);canEdit(r)?form(r):toast('غير مسموح')},
  del:delAsk,delok:delOk,save,exp:exportCSV,vrf:verifyToggle,
  login(){if($('#pw').value===ADMIN_PASS){S.admin=true;sessionStorage.setItem('cp-admin','1');adminUI();closeOverlay();
    toast('مرحباً أيها المدير');
    csvFetch(true);
    go(S.tab)}else{$('#pw').parentElement.classList.add('er');toast('كلمة المرور خاطئة')}},
  stat(v){
    const i=v.indexOf(':'),k=v.slice(0,i),x=v.slice(i+1);
    if(x==='__pick__'){openFilter(k);return}
    clearFilters();S.f[k]=[x];go('dir');
  },
  bardirect(v,el){clearFilters();S.f[el.dataset.k]=[v];go('dir')},
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=60;directory();nav()},
  clr(){clearFilters();directory();nav()},
  more(){S.lim+=60;directory()},
  qx(){S.f.q='';$('#q').value='';directory()},
  favclr(){if(confirm('مسح كل المفضلة؟')){S.fav=[];try{localStorage.removeItem('cp-fav')}catch{}nav();bookmarks()}},
  xt:v=>{S.exp={t:v,d:'',s:''};S.expQ='';explorer()},xd:v=>{S.exp.d=v;S.exp.s='';S.expQ='';explorer()},xs:v=>{S.exp.s=v;S.expQ='';explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:''}:v==='t'?{t:x.t,d:'',s:''}:v==='d'?{t:x.t,d:x.d,s:''}:x;S.expQ='';explorer()},
  expSort(v){S.expSort=v;explorer()},
  fopen:openFilter,fcls:closeOverlay,
  fclr(){clearFilters();renderFilter();directory();nav()},
  fsect(v){S.fp='pick';S.fk=v;renderFilter()},
  fback(){S.fp='sections';S.fk=null;renderFilter()},
  fsort(v){S.sortF[S.fk]=v;renderFilter()},
  fclearsec(){S.f[S.fk]=[];S.lim=60;renderFilter();directory();nav()},
  fpick(v){
    const k=S.fk,arr=S.f[k];
    const i=arr.findIndex(x=>norm(x)===norm(v));
    if(i>=0)arr.splice(i,1);else arr.push(v);
    S.lim=60;
    if(arr.length===0&&i>=0){renderFilter();directory();nav();return}
    closeOverlay();S.tab='dir';
    document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-dir'));
    nav();directory();scrollTo(0,0);
  },
  fdone(){closeOverlay();S.tab='dir';document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-dir'));nav();directory();scrollTo(0,0)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}else if(e.target.id==='md')closeOverlay()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeOverlay();
  if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v);
});
let dt;$('#q').addEventListener('input',e=>{clearTimeout(dt);dt=setTimeout(()=>{S.f.q=e.target.value;S.lim=60;directory()},200)});

/* ═══ INIT ═══ */
(async()=>{
  themeIcon();adminUI();nav();
  try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
  await loadDB();await refreshUser();adminUI();go('home');setLoading(false);
  if(S.admin)csvFetch(true);
  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(m[1]);if(r)profile(r.id)},300);
})();
})();
</script>
</body>
</html>
