<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect Pro — منصة التواصل المهني B2B</title>
<meta name="theme-color" content="#0F1B2D">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ============================================================
   B2B ENTERPRISE DESIGN SYSTEM — Connect Pro
   Navy + Gold + Slate = Corporate trust
   ============================================================ */
:root{
  /* Brand — Deep Navy (Trust, Professionalism) */
  --navy-900:#0F1B2D;
  --navy-800:#162A45;
  --navy-700:#1E3A5F;
  --navy-600:#2A4A75;

  /* Accent — Corporate Gold */
  --gold-500:#C9A961;
  --gold-600:#B8954F;
  --gold-400:#D4B87A;
  --gold-soft:rgba(201,169,97,.12);

  /* Corporate Blue (info/actions) */
  --blue-600:#1E5FA8;
  --blue-500:#2E7BC4;
  --blue-soft:rgba(46,123,196,.1);

  /* Semantic */
  --success:#0E7C5A;
  --success-soft:rgba(14,124,90,.1);
  --warning:#C77800;
  --warning-soft:rgba(199,120,0,.1);
  --danger:#B91C1C;
  --danger-soft:rgba(185,28,28,.1);

  /* Surfaces (light mode) */
  --bg:#F6F7F9;
  --bg-2:#EFF1F4;
  --surface:#FFFFFF;
  --surface-2:#FAFBFC;
  --surface-hover:#F2F5F8;

  /* Borders */
  --border:#E1E5EB;
  --border-strong:#C9D1DB;
  --border-focus:#2E7BC4;

  /* Text */
  --ink-900:#0F1B2D;
  --ink-700:#2C3E50;
  --ink-500:#5A6B7D;
  --ink-400:#8494A8;
  --ink-300:#A8B5C5;

  /* Shadows */
  --sh-xs:0 1px 2px rgba(15,27,45,.04);
  --sh-sm:0 2px 6px rgba(15,27,45,.06);
  --sh-md:0 4px 14px rgba(15,27,45,.08);
  --sh-lg:0 12px 32px rgba(15,27,45,.12);
  --sh-xl:0 24px 56px rgba(15,27,45,.16);

  /* Radius — corporate refined */
  --r-sm:6px;
  --r:8px;
  --r-md:10px;
  --r-lg:14px;
  --r-xl:18px;

  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  color-scheme:light;
}

[data-theme=dark]{
  --bg:#0A1420;
  --bg-2:#0F1B2D;
  --surface:#152337;
  --surface-2:#1A2A41;
  --surface-hover:#1E3050;

  --border:#243652;
  --border-strong:#314867;
  --border-focus:#D4B87A;

  --ink-900:#E8EDF3;
  --ink-700:#C5D0DC;
  --ink-500:#93A3B8;
  --ink-400:#6B7E96;
  --ink-300:#4A5D75;

  --gold-soft:rgba(212,184,122,.15);
  --blue-soft:rgba(46,123,196,.18);
  --success-soft:rgba(14,124,90,.18);
  --warning-soft:rgba(199,120,0,.18);
  --danger-soft:rgba(185,28,28,.18);

  --sh-xs:0 1px 2px rgba(0,0,0,.3);
  --sh-sm:0 2px 6px rgba(0,0,0,.35);
  --sh-md:0 4px 14px rgba(0,0,0,.4);
  --sh-lg:0 12px 32px rgba(0,0,0,.5);
  --sh-xl:0 24px 56px rgba(0,0,0,.6);

  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font:14px/1.55 'Inter','IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink-900);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"ss01","cv11";
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px;border-radius:4px}

/* ============ HEADER — Corporate Navbar ============ */
header{
  position:fixed;inset:0 0 auto;
  height:calc(64px + var(--st));
  padding-top:var(--st);
  z-index:30;
  background:linear-gradient(180deg,var(--navy-900) 0%,var(--navy-800) 100%);
  color:#fff;
  display:flex;align-items:center;gap:0;
  padding-inline:16px;
  border-bottom:2px solid var(--gold-500);
  box-shadow:0 2px 8px rgba(15,27,45,.25);
}
.brand{
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.lg{
  width:40px;height:40px;
  background:linear-gradient(135deg,var(--gold-500),var(--gold-600));
  color:var(--navy-900);
  display:grid;place-items:center;
  border-radius:var(--r);
  font-weight:700;font-size:16px;flex:none;
  box-shadow:0 2px 6px rgba(201,169,97,.3);
}
.lg i{font-size:17px}
.ht{
  flex:1;min-width:0;
  padding:0 16px;
  line-height:1.2;
  border-inline-start:1px solid rgba(255,255,255,.1);
  margin-inline-start:8px;
  padding-inline-start:16px;
}
.ht b{
  display:block;font-size:16px;font-weight:600;
  letter-spacing:-.2px;color:#fff;
  font-family:'IBM Plex Sans Arabic','Inter',sans-serif;
}
.ht small{
  display:block;font-size:11.5px;color:rgba(255,255,255,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px;letter-spacing:.2px;
}
.hb{
  width:40px;height:40px;
  color:rgba(255,255,255,.75);
  display:grid;place-items:center;
  font-size:15px;flex:none;
  border-radius:var(--r);
  transition:.15s;
  margin-inline-start:4px;
}
.hb:hover{background:rgba(255,255,255,.08);color:#fff}
.hb.on{
  background:var(--gold-soft);
  color:var(--gold-500);
  box-shadow:inset 0 0 0 1px rgba(201,169,97,.3);
}
#hadd{display:none}
.cadd #hadd{display:grid}

main{
  max-width:960px;margin:0 auto;
  padding:calc(80px + var(--st)) 16px calc(88px + var(--sb));
}
.tab{display:none}
.tab.on{display:block}

/* ============ NAV — Corporate Dock ============ */
nav{
  position:fixed;inset:auto 0 0;
  height:calc(64px + var(--sb));
  padding-bottom:var(--sb);
  z-index:30;
  background:var(--surface);
  border-top:1px solid var(--border);
  box-shadow:0 -2px 8px rgba(15,27,45,.06);
  display:flex;align-items:stretch;
  padding-inline:8px;
}
nav button.nv{
  flex:1;
  color:var(--ink-500);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10.5px;gap:4px;position:relative;min-width:0;
  padding:6px 2px;
  transition:.15s;
  font-weight:500;
  border-radius:var(--r-sm);
  margin:6px 2px;
}
nav button.nv:hover{background:var(--surface-hover);color:var(--ink-700)}
nav button.nv.on{
  color:var(--navy-700);
  font-weight:600;
  background:var(--gold-soft);
}
[data-theme=dark] nav button.nv.on{color:var(--gold-500);background:var(--gold-soft)}
nav button.nv.on::before{
  content:"";position:absolute;top:0;inset-inline:25%;
  height:3px;background:var(--gold-500);
  border-radius:0 0 3px 3px;
}
nav i{font-size:18px}
.nb{
  position:absolute;top:6px;inset-inline-start:calc(50% + 12px);
  background:var(--danger);color:#fff;
  border-radius:9px;
  font-size:9px;min-width:16px;height:16px;padding:0 4px;
  font-weight:700;text-align:center;line-height:16px;
  box-shadow:0 1px 3px rgba(185,28,28,.4);
}

/* ============ CARDS / SURFACES ============ */
.gl{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  box-shadow:var(--sh-xs);
}
.g4{
  display:grid;gap:12px;
  grid-template-columns:repeat(2,minmax(0,1fr));
  margin-bottom:14px;
}
@media(min-width:560px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}

.sc{
  padding:16px 10px;text-align:center;min-width:0;
  display:flex;flex-direction:column;align-items:center;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  box-shadow:var(--sh-xs);
  transition:.2s;
  position:relative;
  overflow:hidden;
}
.sc::after{
  content:"";position:absolute;inset-block:0;inset-inline-start:0;
  width:3px;background:transparent;transition:.2s;
}
.sc:hover{
  border-color:var(--gold-500);
  box-shadow:var(--sh-md);
  transform:translateY(-2px);
}
.sc:hover::after{background:var(--gold-500)}
.sc i{
  color:var(--navy-700);font-size:22px;margin-bottom:6px;
  transition:.2s;
}
[data-theme=dark] .sc i{color:var(--gold-500)}
.sc:hover i{color:var(--gold-600)}
.sc b{
  font-size:22px;line-height:1.15;font-weight:700;
  color:var(--ink-900);letter-spacing:-.5px;
  font-variant-numeric:tabular-nums;
}
.sc span{font-size:11.5px;color:var(--ink-500);margin-top:3px;font-weight:500}

h3.t{
  font-size:13px;margin:20px 0 10px;
  color:var(--ink-500);font-weight:600;
  text-transform:uppercase;letter-spacing:.6px;
  display:flex;align-items:center;gap:8px;
}
h3.t::before{
  content:"";width:3px;height:14px;
  background:var(--gold-500);
  border-radius:2px;
  display:inline-block;
}

.pn{
  padding:16px;
  margin-bottom:12px;
  border-radius:var(--r-md);
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--sh-xs);
}

.av{
  width:42px;height:42px;border-radius:var(--r);
  color:#fff;
  display:grid;place-items:center;
  font-weight:600;flex:none;
  font-size:14px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
  letter-spacing:-.3px;
}

/* ============ SEARCH — Corporate ============ */
.sr{
  display:flex;align-items:center;gap:10px;
  padding:0 14px;height:44px;
  border-radius:var(--r);
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--sh-xs);
  transition:.15s;
}
.sr:focus-within{
  border-color:var(--border-focus);
  box-shadow:0 0 0 3px var(--blue-soft);
}
.sr input{
  flex:1;min-width:0;height:100%;
  background:none;border:0;outline:0;font-size:14.5px;
  color:var(--ink-900);
}
.sr input::placeholder{color:var(--ink-400)}
.sr i{color:var(--ink-400);font-size:14px}
.sr button{
  width:30px;height:30px;color:var(--ink-500);
  border-radius:var(--r-sm);display:grid;place-items:center;
  transition:.15s;
}
.sr button:hover{background:var(--bg-2);color:var(--ink-700)}

/* ============ CHIPS ============ */
.fchips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 10px}
.fchips:empty{display:none}
.fchip{
  display:inline-flex;align-items:center;gap:6px;height:28px;
  padding:0 4px 0 10px;
  background:var(--navy-800);color:#fff;
  border-radius:14px;font-size:12px;font-weight:500;
  box-shadow:var(--sh-xs);
}
[data-theme=dark] .fchip{background:var(--navy-700)}
.fchip .x{
  width:18px;height:18px;border-radius:50%;
  background:rgba(255,255,255,.2);color:#fff;
  display:grid;place-items:center;font-size:9px;
  transition:.15s;
}
.fchip .x:hover{background:rgba(255,255,255,.4)}
.fchips .fclr{
  height:28px;padding:0 12px;border-radius:14px;
  border:1px solid var(--border-strong);
  background:var(--surface);
  color:var(--danger);font-size:12px;font-weight:600;
  transition:.15s;
}
.fchips .fclr:hover{background:var(--danger-soft);border-color:var(--danger)}
.inf{
  font-size:12.5px;color:var(--ink-500);
  margin:4px 0 10px;
  font-weight:500;
}

/* ============ CARDS LIST — Corporate ============ */
.ls{display:grid;gap:8px}
.card{
  display:flex;align-items:center;gap:12px;
  padding:14px;cursor:pointer;min-width:0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  box-shadow:var(--sh-xs);
  transition:.15s;
  position:relative;
}
.card::before{
  content:"";position:absolute;
  inset-block:0;inset-inline-start:0;
  width:0;background:var(--gold-500);
  border-radius:var(--r-md) 0 0 var(--r-md);
  transition:.2s;
}
.card:hover{
  border-color:var(--gold-500);
  box-shadow:var(--sh-md);
  transform:translateY(-1px);
}
.card:hover::before{width:3px}
.cm{flex:1;min-width:0}
.cm b{
  display:flex;align-items:center;gap:5px;
  font-size:14.5px;font-weight:600;
  color:var(--ink-900);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cm small{
  display:block;color:var(--ink-500);
  font-size:12px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
  margin-top:2px;
}
.chs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.ch{
  font-size:10.5px;padding:2px 8px;border-radius:4px;
  background:var(--blue-soft);color:var(--blue-600);
  line-height:16px;font-weight:600;
  letter-spacing:.2px;
}
[data-theme=dark] .ch{color:#7BB3ED}
.ch.o{background:var(--bg-2);color:var(--ink-500)}
.ch.v{background:var(--success-soft);color:var(--success)}
.ca{display:flex;flex:none;gap:2px}
.ca button{
  width:32px;height:32px;
  color:var(--ink-400);font-size:13px;
  border-radius:var(--r-sm);
  transition:.15s;
}
.ca button:hover{background:var(--surface-hover);color:var(--ink-700)}
.ca .dl{color:var(--danger)}
.ca .dl:hover{background:var(--danger-soft)}
.vbadge{color:var(--success);font-size:13px}
.em{
  text-align:center;padding:40px 16px;
  color:var(--ink-500);font-size:13px;
  background:var(--surface);
  border:1px dashed var(--border-strong);
  border-radius:var(--r-md);
}
.em i{font-size:36px;color:var(--ink-300);display:block;margin-bottom:10px}
.em b{display:block;color:var(--ink-700);margin-bottom:4px;font-weight:600;font-size:14px}

/* ============ BREADCRUMB ============ */
.cr{
  display:flex;flex-wrap:wrap;gap:2px;align-items:center;
  margin-bottom:10px;font-size:12.5px;
}
.cr button{
  min-height:28px;padding:0 8px;
  color:var(--blue-600);font-weight:500;
  font-size:12.5px;border-radius:var(--r-sm);
  transition:.15s;
}
[data-theme=dark] .cr button{color:#7BB3ED}
.cr button:hover{background:var(--blue-soft)}
.cr i{font-size:9px;color:var(--ink-300)}

/* ============ ROWS ============ */
.rw{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:14px 16px;margin-bottom:8px;text-align:start;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  font-size:13.5px;
  box-shadow:var(--sh-xs);
  transition:.15s;
}
.rw:hover{
  border-color:var(--gold-500);
  background:var(--surface-hover);
  transform:translateY(-1px);
  box-shadow:var(--sh-sm);
}
.rw span{
  flex:1;min-width:0;overflow-wrap:anywhere;
  font-weight:500;color:var(--ink-900);
}
.rw em{
  font-style:normal;color:var(--ink-500);
  font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums;
  background:var(--bg-2);
  padding:3px 8px;border-radius:5px;
}
.rw>i:first-child{
  color:var(--navy-700);width:22px;
  font-size:15px;text-align:center;
}
[data-theme=dark] .rw>i:first-child{color:var(--gold-500)}
.rw>i:last-child{color:var(--ink-300);font-size:11px}

/* ============ BUTTONS ============ */
.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 16px;
  border-radius:var(--r);
  background:var(--navy-800);color:#fff;
  font-weight:600;text-decoration:none;
  min-width:0;font-size:13.5px;
  transition:.15s;
  box-shadow:var(--sh-xs);
  border:1px solid transparent;
  letter-spacing:.1px;
}
.bt:hover{background:var(--navy-700);box-shadow:var(--sh-sm)}
.bt:active{transform:translateY(1px)}
.bt.g{
  background:var(--surface);color:var(--ink-700);
  border:1px solid var(--border-strong);
}
.bt.g:hover{background:var(--surface-hover);border-color:var(--ink-300)}
.bt.d{background:var(--danger);color:#fff}
.bt.d:hover{background:#991B1B}
.bt.w{background:#25D366;color:#fff}
.bt.w:hover{background:#1EBE5D}
.bt.o{background:var(--warning);color:#fff}
.bt.o:hover{background:#A86500}
.bt.gold{
  background:linear-gradient(135deg,var(--gold-500),var(--gold-600));
  color:var(--navy-900);
  box-shadow:0 2px 6px rgba(201,169,97,.3);
}
.bt.gold:hover{
  background:linear-gradient(135deg,var(--gold-400),var(--gold-500));
  box-shadow:0 4px 12px rgba(201,169,97,.4);
}
.bt:disabled{opacity:.5;cursor:not-allowed}

/* ============ MODAL ============ */
#md{
  position:fixed;inset:0;z-index:50;
  background:rgba(15,27,45,.5);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:none;place-items:center;padding:12px;overflow-y:auto;
}
#md.on{display:grid}
.mb{
  width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
  padding:24px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-xl);
  animation:sc .2s cubic-bezier(.2,.9,.4,1);
  margin:auto;
  box-shadow:var(--sh-xl);
}
@keyframes sc{
  from{transform:scale(.94) translateY(8px);opacity:0}
}
.mb h2{
  font-size:18px;text-align:start;margin-bottom:4px;
  font-weight:700;letter-spacing:-.3px;
  color:var(--ink-900);
  padding-inline-start:12px;
  border-inline-start:3px solid var(--gold-500);
}
.mb .lead{
  text-align:start;color:var(--ink-500);
  font-size:13px;margin-bottom:20px;line-height:1.5;
  padding-inline-start:15px;
}

.ac{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;margin-top:20px;
}
.ac .full{grid-column:1/-1}

.fl{display:block;margin-bottom:14px}
.fl span{
  font-size:12px;font-weight:600;display:block;
  margin-bottom:6px;color:var(--ink-700);
  letter-spacing:.1px;
}
.fl input,.fl select{
  width:100%;height:42px;
  border-radius:var(--r);
  border:1px solid var(--border-strong);
  background:var(--surface);
  padding:0 12px;font-size:14px;
  color:var(--ink-900);
  transition:.15s;
  font-family:inherit;
}
.fl input::placeholder{color:var(--ink-400)}
.fl input:focus,.fl select:focus{
  outline:none;
  border-color:var(--border-focus);
  box-shadow:0 0 0 3px var(--blue-soft);
  background:var(--surface-2);
}
.fl.er input{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}

/* ============ PROFILE CARD ============ */
.vcard{
  border-radius:var(--r-lg);
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  margin-bottom:14px;
  box-shadow:var(--sh-lg);
  position:relative;
}
.vhead{
  background:linear-gradient(135deg,var(--navy-900) 0%,var(--navy-700) 100%);
  color:#fff;
  padding:28px 20px 22px;
  text-align:center;
  position:relative;
  overflow:hidden;
  border-bottom:3px solid var(--gold-500);
}
.vhead::before{
  content:"";position:absolute;inset-inline-end:-60px;top:-60px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,169,97,.15) 0%,transparent 70%);
}
.vhead::after{
  content:"";position:absolute;inset-inline-start:-40px;bottom:-40px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(46,123,196,.2) 0%,transparent 70%);
}
.vlogo{
  width:76px;height:76px;
  border-radius:var(--r-lg);
  background:linear-gradient(135deg,var(--gold-500),var(--gold-600));
  color:var(--navy-900);
  display:grid;place-items:center;
  font-size:32px;
  margin:0 auto 14px;
  font-weight:700;
  border:3px solid rgba(255,255,255,.15);
  position:relative;z-index:1;
  box-shadow:0 6px 20px rgba(201,169,97,.35);
}
.vname{
  font-size:20px;font-weight:700;line-height:1.2;
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
  letter-spacing:-.3px;
  font-family:'IBM Plex Sans Arabic','Inter',sans-serif;
}
.vname .vbadge{color:var(--gold-400);font-size:16px}
.vsub{
  font-size:13px;color:rgba(255,255,255,.75);
  margin-top:6px;position:relative;z-index:1;
  letter-spacing:.2px;
}
.vtags{
  display:flex;gap:6px;justify-content:center;
  margin-top:12px;flex-wrap:wrap;position:relative;z-index:1;
}
.vtag{
  font-size:11px;padding:4px 10px;
  border-radius:var(--r-sm);
  background:rgba(255,255,255,.1);
  color:#fff;
  border:1px solid rgba(255,255,255,.15);
  font-weight:600;
  letter-spacing:.2px;
}
.vtag.v{
  background:var(--gold-500);
  border-color:var(--gold-500);
  color:var(--navy-900);
}
.vqr{
  position:absolute;top:14px;inset-inline-end:14px;
  width:52px;height:52px;
  background:#fff;border-radius:var(--r);
  padding:4px;z-index:5;
  display:grid;place-items:center;
  box-shadow:var(--sh-sm);
  border:1px solid rgba(255,255,255,.3);
}
.vqr img{width:100%;height:100%;border-radius:4px}
.vbody{padding:14px 20px}
.vrow{
  display:flex;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--border);
  align-items:flex-start;
}
.vrow:last-child{border-bottom:0}
.vrow .vic{
  width:32px;height:32px;
  border-radius:var(--r-sm);
  background:var(--bg-2);
  color:var(--navy-700);
  display:grid;place-items:center;flex:none;
  font-size:13px;
}
[data-theme=dark] .vrow .vic{background:var(--surface-2);color:var(--gold-500)}
.vrow .vtxt{flex:1;min-width:0}
.vrow .vk{
  font-size:10.5px;color:var(--ink-400);
  font-weight:600;margin-bottom:3px;
  text-transform:uppercase;letter-spacing:.5px;
}
.vrow .vv{
  font-size:13.5px;color:var(--ink-900);
  font-weight:500;overflow-wrap:anywhere;
}
.vrow a.vv{
  color:var(--blue-600);text-decoration:none;
}
[data-theme=dark] .vrow a.vv{color:#7BB3ED}
.vrow a.vv:hover{text-decoration:underline}

/* ============ ICON GRID ============ */
.icon-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(48px,1fr));
  gap:8px;
  padding:16px 20px 20px;
  border-top:1px solid var(--border);
  background:var(--bg-2);
}
.icon-btn{
  width:100%;aspect-ratio:1/1;min-height:48px;
  border-radius:var(--r);
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--navy-700);
  display:grid;place-items:center;
  font-size:17px;transition:.15s;
  box-shadow:var(--sh-xs);
  text-decoration:none;position:relative;
}
[data-theme=dark] .icon-btn{color:var(--gold-500)}
.icon-btn:hover{
  background:var(--surface);
  border-color:var(--gold-500);
  color:var(--gold-600);
  transform:translateY(-2px);
  box-shadow:var(--sh-md);
}
.icon-btn:active{transform:translateY(0)}
.icon-btn.wa{color:#25D366}
.icon-btn.wa:hover{border-color:#25D366;color:#25D366}
.icon-btn.pdf{color:var(--danger)}
.icon-btn.pdf:hover{border-color:var(--danger);background:var(--danger-soft)}
.icon-btn.key{color:var(--warning)}
.icon-btn.key:hover{border-color:var(--warning);background:var(--warning-soft)}
.icon-btn.vrf{color:var(--ink-400)}
.icon-btn.vrf.on{
  color:var(--success);
  background:var(--success-soft);
  border-color:var(--success);
}
.icon-btn.del{color:var(--danger)}
.icon-btn.del:hover{
  background:var(--danger-soft);
  border-color:var(--danger);
}
.icon-btn.close{
  color:var(--ink-500);
  background:var(--bg-2);
}
.icon-btn.close:hover{
  background:var(--border);
  color:var(--ink-900);
  border-color:var(--border-strong);
}

@media(hover:hover) and (pointer:fine){
  .icon-btn::after{
    content:attr(title);
    position:absolute;
    bottom:calc(100% + 8px);
    left:50%;transform:translateX(-50%) scale(.9);
    background:var(--navy-900);color:#fff;
    padding:5px 10px;border-radius:var(--r-sm);
    font-size:11px;font-weight:500;white-space:nowrap;
    opacity:0;pointer-events:none;transition:.15s;z-index:10;
    box-shadow:var(--sh-md);
    letter-spacing:.2px;
  }
  .icon-btn:hover::after{opacity:1;transform:translateX(-50%) scale(1)}
}

/* ============ FILTER MODAL ============ */
.fmodal-h{
  text-align:start;margin-bottom:16px;
  padding-inline-start:12px;
  border-inline-start:3px solid var(--gold-500);
}
.fmodal-h h2{
  font-size:17px;margin-bottom:4px;font-weight:700;
  padding:0;border:0;
  color:var(--ink-900);
}
.fmodal-h .sub{font-size:12px;color:var(--ink-500)}
.fsect{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:14px 16px;
  border-radius:var(--r);
  text-align:start;
  background:var(--surface);
  border:1px solid var(--border);
  margin-bottom:8px;
  transition:.15s;
}
.fsect:hover{
  border-color:var(--gold-500);
  background:var(--surface-hover);
  transform:translateX(-2px);
}
.fsect.on{
  background:var(--gold-soft);
  border-color:var(--gold-500);
}
.fsect .ic{
  width:34px;height:34px;border-radius:var(--r-sm);
  background:var(--bg-2);color:var(--navy-700);
  display:grid;place-items:center;flex:none;font-size:14px;
  transition:.15s;
}
[data-theme=dark] .fsect .ic{background:var(--surface-2);color:var(--gold-500)}
.fsect.on .ic{background:var(--gold-500);color:var(--navy-900)}
.fsect .name{
  flex:1;font-weight:500;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-900);font-size:14px;
}
.fsect.on .name{font-weight:600}
.fsect .val{
  font-size:12px;color:var(--gold-600);font-weight:700;
  max-width:55%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;
}
.fsect .num{
  font-size:12px;color:var(--ink-400);
  min-width:26px;text-align:center;
  font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--bg-2);
  padding:2px 8px;border-radius:10px;
}
.fsect .chev{color:var(--ink-300);font-size:11px}
.fback{
  display:flex;align-items:center;gap:6px;
  color:var(--blue-600);font-weight:600;font-size:13px;
  margin-bottom:12px;padding:8px 6px;
  border-radius:var(--r-sm);
  transition:.15s;
}
[data-theme=dark] .fback{color:#7BB3ED}
.fback:hover{background:var(--blue-soft)}
.fback i{font-size:11px}

.sortbar{display:flex;gap:8px;margin-bottom:14px}
.sortbtn{
  flex:1;height:36px;border-radius:var(--r);
  border:1px solid var(--border-strong);
  background:var(--surface);color:var(--ink-500);
  font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:.15s;
}
.sortbtn:hover{background:var(--surface-hover);color:var(--ink-700)}
.sortbtn.on{
  background:var(--navy-800);border-color:var(--navy-800);color:#fff;
}
.sortbtn i{font-size:10px}

.fopt{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:13px 16px;
  border-radius:var(--r);
  text-align:start;
  background:var(--surface);
  border:1px solid var(--border);
  margin-bottom:6px;
  transition:.15s;
}
.fopt:hover{
  border-color:var(--gold-500);
  background:var(--surface-hover);
}
.fopt.on{
  background:var(--gold-soft);
  border-color:var(--gold-500);
}
.fopt .box{
  width:20px;height:20px;border-radius:4px;flex:none;
  border:2px solid var(--border-strong);
  display:grid;place-items:center;
  color:transparent;font-size:11px;
  transition:.15s;
}
.fopt.on .box{
  border-color:var(--gold-500);
  background:var(--gold-500);
  color:var(--navy-900);
}
.fopt .name{
  flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
  color:var(--ink-900);font-size:13.5px;
  font-weight:500;
}
.fopt.on .name{font-weight:600}
.fopt .n{
  font-size:12px;color:var(--ink-400);font-weight:600;
  font-variant-numeric:tabular-nums;
  background:var(--bg-2);
  padding:2px 8px;border-radius:10px;
}
.fopt:disabled{opacity:.4;cursor:not-allowed}
.fopt.clear{border-style:dashed}
.fopt.clear .name{color:var(--danger)}

/* ============ ME CARD ============ */
.meCard{
  background:linear-gradient(135deg,var(--navy-900),var(--navy-700));
  color:#fff;
  border-radius:var(--r-md);
  padding:16px 18px;
  margin-bottom:12px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;
  box-shadow:var(--sh-md);
  transition:.2s;
  border:1px solid rgba(201,169,97,.2);
  position:relative;
  overflow:hidden;
}
.meCard::before{
  content:"";position:absolute;
  inset-inline-end:-30px;top:-30px;
  width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,169,97,.2),transparent 70%);
}
.meCard:hover{
  transform:translateY(-2px);
  box-shadow:var(--sh-lg);
}
.meCard .mav{
  width:48px;height:48px;border-radius:var(--r);
  background:linear-gradient(135deg,var(--gold-500),var(--gold-600));
  color:var(--navy-900);
  display:grid;place-items:center;
  font-size:18px;font-weight:700;flex:none;
  box-shadow:0 2px 8px rgba(201,169,97,.4);
}
.meCard .mBody{flex:1;min-width:0;position:relative;z-index:1}
.meCard .mName{
  font-weight:600;font-size:14.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px;
}
.meCard .mSub{
  font-size:11.5px;color:rgba(255,255,255,.7);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px;
}
.meCard .mTag{
  display:inline-block;font-size:10px;
  background:rgba(201,169,97,.25);
  color:var(--gold-400);
  padding:2px 8px;border-radius:6px;margin-top:4px;
  font-weight:600;
  border:1px solid rgba(201,169,97,.3);
}
.meCard .mChev{color:rgba(255,255,255,.5);font-size:14px}

/* ============ CODE BOX ============ */
.code-box{
  display:flex;align-items:center;gap:10px;padding:16px;
  background:var(--bg-2);
  border:2px dashed var(--gold-500);
  border-radius:var(--r-md);
  margin:14px 0;
}
.code-box .code{
  flex:1;
  font-family:'SF Mono','Consolas','Courier New',monospace;
  font-size:22px;font-weight:700;letter-spacing:5px;
  color:var(--gold-600);text-align:center;direction:ltr;
  user-select:all;padding:4px 0;
  text-shadow:0 1px 2px rgba(201,169,97,.3);
}
.code-box .cp{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold-500),var(--gold-600));
  color:var(--navy-900);
  display:grid;place-items:center;flex:none;font-size:15px;
  box-shadow:0 2px 8px rgba(201,169,97,.3);
  transition:.15s;
}
.code-box .cp:hover{transform:scale(1.05);box-shadow:0 4px 14px rgba(201,169,97,.4)}
.code-hint{font-size:12px;color:var(--ink-500);text-align:center;margin-top:8px}
.code-note{
  font-size:12.5px;color:var(--ink-700);
  padding:14px;
  background:var(--warning-soft);
  border-inline-start:3px solid var(--warning);
  border-radius:var(--r-sm);
  margin:14px 0;line-height:1.7;
}
.code-note b{color:var(--warning)}

/* ============ AUTH ============ */
.auth-hub{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.auth-btn{
  display:flex;align-items:center;gap:14px;
  padding:16px;
  border-radius:var(--r-md);
  background:var(--surface);
  border:1px solid var(--border);
  text-align:start;
  transition:.15s;
  box-shadow:var(--sh-xs);
}
.auth-btn:hover{
  border-color:var(--gold-500);
  transform:translateY(-1px);
  box-shadow:var(--sh-md);
}
.auth-btn.primary{
  background:linear-gradient(135deg,var(--navy-900),var(--navy-700));
  color:#fff;border-color:transparent;
  border-bottom:3px solid var(--gold-500);
}
.auth-btn.primary:hover{
  box-shadow:0 8px 24px rgba(15,27,45,.3);
}
.auth-btn .ai{
  width:44px;height:44px;border-radius:var(--r-sm);
  background:var(--bg-2);color:var(--navy-700);
  display:grid;place-items:center;font-size:18px;flex:none;
}
[data-theme=dark] .auth-btn .ai{background:var(--surface-2);color:var(--gold-500)}
.auth-btn.primary .ai{
  background:var(--gold-soft);
  color:var(--gold-500);
  border:1px solid rgba(201,169,97,.3);
}
.auth-btn .at{flex:1;min-width:0}
.auth-btn .at b{
  display:block;font-size:15px;margin-bottom:2px;font-weight:600;
}
.auth-btn .at small{font-size:12px;opacity:.7;line-height:1.3}
.auth-btn .chev{color:var(--ink-400);font-size:13px}
.auth-btn.primary .chev{color:rgba(255,255,255,.5)}

.save-cred{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  background:var(--bg-2);
  border-radius:var(--r);
  margin-bottom:14px;
  border:1px solid var(--border);
}
.save-cred input[type=checkbox]{
  width:20px;height:20px;accent-color:var(--gold-500);cursor:pointer;flex:none;
}
.save-cred span{
  font-weight:500;font-size:13px;
  color:var(--ink-700);cursor:pointer;
}

/* ============ SOURCE BAR ============ */
.srcbar{
  display:flex;gap:4px;margin-bottom:14px;padding:4px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--r-md);
}
.srcbar button{
  flex:1;height:36px;border-radius:var(--r-sm);
  font-size:12.5px;font-weight:600;
  color:var(--ink-500);
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:.15s;
}
.srcbar button:hover{color:var(--ink-700)}
.srcbar button.on{
  background:var(--surface);
  color:var(--ink-900);
  box-shadow:var(--sh-xs);
}
.srcbar button i{font-size:12px}

.sortbar2{display:flex;gap:8px;margin-bottom:14px}
.sortbar2 button{
  flex:1;height:34px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);
  background:var(--surface);
  color:var(--ink-500);
  font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:.15s;
}
.sortbar2 button:hover{background:var(--surface-hover);color:var(--ink-700)}
.sortbar2 button.on{
  background:var(--navy-800);border-color:var(--navy-800);color:#fff;
}
.sortbar2 button i{font-size:10px}

/* ============ PDF ============ */
.pdf-stage{position:fixed;left:-99999px;top:0;width:1200px;height:auto}
.pdf-card{
  width:1200px;background:#fff;color:#0F1B2D;
  font-family:'IBM Plex Sans Arabic','Inter',sans-serif;direction:rtl;
  display:flex;flex-direction:row;min-height:520px;overflow:hidden;position:relative;
}
.pdf-left{
  flex:0 0 480px;
  background:linear-gradient(135deg,#0F1B2D 0%,#1E3A5F 100%);
  color:#fff;padding:60px 50px;
  display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;position:relative;overflow:hidden;
  border-right:6px solid #C9A961;
}
.pdf-left::before{
  content:"";position:absolute;right:-120px;top:-120px;
  width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,169,97,.2),transparent 70%);
}
.pdf-left::after{
  content:"";position:absolute;left:-100px;bottom:-100px;
  width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(46,123,196,.15),transparent 70%);
}
.pdf-logo{
  width:160px;height:160px;border-radius:20px;
  background:linear-gradient(135deg,#C9A961,#B8954F);
  color:#0F1B2D;
  display:flex;align-items:center;justify-content:center;
  font-size:76px;
  border:8px solid rgba(255,255,255,.2);
  margin-bottom:24px;position:relative;z-index:2;
  box-shadow:0 20px 50px rgba(201,169,97,.3);
}
.pdf-name{font-size:34px;font-weight:700;line-height:1.2;position:relative;z-index:2;margin-top:6px}
.pdf-sub{font-size:17px;opacity:.75;margin-top:10px;position:relative;z-index:2}
.pdf-tags{
  display:flex;gap:8px;justify-content:center;
  margin-top:20px;flex-wrap:wrap;position:relative;z-index:2;
}
.pdf-tag{
  font-size:13px;padding:6px 14px;border-radius:6px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  font-weight:600;
}
.pdf-tag.v{background:#C9A961;border-color:#C9A961;color:#0F1B2D}
.pdf-right{
  flex:1;background:#F6F7F9;
  padding:50px 40px;
  display:flex;flex-direction:column;justify-content:center;gap:20px;
}
.pdf-row{
  display:flex;align-items:center;gap:18px;
  padding:12px 16px;
  background:#fff;
  border-radius:10px;
  border-left:4px solid #C9A961;
  box-shadow:0 2px 8px rgba(15,27,45,.06);
}
.pdf-row .ic{
  width:48px;height:48px;border-radius:8px;
  background:linear-gradient(135deg,#0F1B2D,#1E3A5F);
  color:#C9A961;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:20px;
}
.pdf-row .k{font-size:11px;color:#5A6B7D;font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.pdf-row .v{font-size:17px;color:#0F1B2D;font-weight:600;word-break:break-word}
.pdf-qr{
  position:absolute;bottom:28px;left:40px;
  display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5;
}
.pdf-qr img{
  width:90px;height:90px;
  border:3px solid #C9A961;
  border-radius:8px;background:#fff;padding:3px;
}
.pdf-qr small{font-size:9px;color:#5A6B7D;font-weight:600}

/* ============ TOAST ============ */
#ts{
  position:fixed;inset-inline:0;bottom:calc(80px + var(--sb));
  margin:auto;width:max-content;max-width:calc(100% - 32px);
  background:var(--navy-900);color:#fff;
  padding:12px 20px;
  border-radius:var(--r);
  z-index:80;opacity:0;pointer-events:none;
  transition:.2s;transform:translateY(12px);
  font-size:13px;font-weight:500;
  box-shadow:var(--sh-xl);
  border-inline-start:3px solid var(--gold-500);
  letter-spacing:.1px;
}
#ts.on{opacity:1;transform:none}

/* ============ LOADER ============ */
#ld{
  position:fixed;inset:0;z-index:99;
  background:linear-gradient(135deg,var(--navy-900),var(--navy-700));
  display:none;place-items:center;
}
#ld.on{display:grid}
#ld i{font-size:40px;color:var(--gold-500);animation:sp 1.2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ STATS ============ */
.stk{
  position:sticky;top:calc(64px + var(--st));z-index:5;
  background:var(--bg);padding:10px 0 6px;
}
.hz{
  height:4px;border-radius:2px;margin-bottom:16px;
  background:linear-gradient(90deg,var(--navy-900),var(--navy-700),var(--gold-500));
}
.seg{
  display:flex;height:10px;border-radius:5px;
  overflow:hidden;gap:2px;
}
.seg i{display:block;min-width:3px}
.cols{
  display:grid;gap:12px;
  grid-template-columns:minmax(0,1fr);
}
@media(min-width:640px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}

.bar2{
  position:relative;
  display:flex;justify-content:space-between;align-items:center;

/* ============================================================

function h53(s, seed = 0) {
  let a = 0xdeadbeef ^ seed, b = 0x41c6ce57 ^ seed;
  for (let i = 0, c; i < s.length; i++) {
    c = s.charCodeAt(i);
    a = Math.imul(a ^ c, 2654435761);
    b = Math.imul(b ^ c, 1597334677);
  }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return (4294967296 * (2097151 & b) + (a >>> 0)).toString(36);
}

      .map(b => b.toString(16).padStart(2, '0')).join('');

};

function genCode() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 8; i++) s += A[Math.floor(Math.random() * A.length)];
  return s;
}
async function findUserByPhone(rawPhone) {
  if (!S.fb || !rawPhone) return null;
  const raw = String(rawPhone).trim();
  for (const v of phoneVariants(raw)) {
    const u = await uidOf(ident(v));

    if (r) return { uid: u, rec: r };
  }
  const all = (await S.fb.ref('users').once('value')).val() || {};
  const target = fmtPhone(raw);
  const targetDigits = target.replace(/\D/g, '');
  for (const [uid, u] of Object.entries(all)) {
    if (!u || !u.ident) continue;
    const uPhone = fmtPhone(String(u.ident).trim());
    const uDigits = uPhone.replace(/\D/g, '');
    if (uPhone === target) return { uid, rec: u };
    if (uDigits && targetDigits && uDigits === targetDigits) return { uid, rec: u };
    if (uDigits.length >= 9 && targetDigits.length >= 9 && uDigits.slice(-9) === targetDigits.slice(-9)) return { uid, rec: u };
  }
  return null;
}
async function createAccountFor(profile) {

  const u = await uidOf(ident(phone));

  const hash = await sha(salt + tempCode);
  const rec = { name: profile.name, ident: phone, salt, hash, profileId: profile.id, createdAt: Date.now() };
  await S.fb.ref('users/' + u).set(rec);

  return { uid: u, rec, tempCode };
}

function splitCSV(l) {
  const o = [];
  let c = '', q = false;
  for (let i = 0; i < l.length; i++) {
    const h = l[i];
    if (h === '"') {
      if (q && l[i + 1] === '"') { c += '"'; i++; }
      else q = !q;
    } else if (h === ',' && !q) {
      o.push(c);
      c = '';
    } else c += h;
  }
  o.push(c);
  return o;
}
const parseCSV = (txt, type, cat) => {
  const cl = s => (s || '').replace(/^["'\s]+|["'\s]+$/g, '');
  return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c => cl(c[1])).map(c => ({
    id: sid(type, cl(c[1]), cl(c[5])),
    name: cl(c[1]),
    domaine: cl(c[2]) || 'Autre',
    specialite: cl(c[3]) || 'Général',
    ville: cl(c[4]),
    phone: fmtPhone(cl(c[5])),
    email: cl(c[6]),
    web: cl(c[7]),
    type,
    categorie: cat
  }));
};
async function csvAll() {
  const g = async (u, t, c) => {
    const r = await fetch(u);
    if (!r.ok) throw new Error(r.status);
    return parseCSV(await r.text(), t, c);
  };
  const [e, f] = await Promise.all([
    g(CSV_EXPERTS, 'experts', 'yad-amila'),
    g(CSV_FOURNISSEURS, 'fournisseurs', 'services')
  ]);
  const m = new Map();
  [...f, ...e].forEach(r => m.has(r.id) || m.set(r.id, r));
  return [...m.values()];
}
async function csvFetch(silent = false) {
  if (!S.admin || !needFb()) return;
  if (S.csvBusy) { if (!silent) toast('جاري الجلب...'); return; }
  S.csvBusy = true;
  if (!silent) setLoading(true);
  try {
    S.csvCache = await csvAll();
    S.viewSrc = 'csv';
    applySource();
    if (!silent) toast(`${S.csvCache.length} ملف`);
    go('home');
  } catch (e) {
    console.error(e);
    if (!silent) toast('فشل');
  } finally {
    S.csvBusy = false;
    if (!silent) setLoading(false);
  }
}
async function csvPush() {
  if (!S.admin || !needFb() || S.busy) return;
  if (!S.csvCache.length) return toast('اجلب CSV أولاً');
  const old = S.fbCache;
  const cr = new Map(old.map(r => [r.id, r.createdAt]));
  const vr = new Map(old.map(r => [r.id, r.verified]));
  const owned = new Map(old.filter(r => r.owner).map(r => [r.id, r]));
  const oldIds = new Set(old.map(r => r.id));
  let added = 0, updated = 0, kept = 0;
  const now = Date.now();
  const tree = {};
  const put = r => {
    const { type, categorie, ...x } = r;
    const T = TK[type], C = CK[categorie];
    tree[T] = tree[T] || {};
    (tree[T][C] = tree[T][C] || []).push(x);
  };
  S.csvCache.forEach(r => {
    if (owned.has(r.id)) { kept++; return; }
    const v = { ...r, createdAt: cr.get(r.id) || now };
    if (vr.get(r.id)) v.verified = true;
    if (oldIds.has(r.id)) updated++; else added++;
    put(v);
  });
  owned.forEach(put);
  if (!confirm(`مزامنة:\n➕ ${added} جديد\n✏️ ${updated} محدّث\n🔒 ${kept} محمي\n\nمتابعة؟`)) return;
  S.busy = true;
  setLoading(true);
  try {
    await S.fb.ref('professionals').set(tree);
    log('csv-push', `${added}+ ${updated}~`);
    await loadDB();
    S.viewSrc = 'fb';
    applySource();
    go('home');
    toast(`تم: ${added} جديد، ${updated} محدّث`);
  } catch (e) {
    console.error(e);
    toast('فشلت');
  } finally {
    S.busy = false;
    setLoading(false);
  }
}
function exportCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const h = ['id','name','domaine','specialite','ville','phone','email','web','type','categorie','verified'];
  const csv = '\ufeff' + [h.join(','), ...S.db.map(r => h.map(k => q(r[k])).join(','))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'connect-pro.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('تم التصدير');
}

   FILTERING
   ============================================================ */
function match(r, skip) {
  for (const k in FLD) {
    if (k === skip) continue;
    const arr = S.f[k];
    if (arr.length && !arr.some(v => norm(r[FLD[k]]) === norm(v))) return false;
  }
  return !S.f.q || hit([r.name, r.domaine, r.specialite, r.ville, r.phone, r.email].join(' '), S.f.q);
}
const results = () => S.db.filter(r => match(r)).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
function facet(k, sortBy = 'count') {
  const m = new Map();
  S.db.filter(r => match(r, k)).forEach(r => {
    const v = (r[FLD[k]] || '').trim();
    if (v) m.set(v, (m.get(v) || 0) + 1);
  });
  const arr = [...m];
  if (sortBy === 'count') return arr.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ar'));
  return arr.sort((a, b) => a[0].localeCompare(b[0], 'ar'));
}

const grp = (l, k) => {
  const m = new Map();
  l.forEach(r => {

    m.set(v, (m.get(v) || 0) + 1);

  return [...m].sort((a, b) => a[0].localeCompare(b[0], 'ar'));
};
const matchExp = r => !S.expQ || hit([r.name, r.domaine, r.specialite, r.ville, r.phone, r.email, TL[r.type], CL[r.categorie]].join(' '), S.expQ);
function explorer() {
  const { t, d, s } = S.exp;
  const cs = [['الرئيسية', '']];
  if (t) cs.push([TL[t] + 'ون', 't']);
  if (d) cs.push([d, 'd']);
  if (s) cs.push([s, 's']);
  const sortBar = `<div class="sortbar2">
    <button class="${S.expSort === 'count' ? 'on' : ''}" data-a="expSort" data-v="count"><i class="fa-solid fa-arrow-down-wide-short"></i> الأكثر</button>
    <button class="${S.expSort === 'name' ? 'on' : ''}" data-a="expSort" data-v="name"><i class="fa-solid fa-arrow-down-a-z"></i> أبجدي</button>
  </div>`;
  const row = (ic, n, c, a, v) => `<button class="rw" data-a="${a}" data-v="${esc(v)}"><i class="fa-solid ${ic}"></i><span>${esc(n)}</span><em>${c}</em><i class="fa-solid fa-chevron-left"></i></button>`;
  let h = '';
  const base = S.db.filter(r => !t || r.type === t).filter(matchExp);
  const sortGroups = arr => {
    if (S.expSort === 'count') return arr.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ar'));
    return arr.sort((a, b) => a[0].localeCompare(b[0], 'ar'));
  };
  if (S.expQ) {
    h = base.length ? '<div class="ls">' + base.map(card).join('') + '</div>' : empty('لا نتائج');
  } else if (!t) {
    h = sortGroups(['fournisseurs', 'experts'].map(x => [x, S.db.filter(r => r.type === x).length]))
      .map(([x, c]) => row(x === 'experts' ? 'fa-user-tie' : 'fa-truck-field', TL[x] + 'ون', c, 'xt', x))
      .join('');
  } else if (!d) {
    h = sortGroups(grp(base, 'domaine')).map(g => row('fa-industry', g[0], g[1], 'xd', g[0])).join('');
  } else if (!s) {
    h = sortGroups(grp(base.filter(r => r.domaine === d), 'specialite'))
      .map(g => row('fa-screwdriver-wrench', g[0], g[1], 'xs', g[0])).join('');
  } else {
    h = '<div class="ls">' + base.filter(r => r.domaine === d && r.specialite === s).map(card).join('') + '</div>';
  }
  $('#t-exp').innerHTML = `
    <div class="sr" style="margin-bottom:12px">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="xq" value="${esc(S.expQ)}" placeholder="بحث..." aria-label="بحث">
      <button id="xqc" ${S.expQ ? '' : 'hidden'} aria-label="مسح"><i class="fa-solid fa-xmark"></i></button>
    </div>
    ${sortBar}
    <div class="cr">${cs.map((c, i) => (i ? '<i class="fa-solid fa-chevron-left"></i>' : '') + `<button data-a="xc" data-v="${c[1]}">${esc(c[0])}</button>`).join('')}</div>
    <div id="xl">${h || empty('لا عناصر')}</div>`;
  const xq = $('#xq');
  xq.oninput = ev => {
    clearTimeout(xq._t);
    xq._t = setTimeout(() => {
      S.expQ = ev.target.value;
      explorer();
      const el = $('#xq');
      if (el) { el.focus(); el.setSelectionRange(9999, 9999); }
    }, 200);
  };
  const xqc = $('#xqc');
  if (xqc) xqc.onclick = () => { S.expQ = ''; explorer(); };
}

function info(r) {
  const lines = [];
  lines.push(`🏢 ${r.name}`);
  lines.push(SEP);
  lines.push(`🏷️ النوع: ${TL[r.type]}`);
  lines.push(`📂 التصنيف: ${CL[r.categorie]}`);
  if (shown(r.domaine)) lines.push(`🏭 القطاع: ${r.domaine}`);
  if (shown(r.specialite)) lines.push(`🛠️ التخصص: ${r.specialite}`);
  if (r.ville) lines.push(`📍 المدينة: ${r.ville}`);
  if (fmtPhone(r.phone)) lines.push(`📞 الهاتف: ${fmtPhone(r.phone)}`);
  if (r.email) lines.push(`✉️ البريد: ${r.email}`);
  if (r.web) lines.push(`🌐 الموقع: ${url(r.web)}`);
  if (r.verified) lines.push(`✅ موثّق`);
  lines.push(SEP);
  lines.push(`🔗 ${location.origin}${location.pathname}#p=${r.id}`);
  return lines.join('\n');
}
async function share(id) {
  const r = byId(id);
  if (!r) return;
  const text = info(r);
  if (navigator.share) {
    try { await navigator.share({ title: r.name, text }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast('تم النسخ'); }
  catch { toast('تعذر النسخ'); }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
}

function buildPdfHtml(r) {
  const p = fmtPhone(r.phone), w = url(r.web);
  const rows = [];
  if (shown(r.domaine)) rows.push(['fa-industry', 'القطاع', esc(r.domaine)]);
  if (shown(r.specialite)) rows.push(['fa-screwdriver-wrench', 'التخصص', esc(r.specialite)]);
  if (r.ville) rows.push(['fa-location-dot', 'المدينة', esc(r.ville)]);
  if (p) rows.push(['fa-phone', 'الهاتف', esc(p)]);
  if (r.email) rows.push(['fa-envelope', 'البريد', esc(r.email)]);
  if (w) rows.push(['fa-globe', 'الموقع', esc(r.web)]);
  const tags = `<span class="pdf-tag">${esc(TL[r.type])}</span><span class="pdf-tag">${esc(CL[r.categorie])}</span>${r.verified ? '<span class="pdf-tag v">✓ موثّق</span>' : ''}`;
  const profileUrl = `${location.origin}${location.pathname}#p=${r.id}`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(profileUrl)}&color=0F1B2D&bgcolor=FFFFFF&margin=0`;
  return `

        <div class="pdf-tags">${tags}</div>
      </div>
      <div class="pdf-right">
        ${rows.map(([ic, k, v]) => `<div class="pdf-row"><div class="ic"><i class="fa-solid ${ic}"></i></div><div><div class="k">${k}</div><div class="v">${v}</div></div></div>`).join('')}
      </div>
      <div class="pdf-qr">
        <img src="${qrUrl}" alt="QR" crossorigin="anonymous">
        <small>امسح للزيارة</small>
      </div>
    </div>`;
}
async function makePDF(id) {
  const r = byId(id);
  if (!r) return;
  if (!window.html2canvas || !window.jspdf) { toast('PDF غير متاح'); return; }
  setLoading(true);
  let holder = null;
  try {
    holder = document.createElement('div');
    holder.className = 'pdf-stage';
    holder.innerHTML = buildPdfHtml(r);
    document.body.appendChild(holder);
    await new Promise(res => setTimeout(res, 700));
    const node = holder.querySelector('#pdf-src');
    const canvas = await html2canvas(node, { scale: 2, backgroundColor: '#fff', useCORS: true, logging: false });
    const img = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const ratio = canvas.height / canvas.width;
    const wmm = 200, hmm = wmm * ratio;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [wmm, hmm] });
    pdf.addImage(img, 'JPEG', 0, 0, wmm, hmm);
    pdf.save(`ConnectPro-${r.name.replace(/\s+/g, '_')}.pdf`);
    log('pdf', r.name);
    toast('تم توليد PDF');
  } catch (e) {
    console.error(e);
    toast('خطأ');
  } finally {
    holder?.remove();
    setLoading(false);
  }
}

async function save() {
  const g = i => $('#' + i).value.trim();
  document.querySelectorAll('.fl.er').forEach(e => e.classList.remove('er'));
  const bad = (i, m) => { $('#w_' + i).classList.add('er'); toast(m); return false; };
  let ok = true;
  if (!g('f_n')) ok = bad('f_n', 'الاسم مطلوب');
  if (g('f_m') && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g('f_m'))) ok = bad('f_m', 'بريد غير صالح');
  if (g('f_w') && !url(g('f_w'))) ok = bad('f_w', 'رابط غير صالح');
  if (g('f_p') && !validPhone(g('f_p'))) ok = bad('f_p', 'هاتف غير صالح');
  if (!ok || !needFb()) return;
  const t = g('f_t'), c = g('f_c'), old = S.cur;
  if (old ? !canEdit(old) : !canAdd()) return toast('غير مسموح');
  const vEl = $('#f_v');
  const it = {
    id: old?.id || uid(),
    name: g('f_n'),
    domaine: g('f_d') || 'Autre',
    specialite: g('f_s') || 'Général',
    ville: g('f_v_ville'),
    phone: fmtPhone(g('f_p')),
    email: g('f_m'),
    web: g('f_w'),
    createdAt: old?.createdAt || Date.now()
  };
  if (S.admin && vEl) it.verified = !!vEl.checked;
  else if (old?.verified) it.verified = true;
  const ow = old ? old.owner : (S.admin ? '' : S.user.id);
  if (ow) it.owner = ow;
  setLoading(true);
  try {
    if (old && (old.type !== t || old.categorie !== c)) {
      const op = path(old.type, old.categorie);
      await S.fb.ref(op).set((await fbArr(op)).filter(x => x.id !== old.id));
    }
    const np = path(t, c);
    const a = await fbArr(np);
    const i = a.findIndex(x => x.id === it.id);
    if (i >= 0) a[i] = it; else a.push(it);
    await S.fb.ref(np).set(a);
    if (!old && !S.admin) {
      S.user.profileId = it.id;
      await S.fb.ref('users/' + S.user.id + '/profileId').set(it.id);
    }
    log(old ? 'edit' : 'add', it.name);
    await loadDB();
    adminUI();
    closeOverlay();
    go(S.tab);
    toast(old ? 'تم التعديل' : 'تمت الإضافة');
  } catch (e) {
    console.error(e);
    toast('خطأ');
  } finally {
    setLoading(false);
  }
}

async function doLogin() {
  if (!needFb()) return;
  const rawPhone = $('#li_i').value.trim(), p = $('#li_p').value;
  if (!rawPhone || !p) return toast('أدخل البيانات');
  setLoading(true);
  try {
    const found = await findUserByPhone(rawPhone);
    if (!found) { toast('لا يوجد حساب'); return; }
    const { uid: u, rec: r } = found;
    const okPass = await sha(r.salt + p);
    const okReset = r.resetCode && r.resetExpiry > Date.now() && r.resetCode === await sha('reset:' + p + ':' + r.salt);
    if (r.hash !== okPass && !okReset) { toast('الرمز غير صحيح'); return; }
    const saveCreds = $('#li_save')?.checked;
    try {
      localStorage.setItem('cp-lastphone', fmtPhone(r.ident));
      if (saveCreds) {
        localStorage.setItem('cp-saved-phone', fmtPhone(r.ident));
        localStorage.setItem('cp-saved-pass', p);
      } else {
        localStorage.removeItem('cp-saved-phone');
        localStorage.removeItem('cp-saved-pass');
      }
    } catch {}
    if (okReset) {
      S.tmpUid = u;
      S.tmpRec = r;
      openOverlay(`<h2>تعيين رمز دائم</h2><p class="lead">الرمز المؤقت صحيح. اختر رمزًا دائمًا.</p>
        ${field('np', 'الرمز الجديد (6+)', 'password', 'autocomplete="new-password" placeholder="••••••••"')}

      return;
    }
    if (S.admin) {
      S.admin = false;
      sessionStorage.removeItem('cp-admin');
      S.viewSrc = 'fb';
      applySource();
    }
    S.user = { id: u, name: r.name, ident: r.ident, profileId: r.profileId || '', claim: r.claim || '' };
    saveSess();
    adminUI();
    log('login', '');
    closeOverlay();
    toast('مرحباً ' + r.name);
    go(S.tab);
  } catch (e) {
    console.error(e);
    toast('خطأ');
  } finally {
    setLoading(false);
  }
}

async function doSignup() {
  if (!needFb()) return;
  const n = $('#su_n').value.trim(), i = ident($('#su_i').value), p = $('#su_p').value;
  const t = $('#su_t').value, c = $('#su_c').value;
  const d = $('#su_d').value.trim() || 'Autre';
  const sp = $('#su_s').value.trim() || 'Général';
  const v = $('#su_v').value.trim();
  const m = $('#su_m').value.trim(), w = $('#su_w').value.trim();
  if (!n) return toast('اسم الشركة مطلوب');
  if (!validPhone(i) && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(i)) return toast('بيانات غير صالحة');
  if (p.length < 6) return toast('الرمز قصير');
  setLoading(true);
  try {
    const exists = await findUserByPhone(i);
    if (exists) { toast('الحساب موجود'); return; }
    const u = await uidOf(i);
    const salt = uid();
    const rec = { name: n, ident: fmtPhone(i), salt, hash: await sha(salt + p), createdAt: Date.now() };
    await S.fb.ref('users/' + u).set(rec);
    const existing = findMatch(i);
    let profileId = '';
    if (existing) {
      const pp = path(existing.type, existing.categorie);
      await S.fb.ref(pp).set((await fbArr(pp)).map(x => x.id === existing.id ? { ...x, owner: u } : x));
      profileId = existing.id;
    } else {
      const item = {
        id: uid(), name: n, type: t, categorie: c,
        domaine: d, specialite: sp, ville: v,
        phone: fmtPhone(i), email: m, web: w,
        owner: u, createdAt: Date.now()
      };
      const pp = path(t, c);
      const arr = await fbArr(pp);
      arr.push(item);
      await S.fb.ref(pp).set(arr);
      profileId = item.id;
    }
    await S.fb.ref('users/' + u + '/profileId').set(profileId);
    if (S.admin) {
      S.admin = false;
      sessionStorage.removeItem('cp-admin');
      S.viewSrc = 'fb';
      applySource();
    }
    S.user = { id: u, name: n, ident: fmtPhone(i), profileId, claim: '' };
    saveSess();
    adminUI();
    log('signup', n);
    closeOverlay();
    try { localStorage.setItem('cp-lastphone', fmtPhone(i)); } catch {}
    toast('تم إنشاء الحساب');
    go(S.tab);
  } catch (e) {
    console.error(e);
    toast('خطأ');
  } finally {
    setLoading(false);
  }
}

            <small dir="ltr" style="color:var(--ink-500);font-size:11.5px">${esc(rec.ident)}</small>
          </div>
        </div>
      </div>
      <button class="bt w full" data-a="agGen" data-v="${esc(uidVal)}"><i class="fa-solid fa-key"></i> توليد رمز</button>`;
  } catch (e) { console.error(e); toast('خطأ'); }
  finally { setLoading(false); }
}
async function agCreate(profileId) {
  if (!S.admin || !needFb()) return;
  const profile = byId(profileId);
  if (!profile) return;
  setLoading(true);
  try {
    const created = await createAccountFor(profile);
    if (!created) { toast('تعذر'); return; }
    toast('تم — جاري التوليد...');
    await agGen(created.uid);
  } catch (e) { console.error(e); toast('خطأ'); }
  finally { setLoading(false); }
}
async function agGen(uidVal) {
  if (!S.admin || !needFb()) return;
  setLoading(true);
  try {
    const rec = (await S.fb.ref('users/' + uidVal).once('value')).val();
    if (!rec) { toast('غير موجود'); return; }
    const code = genCode();
    const hash = await sha('reset:' + code + ':' + rec.salt);
    const expiry = Date.now() + RESET_TTL;
    await S.fb.ref('users/' + uidVal).update({ resetCode: hash, resetExpiry: expiry });
    log('admin-gen', rec.name);
    const wa = fmtPhone(rec.ident).replace(/\D/g, '');
    const msg = `مرحباً ${rec.name}،\nرمزك السري المؤقت: *${code}*\n\nادخل → تسجيل الدخول → رقمك → الرمز.\n\nصالح 24 ساعة.`;
    openOverlay(`<h2>تم التوليد</h2><p class="lead">أرسله إلى <b>${esc(rec.name)}</b></p>
      <div class="code-box">
        <div class="code" id="rcode">${code}</div>
        <button class="cp" data-a="rcopy" data-v="${esc(code)}"><i class="fa-solid fa-copy"></i></button>
      </div>
      <div class="code-hint"><i class="fa-regular fa-clock"></i> ينتهي: ${esc(new Date(expiry).toLocaleString('ar-MA'))}</div>
      <div class="ac">
        <button class="bt g" data-a="cls">إغلاق</button>
        <a class="bt w" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> إرسال</a>
      </div>`);
    toast('تم');
  } catch (e) { console.error(e); toast('خطأ'); }
  finally { setLoading(false); }
}

/* ============================================================
   ADMIN PANEL
   ============================================================ */
async function adminPanel() {
  if (!S.admin || !needFb()) return;
  setLoading(true);
  try {
    const [usersRaw, logsRaw, profsRaw] = await Promise.all([
      S.fb.ref('users').once('value'),
      S.fb.ref('logs').limitToLast(50).once('value'),
      S.fb.ref('professionals').once('value')
    ]);
    S.usersList = {
      users: Object.entries(usersRaw.val() || {}),
      logs: Object.values(logsRaw.val() || {}).reverse(),
      profs: mapRaw(profsRaw.val())
    };
    S.usersTab = 'with';
    S.usersQuery = '';
    renderUsersPanel();
  } catch (e) { console.error(e); toast('تعذر'); }
  finally { setLoading(false); }
}
function renderUsersPanel() {
  if (!S.usersList) return;
  const { users, logs, profs } = S.usersList;
  const userProfileIds = new Set(users.filter(([, u]) => u.profileId).map(([, u]) => u.profileId));
  const profilesNoAccount = profs.filter(p => !p.owner && !userProfileIds.has(p.id));
  const stats = `<div class="stats">
    <div class="stat"><b>${profs.length}</b><span>شركات</span></div>
    <div class="stat"><b>${users.length}</b><span>حسابات</span></div>
    <div class="stat ${profilesNoAccount.length ? 'warn' : ''}"><b>${profilesNoAccount.length}</b><span>بدون حساب</span></div>
    <div class="stat"><b>${users.filter(([, u]) => u.resetCode && u.resetExpiry > Date.now()).length}</b><span>رموز نشطة</span></div>
  </div>`;
  const toolsRow = `<div class="srcbar" style="margin-bottom:12px">
    <button data-a="csvfetch"><i class="fa-solid fa-cloud-arrow-down"></i> جلب CSV</button>
    <button data-a="exp"><i class="fa-solid fa-file-csv"></i> تصدير</button>
    <button data-a="admingen"><i class="fa-solid fa-key"></i> توليد</button>
  </div>`;
  const tabs = `<div class="srcbar" style="margin-bottom:12px">
    <button class="${S.usersTab === 'with' ? 'on' : ''}" data-a="utab" data-v="with">حسابات (${users.length})</button>
    <button class="${S.usersTab === 'no' ? 'on' : ''}" data-a="utab" data-v="no">بدون حساب (${profilesNoAccount.length})</button>
  </div>`;
  let content = '';
  if (S.usersTab === 'with') {
    const q = S.usersQuery;
    const filtered = users.filter(([, u]) => !q || hit([u.name, u.ident].join(' '), q));
    content = `<label class="fl"><input type="search" id="uq" placeholder="بحث في الحسابات..." value="${esc(q)}"></label>
      <div style="max-height:300px;overflow-y:auto">${filtered.length
        ? filtered.map(([id, u]) => `<div class="pr">
            <div style="flex:1">
              <b style="font-size:13px;color:var(--ink-900)">${esc(u.name)}</b>
              <small dir="ltr">${esc(u.ident)}</small>
              ${u.resetCode && u.resetExpiry > Date.now() ? '<small style="color:var(--warning)"><i class="fa-solid fa-key"></i> رمز نشط</small>' : ''}
            </div>
            <button class="hb" style="color:var(--navy-700);width:34px;height:34px;border-radius:var(--r-sm)" data-a="agGen" data-v="${esc(id)}" title="توليد رمز"><i class="fa-solid fa-key"></i></button>
            <button class="hb" style="color:var(--danger);width:34px;height:34px;border-radius:var(--r-sm)" data-a="udel" data-v="${esc(id)}" title="حذف"><i class="fa-solid fa-user-slash"></i></button>
          </div>`).join('')
        : '<p class="em">لا نتائج</p>'}</div>`;
  } else {
    content = `<div style="max-height:340px;overflow-y:auto">${profilesNoAccount.length
      ? profilesNoAccount.map(p => `<div class="pr">
          <div style="flex:1">
            <b style="font-size:13px;color:var(--ink-900)">${esc(p.name)}</b>
            <small dir="ltr">${esc(fmtPhone(p.phone) || '—')}</small>
            <small>${esc([shown(p.domaine), p.ville].filter(Boolean).join(' · '))}</small>
          </div>
          <button class="bt o" style="min-height:32px;padding:0 10px;font-size:11px" data-a="agCreate" data-v="${esc(p.id)}"><i class="fa-solid fa-user-plus"></i> إنشاء + رمز</button>
        </div>`).join('')
      : '<p class="em"><i class="fa-solid fa-circle-check" style="color:var(--success)"></i><br>كل الشركات مرتبطة ✓</p>'}</div>`;
  }
  const logColor = { add: 'add', delete: 'del', edit: 'edit', 'csv-push': 'sync', 'reset-gen': 'key', 'admin-gen': 'key', signup: 'add', login: 'login', 'pass-change': 'edit', 'account-auto': 'add' };
  const logsHtml = logs.slice(0, 15).map(l => {
    const cls = logColor[l.a] || '';
    return `<div class="log-row"><span class="lg-time">${esc(new Date(l.t).toLocaleString('ar-MA'))}</span><span class="lg-act ${cls}">${esc(l.a)}</span><span style="flex:1">${esc(l.d)} · ${esc(l.u)}</span></div>`;
  }).join('') || '<p class="em">لا نشاط</p>';
  openOverlay(`<h2>لوحة التحكم الإدارية</h2>${toolsRow}${stats}${tabs}${content}
    <h3 class="t" style="margin-top:16px">سجل النشاط الأخير</h3>
    <div style="max-height:220px;overflow-y:auto">${logsHtml}</div>
    <div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
  const uq = $('#uq');
  if (uq) uq.oninput = e => {
    clearTimeout(uq._t);
    uq._t = setTimeout(() => {
      S.usersQuery = e.target.value;
      renderUsersPanel();
      const el = $('#uq');
      if (el) { el.focus(); el.setSelectionRange(9999, 9999); }
    }, 150);
  };
}
async function udel(id) {
  if (!S.admin || !needFb() || !confirm('حذف المستخدم؟')) return;
  try {
    await S.fb.ref('users/' + id).remove();
    log('user-del', id);
    toast('تم');
    adminPanel();
  } catch { toast('خطأ'); }
}

/* ============================================================
   EVENTS
   ============================================================ */
const A = {
  theme, adm,
  add: () => canAdd() ? form(null) : toast('غير مسموح'),
  acc: account, usr: adminPanel, udel, udelme: deleteMyAccount,
  alogin: openLogin, asignup: openSignup, doLogin, doSignup, setDurable,
  forgotopen: forgotOpen, fqFind,
  changepass: changePassword, doChangePass,
  uout() {
    S.user = null;
    saveSess();
    try { localStorage.removeItem('cp-saved-pass'); localStorage.removeItem('cp-saved-phone'); } catch {}
    adminUI();
    closeOverlay();
    toast('تم تسجيل الخروج');
    go(S.tab);
  },
  findme: claimCancel, claimsearch: claimSearch, claimsend: claimSend,
  resetreq: resetReq, rgenfile: rgenFile,
  admingen: adminGen, agFind, agGen, agCreate,
  utab(v) { S.usersTab = v; S.usersQuery = ''; renderUsersPanel(); },
  copylink(v) { navigator.clipboard?.writeText(v).then(() => toast('تم نسخ الرابط')).catch(() => toast('تعذر')); },
  rcopy(v) { navigator.clipboard?.writeText(v).then(() => toast('تم النسخ')).catch(() => toast('تعذر')); },
  srcfb() { if (!S.admin) return; S.viewSrc = 'fb'; applySource(); go('home'); },
  srccsv() { if (!S.admin) return; if (!S.csvCache.length) { toast('اجلب CSV أولاً'); csvFetch(); return; } S.viewSrc = 'csv'; applySource(); go('home'); },
  csvfetch: () => csvFetch(false), csvpush: csvPush,
  tab: v => S.tab === v
    ? (v === 'dir' ? (clearFilters(), directory())
      : v === 'exp' ? (S.exp = { t: '', d: '', s: '' }, S.expQ = '', explorer())
      : scrollTo({ top: 0, behavior: 'smooth' }))
    : go(v),
  cls: closeOverlay, open: profile, shr: share, pdf: makePDF,
  edit: id => { const r = byId(id); canEdit(r) ? form(r) : toast('غير مسموح'); },
  del: delAsk, delok: delOk, save, exp: exportCSV, vrf: verifyToggle,
  login() {
    const pw = $('#pw').value;
    if (pw === ADMIN_PASS) {
      const save = $('#pw_save')?.checked;
      if (save) localStorage.setItem('cp-admin-pw', pw);
      else localStorage.removeItem('cp-admin-pw');
      S.user = null;
      saveSess();
      try { localStorage.removeItem('cp-saved-pass'); localStorage.removeItem('cp-saved-phone'); } catch {}
      S.admin = true;
      sessionStorage.setItem('cp-admin', '1');
      adminUI();
      closeOverlay();
      toast('مرحباً (وضع المدير)');
      csvFetch(true);
      go(S.tab);
    } else {
      $('#pw').parentElement.classList.add('er');
      toast('كلمة المرور خاطئة');
    }
  },
  stat(v) {
    const i = v.indexOf(':'), k = v.slice(0, i), x = v.slice(i + 1);
    const pickMatch = v.match(/^pick:(.+)$/);
    if (pickMatch) { openFilter(pickMatch[1]); return; }
    clearFilters();
    S.f[k] = [x];
    go('dir');
  },
  bardirect(v, el) {
    const filterKey = el.dataset.k;
    clearFilters();
    S.f[filterKey] = [v];
    go('dir');
  },
  chipx(v, el) { const k = el.dataset.k; S.f[k] = S.f[k].filter(x => norm(x) !== norm(el.dataset.v)); S.lim = 60; directory(); nav(); },
  clr() { clearFilters(); directory(); nav(); },
  more() { S.lim += 60; directory(); },
  qx() { S.f.q = ''; $('#q').value = ''; directory(); },
  favclr() { if (confirm('مسح كل المفضلة؟')) { S.fav = []; try { localStorage.removeItem('cp-fav'); } catch {} nav(); } },
  xt: v => { S.exp = { t: v, d: '', s: '' }; S.expQ = ''; explorer(); },
  xd: v => { S.exp.d = v; S.exp.s = ''; S.expQ = ''; explorer(); },
  xs: v => { S.exp.s = v; S.expQ = ''; explorer(); },
  xc(v) {
    const x = S.exp;
    S.exp = v === '' ? { t: '', d: '', s: '' }
      : v === 't' ? { t: x.t, d: '', s: '' }
      : v === 'd' ? { t: x.t, d: x.d, s: '' }
      : x;
    S.expQ = '';
    explorer();
  },
  expSort(v) { S.expSort = v; explorer(); },
  fopen: openFilter, fcls: closeOverlay,
  fclr() { clearFilters(); renderFilter(); directory(); nav(); },
  fsect(v) { S.fp = 'pick'; S.fk = v; renderFilter(); },
  fback() { S.fp = 'sections'; S.fk = null; renderFilter(); },
  fsort(v) { S.sortF[S.fk] = v; renderFilter(); },
  fclearsec() { S.f[S.fk] = []; S.lim = 60; renderFilter(); directory(); nav(); },
  fpick(v) {
    const k = S.fk, arr = S.f[k];
    const i = arr.findIndex(x => norm(x) === norm(v));
    if (i >= 0) arr.splice(i, 1);
    else arr.push(v);
    S.lim = 60;
    if (arr.length === 0 && i >= 0) { renderFilter(); directory(); nav(); return; }
    closeOverlay();
    S.tab = 'dir';
    document.querySelectorAll('.tab').forEach(e => e.classList.toggle('on', e.id === 't-dir'));
    nav();
    directory();
    scrollTo(0, 0);
  },
  fdone() {
    closeOverlay();
    S.tab = 'dir';
    document.querySelectorAll('.tab').forEach(e => e.classList.toggle('on', e.id === 't-dir'));
    nav();
    directory();
    scrollTo(0, 0);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) {
    e.stopPropagation();
    A[el.dataset.a](el.dataset.v, el);
  } else if (e.target.id === 'md') closeOverlay();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeOverlay();
  if (e.key === 'Enter' && e.target.classList?.contains('card')) A.open(e.target.dataset.v);
});
let dt;
$('#q').addEventListener('input', e => {
  clearTimeout(dt);
  dt = setTimeout(() => { S.f.q = e.target.value; S.lim = 60; directory(); }, 200);
});

/* ============================================================
   INIT
   ============================================================ */
(async () => {
  themeIcon();
  adminUI();
  nav();
  try {
    if (window.firebase) {
      firebase.initializeApp(FBC);
      S.fb = firebase.database();
    }
  } catch (e) { console.warn(e); }
  await loadDB();
  await refreshUser();
  adminUI();
  go('home');
  setLoading(false);
  if (S.admin) csvFetch(true);
  const m = location.hash.match(/^#p=(.+)$/);
  if (m) setTimeout(() => { const r = byId(m[1]); if (r) profile(r.id); }, 300);
})();

})();
</script>
</body>
</html>
