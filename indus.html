<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RÉSEAU INDUSTRIEL — Maroc</title>
<meta name="theme-color" content="#0B1220">
<meta name="description" content="نربط الموردين والشركات في مكان واحد">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  /* Modern palette — slate + emerald + amber accents */
  --ink-950:#0A0F1A;--ink-900:#0F172A;--ink-800:#1E293B;--ink-700:#334155;--ink-600:#475569;--ink-500:#64748B;--ink-400:#94A3B8;--ink-300:#CBD5E1;--ink-200:#E2E8F0;--ink-100:#F1F5F9;--ink-50:#F8FAFC;
  --accent:#10B981;--accent-dark:#059669;--accent-light:#34D399;--accent-soft:rgba(16,185,129,.12);
  --amber:#F59E0B;--amber-dark:#D97706;--amber-soft:rgba(245,158,11,.14);
  --rose:#F43F5E;--rose-dark:#E11D48;--rose-soft:rgba(244,63,94,.12);
  --violet:#8B5CF6;--violet-soft:rgba(139,92,246,.12);
  --sky:#0EA5E9;--sky-soft:rgba(14,165,233,.12);
  --wa:#25D366;--fb:#1877F2;

  --bg:#F4F6FA;--bg-2:#EDF1F7;
  --surface:#FFFFFF;--surface-2:#F8FAFC;--surface-hover:#F1F5F9;
  --border:#E2E8F0;--border-strong:#CBD5E1;
  --text:#0F172A;--text-2:#475569;--text-3:#94A3B8;

  --radius:14px;--radius-sm:10px;--radius-lg:20px;--radius-xl:26px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
  --shadow:0 4px 12px rgba(15,23,42,.06),0 2px 4px rgba(15,23,42,.04);
  --shadow-md:0 12px 24px -6px rgba(15,23,42,.10),0 4px 8px -4px rgba(15,23,42,.06);
  --shadow-lg:0 24px 48px -12px rgba(15,23,42,.16);
  --shadow-glow:0 0 0 4px rgba(16,185,129,.12);

  --fh:'Space Grotesk','IBM Plex Sans Arabic',sans-serif;
  --ff:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;

  --header-h:70px;--botnav-h:68px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0A0F1A;--bg-2:#0F172A;
  --surface:#111C30;--surface-2:#162238;--surface-hover:#1E2C46;
  --border:#233247;--border-strong:#334155;
  --text:#E2E8F0;--text-2:#94A3B8;--text-3:#64748B;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 4px 12px rgba(0,0,0,.35);--shadow-md:0 12px 24px -6px rgba(0,0,0,.45);--shadow-lg:0 24px 48px -12px rgba(0,0,0,.6);
  --ink-50:#0A0F1A;--ink-100:#0F172A;--ink-200:#1E293B;--ink-300:#334155;--ink-400:#475569;--ink-500:#64748B;--ink-600:#94A3B8;--ink-700:#CBD5E1;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font:14px/1.55 var(--ff);background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 0% 0%,rgba(16,185,129,.06),transparent 40%),
    radial-gradient(circle at 100% 0%,rgba(139,92,246,.06),transparent 40%);
  background-attachment:fixed;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ============ HEADER ============ */
header{
  position:fixed;inset:0 0 auto;z-index:30;padding-top:var(--st);
  background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--border);
}
.hin{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{
  width:44px;height:44px;display:grid;place-items:center;font-size:19px;flex:none;border-radius:12px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--sky) 100%);
  color:#fff;box-shadow:0 6px 16px -4px rgba(16,185,129,.5),inset 0 1px 0 rgba(255,255,255,.25);
}
.brand-text{min-width:0}
.brand b{
  display:block;font:700 19px/1.1 var(--fh);letter-spacing:-.02em;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand small{
  display:block;color:var(--text-3);font:500 11.5px/1.3 var(--ff);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;
}
.acts{display:flex;align-items:center;gap:6px;flex:none}
.ib{
  width:42px;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);
  display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);
  transition:.18s cubic-bezier(.2,.9,.3,1);position:relative;flex-shrink:0;padding:0;
}
.ib i{font-size:15px;line-height:1}
.ib:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}
.ib:active{transform:translateY(0) scale(.97)}
.ib.pri{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);border-color:transparent;color:#fff;box-shadow:0 4px 12px -2px rgba(16,185,129,.45)}
.ib.pri:hover{filter:brightness(1.05);transform:translateY(-1px)}
.ib.grn{background:var(--sky-soft);border-color:rgba(14,165,233,.3);color:var(--sky)}
.ib.grn:hover{background:var(--sky);color:#fff;border-color:transparent}
.ib.sync-btn.dirty{background:var(--rose-soft);border-color:rgba(244,63,94,.3);color:var(--rose);animation:syncPulse 2s ease-in-out infinite}
.ib.sync-btn.dirty::after{content:"";position:absolute;top:6px;inset-inline-end:6px;width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 2px var(--surface)}
@keyframes syncPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,.4)}50%{box-shadow:0 0 0 8px rgba(244,63,94,0)}}
.ib.online-ind{background:var(--accent-soft);border-color:rgba(16,185,129,.25);color:var(--accent);gap:7px;padding:0 12px;width:auto;cursor:default}
.ib.online-ind:hover{transform:none;background:var(--accent-soft)}
.ib.online-ind .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:livePulse 2s infinite;flex:none}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}50%{box-shadow:0 0 0 6px rgba(16,185,129,0)}}
.ib.online-ind .num{font:700 14px var(--fh);font-variant-numeric:tabular-nums}

main{max-width:1120px;margin:0 auto;padding:calc(var(--header-h) + 20px + var(--st)) 14px calc(var(--botnav-h) + 24px + var(--sb))}
.tab{display:none}
.tab.on{display:block;animation:fadeUp .25s cubic-bezier(.2,.9,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}

/* ============ SECTION TITLES ============ */
h3.t{
  font:700 17px/1.3 var(--fh);letter-spacing:-.01em;margin:26px 0 14px;display:flex;align-items:center;gap:10px;
}
h3.t::before{content:"";width:4px;height:20px;border-radius:4px;background:linear-gradient(180deg,var(--accent),var(--sky));flex:none}
h3.t .h3-badge{
  font:700 11px var(--fh);background:var(--accent-soft);color:var(--accent-dark);
  padding:3px 10px;border-radius:20px;margin-inline-start:auto;
}

/* ============ HERO ============ */
.hero{
  padding:28px 24px;border-radius:var(--radius-lg);position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--ink-900) 0%,var(--ink-800) 100%);
  color:#fff;box-shadow:var(--shadow-lg);max-width:720px;margin:0 auto;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 90% -10%,rgba(16,185,129,.35),transparent 45%),
    radial-gradient(circle at 10% 110%,rgba(139,92,246,.3),transparent 45%);
  pointer-events:none;
}
.hero::after{
  content:"\f013";font-family:"Font Awesome 6 Free";font-weight:900;
  position:absolute;inset-inline-end:-30px;bottom:-40px;font-size:180px;color:rgba(255,255,255,.04);
  line-height:1;pointer-events:none;animation:spin 60s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h2{font:700 26px/1.2 var(--fh);letter-spacing:-.02em;position:relative;z-index:1;margin-bottom:8px}
.hero p{color:rgba(255,255,255,.75);font-size:13.5px;max-width:500px;position:relative;z-index:1;line-height:1.6}

/* ============ STATS ============ */
.g4{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-top:12px}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 12px;text-align:center;box-shadow:var(--shadow-sm);transition:.2s;
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;overflow:hidden;
}
.sc::before{
  content:"";position:absolute;top:0;inset-inline:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--sky));opacity:0;transition:.2s;
}
.sc:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--accent)}
.sc:hover::before{opacity:1}
.sc i{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent-soft),var(--sky-soft));
  color:var(--accent-dark);font-size:16px;
}
.sc b{font:700 24px/1 var(--fh);font-variant-numeric:tabular-nums;color:var(--text)}
.sc span{color:var(--text-2);font:500 12px var(--ff)}
.seg{display:flex;height:10px;gap:2px;border-radius:6px;overflow:hidden;background:var(--surface-2);padding:2px;margin-top:6px}
.seg i{display:block;min-width:3px;border-radius:4px;transition:.3s}
.cols{display:grid;gap:12px;grid-template-columns:1fr;margin-top:10px}
@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.pn{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow-sm);
}
.pn>b{font:700 12.5px var(--ff);color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:12px}
.sl{max-height:280px;overflow-y:auto;padding-inline-end:2px}
.sl::-webkit-scrollbar{width:6px}
.sl::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
.bar{
  position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;
  width:100%;min-height:38px;padding:0 12px;border-radius:10px;overflow:hidden;margin-top:4px;
  background:var(--surface-2);font-size:13px;font-weight:600;transition:.15s;border:1px solid transparent;
}
.bar:hover{background:var(--surface-hover);border-color:var(--accent)}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,var(--accent-soft),var(--sky-soft))}
.bar span,.bar b{position:relative}
.bar b{
  font:700 12px var(--fh);background:linear-gradient(135deg,var(--ink-800),var(--ink-900));color:#fff;
  padding:2px 10px;min-width:26px;text-align:center;border-radius:20px;font-variant-numeric:tabular-nums;
}

/* ============ SEARCH ============ */
.sr{
  display:flex;align-items:center;gap:8px;height:52px;padding:0 6px 0 16px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);transition:.2s;
}
.sr:focus-within{border-color:var(--accent);box-shadow:var(--shadow-glow)}
.sr>i{color:var(--text-3);font-size:14px;flex:none}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:14.5px}
.sr input::placeholder{color:var(--text-3)}
.sr #qx,.sr #xqc{width:34px;height:34px;border-radius:10px;color:var(--text-3);display:grid;place-items:center;flex:none;transition:.15s}
.sr #qx:hover,.sr #xqc:hover{background:var(--surface-2);color:var(--text)}
.sr .fbtn{
  width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;display:grid;place-items:center;flex:none;position:relative;transition:.15s;border:0;
  box-shadow:0 4px 10px -2px rgba(16,185,129,.4);
}
.sr .fbtn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.sr .fbtn.has-filters{background:linear-gradient(135deg,var(--rose),var(--rose-dark));box-shadow:0 4px 10px -2px rgba(244,63,94,.4)}
.sr .fbtn .bub{
  position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;padding:0 5px;
  border-radius:50%;background:var(--amber);color:var(--ink-900);font:700 11px var(--fh);
  display:grid;place-items:center;border:2px solid var(--surface);
}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 12px;border-radius:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;font-weight:600;font-size:12px;
  box-shadow:0 2px 6px -1px rgba(16,185,129,.3);
}
.chip button{width:22px;height:22px;border-radius:50%;color:inherit;font-size:9px;display:grid;place-items:center;background:rgba(255,255,255,.2);transition:.15s}
.chip button:hover{background:rgba(255,255,255,.35)}
.inf{color:var(--text-2);font-size:12.5px;margin:14px 4px 10px;font-weight:600}

/* ============ CARDS ============ */
.ls{display:grid;gap:10px}
@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}
.card{
  display:flex;align-items:flex-start;gap:12px;padding:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);cursor:pointer;transition:.2s cubic-bezier(.2,.9,.3,1);
  min-width:0;position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--accent),var(--sky));opacity:0;transition:.2s;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--accent)}
.card:hover::before{opacity:1}
.card.is-fav{border-color:rgba(245,158,11,.4);background:linear-gradient(135deg,var(--amber-soft) 0%,var(--surface) 60%)}
.card.is-fav::before{background:linear-gradient(180deg,var(--amber),var(--amber-dark));opacity:1}
.card.pinned{order:-1}
.av{
  width:52px;height:52px;margin-inline-start:4px;border-radius:14px;color:#fff;
  display:grid;place-items:center;font:700 18px var(--fh);flex:none;
  box-shadow:0 6px 14px -6px rgba(15,23,42,.4),inset 0 1px 0 rgba(255,255,255,.2);
}
.cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cm .title{
  display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);
}
.cm .title .vb{color:var(--sky);font-size:13px;flex:none}
.cm .meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);min-width:0;font-weight:500}
.cm .meta i{color:var(--accent);font-size:11px;flex:none;width:14px;text-align:center}
.cm .meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cm .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tg{
  font:600 10.5px var(--ff);padding:3px 9px;border-radius:20px;
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);
}
.tg.a{background:var(--accent-soft);color:var(--accent-dark);border-color:rgba(16,185,129,.25)}
.tg.v{background:var(--sky-soft);color:var(--sky);border-color:rgba(14,165,233,.25)}
.ca{display:flex;flex-direction:column;gap:4px;flex:none}
.ca button,.ca a{
  width:34px;height:34px;border-radius:10px;color:var(--text-3);font-size:13px;
  display:grid;place-items:center;transition:.15s;background:var(--surface-2);border:1px solid var(--border);
}
.ca button:hover,.ca a:hover{background:var(--surface-hover);color:var(--text);transform:scale(1.05)}
.ca .fv.on{color:#fff;background:linear-gradient(135deg,var(--amber),var(--amber-dark));border-color:transparent;box-shadow:0 3px 8px -2px rgba(245,158,11,.4)}
.ca .wa{color:var(--wa)}
.ca .wa:hover{background:var(--wa);color:#fff;border-color:transparent}
.ca .pdf{color:var(--rose)}
.ca .pdf:hover{background:var(--rose);color:#fff;border-color:transparent}

/* ============ COMPACT NEW MEMBER CARD ============ */
.ls-compact{display:flex;flex-direction:column;gap:8px}
.member-chip{
  display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);cursor:pointer;transition:.18s;
  position:relative;overflow:hidden;
}
.member-chip::before{
  content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--violet),var(--sky));
}
.member-chip:hover{transform:translateX(-2px);box-shadow:var(--shadow);border-color:var(--violet)}
.member-chip .av{width:40px;height:40px;font-size:15px;margin:0;border-radius:10px}
.member-chip .body{flex:1;min-width:0}
.member-chip .body b{display:block;font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-chip .body small{display:block;font-size:12px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-chip .go{
  width:32px;height:32px;border-radius:8px;background:var(--surface-2);
  display:grid;place-items:center;color:var(--text-3);font-size:11px;flex:none;transition:.15s;
}
.member-chip:hover .go{background:var(--violet);color:#fff}

/* ============ EMPTY STATE ============ */
.em{
  text-align:center;padding:48px 20px;border:2px dashed var(--border-strong);
  border-radius:var(--radius);color:var(--text-2);background:var(--surface);
}
.em i{font-size:36px;display:block;margin-bottom:14px;color:var(--text-3)}
.em b{display:block;color:var(--text);margin-bottom:6px;font:700 17px var(--fh)}
.em small{display:block;font-size:12.5px;color:var(--text-3);margin-top:4px}

/* ============ BREADCRUMB ============ */
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0;font-size:12.5px}
.cr button{
  padding:7px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);
  font:600 12.5px var(--ff);color:var(--text-2);transition:.15s;
}
.cr button:hover{background:var(--surface-hover);color:var(--text);border-color:var(--accent)}
.cr button:last-child{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;box-shadow:0 3px 8px -2px rgba(16,185,129,.4)}
.cr i{font-size:9px;color:var(--text-3)}

/* ============ EXPLORER ============ */
.rw{
  display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:8px;
  border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);
  text-align:start;font-weight:600;transition:.18s;box-shadow:var(--shadow-sm);
}
.rw:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--accent)}
.rw>i:first-child{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent-soft),var(--sky-soft));
  color:var(--accent-dark);display:grid;place-items:center;font-size:16px;flex:none;
}
.rw span{flex:1;font-size:14.5px;color:var(--text)}
.rw em{
  font:700 12px var(--fh);font-style:normal;background:linear-gradient(135deg,var(--ink-800),var(--ink-900));
  color:#fff;padding:3px 12px;min-width:32px;text-align:center;border-radius:20px;font-variant-numeric:tabular-nums;
}
.rw>i:last-child{font-size:10px;color:var(--text-3)}
.exp-sortbar{
  display:flex;gap:4px;margin:14px 0;padding:4px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm);
}
.exp-sortbar .sortbtn{
  flex:1;height:38px;border-radius:8px;border:0;background:transparent;color:var(--text-2);
  font:600 12.5px var(--ff);display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;
}
.exp-sortbar .sortbtn:hover{background:var(--surface-hover);color:var(--text)}
.exp-sortbar .sortbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 3px 8px -2px rgba(16,185,129,.4)}
.exp-sortbar .sortbtn i{font-size:11px}

/* ============ BUTTONS ============ */
.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;
  border-radius:12px;font:600 14px var(--ff);background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;transition:.18s;border:0;box-shadow:0 4px 12px -2px rgba(16,185,129,.4);min-width:0;
}
.bt:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 6px 16px -2px rgba(16,185,129,.5)}
.bt:active{transform:translateY(0) scale(.98)}
.bt:disabled{opacity:.5;cursor:not-allowed;transform:none}
.bt.g{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.bt.g:hover{background:var(--surface-hover);filter:none;box-shadow:var(--shadow-sm)}
.bt.d{background:linear-gradient(135deg,var(--rose),var(--rose-dark));box-shadow:0 4px 12px -2px rgba(244,63,94,.4)}
.bt.k{background:linear-gradient(135deg,var(--ink-800),var(--ink-900));box-shadow:0 4px 12px -2px rgba(15,23,42,.3)}
.bt.full{width:100%}
.bt i{font-size:13px}

/* ============ MODAL ============ */
#md{
  position:fixed;inset:0;z-index:60;background:rgba(10,15,26,.6);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
}
#md.on{display:flex}
#md>.sheet{
  width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow-y:auto;
  background:var(--surface);padding:26px 22px 22px;border-radius:var(--radius-xl);
  border:1px solid var(--border);box-shadow:var(--shadow-lg);animation:modalIn .28s cubic-bezier(.2,.9,.3,1);
  position:relative;margin:auto;
}
@keyframes modalIn{from{transform:translateY(24px) scale(.96);opacity:0}}
#md>.sheet h2{font:700 22px var(--fh);letter-spacing:-.02em;margin:6px 0 6px}
.lead{color:var(--text-2);font-size:13px;margin-bottom:18px;line-height:1.6}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.ac .full{grid-column:1/-1}

/* ============ CONFIRM ============ */
.confirm-sheet .confirm-icon{
  width:64px;height:64px;border-radius:18px;display:grid;place-items:center;
  margin-bottom:16px;font-size:26px;background:var(--accent-soft);color:var(--accent);
}
.confirm-sheet .confirm-icon.danger{background:var(--rose-soft);color:var(--rose)}
.confirm-sheet .confirm-icon.success{background:var(--accent-soft);color:var(--accent)}
.confirm-sheet .confirm-icon.warning{background:var(--amber-soft);color:var(--amber)}
.confirm-sheet p{color:var(--text-2);font-size:13.5px;line-height:1.65;margin-bottom:6px}
.confirm-sheet .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.choice-list{display:grid;gap:10px;margin-top:14px}
.choice-card{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--border);transition:.18s;
}
.choice-card:hover{background:var(--surface-hover);border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.choice-card .chi{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:18px;flex:none;
  color:#fff;box-shadow:0 6px 14px -4px rgba(0,0,0,.3);
}
.choice-card.form .chi{background:linear-gradient(135deg,var(--accent),var(--accent-dark))}
.choice-card.sheet .chi{background:linear-gradient(135deg,var(--sky),#0284C7)}
.choice-card .cht{flex:1;min-width:0}
.choice-card .cht b{display:block;font-size:14.5px;font-weight:700;margin-bottom:2px}
.choice-card .cht small{display:block;font-size:12px;color:var(--text-2)}
.choice-card .ch-actions{display:flex;gap:6px;flex:none}
.choice-card .ch-actions a,.choice-card .ch-actions button{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:14px;transition:.15s;
  border:1px solid var(--border);
}
.choice-card .ch-actions .open{background:var(--surface);color:var(--accent);border-color:var(--accent)}
.choice-card .ch-actions .open:hover{background:var(--accent);color:#fff}
.choice-card .ch-actions .share{background:var(--surface);color:var(--text-2)}
.choice-card .ch-actions .share:hover{background:var(--ink-800);color:#fff;border-color:var(--ink-800)}

/* ============ FILTER ============ */
.fmodal-h{margin-bottom:16px}
.fmodal-h h2{font:700 22px var(--fh)!important;letter-spacing:-.02em;margin-bottom:4px!important}
.fmodal-h .sub{font-size:12.5px;color:var(--text-2)}
.fsect,.fopt{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;
  text-align:start;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;transition:.15s;
}
.fsect:hover,.fopt:hover{background:var(--surface-hover);border-color:var(--accent);transform:translateY(-1px)}
.fsect.on,.fopt.on{background:var(--accent-soft);border-color:var(--accent)}
.fsect .ic{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent-soft),var(--sky-soft));
  color:var(--accent-dark);display:grid;place-items:center;flex:none;font-size:14px;
}
.fsect.on .ic{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff}
.fsect .name{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.fsect.on .name{color:var(--accent-dark);font-weight:700}
.fsect .val{font:600 12px var(--ff);color:var(--accent-dark);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsect .num,.fopt .n{
  font:700 12px var(--fh);color:var(--text-2);min-width:28px;text-align:center;
  background:var(--surface-2);padding:3px 9px;border-radius:20px;border:1px solid var(--border);
  font-variant-numeric:tabular-nums;
}
.fsect.on .num,.fopt.on .n{background:var(--accent);color:#fff;border-color:var(--accent)}
.fsect .chev{color:var(--text-3);font-size:11px}
.fback{
  display:flex;align-items:center;gap:6px;color:var(--accent-dark);font:600 13.5px var(--ff);
  margin-bottom:14px;padding:8px 12px;border-radius:10px;transition:.15s;width:fit-content;
}
.fback:hover{background:var(--accent-soft)}
.sortbar{display:flex;gap:6px;margin-bottom:14px}
.sortbtn{
  flex:1;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);font:600 12.5px var(--ff);display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;
}
.sortbtn:hover{background:var(--surface-hover);border-color:var(--accent)}
.sortbtn.on{background:linear-gradient(135deg,var(--ink-800),var(--ink-900));border-color:var(--ink-900);color:#fff}
.fopt .box{
  width:22px;height:22px;border-radius:8px;flex:none;border:2px solid var(--border-strong);
  display:grid;place-items:center;color:transparent;font-size:10px;transition:.15s;background:var(--surface);
}
.fopt.on .box{border-color:var(--accent);background:var(--accent);color:#fff}
.fopt .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600}
.fopt.on .name{font-weight:700;color:var(--accent-dark)}
.fopt.clear{border-style:dashed}
.fopt.clear .name{color:var(--rose)}
.filter-footer{
  position:sticky;bottom:-22px;margin:18px -22px -22px;padding:14px 22px calc(14px + var(--sb));
  background:var(--surface);border-top:1px solid var(--border);display:flex;gap:10px;z-index:5;
  border-radius:0 0 var(--radius-xl) var(--radius-xl);
}
.filter-footer .bt{flex:1;min-height:48px}
.filter-footer .count-badge{
  display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.25);
  padding:0 9px;font:700 13px var(--fh);margin-inline-start:6px;border-radius:20px;
}

/* ============ PROFILE ============ */
.ph{
  margin:-26px -22px 0;padding:36px 22px 24px;text-align:center;color:#fff;
  background:linear-gradient(135deg,var(--ink-900) 0%,var(--ink-800) 100%);
  position:relative;overflow:hidden;border-radius:var(--radius-xl) var(--radius-xl) 0 0;
}
.ph::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(16,185,129,.35),transparent 70%);pointer-events:none;
}
.pl{
  width:84px;height:84px;margin:0 auto 14px;color:#fff;display:grid;place-items:center;font-size:32px;
  position:relative;z-index:1;border-radius:22px;
  background:linear-gradient(135deg,var(--accent),var(--sky));
  box-shadow:0 12px 28px -8px rgba(16,185,129,.6),inset 0 1px 0 rgba(255,255,255,.25);
}
.pn2{font:700 22px var(--fh);letter-spacing:-.02em;position:relative;z-index:1}
.ps{font-size:13px;color:rgba(255,255,255,.75);margin-top:4px;position:relative;z-index:1}
.ph .tags{justify-content:center;position:relative;z-index:1;margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.ph .tg{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px)}
.pa{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 10px}
.pa .ib{width:46px;height:46px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);box-shadow:var(--shadow-sm)}
.pa .ib:hover{background:var(--surface-hover);color:var(--text);transform:translateY(-2px)}
.pa .ib.wa{background:var(--wa);color:#fff;border-color:transparent}
.pa .ib.wa:hover{filter:brightness(1.08);color:#fff}
.pa .ib.pdf{color:var(--rose)}
.pa .ib.pdf:hover{background:var(--rose);color:#fff;border-color:transparent}
.vr{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.vr:last-child{border:0}
.vr>i,.vr>a{
  width:44px;height:44px;border-radius:12px;background:var(--surface-2);color:var(--accent-dark);
  display:grid;place-items:center;flex:none;font-size:15px;transition:.15s;border:1px solid var(--border);
}
.vr>a:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(1.05)}
.vr small{display:block;color:var(--text-3);font:600 11.5px var(--ff);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.vr b{font-weight:600;overflow-wrap:anywhere;color:var(--text)}

/* ============ ABOUT ============ */
.about-hero{
  text-align:center;padding:36px 22px;border-radius:var(--radius-lg);color:#fff;margin-bottom:18px;
  background:linear-gradient(135deg,var(--ink-900) 0%,var(--ink-800) 100%);
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
}
.about-hero::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 20%,rgba(16,185,129,.35),transparent 50%),
    radial-gradient(circle at 80% 80%,rgba(139,92,246,.3),transparent 50%);
  pointer-events:none;
}
.about-hero .ai-big{
  width:80px;height:80px;border-radius:22px;display:grid;place-items:center;margin:0 auto 14px;font-size:32px;
  background:linear-gradient(135deg,var(--accent),var(--sky));
  box-shadow:0 12px 28px -8px rgba(16,185,129,.6),inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;z-index:1;
}
.about-hero h2{font:700 22px/1.3 var(--fh);letter-spacing:-.02em;margin-bottom:8px;position:relative;z-index:1}
.about-hero p{font-size:13.5px;line-height:1.6;max-width:440px;margin:0 auto;color:rgba(255,255,255,.8);position:relative;z-index:1}
.about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.about-stats .stat-box{
  text-align:center;padding:16px 8px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.about-stats .stat-box::before{
  content:"";position:absolute;top:0;inset-inline:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--sky));
}
.about-stats .stat-box b{display:block;font:700 24px var(--fh);color:var(--accent-dark);margin-bottom:2px;font-variant-numeric:tabular-nums}
.about-stats .stat-box span{font:500 12px var(--ff);color:var(--text-2)}
.about-sect{margin-top:22px}
.about-sect-title{
  display:flex;align-items:center;gap:12px;margin-bottom:12px;font:700 15px var(--fh);color:var(--text);
}
.about-sect-title .ic{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:14px;color:#fff;flex:none;
}
.about-sect-title .cnt{
  font:700 12px var(--fh);background:var(--surface-2);color:var(--text-2);padding:3px 10px;
  margin-inline-start:auto;border-radius:20px;border:1px solid var(--border);
}
.link-card{
  display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:10px;transition:.18s;box-shadow:var(--shadow-sm);
}
.link-card:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--accent)}
.link-card .lc-ic{
  width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;color:#fff;
}
.link-card.fb .lc-ic{background:linear-gradient(135deg,var(--fb),#0F5FCC)}
.link-card.wa .lc-ic{background:linear-gradient(135deg,var(--wa),#128C7E)}
.link-card .lc-body{flex:1;min-width:0}
.link-card .lc-body b{display:block;font-size:14px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-card .lc-body small{display:block;font-size:12px;color:var(--text-2);font-weight:500}
.link-card .lc-actions{display:flex;gap:6px;flex:none}
.link-card .lc-actions button,.link-card .lc-actions a{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:14px;
  transition:.15s;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);
}
.link-card.fb .lc-actions .open{background:var(--fb);color:#fff;border-color:var(--fb)}
.link-card.wa .lc-actions .open{background:var(--wa);color:#fff;border-color:var(--wa)}
.link-card .lc-actions .open:hover{filter:brightness(1.08);transform:scale(1.05)}
.link-card .lc-actions .share:hover{background:var(--ink-800);color:#fff;border-color:var(--ink-800)}

/* ============ LOCATION BANNER ============ */
#loc-banner{
  position:fixed;inset-inline:14px;bottom:calc(var(--botnav-h) + 20px + var(--sb));z-index:75;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px 16px 16px;display:none;align-items:center;gap:14px;box-shadow:var(--shadow-lg);
  animation:locIn .35s cubic-bezier(.2,.9,.3,1);max-width:560px;margin-inline:auto;
}
#loc-banner.on{display:flex}
@keyframes locIn{from{opacity:0;transform:translateY(20px)}}
#loc-banner .li{
  width:46px;height:46px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--sky));
  color:#fff;display:grid;place-items:center;font-size:18px;flex:none;
  box-shadow:0 6px 14px -4px rgba(16,185,129,.5);
}
#loc-banner .lt{flex:1;min-width:0}
#loc-banner .lt b{display:block;font:700 13.5px var(--ff);margin-bottom:3px}
#loc-banner .lt small{display:block;font-size:11.5px;color:var(--text-2)}
#loc-banner .la{display:flex;gap:6px;flex:none}
#loc-banner .la button{
  padding:0 14px;height:36px;border-radius:10px;font:700 12px var(--ff);border:1px solid var(--border);
}
#loc-banner .la .skip{background:var(--surface-2);color:var(--text-2)}
#loc-banner .la .skip:hover{background:var(--surface-hover);color:var(--text)}
#loc-banner .la .allow{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;box-shadow:0 3px 8px -2px rgba(16,185,129,.4)}
#loc-banner .la .allow:hover{filter:brightness(1.06)}
#loc-banner .la .allow i{font-size:10px;margin-inline-end:4px}

/* ============ BOTTOM NAV ============ */
#bn{
  position:fixed;inset-inline:0;bottom:0;z-index:29;display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 6px calc(8px + var(--sb));
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-top:1px solid var(--border);
}
.bi{
  height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font:600 10.5px var(--ff);color:var(--text-3);position:relative;transition:.18s;padding:0;
}
.bi i{font-size:18px;line-height:1;transition:.18s}
.bi:hover{background:var(--surface-2);color:var(--text-2)}
.bi.on{color:var(--accent-dark)}
.bi.on i{transform:scale(1.1)}
.bi.on::after{content:"";position:absolute;top:0;inset-inline:calc(50% - 16px);width:32px;height:3px;background:linear-gradient(90deg,var(--accent),var(--sky));border-radius:0 0 4px 4px}
.bi .bub{
  position:absolute;top:2px;inset-inline-end:calc(50% - 24px);min-width:18px;height:18px;padding:0 5px;
  border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose-dark));color:#fff;
  font:700 10px var(--fh);display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--surface);
}
.bi .bub[hidden]{display:none}

/* ============ TOAST ============ */
#ts{
  position:fixed;inset-inline:0;bottom:calc(var(--botnav-h) + 20px + var(--sb));margin:auto;
  width:max-content;max-width:calc(100% - 32px);z-index:90;
  background:linear-gradient(135deg,var(--ink-800),var(--ink-900));color:#fff;padding:12px 18px;
  border-radius:12px;font-weight:600;font-size:13.5px;display:flex;gap:12px;align-items:center;
  opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s;
  box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.1);
}
#ts.on{opacity:1;transform:none;pointer-events:auto}
#ts button{color:var(--amber);font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.1);transition:.15s}
#ts button:hover{background:rgba(255,255,255,.2)}
#ld{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;place-items:center}
#ld.on{display:grid}
#ld i{font-size:44px;color:var(--accent);animation:sp 1.2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#offline-badge{
  position:fixed;top:calc(var(--st) + 8px);inset-inline-end:12px;z-index:80;
  padding:6px 14px;border-radius:20px;background:linear-gradient(135deg,var(--rose),var(--rose-dark));
  color:#fff;font:600 12px var(--ff);display:none;align-items:center;gap:6px;
  box-shadow:0 4px 12px -2px rgba(244,63,94,.4);
}
#offline-badge.on{display:inline-flex}

/* ============ PDF ============ */
.pdf-stage{position:fixed;left:-99999px;top:0;width:1200px}
.pdf-card{width:1200px;min-height:560px;display:flex;direction:rtl;background:#F4F6F8;color:#0F172A;font-family:'IBM Plex Sans Arabic',sans-serif;position:relative;overflow:hidden}
.pdf-l{flex:0 0 440px;background:linear-gradient(135deg,#0F172A 0%,#1E293B 100%);color:#fff;padding:70px 40px 60px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.pdf-logo{width:150px;height:150px;background:linear-gradient(135deg,#10B981,#0EA5E9);color:#fff;display:flex;align-items:center;justify-content:center;font-size:66px;margin-bottom:26px;border-radius:24px;box-shadow:0 20px 40px -12px rgba(16,185,129,.5)}
.pdf-name{font:700 34px/1.25 'IBM Plex Sans Arabic',sans-serif;letter-spacing:-.02em}
.pdf-sub{font-size:16px;opacity:.85;margin-top:10px}
.pdf-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.pdf-tag{font-size:13px;padding:6px 16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:20px;font-weight:700}

      <rect x="216" y="240" width="80" height="60" fill="#0F172A" rx="8"/>

  const manifest={
    name:"RÉSEAU INDUSTRIEL PROFESSIONNEL MAROCAIN",

    description:"نربط الموردين والشركات في مكان واحد",

    ]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(blob);document.head.appendChild(link);
  const apple=document.createElement('link');apple.rel='apple-touch-icon';apple.href=svgIcon(192);document.head.appendChild(apple);
  const fav=document.createElement('link');fav.rel='icon';fav.type='image/svg+xml';fav.href=svgIcon(32);document.head.appendChild(fav);
})();

(function(){
  if(!('serviceWorker' in navigator))return;
  const swCode=`
    const CACHE='connectpro-v21';
    const ASSETS=[location.pathname,
      'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap',
      'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css'];
    self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS).catch(()=>{})))});
    self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
    self.addEventListener('fetch',e=>{
      const req=e.request;if(req.method!=='GET')return;
      const isDoc=req.mode==='navigate'||(req.headers.get('accept')||'').includes('text/html');
      if(isDoc){e.respondWith(fetch(req).then(res=>{const c=res.clone();caches.open(CACHE).then(x=>x.put(req,c)).catch(()=>{});return res}).catch(()=>caches.match(req).then(r=>r||caches.match(location.pathname))))}
      else{e.respondWith(caches.match(req).then(r=>r||fetch(req).then(res=>{if(res.status===200){const c=res.clone();caches.open(CACHE).then(x=>x.put(req,c)).catch(()=>{})}return res})))}
    });
  `;
  const blob=new Blob([swCode],{type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob),{scope:'./'}).catch(err=>console.warn('SW register failed',err));
  function setOffline(off){document.getElementById('offline-badge').classList.toggle('on',off)}
  window.addEventListener('online',()=>setOffline(false));
  window.addEventListener('offline',()=>setOffline(true));
  if(!navigator.onLine)setOffline(true);
})();
</script>

// CSV parsing
function splitCSV(l){
  const o=[];let c='',q=false;
  for(let i=0;i<l.length;i++){const h=l[i];
    if(h==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}
    else if(h===','&&!q){o.push(c);c=''}
    else c+=h;
  }
  o.push(c);return o;
}
const parseCSV=(txt,type,cat)=>{
  const cl=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');
  return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c=>cl(c[1])).map(c=>{
    const name=cl(c[1]);const phone=fmtPhone(cl(c[5]));const email=cl(c[6]).toLowerCase().trim();
    const seed=type+'|'+(email||norm(name)+'|'+phone);
    let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
    return {id:'p'+h.toString(36),name,domaine:cl(c[2])||'Autre',specialite:cl(c[3])||'Général',ville:cl(c[4]),phone,email,web:cl(c[7]),type,categorie:cat};
  });
};
async function fetchFromCSV(){
  const g=async(u)=>{const r=await fetch(u+'&cachebust='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()};
  const [expTxt,fourTxt]=await Promise.all([g(CSV_EXPERTS),g(CSV_FOURNISSEURS)]);
  const experts=parseCSV(expTxt,'experts','yad-amila');
  const fournisseurs=parseCSV(fourTxt,'fournisseurs','services');
  const map=new Map();[...fournisseurs,...experts].forEach(r=>{if(!map.has(r.id))map.set(r.id,r)});
  return [...map.values()];
}
async function loadDB(){
  try{
    const data=await fetchFromCSV();
    if(data&&data.length){
      S.db=data;S.dbIndex=new Map(S.db.map(r=>[r.id,r]));S.dataSource='csv';
      const newHash=computeCsvHash(S.db);
      if(S.lastCsvHash&&S.lastCsvHash!==newHash)S.isDirty=true;
      else if(!S.lastCsvHash){S.isDirty=false;S.lastCsvHash=newHash;try{localStorage.setItem('cp-csv-hash',newHash)}catch{}}
      const expertsList=S.db.filter(r=>r.type==='experts');
      const fournisseursList=S.db.filter(r=>r.type==='fournisseurs');
      S.newMembers=[...expertsList.slice(-2),...fournisseursList.slice(-2)];
      try{localStorage.setItem('cp-csv-cache',JSON.stringify({t:Date.now(),d:S.db}))}catch{}
      clearFacetCache();return;
    }
  }catch(e){console.warn('CSV fetch failed',e)}
  try{
    const cached=JSON.parse(localStorage.getItem('cp-csv-cache')||'null');
    if(cached&&cached.d&&cached.d.length){
      S.db=cached.d;S.dbIndex=new Map(S.db.map(r=>[r.id,r]));S.dataSource='cache';
      const expertsList=S.db.filter(r=>r.type==='experts');
      const fournisseursList=S.db.filter(r=>r.type==='fournisseurs');
      S.newMembers=[...expertsList.slice(-2),...fournisseursList.slice(-2)];
    }
  }catch{}
  clearFacetCache();

// Device tracking
function detectDeviceType(){const ua=navigator.userAgent;if(/iPad|Tablet|PlayBook|Silk/i.test(ua))return'tablet';if(/Mobile|Android|iPhone|iPod|Opera Mini|IEMobile/i.test(ua))return'mobile';return'desktop'}
function detectOS(){const ua=navigator.userAgent;if(/Windows NT 10/.test(ua))return'Windows 10/11';if(/Windows NT/.test(ua))return'Windows';if(/Mac OS X/.test(ua))return'macOS';if(/Android/.test(ua))return'Android';if(/iPhone|iPad|iPod/.test(ua))return'iOS';if(/Linux/.test(ua))return'Linux';return'Unknown'}
function getDeviceId(){try{let id=localStorage.getItem('cp-device-id');if(!id){const rnd=crypto.getRandomValues(new Uint32Array(2));id='d_'+rnd[0].toString(36)+rnd[1].toString(36)+'_'+Date.now().toString(36);localStorage.setItem('cp-device-id',id)}return id}catch{return'd_anon_'+Date.now().toString(36)}}
async function getGeo(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve(null);const to=setTimeout(()=>resolve(null),8000);navigator.geolocation.getCurrentPosition(p=>{clearTimeout(to);resolve({lat:+p.coords.latitude.toFixed(4),lng:+p.coords.longitude.toFixed(4)})},()=>{clearTimeout(to);resolve(null)},{enableHighAccuracy:false,timeout:7000,maximumAge:600000})})}
async function reverseGeo(lat,lng){
  try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=ar`);if(r.ok){const j=await r.json();const city=j.city||j.locality||j.principalSubdivision||'';if(city)return city}}catch{}
  try{const r2=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`,{headers:{'Accept':'application/json'}});if(r2.ok){const j=await r2.json();const a=j.address||{};return a.city||a.town||a.village||a.state||a.country||''}}catch{}
  return '';
}
async function trackDevice(){
  if(!S.fb)return;
  const deviceId=getDeviceId();const base='devices/'+deviceId;
  try{await S.fb.ref(base+'/deviceType').set(detectDeviceType());await S.fb.ref(base+'/os').set(detectOS())}catch(e){console.warn('device info failed',e)}
  try{await S.fb.ref(base).update({lastVisit:Date.now(),lastOnline:navigator.onLine===true})}catch(e){console.warn('visit failed',e)}
  const perm=localStorage.getItem('cp-loc-permission');
  if(perm==='granted'){await fetchAndSaveLocation(deviceId)}
  else if(perm!=='denied'&&perm!=='skipped'){setTimeout(()=>{if(!$('#md').classList.contains('on'))$('#loc-banner').classList.add('on')},3000)}
  startHeartbeat(deviceId);
}
async function fetchAndSaveLocation(deviceId){
  if(!S.fb)return false;
  try{const geo=await getGeo();if(!geo)return false;const base='devices/'+deviceId;const city=await reverseGeo(geo.lat,geo.lng);const update={lastLat:geo.lat,lastLng:geo.lng,lastGeoAt:Date.now()};if(city)update.lastCity=city;await S.fb.ref(base).update(update);return true}
  catch(e){console.warn('geo failed',e);return false}
}
function startHeartbeat(deviceId){
  if(S.heartbeatTimer)clearInterval(S.heartbeatTimer);
  const base='devices/'+deviceId;
  const beat=async()=>{if(!S.fb||!navigator.onLine)return;try{await S.fb.ref(base).update({lastVisit:Date.now(),lastOnline:true})}catch{}};
  beat();S.heartbeatTimer=setInterval(beat,60*1000);
  window.addEventListener('online',beat);
  window.addEventListener('offline',()=>{if(S.fb)try{S.fb.ref(base+'/lastOnline').set(false)}catch{}});
}
async function updateOnlineCount(){
  if(!S.fb)return;
  try{
    const snap=await S.fb.ref('devices').once('value');
    const all=snap.val()||{};const cutoff=Date.now()-ONLINE_WINDOW;let count=0;
    Object.values(all).forEach(d=>{if(d&&d.lastVisit&&d.lastVisit>=cutoff&&d.lastOnline!==false)count++});
    S.onlineCount=count;
  }catch(e){console.warn('online count failed',e)}
  const el=$('#onlineCount');if(el)el.textContent=S.onlineCount===null?'…':S.onlineCount;
}

// Search / Filter
function match(r,skip){
  for(const k in FLD){
    if(k===skip)continue;
    const a=S.f[k];
    if(a.length&&!a.some(v=>norm(r[FLD[k]])===norm(v)))return false;
  }
  if(S.q)return hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.q);
  return true;
}
const results=()=>S.db.filter(r=>match(r)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0)+(S.q?1:0);
const clearF=()=>{S.f={type:[],cat:[],dom:[],spe:[],ville:[]};S.q='';S.lim=40;clearFacetCache()};

const facetKey=k=>k+':'+S.f.type.length+','+S.f.cat.length+','+S.f.dom.length+','+S.f.spe.length+','+S.f.ville.length+','+S.q;
function facet(k,sortBy='count'){
  const m=new Map();
  S.db.filter(r=>match(r,k)).forEach(r=>{const v=(r[FLD[k]]||'').trim();if(v)m.set(v,(m.get(v)||0)+1)});
  const arr=[...m];
  if(sortBy==='count')return arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
  return arr.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
}
function getFacet(k,sortBy='count'){const key=facetKey(k)+':'+sortBy;if(S.facetCache[key])return S.facetCache[key];const v=facet(k,sortBy);S.facetCache[key]=v;return v}
function getFacets(){if(S.facets)return S.facets;const f={};SECTIONS.forEach(s=>{f[s.k]=getFacet(s.k)});S.facets=f;return f}
const clearFacetCache=()=>{S.facetCache={};S.facets=null};

  $('#xq').addEventListener('input',debounce(ev=>{S.exp.q=ev.target.value;document.getElementById('xl').innerHTML=renderExplorerList();const clr=document.getElementById('xqc');if(clr)clr.hidden=!S.exp.q;const sb=document.querySelector('.exp-sortbar');if(sb)sb.style.display=S.exp.q?'none':''},300));
}
const matchExp=r=>!S.exp.q||hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email,TL[r.type],CL[r.categorie]].join(' '),S.exp.q);
function renderExplorerList(){
  const{t,d,s}=S.exp;const sortMode=S.exp.sort||'count';
  const base=S.db.filter(r=>!t||r.type===t).filter(matchExp);
  const grp=(l,k)=>{const m=new Map();l.forEach(r=>{const v=r[k]||'—';m.set(v,(m.get(v)||0)+1)});if(sortMode==='name')return[...m].sort((a,b)=>a[0].localeCompare(b[0],'ar'));return[...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'))};
  const row=(i,n,c,a,v)=>`<button class="rw" data-a="${a}" data-v="${esc(v)}"><i class="fa-solid ${i}"></i><span>${esc(n)}</span><em>${c}</em><i class="fa-solid fa-chevron-left"></i></button>`;
  if(S.exp.q)return base.length?'<div class="ls">'+base.map(card).join('')+'</div>':empty('لا نتائج');
  if(!t)return['fournisseurs','experts'].map(x=>({n:TL[x]+'ون',c:S.db.filter(r=>r.type===x).length,k:x,i:x==='experts'?'fa-user-tie':'fa-truck-field'})).sort((a,b)=>sortMode==='name'?a.n.localeCompare(b.n,'ar'):b.c-a.c||a.n.localeCompare(b.n,'ar')).map(x=>row(x.i,x.n,x.c,'xt',x.k)).join('');
  if(!d)return grp(base,'domaine').map(g=>row(domIcon(g[0]),g[0],g[1],'xd',g[0])).join('');
  if(!s)return grp(base.filter(r=>r.domaine===d),'specialite').map(g=>row('fa-screwdriver-wrench',g[0],g[1],'xs',g[0])).join('');
  return'<div class="ls">'+base.filter(r=>r.domaine===d&&r.specialite===s).map(card).join('')+'</div>';
}

// FAVORITES (also visible here)
function favorites(){
  const f=S.fav.map(byId).filter(Boolean);
  $('#t-fav').innerHTML=`<h3 class="t" style="margin-top:0">المفضلة <span class="h3-badge">${f.length}</span></h3>${f.length?`<div class="ls">${f.map(card).join('')}</div><button class="bt g" data-a="favclr" style="margin-top:14px;width:100%"><i class="fa-solid fa-trash"></i> مسح الكل</button>`:empty('لا مفضلات بعد','اضغط النجمة على أي شركة','fa-star')}`;
}

// NAV
function go(t){
  if(S.tab==='dir'&&t!=='dir')clearF();
  if(S.tab==='exp'&&t!=='exp')S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};
  S.tab=t;
  $$('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+t));
  ({home,dir:dirShell,exp:explorer,about,fav:favorites})[t]();
  $$('.bi').forEach(e=>e.classList.toggle('on',e.dataset.v===t));

  window.scrollTo({top:0,behavior:'instant'});
}
const rerender=()=>go(S.tab);
function favBadge(){const b=$('#fb');if(!b)return;b.hidden=!S.fav.length;b.textContent=S.fav.length>99?'99+':S.fav.length}

// PROFILE
function profile(id){
  const r=byId(id);if(!r)return toast('الملف غير موجود');
  const p=fmtPhone(r.phone),w=url(r.web);
  const rows=[];
  if(shown(r.domaine))rows.push(['fa-industry','القطاع',esc(r.domaine)]);
  if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',esc(r.specialite)]);
  if(r.ville)rows.push(['fa-location-dot','المدينة',esc(r.ville)]);
  if(p)rows.push(['fa-phone','الهاتف',`<span dir="ltr">${esc(p)}</span>`,'tel:'+esc(p)]);
  if(r.email)rows.push(['fa-envelope','البريد',`<span dir="ltr">${esc(r.email)}</span>`,'mailto:'+esc(r.email)]);
  if(w)rows.push(['fa-globe','الموقع',`<span dir="ltr">${esc(r.web)}</span>`,esc(w),1]);
  openM(`<div class="ph"><div class="pl"><i class="fa-solid ${domIcon(r.domaine)}"></i></div>
    <div class="pn2">${esc(r.name)} ${r.verified?'<i class="fa-solid fa-circle-check" style="color:var(--accent-light)"></i>':''}</div>
    <div class="ps">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div>
    <div class="tags"><span class="tg">${TL[r.type]}</span><span class="tg">${CL[r.categorie]}</span>${r.verified?'<span class="tg">موثّق</span>':''}</div></div>
    <div class="pa">
      ${p?`<a class="ib wa" href="https://wa.me/${esc(waPhone(p))}" target="_blank" rel="noopener" title="واتساب"><i class="fa-brands fa-whatsapp"></i></a>`:''}
      <button class="ib" data-a="shr" data-v="${esc(r.id)}" title="مشاركة"><i class="fa-solid fa-share-nodes"></i></button>
      <button class="ib pdf" data-a="pdf" data-v="${esc(r.id)}" title="بطاقة PDF"><i class="fa-solid fa-file-pdf"></i></button>
      <button class="ib" data-a="cls" title="إغلاق"><i class="fa-solid fa-xmark"></i></button></div>
    ${rows.map(([i,k,v,h,ext])=>`<div class="vr">${h?`<a href="${h}"${ext?' target="_blank" rel="noopener"':''}><i class="fa-solid ${i}"></i></a>`:`<i class="fa-solid ${i}"></i>`}<div><small>${k}</small><b>${v}</b></div></div>`).join('')}`);
}

// SHARE
const SEP_LINE='➖➖➖➖➖➖➖➖➖➖➖➖';
async function share(id){
  const r=byId(id);if(!r)return;
  const p=fmtPhone(r.phone),w=url(r.web);
  const lines=[`👤 ${r.name}`,SEP_LINE,`🏷️ النوع: ${TL[r.type]}`,`📂 التصنيف: ${CL[r.categorie]}`];
  if(shown(r.domaine))lines.push(`🏭 القطاع: ${r.domaine}`);
  if(shown(r.specialite))lines.push(`🛠️ التخصص: ${r.specialite}`);
  if(r.ville)lines.push(`📍 المدينة: ${r.ville}`);
  if(p)lines.push(`📞 الهاتف: ${p}`);
  if(r.email)lines.push(`✉️ البريد: ${r.email}`);
  if(w)lines.push(`🌐 الموقع: ${w}`);
  lines.push(SEP_LINE,`🔗 ${baseUrl()}#p=${r.id}`);
  const text=lines.join('\n');
  if(navigator.share){try{await navigator.share({title:r.name,text});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);toast('تم النسخ')}catch{toast('تعذر النسخ')}
  setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener'),0);
}
async function shareLink(rawUrl,name){
  if(!rawUrl)return;
  const text=[`🔗 ${name||'رابط'}`,SEP_LINE,rawUrl].join('\n');
  if(navigator.share){try{await navigator.share({title:name||'رابط',text});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(rawUrl);toast('تم نسخ الرابط')}catch{toast('تعذر النسخ')}
}
function toggleFav(id){
  const i=S.fav.indexOf(id);i>=0?S.fav.splice(i,1):S.fav.push(id);
  try{localStorage.setItem('cp-fav',JSON.stringify(S.fav))}catch{}
  toast(i>=0?'أُزيلت من المفضلة':'أُضيفت إلى المفضلة');
  favBadge();
  if(!$('#md').classList.contains('on'))rerender();else profile(id);
}

// PDF
async function loadPdfLibs(){
  if(window.html2canvas&&window.jspdf)return;
  const ld=u=>new Promise((a,b)=>{const e=document.createElement('script');e.src=u;e.onload=a;e.onerror=b;document.head.appendChild(e)});
  try{await Promise.all([window.html2canvas?0:ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),window.jspdf?0:ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')])}catch{throw new Error('تعذر تحميل مكتبة PDF')}
}
function pdfHtml(r){
  const p=fmtPhone(r.phone),w=url(r.web),rows=[];
  if(shown(r.domaine))rows.push(['fa-industry','القطاع',r.domaine]);
  if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',r.specialite]);
  if(r.ville)rows.push(['fa-location-dot','المدينة',r.ville]);
  if(p)rows.push(['fa-phone','الهاتف',p]);
  if(r.email)rows.push(['fa-envelope','البريد',r.email]);
  if(w)rows.push(['fa-globe','الموقع',r.web]);
  const base=baseUrl();
  const qr=base?`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(base+'#p='+r.id)}&color=0F172A&bgcolor=FFFFFF&margin=0" crossorigin="anonymous" alt="QR">`:'';
  return `<div class="pdf-card" data-pdf-root><div class="pdf-l"><div class="pdf-logo"><i class="fa-solid ${domIcon(r.domaine)}"></i></div><div class="pdf-name">${esc(r.name)}</div><div class="pdf-sub">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div><div class="pdf-tags"><span class="pdf-tag">${TL[r.type]}</span><span class="pdf-tag">${CL[r.categorie]}</span>${r.verified?'<span class="pdf-tag v">✓ موثّق</span>':''}</div></div><div class="pdf-r">${rows.map(([i,k,v])=>`<div class="pdf-row"><div class="ic"><i class="fa-solid ${i}"></i></div><div><div class="k">${k}</div><div class="v">${esc(v)}</div></div></div>`).join('')}</div><div class="pdf-ft"><b>CONNECT PRO</b>${qr}</div></div>`;
}
async function makePDF(id){
  const r=byId(id);if(!r)return;busy(true);let h=null;
  try{
    await loadPdfLibs();
    h=document.createElement('div');h.className='pdf-stage';h.innerHTML=pdfHtml(r);document.body.appendChild(h);
    try{await document.fonts?.ready}catch{}
    await new Promise(res=>setTimeout(res,700));
    const cv=await html2canvas(h.querySelector('[data-pdf-root]'),{scale:2,backgroundColor:'#F4F6F8',useCORS:true,logging:false});
    const{jsPDF}=window.jspdf,W=200,H=W*cv.height/cv.width;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[W,H]});
    pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);
    pdf.save(`ConnectPro-${r.name.replace(/\s+/g,'_')}.pdf`);
    toast('تم توليد بطاقة PDF');
  }catch(e){console.error(e);toast(e.message||'خطأ في توليد PDF')}
  finally{h?.remove();busy(false)}
}

// SYNC
async function syncCSV(){
  if(!S.fb)return toast('Firebase غير متاح');
  if(!S.isDirty&&S.lastCsvHash)return toast('كل شيء متزامن بالفعل');
  askConfirm({title:'مزامنة CSV إلى Firebase',message:`سيتم رفع <b>${S.db.length}</b> سجل إلى Firebase كنسخة احتياطية.`,icon:'fa-cloud-arrow-up',tone:'primary',confirmLabel:'مزامنة الآن',onConfirm:async()=>{
    busy(true);
    try{
      const tree={};
      S.db.forEach(r=>{const{type,categorie,...x}=r;const T=TK[type],C=CK[categorie];tree[T]=tree[T]||{};(tree[T][C]=tree[T][C]||{})[x.id]={...x,createdAt:x.createdAt||Date.now()}});
      await S.fb.ref('professionals').set(tree);
      const newHash=computeCsvHash(S.db);S.lastCsvHash=newHash;
      try{localStorage.setItem('cp-csv-hash',newHash)}catch{}
      S.isDirty=false;
      try{await S.fb.ref('meta/lastSync').set(Date.now())}catch{}
      toast(`تم رفع ${S.db.length} سجل إلى Firebase`);topbar();
    }catch(e){console.error(e);toast('فشلت المزامنة')}
    finally{busy(false)}
  }});
}

// ACTIONS
const A={
  theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('cp-theme',d)}catch{};topbar();toast(d==='dark'?'الوضع الداكن':'الوضع الفاتح')},
  syncCSV,
  openForms(){
    const item=(label,sub,url,kind)=>`<div class="choice-card ${kind}"><div class="chi"><i class="fa-solid ${kind==='form'?'fa-user-tie':'fa-truck-field'}"></i></div><div class="cht"><b>${esc(label)}</b><small>${esc(sub)}</small></div><div class="ch-actions"><a class="open" href="${url}" target="_blank" rel="noopener" title="فتح"><i class="fa-solid fa-arrow-up-right-from-square"></i></a><button class="share" data-a="shrLink" data-v="${esc(url)}" data-name="${esc(label)}" title="مشاركة"><i class="fa-solid fa-share-nodes"></i></button></div></div>`;
    openM(`<h2>نماذج الإدخال</h2><p class="lead">اختر نوع التسجيل — سيُفتح نموذج Google</p><div class="choice-list">${item('تسجيل خبير','أدخل بياناتك كخبير',FORM_FOURNISSEURS,'form')}${item('تسجيل مورّد','أدخل بياناتك كمورّد',FORM_EXPERTS,'form')}</div><div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
  },
  openSheets(){
    const item=(label,sub,url)=>`<div class="choice-card sheet"><div class="chi"><i class="fa-solid fa-table"></i></div><div class="cht"><b>${esc(label)}</b><small>${esc(sub)}</small></div><div class="ch-actions"><a class="open" href="${url}" target="_blank" rel="noopener" title="فتح"><i class="fa-solid fa-arrow-up-right-from-square"></i></a><button class="share" data-a="shrLink" data-v="${esc(url)}" data-name="${esc(label)}" title="مشاركة"><i class="fa-solid fa-share-nodes"></i></button></div></div>`;
    openM(`<h2>فتح الأوراق</h2><p class="lead">اختر الورقة لعرضها في Google Sheets</p><div class="choice-list">${item('ورقة الخبراء','عرض جدول الخبراء',SHEET_EXPERTS)}${item('ورقة الموردين','عرض جدول الموردين',SHEET_FOURNISSEURS)}</div><div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
  },
  allowLocation(){
    $('#loc-banner').classList.remove('on');
    const deviceId=getDeviceId();
    if(!navigator.geolocation)return toast('المتصفح لا يدعم الموقع');
    toast('جاري تحديد موقعك...');
    navigator.geolocation.getCurrentPosition(async(p)=>{
      try{
        const lat=+p.coords.latitude.toFixed(4);const lng=+p.coords.longitude.toFixed(4);
        const city=await reverseGeo(lat,lng);const base='devices/'+deviceId;
        const update={lastLat:lat,lastLng:lng,lastGeoAt:Date.now()};if(city)update.lastCity=city;
        if(S.fb)await S.fb.ref(base).update(update);
        localStorage.setItem('cp-loc-permission','granted');
        toast(city?`📍 ${city}`:'📍 تم تحديد موقعك');
      }catch(e){console.warn(e);toast('تعذر حفظ الموقع')}
    },(err)=>{
      if(err.code===err.PERMISSION_DENIED){localStorage.setItem('cp-loc-permission','denied');toast('تم رفض الإذن')}
      else if(err.code===err.TIMEOUT){toast('انتهت مهلة تحديد الموقع')}
      else toast('تعذر تحديد الموقع');
    },{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
  },
  skipLocation(){$('#loc-banner').classList.remove('on');localStorage.setItem('cp-loc-permission','skipped');toast('حسناً')},
  shrLink:shareLink,pdf:makePDF,confirmAccept,confirmCancel,
  tab(v){
    if(S.tab===v){
      if(v==='dir'){clearF();dirShell()}
      else if(v==='exp'){S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};explorer()}
      else window.scrollTo({top:0,behavior:'smooth'});
    }else go(v);
  },
  cls:closeM,open(id){profile(id)},shr:share,fav:toggleFav,
  undo(){if(undoFn){undoFn();undoFn=null;$('#ts').classList.remove('on')}},
  stat(v){if(v==='f'){openFilter();return}const i=v.indexOf(':');clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];go('dir')},
  bar(v,el){clearF();S.f[el.dataset.k]=[v];go('dir')},
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=40;clearFacetCache();dirList()},
  qx(){S.q='';$('#q').value='';S.lim=40;clearFacetCache();dirList()},
  more(){S.lim+=40;dirList()},
  fmodal:()=>openFilter(),
  fsect(v){S.filterPanel.mode='pick';S.filterPanel.key=v;renderFilter()},
  fback(){S.filterPanel.mode='sections';S.filterPanel.key=null;renderFilter()},
  fsort(v){S.sortF[S.filterPanel.key]=v;renderFilter()},
  fclearsec(){S.f[S.filterPanel.key]=[];S.lim=40;clearFacetCache();renderFilter();if(S.tab==='dir')dirList()},
  fpick(v){const k=S.filterPanel.key,arr=S.f[k];const i=arr.findIndex(x=>norm(x)===norm(v));if(i>=0)arr.splice(i,1);else arr.push(v);S.lim=40;clearFacetCache();renderFilter();if(S.tab==='dir')dirList()},
  fclr(){clearF();renderFilter();if(S.tab==='dir'){$('#q')&&($('#q').value='');dirList()}},
  fdone(){closeM();if(S.tab!=='dir'){S.tab='';go('dir')}else dirList()},
  xsort(v){S.exp.sort=v;explorer()},
  xt:v=>{S.exp={t:v,d:'',s:'',q:'',sort:S.exp.sort};explorer()},
  xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';explorer()},
  xs:v=>{S.exp.s=v;S.exp.q='';explorer()},
  qxexp(){S.exp.q='';explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:'',sort:x.sort}:v==='t'?{t:x.t,d:'',s:'',q:'',sort:x.sort}:v==='d'?{t:x.t,d:x.d,s:'',q:'',sort:x.sort}:x;explorer()},
  favclr(){askConfirm({title:'مسح المفضلة',message:'إزالة كل الشركات من المفضلة؟',icon:'fa-star',tone:'warning',confirmLabel:'مسح الكل',onConfirm:()=>{S.fav=[];try{localStorage.removeItem('cp-fav')}catch{};favorites();favBadge()}})},
  installPWA(){
    if(!S.installEvent)return toast('التثبيت غير متاح');
    S.installEvent.prompt();
    S.installEvent.userChoice.then(({outcome})=>{if(outcome==='accepted'){S.installEvent=null;toast('جاري التثبيت...')}});
  }
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}
  else if(e.target.id==='md')closeM();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeM();
  if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v);
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvent=e});

(async()=>{
  try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn('Firebase init failed',e)}
  await loadDB();
  S.lastSync=Date.now();
  go('home');
  busy(false);
  topbar();
  trackDevice().catch(e=>console.warn('track',e));
  if(S.fb){updateOnlineCount();setInterval(updateOnlineCount,30*1000)}
  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(m[1]);r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
