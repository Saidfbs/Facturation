<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0078D7">
<title>KC868-A6 - Control</title>
<style>
  /* ═══════════════════════════════════════════════════
     VARIABLES - STYLE WINDOWS 10
     ═══════════════════════════════════════════════════ */
  :root {
    --win-blue: #0078D7;
    --win-blue-hover: #106EBE;
    --win-blue-light: #2B88D8;
    --win-bg-dark: #1F1F1F;
    --win-bg-panel: #2B2B2B;
    --win-bg-card: #333333;
    --win-bg-hover: #3D3D3D;
    --win-bg-active: #464646;
    --win-text: #FFFFFF;
    --win-text-secondary: #B0B0B0;
    --win-border: #3F3F3F;
    --win-border-light: #4A4A4A;
    --win-green: #107C10;
    --win-red: #E81123;
    --win-yellow: #FFB900;
    --win-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  [data-theme="light"] {
    --win-bg-dark: #F3F3F3;
    --win-bg-panel: #FFFFFF;
    --win-bg-card: #FAFAFA;
    --win-bg-hover: #E5E5E5;
    --win-bg-active: #D6D6D6;
    --win-text: #000000;
    --win-text-secondary: #616161;
    --win-border: #D2D2D2;
    --win-border-light: #E0E0E0;
    --win-shadow: 0 2px 8px rgba(0,0,0,0.14);
  }

  /* ═══════════════════════════════════════════════════
     RESET & BASE
     ═══════════════════════════════════════════════════ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Segoe UI Variable', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--win-bg-dark);
    color: var(--win-text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    font-size: 14px;
    overflow-x: hidden;
  }

  /* ═══════════════════════════════════════════════════
     TITLE BAR
     ═══════════════════════════════════════════════════ */
  .title-bar {
    background: var(--win-bg-panel);
    padding: 0 0.75rem;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--win-border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
  }

  .title-bar-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .app-icon {
    font-size: 1.4rem;
    color: var(--win-blue);
  }

  .title-bar h1 {
    font-size: 14px;
    font-weight: 400;
    color: var(--win-text);
  }

  .title-bar-controls {
    display: flex;
    gap: 0;
    height: 48px;
  }

  .win-btn {
    background: transparent;
    border: none;
    color: var(--win-text);
    width: 46px;
    height: 48px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
  }

  .win-btn:hover {
    background: var(--win-bg-hover);
  }

  .win-btn.close:hover {
    background: var(--win-red);
    color: white;
  }

  /* ═══════════════════════════════════════════════════
     CONTAINER
     ═══════════════════════════════════════════════════ */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* ═══════════════════════════════════════════════════
     PANEL
     ═══════════════════════════════════════════════════ */
  .panel {
    background: var(--win-bg-panel);
    border: 1px solid var(--win-border);
    padding: 1.25rem;
    transition: all 0.2s;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--win-border);
    color: var(--win-text);
  }

  .panel-header-icon {
    font-size: 1.2rem;
  }

  /* ═══════════════════════════════════════════════════
     STATUS BAR
     ═══════════════════════════════════════════════════ */
  .status-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    align-items: center;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 13px;
    color: var(--win-text);
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--win-red);
    position: relative;
  }

  .status-dot.online {
    background: var(--win-green);
    box-shadow: 0 0 8px var(--win-green);
  }

  .status-dot.online::after {
    content: '';
    position: absolute;
    top: -3px;
    left: -3px;
    right: -3px;
    bottom: -3px;
    border-radius: 50%;
    border: 1px solid var(--win-green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .online-badge {
    margin-left: auto;
    padding: 0.35rem 0.9rem;
    font-size: 12px;
    background: var(--win-green);
    color: white;
    font-weight: 500;
    border-radius: 2px;
    letter-spacing: 0.3px;
  }

  .online-badge.offline {
    background: var(--win-red);
  }

  /* ═══════════════════════════════════════════════════
     IO GRID
     ═══════════════════════════════════════════════════ */
  .io-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 0.75rem;
  }

  .io-item {
    background: var(--win-bg-card);
    padding: 0.85rem 0.5rem;
    text-align: center;
    border: 1px solid var(--win-border);
    transition: all 0.15s;
    position: relative;
  }

  .io-item .io-label {
    font-size: 12px;
    color: var(--win-text-secondary);
    margin-bottom: 0.5rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .io-item .io-state {
    width: 36px;
    height: 36px;
    margin: 0 auto;
    background: var(--win-bg-dark);
    border: 2px solid var(--win-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.25s;
    border-radius: 50%;
  }

  .io-item .io-state.on {
    background: var(--win-blue);
    border-color: var(--win-blue);
    box-shadow: 0 0 12px var(--win-blue);
  }

  .io-item.clickable {
    cursor: pointer;
    user-select: none;
  }

  .io-item.clickable:hover {
    background: var(--win-bg-hover);
    border-color: var(--win-blue);
  }

  .io-item.clickable:active {
    background: var(--win-bg-active);
    transform: scale(0.97);
  }

  /* ═══════════════════════════════════════════════════
     ANALOG
     ═══════════════════════════════════════════════════ */
  .analog-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 0.85rem;
  }

  .analog-label {
    min-width: 50px;
    font-weight: 600;
    color: var(--win-text);
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  .analog-bar {
    flex: 1;
    height: 20px;
    background: var(--win-bg-dark);
    overflow: hidden;
    position: relative;
    border: 1px solid var(--win-border);
  }

  .analog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--win-blue), var(--win-blue-light));
    transition: width 0.5s ease;
    position: relative;
    overflow: hidden;
  }

  .analog-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .analog-value {
    min-width: 95px;
    text-align: right;
    font-weight: 600;
    color: var(--win-blue-light);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  /* AO Slider */
  .ao-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--win-bg-dark);
    outline: none;
    cursor: pointer;
    border-radius: 2px;
  }

  .ao-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    background: var(--win-blue);
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid var(--win-text);
    transition: all 0.15s;
  }

  .ao-slider::-webkit-slider-thumb:hover {
    background: var(--win-blue-hover);
    transform: scale(1.15);
    box-shadow: 0 0 10px var(--win-blue);
  }

  .ao-slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    background: var(--win-blue);
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid var(--win-text);
  }

  /* FOOTER */
  .footer-bar {
    background: var(--win-bg-panel);
    border-top: 1px solid var(--win-border);
    padding: 0.75rem 1.5rem;
    font-size: 12px;
    color: var(--win-text-secondary);
    text-align: center;
    letter-spacing: 0.3px;
  }

  /* ═══════════════════════════════════════════════════
     RESPONSIVE - TABLETTES
     ═══════════════════════════════════════════════════ */
  @media (max-width: 900px) {
    .container {
      padding: 1rem;
    }
    
    .io-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  /* ═══════════════════════════════════════════════════
     RESPONSIVE - TÉLÉPHONES (⭐ 3 في الصف)
     ═══════════════════════════════════════════════════ */
  @media (max-width: 600px) {
    /* Title bar */
    .title-bar {
      padding: 0 0.5rem;
      height: 44px;
    }
    
    .title-bar h1 {
      font-size: 12px;
    }
    
    .app-icon {
      font-size: 1.1rem;
    }
    
    .win-btn {
      width: 40px;
      height: 44px;
      font-size: 11px;
    }
    
    /* Container */
    .container {
      padding: 0.75rem;
      gap: 0.75rem;
    }
    
    /* Panels */
    .panel {
      padding: 0.75rem;
    }
    
    .panel-header {
      font-size: 13px;
      padding-bottom: 0.5rem;
      margin-bottom: 0.75rem;
    }
    
    .panel-header-icon {
      font-size: 1rem;
    }
    
    /* ⭐ IO GRID - 3 في الصف */
    .io-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    
    /* IO ITEMS أكبر */
    .io-item {
      padding: 0.75rem 0.4rem;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .io-item .io-label {
      font-size: 11px;
      margin-bottom: 0.4rem;
    }
    
    .io-item .io-state {
      width: 34px;
      height: 34px;
      font-size: 0.9rem;
    }
    
    /* Status bar */
    .status-bar {
      gap: 0.75rem;
    }
    
    .status-item {
      font-size: 12px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
    }
    
    .online-badge {
      padding: 0.3rem 0.7rem;
      font-size: 11px;
      width: 100%;
      text-align: center;
      margin-left: 0;
      margin-top: 0.5rem;
    }
    
    /* ANALOG ROWS */
    .analog-row {
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: nowrap;
    }
    
    .analog-label {
      min-width: 36px;
      font-size: 12px;
      font-weight: 700;
    }
    
    .analog-bar {
      height: 24px;
      flex: 1;
      min-width: 60px;
    }
    
    .analog-value {
      min-width: 65px;
      font-size: 11px;
      text-align: right;
    }
    
    /* AO Slider أكبر للمس */
    .ao-slider {
      height: 6px;
      min-width: 60px;
    }
    
    .ao-slider::-webkit-slider-thumb {
      width: 26px;
      height: 26px;
    }
    
    .ao-slider::-moz-range-thumb {
      width: 26px;
      height: 26px;
    }
    
    /* Footer */
    .footer-bar {
      padding: 0.6rem 0.75rem;
      font-size: 11px;
    }
  }

  /* ═══════════════════════════════════════════════════
     RESPONSIVE - PETITS TÉLÉPHONES
     ═══════════════════════════════════════════════════ */
  @media (max-width: 380px) {
    .container {
      padding: 0.5rem;
      gap: 0.5rem;
    }
    
    .panel {
      padding: 0.6rem;
    }
    
    .io-grid {
      gap: 0.4rem;
    }
    
    .io-item {
      padding: 0.6rem 0.3rem;
      min-height: 70px;
    }
    
    .io-item .io-state {
      width: 30px;
      height: 30px;
    }
    
    .analog-label {
      min-width: 32px;
      font-size: 11px;
    }
    
    .analog-value {
      min-width: 58px;
      font-size: 10px;
    }
  }

  /* ═══════════════════════════════════════════════════
     PAYSAGE (أفقي)
     ═══════════════════════════════════════════════════ */
  @media (max-height: 500px) and (orientation: landscape) {
    .io-grid {
      grid-template-columns: repeat(6, 1fr);
    }
    
    .container {
      gap: 0.5rem;
    }
    
    .panel {
      padding: 0.6rem;
    }
  }
</style>
</head>
<body>

<!-- TITLE BAR -->
<div class="title-bar">
  <div class="title-bar-left">
    <span class="app-icon">🏠</span>
    <h1>KC868-A6 Control - Said</h1>
  </div>
  <div class="title-bar-controls">
    <button class="win-btn" id="themeBtn" title="Thème">◐</button>
    <button class="win-btn" id="refreshBtn" title="Actualiser">↻</button>
    <button class="win-btn close" title="Fermer">✕</button>
  </div>
</div>

<!-- MAIN -->
<main class="container">

  <section class="panel">
    <div class="panel-header">
      <span class="panel-header-icon">📊</span>
      <span>État Système</span>
    </div>
    <div class="status-bar">
      <div class="status-item">
        <span class="status-dot" id="wifiDot"></span>
        <span>WiFi</span>
      </div>
      <div class="status-item">
        <span class="status-dot" id="fbDot"></span>
        <span>Firebase</span>
      </div>
      <div class="status-item">
        <span class="status-dot" id="i2cDot"></span>
        <span>I2C</span>
      </div>
      <div class="status-item">
        <span class="status-dot" id="ntpDot"></span>
        <span>NTP</span>
      </div>
      <span class="online-badge offline" id="onlineBadge">Hors ligne</span>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <span class="panel-header-icon">🔌</span>
      <span>Entrées Digitales (DI)</span>
    </div>
    <div class="io-grid" id="diGrid"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <span class="panel-header-icon">💡</span>
      <span>Sorties Digitales (DO) — Contrôle</span>
    </div>
    <div class="io-grid" id="doGrid"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <span class="panel-header-icon">📈</span>
      <span>Entrées Analogiques (AI)</span>
    </div>
    <div id="aiContainer"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <span class="panel-header-icon">🎛️</span>
      <span>Sorties Analogiques (AO) — Contrôle</span>
    </div>
    <div id="aoContainer"></div>
  </section>

</main>

<div class="footer-bar">
  🕐 Dernière mise à jour: <span id="lastUpdate">--:--:--</span>
  &nbsp;·&nbsp; KC868-A6 v1.0
</div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
  import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

  const firebaseConfig = {
    databaseURL: "https://said-rahil-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const DEVICE_NAME = "Said";
  const BASE_PATH = `/${DEVICE_NAME}`;

  let state = { DI: {}, DO: {}, AI: {}, AO: {} };

  // ═══════════════════════════════════════════════════
  // INIT UI
  // ═══════════════════════════════════════════════════
  function initUI() {
    const diGrid = document.getElementById('diGrid');
    for (let i = 1; i <= 6; i++) {
      diGrid.innerHTML += `
        <div class="io-item">
          <div class="io-label">DI${i}</div>
          <div class="io-state" id="di${i}State">⚫</div>
        </div>
      `;
    }

    const doGrid = document.getElementById('doGrid');
    for (let i = 1; i <= 6; i++) {
      doGrid.innerHTML += `
        <div class="io-item clickable" onclick="toggleDO(${i})">
          <div class="io-label">DO${i}</div>
          <div class="io-state" id="do${i}State">⚫</div>
        </div>
      `;
    }

    const aiContainer = document.getElementById('aiContainer');
    for (let i = 1; i <= 4; i++) {
      aiContainer.innerHTML += `
        <div class="analog-row">
          <div class="analog-label">AI${i}</div>
          <div class="analog-bar">
            <div class="analog-fill" id="ai${i}Bar" style="width: 0%"></div>
          </div>
          <div class="analog-value" id="ai${i}Value">0% (0)</div>
        </div>
      `;
    }

    const aoContainer = document.getElementById('aoContainer');
    for (let i = 1; i <= 2; i++) {
      aoContainer.innerHTML += `
        <div class="analog-row">
          <div class="analog-label">AO${i}</div>
          <input type="range" min="0" max="255" value="0" class="ao-slider" 
                 id="ao${i}Slider" 
                 oninput="updateAO(${i}, this.value)"
                 onchange="sendAO(${i}, this.value)">
          <div class="analog-value" id="ao${i}Value">0% (0)</div>
        </div>
      `;
    }
  }

  // ═══════════════════════════════════════════════════
  // CONTROLS
  // ═══════════════════════════════════════════════════
  window.toggleDO = function(numero) {
    const current = state.DO[`DO${numero}`] || 0;
    const newValue = current === 1 ? 0 : 1;
    set(ref(db, `${BASE_PATH}/DO/DO${numero}`), newValue);
  };

  window.updateAO = function(numero, value) {
    const pct = Math.round((value / 255) * 100);
    document.getElementById(`ao${numero}Value`).textContent = `${pct}% (${value})`;
  };

  window.sendAO = function(numero, value) {
    set(ref(db, `${BASE_PATH}/AO/AO${numero}`), parseInt(value));
  };

  // ═══════════════════════════════════════════════════
  // UPDATE UI
  // ═══════════════════════════════════════════════════
  function updateDI(data) {
    for (let i = 1; i <= 6; i++) {
      const el = document.getElementById(`di${i}State`);
      if (el) {
        if (data[`DI${i}`] === 1) {
          el.textContent = '⚫';
          el.classList.add('on');
        } else {
          el.textContent = '⚪';
          el.classList.remove('on');
        }
      }
    }
  }

  function updateDO(data) {
    for (let i = 1; i <= 6; i++) {
      const el = document.getElementById(`do${i}State`);
      if (el) {
        if (data[`DO${i}`] === 1) {
          el.textContent = '●';
          el.classList.add('on');
        } else {
          el.textContent = '○';
          el.classList.remove('on');
        }
      }
    }
  }

  function updateAI(data) {
    for (let i = 1; i <= 4; i++) {
      const value = data[`AI${i}`] || 0;
      const pct = Math.round((value / 4095) * 100);
      const bar = document.getElementById(`ai${i}Bar`);
      const val = document.getElementById(`ai${i}Value`);
      if (bar) bar.style.width = `${pct}%`;
      if (val) val.textContent = `${pct}% (${value})`;
    }
  }

  function updateAO(data) {
    for (let i = 1; i <= 2; i++) {
      const value = data[`AO${i}`] || 0;
      const pct = Math.round((value / 255) * 100);
      const slider = document.getElementById(`ao${i}Slider`);
      const val = document.getElementById(`ao${i}Value`);
      if (slider && document.activeElement !== slider) slider.value = value;
      if (val) val.textContent = `${pct}% (${value})`;
    }
  }

  function updateTime() {
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('fr-FR');
  }

  // ═══════════════════════════════════════════════════
  // FIREBASE LISTEN
  // ═══════════════════════════════════════════════════
  function listenFirebase() {
    const connectedRef = ref(db, '.info/connected');
    onValue(connectedRef, (snap) => {
      const online = snap.val() === true;
      const badge = document.getElementById('onlineBadge');
      const fbDot = document.getElementById('fbDot');
      
      if (online) {
        badge.textContent = 'En ligne';
        badge.classList.remove('offline');
        fbDot.classList.add('online');
        document.getElementById('wifiDot').classList.add('online');
        document.getElementById('i2cDot').classList.add('online');
        document.getElementById('ntpDot').classList.add('online');
      } else {
        badge.textContent = 'Hors ligne';
        badge.classList.add('offline');
        fbDot.classList.remove('online');
      }
      updateTime();
    });

    onValue(ref(db, `${BASE_PATH}/DI`), (snap) => {
      state.DI = snap.val() || {};
      updateDI(state.DI);
      updateTime();
    });

    onValue(ref(db, `${BASE_PATH}/DO`), (snap) => {
      state.DO = snap.val() || {};
      updateDO(state.DO);
      updateTime();
    });

    onValue(ref(db, `${BASE_PATH}/AI`), (snap) => {
      state.AI = snap.val() || {};
      updateAI(state.AI);
      updateTime();
    });

    onValue(ref(db, `${BASE_PATH}/AO`), (snap) => {
      state.AO = snap.val() || {};
      updateAO(state.AO);
      updateTime();
    });
  }

  // ═══════════════════════════════════════════════════
  // THEME
  // ═══════════════════════════════════════════════════
  function initTheme() {
    const btn = document.getElementById('themeBtn');
    const current = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', current);

    btn.addEventListener('click', () => {
      const now = document.documentElement.getAttribute('data-theme');
      const next = now === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  }

  function initRefresh() {
    document.getElementById('refreshBtn').addEventListener('click', () => {
      window.location.reload();
    });
  }

  // ═══════════════════════════════════════════════════
  // START
  // ═══════════════════════════════════════════════════
  initUI();
  initTheme();
  initRefresh();
  listenFirebase();

  console.log('✅ KC868-A6 Control - Mobile Ready');
</script>
