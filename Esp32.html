<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>KC868-A6 — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#fff; --panel2:#f5f7fa; --line:#dde3ea; --text:#14202e; --mute:#6a7a8c;
  --accent:#0b6bcb; --on:#12a150; --off:#d64545; --warn:#e8a317; --out:#0b6bcb; --inp:#7a4fd6; --ana:#e07a1f;
  --sh:0 1px 2px rgba(15,23,32,.06),0 4px 14px rgba(15,23,32,.05);
}
[data-theme=dark]{
  --bg:#0c121a; --panel:#141d29; --panel2:#1a2535; --line:#243247; --text:#e8eef6; --mute:#8ea0b6;
  --accent:#4aa3ff; --on:#35c97a; --off:#ff6b6b; --out:#4aa3ff; --inp:#a58bff; --ana:#ffa24d; --sh:none;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0)}
:root{padding-top:env(safe-area-inset-top,0)}
.bar{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:180px}
.logo{width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;direction:ltr}
.brand b{display:block;font-size:15px}
.brand span{font-size:12px;color:var(--mute)}
.conn{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--off)}
.conn.ok .dot{background:var(--on);box-shadow:0 0 0 4px color-mix(in srgb,var(--on) 25%,transparent)}
.ib{height:36px;min-width:36px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib:hover{background:var(--panel2)}
.ib:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ib.danger{color:var(--off);border-color:color-mix(in srgb,var(--off) 45%,var(--line))}
.ib:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px}
.chip i{width:8px;height:32px;border-radius:4px;background:var(--off)}
.chip.ok i{background:var(--on)}
.chip b{display:block;font-size:13px}
.chip span{font-size:11.5px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);border-inline-start:4px solid var(--c)}
.sec-h h2{font-size:14.5px;font-weight:600;flex:1}
.sec-h small{font-size:11.5px;color:var(--mute);direction:ltr}
.cnt{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-variant-numeric:tabular-nums}
.sec-b{padding:14px;display:grid;gap:10px}
.sec.do{--c:var(--out)} .sec.ao{--c:var(--ana)} .sec.di{--c:var(--inp)} .sec.ai{--c:var(--ana)}
.tiles{grid-template-columns:repeat(3,1fr)}
.tile{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 8px;text-align:center;font:inherit;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:8px;transition:background .15s,border-color .15s}
button.tile{cursor:pointer}
button.tile:active{transform:scale(.97)}
.tile .n{font-size:12px;font-weight:600;color:var(--mute);direction:ltr}
.tile .s{font-size:12px;font-weight:600;color:var(--mute)}
.sw{width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.tile.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.tile.on .sw{background:var(--c)}
.tile.on .sw::after{inset-inline-start:23px}
.tile.on .s{color:var(--c)}
.tile.off{opacity:.45;pointer-events:none}
.led{width:22px;height:22px;border-radius:50%;background:var(--line);border:2px solid var(--line);transition:all .2s}
.tile.on .led{background:var(--c);border-color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}
.row{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 14px}
.row-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.row-h b{font-size:13px;direction:ltr}
.val{font-size:22px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.val small{font-size:12px;color:var(--mute);margin-inline-start:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:var(--line);outline:none;direction:ltr;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--c);border:3px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--c);border:3px solid var(--panel)}
input[type=range]:disabled{opacity:.4}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;direction:ltr}
.meter i{display:block;height:100%;width:0;background:var(--c);border-radius:4px;transition:width .4s}
.foot{text-align:center;color:var(--mute);font-size:11.5px;padding:18px 0 6px;font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:20px;inset-inline:16px;margin:auto;max-width:360px;padding:11px 16px;background:var(--text);color:var(--bg);border-radius:8px;font-size:13px;opacity:0;transform:translateY(12px);transition:all .25s;pointer-events:none;z-index:300;text-align:center}
.toast.show{opacity:1;transform:none}
.ov{position:fixed;inset:0;background:rgba(8,12,18,.65);backdrop-filter:blur(4px);display:none;place-items:center;z-index:400;padding:24px}
.ov.show{display:grid}
.ov div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center;max-width:320px}
.sp{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite;margin:0 auto 16px}
@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.chips{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <div class="logo">A6</div>
    <div><b>KC868-A6</b><span id="sub">جاري الاتصال...</span></div>
  </div>
  <div class="conn" id="conn"><i class="dot"></i><span id="connTxt">غير متصل</span></div>
  <button class="ib" id="themeBtn" title="تبديل المظهر">🌙</button>
  <button class="ib danger" id="restartBtn">إعادة تشغيل ESP32</button>
</header>

<div class="wrap">
  <div class="chips">
    <div class="chip" id="cWifi"><i></i><div><b>WiFi</b><span>--</span></div></div>
    <div class="chip" id="cFb"><i></i><div><b>Firebase</b><span>--</span></div></div>
    <div class="chip" id="cI2c"><i></i><div><b>I2C</b><span>--</span></div></div>
    <div class="chip" id="cNtp"><i></i><div><b>NTP</b><span>--</span></div></div>
  </div>

  <div class="grid">
    <section class="sec do">
      <div class="sec-h"><h2>المخارج الرقمية</h2><small>DO</small><span class="cnt" id="doCnt">0/6</span></div>
      <div class="sec-b tiles" id="doGrid"></div>
    </section>

    <section class="sec ao">
      <div class="sec-h"><h2>المخارج التناظرية</h2><small>AO</small></div>
      <div class="sec-b" id="aoBox"></div>
    </section>

    <section class="sec di">
      <div class="sec-h"><h2>المداخل الرقمية</h2><small>DI</small><span class="cnt" id="diCnt">0/6</span></div>
      <div class="sec-b tiles" id="diGrid"></div>
    </section>

    <section class="sec ai">
      <div class="sec-h"><h2>المداخل التناظرية</h2><small>AI</small></div>
      <div class="sec-b" id="aiBox"></div>
    </section>
  </div>

  <div class="foot" id="last">آخر تحديث: --:--:--</div>
</div>

<div class="toast" id="toast"></div>
<div class="ov" id="ov"><div><div class="sp"></div><b>جاري إعادة التشغيل...</b><p style="color:var(--mute);font-size:12.5px;margin-top:6px">يرجى الانتظار حتى يعود الجهاز</p></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

const db = getDatabase(initializeApp({ databaseURL: "https://said-rahil-default-rtdb.firebaseio.com" }));
const BASE = "/Said";
const $ = id => document.getElementById(id);
const haptic = () => navigator.vibrate && navigator.vibrate(10);
const st = { DI:{}, DO:{}, AI:{}, AO:{} };
let restarting = false, allOk = false;

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3000); }
function stamp(){ $('last').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-MA-u-nu-latn'); }

// ── Build UI ──
for (let i=1;i<=6;i++){
  const b=document.createElement('button');
  b.className='tile'; b.id='do'+i;
  b.innerHTML=`<span class="n">DO${i}</span><span class="sw"></span><span class="s">مغلق</span>`;
  b.onclick=()=>{ if(restarting) return; haptic(); set(ref(db,`${BASE}/DO/DO${i}`), st.DO['DO'+i]===1?0:1); };
  $('doGrid').appendChild(b);

  const d=document.createElement('div');
  d.className='tile'; d.id='di'+i;
  d.innerHTML=`<span class="n">DI${i}</span><span class="led"></span><span class="s">غير نشط</span>`;
  $('diGrid').appendChild(d);
}
for (let i=1;i<=2;i++){
  $('aoBox').insertAdjacentHTML('beforeend',`
    <div class="row"><div class="row-h"><b>AO${i}</b><span class="val"><span id="aoV${i}">0</span><small>%</small></span></div>
    <input type="range" min="0" max="255" value="0" id="aoS${i}"></div>`);
  const s=$('aoS'+i);
  s.oninput=()=>$('aoV'+i).textContent=Math.round(s.value/255*100);
  s.onchange=()=>{ if(restarting) return; haptic(); set(ref(db,`${BASE}/AO/AO${i}`), parseInt(s.value)); };
}
for (let i=1;i<=4;i++){
  $('aiBox').insertAdjacentHTML('beforeend',`
    <div class="row"><div class="row-h"><b>AI${i}</b><span class="val"><span id="aiV${i}">0</span><small>%</small></span></div>
    <div class="meter"><i id="aiB${i}"></i></div></div>`);
}

// ── Render ──
function renderDO(d){ let n=0; for(let i=1;i<=6;i++){ const on=d['DO'+i]===1; n+=on; const t=$('do'+i); t.classList.toggle('on',on); t.querySelector('.s').textContent=on?'مفتوح':'مغلق'; } $('doCnt').textContent=n+'/6'; }
function renderDI(d){ let n=0; for(let i=1;i<=6;i++){ const on=d['DI'+i]===1; n+=on; const t=$('di'+i); t.classList.toggle('on',on); t.querySelector('.s').textContent=on?'نشط':'غير نشط'; } $('diCnt').textContent=n+'/6'; }
function renderAO(d){ for(let i=1;i<=2;i++){ const v=d['AO'+i]||0, s=$('aoS'+i); if(document.activeElement!==s) s.value=v; $('aoV'+i).textContent=Math.round(v/255*100); } }
function renderAI(d){ for(let i=1;i<=4;i++){ const p=Math.round((d['AI'+i]||0)/4095*100); $('aiB'+i).style.width=p+'%'; $('aiV'+i).textContent=p; } }

function chip(id,ok,txt){
  const c=$(id); c.classList.toggle('ok',ok && !restarting);
  c.querySelector('span').textContent = restarting ? 'إعادة تشغيل...' : (ok?txt:'غير متصل');
}
function setEnabled(on){
  for(let i=1;i<=6;i++) $('do'+i).classList.toggle('off',!on);
  for(let i=1;i<=2;i++) $('aoS'+i).disabled=!on;
}
function setConn(ok,txt){ $('conn').classList.toggle('ok',ok); $('connTxt').textContent=txt; $('sub').textContent=txt; }

// ── Restart ──
$('restartBtn').onclick = async ()=>{
  if(restarting || !confirm('هل تريد إعادة تشغيل ESP32؟')) return;
  haptic(); restarting=true; $('ov').classList.add('show');
  ['DO','DI','AO','AI'].forEach(k=>st[k]={});
  renderDO({});renderDI({});renderAO({});renderAI({});
  ['cWifi','cFb','cI2c','cNtp'].forEach(c=>chip(c,false)); setConn(false,'جاري إعادة التشغيل...'); setEnabled(false);
  try{
    await set(ref(db,`${BASE}/status`),{wifi:0,firebase:0,i2c:0,ntp:0,timestamp:Date.now()});
    await set(ref(db,`${BASE}/restart/command`),"1");
    setTimeout(()=>{ if(restarting){ restarting=false; $('ov').classList.remove('show'); setEnabled(true); toast('انتهت المهلة'); } },30000);
  }catch(e){ console.error(e); restarting=false; $('ov').classList.remove('show'); setEnabled(true); toast('خطأ في الإرسال'); }
};

// ── Firebase listeners ──
onValue(ref(db,`${BASE}/status`), s=>{
  const v=s.val()||{};
  chip('cWifi',v.wifi===1,'الشبكة متصلة'); chip('cFb',v.firebase===1,'السحابة متصلة');
  chip('cI2c',v.i2c===1,'الأجهزة متصلة'); chip('cNtp',v.ntp===1,'الوقت متزامن');
  allOk = v.wifi===1&&v.firebase===1&&v.i2c===1&&v.ntp===1;
  if(!restarting) setConn(allOk, allOk?'متصل — كل الأنظمة تعمل':'بعض الأنظمة غير متصلة');
  stamp();
});
onValue(ref(db,`${BASE}/restart/command`), s=>{
  const v=s.val(), btn=$('restartBtn');
  if(v==="1"||v===1){ btn.disabled=true; }
  else if(v==="0"||v===0){
    if(restarting) setTimeout(()=>{ restarting=false; $('ov').classList.remove('show'); setEnabled(true); toast('ESP32 جاهز'); },3000);
    btn.disabled=false;
  }
});
const bind=(k,fn)=>onValue(ref(db,`${BASE}/${k}`),s=>{ if(restarting) return; st[k]=s.val()||{}; fn(st[k]); stamp(); });
bind('DO',renderDO); bind('DI',renderDI); bind('AO',renderAO); bind('AI',renderAI);

// ── Theme ──
const root=document.documentElement;
function theme(t){ root.setAttribute('data-theme',t); $('themeBtn').textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('theme',t)}catch(e){} }
let saved='light'; try{ saved=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light') }catch(e){}
theme(saved);
$('themeBtn').onclick=()=>{ haptic(); theme(root.getAttribute('data-theme')==='dark'?'light':'dark'); };
</script>
</body>
</html>
