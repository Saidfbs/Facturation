<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>KC868-A6 — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   1. RESET + المتغيرات
   ═══════════════════════════════════════════════════════ */
*,*::before,*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
:root{
  --bg:#eef1f5;
  --panel:#fff;
  --panel2:#f5f7fa;
  --line:#dde3ea;
  --text:#14202e;
  --mute:#6a7a8c;
  --accent:#0b6bcb;
  --accent-l:#e8f1fc;
  --on:#12a150;
  --off:#d64545;
  --out:#0b6bcb;
  --inp:#7a4fd6;
  --ana:#e07a1f;
  --sh:0 1px 2px rgba(15,23,32,.06),0 4px 14px rgba(15,23,32,.05);
  --sh-lg:0 8px 32px rgba(15,23,32,.12);
  --bar-h:40px;
  --bar-r:10px;
  --gap:12px;
}
[data-theme=dark]{
  --bg:#0c121a;
  --panel:#141d29;
  --panel2:#1a2535;
  --line:#243247;
  --text:#e8eef6;
  --mute:#8ea0b6;
  --accent:#4aa3ff;
  --accent-l:#1a2a3f;
  --on:#35c97a;
  --off:#ff6b6b;
  --out:#4aa3ff;
  --inp:#a58bff;
  --ana:#ffa24d;
  --sh:none;
  --sh-lg:0 8px 32px rgba(0,0,0,.4);
}

body{
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
}

/* ═══════════════════════════════════════════════════════
   2. الشريط العلوي (مُبسّط)
   ═══════════════════════════════════════════════════════ */
.bar{
  position:sticky;
  top:0;
  z-index:50;
  width:100%;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:8px;
}

.logo{
  flex-shrink:0;
  width:var(--bar-h);
  height:var(--bar-h);
  border-radius:var(--bar-r);
  border:none;
  font-family:inherit;
  font-weight:700;
  font-size:13px;
  color:#fff;
  direction:ltr;
  cursor:pointer;
  display:grid;
  place-items:center;
  position:relative;
  background:linear-gradient(135deg,var(--off),#a83434);
  box-shadow:0 2px 8px color-mix(in srgb,var(--off) 30%,transparent);
  transition:transform .2s,filter .2s;
}
.logo.online{
  background:linear-gradient(135deg,var(--on),#0d7a3c);
  box-shadow:0 2px 8px color-mix(in srgb,var(--on) 30%,transparent);
}
.logo:active{transform:scale(.94)}
.logo::after{
  content:'';
  position:absolute;
  bottom:-3px;
  right:-3px;
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--off);
  border:2px solid var(--panel);
  transition:background .3s;
}
.logo.online::after{
  background:var(--on);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--on) 30%,transparent)}
  50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--on) 0%,transparent)}
}

.brand{
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:0;
  min-width:0;
}
.brand b{
  font-size:14px;
  line-height:1.15;
  white-space:nowrap;
}
.brand span{
  font-size:10.5px;
  color:var(--mute);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* أيقونات الحالة — على اليسار */
.icons{
  margin-inline-start:auto;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:6px;
}
.ico{
  width:var(--bar-h);
  height:var(--bar-h);
  display:grid;
  place-items:center;
  border-radius:var(--bar-r);
  background:var(--panel2);
  border:1px solid var(--line);
  font-size:15px;
  cursor:help;
  position:relative;
  filter:grayscale(1) opacity(.4);
  transition:all .2s;
}
.ico.on{
  filter:none;
  background:color-mix(in srgb,var(--on) 10%,var(--panel));
  border-color:color-mix(in srgb,var(--on) 40%,var(--line));
}
.ico.on::after{
  content:'';
  position:absolute;
  top:-3px;
  right:-3px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--on);
  border:2px solid var(--panel);
}
.ico::before{
  content:attr(data-tip);
  position:absolute;
  top:calc(100% + 8px);
  right:0;
  padding:6px 10px;
  background:var(--text);
  color:var(--panel);
  border-radius:7px;
  font-size:11px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transform:translateY(-6px);
  transition:all .2s;
  z-index:100;
  font-weight:500;
  box-shadow:var(--sh-lg);
}
.ico:hover::before{opacity:1;transform:translateY(0)}

/* ═══════════════════════════════════════════════════════
   3. النافذة الجانبية
   ═══════════════════════════════════════════════════════ */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(8,12,18,.55);
  backdrop-filter:blur(4px);
  opacity:0;
  visibility:hidden;
  transition:opacity .3s,visibility .3s;
  z-index:90;
}
.overlay.show{
  opacity:1;
  visibility:visible;
}

.drawer{
  position:fixed;
  top:0;
  right:0;
  width:min(340px,85vw);
  height:100vh;
  height:100dvh;
  background:var(--panel);
  box-shadow:var(--sh-lg);
  border-inline-start:1px solid var(--line);
  z-index:100;
  display:flex;
  flex-direction:column;
  right:-100vw;
  transition:right .35s cubic-bezier(.4,0,.2,1);
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
}
.drawer.show{
  right:0;
}
.drawer-head{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
  border-bottom:1px solid var(--line);
}
.drawer-head h2{
  flex:1;
  font-size:15px;
  font-weight:600;
}
.drawer-close{
  width:34px;
  height:34px;
  border-radius:9px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  font-size:16px;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:all .2s;
}
.drawer-close:hover{
  background:var(--off);
  color:#fff;
  border-color:var(--off);
}
.drawer-close:active{transform:scale(.92)}

.drawer-body{
  flex:1;
  overflow-y:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.drawer-section{
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  background:var(--panel2);
}
.drawer-section h3{
  font-size:11.5px;
  font-weight:600;
  color:var(--mute);
  margin-bottom:10px;
  text-transform:uppercase;
  letter-spacing:.6px;
}

/* زر النافذة */
.drawer-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--panel);
  color:var(--text);
  font-family:inherit;
  font-size:13.5px;
  font-weight:500;
  cursor:pointer;
  text-align:start;
  transition:all .2s;
}
.drawer-btn:hover{
  background:var(--panel2);
  border-color:var(--accent);
}
.drawer-btn .ic{
  flex-shrink:0;
  width:34px;
  height:34px;
  font-size:19px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:var(--panel2);
}
.drawer-btn .txt{flex:1}
.drawer-btn .sub{
  display:block;
  margin-top:2px;
  font-size:11px;
  font-weight:400;
  color:var(--mute);
}

/* ⭐ Segmented داخل النافذة */
.segmented-wrap{
  display:flex;
  width:100%;
  padding:4px;
  gap:4px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
}
.segmented-wrap button{
  flex:1;
  height:42px;
  border:none;
  background:transparent;
  color:var(--mute);
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:all .25s;
  white-space:nowrap;
}
.segmented-wrap button:hover{
  background:var(--panel2);
  color:var(--text);
}
.segmented-wrap button.act{
  background:var(--accent);
  color:#fff;
  box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent);
}
.segmented-wrap button .ic{font-size:15px;line-height:1}

/* قسم المزامنة */
.sync-group{display:flex;flex-direction:column;gap:10px}
.sync-row{display:flex;align-items:center;gap:10px}
.sync-row label{flex-shrink:0;font-size:12.5px;font-weight:600}
.sync-row .num{
  flex:1;
  height:42px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:11px;
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  text-align:center;
  direction:ltr;
  font-variant-numeric:tabular-nums;
}
.sync-row .num:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-l);
}
.sync-row .unit{flex-shrink:0;font-size:12px;color:var(--mute)}
.sync-save{
  height:42px;
  border-radius:11px;
  background:var(--accent);
  color:#fff;
  border:none;
  font-family:inherit;
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  transition:filter .2s;
}
.sync-save:hover{filter:brightness(1.08)}
.sync-save:active{transform:scale(.98)}
.sync-save:disabled{opacity:.5;cursor:not-allowed}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.pre{
  height:32px;
  padding:0 12px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:99px;
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  font-variant-numeric:tabular-nums;
  transition:all .2s;
}
.pre:hover{border-color:var(--accent);background:var(--accent-l)}
.pre.act{background:var(--accent);color:#fff;border-color:var(--accent)}
.pre:disabled{opacity:.5;cursor:not-allowed}
.sync-info{
  font-size:11.5px;
  color:var(--mute);
  text-align:center;
  padding:9px;
  background:var(--panel);
  border-radius:10px;
  border:1px dashed var(--line);
}
.sync-info b{color:var(--accent);font-size:14px;font-variant-numeric:tabular-nums}
.hint{font-size:11px;color:var(--mute);line-height:1.6}

/* ═══════════════════════════════════════════════════════
   4. الحاوية الرئيسية
   ═══════════════════════════════════════════════════════ */
.wrap{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:var(--gap);
}

.view{display:none}
.view.act{display:block}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gap);
}
.col{
  display:flex;
  flex-direction:column;
  gap:var(--gap);
}

.sec{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--sh);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.sec-h{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 15px;
  border-bottom:1px solid var(--line);
  border-inline-start:4px solid var(--c);
}
.sec-h h2{flex:1;font-size:13.5px;font-weight:600}
.sec-h small{font-size:11px;color:var(--mute);font-weight:500}
.cnt{
  font-size:11px;
  font-weight:700;
  padding:3px 10px;
  border-radius:99px;
  background:color-mix(in srgb,var(--c) 14%,transparent);
  color:var(--c);
  font-variant-numeric:tabular-nums;
}
.sec-b{padding:12px;display:flex;flex-direction:column;gap:10px}
.sec.do{--c:var(--out)}
.sec.ao{--c:var(--ana)}
.sec.di{--c:var(--inp)}
.sec.ai{--c:var(--ana)}

/* DO / DI tiles */
.tiles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.tile{
  border:1px solid var(--line);
  background:var(--panel2);
  border-radius:10px;
  padding:11px 6px;
  text-align:center;
  font-family:inherit;
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  transition:all .2s;
}
button.tile{cursor:pointer}
button.tile:hover{transform:translateY(-2px);box-shadow:var(--sh)}
button.tile:active{transform:translateY(0) scale(.97)}
.tile .n{font-size:11.5px;font-weight:700;color:var(--mute);direction:ltr;letter-spacing:.5px}
.tile .s{font-size:11px;font-weight:600;color:var(--mute);transition:color .2s}
.sw{
  width:44px;
  height:24px;
  border-radius:99px;
  background:var(--line);
  position:relative;
  transition:background .25s;
}
.sw::after{
  content:'';
  position:absolute;
  top:3px;
  right:3px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
  transition:right .25s;
}
.tile.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.tile.on .sw{background:var(--c)}
.tile.on .sw::after{right:23px}
.tile.on .s{color:var(--c)}
.tile.off{opacity:.45;pointer-events:none}

.led{
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--line);
  border:2px solid var(--line);
  transition:all .3s;
}
.tile.on .led{
  background:var(--c);
  border-color:var(--c);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent);
}

/* AO / AI rows */
.row{
  border:1px solid var(--line);
  background:var(--panel2);
  border-radius:10px;
  padding:12px 14px;
}
.row-h{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:10px;
}
.row-h b{font-size:12.5px;direction:ltr;letter-spacing:.5px}
.val{
  font-size:22px;
  font-weight:700;
  color:var(--c);
  font-variant-numeric:tabular-nums;
}
.val small{font-size:11.5px;color:var(--mute);margin-inline-start:3px;font-weight:500}
input[type=range]{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:7px;
  border-radius:4px;
  background:var(--line);
  outline:none;
  direction:ltr;
  cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--c);
  border:3px solid var(--panel);
  box-shadow:0 2px 6px rgba(0,0,0,.25);
  cursor:grab;
}
input[type=range]::-moz-range-thumb{
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--c);
  border:3px solid var(--panel);
  cursor:grab;
}
input[type=range]:disabled{opacity:.4}

.meter{
  height:9px;
  border-radius:5px;
  background:var(--line);
  overflow:hidden;
  direction:ltr;
}
.meter i{
  display:block;
  height:100%;
  width:0;
  background:var(--c);
  border-radius:5px;
  transition:width .5s;
}

/* Footer */
.foot{
  text-align:center;
  color:var(--mute);
  font-size:11px;
  padding:16px 0 6px;
  font-variant-numeric:tabular-nums;
}

/* Toast */
.toast{
  position:fixed;
  bottom:20px;
  left:16px;
  right:16px;
  margin:auto;
  max-width:380px;
  padding:12px 18px;
  background:var(--text);
  color:var(--bg);
  border-radius:12px;
  font-size:13px;
  font-weight:500;
  opacity:0;
  transform:translateY(16px);
  transition:all .3s;
  pointer-events:none;
  z-index:300;
  text-align:center;
  box-shadow:var(--sh-lg);
}
.toast.show{opacity:1;transform:translateY(0)}

.loading{
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid currentColor;
  border-top-color:transparent;
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin-inline-end:6px;
  vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════════════════════════════════════════════════════
   5. استجابة الشاشة
   ═══════════════════════════════════════════════════════ */

@media(max-width:820px){
  .grid{grid-template-columns:1fr}
}

/* الجوال — ارتفاع كامل */
@media(max-width:768px){
  html,body{
    height:100%;
    overflow:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }

  .bar{
    flex-shrink:0;
  }

  .wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    max-width:none;
    padding:8px;
    gap:8px;
    overflow:hidden;
  }

  .view.act{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .grid{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:0;
  }

  .col{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:0;
  }

  .sec{
    flex:1;
    min-height:0;
  }

  .sec-b{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:stretch;
    padding:8px;
    overflow:hidden;
  }

  .tiles{
    flex:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:6px;
    min-height:0;
  }
  .tile{
    justify-content:center;
    padding:6px 4px;
    gap:5px;
    min-height:0;
  }
  .tile .n{font-size:11px}
  .tile .s{font-size:10px}
  .sw{width:40px;height:22px}
  .sw::after{width:16px;height:16px;top:3px;right:3px}
  .tile.on .sw::after{right:21px}
  .led{width:20px;height:20px}

  .sec-b > .row{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:0;
  }

  .foot{
    flex-shrink:0;
    padding:4px 0 2px;
    font-size:10.5px;
  }
}

@media(max-width:520px){
  :root{
    --bar-h:36px;
    --bar-r:9px;
  }
  .brand span{display:none}
}

@media(max-width:380px){
  :root{
    --bar-h:34px;
    --bar-r:8px;
  }
  .ico{font-size:13px}
  .logo{font-size:11px}

  .tiles{gap:5px}
  .tile{padding:4px 3px;gap:4px}
  .tile .n{font-size:10px}
  .tile .s{font-size:9.5px}
  .sw{width:34px;height:19px}
  .sw::after{width:13px;height:13px}
  .tile.on .sw::after{right:18px}
  .led{width:16px;height:16px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    animation:none!important;
  }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     الشريط العلوي — مُبسّط
     ═══════════════════════════════════════════════════════ -->
<header class="bar">
  <button class="logo" id="menuBtn" type="button" aria-label="الإعدادات">A6</button>

  <div class="brand">
    <b>KC868-A6</b>
    <span id="lastUpdate">--:--:--</span>
  </div>

  <div class="icons">
    <div class="ico" id="icoWifi" data-tip="WiFi">📶</div>
    <div class="ico" id="icoFb" data-tip="Firebase">☁️</div>
    <div class="ico" id="icoI2c" data-tip="I2C">🔌</div>
    <div class="ico" id="icoNtp" data-tip="NTP">🕐</div>
  </div>
</header>

<!-- ═══════════════════════════════════════════════════════
     النافذة الجانبية
     ═══════════════════════════════════════════════════════ -->
<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>⚙️ الإعدادات</h2>
    <button class="drawer-close" id="closeDrawer" type="button" aria-label="إغلاق">✕</button>
  </div>

  <div class="drawer-body">

    <!-- المظهر -->
    <div class="drawer-section">
      <h3>🎨 المظهر</h3>
      <button class="drawer-btn" id="themeBtn" type="button">
        <span class="ic" id="themeIcon">🌙</span>
        <span class="txt">
          الوضع الليلي
          <span class="sub" id="themeSub">اضغط للتفعيل</span>
        </span>
      </button>
    </div>

    <!-- ⭐ طريقة العرض (جديد) -->
    <div class="drawer-section">
      <h3>📊 طريقة العرض</h3>
      <div class="segmented-wrap" id="segmented">
        <button type="button" class="act" data-view="digital">
          <span class="ic">📊</span>
          <span>الرقمي</span>
        </button>
        <button type="button" data-view="analog">
          <span class="ic">📈</span>
          <span>التناظري</span>
        </button>
      </div>
    </div>

    <!-- مدة المزامنة -->
    <div class="drawer-section">
      <h3>⏱️ مدة المزامنة</h3>
      <div class="sync-group">
        <div class="sync-row">
          <label for="syncInp">المدة</label>
          <input class="num" type="number" id="syncInp" min="5" max="600" step="1" inputmode="numeric" value="5">
          <span class="unit">ث</span>
        </div>
        <button class="sync-save" id="syncSave" type="button">💾 حفظ</button>
        <div class="presets" id="presets"></div>
        <div class="sync-info">القيمة الحالية: <b id="syncCur">--</b> ث</div>
        <div class="hint">من 5 إلى 600 ثانية. تُطبَّق في المزامنة التالية، وتُحفظ في EEPROM.</div>
      </div>
    </div>

  </div>
</aside>

<!-- ═══════════════════════════════════════════════════════
     المحتوى
     ═══════════════════════════════════════════════════════ -->
<div class="wrap">

  <div class="view act" id="viewDigital">
    <div class="grid">
      <div class="col">
        <section class="sec do">
          <div class="sec-h">
            <h2>المخارج الرقمية</h2>
            <small>DO</small>
            <span class="cnt" id="doCnt">0/6</span>
          </div>
          <div class="sec-b tiles" id="doGrid"></div>
        </section>

        <section class="sec di">
          <div class="sec-h">
            <h2>المداخل الرقمية</h2>
            <small>DI</small>
            <span class="cnt" id="diCnt">0/6</span>
          </div>
          <div class="sec-b tiles" id="diGrid"></div>
        </section>
      </div>
    </div>
  </div>

  <div class="view" id="viewAnalog">
    <div class="grid">
      <div class="col">
        <section class="sec ao">
          <div class="sec-h">
            <h2>المخارج التناظرية</h2>
            <small>AO</small>
          </div>
          <div class="sec-b" id="aoBox"></div>
        </section>

        <section class="sec ai">
          <div class="sec-h">
            <h2>المداخل التناظرية</h2>
            <small>AI</small>
          </div>
          <div class="sec-b" id="aiBox"></div>
        </section>
      </div>
    </div>
  </div>

  <div class="foot" id="last">آخر تحديث: --:--:--</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

const db = getDatabase(initializeApp({
  databaseURL: "https://said-rahil-default-rtdb.firebaseio.com"
}));

const BASE = "/Said";
const $ = id => document.getElementById(id);
const haptic = (ms = 10) => navigator.vibrate && navigator.vibrate(ms);
const st = { DI: {}, DO: {}, AI: {}, AO: {} };
const SYNC_MIN = 5;
const SYNC_MAX = 600;
const PRESETS = [5, 10, 30, 60, 120];

function toast(m){
  const t = $('toast');
  t.textContent = m;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3000);
}

function updateTime(){
  const time = new Date().toLocaleTimeString('ar-MA-u-nu-latn');
  $('lastUpdate').textContent = time;
  $('last').textContent = 'آخر تحديث: ' + time;
}

/* ═══════════════════════════════════════════════════
   View Switch (داخل النافذة)
   ═══════════════════════════════════════════════════ */
const segButtons = document.querySelectorAll('#segmented button');
const viewDigital = $('viewDigital');
const viewAnalog = $('viewAnalog');

function switchView(view){
  segButtons.forEach(b => b.classList.toggle('act', b.dataset.view === view));
  viewDigital.classList.toggle('act', view === 'digital');
  viewAnalog.classList.toggle('act', view === 'analog');
  try{ localStorage.setItem('view', view); }catch(e){}
  haptic();
}

segButtons.forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

let savedView = 'digital';
try{ savedView = localStorage.getItem('view') || 'digital'; }catch(e){}
if(!['digital','analog'].includes(savedView)) savedView = 'digital';
switchView(savedView);

/* ═══════════════════════════════════════════════════
   Drawer
   ═══════════════════════════════════════════════════ */
function openDrawer(){
  $('drawer').classList.add('show');
  $('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
  haptic();
}
function closeDrawer(){
  $('drawer').classList.remove('show');
  $('overlay').classList.remove('show');
  document.body.style.overflow = '';
}

$('menuBtn').addEventListener('click', openDrawer);
$('closeDrawer').addEventListener('click', closeDrawer);
$('overlay').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeDrawer();
});

/* ═══════════════════════════════════════════════════
   DO / DI
   ═══════════════════════════════════════════════════ */
for(let i = 1; i <= 6; i++){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'tile';
  b.id = 'do' + i;
  b.innerHTML = `<span class="n">DO${i}</span><span class="sw"></span><span class="s">مغلق</span>`;
  b.addEventListener('click', async () => {
    haptic();
    const val = st.DO['DO' + i] === 1 ? 0 : 1;
    try{ await set(ref(db, `${BASE}/DO/DO${i}`), val); }
    catch(e){ console.error(e); toast('تعذّر الإرسال'); }
  });
  $('doGrid').appendChild(b);

  const d = document.createElement('div');
  d.className = 'tile';
  d.id = 'di' + i;
  d.innerHTML = `<span class="n">DI${i}</span><span class="led"></span><span class="s">غير نشط</span>`;
  $('diGrid').appendChild(d);
}

/* ═══════════════════════════════════════════════════
   AO / AI
   ═══════════════════════════════════════════════════ */
for(let i = 1; i <= 2; i++){
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `
    <div class="row-h">
      <b>AO${i}</b>
      <span class="val"><span id="aoV${i}">0</span><small>%</small></span>
    </div>
    <input type="range" min="0" max="255" value="0" id="aoS${i}">
  `;
  $('aoBox').appendChild(div);
  const s = $('aoS' + i);
  s.addEventListener('input', () => {
    $('aoV' + i).textContent = Math.round(s.value / 255 * 100);
  });
  s.addEventListener('change', async () => {
    haptic();
    try{ await set(ref(db, `${BASE}/AO/AO${i}`), parseInt(s.value)); }
    catch(e){ console.error(e); toast('تعذّر الإرسال'); }
  });
}

for(let i = 1; i <= 4; i++){
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `
    <div class="row-h">
      <b>AI${i}</b>
      <span class="val"><span id="aiV${i}">0</span><small>%</small></span>
    </div>
    <div class="meter"><i id="aiB${i}"></i></div>
  `;
  $('aiBox').appendChild(div);
}

/* ═══════════════════════════════════════════════════
   Sync interval
   ═══════════════════════════════════════════════════ */
let syncCurrent = null;

PRESETS.forEach(v => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'pre';
  b.dataset.v = v;
  b.textContent = v + ' ث';
  b.addEventListener('click', () => {
    $('syncInp').value = v;
    saveSync();
  });
  $('presets').appendChild(b);
});

function markPreset(){
  document.querySelectorAll('.pre').forEach(b => {
    b.classList.toggle('act', Number(b.dataset.v) === syncCurrent);
  });
}

async function saveSync(){
  const raw = $('syncInp').value.trim();
  const v = Number(raw);
  if(raw === '' || !Number.isInteger(v) || v < SYNC_MIN || v > SYNC_MAX){
    toast(`أدخل رقماً بين ${SYNC_MIN} و ${SYNC_MAX}`);
    return;
  }
  haptic();
  const btn = $('syncSave');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>جاري الحفظ...';
  try{
    await set(ref(db, `${BASE}/status/sync_interval`), v);
    toast(`تم الحفظ: ${v} ثانية`);
  }catch(e){
    console.error(e);
    toast('تعذّر الحفظ');
  }
  btn.disabled = false;
  btn.textContent = '💾 حفظ';
}

$('syncSave').addEventListener('click', saveSync);
$('syncInp').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); saveSync(); }
});

onValue(ref(db, `${BASE}/status/sync_interval`), s => {
  const v = Number(s.val());
  if(s.val() === null || Number.isNaN(v)){
    syncCurrent = null;
    $('syncCur').textContent = '--';
    markPreset();
    return;
  }
  syncCurrent = v;
  $('syncCur').textContent = v;
  if(document.activeElement !== $('syncInp')){
    $('syncInp').value = v;
  }
  markPreset();
});

/* ═══════════════════════════════════════════════════
   Render
   ═══════════════════════════════════════════════════ */
function renderDO(d){
  let n = 0;
  for(let i = 1; i <= 6; i++){
    const on = d['DO' + i] === 1;
    n += on;
    const t = $('do' + i);
    if(!t) continue;
    t.classList.toggle('on', on);
    t.querySelector('.s').textContent = on ? 'مفتوح' : 'مغلق';
  }
  $('doCnt').textContent = n + '/6';
}

function renderDI(d){
  let n = 0;
  for(let i = 1; i <= 6; i++){
    const on = d['DI' + i] === 1;
    n += on;
    const t = $('di' + i);
    if(!t) continue;
    t.classList.toggle('on', on);
    t.querySelector('.s').textContent = on ? 'نشط' : 'غير نشط';
  }
  $('diCnt').textContent = n + '/6';
}

function renderAO(d){
  for(let i = 1; i <= 2; i++){
    const v = d['AO' + i] || 0;
    const s = $('aoS' + i);
    if(!s) continue;
    if(document.activeElement !== s) s.value = v;
    $('aoV' + i).textContent = Math.round(v / 255 * 100);
  }
}

function renderAI(d){
  for(let i = 1; i <= 4; i++){
    const p = Math.round((d['AI' + i] || 0) / 4095 * 100);
    const bar = $('aiB' + i);
    if(bar) bar.style.width = p + '%';
    const val = $('aiV' + i);
    if(val) val.textContent = p;
  }
}

function updateIcon(id, ok, onText, offText){
  const el = $(id);
  if(!el) return;
  el.classList.toggle('on', ok);
  const prefix = el.dataset.tip.split(':')[0];
  el.dataset.tip = prefix + ': ' + (ok ? onText : offText);
}

/* ═══════════════════════════════════════════════════
   Firebase listeners
   ═══════════════════════════════════════════════════ */
onValue(ref(db, `${BASE}/status`), s => {
  const v = s.val() || {};
  const wifiOK = v.wifi === 1;
  const fbOK   = v.firebase === 1;
  const i2cOK  = v.i2c === 1;
  const ntpOK  = v.ntp === 1;

  updateIcon('icoWifi', wifiOK, 'الشبكة متصلة', 'الشبكة غير متصلة');
  updateIcon('icoFb', fbOK, 'السحابة متصلة', 'السحابة غير متصلة');
  updateIcon('icoI2c', i2cOK, 'الأجهزة متصلة', 'الأجهزة غير متصلة');
  updateIcon('icoNtp', ntpOK, 'الوقت متزامن', 'الوقت غير متزامن');

  const allOk = wifiOK && fbOK && i2cOK && ntpOK;
  $('menuBtn').classList.toggle('online', allOk);
  updateTime();
});

const bind = (k, fn) => onValue(ref(db, `${BASE}/${k}`), s => {
  st[k] = s.val() || {};
  fn(st[k]);
  updateTime();
});

bind('DO', renderDO);
bind('DI', renderDI);
bind('AO', renderAO);
bind('AI', renderAI);

/* ═══════════════════════════════════════════════════
   Theme
   ═══════════════════════════════════════════════════ */
const root = document.documentElement;

function theme(t){
  root.setAttribute('data-theme', t);
  const isDark = t === 'dark';
  $('themeIcon').textContent = isDark ? '☀️' : '🌙';
  $('themeSub').textContent = isDark ? 'اضغط للتبديل إلى النهاري' : 'اضغط للتبديل إلى الليلي';
  try{ localStorage.setItem('theme', t); }catch(e){}
}

let savedTheme = 'light';
try{
  savedTheme = localStorage.getItem('theme')
    || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
}catch(e){}
theme(savedTheme);

$('themeBtn').addEventListener('click', () => {
  haptic();
  theme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
</script>
</body>
</html>
