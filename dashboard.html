<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f4">
<meta name="description" content="لوحة تحكم KC868-A6">
<title>KC868-A6 — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef1f4;--panel:#fff;--well:#e4e9ee;--line:#d3dae2;
  --ink:#14202b;--ink2:#4a5b6b;--ink3:#7d8d9c;
  --sig:#0b8f8c;--sig-bg:#d6f0ef;
  --amber:#d98a00;--amber-bg:#fdf0d2;
  --red:#d1362f;--red-bg:#fbe0de;
  --grn:#1a9a52;--grn-bg:#d8f3e3;
  --sans:'Tajawal',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
  --h-btn:48px;--r-btn:10px;
}
[data-theme=dark]{
  --bg:#0d141b;--panel:#16212b;--well:#0b1118;--line:#26343f;
  --ink:#e6edf3;--ink2:#a5b4c1;--ink3:#6c7d8c;
  --sig:#2dd4cf;--sig-bg:#0f3a3b;
  --amber:#f5b83d;--amber-bg:#3d2e0b;
  --red:#ff6b61;--red-bg:#451a18;
  --grn:#3ddc84;--grn-bg:#0f3a22;
}
html,body{height:100%}
body{
  font:500 14px/1.6 var(--sans);background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;min-height:100dvh;
  overflow-x:hidden;transition:background .25s;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{font:inherit;color:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}

/* ═══ TOP ═══ */
.top{
  position:sticky;top:0;z-index:50;background:var(--bg);
  padding:calc(var(--top) + 10px) 12px 10px;
  display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);
}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:15px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font-size:11px;color:var(--ink3);font-weight:700}
.hb{
  width:var(--h-btn);height:var(--h-btn);border-radius:var(--r-btn);
  display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);
  color:var(--ink2);transition:.15s;position:relative;flex:none;
}
.hb:active{transform:scale(.94)}
.hb.active{background:var(--sig-bg);color:var(--sig);border-color:var(--sig)}
.hb .ic{width:20px;height:20px}
.hb .nb{
  position:absolute;top:-4px;inset-inline-end:-4px;
  min-width:18px;height:18px;border-radius:99px;
  background:var(--red);color:#fff;
  font:700 10px/18px var(--mono);text-align:center;
  padding:0 4px;display:none;
  box-shadow:0 0 0 2px var(--bg);
}
.hb.has-badge .nb{display:block}
.hb.muted .nb{display:none!important}

/* مؤشر الاتصال الصغير داخل زر اختيار الجهاز */
.hb .conn-led{
  position:absolute;bottom:3px;inset-inline-end:3px;
  width:8px;height:8px;border-radius:50%;
  background:var(--ink3);
  box-shadow:0 0 0 2px var(--panel);
  transition:.2s;
}
.hb .conn-led.on{background:var(--grn)}
.hb .conn-led.warn{background:var(--amber)}
.hb .conn-led.bad{background:var(--red)}

.led{width:9px;height:9px;border-radius:50%;background:var(--ink3);transition:.2s}
.led.on{background:var(--grn);box-shadow:0 0 0 3px var(--grn-bg),0 0 8px var(--grn)}
.led.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.led.bad{background:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.banner{display:none;background:var(--amber);color:#1b1300;text-align:center;font-weight:800;font-size:12px;padding:6px}
.banner.show{display:block}

/* ═══ TOAST ═══ */
.toast{
  position:fixed;
  top:calc(var(--top) + 72px);
  inset-inline:16px;margin:auto;
  width:fit-content;max-width:calc(100% - 32px);
  z-index:120;padding:12px 20px;border-radius:14px;
  background:#14202b;color:#fff;
  font-weight:800;font-size:13px;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0;transform:translateY(-14px);
  pointer-events:none;
  transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:#12683a}
.toast.error{background:#a02a24}
.toast.warn{background:#8a5a00}
[data-theme=dark] .toast{box-shadow:0 8px 24px rgba(0,0,0,.6)}

/* ═══ MAIN ═══ */
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:14px 14px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.page{display:none}.page.active{display:block;animation:in .2s}
@keyframes in{from{opacity:0}to{opacity:1}}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px;font-size:13px;font-weight:800;color:var(--ink2)}
.sec:first-child{margin-top:4px}
.cnt{font:600 12px var(--mono);background:var(--well);border-radius:6px;padding:2px 8px;color:var(--ink2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}

/* ═══ RELAY ═══ */
.rel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.rel.on{border-color:var(--sig);background:linear-gradient(var(--sig-bg),var(--panel) 70%)}
.rel-h{display:flex;align-items:center;gap:8px}
.rel-n{flex:1;min-width:0;text-align:start;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel-id{font:600 10.5px var(--mono);color:var(--ink3)}
.sch{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);border:1px solid var(--line)}
.sch.active{color:var(--amber);background:var(--amber-bg);border-color:transparent}
.sw{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 6px 0 14px;border-radius:12px;background:var(--well);font-weight:800;color:var(--ink2);transition:.2s}
.sw .knob{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--ink3);transition:.2s}
.rel.on .sw{background:var(--sig);color:#fff}
.rel.on .sw .knob{background:#fff;color:var(--sig);border-color:transparent}
.sw:active .knob{transform:scale(.92)}
.prev{font:600 10.5px var(--mono);color:var(--amber);min-height:15px}
.bar2{display:flex;gap:10px;margin-top:10px}

/* ═══ DIGITAL IN ═══ */
.di{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700}
.di .s{margin-inline-start:auto;font-size:12px;color:var(--ink3)}
.di.on{border-color:var(--grn)}.di.on .s{color:var(--grn)}

/* ═══ ANALOG ═══ */
.an-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-weight:800}
.an-h .mono{font-size:20px;color:var(--sig)}
.rs{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;direction:ltr;outline:0;--p:0%;background:linear-gradient(to right,var(--sig) var(--p),var(--well) var(--p))}
.rs::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:8px;background:var(--panel);border:3px solid var(--sig);cursor:pointer}
.rs::-moz-range-thumb{width:22px;height:22px;border-radius:8px;background:var(--panel);border:3px solid var(--sig);cursor:pointer}
.pre{display:flex;gap:6px;margin-top:12px}
.pre button{flex:1;height:36px;border-radius:8px;background:var(--well);font:600 12px var(--mono);color:var(--ink2)}
.pre button:active{background:var(--sig-bg);color:var(--sig)}
.meter{height:12px;border-radius:99px;background:var(--well);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:99px;transition:width .4s,background .3s}
.spark{width:100%;height:34px;margin-top:10px;display:block}
.spark polyline{fill:none;stroke:var(--sig);stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}

/* ═══ BUTTONS ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:12px;font-weight:800;font-size:14px;background:var(--panel);border:1px solid var(--line);padding:0 12px}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--sig);border-color:transparent;color:#fff}
[data-theme=dark] .btn.p{color:#04201f}
.btn.s{background:var(--sig-bg);color:var(--sig);border-color:transparent}
.btn.d{background:var(--red-bg);color:var(--red);border-color:transparent}
.btn.sm{height:42px;font-size:13px}
.bg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.f input,.f select{width:100%;height:46px;background:var(--well);border:1px solid transparent;border-radius:10px;padding:0 10px;text-align:center;font:600 15px var(--mono)}
.f input[type=text]{direction:ltr;text-align:start;font-family:var(--sans)}
.f input:focus{outline:0;border-color:var(--sig);background:var(--panel)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--well);padding:4px;border-radius:12px}
.seg button{height:42px;border-radius:9px;font-weight:800;color:var(--ink2)}
.seg button.active{background:var(--panel);color:var(--sig);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* ═══ KV ═══ */
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:700px){.kv{grid-template-columns:repeat(4,1fr)}}
.k{background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.k .l{font-size:11px;color:var(--ink3);font-weight:700}
.k .v{font:600 13px var(--mono);direction:ltr;text-align:start;overflow-wrap:anywhere}
.k.ok{border-inline-start-color:var(--grn)}.k.warn{border-inline-start-color:var(--amber)}.k.err{border-inline-start-color:var(--red)}
.k.ok .v{color:var(--grn)}.k.warn .v{color:var(--amber)}.k.err .v{color:var(--red)}

/* ═══ LOG ═══ */
.ev{display:grid;grid-template-columns:64px 1fr 36px;gap:8px;align-items:center;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--sig);border-radius:10px;margin-bottom:6px;font-size:13px}
.ev.success{border-inline-start-color:var(--grn)}.ev.warn{border-inline-start-color:var(--amber)}.ev.error{border-inline-start-color:var(--red)}
.ev time{font:600 11px var(--mono);color:var(--ink3)}
.ev button{width:36px;height:36px;color:var(--ink3);display:grid;place-items:center;border-radius:8px}
.ev button:active{background:var(--well)}
.empty{text-align:center;color:var(--ink3);padding:26px;font-size:13px}

/* ═══ DEVICE PICK ITEM (اختيار فقط) ═══ */
.dev-pick-item{
  display:flex;align-items:center;gap:12px;
  width:100%;
  padding:14px;
  background:var(--well);
  border:1.5px solid transparent;
  border-radius:12px;
  margin-bottom:8px;
  cursor:pointer;
  text-align:start;
  transition:.15s;
}
.dev-pick-item:last-child{margin-bottom:0}
.dev-pick-item:active{transform:scale(.98)}
.dev-pick-item.active{
  border-color:var(--sig);
  background:var(--sig-bg);
}
.dev-pick-item .led{
  width:10px;height:10px;
  background:var(--ink3);
  flex:none;
}
.dev-pick-item.active .led{
  background:var(--grn);
  box-shadow:0 0 0 3px var(--grn-bg),0 0 8px var(--grn);
}
.dev-pick-item .t{flex:1;min-width:0}
.dev-pick-item strong{
  display:block;font-size:14px;font-weight:800;
  color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dev-pick-item small{
  display:block;font:500 11px var(--mono);color:var(--ink3);
  direction:ltr;text-align:start;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dev-pick-item .check{
  width:28px;height:28px;
  display:grid;place-items:center;
  color:var(--sig);
  flex:none;
  opacity:0;
  transition:.15s;
}
.dev-pick-item.active .check{opacity:1}
.dev-pick-item .check .ic{width:24px;height:24px}
.dev-pick-item .badge-active{
  font:800 10px var(--mono);
  padding:3px 8px;
  border-radius:99px;
  background:var(--sig);
  color:#fff;
  flex:none;
}
[data-theme=dark] .dev-pick-item .badge-active{color:#04201f}

/* ═══ DEVICE MANAGE ITEM (إدارة) ═══ */
.dev-manage-item{
  display:flex;align-items:center;gap:12px;
  width:100%;
  padding:14px;
  background:var(--well);
  border:1.5px solid transparent;
  border-radius:12px;
  margin-bottom:8px;
  text-align:start;
  transition:.15s;
}
.dev-manage-item:last-child{margin-bottom:0}
.dev-manage-item.active{
  border-color:var(--sig);
  background:var(--sig-bg);
}
.dev-manage-item .led{
  width:10px;height:10px;
  background:var(--ink3);
  flex:none;
}
.dev-manage-item.active .led{
  background:var(--grn);
  box-shadow:0 0 0 3px var(--grn-bg),0 0 8px var(--grn);
}
.dev-manage-item .t{flex:1;min-width:0}
.dev-manage-item strong{
  display:block;font-size:14px;font-weight:800;
  color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dev-manage-item small{
  display:block;font:500 11px var(--mono);color:var(--ink3);
  direction:ltr;text-align:start;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dev-manage-item .ib{
  width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);color:var(--ink2);flex:none;
}
.dev-manage-item .ib:active{transform:scale(.92)}

/* ═══ BOTTOM NAV ═══ */
.bottom-nav{position:sticky;bottom:0;z-index:60;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + var(--bot));flex:none;box-shadow:0 -2px 8px rgba(0,0,0,.04)}
.bn-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;border-radius:10px;color:var(--ink3);font-size:11px;font-weight:800;position:relative;transition:.15s;border:1.5px solid transparent;background:transparent;min-height:58px}
.bn-btn:active{transform:scale(.96)}
.bn-btn.active{color:var(--sig);background:var(--sig-bg);border-color:var(--sig)}
.bn-btn .ic{width:22px;height:22px}

/* ═══ MODAL ═══ */
.modal{
  position:fixed;inset:0;z-index:100;
  display:none;
  align-items:center;justify-content:center;
  background:rgba(5,12,18,.6);
  padding:20px;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
.modal.show{display:flex;animation:modalFade .18s ease}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.box{
  width:100%;max-width:480px;
  background:var(--panel);
  border-radius:20px;
  padding:18px;
  max-height:90dvh;
  overflow-y:auto;
  animation:popIn .22s cubic-bezier(.2,.8,.3,1);
  border:1px solid var(--line);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
@keyframes popIn{from{transform:scale(.94);opacity:0}}

@media(max-height:600px){
  .modal{align-items:flex-start;padding-top:20px;padding-bottom:20px}
  .box{max-height:calc(100dvh - 40px)}
}

.mh{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-weight:800}
.tg{width:56px;height:32px;border-radius:99px;background:var(--well);position:relative;transition:.2s;border:1px solid var(--line);cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--ink3);transition:.2s}
.tg.on{background:var(--sig);border-color:transparent}
.tg.on::after{inset-inline-start:27px;background:#fff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0 12px}
.day{padding:11px 0;border-radius:9px;background:var(--well);font-size:12px;font-weight:800;text-align:center;color:var(--ink2);cursor:pointer}
.day.active{background:var(--sig);color:#fff}

/* ═══ CONFIRM MODAL ═══ */
.confirm-modal{
  position:fixed;inset:0;z-index:200;
  display:none;align-items:center;justify-content:center;
  background:rgba(5,12,18,.55);
  padding:20px;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
.confirm-modal.show{display:flex;animation:cfFade .18s ease}
@keyframes cfFade{from{opacity:0}to{opacity:1}}
.confirm-box{
  width:100%;max-width:400px;
  background:var(--panel);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px 20px 18px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:popIn .22s cubic-bezier(.2,.8,.3,1);
  text-align:center;
}
.confirm-icon{
  width:64px;height:64px;border-radius:50%;
  margin:0 auto 12px;
  display:grid;place-items:center;
  background:var(--sig-bg);color:var(--sig);
}
.confirm-icon.warn{background:var(--amber-bg);color:var(--amber)}
.confirm-icon.danger{background:var(--red-bg);color:var(--red)}
.confirm-icon .ic{width:32px;height:32px;stroke-width:2}
.confirm-title{font-size:16px;font-weight:800;margin-bottom:6px;color:var(--ink)}
.confirm-msg{font-size:13.5px;font-weight:500;color:var(--ink2);line-height:1.6;margin-bottom:18px;overflow-wrap:anywhere}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm-actions .btn{height:46px}
@media(max-width:360px){.confirm-actions{grid-template-columns:1fr}}

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<symbol id="i-sl" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>

<script type="module">
import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getDatabase, ref, onValue, set, update, remove } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

/* ═══════════════════════════════════════════════════════════
   CONSTANTS & HELPERS
   ═══════════════════════════════════════════════════════════ */
const VERSION = 'Dashboard v11.0 — Split Device Controls';
const AI_MAX = 4095;
const HIST = 40;
const STALE_MS = 90_000;
const QUEUE_MAX = 100;
const LOG_MAX = 150;
const LOG_PERSIST_MAX = 100;
const LOG_RENDER_MAX = 60;

const PATHS = Object.freeze({
  STATUS: '/status',
  INFO: '/info',
  DO: '/DO',
  DI: '/DI',
  AO: '/AO',
  AI: '/AI',
  SCHEDULE: '/schedule',
  CMD: '/cmd'
});

const $ = id => document.getElementById(id);
const $$ = s => document.querySelectorAll(s);
const icon = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;

const escapeHTML = s => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
));

const haptic = (ms = 10) => { try { navigator.vibrate?.(ms); } catch {} };

const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => (crypto.randomUUID?.() ?? (Date.now().toString(36) + Math.random().toString(36).slice(2, 7)));
const nowTime = () => new Date().toLocaleTimeString('en-GB', { hour12: false });

const throttle = (fn, wait = 150) => {
  let last = 0, timer;
  return (...args) => {
    const now = Date.now();
    clearTimeout(timer);
    if (now - last >= wait) { last = now; fn(...args); }
    else timer = setTimeout(() => { last = Date.now(); fn(...args); }, wait - (now - last));
  };
};
const debounce = (fn, wait = 400) => {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
};

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};

/* ═══════════════════════════════════════════════════════════
   CUSTOM CONFIRM DIALOG
   ═══════════════════════════════════════════════════════════ */
const ConfirmDialog = (() => {
  const modal = $('confirmModal');
  const iconEl = $('confirmIcon');
  const titleEl = $('confirmTitle');
  const msgEl = $('confirmMsg');
  const okBtn = $('confirmOk');
  const cancelBtn = $('confirmCancel');
  let resolver = null;
  let prevFocus = null;

  const ICONS = {
    info:   { name: 'info',   cls: '' },
    help:   { name: 'help',   cls: '' },
    warn:   { name: 'warn',   cls: 'warn' },
    danger: { name: 'warn',   cls: 'danger' },
    check:  { name: 'check',  cls: '' }
  };
  const TITLES = {
    info: 'تأكيد', help: 'تأكيد', warn: 'تحذير',
    danger: 'تأكيد الحذف', check: 'تأكيد'
  };

  function close(result) {
    modal.classList.remove('show');
    document.body.style.overflow = '';
    const r = resolver;
    resolver = null;
    if (prevFocus?.focus) try { prevFocus.focus(); } catch {}
    prevFocus = null;
    r?.(result);
  }

  function open(opts = {}) {
    const {
      title, message = '', confirmText = 'تأكيد', cancelText = 'إلغاء',
      variant = 'help', confirmStyle = null, hideCancel = false
    } = opts;

    const v = ICONS[variant] || ICONS.help;
    iconEl.className = 'confirm-icon ' + v.cls;
    iconEl.innerHTML = `<svg class="ic"><use href="#i-${v.name}"/></svg>`;
    titleEl.textContent = title || TITLES[variant] || 'تأكيد';
    msgEl.textContent = message;

    okBtn.textContent = confirmText;
    const style = confirmStyle ?? (variant === 'danger' ? 'd' : 'p');
    okBtn.className = 'btn ' + style;

    cancelBtn.textContent = cancelText;
    cancelBtn.style.display = hideCancel ? 'none' : '';
    document.querySelector('.confirm-actions').style.gridTemplateColumns = hideCancel ? '1fr' : '';

    prevFocus = document.activeElement;
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
    setTimeout(() => okBtn.focus(), 50);

    return new Promise(resolve => { resolver = resolve; });
  }

  okBtn.onclick = () => { haptic(15); close(true); };
  cancelBtn.onclick = () => { haptic(); close(false); };
  modal.onclick = e => { if (e.target === modal) close(false); };
  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('show')) return;
    if (e.key === 'Escape') close(false);
    if (e.key === 'Enter') close(true);
  });

  return { open };
})();

const confirmDialog = (opts) => ConfirmDialog.open(opts);

/* ═══════════════════════════════════════════════════════════
   PROMPT DIALOG
   ═══════════════════════════════════════════════════════════ */
async function promptDialog(opts = {}) {
  const { title = 'إدخال', message = '', placeholder = '', variant = 'info', confirmText = 'حفظ' } = opts;

  return new Promise(resolve => {
    const modal = document.createElement('div');
    modal.className = 'confirm-modal show';
    modal.innerHTML = `
      <div class="confirm-box" style="text-align:start">
        <div class="confirm-icon" style="margin-inline:0">
          <svg class="ic"><use href="#i-ed"/></svg>
        </div>
        <div class="confirm-title">${escapeHTML(title)}</div>
        ${message ? `<div class="confirm-msg">${escapeHTML(message)}</div>` : ''}
        <div class="f" style="margin-bottom:16px">
          <input type="text" id="promptInput" value="${escapeHTML(placeholder)}" style="text-align:start;direction:rtl;font-family:var(--sans);font-size:15px">
        </div>
        <div class="confirm-actions">
          <button class="btn" data-cancel>إلغاء</button>
          <button class="btn p" data-ok>${escapeHTML(confirmText)}</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    document.body.style.overflow = 'hidden';

    const input = modal.querySelector('#promptInput');
    const okBtn = modal.querySelector('[data-ok]');
    const cancelBtn = modal.querySelector('[data-cancel]');
    setTimeout(() => { input.focus(); input.select(); }, 50);

    const finish = (result) => {
      modal.remove();
      document.body.style.overflow = '';
      resolve(result);
    };

    okBtn.onclick = () => { haptic(15); finish(input.value); };
    cancelBtn.onclick = () => { haptic(); finish(null); };
    modal.onclick = e => { if (e.target === modal) finish(null); };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); finish(input.value); }
      if (e.key === 'Escape') { e.preventDefault(); finish(null); }
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
const DEFAULT_DEVICE = {
  id: 'default',
  name: 'KC868-A6',
  url: 'https://said-rahil-default-rtdb.firebaseio.com',
  base: 'Said'
};

const state = {
  devices: LS.get('devices', [DEFAULT_DEVICE]),
  activeId: LS.get('activeDeviceId', 'default'),
  app: null, db: null, basePath: '/Said',
  unsubscribers: [],
  fbOnline: false,
  DO: {}, DI: {}, AO: {}, AI: {},
  status: {}, info: {}, schedule: {},
  log: LS.get('eventLog', []),
  unread: 0,
  muted: LS.get('notifyMuted', false),
  diReady: false,
  lastBeat: 0,
  lastUptime: null,
  editSched: null,
  editDev: null,
  names: LS.get('relayNames', {}),
  hist: { 1: [], 2: [], 3: [], 4: [] },
  sending: new Set(),
  settingsPrefix: LS.get('settingsPrefix', 'status')
};

let queue = LS.get('offlineQueue', []);
const persistQueue = () => LS.set('offlineQueue', queue);
function qPush(path, value) {
  const idx = queue.findIndex(q => q.path === path && q.dev === state.activeId);
  if (idx >= 0) queue.splice(idx, 1);
  if (queue.length >= QUEUE_MAX) queue.shift();
  queue.push({ path, value, dev: state.activeId, ts: Date.now() });
  persistQueue();
}

/* ═══════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════ */
let toastTimer;
function toast(msg, type = 'info') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ═══════════════════════════════════════════════════════════
   EVENT LOG
   ═══════════════════════════════════════════════════════════ */

  state.log.unshift({ id: uid(), time: nowTime(), msg, type });
  if (state.log.length > LOG_MAX) state.log.pop();
  LS.set('eventLog', state.log.slice(0, LOG_PERSIST_MAX));
  if (type !== 'info' && !state.muted && !$('page-log').classList.contains('active')) {
    state.unread++;
  }
  scheduleLogRender();
  renderBadge();
}

const renderLogNow = () => {

  $('eventLog').innerHTML = state.log.length
    ? state.log.slice(0, LOG_RENDER_MAX).map(e =>

          <button data-del="${e.id}" aria-label="حذف الحدث">${icon('x')}</button>

      ).join('')

function paintConn() {
  const online = navigator.onLine;
  $('offBanner').classList.toggle('show', !online);
  const stale = state.fbOnline && state.lastBeat && Date.now() - state.lastBeat > STALE_MS;

      !online ? 'bad' :

    );
  }

  $('btnPickDevice').title = label;
}

/* ═══════════════════════════════════════════════════════════
   FIREBASE WRITE / QUEUE
   ═══════════════════════════════════════════════════════════ */
async function flushQueue() {
  if (!state.db || !state.fbOnline || !queue.length) return;
  const mine = queue.filter(q => q.dev === state.activeId);
  const rest = queue.filter(q => q.dev !== state.activeId);
  const failed = [];
  for (const it of mine) {
    try { await set(ref(state.db, state.basePath + it.path), it.value); }
    catch { failed.push(it); }
  }
  queue = [...rest, ...failed];
  persistQueue();
}

async function write(path, value) {
  if (!state.db || !state.fbOnline) { qPush(path, value); return false; }
  try { await set(ref(state.db, state.basePath + path), value); return true; }
  catch { qPush(path, value); return false; }
}

async function multi(map) {
  if (!state.db || !state.fbOnline) {
    for (const k in map) qPush(k, map[k]);
    return false;
  }
  try { await update(ref(state.db, state.basePath), map); return true; }
  catch { for (const k in map) qPush(k, map[k]); return false; }
}

async function erase(path = '') {
  if (!state.db || !state.fbOnline) return false;
  try { await remove(ref(state.db, state.basePath + path)); return true; }
  catch { return false; }
}

/* ═══════════════════════════════════════════════════════════
   CONNECT / DETACH
   ═══════════════════════════════════════════════════════════ */
function detach() {
  state.unsubscribers.forEach(unsub => { try { unsub(); } catch {} });
  state.unsubscribers = [];
}

async function connect(device) {
  detach();
  if (state.app) {
    try { await deleteApp(state.app); } catch {}
    state.app = null;
    state.db = null;
  }
  state.DO = {}; state.DI = {}; state.AO = {}; state.AI = {};
  state.status = {}; state.info = {}; state.schedule = {};
  state.diReady = false;
  state.lastBeat = 0;
  state.lastUptime = null;
  state.fbOnline = false;
  state.hist = { 1: [], 2: [], 3: [], 4: [] };

  try {
    state.app = initializeApp({ databaseURL: device.url }, `app-${device.id}-${uid()}`);
    state.db = getDatabase(state.app);
    state.basePath = '/' + (device.base || 'Said').replace(/^\/+|\/+$/g, '');
    attachListeners();
  } catch (e) {
    console.error(e);
    toast('تعذّر الاتصال بـ Firebase', 'error');
  }
  $('devTitle').textContent = device.name;
  renderRelayNames();
  paintConn();
}

function attachListeners() {
  const bind = (path, handler) => {
    const r = ref(state.db, state.basePath + path);
    const unsub = onValue(r, snap => handler(snap.val() || {}));
    state.unsubscribers.push(unsub);
  };

  bind(PATHS.STATUS,   v => { state.status = v;   renderStatus(v); });
  bind(PATHS.INFO,     v => { state.info = v;     renderInfo(v); });
  bind(PATHS.DO,       v => { state.DO = v;       renderDO(); });
  bind(PATHS.DI,       v => { state.DI = v;       renderDI(); });
  bind(PATHS.AO,       v => { state.AO = v;       renderAO(); });
  bind(PATHS.AI,       v => { state.AI = v;       renderAI(); });
  bind(PATHS.SCHEDULE, v => { state.schedule = v; renderSchedule(); });

  const connRef = ref(state.db, '.info/connected');
  const connUnsub = onValue(connRef, snap => {
    state.fbOnline = snap.val() === true;
    paintConn();
    addEvent(
      state.fbOnline ? 'تم الاتصال بـ Firebase' : 'انقطع الاتصال بـ Firebase',
      state.fbOnline ? 'success' : 'error'
    );
    if (state.fbOnline) flushQueue();
  });
  state.unsubscribers.push(connUnsub);
}

async function toggleDO(i) {
  haptic();
  const key = 'DO' + i;
  if (state.sending.has(key)) return;
  const prev = state.DO[key];
  const next = prev === 1 ? 0 : 1;
  state.DO[key] = next;
  renderDO();
  state.sending.add(key);
  const ok = await write(PATHS.DO + '/' + key, next);
  if (ok) addEvent(`${relayName(i)} ← ${next ? 'تشغيل' : 'إطفاء'}`, next ? 'success' : 'info');
  else toast('حُفظ محلياً وسيُرسل عند عودة الاتصال', 'warn');
  state.sending.delete(key);
}

$('doGrid').addEventListener('click', async e => {
  const ren = e.target.closest('[data-ren]');
  const sch = e.target.closest('[data-sch]');
  const sw  = e.target.closest('[data-do]');

  if (ren) {
    const i = ren.dataset.ren;
    const current = relayName(i);
    const newName = await promptDialog({
      title: 'إعادة تسمية المرحل',
      message: `DO${i} — الاسم الحالي: ${current}`,
      placeholder: current,
      variant: 'info',
      confirmText: 'حفظ'
    });
    if (newName === null) return;
    if (!state.names[state.activeId]) state.names[state.activeId] = {};
    state.names[state.activeId][i] = newName.trim().slice(0, 24) || `المرحل ${i}`;
    LS.set('relayNames', state.names);
    renderRelayNames();
  } else if (sch) {
    openSchedule(Number(sch.dataset.sch));
  } else if (sw) {
    toggleDO(Number(sw.dataset.do));
  }
});

async function setAll(value) {
  const ok = await confirmDialog({
    title: value ? 'تشغيل جميع المخارج' : 'إطفاء جميع المخارج',
    message: value ? 'سيتم تشغيل المرحلات الستة جميعها.' : 'سيتم إطفاء المرحلات الستة جميعها.',
    variant: value ? 'info' : 'warn',
    confirmText: value ? 'تشغيل الكل' : 'إطفاء الكل',
    confirmStyle: value ? 'p' : 'd'
  });
  if (!ok) return;
  haptic(25);
  const map = {};
  for (let i = 1; i <= 6; i++) {
    map[`DO/DO${i}`] = value;
    state.DO['DO' + i] = value;
  }
  renderDO();
  await multi(map);
  addEvent(value ? 'تشغيل كل المخارج' : 'إطفاء كل المخارج', 'warn');
}

  haptic();

  tg.setAttribute('aria-checked', tg.classList.contains('on') ? 'true' : 'false');
}
$('schedEn').onclick = toggleSchedEnabled;

function openSchedule(i) {
  haptic();
  state.editSched = i;
  const s = state.schedule['DO' + i] || {};
  const days = Array.isArray(s.days) ? s.days : [0, 1, 2, 3, 4, 5, 6];
  $('schedTitle').textContent = 'جدولة ' + relayName(i);
  $('onH').value = s.on_hour ?? 8;
  $('onM').value = s.on_min ?? 0;
  $('offH').value = s.off_hour ?? 18;
  $('offM').value = s.off_min ?? 0;
  const tg = $('schedEn');
  tg.classList.toggle('on', s.enabled === 1);
  tg.setAttribute('aria-checked', s.enabled === 1 ? 'true' : 'false');
  $$('#schedDays .day').forEach(d => d.classList.toggle('active', days.includes(Number(d.dataset.day))));
  $('schedModal').classList.add('show');
  document.body.style.overflow = 'hidden';

const closeSchedule = () => {
  $('schedModal').classList.remove('show');
  document.body.style.overflow = '';
  state.editSched = null;
};
$('schedClose').onclick = closeSchedule;
$('schedModal').onclick = e => { if (e.target === $('schedModal')) closeSchedule(); };

$('schedSave').onclick = async () => {
  const i = state.editSched;
  if (i == null) return;
  const enabled = $('schedEn').classList.contains('on') ? 1 : 0;
  const days = [...$$('#schedDays .day.active')].map(d => Number(d.dataset.day));
  if (enabled && !days.length) return toast('اختر يوماً واحداً على الأقل', 'error');
  const g = (id, mx) => clamp(parseInt($(id).value, 10) || 0, 0, mx);
  const ok = await write(`${PATHS.SCHEDULE}/DO${i}`, {
    enabled,
    on_hour: g('onH', 23),
    on_min: g('onM', 59),
    off_hour: g('offH', 23),
    off_min: g('offM', 59),
    days
  });
  toast(ok ? 'تم حفظ الجدولة' : 'حُفظ محلياً', ok ? 'success' : 'warn');
  addEvent(`جدولة ${relayName(i)}: ${enabled ? 'مفعّلة' : 'معطّلة'}`, enabled ? 'warn' : 'info');
  closeSchedule();
};

$('schedClear').onclick = async () => {

          <small>${escapeHTML(d.url)}</small>
        </div>
        <button class="ib" data-editdev="${escapeHTML(d.id)}" aria-label="تعديل">${icon('ed')}</button>
      </div>
    `;
  }).join('');
}

function openDevManager() {
  haptic();
  renderDevManagerList();
  $('devManagerModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDevManager() {
  $('devManagerModal').classList.remove('show');
  document.body.style.overflow = '';
}

$('btnManageDevices').onclick = openDevManager;
$('devManagerClose').onclick = closeDevManager;
$('devManagerModal').onclick = e => {
  if (e.target === $('devManagerModal')) closeDevManager();
};

$('devManagerList').addEventListener('click', e => {
  const ed = e.target.closest('[data-editdev]');
  if (ed) {
    openDeviceModal(ed.dataset.editdev);
  }
});

$('addDev').onclick = () => {
  closeDevManager();
  openDeviceModal(null);
};

/* ═══════════════════════════════════════════════════════════
   DEVICE EDIT MODAL
   ═══════════════════════════════════════════════════════════ */
function openDeviceModal(id) {
  state.editDev = id;
  const d = id ? state.devices.find(x => x.id === id) : { name: '', url: '', base: 'Said' };
  $('devModalTitle').textContent = id ? 'تعديل الجهاز' : 'إضافة جهاز';
  $('devName').value = d.name;
  $('devUrl').value = d.url;
  $('devBase').value = d.base || 'Said';
  $('devDel').style.display = id && state.devices.length > 1 ? '' : 'none';
  $('devModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

const closeDeviceModal = () => {
  $('devModal').classList.remove('show');
  document.body.style.overflow = '';
  state.editDev = null;
};
$('devClose').onclick = closeDeviceModal;
$('devModal').onclick = e => { if (e.target === $('devModal')) closeDeviceModal(); };

$('devSave').onclick = async () => {
  const name = $('devName').value.trim();
  const url  = $('devUrl').value.trim().replace(/\/+$/, '');
  const base = $('devBase').value.trim() || 'Said';
  if (!name || !url) return toast('املأ الاسم والرابط', 'error');
  if (!/^https:\/\/.+/.test(url)) return toast('الرابط يجب أن يبدأ بـ https://', 'error');

  let shouldReconnect = false;
  if (state.editDev) {
    const d = state.devices.find(x => x.id === state.editDev);
    shouldReconnect = d.id === state.activeId && (d.url !== url || d.base !== base);
    Object.assign(d, { name, url, base });
  } else {
    state.devices.push({ id: uid(), name, url, base });
  }
  LS.set('devices', state.devices);
  closeDeviceModal();
  renderDevPickerList();
  renderDevManagerList();
  toast('تم الحفظ', 'success');
  if (shouldReconnect) await connect(state.devices.find(d => d.id === state.activeId));
  else $('devTitle').textContent = state.devices.find(d => d.id === state.activeId).name;
};

$('devDel').onclick = async () => {
  if (!state.editDev || state.devices.length <= 1) return;
  const d = state.devices.find(x => x.id === state.editDev);
  const ok = await confirmDialog({
    title: 'حذف الجهاز',
    message: `سيتم حذف "${d.name}" من قائمة الأجهزة. البيانات على Firebase لن تُمس.`,
    variant: 'danger',
    confirmText: 'حذف'
  });
  if (!ok) return;
  const wasActive = state.editDev === state.activeId;
  state.devices = state.devices.filter(x => x.id !== state.editDev);
  LS.set('devices', state.devices);
  closeDeviceModal();
  if (wasActive) {
    state.activeId = state.devices[0].id;
    LS.set('activeDeviceId', state.activeId);
    await connect(state.devices[0]);
  }
  renderDevPickerList();
  renderDevManagerList();
  toast('تم الحذف', 'success');
};

/* ═══════════════════════════════════════════════════════════
   SETTINGS SCHEMA
   ═══════════════════════════════════════════════════════════ */
const GROUPS = [
  ['المزامنة والحساسية', [
    ['sync_interval', 'وقت المزامنة', 's', 5, 600],
    ['sync_before_integrity', 'فحص السلامة', '', 5, 100],
    ['ai_threshold', 'حساسية AI', '', 10, 500]
  ]],
  ['التوقيتات الدورية', [
    ['read_inputs', 'قراءة المداخل', 's', 5, 300],
    ['check_i2c', 'فحص I2C', 's', 1, 30],
    ['check_heap', 'فحص الذاكرة', 's', 10, 300],
    ['save_eeprom', 'حفظ EEPROM', 's', 5, 120],
    ['serial_print', 'طباعة Serial', 's', 5, 300]
  ]],
  ['الشبكة والاستعادة', [
    ['fb_retry', 'محاولة Firebase', 's', 5, 60],
    ['max_fb_failures', 'حد فشل Firebase', '', 1, 5],
    ['max_consecutive_reinits', 'حد Reinits', '', 1, 10],
    ['ssl_lockout_base', 'SSL base', 's', 10, 120],
    ['ssl_lockout_max', 'SSL max', 's', 60, 600]
  ]]
];

const SCHEMA = { oled_display_mode: { min: 0, max: 2 } };

function buildField(id, label, unit, min, max) {
  SCHEMA[id] = { min, max, label, unit };
  return `<div class="f">
    <label>${label} (${min}–${max}${unit ? ' ' + unit : ''})</label>
    <input type="number" id="${id}" min="${min}" max="${max}" step="1" inputmode="numeric">
  </div>`;
}

$('oledFields').innerHTML =
  buildField('oled_cycle_do', 'وقت DI/DO', 's', 2, 60) +
  buildField('oled_cycle_ao', 'وقت AI/AO', 's', 2, 60) +
  buildField('hold_duration', 'مدة التثبيت', 's', 2, 15);

$('paramGroups').innerHTML = GROUPS.map(([title, fields]) => `
  <div class="sec"><span>${title}</span></div>
  <div class="card"><div class="fg">
    ${fields.map(f => buildField(...f)).join('')}
  </div></div>
`).join('');

const PRESETS = {
  default:   { sync_interval: 30,  oled_cycle_do: 5,  oled_cycle_ao: 5,  hold_duration: 5,  oled_display_mode: 0, read_inputs: 30,  check_i2c: 5,  check_heap: 30,  save_eeprom: 10,  serial_print: 30,  fb_retry: 30, sync_before_integrity: 15,  ai_threshold: 50,  max_fb_failures: 1, ssl_lockout_base: 30,  ssl_lockout_max: 120, max_consecutive_reinits: 3 },
  reliable:  { sync_interval: 10,  oled_cycle_do: 5,  oled_cycle_ao: 5,  hold_duration: 5,  oled_display_mode: 0, read_inputs: 5,   check_i2c: 1,  check_heap: 10,  save_eeprom: 5,   serial_print: 15,  fb_retry: 30, sync_before_integrity: 5,   ai_threshold: 20,  max_fb_failures: 1, ssl_lockout_base: 10,  ssl_lockout_max: 60,  max_consecutive_reinits: 5 },
  efficient: { sync_interval: 300, oled_cycle_do: 60, oled_cycle_ao: 60, hold_duration: 15, oled_display_mode: 1, read_inputs: 300, check_i2c: 30, check_heap: 300, save_eeprom: 120, serial_print: 300, fb_retry: 60, sync_before_integrity: 100, ai_threshold: 100, max_fb_failures: 3, ssl_lockout_base: 120, ssl_lockout_max: 600, max_consecutive_reinits: 2 }
};
const PRESET_NAMES = { default: 'افتراضي', reliable: 'اعتمادية', efficient: 'توفير' };

const kvHTML = (id, label) =>
  `<div class="k" id="k_${id}"><div class="l">${label}</div><div class="v" id="v_${id}">--</div></div>`;

$('stGrid').innerHTML = [
  ['wifi','WiFi'],['fb','Firebase'],['i2c','I2C'],['ntp','NTP'],
  ['integ','Integrity'],['ssl','SSL'],['ff','FB Failures'],['rec','Recovery']
].map(a => kvHTML(...a)).join('');

$('wfGrid').innerHTML = [['ip','IP'],['ssid','SSID'],['mac','MAC'],['rssi','RSSI']].map(a => kvHTML(...a)).join('');
$('sysGrid').innerHTML = [['fw','Firmware'],['up','Uptime'],['heap','Heap'],['boot','Boot']].map(a => kvHTML(...a)).join('');

const setKv = (id, text, cls = '') => {
  const k = $('k_' + id);
  if (!k) return;
  $('v_' + id).textContent = text;
  k.className = 'k ' + cls;
};

/* ═══════════════════════════════════════════════════════════
   RENDERERS
   ═══════════════════════════════════════════════════════════ */
function renderDO() {
  let count = 0;
  for (let i = 1; i <= 6; i++) {
    const on = state.DO['DO' + i] === 1;
    if (on) count++;
    const el = doEl[i];
    el.classList.toggle('on', on);
    el.querySelector('.led').classList.toggle('on', on);
    el.querySelector('.stt').textContent = on ? 'مفتوح' : 'مغلق';
  }
  $('doCnt').textContent = count + '/6';
}

function renderDI() {
  let count = 0;
  for (let i = 1; i <= 6; i++) {
    const on = state.DI['DI' + i] === 1;
    if (on) count++;
    const el = diEl[i];
    const was = el.classList.contains('on');
    el.classList.toggle('on', on);
    el.querySelector('.led').classList.toggle('on', on);
    el.querySelector('.s').textContent = on ? 'نشط' : 'غير نشط';
    if (state.diReady && was !== on) {
      addEvent(`المدخل ${i} ← ${on ? 'نشط' : 'غير نشط'}`, on ? 'success' : 'info');
    }
  }
  state.diReady = true;
  $('diCnt').textContent = count + '/6';
}

function renderAO() {
  for (let i = 1; i <= 2; i++) {
    const v = num(state.AO['AO' + i]);
    const s = aoSlider[i];
    if (document.activeElement !== s) s.value = v;
    fillSliderBackground(s);
    aoValue[i].textContent = Math.round(v / 2.55);
  }
}

function renderAI() {
  for (let i = 1; i <= 4; i++) {
    const p = clamp(Math.round(num(state.AI['AI' + i]) / AI_MAX * 100), 0, 100);
    const c = aiColor(p);
    aiFill[i].style.width = p + '%';
    aiFill[i].style.background = c;
    aiValue[i].textContent = p;
    aiValue[i].style.color = c;
    const h = state.hist[i];
    h.push(p);
    if (h.length > HIST) h.shift();
    aiSpark[i].setAttribute('points',
      h.map((v, x) => `${(x / (HIST - 1) * 100).toFixed(1)},${(28 - v * 0.26).toFixed(1)}`).join(' ')
    );
  }
}

function renderSchedule() {
  for (let i = 1; i <= 6; i++) {
    const s = state.schedule['DO' + i] || {};
    const on = s.enabled === 1;
    const p = n => String(n ?? 0).padStart(2, '0');
    doEl[i].querySelector('.sch').classList.toggle('active', on);
    $('prev' + i).textContent = on
      ? `${p(s.on_hour)}:${p(s.on_min)} → ${p(s.off_hour)}:${p(s.off_min)}`
      : '';
  }
}

function renderStatus(v) {
  if (!v || !Object.keys(v).length) {
    ['wifi','fb','i2c','ntp','integ','ssl','ff'].forEach(k => setKv(k, '--'));
    return;
  }
  const yn = (id, ok, a, b) => setKv(id, ok ? a : b, ok ? 'ok' : 'err');
  yn('wifi', v.wifi === 1, 'متصل', 'غير متصل');
  yn('fb',   v.firebase === 1, 'متصل', 'غير متصل');
  yn('i2c',  v.i2c === 1, 'سليم', 'خطأ');
  yn('ntp',  v.ntp === 1, 'مزامن', 'غير مزامن');
  const ig = num(v.integrity, -1);
  if (ig >= 0 && ig <= 2) setKv('integ', ['سليم','جزئي','حرج'][ig], ['ok','warn','err'][ig]);
  const ssl = num(v.ssl_errors);
  setKv('ssl', ssl, ssl === 0 ? 'ok' : ssl < 3 ? 'warn' : 'err');
  const ff = num(v.fb_failures);
  setKv('ff', ff, ff === 0 ? 'ok' : 'warn');
  if (v.version) setKv('fw', 'v' + v.version);
  const heap = num(v.heap_k, -1);
  if (heap >= 0) setKv('heap', heap + ' KB', heap < 30 ? 'err' : heap < 60 ? 'warn' : 'ok');
  if (v.rssi != null) {
    const r = num(v.rssi);
    setKv('rssi', r + ' dBm', r > -60 ? 'ok' : r > -75 ? 'warn' : 'err');
  }
  if (v.oled_display_mode != null) {
    $$('#oledModes button').forEach(b =>
      b.classList.toggle('active', Number(b.dataset.mode) === num(v.oled_display_mode))
    );
  }
  for (const key in SCHEMA) {
    const el = $(key);
    if (el && document.activeElement !== el && v[key] != null) el.value = v[key];
  }
}

const formatUptime = s => {
  s = num(s);
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m}m ${s % 60}s`;
};

function renderInfo(i) {
  if (!i || !Object.keys(i).length) {
    ['ip','ssid','mac','up','boot','rec'].forEach(k => setKv(k, '--'));
    return;
  }
  if (i.uptime_s !== state.lastUptime) {
    state.lastUptime = i.uptime_s;
    state.lastBeat = Date.now();
    paintConn();
  }
  setKv('ip', i.wifi_ip || '--', 'ok');
  setKv('ssid', i.wifi_ssid || '--');
  setKv('mac', i.mac_address || '--');
  setKv('boot', i.boot_count ?? '--');
  setKv('up', formatUptime(i.uptime_s));
  const lv = i.recovery_level || 'none';
  const names = { none: 'سليم', fb: 'Firebase', wifi: 'WiFi', deep: 'Deep Reset' };
  setKv('rec', `${names[lv] || lv} (${num(i.recovery_attempts)})`, lv === 'none' ? 'ok' : 'warn');
}

/* ═══════════════════════════════════════════════════════════
   SAVE SETTINGS
   ═══════════════════════════════════════════════════════════ */
const settingsPrefix = () => state.settingsPrefix === 'config' ? '/config/' : '/status/';

async function saveOne(key) {
  const sc = SCHEMA[key];
  const el = $(key);
  const v = Number(el.value.trim());
  if (!Number.isInteger(v) || v < sc.min || v > sc.max) {
    toast(`القيمة بين ${sc.min} و ${sc.max}`, 'error');
    return;
  }
  haptic();
  await write(settingsPrefix() + key, v);
  toast('تم الحفظ: ' + v, 'success');
  addEvent(`${key} = ${v}`, 'success');
}

Object.keys(SCHEMA).forEach(k => {
  const el = $(k);
  if (el) el.addEventListener('change', debounce(() => saveOne(k)));
});

$('saveAll').onclick = async () => {
  haptic(20);
  const map = {};
  let n = 0;
  const prefix = settingsPrefix().replace(/^\//, '');
  for (const k in SCHEMA) {
    const el = $(k);
    if (!el || el.value === '') continue;
    const v = Number(el.value);
    const sc = SCHEMA[k];
    if (Number.isInteger(v) && v >= sc.min && v <= sc.max) {
      map[prefix + '/' + k] = v;
      n++;
    }
  }
  await multi(map);
  toast(`تم حفظ ${n} إعداد`, 'success');
  addEvent(`حفظ شامل: ${n} إعداد`, 'success');
};

$$('[data-preset]').forEach(b => b.onclick = async () => {
  haptic(20);
  const prefix = settingsPrefix().replace(/^\//, '');
  const map = {};
  for (const [k, v] of Object.entries(PRESETS[b.dataset.preset])) map[prefix + '/' + k] = v;
  await multi(map);
  toast('تم تطبيق: ' + PRESET_NAMES[b.dataset.preset], 'success');
  addEvent('إعداد جاهز: ' + PRESET_NAMES[b.dataset.preset], 'success');
  $$('[data-preset]').forEach(x => x.classList.toggle('active', x === b));
});

$$('#oledModes button').forEach(b => b.onclick = async () => {
  haptic();
  $$('#oledModes button').forEach(x => x.classList.toggle('active', x === b));
  await write(settingsPrefix() + 'oled_display_mode', Number(b.dataset.mode));
  toast('تم تغيير نمط الشاشة', 'success');
});

/* ═══════════════════════════════════════════════════════════
   RECONNECT / WIPE
   ═══════════════════════════════════════════════════════════ */
const RECONNECT_LABELS = {
  wifi: 'WiFi', firebase: 'Firebase', ntp: 'NTP',
  restart: 'إعادة التشغيل', all: 'تحديث الكل'
};

$$('[data-rc]').forEach(b => b.onclick = async () => {
  haptic(15);
  const cmd = b.dataset.rc;
  if (cmd === 'restart') {
    const ok = await confirmDialog({
      title: 'إعادة تشغيل الجهاز',
      message: 'سيتم إعادة تشغيل لوحة KC868-A6. قد ينقطع الاتصال مؤقتاً.',
      variant: 'warn',
      confirmText: 'إعادة التشغيل',
      confirmStyle: 'd'
    });
    if (!ok) return;
  }
  b.disabled = true;
  const path = `${PATHS.CMD}/${cmd === 'all' ? 'refresh_all' : cmd}`;
  if (await write(path, 1)) {
    addEvent('أمر: ' + RECONNECT_LABELS[cmd], 'warn');
    await Promise.all([erase(PATHS.STATUS), erase(PATHS.INFO)]);
    toast('تم إرسال: ' + RECONNECT_LABELS[cmd], 'warn');
  } else {
    toast('تعذّر الإرسال الآن، سيُرسل لاحقاً', 'error');
  }
  setTimeout(() => b.disabled = false, 1500);
});

$('wipeBtn').onclick = async () => {
  haptic(30);
  const ok1 = await confirmDialog({
    title: 'حذف بيانات الجهاز',
    message: 'سيتم حذف جميع بيانات هذا الجهاز من Firebase (الحالة، المعلومات، الجدولة، الأوامر). هذا الإجراء لا يمكن التراجع عنه.',
    variant: 'danger',
    confirmText: 'متابعة',
    confirmStyle: 'd'
  });
  if (!ok1) return;
  const ok2 = await confirmDialog({
    title: 'تأكيد نهائي',
    message: 'هل أنت متأكد تماماً؟ سيتم حذف كل شيء تحت المسار الأساسي.',
    variant: 'danger',
    confirmText: 'نعم، احذف',
    confirmStyle: 'd'
  });
  if (!ok2) return;
  await erase('');
  state.log = [];
  state.unread = 0;
  LS.del('eventLog');
  LS.del('offlineQueue');
  queue = [];
  renderLogNow();
  renderBadge();
  toast('تم حذف البيانات', 'success');
};

/* ═══════════════════════════════════════════════════════════
   HEADER ICONS INIT
   ═══════════════════════════════════════════════════════════ */
$('btnTheme').innerHTML = icon('moon');
$('btnRefresh').innerHTML = icon('rf');

/* ═══════════════════════════════════════════════════════════
   GLOBAL ERROR HANDLER
   ═══════════════════════════════════════════════════════════ */
addEventListener('error', e => console.error('[Global]', e.error || e.message));
addEventListener('unhandledrejection', e => console.error('[Unhandled]', e.reason));

/* ═══════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════ */
(async function boot() {
  const prefersDark = matchMedia('(prefers-color-scheme:dark)').matches;
  applyTheme(LS.get('theme', prefersDark ? 'dark' : 'light'));

  paintMute();
  renderLogNow();
  renderBadge();
  renderDevPickerList();
  renderDevManagerList();
  renderSchedule();

  const dev = state.devices.find(d => d.id === state.activeId) || state.devices[0];
  state.activeId = dev.id;
  LS.set('activeDeviceId', state.activeId);

  await connect(dev);
  go(LS.get('page', 'home'));
  addEvent('تشغيل ' + VERSION, 'success');
})();
</script>
