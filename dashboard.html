<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ESP32 IOT DASHBOARD — KC868-A6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
:root{
  --bg:#eef2f7;--card:#fff;--soft:#f3f6fa;--line:#e1e8f0;
  --ink:#0f172a;--ink2:#475569;--ink3:#8493a8;
  --brand:#2563eb;--brand-bg:#e6efff;
  --on:#059669;--on-bg:#d5f5e7;--off:#9aa8bb;
  --danger:#dc2626;--danger-bg:#fde4e4;--warn:#d97706;--warn-bg:#fdf0d5;
  --hd1:#0b1530;--hd2:#17306b;
  --sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);
  --font:'Cairo','Segoe UI',Tahoma,sans-serif;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --bg:#0a1020;--card:#121b30;--soft:#18233c;--line:#223152;
  --ink:#e9eefb;--ink2:#b4c0d6;--ink3:#7586a3;
  --brand:#5b94ff;--brand-bg:#16264d;
  --on:#34d399;--on-bg:#0d3a2e;--off:#4a5a78;
  --danger:#f87171;--danger-bg:#4a1c1f;--warn:#fbbf24;--warn-bg:#47330c;
  --hd1:#050a18;--hd2:#0f2250;
  --sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;min-height:100dvh;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
[data-i]{display:inline-grid;place-items:center}

/* header */
.top{position:sticky;top:0;z-index:50;padding:calc(var(--top) + 10px) 14px 12px;display:flex;align-items:center;gap:10px;color:#fff;background:linear-gradient(135deg,var(--hd1),var(--hd2));box-shadow:0 4px 18px rgba(8,16,40,.25)}
.hb{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);font-size:18px;transition:.15s}
.hb:active{transform:scale(.92);background:rgba(255,255,255,.2)}
.ttl{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.ttl [data-i]{width:34px;height:34px;border-radius:10px;background:rgba(91,148,255,.2);color:#9cc0ff;font-size:18px}
.ttl h1{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.1);font-size:11.5px;font-weight:700}
.pill i{width:8px;height:8px;border-radius:50%;background:#f87171}
.pill.ok i{background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.25)}

/* content */
main{max-width:720px;margin:0 auto;padding:16px 14px calc(96px + var(--bot))}
.page{display:none}.page.active{display:block;animation:in .22s}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pt{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin-bottom:6px}
.pt [data-i]{width:38px;height:38px;border-radius:12px;background:var(--brand-bg);color:var(--brand);font-size:20px}
.sec{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink3);margin:22px 4px 10px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}

/* collapse */
.col{background:var(--card);border-radius:18px;box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.col-h{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
.col-h .t{flex:1;font-weight:800;font-size:14.5px}
.col-h .cv{color:var(--ink3);transition:transform .25s}.col.open .cv{transform:rotate(180deg)}
.badge{font-size:11px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--brand-bg);color:var(--brand);min-width:40px;text-align:center}
.col-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.col.open .col-b{grid-template-rows:1fr}
.col-b>div{overflow:hidden}

/* tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}
.tile{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.25s}
.tile.on{background:var(--on-bg);border-color:transparent}
.lb{font-weight:700;font-size:13px;color:var(--ink2)}.lb b{font-size:16px;color:var(--ink);margin-inline-start:3px}
.pwr,.ind{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--card);color:var(--off);border:2px solid var(--line);transition:.25s}
.pwr:active{transform:scale(.92)}
.tile.on .pwr{background:var(--on);color:#fff;border-color:var(--on);box-shadow:0 0 0 6px rgba(5,150,105,.15),0 6px 16px rgba(5,150,105,.35)}
.tile.on .ind{background:var(--on);color:#fff;border-color:var(--on);box-shadow:0 0 0 6px rgba(5,150,105,.15)}
.stt{font-size:12px;font-weight:700;color:var(--ink3)}.tile.on .stt{color:var(--on)}

/* analog */
.an{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:10px}
.an-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-weight:700}
.an-h em{font-style:normal;font-size:18px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.an-h small{font-size:11px;color:var(--ink3);margin-inline-start:2px}
.rs{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;outline:0;direction:ltr;--p:0%;background:linear-gradient(to right,var(--brand) var(--p),var(--line) var(--p))}
.rs::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--brand);box-shadow:0 2px 6px rgba(37,99,235,.4)}
.rs::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--brand)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .4s,background .3s}

/* status */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{background:var(--card);border-radius:14px;padding:11px 14px;box-shadow:var(--sh);border-inline-start:4px solid var(--line);display:flex;flex-direction:column}
.sc .l{font-size:11px;font-weight:700;color:var(--ink3)}
.sc .v{font-size:14px;font-weight:800;direction:ltr;text-align:start;word-break:break-word}
.sc.ok{border-color:var(--on)}.sc.ok .v{color:var(--on)}
.sc.warn{border-color:var(--warn)}.sc.warn .v{color:var(--warn)}
.sc.err{border-color:var(--danger)}.sc.err .v{color:var(--danger)}
.sc.info{border-color:var(--brand)}.sc.info .v{color:var(--brand)}
.log{background:var(--card);border-radius:16px;padding:8px;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh)}
.ev{display:grid;grid-template-columns:62px 1fr 26px;gap:8px;align-items:center;padding:8px 10px;background:var(--soft);border-radius:10px;border-inline-start:3px solid var(--brand);font-size:12.5px}
.ev.success{border-color:var(--on)}.ev.warn{border-color:var(--warn)}.ev.error{border-color:var(--danger)}
.ev time{font-size:10.5px;font-weight:700;color:var(--ink3);direction:ltr}
.ev button{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);font-size:13px}
.ev button:hover{background:var(--danger-bg);color:var(--danger)}

/* forms + buttons */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.f input{width:100%;height:44px;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);font-size:15px;font-weight:700;padding:0 12px;text-align:center;transition:.15s}
.f input:focus{outline:0;border-color:var(--brand);background:var(--card);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;border-radius:13px;font-weight:700;font-size:14px;background:var(--card);border:1.5px solid var(--line);transition:.15s}
.btn:active{transform:scale(.97)}
.btn .ic{font-size:17px}
.btn.p{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.btn.s{background:var(--brand-bg);color:var(--brand);border-color:transparent}
.btn.d{color:var(--danger);border-color:var(--danger-bg);background:var(--danger-bg)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--soft);border:1.5px solid transparent;font-weight:700;font-size:12px;color:var(--ink2);transition:.15s}
.chip .ic{font-size:22px}
.chip.active{background:var(--brand-bg);border-color:var(--brand);color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}

/* bottom nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:60;display:flex;padding:8px 10px calc(8px + var(--bot));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:var(--ink3);transition:.2s}
.tab [data-i]{font-size:22px;padding:3px 16px;border-radius:99px;transition:.2s}
.tab small{font-size:10.5px;font-weight:700}
.tab.active{color:var(--brand)}.tab.active [data-i]{background:var(--brand-bg)}
.nb{position:absolute;top:0;inset-inline-end:calc(50% - 26px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:none;place-items:center}

.toast{position:fixed;bottom:calc(88px + var(--bot));left:50%;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:99;display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:14px;background:#0f172a;color:#fff;font-weight:700;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.35);transition:.3s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:#047857}.toast.error{background:#b91c1c}.toast.warn{background:#b45309}
@media(min-width:640px){.sg{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.sg{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<main>
  <div class="page active" id="page-home">
    <div class="sec">المخارج</div>
    <div class="col open" id="doCard">
      <div class="col-h" onclick="toggleCollapse('doCard')"><span class="cv" data-i="chev"></span><div class="t">المخارج الرقمية (DO)</div><div class="badge" id="doCnt">0/6</div></div>
      <div class="col-b"><div><div class="grid" id="doGrid"></div></div></div>
    </div>
    <div class="sec">المداخل</div>
    <div class="col open" id="diCard">
      <div class="col-h" onclick="toggleCollapse('diCard')"><span class="cv" data-i="chev"></span><div class="t">المداخل الرقمية (DI)</div><div class="badge" id="diCnt">0/6</div></div>

  <div class="page" id="page-monitor">

    <div class="sec">المخارج التناظرية</div><div id="aoBox"></div>
    <div class="sec">المداخل التناظرية</div><div id="aiBox"></div>

  <div class="page" id="page-alarms">

    <div class="card"><div class="chips">

      <button class="chip" data-preset="efficient"><span data-i="leaf"></span>توفير</button>

  </div>

  <div class="page" id="page-settings">
    <h2 class="pt"><span data-i="gear"></span>النظام</h2>
    <div class="sec">حالة النظام</div><div class="sg" id="statusGrid"></div>
    <div class="sec">تفاصيل WiFi</div><div class="sg" id="wifiGrid"></div>
    <div class="sec">معلومات النظام</div><div class="sg" id="sysGrid"></div>
    <div class="sec">إعادة الاتصال</div>
    <div class="card">
      <div class="two">
        <button class="btn" data-reconnect="wifi"><span data-i="wifi"></span>WiFi</button>
        <button class="btn" data-reconnect="firebase"><span data-i="flame"></span>Firebase</button>
        <button class="btn" data-reconnect="ntp"><span data-i="clock"></span>NTP</button>
        <button class="btn d" data-reconnect="restart"><span data-i="zap"></span>RESTART</button>
      </div>
      <button class="btn s" data-reconnect="all"><span data-i="refresh"></span>إعادة الاتصال بالكل</button>
    </div>
    <div class="sec">تفضيلات الواجهة</div>
    <div class="card">
      <div class="two" style="margin:0">
        <button class="btn" id="themeBtn"><span class="bi" data-i="moon"></span><span class="bt">الوضع الليلي</span></button>
        <button class="btn" id="notifyBtn"><span class="bi" data-i="bell"></span><span class="bt">الإشعارات</span></button>
      </div>
    </div>
  </div>
</main>

<nav class="nav" id="topNavbar">
  <button class="tab active" data-nav="home"><span data-i="home"></span><small>الرئيسية</small></button>
  <button class="tab" data-nav="monitor"><span data-i="activity"></span><small>المراقبة</small></button>
  <button class="tab" data-nav="alarms"><span data-i="bell"></span><small>التنبيهات</small><span class="nb" id="navNotifBadge">0</span></button>
  <button class="tab" data-nav="params"><span data-i="sliders"></span><small>الإعدادات</small></button>
  <button class="tab" data-nav="settings"><span data-i="gear"></span><small>النظام</small></button>
</nav>

<div class="toast" id="toast"><span id="toastIcon"></span><span id="toastMsg"></span></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getDatabase, ref, onValue, set, update } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

const db = getDatabase(initializeApp({ databaseURL: "https://said-rahil-default-rtdb.firebaseio.com" }));
const BASE = "/Said", AI_MAX = 4095, APP_VERSION = 'Mobile v4.0';

/* ── helpers ── */
const $ = id => document.getElementById(id);
const I = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const icons = root => root.querySelectorAll('[data-i]').forEach(e => { e.innerHTML = I(e.dataset.i); });
const haptic = (ms=10) => navigator.vibrate?.(ms);
const numOr = (v,d=0) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
const nowTime = () => new Date().toLocaleTimeString('en-GB', {hour12:false});
const st = { DI:{}, DO:{}, AI:{}, AO:{}, status:{}, info:{} };
const sending = new Set();
let currentOledMode = 0;

/* ── settings schema ── */
const GROUPS = [
 ['المزامنة والحساسية',[['sync_interval','وقت المزامنة','s',5,600],['sync_before_integrity','فحص السلامة','',5,100],['ai_threshold','حساسية AI','',10,500]]],
 ['التوقيتات الدورية',[['read_inputs','قراءة المداخل','s',5,300],['check_i2c','فحص I2C','s',1,30],['check_heap','فحص الذاكرة','s',10,300],['save_eeprom','حفظ EEPROM','s',5,120],['serial_print','طباعة Serial','s',5,300]]],
 ['الشبكة والاستعادة',[['fb_retry','محاولة Firebase','s',5,60],['max_fb_failures','حد فشل Firebase','',1,5],['max_consecutive_reinits','حد Reinits','',1,10],['ssl_lockout_base','SSL Lockout base','s',10,120],['ssl_lockout_max','SSL Lockout max','s',60,600]]],
 ['شاشة OLED',[['oled_cycle_do','وقت DI / DO','s',2,60],['oled_cycle_ao','وقت AI / AO','s',2,60],['hold_duration','مدة التثبيت','s',2,15]]],
];
const SETTINGS_SCHEMA = { oled_display_mode:{min:0,max:2} };
$('paramGroups').innerHTML = GROUPS.map(([title, fields]) => `
  <div class="sec">${title}</div>
  <div class="card">
    ${title === 'شاشة OLED' ? `<div class="chips" style="margin-bottom:14px">
      <button class="chip active" data-mode="0"><span data-i="grid"></span>الكل</button>
      <button class="chip" data-mode="1"><span data-i="hash"></span>رقمي</button>
      <button class="chip" data-mode="2"><span data-i="trend"></span>تناظري</button></div>` : ''}
    <div class="fg">${fields.map(([id,l,u,min,max]) => {
      SETTINGS_SCHEMA[id] = {min,max};
      return `<div class="f"><label>${l} (${min}-${max}${u})</label><input type="number" id="${id}" min="${min}" max="${max}"></div>`;
    }).join('')}</div>
  </div>`).join('');

const PRESETS = {
  default:{ sync_interval:10, oled_cycle_do:5, oled_cycle_ao:5, hold_duration:5, oled_display_mode:0, read_inputs:30, check_i2c:5, check_heap:30, save_eeprom:10, serial_print:30, fb_retry:10, sync_before_integrity:15, ai_threshold:50, max_fb_failures:1, ssl_lockout_base:30, ssl_lockout_max:120, max_consecutive_reinits:3 },
  reliable:{ sync_interval:5, oled_cycle_do:5, oled_cycle_ao:5, hold_duration:5, oled_display_mode:0, read_inputs:5, check_i2c:1, check_heap:10, save_eeprom:5, serial_print:15, fb_retry:10, sync_before_integrity:5, ai_threshold:20, max_fb_failures:1, ssl_lockout_base:10, ssl_lockout_max:60, max_consecutive_reinits:5 },
  efficient:{ sync_interval:300, oled_cycle_do:60, oled_cycle_ao:60, hold_duration:15, oled_display_mode:1, read_inputs:300, check_i2c:30, check_heap:300, save_eeprom:120, serial_print:300, fb_retry:60, sync_before_integrity:100, ai_threshold:100, max_fb_failures:3, ssl_lockout_base:120, ssl_lockout_max:600, max_consecutive_reinits:2 }
};
const PRESET_NAMES = { default:'افتراضي', reliable:'اعتمادية', efficient:'توفير' };
const OLED_MODE_NAMES = { 0:'الكل', 1:'رقمي', 2:'تناظري' };

/* ── status cards ── */
const card = (id, vid, label, cls='') => `<div class="sc ${cls}" id="${id}"><span class="l">${label}</span><span class="v" id="${vid}">--</span></div>`;
$('statusGrid').innerHTML = [['scWifi','WiFi'],['scFb','Firebase'],['scI2c','I2C'],['scNtp','NTP'],['scInteg','Integrity'],['scSsl','SSL'],['scFbFail','FB Failures'],['scRecovery','Recovery']].map(([id,l]) => card(id, id+'Val', l)).join('');
$('wifiGrid').innerHTML = card('scIp','infoWifiIp','IP','info') + card('scSsid','infoWifiSsid','SSID','info') + card('scMac','infoMac','MAC','info') + card('scRssi','infoRssi','RSSI');
$('sysGrid').innerHTML = card('scFw','infoFwVersion','Firmware','info') + card('scUp','infoUptime','Uptime','info') + card('scHeap','infoHeapFree','Heap') + card('scBoot','infoBootCount','Boot','info');
$('infoMac').style.fontSize = '11.5px';

/* ── toast ── */
let toastTimer;
function toast(msg, type='info'){
  const m = { success:'cc', error:'xc', warn:'alert', info:'info' };
  $('toastIcon').innerHTML = I(m[type] || 'info');
  $('toastMsg').textContent = msg;
  $('toast').className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3200);
}

/* ── event log ── */
const eventLog = [];
let notifCount = 0;
function addEvent(msg, type='info'){
  eventLog.unshift({ id: Date.now() + Math.random(), time: nowTime(), msg, type });
  if(eventLog.length > 100) eventLog.pop();
  renderEventLog();
  try{ localStorage.setItem('eventLog', JSON.stringify(eventLog.slice(0, 50))); }catch(e){}
  if(type !== 'info'){ notifCount++; updateNotifBadge(); }
}
function renderEventLog(){
  $('logCount').textContent = eventLog.length;
  $('eventLog').innerHTML = eventLog.length ? eventLog.slice(0, 50).map(e => `
    <div class="ev ${e.type}"><time>${e.time}</time><span>${e.msg}</span><button data-del="${e.id}" aria-label="حذف">${I('x')}</button></div>`).join('')
    : '<div style="text-align:center;color:var(--ink3);padding:22px;font-size:12.5px">لا توجد أحداث بعد</div>';
}
$('eventLog').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if(!b) return;
  const i = eventLog.findIndex(x => x.id === Number(b.dataset.del));
  if(i > -1){ eventLog.splice(i, 1); renderEventLog(); }
});
function updateNotifBadge(){
  const b = $('navNotifBadge');
  b.textContent = notifCount > 99 ? '99+' : notifCount;
  b.style.display = notifCount > 0 ? 'grid' : 'none';
}
try{ const s = localStorage.getItem('eventLog'); if(s) JSON.parse(s).forEach(e => eventLog.push(e)); }catch(e){}

/* ── navigation ── */
const PAGE_TITLES = { home:'ESP32 IOT DASHBOARD', monitor:'المراقبة', alarms:'التنبيهات', params:'الإعدادات', settings:'النظام' };
function switchPage(page){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('page-' + page)?.classList.add('active');
  $('viewTitle').textContent = PAGE_TITLES[page] || 'ESP32';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.nav === page));
  window.scrollTo({ top:0 });
  try{ localStorage.setItem('page', page); }catch(e){}
  if(page === 'alarms'){ notifCount = 0; updateNotifBadge(); }
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { haptic(); switchPage(t.dataset.nav); }));

/* ── theme ── */
function setBtn(btn, icon, text){ btn.querySelector('.bi').innerHTML = I(icon); btn.querySelector('.bt').textContent = text; }
function applyTheme(t){
  document.body.setAttribute('data-theme', t);
  setBtn($('themeBtn'), t === 'dark' ? 'sun' : 'moon', t === 'dark' ? 'الوضع الفاتح' : 'الوضع الليلي');
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#050a18' : '#0f1b33';
  try{ localStorage.setItem('theme', t); }catch(e){}
}
$('themeBtn').addEventListener('click', () => { haptic(); applyTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark'); });

/* ── notifications ── */
let notifyEnabled = false;
$('notifyBtn').addEventListener('click', async () => {
  if(!('Notification' in window)){ toast('غير مدعوم', 'error'); return; }
  if(!notifyEnabled){
    if(await Notification.requestPermission() === 'granted'){
      notifyEnabled = true; setBtn($('notifyBtn'), 'check', 'الإشعارات مفعّلة'); toast('تم تفعيل الإشعارات', 'success');
    }
  } else {
    notifyEnabled = false; setBtn($('notifyBtn'), 'bell', 'الإشعارات'); toast('تم تعطيل الإشعارات');
  }
});
function sendSystemNotification(title, body){ if(notifyEnabled) try{ new Notification(title, { body }); }catch(e){} }

$('refreshBtn').addEventListener('click', () => { haptic(); toast('تحديث البيانات...'); location.reload(); });
window.toggleCollapse = id => { haptic(); $(id).classList.toggle('open'); };

/* ── DO / DI tiles ── */
const doCards = {}, diCards = {};
for(let i = 1; i <= 6; i++){
  const d = document.createElement('div');
  d.className = 'tile';
  d.innerHTML = `<div class="lb">المرحل<b>${i}</b></div><button class="pwr" aria-label="DO${i}">${I('power')}</button><div class="stt">مغلق</div>`;
  d.querySelector('.pwr').addEventListener('click', () => toggleDO(i));
  $('doGrid').appendChild(d); doCards[i] = d;

  const n = document.createElement('div');
  n.className = 'tile';
  n.innerHTML = `<div class="lb">المدخل<b>${i}</b></div><div class="ind">${I('bulb')}</div><div class="stt">غير نشط</div>`;
  $('diGrid').appendChild(n); diCards[i] = n;
}
async function toggleDO(i){
  haptic();
  const key = 'DO' + i;
  if(sending.has(key)) return;
  const prev = st.DO[key], v = prev === 1 ? 0 : 1;
  st.DO[key] = v; renderDO(st.DO); sending.add(key);
  try{
    await set(ref(db, `${BASE}/DO/${key}`), v);
    addEvent(`DO${i} → ${v ? 'مفتوح' : 'مغلق'}`, v ? 'success' : 'info');
  }catch(e){
    st.DO[key] = prev; renderDO(st.DO); toast('تعذّر الإرسال', 'error'); addEvent(`فشل تغيير DO${i}`, 'error');
  }finally{ sending.delete(key); }
}

/* ── AO sliders / AI meters ── */
const aoSliders = {}, aoValues = {}, aiMeters = {}, aiValues = {};
const fill = s => s.style.setProperty('--p', (s.value / 255 * 100) + '%');
for(let i = 1; i <= 2; i++){
  const d = document.createElement('div');
  d.className = 'an';
  d.innerHTML = `<div class="an-h"><span>AO${i}</span><em><span id="aoV${i}">0</span><small>%</small></em></div><input type="range" class="rs" min="0" max="255" value="0" id="aoS${i}">`;
  $('aoBox').appendChild(d);
  const s = $('aoS' + i); aoSliders[i] = s; aoValues[i] = $('aoV' + i);
  s.addEventListener('input', () => { aoValues[i].textContent = Math.round(s.value / 255 * 100); fill(s); });
  s.addEventListener('change', async () => {
    haptic();
    const v = parseInt(s.value, 10);
    try{ await set(ref(db, `${BASE}/AO/AO${i}`), v); addEvent(`AO${i} → ${v}`); }
    catch(e){ toast('تعذّر الإرسال', 'error'); }
  });
}
for(let i = 1; i <= 4; i++){
  const d = document.createElement('div');
  d.className = 'an';
  d.innerHTML = `<div class="an-h"><span>AI${i}</span><em><span id="aiV${i}">0</span><small>%</small></em></div><div class="bar"><i id="aiF${i}"></i></div>`;
  $('aiBox').appendChild(d);
  aiMeters[i] = $('aiF' + i); aiValues[i] = $('aiV' + i);
}
const getAiColor = p => p < 30 ? '#3b82f6' : p < 60 ? '#10b981' : p < 85 ? '#f59e0b' : '#ef4444';

/* ── save settings ── */
async function saveSetting(key){
  const sc = SETTINGS_SCHEMA[key], input = $(key);
  if(!sc || !input) return;
  const v = Number(input.value.trim());
  if(!Number.isInteger(v) || v < sc.min || v > sc.max){ toast(`القيمة بين ${sc.min} و ${sc.max}`, 'error'); input.focus(); return; }
  haptic();
  try{ await set(ref(db, `${BASE}/status/${key}`), v); toast(`تم الحفظ: ${v}`, 'success'); addEvent(`حفظ ${key} = ${v}`, 'success'); }
  catch(e){ toast('تعذّر الحفظ', 'error'); }
}
Object.keys(SETTINGS_SCHEMA).forEach(key => {
  const input = $(key); if(!input) return;
  input.addEventListener('change', () => saveSetting(key));
  input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); saveSetting(key); } });
});
$('saveAllBtn').addEventListener('click', async () => {
  haptic(20);
  const u = {}; let n = 0;
  for(const key in SETTINGS_SCHEMA){
    const input = $(key); if(!input) continue;
    const v = Number(input.value.trim()), sc = SETTINGS_SCHEMA[key];
    if(Number.isInteger(v) && v >= sc.min && v <= sc.max){ u[`${BASE}/status/${key}`] = v; n++; }
  }
  try{ await update(ref(db), u); toast(`تم حفظ ${n} إعداد`, 'success'); addEvent(`حفظ شامل: ${n} إعداد`, 'success'); }
  catch(e){ toast('تعذّر الحفظ', 'error'); }
});

/* ── presets / OLED / reconnect ── */
document.querySelectorAll('[data-preset]').forEach(btn => btn.addEventListener('click', async () => {
  haptic(20);
  const name = btn.dataset.preset, u = {};
  for(const [k,v] of Object.entries(PRESETS[name])) u[`${BASE}/status/${k}`] = v;
  try{
    await update(ref(db), u);
    toast(`تم تطبيق: ${PRESET_NAMES[name]}`, 'success'); addEvent(`تطبيق إعداد: ${PRESET_NAMES[name]}`, 'success');
    document.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('active', b === btn));
  }catch(e){ toast('تعذّر التطبيق', 'error'); }
}));
document.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', async () => {
  haptic();
  const mode = Number(btn.dataset.mode);
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b === btn));
  currentOledMode = mode;
  try{ await set(ref(db, `${BASE}/status/oled_display_mode`), mode); toast(`النمط: ${OLED_MODE_NAMES[mode]}`, 'success'); }
  catch(e){ toast('تعذّر الحفظ', 'error'); }
}));
const RL = { wifi:'WiFi', firebase:'Firebase', ntp:'NTP', restart:'RESTART', all:'الكل' };
document.querySelectorAll('[data-reconnect]').forEach(btn => btn.addEventListener('click', async () => {
  haptic(15);
  const cmd = btn.dataset.reconnect;
  if(cmd === 'restart' && !confirm('⚠️ إعادة تشغيل الجهاز؟')) return;
  try{
    await set(ref(db, `${BASE}/cmd/${cmd === 'all' ? 'refresh_all' : cmd}`), 1);
    toast(`تم: ${RL[cmd]}`, 'success'); addEvent(`إعادة اتصال: ${RL[cmd]}`, 'warn');
  }catch(e){ toast('تعذّر الإرسال', 'error'); }
}));

/* ── render ── */
function renderDO(d){
  let n = 0;
  for(let i = 1; i <= 6; i++){
    const on = d['DO' + i] === 1; n += on;
    doCards[i].classList.toggle('on', on);
    doCards[i].querySelector('.stt').textContent = on ? 'مفتوح' : 'مغلق';
  }
  $('doCnt').textContent = n + '/6';
}
function renderDI(d){
  let n = 0;
  for(let i = 1; i <= 6; i++){
    const on = d['DI' + i] === 1; n += on;
    const c = diCards[i], was = c.classList.contains('on');
    c.classList.toggle('on', on);
    c.querySelector('.stt').textContent = on ? 'نشط' : 'غير نشط';
    if(was !== on){
      sendSystemNotification(`DI${i}`, on ? 'نشط' : 'غير نشط');
      addEvent(`DI${i} → ${on ? 'نشط' : 'غير نشط'}`, on ? 'success' : 'info');
    }
  }
  $('diCnt').textContent = n + '/6';
}
function renderAO(d){
  for(let i = 1; i <= 2; i++){
    const v = numOr(d['AO' + i]), s = aoSliders[i];
    if(document.activeElement !== s) s.value = v;
    fill(s);
    aoValues[i].textContent = Math.round(v / 255 * 100);
  }
}
function renderAI(d){
  for(let i = 1; i <= 4; i++){
    const p = Math.round(numOr(d['AI' + i]) / AI_MAX * 100), c = getAiColor(p);
    aiMeters[i].style.width = p + '%'; aiMeters[i].style.background = c;
    aiValues[i].textContent = p; aiValues[i].style.color = c;
  }
}
function setCard(id, ok, onTxt, offTxt){
  const c = $(id); if(!c) return;
  c.className = 'sc ' + (ok ? 'ok' : 'err');
  $(id + 'Val').textContent = ok ? onTxt : offTxt;
}
function setConn(ok){
  $('pill').classList.toggle('ok', ok);
  $('pill').querySelector('span').textContent = ok ? 'متصل' : 'غير متصل';
}
function renderStatus(v){
  setCard('scWifi', v.wifi === 1, 'متصل', 'غير متصل');
  setCard('scFb', v.firebase === 1, 'متصل', 'غير متصل');
  setCard('scI2c', v.i2c === 1, 'سليم', 'خطأ');
  setCard('scNtp', v.ntp === 1, 'مزامن', 'غير مزامن');
  setConn(v.wifi === 1 && v.firebase === 1);

  const integ = numOr(v.integrite, -1);
  if(integ >= 0 && integ <= 2){
    $('scIntegVal').textContent = ['سليم','جزئي','حرج'][integ];
    $('scInteg').className = 'sc ' + ['ok','warn','err'][integ];
  }
  const ssl = numOr(v.ssl_errors);
  $('scSslVal').textContent = ssl; $('scSsl').className = 'sc ' + (ssl === 0 ? 'ok' : ssl < 3 ? 'warn' : 'err');
  const ff = numOr(v.fb_failures);
  $('scFbFailVal').textContent = ff; $('scFbFail').className = 'sc ' + (ff === 0 ? 'ok' : 'warn');

  if(v.version) $('infoFwVersion').textContent = 'v' + v.version;
  if(v.oled_display_mode !== undefined){
    const m = numOr(v.oled_display_mode);
    if(m !== currentOledMode){
      currentOledMode = m;
      document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', Number(b.dataset.mode) === m));
    }
  }
  const heap = numOr(v.heap_k, -1);
  if(heap >= 0){ $('infoHeapFree').textContent = heap + ' KB'; $('scHeap').className = 'sc ' + (heap < 30 ? 'err' : heap < 60 ? 'warn' : 'ok'); }
  const rssi = v.rssi == null ? null : numOr(v.rssi, null);
  if(rssi !== null){ $('infoRssi').textContent = rssi + ' dBm'; $('scRssi').className = 'sc ' + (rssi > -60 ? 'ok' : rssi > -75 ? 'warn' : 'err'); }

  Object.keys(SETTINGS_SCHEMA).forEach(key => {
    const input = $(key);
    if(!input || document.activeElement === input) return;
    if(v[key] != null) input.value = v[key];
  });
}
function fmtUptime(sec){
  sec = numOr(sec);
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60);
  return d > 0 ? `${d}d ${h}h` : h > 0 ? `${h}h ${m}m` : `${m}m ${sec%60}s`;
}
function renderInfo(info){
  $('infoWifiIp').textContent = info.wifi_ip || '--';
  $('infoWifiSsid').textContent = info.wifi_ssid || '--';
  $('infoMac').textContent = info.mac_address || '--';
  $('infoBootCount').textContent = info.boot_count ?? '--';
  $('infoUptime').textContent = fmtUptime(info.uptime_s);
  const lvl = info.recovery_level || 'none', att = numOr(info.recovery_attempts);
  const names = { none:'سليم', fb:'Firebase', wifi:'WiFi', deep:'Deep Reset' };
  $('scRecoveryVal').textContent = `${names[lvl] || lvl} (${att})`;
  $('scRecovery').className = 'sc ' + (lvl === 'none' ? 'ok' : 'info');
}

/* ── firebase listeners ── */
onValue(ref(db, `${BASE}/status`), s => { st.status = s.val() || {}; renderStatus(st.status); });
onValue(ref(db, `${BASE}/info`), s => { st.info = s.val() || {}; renderInfo(st.info); });
const bind = (k, fn) => onValue(ref(db, `${BASE}/${k}`), s => { st[k] = s.val() || {}; fn(st[k]); });
bind('DO', renderDO); bind('DI', renderDI); bind('AO', renderAO); bind('AI', renderAI);
onValue(ref(db, '.info/connected'), s => {
  if(s.val() !== true){
    toast('انقطع الاتصال بـ Firebase', 'warn'); addEvent('انقطع الاتصال', 'error'); sendSystemNotification('KC868-A6', 'انقطع الاتصال');
  } else addEvent('تم الاتصال بـ Firebase', 'success');
});

/* ── init ── */
icons(document);
setConn(false);
renderEventLog(); updateNotifBadge();
let t0 = 'light';
try{ t0 = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); }catch(e){}
applyTheme(t0);
addEvent('تشغيل المنصة ' + APP_VERSION, 'success');
let p0 = 'home';
try{ p0 = localStorage.getItem('page') || 'home'; }catch(e){}
switchPage(p0);
</script>
