<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ln:#2d343b;--tx:#e3e9ee;--dim:#8a97a3;--cy:#19d3e6;--gr:#2fe05a;--rd:#ff3b30;--am:#ffa31a;--bl:#2d8cff;--ye:#ffe83a;--sans:'Tajawal',system-ui,sans-serif;--mono:'Share Tech Mono',ui-monospace,monospace}

body{font:500 14px/1.5 var(--sans);color:var(--tx);background:repeating-linear-gradient(90deg,#2a3036 0 2px,#353c43 2px 4px);display:flex;overflow:hidden;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.frame{flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(#1a1e23,#0b0e11);border:3px solid var(--cy);border-radius:18px;box-shadow:0 0 18px #19d3e688,inset 0 0 22px #19d3e633;overflow:hidden;max-width:900px;width:100%;margin:0 auto}
.hd{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--ln);background:linear-gradient(#232930,#15191d)}

.hd small{font:12px var(--mono);color:var(--dim);direction:ltr;display:block;text-align:right}
.ib{width:38px;height:38px;border-radius:8px;border:1px solid #5b646c;background:linear-gradient(#4d555d,#2a2f35);box-shadow:0 2px 3px #0009,inset 0 1px 0 #fff3;font-size:16px;flex:none;position:relative}
.ib:active{transform:translateY(1px)}
.nb{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--rd);border-radius:9px;font:700 10px/16px var(--mono);min-width:16px;padding:0 3px;display:none}
.ib.hb .nb{display:block}
.off{display:none;background:var(--am);color:#111;text-align:center;font-weight:800;font-size:12px;padding:4px}.off.show{display:block}
main{flex:1;overflow-y:auto;padding:10px;min-height:0}

.lamp{display:inline-block;width:30px;height:30px;border-radius:50%;flex:none;border:3px solid #6d7782;background:radial-gradient(circle at 35% 30%,#3c434a,#14171a);box-shadow:inset 0 2px 4px #000;transition:.2s;--c:#555}
.lamp.s{width:20px;height:20px;border-width:2px}
.lamp.on,.k.ok .lamp,.k.warn .lamp,.k.err .lamp{background:radial-gradient(circle at 35% 30%,#fffc,var(--c) 45%,color-mix(in srgb,var(--c) 35%,#000));box-shadow:0 0 14px var(--c)}
.k.ok .lamp{--c:var(--gr)}.k.warn .lamp{--c:var(--am)}.k.err .lamp{--c:var(--rd)}
.ls{display:flex;flex-wrap:wrap;justify-content:space-around;gap:10px}

.bt:active{transform:translateY(1px);filter:brightness(.88)}.bt:disabled{opacity:.5}
.bt.c{background:linear-gradient(#1fb5c6,#0b6f7b);border-color:#34e0f0}.bt.d{background:linear-gradient(#c8392f,#6d1812);border-color:#ff7a70}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}

.tk{height:14px;margin:4px 56px 2px;direction:ltr;background:repeating-linear-gradient(90deg,#667 0 1px,transparent 1px 10%);opacity:.8}
.tl{display:flex;justify-content:space-between;margin:0 48px;font:12px var(--mono);direction:ltr;color:var(--dim)}
.pre{display:flex;gap:6px;margin-top:10px}.pre .bt{height:34px;padding:0;font:13px var(--mono)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}.fld label small{margin-inline-start:4px;font:11px var(--mono)}
.stp{display:flex;gap:6px;align-items:stretch}
.stp input{flex:1;width:100%;height:50px;font-size:24px;text-align:center;outline:0;-moz-appearance:textfield}
.stp input:focus{border-color:var(--cy)}
.stp input::-webkit-inner-spin-button{display:none}
.ud{display:flex;flex-direction:column;gap:4px}.ud button{width:38px;height:23px;border-radius:5px;background:linear-gradient(#59616a,#2d3238);border:1px solid #5b646c;font-size:10px;box-shadow:0 1px 2px #000}.ud button:active{filter:brightness(.8)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg .bt.on{background:linear-gradient(#1fb5c6,#0b6f7b);border-color:#34e0f0}
.k{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1f252a;font-size:12px;color:var(--dim)}
.k .lamp{width:14px;height:14px;border-width:2px;box-shadow:none}.k .lcd{margin-inline-start:auto;max-width:60%;overflow-wrap:anywhere}
.k.ok .lcd{color:var(--gr)}.k.warn .lcd{color:var(--am)}.k.err .lcd{color:var(--rd)}
.kg{display:grid;grid-template-columns:1fr;gap:0 18px}@media(min-width:700px){.kg{grid-template-columns:1fr 1fr}}
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ln);background:linear-gradient(#1b2025,#0d1013)}
.nav button{padding:10px 2px 8px;font-size:12px;font-weight:700;color:var(--dim);border-inline-start:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button b{font-size:18px;font-weight:400}
.nav button.active{color:#fff;background:linear-gradient(#1b2b30,#15191d)}.nav button.active::after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:3px;background:var(--cy);box-shadow:0 0 8px var(--cy);border-radius:2px}
.md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.md.show{display:flex}
.mb{width:100%;max-width:460px;max-height:88dvh;overflow-y:auto;background:linear-gradient(#1b1f24,#101316);border:2px solid var(--cy);border-radius:12px;padding:14px;box-shadow:0 0 22px #19d3e655}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800;font-size:16px}
.ev{display:flex;gap:10px;padding:8px;background:#0e1114;border-radius:6px;margin-bottom:6px;border-inline-start:3px solid var(--cy);font-size:13px;align-items:center}
.ev.success{border-color:var(--gr)}.ev.warn{border-color:var(--am)}.ev.error{border-color:var(--rd)}
.ev div{flex:1}.ev small{display:block;font:11px var(--mono);color:var(--dim)}
.rw{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.tg{width:56px;height:30px;border-radius:15px;background:#050607;border:1px solid var(--ln);position:relative}
.tg::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#7a838b;transition:.2s}
.tg.on{border-color:var(--cy)}.tg.on::after{inset-inline-start:29px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.day{padding:10px 0;border-radius:6px;background:#242a30;font-size:12px;font-weight:700}.day.on{background:var(--cy);color:#012}
.dv{display:flex;gap:6px;align-items:center;padding:8px;background:#0e1114;border-radius:6px;margin-bottom:6px;border:1px solid var(--ln)}
.dv.on{border-color:var(--cy)}.dv div{flex:1;min-width:0;cursor:pointer}.dv small{display:block;font:11px var(--mono);color:var(--dim);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis}
.dv .ib{width:34px;height:34px}
.toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-14px);background:#14202b;border:1px solid var(--cy);padding:10px 18px;border-radius:8px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{border-color:var(--rd)}.toast.warn{border-color:var(--am)}.toast.success{border-color:var(--gr)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="bz" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d5dbe0"/><stop offset=".5" stop-color="#6c747c"/><stop offset="1" stop-color="#c3cad0"/></linearGradient></defs></svg>
<div class="frame">

<script type="module">
import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getDatabase, ref, onValue, set, update, remove } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

const $=id=>document.getElementById(id), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n:d};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>crypto.randomUUID?.()??Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const haptic=(m=10)=>{try{navigator.vibrate?.(m)}catch{}};
const debounce=(f,w=400)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),w)}};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const AI_MAX=4095, STALE=90000;
const P={STATUS:'/status',INFO:'/info',DO:'/DO',DI:'/DI',AO:'/AO',AI:'/AI',SCHEDULE:'/schedule',CMD:'/cmd'};
const DEF={id:'default',name:'KC868-A6',url:'https://said-rahil-default-rtdb.firebaseio.com',base:'Said'};
const S={devices:LS.get('devices',[DEF]),activeId:LS.get('activeDeviceId','default'),app:null,db:null,base:'/Said',un:[],fb:false,DO:{},DI:{},AO:{},AI:{},status:{},info:{},schedule:{},log:LS.get('eventLog',[]),unread:0,muted:LS.get('notifyMuted',false),diReady:false,lastBeat:0,lastUp:null,names:LS.get('relayNames',{}),sending:new Set(),es:null};
let queue=LS.get('offlineQueue',[]);
const qPush=(path,value)=>{queue=queue.filter(q=>!(q.path===path&&q.dev===S.activeId));queue.push({path,value,dev:S.activeId});queue=queue.slice(-100);LS.set('offlineQueue',queue)};

let tT;const toast=(m,t='')=>{const e=$('toast');e.textContent=m;e.className='toast show '+t;clearTimeout(tT);tT=setTimeout(()=>e.className='toast',2600)};
setInterval(()=>{$('clk').textContent=new Date().toLocaleString('en-GB',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).replace(',','')},1000);

/* modal */
const mbody=$('mbody');
const modal=(t,h)=>{$('mt').innerHTML=t;mbody.innerHTML=h;$('modal').classList.add('show')};
const closeM=()=>{$('modal').classList.remove('show');S.es=null;S.inLog=false};
$('mx').onclick=closeM;$('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
const ACT={};
mbody.onclick=e=>{const b=e.target.closest('[data-a]');if(b)ACT[b.dataset.a]?.(b)};

/* log */
function addEvent(msg,type='info'){
  S.log.unshift({id:uid(),time:new Date().toLocaleTimeString('en-GB'),msg,type});S.log=S.log.slice(0,150);LS.set('eventLog',S.log.slice(0,100));
  if(type!=='info'&&!S.muted&&!S.inLog)S.unread++;
  if(S.inLog)renderLog();badge();
}
function badge(){$('nb').textContent=S.unread>99?'99+':S.unread;$('bLog').classList.toggle('hb',S.unread>0&&!S.muted)}
function renderLog(){
  const b=$('logList');if(!b)return;
  b.innerHTML=S.log.length?S.log.slice(0,60).map(e=>`<div class="ev ${e.type}"><div>${esc(e.msg)}<small>${e.time}</small></div><button data-a="evdel" data-id="${e.id}">✕</button></div>`).join(''):'<p style="text-align:center;color:var(--dim);padding:20px">لا توجد أحداث بعد</p>';
}
$('bLog').onclick=()=>{haptic();S.unread=0;badge();S.inLog=true;
  modal('سجل الأحداث',`<div class="two" style="margin-bottom:10px"><button class="bt" data-a="mute">${S.muted?'🔔 تفعيل الإشعارات':'🔕 كتم الإشعارات'}</button><button class="bt d" data-a="clr">حذف السجل</button></div><div id="logList"></div>`);renderLog()};
ACT.evdel=b=>{S.log=S.log.filter(x=>x.id!==b.dataset.id);LS.set('eventLog',S.log);renderLog()};
ACT.clr=()=>{if(!S.log.length||!confirm('حذف جميع الأحداث؟'))return;S.log=[];LS.set('eventLog',[]);renderLog();toast('تم الحذف','success')};
ACT.mute=b=>{S.muted=!S.muted;LS.set('notifyMuted',S.muted);S.unread=0;badge();b.textContent=S.muted?'🔔 تفعيل الإشعارات':'🔕 كتم الإشعارات'};

/* nav */
const TT={home:'الرئيسية',monitor:'المراقبة',params:'الإعدادات',system:'النظام'};

/* connection */
function paintConn(){
  const on=navigator.onLine;$('off').classList.toggle('show',!on);
  const fresh=!S.lastBeat||Date.now()-S.lastBeat<STALE;
  $('connStatus').textContent=!on?'Offline':!S.fb?'غير متصل':!fresh?'لا يستجيب':'متصل';
  const st=S.status||{},o=(id,v)=>$(id).classList.toggle('on',!!v);
  o('l_rdy',on&&S.fb&&fresh);o('l_act',Object.values(S.DO).some(v=>v===1));
  o('l_alt',!on||!S.fb||!fresh||num(st.ssl_errors)>0||num(st.integrity)>0);
  o('l_wifi',st.wifi===1);o('l_ntp',st.ntp===1);o('l_i2c',st.i2c===1);
}
setInterval(paintConn,5000);
addEventListener('online',()=>{paintConn();flushQueue()});addEventListener('offline',()=>{paintConn();toast('انقطع الإنترنت','warn')});

/* firebase io */
async function flushQueue(){
  if(!S.db||!S.fb||!queue.length)return;
  const mine=queue.filter(q=>q.dev===S.activeId),rest=queue.filter(q=>q.dev!==S.activeId),fail=[];
  for(const it of mine){try{await set(ref(S.db,S.base+it.path),it.value)}catch{fail.push(it)}}
  queue=[...rest,...fail];LS.set('offlineQueue',queue);
}
async function write(path,v){if(!S.db||!S.fb){qPush(path,v);return false}try{await set(ref(S.db,S.base+path),v);return true}catch{qPush(path,v);return false}}
async function multi(m){if(!S.db||!S.fb){for(const k in m)qPush('/'+k,m[k]);return false}try{await update(ref(S.db,S.base),m);return true}catch{for(const k in m)qPush('/'+k,m[k]);return false}}
async function erase(p=''){if(!S.db||!S.fb)return false;try{await remove(ref(S.db,S.base+p));return true}catch{return false}}

async function connect(d){
  S.un.forEach(u=>{try{u()}catch{}});S.un=[];
  if(S.app){try{await deleteApp(S.app)}catch{}S.app=S.db=null}
  Object.assign(S,{DO:{},DI:{},AO:{},AI:{},status:{},info:{},schedule:{},diReady:false,lastBeat:0,lastUp:null,fb:false});
  try{
    S.app=initializeApp({databaseURL:d.url},`app-${d.id}-${uid()}`);S.db=getDatabase(S.app);
    S.base='/'+(d.base||'Said').replace(/^\/+|\/+$/g,'');
    const bind=(p,h)=>S.un.push(onValue(ref(S.db,S.base+p),s=>h(s.val()||{})));
    bind(P.STATUS,v=>{S.status=v;renderStatus(v);paintConn()});
    bind(P.INFO,v=>{S.info=v;renderInfo(v)});
    bind(P.DO,v=>{S.DO=v;renderDO()});bind(P.DI,v=>{S.DI=v;renderDI()});
    bind(P.AO,v=>{S.AO=v;renderAO()});bind(P.AI,v=>{S.AI=v;renderAI()});
    bind(P.SCHEDULE,v=>{S.schedule=v;renderSched()});
    S.un.push(onValue(ref(S.db,'.info/connected'),s=>{S.fb=s.val()===true;paintConn();addEvent(S.fb?'تم الاتصال بـ Firebase':'انقطع الاتصال بـ Firebase',S.fb?'success':'error');if(S.fb)flushQueue()}));
  }catch(e){console.error(e);toast('تعذّر الاتصال بـ Firebase','error')}
  $('devTitle').textContent=d.name;renderNames();renderDO();renderDI();renderAO();renderAI();renderSched();paintConn();
}

/* analog gauges */
const PT=(p,r)=>{const a=(135+2.7*p)*Math.PI/180;return[(100+r*Math.cos(a)).toFixed(1),(100+r*Math.sin(a)).toFixed(1)]};
const arc=(p1,p2,r)=>{const[a,b]=PT(p1,r),[c,d]=PT(p2,r);return`M${a} ${b}A${r} ${r} 0 ${(p2-p1)*2.7>180?1:0} 1 ${c} ${d}`};
function gaugeSVG(){
  let t='';
  for(let p=0;p<=100;p+=10){const[a,b]=PT(p,66),[c,d]=PT(p,76),[x,y]=PT(p,54);t+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#cfd8df" stroke-width="2"/><text x="${x}" y="${y}" fill="#cfd8df" font-size="11" text-anchor="middle" dominant-baseline="middle" font-family="monospace">${p}</text>`}
  return`<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="98" fill="url(#bz)"/><circle cx="100" cy="100" r="90" fill="#0c0f12"/>
  <path d="${arc(0,60,83)}" stroke="#2fe05a" stroke-width="5" fill="none"/><path d="${arc(60,85,83)}" stroke="#ffa31a" stroke-width="5" fill="none"/><path d="${arc(85,100,83)}" stroke="#ff3b30" stroke-width="5" fill="none"/>${t}
  <text x="100" y="128" fill="#8a97a3" font-size="12" text-anchor="middle">%</text>
  <g class="nd"><line x1="100" y1="106" x2="100" y2="30" stroke="#ff5a2a" stroke-width="3" stroke-linecap="round"/></g><circle cx="100" cy="100" r="8" fill="#2a3036" stroke="#9aa3ab" stroke-width="2"/></svg>`;
}
const gEl={};
for(let i=1;i<=4;i++){
  const d=document.createElement('div');d.className='gauge';
  d.innerHTML=`<div class="gt">AI${i}</div>${gaugeSVG()}<div class="lcd" id="gp${i}">0 %</div><div class="lcd sm" id="gr${i}" style="width:80%;text-align:center">0</div>`;
  $('aiBox').appendChild(d);gEl[i]=d.querySelector('.nd');
}
const aiCol=p=>p<60?'#2fe05a':p<85?'#ffa31a':'#ff3b30';
function renderAI(){

const aoS={},aoV={};
for(let i=1;i<=2;i++){

  <div class="sl"><button class="bt" data-st="${i}" data-d="-5">−</button><input type="range" class="rs" min="0" max="255" value="0" id="aoS${i}" aria-label="AO${i}"><button class="bt" data-st="${i}" data-d="5">+</button></div>

  $('aoBox').appendChild(d);

async function devForm(d){
  const name=prompt('اسم الجهاز',d.name);if(!name)return;
  const url=(prompt('رابط Firebase (https://…)',d.url)||'').trim().replace(/\/+$/,'');if(!/^https:\/\/.+/.test(url))return toast('الرابط يجب أن يبدأ بـ https://','error');
  const base=(prompt('المسار الأساسي',d.base||'Said')||'Said').trim();
  const ex=S.devices.find(x=>x.id===d.id),re=ex&&ex.id===S.activeId&&(ex.url!==url||ex.base!==base);
  if(ex)Object.assign(ex,{name:name.trim(),url,base});else S.devices.push({id:uid(),name:name.trim(),url,base});
  LS.set('devices',S.devices);closeM();toast('تم الحفظ','success');
  if(re)await connect(ex);else $('devTitle').textContent=S.devices.find(x=>x.id===S.activeId).name;

  const d=S.devices.find(x=>x.id===b.dataset.id);if(!d||!confirm(`حذف "${d.name}" من القائمة؟ (بيانات Firebase لن تُمس)`))return;

  if(d.id===S.activeId){S.activeId=S.devices[0].id;LS.set('activeDeviceId',S.activeId);await connect(S.devices[0])}

/* system page */
const SG=[['الاتصالات',[['wifi','WiFi'],['fb','Firebase'],['ntp','NTP'],['i2c','I2C']]],['صحة النظام',[['integ','Integrity'],['heap','Heap'],['largest','Largest'],['uptime','Uptime']]],
['الأخطاء والمزامنة',[['ssl','SSL Errors'],['ff','FB Failures'],['rec','Recovery'],['phase','Sync Phase'],['hardRst','Hard Resets'],['refreshes','Refreshes'],['cooldown','Cooldown'],['backoff','Backoff'],['lastSync','آخر مزامنة'],['countdown','العدّاد'],['lastCmd','آخر أمر'],['cmdStatus','حالة الأمر']]],
['الشبكة',[['ip','IP'],['ssid','SSID'],['mac','MAC'],['rssi','RSSI']]],['معلومات الجهاز',[['fw','Firmware'],['up','Uptime'],['boot','Boot Count'],['reason','Boot Reason']]]];
$('sysGroups').innerHTML=SG.map(([t,ks])=>`<div class="pn"><h2>${t}</h2><div class="kg">${ks.map(([id,l])=>`<div class="k" id="k_${id}"><i class="lamp"></i><span>${l}</span><span class="lcd sm" id="v_${id}">--</span></div>`).join('')}</div></div>`).join('');
const sk=(id,t,c='')=>{const k=$('k_'+id);if(!k)return;$('v_'+id).textContent=t;k.className='k '+c};
const fmtUp=s=>{s=num(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m ${s%60}s`};
function renderStatus(v){
  if(!v||!Object.keys(v).length){SG.slice(0,3).forEach(([,ks])=>ks.forEach(([id])=>sk(id,'--')));return}
  const yn=(id,ok,a,b)=>sk(id,ok?a:b,ok?'ok':'err');
  yn('wifi',v.wifi===1,'متصل','غير متصل');yn('fb',v.firebase===1,'متصل','غير متصل');yn('i2c',v.i2c===1,'سليم','خطأ');yn('ntp',v.ntp===1,'مزامن','غير مزامن');
  const ig=num(v.integrity,-1);if(ig>=0&&ig<=2)sk('integ',['سليم','جزئي','حرج'][ig],['ok','warn','err'][ig]);
  const h=num(v.heap_k,-1);if(h>=0)sk('heap',h+' KB',h<30?'err':h<60?'warn':'ok');
  const lg=num(v.largest_k,-1);if(lg>=0)sk('largest',lg+' KB',lg<50?'err':lg<70?'warn':'ok');
  const uh=num(v.uptime_h,-1);if(uh>=0)sk('uptime',uh+'h',uh>1?'ok':'');
  const ssl=num(v.ssl_errors);sk('ssl',ssl,ssl===0?'ok':ssl<3?'warn':'err');
  const ff=num(v.fb_failures);sk('ff',ff,ff===0?'ok':'warn');
  if(v.version)sk('fw','v'+v.version);
  if(v.rssi!=null){const r=num(v.rssi);sk('rssi',r+' dBm',r>-60?'ok':r>-75?'warn':'err')}
  const rl=num(v.recovery_level);sk('rec',`${['سليم','Firebase','WiFi','Deep Reset','Restart'][rl]||rl} (${num(v.recovery_attempts)})`,rl===0?'ok':'warn');
  const ph=num(v.sync_phase);sk('phase',['Idle','Read','Write'][ph]||ph,ph===0?'ok':'warn');
  const hr=num(v.ssl_hard_resets);sk('hardRst',hr,hr===0?'ok':hr<5?'warn':'err');
  const rf=num(v.ssl_session_refreshes);sk('refreshes',rf,rf<10?'ok':rf<30?'warn':'err');
  const cd=num(v.ssl_cooldown_remaining_s);sk('cooldown',cd+'s',cd===0?'ok':cd<60?'warn':'err');
  const bo=num(v.ssl_backoff_remaining_s);sk('backoff',bo+'s',bo===0?'ok':'warn');
  const ls=num(v.last_sync_ago_s,-1);ls>=0?sk('lastSync',ls+'s',ls<120?'ok':'warn'):sk('lastSync','--');
  const c=num(v.sync_countdown_s,-9);c>=0?sk('countdown',c+'s','ok'):c===-1?sk('countdown','Locked','warn'):c===-2?sk('countdown','Error','err'):c===-3?sk('countdown','No WiFi','err'):sk('countdown','--');
  sk('lastCmd',v.last_cmd||'--',v.last_cmd?'ok':'');const cs=num(v.last_cmd_status);sk('cmdStatus',['idle','sent','done'][cs]||'done',cs===2?'ok':'');
  if(v.oled_display_mode!=null)$$('#oledModes button').forEach(b=>b.classList.toggle('on',+b.dataset.mode===num(v.oled_display_mode)));
  for(const k in SCHEMA){const e=$(k);if(e&&document.activeElement!==e&&v[k]!=null)e.value=v[k]}
}
function renderInfo(i){
  if(!i||!Object.keys(i).length){['ip','ssid','mac','up','boot','reason'].forEach(k=>sk(k,'--'));return}
  if(i.uptime_s!==S.lastUp){S.lastUp=i.uptime_s;S.lastBeat=Date.now();paintConn()}
  sk('ip',i.wifi_ip||'--','ok');sk('ssid',i.wifi_ssid||'--');sk('mac',i.mac_address||'--');sk('boot',i.boot_count??'--');sk('up',fmtUp(i.uptime_s));sk('reason',i.last_boot_reason||'--');
}

/* commands */
const RL={wifi:'WiFi',firebase:'Firebase',ntp:'NTP',restart:'إعادة التشغيل',all:'تحديث الكل'};
$$('[data-rc]').forEach(b=>b.onclick=async()=>{
  haptic(15);const c=b.dataset.rc;
  if(c==='restart'&&!confirm('إعادة تشغيل لوحة KC868-A6؟ قد ينقطع الاتصال مؤقتاً.'))return;
  b.disabled=true;
  if(await write(`${P.CMD}/${c==='all'?'refresh_all':c}`,1)){addEvent('أمر: '+RL[c],'warn');await Promise.all([erase(P.STATUS),erase(P.INFO)]);toast('تم إرسال: '+RL[c],'warn')}
  else toast('تعذّر الإرسال الآن، سيُرسل لاحقاً','error');
  setTimeout(()=>b.disabled=false,1500);
});
$('wipeBtn').onclick=async()=>{
  haptic(30);
  if(!confirm('سيتم حذف جميع بيانات هذا الجهاز من Firebase ولا يمكن التراجع.'))return;
  if(!confirm('تأكيد نهائي: هل أنت متأكد تماماً؟'))return;
  await erase('');S.log=[];S.unread=0;LS.set('eventLog',[]);LS.set('offlineQueue',[]);queue=[];badge();toast('تم حذف البيانات','success');
};
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
addEventListener('error',e=>console.error('[Global]',e.error||e.message));

/* boot */
(async()=>{
  badge();
  const d=S.devices.find(x=>x.id===S.activeId)||S.devices[0];S.activeId=d.id;
  await connect(d);go(LS.get('page','home'));addEvent('تشغيل HMI v15 — ESP32 v49.7.5','success');
})();
</script>
</body>
</html>
