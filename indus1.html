<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RÉSEAU INDUSTRIEL PROFESSIONNEL MAROCAIN</title>
<meta name="theme-color" content="#1A2332">
<meta name="description" content="نربط الموردين والشركات في مكان واحد">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Réseau Industriel">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  /* Industrial Classic Palette */
  --steel-900:#0F1620;
  --steel-800:#1A2332;
  --steel-700:#2A3546;
  --steel-600:#3D4A5C;
  --steel-500:#5A6878;
  --steel-400:#8894A4;
  
  --rust-900:#7C2D12;
  --rust-800:#9A3412;
  --rust-700:#C2410C;
  --rust-600:#EA580C;
  --rust-500:#F97316;
  --rust-soft:#FFF3E8;
  
  --industrial-yellow:#FFC20E;
  --industrial-yellow-dark:#D4A017;
  --yellow-soft:#FFFBE8;
  
  /* Neutrals */
  --bg:#E8E5DF;
  --bg-grid:#D9D5CC;
  --surface:#FAF8F3;
  --surface-2:#F0EDE5;
  --surface-hover:#E5E1D6;
  --border:#C5BFB0;
  --border-strong:#8B8578;
  --border-heavy:#3D3A33;
  
  --text-primary:#1A1815;
  --text-secondary:#57534E;
  --text-tertiary:#8B8578;
  --text-inverse:#FAF8F3;
  
  --success:#15803D;
  --success-soft:#DCFCE7;
  --danger:#B91C1C;
  --danger-soft:#FEE2E2;
  --warning:#B45309;
  --warning-soft:#FEF3C7;
  --info:#1E40AF;
  --info-soft:#DBEAFE;
  --wa:#128C7E;
  --wa-soft:#D1FAE5;
  --fb:#1877F2;
  --fb-soft:#DBEAFE;
  
  /* Sharp shadows — industrial */
  --sh-xs:2px 2px 0 rgba(26,24,21,.12);
  --sh-sm:3px 3px 0 rgba(26,24,21,.15);
  --sh-md:4px 4px 0 rgba(26,24,21,.18);
  --sh-lg:6px 6px 0 rgba(26,24,21,.22);
  --sh-xl:8px 8px 0 rgba(26,24,21,.28);
  
  /* Sharp corners */
  --r-sm:2px;
  --r-md:3px;
  --r-lg:4px;
  --r-full:0px;
  
  --btn-size:44px;
  --header-h:70px;
  --botnav-h:68px;
  
  --fh:'Bebas Neue','Oswald',sans-serif;
  --fh2:'Oswald',sans-serif;
  --fb:'IBM Plex Sans Arabic',sans-serif;
  --fm:'JetBrains Mono',monospace;
  
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0A0F16;
  --bg-grid:#131A24;
  --surface:#151C27;
  --surface-2:#1C2532;
  --surface-hover:#252F3D;
  --border:#2E3A4A;
  --border-strong:#4A5868;
  --border-heavy:#8B8578;
  --text-primary:#E8E5DF;
  --text-secondary:#A8A29E;
  --text-tertiary:#78716C;
  --rust-soft:rgba(249,115,22,.15);
  --yellow-soft:rgba(255,194,14,.12);
  --success-soft:rgba(21,128,61,.18);
  --danger-soft:rgba(185,28,28,.18);
  --warning-soft:rgba(180,83,9,.18);
  --info-soft:rgba(30,64,175,.18);
  --wa-soft:rgba(18,140,126,.18);
  --fb-soft:rgba(24,119,242,.18);
  --sh-xs:2px 2px 0 rgba(0,0,0,.5);
  --sh-sm:3px 3px 0 rgba(0,0,0,.55);
  --sh-md:4px 4px 0 rgba(0,0,0,.6);
  --sh-lg:6px 6px 0 rgba(0,0,0,.65);
  --sh-xl:8px 8px 0 rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font:14px/1.6 var(--fb);
  background:var(--bg);
  color:var(--text-primary);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size:32px 32px;
  background-position:-1px -1px;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--rust-600);outline-offset:2px}

/* ============================================================
   HEADER — industrial striped
   ============================================================ */
header{
  position:fixed;inset:0 0 auto;z-index:30;
  padding-top:var(--st);
  background:var(--steel-900);
  border-bottom:4px solid var(--industrial-yellow);
  box-shadow:0 4px 0 rgba(0,0,0,.3);
  position:fixed;
}
header::before{
  content:"";
  position:absolute;
  inset-inline:0;
  top:0;
  height:4px;
  background:repeating-linear-gradient(
    90deg,
    var(--industrial-yellow) 0 20px,
    var(--steel-900) 20px 40px
  );
}
.hin{
  max-width:1100px;margin:0 auto;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  min-height:var(--header-h);
}
.brand{
  display:flex;align-items:center;gap:12px;
  flex:1;min-width:0;
}
.logo{
  width:42px;height:42px;
  background:var(--rust-600);
  color:#fff;
  display:grid;place-items:center;
  font-size:20px;flex:none;
  border-radius:var(--r-sm);
  border:2px solid var(--steel-900);
  box-shadow:
    inset 0 -3px 0 rgba(0,0,0,.3),
    3px 3px 0 var(--industrial-yellow);
  position:relative;
}
.brand-text{min-width:0}
.brand b{
  display:block;
  font:700 22px/1 var(--fh);
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand small{
  display:block;
  color:var(--industrial-yellow);
  font:500 10px/1.2 var(--fm);
  letter-spacing:.05em;
  text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:3px;
}

.acts{display:flex;align-items:center;gap:6px;flex:none}

.ib{
  width:var(--btn-size);height:var(--btn-size);
  border-radius:var(--r-sm);
  background:var(--steel-700);
  border:2px solid var(--steel-500);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;
  color:var(--steel-400);
  transition:.12s ease;
  position:relative;
  flex-shrink:0;
  padding:0;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.3);
}
.ib:hover{
  background:var(--steel-600);
  color:#fff;
  border-color:var(--industrial-yellow);
}
.ib:active{transform:translate(1px,1px);box-shadow:none}
.ib i{font-size:16px;line-height:1}
.ib.pri{
  background:var(--rust-600);
  border-color:var(--rust-800);
  color:#fff;
}
.ib.pri:hover{background:var(--rust-500);border-color:var(--industrial-yellow)}
.ib.grn{
  background:var(--success);
  border-color:#0D5F2A;
  color:#fff;
}
.ib.grn:hover{background:#15803D}
.ib.sync-btn{
  background:var(--success);
  border-color:#0D5F2A;
  color:#fff;
}
.ib.sync-btn:hover{background:#15803D}
.ib.sync-btn.dirty{
  background:var(--danger);
  border-color:#7F1D1D;
  color:#fff;
  animation:dirtyPulse 1.6s ease-in-out infinite;
}
.ib.sync-btn.dirty::after{
  content:"";
  position:absolute;top:2px;inset-inline-end:2px;
  width:8px;height:8px;border-radius:50%;
  background:var(--industrial-yellow);
  box-shadow:0 0 0 2px var(--steel-900);
}
@keyframes dirtyPulse{
  0%,100%{box-shadow:inset 0 -2px 0 rgba(0,0,0,.3), 0 0 0 0 rgba(185,28,28,.6)}
  50%{box-shadow:inset 0 -2px 0 rgba(0,0,0,.3), 0 0 0 6px rgba(185,28,28,0)}
}
.ib.online-ind{
  background:rgba(21,128,61,.15);
  border-color:rgba(21,128,61,.5);
  color:#15803D;
  font-family:var(--fm);
  font-weight:700;
  font-size:13px;
  gap:6px;
  padding:0 10px;
  width:auto;
  min-width:var(--btn-size);
  cursor:default;
}
[data-theme=dark] .ib.online-ind{color:#22C55E}
.ib.online-ind .dot{
  width:8px;height:8px;border-radius:50%;background:#15803D;
  box-shadow:0 0 0 2px rgba(21,128,61,.3);
  animation:pulse 2s infinite;
  flex:none;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 2px rgba(21,128,61,.3)}
  50%{box-shadow:0 0 0 5px rgba(21,128,61,.08)}
}
.ib.online-ind .num{
  font-family:var(--fm);
  font-size:14px;
  color:inherit;
  font-variant-numeric:tabular-nums;
  line-height:1;
}

.pwa-bar{width:100%;display:none;gap:6px;margin-top:6px}
.pwa-bar.on{display:flex}
.pwa-bar .pwa-btn{
  flex:1;height:38px;border-radius:var(--r-sm);
  background:var(--rust-600);color:#fff;font-weight:700;font-size:12.5px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  border:2px solid var(--rust-800);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.3);
}
.pwa-bar .pwa-close{
  width:38px;height:38px;border-radius:var(--r-sm);
  background:var(--steel-700);color:var(--steel-400);
  display:grid;place-items:center;
  border:2px solid var(--steel-500);
}

main{
  max-width:1100px;margin:0 auto;
  padding:calc(var(--header-h) + 20px + var(--st)) 14px calc(var(--botnav-h) + 24px + var(--sb));
}
.tab{display:none}
.tab.on{display:block;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}

/* ============================================================
   SECTION TITLES — industrial tags
   ============================================================ */
h3.t{
  font:700 18px var(--fh);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin:24px 0 14px;
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;
  background:var(--steel-800);
  color:var(--industrial-yellow);
  border-radius:var(--r-sm);
  border-left:6px solid var(--rust-600);
  box-shadow:3px 3px 0 rgba(0,0,0,.15);
  position:relative;
}
h3.t::before{
  content:"■";
  color:var(--rust-600);
  font-size:14px;
  flex:none;
}
h3.t .h3-badge{
  font:700 10px var(--fm);
  letter-spacing:.08em;
  background:var(--rust-600);
  color:#fff;
  padding:3px 8px;
  border-radius:0;
  margin-inline-start:auto;
  text-transform:uppercase;
}

/* ============================================================
   HERO — industrial plate
   ============================================================ */
.hero{
  padding:28px 24px;
  background:var(--surface);
  border-radius:var(--r-md);
  border:2px solid var(--border-heavy);
  box-shadow:
    4px 4px 0 var(--steel-800),
    inset 0 0 0 1px rgba(255,255,255,.5);
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute;
  inset-inline-start:0;
  top:0;bottom:0;
  width:10px;
  background:repeating-linear-gradient(
    45deg,
    var(--rust-600) 0 10px,
    var(--industrial-yellow) 10px 20px
  );
}
.hero::after{
  content:"\f013";
  font-family:"Font Awesome 6 Free";font-weight:900;
  position:absolute;
  inset-inline-end:-10px;
  bottom:-20px;
  font-size:120px;
  color:var(--border);
  opacity:.3;
  line-height:1;
  pointer-events:none;
  animation:spin 40s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h2{
  font:700 28px/1.1 var(--fh);
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--text-primary);
  position:relative;z-index:1;
  padding-inline-start:6px;
}
.hero p{
  margin-top:8px;
  color:var(--text-secondary);
  font-size:13.5px;
  max-width:500px;
  position:relative;z-index:1;
  padding-inline-start:6px;
  font-weight:500;
}

/* ============================================================
   STATS GRID
   ============================================================ */
.g4{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-top:10px}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}

.sc{
  background:var(--surface);
  border:2px solid var(--border-heavy);
  border-radius:var(--r-sm);
  padding:16px 12px;
  text-align:center;
  box-shadow:3px 3px 0 var(--border-strong);
  transition:.12s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;
  position:relative;
}
.sc::before{
  content:"";
  position:absolute;
  top:0;inset-inline:0;
  height:3px;
  background:var(--steel-800);
}
.sc:hover{
  transform:translate(-1px,-1px);
  box-shadow:4px 4px 0 var(--rust-600);
  border-color:var(--rust-600);
}
.sc:hover::before{background:var(--rust-600)}
.sc i{
  width:40px;height:40px;
  border-radius:var(--r-sm);
  display:grid;place-items:center;
  background:var(--steel-800);
  color:var(--industrial-yellow);
  font-size:16px;
  margin-bottom:2px;
  border:2px solid var(--steel-900);
}
.sc b{
  font:700 26px/1 var(--fh2);
  color:var(--text-primary);
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}
.sc span{
  color:var(--text-secondary);
  font:600 11px var(--fm);
  letter-spacing:.04em;
  text-transform:uppercase;
}

.seg{
  display:flex;height:12px;gap:1px;
  border-radius:var(--r-sm);
  overflow:hidden;
  border:2px solid var(--border-heavy);
  background:var(--steel-900);
}
.seg i{display:block;min-width:2px}

.cols{display:grid;gap:12px;grid-template-columns:1fr;margin-top:8px}
@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}

.pn{
  background:var(--surface);
  border:2px solid var(--border-heavy);
  border-radius:var(--r-sm);
  padding:14px;
  box-shadow:3px 3px 0 var(--border-strong);
}
.pn>b{
  font:700 12px var(--fm);
  letter-spacing:.08em;
  color:var(--text-secondary);
  display:block;
  margin-bottom:10px;
  text-transform:uppercase;
  padding-bottom:6px;
  border-bottom:2px solid var(--border-heavy);
}
.sl{max-height:260px;overflow-y:auto;padding-inline-end:2px}

.bar{
  position:relative;
  display:flex;justify-content:space-between;align-items:center;
  gap:8px;
  width:100%;min-height:36px;
  padding:0 10px;
  border-radius:var(--r-sm);
  overflow:hidden;
  margin-top:4px;
  background:var(--surface-2);
  font-size:12.5px;font-weight:600;
  color:var(--text-primary);
  transition:.12s;
  border-left:3px solid transparent;
  border:1px solid var(--border);
}
.bar:hover{
  background:var(--surface-hover);
  border-color:var(--rust-600);
  border-left:3px solid var(--rust-600);
}
.bar i{
  position:absolute;inset-block:0;inset-inline-start:0;
  background:var(--rust-soft);
}
[data-theme=dark] .bar i{background:rgba(249,115,22,.2)}
.bar span,.bar b{position:relative}
.bar b{
  font:700 11px var(--fm);
  background:var(--steel-800);
  color:var(--industrial-yellow);
  padding:2px 8px;
  border-radius:0;
  min-width:24px;
  text-align:center;
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   SEARCH
   ============================================================ */
.sr{
  display:flex;align-items:center;gap:8px;
  height:50px;
  padding:0 6px 0 14px;
  background:var(--surface);
  border:2px solid var(--border-heavy);
  border-radius:var(--r-sm);
  box-shadow:3px 3px 0 var(--border-strong);
  transition:.12s;
}
.sr:focus-within{
  border-color:var(--rust-600);
  box-shadow:3px 3px 0 var(--rust-600);
}
.sr>i{color:var(--text-tertiary);font-size:14px;flex:none}
.sr input{
  flex:1;min-width:0;height:100%;
  border:0;background:none;outline:0;
  font-size:14px;
}
.sr input::placeholder{color:var(--text-tertiary)}
.sr .fbtn{
  width:38px;height:38px;
  border-radius:var(--r-sm);
  background:var(--steel-800);
  color:var(--industrial-yellow);
  display:grid;place-items:center;
  flex:none;
  position:relative;
  transition:.12s;
  border:2px solid var(--steel-900);
}
.sr .fbtn:hover,
.sr .fbtn.has-filters{background:var(--rust-600);color:#fff;border-color:var(--rust-800)}
.sr .fbtn .bub{
  position:absolute;top:-6px;inset-inline-end:-6px;
  min-width:18px;height:18px;padding:0 4px;
  border-radius:50%;
  background:var(--industrial-yellow);
  color:var(--steel-900);
  font:800 10px var(--fm);
  display:grid;place-items:center;
  border:2px solid var(--surface);
}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  height:28px;padding:0 4px 0 10px;
  border-radius:var(--r-sm);
  background:var(--rust-600);
  color:#fff;
  font-weight:600;font-size:11.5px;
  border:1px solid var(--rust-800);
}
.chip button{
  width:20px;height:20px;border-radius:var(--r-sm);
  color:inherit;font-size:9px;
  display:grid;place-items:center;
  background:rgba(0,0,0,.15);
}
.chip button:hover{background:rgba(0,0,0,.3)}
.inf{
  color:var(--text-secondary);
  font-size:12px;
  margin:12px 4px 10px;
  font-weight:600;
  font-family:var(--fm);
  letter-spacing:.02em;
}

/* ============================================================
   CARDS — industrial classic
   ============================================================ */
.ls{display:grid;gap:10px}
@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}

.card{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px;
  background:var(--surface);
  border:2px solid var(--border-heavy);
  border-radius:var(--r-sm);
  box-shadow:3px 3px 0 var(--border-strong);
  cursor:pointer;
  transition:.12s;
  min-width:0;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  inset-inline-start:0;
  top:0;bottom:0;
  width:4px;
  background:var(--steel-800);
}
.card:hover{
  transform:translate(-1px,-1px);
  box-shadow:5px 5px 0 var(--rust-600);
  border-color:var(--rust-600);
}
.card:hover::before{background:var(--rust-600)}

.av{
  width:48px;height:48px;
  border-radius:var(--r-sm);
  color:#fff;
  display:grid;place-items:center;
  font:700 16px var(--fh2);
  flex:none;
  border:2px solid var(--steel-900);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);
  letter-spacing:.02em;
}
.cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cm .title{
  display:flex;align-items:center;gap:5px;
  font-size:14.5px;font-weight:700;
  color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:.01em;
}
.cm .title .vb{color:var(--rust-600);font-size:12px;flex:none}
.cm .meta{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;
  color:var(--text-secondary);
  min-width:0;
  font-weight:500;
}
.cm .meta i{
  color:var(--rust-600);font-size:10px;flex:none;
  width:14px;text-align:center;
}
.cm .meta span{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:0;
}
.cm .tags{
  display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;
}
.tg{
  font:700 9.5px var(--fm);
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:3px 7px;
  border-radius:var(--r-sm);
  background:var(--surface-2);
  color:var(--text-secondary);
  border:1px solid var(--border);
}
.tg.a{
  background:var(--steel-800);
  color:var(--industrial-yellow);
  border-color:var(--steel-900);
}
.tg.v{
  background:var(--success-soft);
  color:var(--success);
  border-color:rgba(21,128,61,.3);
}

.ca{
  display:flex;flex-direction:column;gap:3px;flex:none;
}
.ca button,.ca a{
  width:34px;height:34px;
  border-radius:var(--r-sm);
  color:var(--text-tertiary);
  font-size:13px;
  display:grid;place-items:center;
  transition:.12s;
  text-decoration:none;
  background:var(--surface-2);
  border:1px solid var(--border);
}
.ca button:hover,.ca a:hover{
  background:var(--steel-800);
  color:var(--industrial-yellow);
  border-color:var(--steel-900);
}
.ca .fv.on{
  color:var(--industrial-yellow);
  background:var(--steel-800);
  border-color:var(--steel-900);
}
.ca .wa{color:var(--wa)}
.ca .wa:hover{background:var(--wa);color:#fff;border-color:var(--wa)}
.ca .pdf{color:var(--danger)}
.ca .pdf:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

.vb{color:var(--rust-600)}

/* Empty state */
.em{
  text-align:center;
  padding:44px 16px;
  border:2px dashed var(--border-strong);
  border-radius:var(--r-sm);
  color:var(--text-secondary);
  background:var(--surface);
}
.em i{font-size:32px;display:block;margin-bottom:12px;color:var(--text-tertiary)}
.em b{
  display:block;color:var(--text-primary);margin-bottom:4px;
  font:700 15px var(--fh);letter-spacing:.04em;text-transform:uppercase;
}
.em small{display:block;font-size:12px;margin-top:4px}

/* ============================================================
   BREADCRUMB
   ============================================================ */
.cr{
  display:flex;flex-wrap:wrap;align-items:center;gap:4px;
  margin:12px 0;font-size:12.5px;
}
.cr button{
  padding:6px 14px;
  border-radius:var(--r-sm);
  background:var(--surface);
  border:2px solid var(--border-heavy);
  font:600 12px var(--fm);
  letter-spacing:.03em;
  color:var(--text-secondary);
  transition:.12s;
  text-transform:uppercase;
}
.cr button:hover{
  background:var(--surface-hover);
  color:var(--text-primary);
  border-color:var(--rust-600);
}
.cr button:last-child{
  background:var(--steel-800);
  color:var(--industrial-yellow);
  border-color:var(--steel-900);
}
.cr i{font-size:9px;color:var(--text-tertiary)}

/* ============================================================
   EXPLORER ROW
   ============================================================ */
.rw{
  display:flex;align-items:center;gap:12px;
  width:100%;
  padding:14px 16px;
  margin-bottom:6px;
  border-radius:var(--r-sm);
  background:var(--surface);
  border:2px solid var(--border-heavy);
  text-align:start;
  font-weight:600;
  color:var(--text-primary);
  transition:.12s;
  box-shadow:2px 2px 0 var(--border-strong);
}
.rw:hover{
  transform:translate(-1px,-1px);
  box-shadow:4px 4px 0 var(--rust-600);
  border-color:var(--rust-600);
}
.rw>i:first-child{
  width:40px;height:40px;
  border-radius:var(--r-sm);
  background:var(--steel-800);
  color:var(--industrial-yellow);
  display:grid;place-items:center;
  font-size:15px;
  flex:none;
  border:2px solid var(--steel-900);
}
.rw span{flex:1;font-size:13.5px;letter-spacing:.01em}
.rw em{
  font:700 11px var(--fm);
  font-style:normal;
  background:var(--steel-800);
  color:var(--industrial-yellow);
  padding:3px 8px;
  border-radius:0;
  min-width:26px;
  text-align:center;
  font-variant-numeric:tabular-nums;
}
.rw>i:last-child{font-size:10px;color:var(--text-tertiary)}

/* Explorer sortbar */
.exp-sortbar{
  display:flex;gap:6px;margin:0 0 12px;
  padding:4px;
  background:var(--steel-800);
  border:2px solid var(--steel-900);
  border-radius:var(--r-sm);
  box-shadow:2px 2px 0 rgba(0,0,0,.2);
}
.exp-sortbar .sortbtn{
  flex:1;height:38px;
  border-radius:var(--r-sm);
  border:1px solid transparent;
  background:transparent;
  color:var(--steel-400);
  font:700 11.5px var(--fm);
  letter-spacing:.04em;
  text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:.12s;
}
.exp-sortbar .sortbtn:hover{
  background:var(--steel-700);
  color:#fff;
}
.exp-sortbar .sortbtn.on{
  background:var(--rust-600);
  color:#fff;
  border-color:var(--rust-800);
}
.exp-sortbar .sortbtn i{font-size:10px}

/* ============================================================
   BUTTONS
   ============================================================ */
.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;
  padding:0 22px;
  border-radius:var(--r-sm);
  font:700 13.5px var(--fh);
  letter-spacing:.06em;
  text-transform:uppercase;
  background:var(--rust-600);
  color:#fff;
  transition:.12s;
  border:2px solid var(--rust-800);
  box-shadow:
    inset 0 -3px 0 rgba(0,0,0,.25),
    3px 3px 0 var(--border-strong);
  min-width:0;
}
.bt:hover{background:var(--rust-500)}
.bt:active{
  transform:translate(2px,2px);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25), 1px 1px 0 var(--border-strong);
}
.bt:disabled{opacity:.5;cursor:not-allowed}
.bt.g{
  background:var(--surface-2);
  color:var(--text-primary);
  border-color:var(--border-heavy);
  font-family:var(--fb);
  letter-spacing:.02em;
  text-transform:none;
}
.bt.g:hover{background:var(--surface-hover)}
.bt.d{background:var(--danger);border-color:#7F1D1D;font-family:var(--fb);letter-spacing:.02em;text-transform:none}
.bt.k{background:var(--steel-800);color:var(--industrial-yellow);border-color:var(--steel-900);font-family:var(--fb);letter-spacing:.02em;text-transform:none}
.bt.k:hover{background:var(--steel-700)}
.bt.full{width:100%}
.bt i{font-size:13px}

/* ============================================================
   MODAL
   ============================================================ */
#md{
  position:fixed;inset:0;z-index:60;
  background:rgba(15,22,32,.75);
  backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;
  padding:16px;overflow-y:auto;
}
#md.on{display:flex}
.sheet{
  width:100%;max-width:540px;
  max-height:calc(100vh - 32px);
  overflow-y:auto;
  background:var(--surface);
  padding:24px 22px;
  border-radius:var(--r-lg);
  border:3px solid var(--steel-900);
  box-shadow:
    6px 6px 0 var(--rust-600),
    6px 6px 0 2px var(--steel-900);
  animation:up .22s cubic-bezier(.2,.9,.3,1);
  position:relative;
  margin:auto;
}
.sheet::before{
  content:"";
  position:absolute;
  top:-3px;inset-inline:0;
  height:6px;
  background:repeating-linear-gradient(
    90deg,
    var(--industrial-yellow) 0 16px,
    var(--steel-900) 16px 32px
  );
}
@keyframes up{from{transform:translateY(20px) scale(.96);opacity:0}}
.sheet h2{
  font:700 22px var(--fh);
  letter-spacing:.06em;
  text-transform:uppercase;
  margin:8px 0 8px;
  color:var(--text-primary);
  padding-inline-start:0;
  border:0;
}
.lead{
  color:var(--text-secondary);
  font-size:12.5px;
  margin-bottom:18px;
  line-height:1.5;
}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.ac .full{grid-column:1/-1}

/* Confirm */
.confirm-sheet{max-width:440px}
.confirm-sheet .confirm-icon{
  width:60px;height:60px;
  border-radius:var(--r-sm);
  display:grid;place-items:center;
  margin-bottom:16px;
  font-size:26px;
  background:var(--rust-soft);
  color:var(--rust-600);
  border:2px solid var(--rust-600);
  box-shadow:3px 3px 0 rgba(0,0,0,.2);
}
.confirm-sheet .confirm-icon.danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.confirm-sheet .confirm-icon.success{background:var(--success-soft);color:var(--success);border-color:var(--success)}
.confirm-sheet .confirm-icon.warning{background:var(--warning-soft);color:var(--warning);border-color:var(--warning)}
.confirm-sheet h2{margin-bottom:6px}
.confirm-sheet p{color:var(--text-secondary);font-size:13px;line-height:1.6;margin-bottom:6px}
.confirm-sheet .confirm-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px;
}

/* Choice cards */
.choice-list{display:grid;gap:10px;margin-top:14px}
.choice-card{
  display:flex;align-items:center;gap:12px;
  padding:14px;
  border-radius:var(--r-sm);
  background:var(--surface-2);
  border:2px solid var(--border-heavy);
  transition:.12s;
  box-shadow:2px 2px 0 var(--border-strong);
}
.choice-card:hover{
  background:var(--surface-hover);
  border-color:var(--rust-600);
  transform:translate(-1px,-1px);
  box-shadow:3px 3px 0 var(--rust-600);
}
.choice-card .chi{
  width:44px;height:44px;
  border-radius:var(--r-sm);
  display:grid;place-items:center;
  font-size:18px;flex:none;
  border:2px solid var(--steel-900);
}
.choice-card.form .chi{background:var(--rust-600);color:#fff}
.choice-card.sheet .chi{background:var(--success);color:#fff}
.choice-card .cht{flex:1;min-width:0}
.choice-card .cht b{
  display:block;font-size:13.5px;font-weight:700;
  margin-bottom:2px;color:var(--text-primary);
}
.choice-card .cht small{display:block;font-size:11px;color:var(--text-secondary)}
.choice-card .ch-actions{display:flex;gap:4px;flex:none}
.choice-card .ch-actions a,.choice-card .ch-actions button{
  width:38px;height:38px;
  border-radius:var(--r-sm);
  display:grid;place-items:center;
  font-size:13px;
  transition:.12s;
  border:2px solid transparent;
}
.choice-card.form .ch-actions .open{background:var(--rust-600);color:#fff;border-color:var(--rust-800)}
.choice-card.form .ch-actions .open:hover{background:var(--rust-500)}
.choice-card.sheet .ch-actions .open{background:var(--success);color:#fff;border-color:#0D5F2A}
.choice-card.sheet .ch-actions .open:hover{background:#15803D}
.choice-card .ch-actions .share{
  background:var(--surface);color:var(--text-secondary);
  border-color:var(--border-heavy);
}
.choice-card .ch-actions .share:hover{
  background:var(--steel-800);color:var(--industrial-yellow);
  border-color:var(--steel-900);
}

/* Filter */
.fmodal-h{margin-bottom:16px}
.fmodal-h h2{
  font:700 20px var(--fh);letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:4px;padding:0;border:0;
}
.fmodal-h .sub{font-size:12px;color:var(--text-secondary)}
.fsect{
  display:flex;align-items:center;gap:12px;
  width:100%;padding:12px 14px;
  border-radius:var(--r-sm);
  text-align:start;
  background:var(--surface);
  border:2px solid var(--border-heavy);
  margin-bottom:6px;
  transition:.12s;
  box-shadow:2px 2px 0 var(--border-strong);
}
.fsect:hover{
  background:var(--surface-hover);
  border-color:var(--rust-600);
  transform:translate(-1px,-1px);
  box-shadow:3px 3px 0 var(--rust-600);
}
.fsect.on{
  background:var(--rust-soft);
  border-color:var(--rust-600);
  box-shadow:3px 3px 0 var(--rust-600);
}
.fsect .ic{
  width:38px;height:38px;
  border-radius:var(--r-sm);
  background:var(--steel-800);
  color:var(--industrial-yellow);
  display:grid;place-items:center;
  flex:none;font-size:14px;
  border:2px solid var(--steel-900);
}
.fsect.on .ic{background:var(--rust-600);color:#fff}
.fsect .name{
  flex:1;font-weight:600;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-primary);font-size:13.5px;
}
.fsect.on .name{color:var(--rust-700);font-weight:700}
.fsect .val{
  font:700 11px var(--fm);
  letter-spacing:.02em;
  color:var(--rust-600);
  max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.fsect .num{
  font:700 11.5px var(--fm);
  color:var(--text-secondary);
  min-width:28px;text-align:center;
  background:var(--surface-2);
  padding:3px 8px;
  border-radius:0;
  border:1px solid var(--border);
  font-variant-numeric:tabular-nums;
}
.fsect.on .num{background:var(--rust-600);color:#fff;border-color:var(--rust-800)}
.fsect .chev{color:var(--text-tertiary);font-size:11px}
.fback{
  display:flex;align-items:center;gap:6px;
  color:var(--rust-600);
  font:600 13px var(--fb);
  margin-bottom:14px;
  padding:6px 10px;
  border-radius:var(--r-sm);
  transition:.12s;
  width:fit-content;
}
.fback:hover{background:var(--rust-soft)}
.sortbar{display:flex;gap:6px;margin-bottom:14px}
.sortbtn{
  flex:1;height:38px;
  border-radius:var(--r-sm);
  border:2px solid var(--border-heavy);
  background:var(--surface);
  color:var(--text-secondary);
  font:700 11px var(--fm);
  letter-spacing:.04em;
  text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:.12s;
}
.sortbtn:hover{background:var(--surface-hover);border-color:var(--rust-600)}
.sortbtn.on{
  background:var(--steel-800);
  border-color:var(--steel-900);
  color:var(--industrial-yellow);
}
.fopt{
  display:flex;align-items:center;gap:12px;
  width:100%;padding:12px 14px;
  border-radius:var(--r-sm);
  text-align:start;
  background:var(--surface);
  border:2px solid var(--border-heavy);
  margin-bottom:5px;
  transition:.12s;
  box-shadow:2px 2px 0 var(--border-strong);
}
.fopt:hover{
  background:var(--surface-hover);
  border-color:var(--rust-600);
  transform:translate(-1px,-1px);
  box-shadow:3px 3px 0 var(--rust-600);
}
.fopt.on{
  background:var(--rust-soft);
  border-color:var(--rust-600);
  box-shadow:3px 3px 0 var(--rust-600);
}
.fopt .box{
  width:22px;height:22px;
  border-radius:var(--r-sm);
  flex:none;
  border:2px solid var(--border-strong);
  display:grid;place-items:center;
  color:transparent;font-size:10px;
  transition:.12s;
  background:var(--surface);
}
.fopt.on .box{
  border-color:var(--rust-600);
  background:var(--rust-600);
  color:#fff;
}
.fopt .name{
  flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-primary);
  font-size:13px;font-weight:600;
}
.fopt.on .name{font-weight:700;color:var(--rust-700)}
.fopt .n{
  font:700 11px var(--fm);
  color:var(--text-secondary);
  background:var(--surface-2);
  padding:3px 8px;
  border-radius:0;
  border:1px solid var(--border);
  font-variant-numeric:tabular-nums;
}
.fopt.on .n{background:var(--rust-600);color:#fff;border-color:var(--rust-800)}
.fopt.clear{border-style:dashed}
.fopt.clear .name{color:var(--danger)}
.filter-footer{
  position:sticky;bottom:-24px;
  margin:18px -22px -24px;
  padding:14px 22px calc(14px + var(--sb));
  background:var(--surface);
  border-top:2px solid var(--border-heavy);
  display:flex;gap:10px;z-index:5;
}
.filter-footer .bt{flex:1;min-height:48px}
.filter-footer .count-badge{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.2);
  padding:2px 8px;
  border-radius:0;
  font:700 11px var(--fm);
  margin-inline-start:6px;
}

/* ============================================================
   PROFILE MODAL
   ============================================================ */
.ph{
  margin:-24px -22px 0;
  padding:36px 22px 24px;
  text-align:center;
  color:#fff;
  background:var(--steel-900);
  position:relative;overflow:hidden;
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  background-image:
    repeating-linear-gradient(
      45deg,
      transparent 0 20px,
      rgba(255,255,255,.03) 20px 40px
    );
  border-bottom:4px solid var(--industrial-yellow);
}
.ph::before{
  content:"";
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%, rgba(249,115,22,.25), transparent 70%);
  pointer-events:none;
}
.pl{
  width:80px;height:80px;
  margin:0 auto 14px;
  background:var(--rust-600);
  color:#fff;
  display:grid;place-items:center;
  font-size:30px;
  position:relative;z-index:1;
  border-radius:var(--r-sm);
  border:3px solid var(--industrial-yellow);
  box-shadow:
    inset 0 -4px 0 rgba(0,0,0,.3),
    4px 4px 0 rgba(0,0,0,.3);
}
.pn2{
  font:700 22px var(--fh);
  letter-spacing:.04em;
  text-transform:uppercase;
  position:relative;z-index:1;
}
.ps{
  font-size:12.5px;
  color:rgba(255,255,255,.7);
  margin-top:4px;
  position:relative;z-index:1;
  font-family:var(--fm);
}
.ph .tags{
  justify-content:center;
  position:relative;z-index:1;
  margin-top:12px;
}
.ph .tg{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;
}

.pa{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  margin:20px 0 12px;
}
.pa .ib{
  width:44px;height:44px;
  background:var(--surface-2);
  border:2px solid var(--border-heavy);
  color:var(--text-secondary);
  border-radius:var(--r-sm);
  box-shadow:2px 2px 0 var(--border-strong);
}
.pa .ib:hover{
  background:var(--steel-800);color:var(--industrial-yellow);
  border-color:var(--steel-900);
}
.pa .ib.wa{color:var(--wa)}
.pa .ib.wa:hover{background:var(--wa);color:#fff;border-color:var(--wa)}
.pa .ib.pdf{color:var(--danger)}
.pa .ib.pdf:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

.vr{
  display:flex;gap:14px;align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}
.vr:last-child{border:0}
.vr>i,.vr>a{
  width:42px;height:42px;
  border-radius:var(--r-sm);
  background:var(--surface-2);
  color:var(--rust-600);
  display:grid;place-items:center;
  flex:none;font-size:15px;
  transition:.12s;
  border:2px solid var(--border-heavy);
}
.vr>a:hover{background:var(--rust-600);color:#fff;border-color:var(--rust-600)}
.vr small{
  display:block;
  color:var(--text-secondary);
  font:700 10.5px var(--fm);
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:3px;
}
.vr b{
  font-weight:600;
  overflow-wrap:anywhere;
  color:var(--text-primary);
}

/* ============================================================
   ABOUT PAGE
   ============================================================ */
.about-hero{
  text-align:center;
  padding:32px 24px;
  background:var(--steel-900);
  border-radius:var(--r-md);
  color:#fff;
  margin-bottom:18px;
  box-shadow:4px 4px 0 var(--rust-600);
  border:2px solid var(--steel-900);
  position:relative;
  overflow:hidden;
}
.about-hero::before{
  content:"";
  position:absolute;
  inset-inline:0;
  top:0;
  height:6px;
  background:repeating-linear-gradient(
    90deg,
    var(--industrial-yellow) 0 20px,
    var(--steel-900) 20px 40px
  );
}
.about-hero::after{
  content:"";
  position:absolute;
  inset-inline:0;
  bottom:0;
  height:6px;
  background:repeating-linear-gradient(
    90deg,
    var(--industrial-yellow) 0 20px,
    var(--steel-900) 20px 40px
  );
}
.about-hero .ai-big{
  width:72px;height:72px;
  border-radius:var(--r-sm);
  background:var(--rust-600);
  display:grid;place-items:center;
  margin:0 auto 14px;
  font-size:30px;
  border:3px solid var(--industrial-yellow);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.3);
}
.about-hero h2{
  font:700 18px var(--fh);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:8px;
  line-height:1.3;
  color:var(--industrial-yellow);
}
.about-hero p{
  font-size:13px;
  opacity:.95;
  line-height:1.5;
  max-width:420px;
  margin:0 auto;
  font-weight:500;
}

.about-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:16px;
}
.about-stats .stat-box{
  text-align:center;
  padding:16px 8px;
  background:var(--surface);
  border:2px solid var(--border-heavy);
  border-radius:var(--r-sm);
  box-shadow:3px 3px 0 var(--border-strong);
  position:relative;
}
.about-stats .stat-box::before{
  content:"";
  position:absolute;
  top:0;inset-inline:0;
  height:3px;
  background:var(--rust-600);
}
.about-stats .stat-box b{
  display:block;
  font:700 24px var(--fh2);
  color:var(--rust-600);
  margin-bottom:4px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}
.about-stats .stat-box span{
  font:700 10px var(--fm);
  color:var(--text-secondary);
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.about-sect{margin-top:22px}
.about-sect-title{
  display:flex;align-items:center;gap:10px;
  margin-bottom:12px;
  padding:8px 12px;
  background:var(--steel-800);
  border-radius:var(--r-sm);
  border-left:5px solid var(--industrial-yellow);
  box-shadow:2px 2px 0 rgba(0,0,0,.15);
  font:700 15px var(--fh);
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--industrial-yellow);
}
.about-sect-title .ic{
  width:30px;height:30px;
  border-radius:var(--r-sm);
  display:grid;place-items:center;
  font-size:13px;
  color:#fff;
  flex:none;
  border:2px solid var(--steel-900);
}
.about-sect-title .cnt{
  font:700 11px var(--fm);
  font-family:var(--fm);
  font-weight:700;
  background:var(--rust-600);
  color:#fff;
  padding:3px 8px;
  border-radius:0;
  margin-inline-start:auto;
  border:1px solid var(--rust-800);
}

.link-card{
  display:flex;align-items:center;gap:14px;
  padding:14px;
  background:var(--surface);
  border:2px solid var(--border-heavy);
  border-radius:var(--r-sm);
  margin-bottom:10px;
  transition:.12s;
  box-shadow:3px 3px 0 var(--border-strong);
  position:relative;
  overflow:hidden;
}
.link-card::before{
  content:"";
  position:absolute;
  inset-inline-start:0;top:0;bottom:0;
  width:4px;
  background:var(--border-heavy);
}
.link-card.fb::before{background:var(--fb)}
.link-card.wa::before{background:var(--wa)}
.link-card:hover{
  transform:translate(-1px,-1px);
  box-shadow:4px 4px 0 var(--rust-600);
  border-color:var(--rust-600);
}
.link-card .lc-ic{
  width:44px;height:44px;
  border-radius:var(--r-sm);
  display:grid;place-items:center;
  font-size:18px;flex:none;
  border:2px solid var(--steel-900);
}
.link-card.fb .lc-ic{background:var(--fb);color:#fff}
.link-card.wa .lc-ic{background:var(--wa);color:#fff}
.link-card .lc-body{flex:1;min-width:0}
.link-card .lc-body b{
  display:block;
  font-size:13.5px;
  font-weight:700;
  color:var(--text-primary);
  margin-bottom:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.01em;
}
.link-card .lc-body small{
  display:block;
  font-size:11.5px;
  color:var(--text-secondary);
  font-family:var(--fm);
  font-weight:600;
  letter-spacing:.02em;
}
.link-card .lc-actions{display:flex;gap:5px;flex:none}
.link-card .lc-actions button,
.link-card .lc-actions a{
  width:38px;height:38px;
  border-radius:var(--r-sm);
  display:grid;place-items:center;
  font-size:13px;
  transition:.12s;
  text-decoration:none;
  border:2px solid transparent;
}
.link-card.fb .lc-actions .open{
  background:var(--fb);color:#fff;border-color:#0F5FCC;
}
.link-card.fb .lc-actions .open:hover{background:#155BB5}
.link-card.wa .lc-actions .open{
  background:var(--wa);color:#fff;border-color:#0B5F55;
}
.link-card.wa .lc-actions .open:hover{background:#0B5F55}
.link-card .lc-actions .share{
  background:var(--surface-2);
  color:var(--text-secondary);
  border-color:var(--border-heavy);
}
.link-card .lc-actions .share:hover{
  background:var(--steel-800);
  color:var(--industrial-yellow);
  border-color:var(--steel-900);
}

/* ============================================================
   LOCATION BANNER
   ============================================================ */
#loc-banner{
  position:fixed;
  inset-inline:14px;
  bottom:calc(var(--botnav-h) + 18px + var(--sb));
  z-index:75;
  background:var(--surface);
  border:3px solid var(--steel-900);
  border-radius:var(--r-sm);
  padding:14px;
  display:none;
  align-items:center;
  gap:12px;
  box-shadow:
    4px 4px 0 var(--rust-600),
    4px 4px 0 2px var(--steel-900);
  animation:locIn .3s ease-out;
}
#loc-banner::before{
  content:"";
  position:absolute;
  top:-3px;inset-inline:0;
  height:5px;
  background:repeating-linear-gradient(
    90deg,
    var(--industrial-yellow) 0 12px,
    var(--steel-900) 12px 24px
  );
}
#loc-banner.on{display:flex}
@keyframes locIn{from{opacity:0;transform:translateY(20px)}}
#loc-banner .li{
  width:44px;height:44px;
  border-radius:var(--r-sm);
  background:var(--rust-600);
  color:#fff;
  display:grid;place-items:center;
  font-size:17px;flex:none;
  border:2px solid var(--rust-800);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);
}
#loc-banner .lt{flex:1;min-width:0}
#loc-banner .lt b{
  display:block;
  font:700 12.5px var(--fb);
  font-weight:700;
  color:var(--text-primary);
  margin-bottom:3px;
}
#loc-banner .lt small{
  display:block;font-size:11px;
  color:var(--text-secondary);
}
#loc-banner .la{display:flex;gap:5px;flex:none}
#loc-banner .la button{
  padding:0 12px;
  height:36px;
  border-radius:var(--r-sm);
  font:700 11.5px var(--fb);
  font-weight:700;
  border:2px solid transparent;
}
#loc-banner .la .skip{
  background:var(--surface-2);
  color:var(--text-secondary);
  border-color:var(--border-heavy);
}
#loc-banner .la .allow{
  background:var(--rust-600);
  color:#fff;
  border-color:var(--rust-800);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);
}
#loc-banner .la .allow:hover{background:var(--rust-500)}
#loc-banner .la .allow i{font-size:10px;margin-inline-end:4px}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
#bn{
  position:fixed;
  inset-inline:0;bottom:0;z-index:29;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:6px 4px calc(6px + var(--sb));
  background:var(--steel-900);
  border-top:4px solid var(--industrial-yellow);
  box-shadow:0 -3px 0 rgba(0,0,0,.3);
}
#bn::before{
  content:"";
  position:absolute;
  inset-inline:0;
  top:-4px;
  height:4px;
  background:repeating-linear-gradient(
    90deg,
    var(--industrial-yellow) 0 14px,
    var(--steel-900) 14px 28px
  );
}
.bi{
  height:56px;
  border-radius:var(--r-sm);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;
  font:700 9.5px var(--fm);
  letter-spacing:.03em;
  text-transform:uppercase;
  color:var(--steel-400);
  position:relative;
  transition:.12s;
  padding:0;
}
.bi i{font-size:18px;line-height:1}
.bi:hover{
  background:var(--steel-800);
  color:#fff;
}
.bi.on{
  color:var(--industrial-yellow);
  background:var(--steel-800);
}
.bi.on i{color:var(--industrial-yellow)}
.bi.on::after{
  content:"";
  position:absolute;
  top:0;
  inset-inline:calc(50% - 18px);
  width:36px;height:3px;
  background:var(--industrial-yellow);
  border-radius:0;
}
.bi .bub{
  position:absolute;
  top:4px;
  inset-inline-end:calc(50% - 24px);
  min-width:16px;height:16px;
  padding:0 4px;
  border-radius:50%;
  background:var(--rust-600);
  color:#fff;
  font:800 9px var(--fm);
  display:grid;place-items:center;
  line-height:1;
  box-shadow:0 0 0 2px var(--steel-900);
}

/* ============================================================
   TOAST
   ============================================================ */
#ts{
  position:fixed;
  inset-inline:0;
  bottom:calc(var(--botnav-h) + 18px + var(--sb));
  margin:auto;
  width:max-content;
  max-width:calc(100% - 32px);
  z-index:90;
  background:var(--steel-900);
  color:var(--industrial-yellow);
  padding:12px 18px;
  border-radius:var(--r-sm);
  font-weight:700;
  font-size:13px;
  display:flex;gap:12px;align-items:center;
  opacity:0;
  transform:translateY(12px);
  pointer-events:none;
  transition:.2s;
  box-shadow:
    3px 3px 0 var(--rust-600),
    3px 3px 0 2px var(--steel-900);
  border:2px solid var(--steel-900);
}
#ts.on{opacity:1;transform:none;pointer-events:auto}
#ts button{
  color:var(--industrial-yellow);
  font-weight:700;
  padding:4px 8px;
  border-radius:var(--r-sm);
  background:rgba(255,255,255,.1);
}

/* ============================================================
   LOADER
   ============================================================ */
#ld{
  position:fixed;inset:0;z-index:99;
  background:var(--steel-900);
  display:none;place-items:center;
}
#ld.on{display:grid}
#ld i{
  font-size:44px;
  color:var(--industrial-yellow);
  animation:sp 1.2s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

#offline-badge{
  position:fixed;
  top:calc(var(--st) + 6px);
  inset-inline-end:10px;
  z-index:80;
  padding:5px 12px;
  border-radius:var(--r-sm);
  background:var(--danger);
  color:#fff;
  font:700 11px var(--fm);
  letter-spacing:.04em;
  display:none;
  align-items:center;
  gap:6px;
  border:2px solid #7F1D1D;
  box-shadow:2px 2px 0 rgba(0,0,0,.3);
}
#offline-badge.on{display:inline-flex}

/* ============================================================
   PDF
   ============================================================ */
.pdf-stage{position:fixed;left:-99999px;top:0;width:1200px}
.pdf-card{
  width:1200px;min-height:560px;
  display:flex;direction:rtl;
  background:#F4F6F8;color:#1A2332;
  font-family:'IBM Plex Sans Arabic','Oswald',sans-serif;
  position:relative;overflow:hidden;
}
.pdf-l{
  flex:0 0 440px;
  background:#1A2332;color:#fff;
  padding:70px 40px 60px;
  text-align:center;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;
}
.pdf-l::before,.pdf-card::after{
  content:"";position:absolute;left:0;right:0;height:14px;
  background:repeating-linear-gradient(-45deg,#FFC20E 0 14px,#1A2332 14px 28px);
}
.pdf-l::before{top:0}
.pdf-card::after{bottom:0}
.pdf-logo{
  width:150px;height:150px;
  background:#FF6B00;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:66px;margin-bottom:26px;
  border-radius:4px;
  border:4px solid #FFC20E;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);
}
.pdf-name{
  font:700 36px/1.25 'Oswald','IBM Plex Sans Arabic',sans-serif;
  letter-spacing:.02em;
}
.pdf-sub{font-size:16px;opacity:.85;margin-top:10px}
.pdf-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.pdf-tag{
  font-size:13px;padding:5px 14px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:4px;
  font-weight:700;
}
.pdf-tag.v{background:#FFC20E;color:#1A2332;border-color:#FFC20E}
.pdf-r{
  flex:1;padding:50px 40px 120px;
  display:flex;flex-direction:column;
  justify-content:center;gap:14px;
  background:#F4F6F8;
}
.pdf-row{
  display:flex;align-items:center;gap:18px;
  padding:14px 18px;background:#fff;
  border-radius:4px;
  border:2px solid #D0D7DE;
  box-shadow:2px 2px 0 rgba(0,0,0,.08);
}
.pdf-row .ic{
  width:44px;height:44px;
  border-radius:4px;
  background:#F0F2F5;color:#FF6B00;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex:none;
  border:2px solid #D0D7DE;
}
.pdf-row .k{font-size:11px;color:#5F6B7A;font-weight:700;margin-bottom:2px}
.pdf-row .v{font-size:16px;font-weight:600;color:#1A2332;word-break:break-word}
.pdf-ft{
  position:absolute;bottom:34px;left:40px;right:480px;
  display:flex;align-items:center;justify-content:space-between;
  direction:ltr;
}
.pdf-ft b{font:700 22px 'Oswald',sans-serif;letter-spacing:.12em;color:#1A2332}
.pdf-ft img{width:80px;height:80px;background:#fff;padding:4px;border-radius:4px;border:2px solid #1A2332}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:560px){
  :root{--btn-size:40px;--header-h:64px}
  .hin{padding:8px 10px;gap:6px}
  .logo{width:36px;height:36px;font-size:17px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3), 2px 2px 0 var(--industrial-yellow)}
  .brand b{font-size:18px}
  .brand small{font-size:9px}
  .ib{font-size:15px}
  .ib i{font-size:15px}
  .ib.online-ind{padding:0 8px;font-size:12px;gap:4px}
  .ib.online-ind .num{font-size:12px}
  main{padding:calc(var(--header-h) + 14px + var(--st)) 10px calc(var(--botnav-h) + 18px + var(--sb))}
  .hero{padding:22px 16px}
  .hero h2{font-size:22px}
  .sc{padding:12px 8px}
  .sc b{font-size:22px}
  .sc i{width:36px;height:36px;font-size:14px}
  .sheet{padding:22px 16px}
  .filter-footer{margin:16px -16px -22px;padding:12px 16px calc(12px + var(--sb))}
  .ph{margin:-22px -16px 0;padding:30px 16px 20px}
  .pl{width:68px;height:68px;font-size:26px}
  .pn2{font-size:18px}
  .bi{font-size:8.5px;height:52px}
  .bi i{font-size:16px}
  .pa .ib{width:40px;height:40px}
  .ca button,.ca a{width:32px;height:32px;font-size:12px}
  .cm .meta{font-size:11px}
  .about-hero{padding:24px 16px}
  .about-hero h2{font-size:15px}
  .link-card{padding:12px}
  .link-card .lc-ic{width:40px;height:40px;font-size:16px}
  .link-card .lc-actions button,.link-card .lc-actions a{width:34px;height:34px;font-size:12px}
  .about-stats{gap:8px}
  .about-stats .stat-box{padding:12px 6px}
  .about-stats .stat-box b{font-size:20px}
  .about-stats .stat-box span{font-size:9px}
  #loc-banner{inset-inline:10px;padding:12px;gap:10px}
  #loc-banner .li{width:38px;height:38px;font-size:15px}
  #loc-banner .lt b{font-size:12px}
  #loc-banner .lt small{font-size:10px}
  #loc-banner .la button{padding:0 10px;height:34px;font-size:11px}
  h3.t{font-size:15px;padding:6px 10px}
  h3.t .h3-badge{font-size:9px}
}
</style>
</head>
<body>
<div id="ld" class="on"><i class="fa-solid fa-circle-notch"></i></div>
<div id="offline-badge"><i class="fa-solid fa-wifi"></i> غير متصل</div>

<header><div class="hin">
  <div class="brand">
    <div class="logo"><i class="fa-solid fa-industry"></i></div>
    <div class="brand-text">
      <b>Réseau Industriel</b>

    </div>
  </div>
  <div class="acts" id="acts"></div>
  <div class="pwa-bar" id="pwaBar">
    <button class="pwa-btn" data-a="installPWA"><i class="fa-solid fa-download"></i> تثبيت التطبيق</button>

<main id="mainArea">

  <button class="bi" data-a="tab" data-v="dir"><i class="fa-solid fa-address-book"></i><span>الدليل</span></button>

</div>

<div id="md"></div>

<script>
(function(){
  const svgIcon=(size)=>`data:image/svg+xml;charset=utf-8,${encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}">
      <rect width="512" height="512" fill="#0F1620" rx="40"/>
      <rect x="20" y="20" width="472" height="472" fill="none" stroke="#FFC20E" stroke-width="12" rx="20"/>
      <rect x="80" y="180" width="352" height="200" fill="#EA580C" rx="6"/>
      <rect x="160" y="140" width="192" height="60" fill="none" stroke="#FAF8F3" stroke-width="18" rx="4"/>
      <rect x="216" y="240" width="80" height="60" fill="#0F1620" rx="4"/>
      <rect x="80" y="360" width="352" height="16" fill="#FFC20E"/>
      <rect x="80" y="180" width="352" height="10" fill="#1A1815" opacity="0.2"/>
    </svg>`
  )}`;
  const manifest={
    name:"RÉSEAU INDUSTRIEL PROFESSIONNEL MAROCAIN",
    short_name:"Réseau Industriel",
    description:"نربط الموردين والشركات في مكان واحد",
    start_url:location.pathname,
    scope:location.pathname.replace(/[^/]*$/,''),
    display:"standalone",orientation:"portrait",
    background_color:"#0F1620",theme_color:"#0F1620",dir:"rtl",lang:"ar",
    icons:[
      {src:svgIcon(192),sizes:"192x192",type:"image/svg+xml",purpose:"any maskable"},
      {src:svgIcon(512),sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}
    ]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('link');
  link.rel='manifest';link.href=url;document.head.appendChild(link);
  const apple=document.createElement('link');
  apple.rel='apple-touch-icon';apple.href=svgIcon(192);document.head.appendChild(apple);
  const fav=document.createElement('link');
  fav.rel='icon';fav.type='image/svg+xml';fav.href=svgIcon(32);document.head.appendChild(fav);
})();

(function(){
  if(!('serviceWorker' in navigator))return;
  const swCode=`
    const CACHE='connectpro-v18';
    const ASSETS=[location.pathname,
      'https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap',
      'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css'];
    self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS).catch(()=>{})))});
    self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
    self.addEventListener('fetch',e=>{
      const req=e.request;
      if(req.method!=='GET')return;
      const isDoc=req.mode==='navigate'||(req.headers.get('accept')||'').includes('text/html');
      if(isDoc){
        e.respondWith(fetch(req).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(req,copy)).catch(()=>{});return res}).catch(()=>caches.match(req).then(r=>r||caches.match(location.pathname))));
      }else{
        e.respondWith(caches.match(req).then(r=>r||fetch(req).then(res=>{if(res.status===200){const copy=res.clone();caches.open(CACHE).then(c=>c.put(req,copy)).catch(()=>{})}return res})));
      }
    });
  `;
  const blob=new Blob([swCode],{type:'text/javascript'});
  const url=URL.createObjectURL(blob);
  navigator.serviceWorker.register(url,{scope:'./'}).catch(err=>console.warn('SW register failed',err));

// CSV
function splitCSV(l){
  const o=[];let c='',q=false;
  for(let i=0;i<l.length;i++){
    const h=l[i];
    if(h==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}
    else if(h===','&&!q){o.push(c);c=''}
    else c+=h;
  }
  o.push(c);return o;
}
const parseCSV=(txt,type,cat)=>{
  const cl=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');
  return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c=>cl(c[1])).map(c=>{
    const name=cl(c[1]);
    const phone=fmtPhone(cl(c[5]));
    const email=cl(c[6]).toLowerCase().trim();
    const seed=type+'|'+(email||norm(name)+'|'+phone);
    let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
    return {
      id:'p'+h.toString(36),
      name, domaine:cl(c[2])||'Autre', specialite:cl(c[3])||'Général',
      ville:cl(c[4]), phone, email, web:cl(c[7]),
      type, categorie:cat
    };
  });
};
async function fetchFromCSV(){
  const g=async(u)=>{
    const r=await fetch(u+'&cachebust='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.text();
  };
  const [expTxt,fourTxt]=await Promise.all([g(CSV_EXPERTS),g(CSV_FOURNISSEURS)]);
  const experts=parseCSV(expTxt,'experts','yad-amila');
  const fournisseurs=parseCSV(fourTxt,'fournisseurs','services');
  const map=new Map();
  [...fournisseurs,...experts].forEach(r=>{if(!map.has(r.id))map.set(r.id,r)});
  return [...map.values()];
}

      }

      const expertsList=S.db.filter(r=>r.type==='experts');
      const fournisseursList=S.db.filter(r=>r.type==='fournisseurs');

      ];

  }catch(e){console.warn('CSV fetch failed',e)}
  try{

// DEVICE TRACKING
function detectDeviceType(){
  const ua=navigator.userAgent;
  if(/iPad|Tablet|PlayBook|Silk/i.test(ua))return 'tablet';
  if(/Mobile|Android|iPhone|iPod|Opera Mini|IEMobile/i.test(ua))return 'mobile';
  return 'desktop';
}
function detectOS(){
  const ua=navigator.userAgent;
  if(/Windows NT 10/.test(ua))return 'Windows 10/11';
  if(/Windows NT/.test(ua))return 'Windows';
  if(/Mac OS X/.test(ua))return 'macOS';
  if(/Android/.test(ua))return 'Android';
  if(/iPhone|iPad|iPod/.test(ua))return 'iOS';
  if(/Linux/.test(ua))return 'Linux';
  return 'Unknown';
}
function getDeviceId(){
  try{
    let id=localStorage.getItem('cp-device-id');
    if(!id){
      const rnd=crypto.getRandomValues(new Uint32Array(2));
      id='d_'+rnd[0].toString(36)+rnd[1].toString(36)+'_'+Date.now().toString(36);
      localStorage.setItem('cp-device-id',id);
    }
    return id;
  }catch{return 'd_anon_'+Date.now().toString(36)}
}
async function getGeo(){
  return new Promise(resolve=>{
    if(!navigator.geolocation)return resolve(null);
    const to=setTimeout(()=>resolve(null),8000);
    navigator.geolocation.getCurrentPosition(
      p=>{clearTimeout(to);resolve({lat:+p.coords.latitude.toFixed(4),lng:+p.coords.longitude.toFixed(4)})},
      ()=>{clearTimeout(to);resolve(null)},
      {enableHighAccuracy:false,timeout:7000,maximumAge:600000}
    );
  });
}
async function reverseGeo(lat,lng){
  try{
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=ar`);
    if(r.ok){
      const j=await r.json();
      const city=j.city||j.locality||j.principalSubdivision||'';
      if(city) return city;
    }
  }catch{}
  try{
    const r2=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`,{headers:{'Accept':'application/json'}});
    if(r2.ok){
      const j=await r2.json();
      const a=j.address||{};
      return a.city||a.town||a.village||a.state||a.country||'';
    }
  }catch{}
  return '';
}
async function trackDevice(){
  if(!S.fb)return;
  const deviceId=getDeviceId();
  const base='devices/'+deviceId;
  try{
    await S.fb.ref(base+'/deviceType').set(detectDeviceType());
    await S.fb.ref(base+'/os').set(detectOS());

  try{
    await S.fb.ref(base).update({lastVisit:Date.now(),lastOnline:navigator.onLine===true});

async function fetchAndSaveLocation(deviceId){
  try{
    const geo=await getGeo();
    if(!geo) return false;
    const base='devices/'+deviceId;
    const city=await reverseGeo(geo.lat,geo.lng);

function match(r,skip){
  for(const k in FLD){
    if(k===skip)continue;
    const a=S.f[k];
    if(a.length&&!a.some(v=>norm(r[FLD[k]])===norm(v)))return false;
  }
  if(S.q)return hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.q);
  return true;
}
const results=()=>S.db.filter(r=>match(r)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0)+(S.q?1:0);
const clearF=()=>{S.f={type:[],cat:[],dom:[],spe:[],ville:[]};S.q='';S.lim=40;clearFacetCache()};

const facetKey=k=>k+':'+S.f.type.length+','+S.f.cat.length+','+S.f.dom.length+','+S.f.spe.length+','+S.f.ville.length+','+S.q;
function facet(k,sortBy='count'){
  const m=new Map();
  S.db.filter(r=>match(r,k)).forEach(r=>{
    const v=(r[FLD[k]]||'').trim();
    if(v)m.set(v,(m.get(v)||0)+1);
  });
  const arr=[...m];
  if(sortBy==='count')return arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
  return arr.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
}
function getFacet(k,sortBy='count'){
  const key=facetKey(k)+':'+sortBy;
  if(S.facetCache[key])return S.facetCache[key];
  const v=facet(k,sortBy);
  S.facetCache[key]=v;
  return v;
}
function getFacets(){
  if(S.facets)return S.facets;
  const f={};SECTIONS.forEach(s=>{f[s.k]=getFacet(s.k)});

}

function renderFilter(){
  let html='';

      return`<button class="fsect${active?' on':''}" data-a="fsect" data-v="${s.k}">
        <span class="ic"><i class="fa-solid ${s.icon}"></i></span>

        <button class="sortbtn${curSort==='name'?' on':''}" data-a="fsort" data-v="name"><i class="fa-solid fa-arrow-down-a-z"></i> أبجدي</button>
      </div>`;
    const avail=getFacet(S.filterPanel.key,curSort);
    const selected=S.f[S.filterPanel.key];
    html+=avail.map(([v,n])=>{
      const on=selected.some(x=>norm(x)===norm(v));
      return`<button class="fopt${on?' on':''}" data-a="fpick" data-v="${esc(v)}">
        <span class="box"><i class="fa-solid fa-check"></i></span>

  </div>`;
  openM(html);
}

function renderExplorerList(){
  const{t,d,s}=S.exp;
  const sortMode=S.exp.sort||'count';
  const base=S.db.filter(r=>!t||r.type===t).filter(matchExp);
  const grp=(l,k)=>{
    const m=new Map();
    l.forEach(r=>{const v=r[k]||'—';m.set(v,(m.get(v)||0)+1)});

    .map(x=>({n:TL[x]+'ون',c:S.db.filter(r=>r.type===x).length,k:x,i:x==='experts'?'fa-user-tie':'fa-truck-field'}))
    .sort((a,b)=>sortMode==='name'?a.n.localeCompare(b.n,'ar'):b.c-a.c||a.n.localeCompare(b.n,'ar'))
    .map(x=>row(x.i,x.n,x.c,'xt',x.k)).join('');
  if(!d)return grp(base,'domaine').map(g=>row(domIcon(g[0]),g[0],g[1],'xd',g[0])).join('');
  if(!s)return grp(base.filter(r=>r.domaine===d),'specialite').map(g=>row('fa-screwdriver-wrench',g[0],g[1],'xs',g[0])).join('');
  return'<div class="ls">'+base.filter(r=>r.domaine===d&&r.specialite===s).map(card).join('')+'</div>';

// SHARE
const SEP_LINE='➖➖➖➖➖➖➖➖➖➖➖➖';
async function share(id){
  const r=byId(id);if(!r)return;
  const p=fmtPhone(r.phone),w=url(r.web);
  const lines=[`👤 ${r.name}`,SEP_LINE];
  lines.push(`🏷️ النوع: ${TL[r.type]}`);
  lines.push(`📂 التصنيف: ${CL[r.categorie]}`);
  if(shown(r.domaine))lines.push(`🏭 القطاع: ${r.domaine}`);
  if(shown(r.specialite))lines.push(`🛠️ التخصص: ${r.specialite}`);
  if(r.ville)lines.push(`📍 المدينة: ${r.ville}`);
  if(p)lines.push(`📞 الهاتف: ${p}`);
  if(r.email)lines.push(`✉️ البريد: ${r.email}`);
  if(w)lines.push(`🌐 الموقع: ${w}`);
  lines.push(SEP_LINE,`🔗 ${baseUrl()}#p=${r.id}`);
  const text=lines.join('\n');
  if(navigator.share){try{await navigator.share({title:r.name,text});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);toast('تم النسخ')}catch{toast('تعذر النسخ')}
  setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener'),0);
}
async function shareLink(rawUrl,name){
  if(!rawUrl)return;
  const text=[`🔗 ${name||'رابط'}`,'➖➖➖➖➖➖➖➖➖➖➖➖',rawUrl].join('\n');
  if(navigator.share){try{await navigator.share({title:name||'رابط',text});return}catch(e){if(e.name==='AbortError')return}}

async function loadPdfLibs(){

  const ld=u=>new Promise((a,b)=>{const e=document.createElement('script');e.src=u;e.onload=a;e.onerror=b;document.head.appendChild(e)});
  try{
    await Promise.all([
      window.html2canvas?0:ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
      window.jspdf?0:ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    ]);
  }catch{throw new Error('تعذر تحميل مكتبة PDF')}
}
function pdfHtml(r){
  const p=fmtPhone(r.phone),w=url(r.web),rows=[];
  if(shown(r.domaine))rows.push(['fa-industry','القطاع',r.domaine]);
  if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',r.specialite]);
  if(r.ville)rows.push(['fa-location-dot','المدينة',r.ville]);
  if(p)rows.push(['fa-phone','الهاتف',p]);
  if(r.email)rows.push(['fa-envelope','البريد',r.email]);
  if(w)rows.push(['fa-globe','الموقع',r.web]);
  const base=baseUrl();
  const qr=base?`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(base+'#p='+r.id)}&color=1A2332&bgcolor=FFFFFF&margin=0" crossorigin="anonymous" alt="QR">`:'';
  return `<div class="pdf-card" data-pdf-root>
    <div class="pdf-l"><div class="pdf-logo"><i class="fa-solid ${domIcon(r.domaine)}"></i></div>
      <div class="pdf-name">${esc(r.name)}</div><div class="pdf-sub">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div>
      <div class="pdf-tags"><span class="pdf-tag">${TL[r.type]}</span><span class="pdf-tag">${CL[r.categorie]}</span>${r.verified?'<span class="pdf-tag v">✓ موثّق</span>':''}</div></div>
    <div class="pdf-r">${rows.map(([i,k,v])=>`<div class="pdf-row"><div class="ic"><i class="fa-solid ${i}"></i></div><div><div class="k">${k}</div><div class="v">${esc(v)}</div></div></div>`).join('')}</div>
    <div class="pdf-ft"><b>CONNECT PRO</b>${qr}</div></div>`;
}
async function makePDF(id){
  const r=byId(id);if(!r)return;busy(true);let h=null;
  try{
    await loadPdfLibs();
    h=document.createElement('div');h.className='pdf-stage';h.innerHTML=pdfHtml(r);document.body.appendChild(h);
    try{await document.fonts?.ready}catch{}
    await new Promise(res=>setTimeout(res,700));
    const cv=await html2canvas(h.querySelector('[data-pdf-root]'),{scale:2,backgroundColor:'#F4F6F8',useCORS:true,logging:false});
    const{jsPDF}=window.jspdf,W=200,H=W*cv.height/cv.width;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[W,H]});
    pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);
    pdf.save(`ConnectPro-${r.name.replace(/\s+/g,'_')}.pdf`);
    toast('تم توليد بطاقة PDF');
  }catch(e){console.error(e);toast(e.message||'خطأ في توليد PDF')}
  finally{h?.remove();busy(false)}
}

// SYNC CSV
async function syncCSV(){
  if(!S.fb)return toast('Firebase غير متاح');
  if(!S.isDirty && S.lastCsvHash){
    toast('كل شيء متزامن بالفعل');
    return;
  }
  askConfirm({
    title:'مزامنة CSV إلى Firebase',
    message:`سيتم رفع <b>${S.db.length}</b> سجل من Google Sheets إلى Firebase كنسخة احتياطية.`,
    icon:'fa-cloud-arrow-up',
    tone:'primary',
    confirmLabel:'مزامنة الآن',
    onConfirm:async()=>{
      busy(true);
      try{
        const tree={};
        S.db.forEach(r=>{
          const{type,categorie,...x}=r;
          const T=TK[type],C=CK[categorie];
          tree[T]=tree[T]||{};
          (tree[T][C]=tree[T][C]||{})[x.id]={...x,createdAt:x.createdAt||Date.now()};
        });
        await S.fb.ref('professionals').set(tree);
        const newHash=computeCsvHash(S.db);
        S.lastCsvHash=newHash;
        try{localStorage.setItem('cp-csv-hash',newHash)}catch{}
        S.isDirty=false;
        try{await S.fb.ref('meta/lastSync').set(Date.now())}catch{}
        toast(`تم رفع ${S.db.length} سجل إلى Firebase`);
        topbar();
      }catch(e){
        console.error(e);
        toast('فشلت المزامنة');
      }finally{
        busy(false);
      }
    }
  });
}

// ACTIONS
const A={
  theme(){
    const d=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=d;
    try{localStorage.setItem('cp-theme',d)}catch{}
    topbar();toast(d==='dark'?'الوضع الداكن':'الوضع الفاتح');
  },
  refresh(){
    busy(true);
    loadDB().then(()=>{
      S.lastSync=Date.now();
      topbar();
      rerender();busy(false);
      toast(S.isDirty?'تم التحديث — توجد تغييرات جديدة':'تم التحديث من CSV');
    }).catch(()=>{busy(false);toast('تعذر التحديث')});
  },
  syncCSV,
  openForms(){
    const item=(label,sub,url,kind)=>`
      <div class="choice-card ${kind}">
        <div class="chi"><i class="fa-solid ${kind==='form'?'fa-user-tie':'fa-truck-field'}"></i></div>
        <div class="cht"><b>${esc(label)}</b><small>${esc(sub)}</small></div>
        <div class="ch-actions">
          <a class="open" href="${url}" target="_blank" rel="noopener" title="فتح النموذج">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
          <button class="share" data-a="shrLink" data-v="${esc(url)}" data-name="${esc(label)}" title="مشاركة">
            <i class="fa-solid fa-share-nodes"></i>
          </button>
        </div>
      </div>`;
    openM(`<h2>نماذج الإدخال</h2>
      <p class="lead">اختر نوع التسجيل — سيُفتح نموذج Google</p>
      <div class="choice-list">
        ${item('تسجيل خبير','أدخل بياناتك كخبير',FORM_FOURNISSEURS,'form')}
        ${item('تسجيل مورّد','أدخل بياناتك كمورّد',FORM_EXPERTS,'form')}
      </div>
      <div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
  },
  openSheets(){
    const item=(label,sub,url)=>`
      <div class="choice-card sheet">
        <div class="chi"><i class="fa-solid fa-table"></i></div>
        <div class="cht"><b>${esc(label)}</b><small>${esc(sub)}</small></div>
        <div class="ch-actions">
          <a class="open" href="${url}" target="_blank" rel="noopener" title="فتح الورقة">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
          <button class="share" data-a="shrLink" data-v="${esc(url)}" data-name="${esc(label)}" title="مشاركة">
            <i class="fa-solid fa-share-nodes"></i>
          </button>
        </div>
      </div>`;
    openM(`<h2>فتح الأوراق</h2>
      <p class="lead">اختر الورقة لعرضها في Google Sheets</p>
      <div class="choice-list">
        ${item('ورقة الخبراء','عرض جدول الخبراء',SHEET_EXPERTS)}
        ${item('ورقة الموردين','عرض جدول الموردين',SHEET_FOURNISSEURS)}
      </div>
      <div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
  },
  allowLocation(){
    $('#loc-banner').classList.remove('on');
    const deviceId=getDeviceId();
    if(!navigator.geolocation){
      toast('المتصفح لا يدعم الموقع');
      return;
    }
    toast('جاري تحديد موقعك...');
    navigator.geolocation.getCurrentPosition(
      async(p)=>{
        try{
          const lat=+p.coords.latitude.toFixed(4);
          const lng=+p.coords.longitude.toFixed(4);
          const city=await reverseGeo(lat,lng);
          const base='devices/'+deviceId;
          const update={lastLat:lat,lastLng:lng,lastGeoAt:Date.now()};
          if(city) update.lastCity=city;
          if(S.fb) await S.fb.ref(base).update(update);
          localStorage.setItem('cp-loc-permission','granted');
          toast(city?`📍 ${city}`:'📍 تم تحديد موقعك');
        }catch(e){
          console.warn('save geo failed',e);
          toast('تعذر حفظ الموقع');
        }
      },
      (err)=>{
        if(err.code===err.PERMISSION_DENIED){
          localStorage.setItem('cp-loc-permission','denied');
          toast('تم رفض الإذن — يمكنك تفعيله من إعدادات المتصفح');
        } else if(err.code===err.TIMEOUT){
          toast('انتهت مهلة تحديد الموقع');
        } else {
          toast('تعذر تحديد الموقع');
        }
      },
      {enableHighAccuracy:false,timeout:10000,maximumAge:300000}
    );
  },
  skipLocation(){
    $('#loc-banner').classList.remove('on');
    localStorage.setItem('cp-loc-permission','skipped');
    toast('حسناً — يمكنك مشاركة الموقع لاحقاً');
  },
  shrLink:shareLink,
  pdf:makePDF,
  confirmAccept,confirmCancel,
  tab(v){
    if(S.tab===v){
      if(v==='dir'){clearF();dirShell()}
      else if(v==='exp'){S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};explorer()}
      else scrollTo({top:0,behavior:'smooth'});
    }else go(v);
  },
  cls:closeM,open(id){profile(id)},shr:share,fav:toggleFav,
  undo(){if(undoFn){undoFn();undoFn=null;$('#ts').classList.remove('on')}},
  stat(v){
    if(v==='f'){openFilter();return}
    const i=v.indexOf(':');
    clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];go('dir');
  },
  bar(v,el){clearF();S.f[el.dataset.k]=[v];go('dir')},
  chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=40;clearFacetCache();dirList()},
  qx(){S.q='';$('#q').value='';S.lim=40;clearFacetCache();dirList()},
  more(){S.lim+=40;dirList()},
  fmodal:()=>openFilter(),
  fsect(v){S.filterPanel.mode='pick';S.filterPanel.key=v;renderFilter()},
  fback(){S.filterPanel.mode='sections';S.filterPanel.key=null;renderFilter()},
  fsort(v){S.sortF[S.filterPanel.key]=v;renderFilter()},
  fclearsec(){S.f[S.filterPanel.key]=[];S.lim=40;clearFacetCache();renderFilter();if(S.tab==='dir')dirList()},
  fpick(v){
    const k=S.filterPanel.key,arr=S.f[k];
    const i=arr.findIndex(x=>norm(x)===norm(v));
    if(i>=0)arr.splice(i,1);else arr.push(v);
    S.lim=40;clearFacetCache();renderFilter();if(S.tab==='dir')dirList();
  },
  fclr(){clearF();renderFilter();if(S.tab==='dir'){$('#q')&&($('#q').value='');dirList()}},
  fdone(){closeM();if(S.tab!=='dir'){S.tab='';go('dir')}else{dirList()}},
  xsort(v){S.exp.sort=v;explorer()},
  xt:v=>{S.exp={t:v,d:'',s:'',q:'',sort:S.exp.sort};explorer()},
  xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';explorer()},
  xs:v=>{S.exp.s=v;S.exp.q='';explorer()},
  qxexp(){S.exp.q='';explorer()},
  xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:'',sort:x.sort}:v==='t'?{t:x.t,d:'',s:'',q:'',sort:x.sort}:v==='d'?{t:x.t,d:x.d,s:'',q:'',sort:x.sort}:x;explorer()},
  favclr(){
    askConfirm({
      title:'مسح المفضلة',message:'إزالة كل الشركات من المفضلة؟',
      icon:'fa-star',tone:'warning',confirmLabel:'مسح الكل',
      onConfirm:()=>{S.fav=[];try{localStorage.removeItem('cp-fav')}catch{};favorites();favBadge()}
    });
  },
  installPWA(){
    if(!S.installEvent)return toast('التثبيت غير متاح');
    S.installEvent.prompt();
    S.installEvent.userChoice.then(({outcome})=>{
      if(outcome==='accepted'){S.installEvent=null;$('#pwaBar').classList.remove('on');toast('جاري التثبيت...')}
    });
  },
  closePWA(){
    S.pwaDismissed=true;
    try{localStorage.setItem('cp-pwa-dismissed','1')}catch{}
    $('#pwaBar').classList.remove('on');
  }
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}
  else if(e.target.id==='md')closeM();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeM();
  if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v);
});
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  S.installEvent=e;
  if(!S.pwaDismissed)$('#pwaBar').classList.add('on');
});
window.addEventListener('appinstalled',()=>{
  S.installEvent=null;$('#pwaBar').classList.remove('on');toast('تم تثبيت التطبيق');
});

(async()=>{
  try{
    if(window.firebase){
      firebase.initializeApp(FBC);
      S.fb=firebase.database();
    }
  }catch(e){console.warn('Firebase init failed',e)}

  await loadDB();
  S.lastSync=Date.now();
  go('home');
  busy(false);
  topbar();

  trackDevice().catch(e=>console.warn('track',e));

  if(S.fb){
    updateOnlineCount();
    setInterval(updateOnlineCount,30*1000);
  }

  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(m[1]);r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
