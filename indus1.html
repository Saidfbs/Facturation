<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Réseau Industriel — Maroc</title>
<meta name="theme-color" content="#F5F5F7">
<meta name="description" content="نربط الموردين والشركات في مكان واحد">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== Réseau Industriel — macOS Design System ===== */
:root{
  --ink:#1D1D1F;--ink2:#2C2C2E;--pri:#007AFF;--pri2:#0062CC;--acc:#FF9F0A;
  --bg:#F5F5F7;--sf:rgba(255,255,255,.78);--sf2:rgba(255,255,255,.55);
  --bd:rgba(0,0,0,.08);--tx:#1D1D1F;--tx2:#6E6E73;--tx3:#8E8E93;
  --ok:#34C759;--bad:#FF3B30;--sky:#007AFF;--wa:#25D366;--fb:#1877F2;
  --sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --r:14px;--r2:20px;--r3:28px;
  --ff:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','IBM Plex Sans Arabic',system-ui,sans-serif;
  --fm:'SF Mono','IBM Plex Mono',ui-monospace,Consolas,monospace;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --glass:blur(24px) saturate(180%);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#000;--sf:rgba(28,28,30,.78);--sf2:rgba(44,44,46,.55);
  --bd:rgba(255,255,255,.12);--tx:#F5F5F7;--tx2:#AEAEB2;--tx3:#8E8E93;
  --ink:#F5F5F7;--ink2:#1C1C1E;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font:15px/1.5 var(--ff);color:var(--tx);min-height:100vh;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-0.01em;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}

/* Header — macOS toolbar */
header{
  position:fixed;inset:0 0 auto;z-index:30;padding-top:var(--st);
  background:var(--sf);
  -webkit-backdrop-filter:var(--glass);
  backdrop-filter:var(--glass);
  border-bottom:1px solid var(--bd);
}
.hin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(145deg,#007AFF,#0A84FF);
  color:#fff;display:grid;place-items:center;flex:none;font-size:16px;
  box-shadow:0 2px 8px rgba(0,122,255,.35),inset 0 1px 0 rgba(255,255,255,.3);
}
.brand b{display:block;color:var(--tx);font-size:15px;line-height:1.2;font-weight:600;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--tx2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px}
.ib{
  width:36px;height:36px;border-radius:10px;
  background:var(--sf2);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid var(--bd);color:var(--tx);
  display:inline-grid;place-items:center;position:relative;transition:.15s;flex:none;
  font-size:14px;
}
.ib:hover{background:rgba(0,122,255,.12);border-color:rgba(0,122,255,.3);color:var(--pri)}
.ib:active{transform:scale(.94)}
.ib.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(0,122,255,.3)}
.ib.pri:hover{background:var(--pri2);color:#fff}
.ib.grn{background:var(--acc);border-color:var(--acc);color:#1D1D1F}

main{max-width:1100px;margin:0 auto;padding:calc(78px + var(--st)) 16px calc(96px + var(--sb))}
.tab{display:none}.tab.on{display:block;animation:fu .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}

/* Hero — macOS gradient card */
.hero{
  padding:32px 28px;border-radius:var(--r3);
  background:linear-gradient(135deg,#007AFF 0%,#5E5CE6 50%,#BF5AF2 100%);
  color:#fff;position:relative;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,122,255,.25);
  border:1px solid rgba(255,255,255,.15);
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.25) 0%,transparent 50%);
  pointer-events:none;
}
.hero::after{content:"\f275";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset-inline-end:-20px;bottom:-40px;font-size:160px;opacity:.1;color:#fff}
.hero>*{position:relative}
.hero span{
  display:inline-block;font-family:var(--fm);font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  color:#fff;padding:5px 12px;border-radius:20px;margin-bottom:12px;
  border:1px solid rgba(255,255,255,.3);
}
.hero h2{font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-0.03em}
.hero p{color:rgba(255,255,255,.9);font-size:14px;margin-top:8px;max-width:520px;line-height:1.5}
.hero .bt{margin-top:20px;background:#fff;color:#007AFF;border:0;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.hero .bt:hover{background:rgba(255,255,255,.92);color:#007AFF}

/* Section heads */
.sh{display:flex;align-items:center;gap:12px;margin:32px 0 14px}
.sh i{
  width:32px;height:32px;border-radius:9px;
  background:var(--sf);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  color:var(--pri);display:grid;place-items:center;font-size:13px;
  border:1px solid var(--bd);
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.sh b{flex:1;font-size:17px;font-weight:600;letter-spacing:-0.02em;color:var(--tx)}
.sh small{display:block;color:var(--tx2);font-size:12px;font-weight:400;margin-top:2px;letter-spacing:0}
.sh em{font-style:normal;font-family:var(--fm);background:var(--pri);color:#fff;font-weight:600;font-size:12px;padding:3px 10px;border-radius:10px}

/* Stats — macOS tiles */
.g4{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{
  background:var(--sf);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid var(--bd);border-radius:var(--r2);
  padding:18px 10px;text-align:center;
  box-shadow:var(--sh);transition:.2s;display:flex;flex-direction:column;align-items:center;gap:6px;
}
.sc:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(0,0,0,.05),0 16px 40px rgba(0,0,0,.08)}
.sc i{width:36px;height:36px;border-radius:10px;background:rgba(0,122,255,.1);color:var(--pri);display:grid;place-items:center;font-size:15px}
.sc b{font-family:var(--fm);font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-0.02em}
.sc span{color:var(--tx2);font-size:12px;font-weight:500}
.seg{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:14px;background:rgba(0,0,0,.05)}
.seg i{display:block;border-radius:3px}
.cols{display:grid;gap:14px}
@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.pn{
  background:var(--sf);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid var(--bd);border-radius:var(--r2);padding:18px;
  box-shadow:var(--sh);
}
.pn>b{display:block;font-size:13px;color:var(--tx2);margin-bottom:10px;font-weight:600;letter-spacing:-0.01em}
.sl{max-height:280px;overflow-y:auto}
.bar{
  position:relative;display:flex;justify-content:space-between;align-items:center;
  width:100%;min-height:38px;padding:0 12px;margin-top:6px;border-radius:10px;
  background:rgba(0,0,0,.03);border:1px solid transparent;overflow:hidden;
  font-weight:500;font-size:13.5px;transition:.15s;
}
[data-theme=dark] .bar{background:rgba(255,255,255,.05)}
.bar:hover{border-color:var(--bd);background:rgba(0,122,255,.06)}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,rgba(0,122,255,.2),rgba(0,122,255,.08));border-radius:10px}
.bar span,.bar b{position:relative}
.bar b{font-family:var(--fm);background:var(--pri);color:#fff;border-radius:8px;padding:2px 10px;font-size:12px;font-weight:600}

/* Search — macOS Spotlight */
.sr{
  display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 16px;
  background:var(--sf);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid var(--bd);border-radius:12px;
  box-shadow:var(--sh);transition:.15s;
}
.sr:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px rgba(0,122,255,.15),var(--sh)}
.sr>i{color:var(--tx3);font-size:14px}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:15px}
.sr input::placeholder{color:var(--tx3)}
.sr .x{width:28px;height:28px;border-radius:8px;color:var(--tx3);background:rgba(0,0,0,.05);display:grid;place-items:center;font-size:11px}
.fbtn{
  width:36px;height:36px;border-radius:9px;
  background:var(--pri);color:#fff;display:grid;place-items:center;position:relative;
  box-shadow:0 2px 6px rgba(0,122,255,.3);transition:.15s;
}
.fbtn:active{transform:scale(.94)}
.fbtn.has{background:var(--acc);color:#1D1D1F;box-shadow:0 2px 6px rgba(255,159,10,.35)}
.bub{position:absolute;top:-6px;inset-inline-end:-6px;min-width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font-family:var(--fm);font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chips:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 12px;
  border-radius:14px;background:rgba(0,122,255,.12);color:var(--pri);
  font-weight:500;font-size:12.5px;
}
.chip button{width:20px;height:20px;border-radius:50%;background:rgba(0,122,255,.2);color:var(--pri);font-size:9px;display:grid;place-items:center}
.inf{color:var(--tx2);font-size:13px;margin:14px 4px 10px;font-weight:500}
.pill{
  display:flex;gap:2px;margin:14px 0;padding:3px;
  background:rgba(120,120,128,.12);border-radius:10px;
}
.pill button{
  flex:1;height:34px;border-radius:8px;color:var(--tx2);font-weight:500;font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s;
}
.pill button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* Cards — macOS style */
.ls{display:grid;gap:12px}
@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}
.card{
  display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:14px;
  background:var(--sf);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid var(--bd);border-radius:var(--r2);
  box-shadow:var(--sh);cursor:pointer;transition:.2s cubic-bezier(.2,.8,.2,1);
  position:relative;overflow:hidden;
}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(0,0,0,.05),0 16px 40px rgba(0,0,0,.1)}
.card:active{transform:scale(.99)}
.card.fv{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),var(--sh)}
.card.mine{border-color:var(--pri);background:linear-gradient(135deg,rgba(0,122,255,.06),rgba(94,92,230,.04))}
.card.exp{border-inline-start:0}
.card.four{border-inline-start:0}
.av{
  width:52px;height:52px;border-radius:12px;color:#fff;
  display:grid;place-items:center;font-family:var(--fm);font-weight:700;font-size:17px;
  flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.15);
}
.av.four{background:linear-gradient(145deg,#FF9F0A,#FF6B00)}
.av.exp{background:linear-gradient(145deg,#007AFF,#5E5CE6)}
.av.mine{background:linear-gradient(145deg,#34C759,#28A745)}
.cm{min-width:0;display:flex;flex-direction:column;gap:4px}
.ti{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.02em;display:flex;align-items:center;gap:6px}
.ti i{color:var(--pri);font-size:12px;flex:none}
.ir{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--tx2)}
.ir i{color:var(--pri);font-size:10px;margin-inline-end:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.tg{
  font-size:11px;font-weight:500;padding:2px 9px;border-radius:8px;
  background:rgba(120,120,128,.12);color:var(--tx2);
}
.tg.a{background:var(--ink);color:var(--bg);border:0}
.tg.four{background:rgba(255,159,10,.15);color:#C77800}
.tg.exp{background:rgba(0,122,255,.12);color:var(--pri)}
.tg.me{background:var(--pri);color:#fff}
.tg.v{background:rgba(52,199,89,.15);color:var(--ok)}
.ca{display:grid;grid-template-columns:repeat(2,28px);gap:5px;align-self:start}
.ca button,.ca a{
  width:28px;height:28px;border-radius:7px;background:rgba(120,120,128,.1);
  border:0;color:var(--tx2);display:grid;place-items:center;font-size:12px;
  transition:.15s;
}
.ca button:hover,.ca a:hover{background:rgba(0,122,255,.15);color:var(--pri)}
.ca button:active,.ca a:active{transform:scale(.92)}
.ca .on{background:rgba(255,159,10,.18);color:var(--acc)}
.ca .wa{color:var(--wa)}
.ca .wa:hover{background:rgba(37,211,102,.15);color:var(--wa)}
.ca .pdf{color:var(--bad)}
.ca .pdf:hover{background:rgba(255,59,48,.15);color:var(--bad)}
.chip2{
  display:flex;align-items:center;gap:12px;padding:12px;
  background:var(--sf);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid var(--bd);border-radius:var(--r2);
  box-shadow:var(--sh);cursor:pointer;width:100%;text-align:start;margin-bottom:8px;
  transition:.2s;
}
.chip2:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.chip2 .av{width:40px;height:40px;font-size:14px;border-radius:10px}
.chip2 .bd{flex:1;min-width:0}
.chip2 b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.02em}
.chip2 small{color:var(--tx2);font-size:12px}
.mine{background:linear-gradient(135deg,rgba(0,122,255,.1),rgba(94,92,230,.06))}
.em{
  text-align:center;padding:56px 20px;border-radius:var(--r2);
  color:var(--tx2);background:var(--sf);grid-column:1/-1;
  border:1px dashed var(--bd);
}
.em i{font-size:32px;display:block;margin-bottom:12px;color:var(--tx3)}
.em b{display:block;color:var(--tx);font-size:17px;font-weight:600;letter-spacing:-0.02em;margin-bottom:4px}
.em small{font-size:13px}

/* Explorer */
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0}
.cr button{
  padding:6px 14px;border-radius:8px;background:var(--sf);
  border:1px solid var(--bd);font-weight:500;font-size:13px;
  transition:.15s;
}
.cr button:hover{background:rgba(0,122,255,.08);border-color:rgba(0,122,255,.3)}
.cr button:last-child{background:var(--pri);color:#fff;border-color:var(--pri)}
.cr i{font-size:9px;color:var(--tx3)}
.rw{
  display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin-bottom:10px;
  border-radius:var(--r2);background:var(--sf);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid var(--bd);text-align:start;font-weight:500;
  box-shadow:var(--sh);transition:.2s;
}
.rw:hover{transform:translateY(-1px);border-color:rgba(0,122,255,.3);box-shadow:0 4px 16px rgba(0,122,255,.1)}
.rw>i:first-child{
  width:42px;height:42px;border-radius:11px;
  background:rgba(0,122,255,.12);color:var(--pri);display:grid;place-items:center;font-size:16px;
}
.rw span{flex:1;font-size:14.5px}
.rw em{font-style:normal;font-family:var(--fm);background:var(--pri);color:#fff;border-radius:8px;padding:2px 12px;font-size:12.5px;font-weight:600}
.rw>i:last-child{font-size:10px;color:var(--tx3)}

/* Buttons — macOS style */
.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:38px;padding:0 20px;border-radius:10px;
  font-weight:600;font-size:14px;letter-spacing:-0.01em;
  background:var(--pri);color:#fff;border:0;
  box-shadow:0 2px 6px rgba(0,122,255,.3),inset 0 1px 0 rgba(255,255,255,.15);
  transition:.15s;
}
.bt:hover{background:var(--pri2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,122,255,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.bt:active{transform:translateY(0) scale(.98)}
.bt:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.bt.g{background:rgba(120,120,128,.15);color:var(--tx);box-shadow:none}
.bt.g:hover{background:rgba(120,120,128,.22)}
.bt.k{background:var(--ink);color:var(--bg)}
.bt.d{background:var(--bad);color:#fff;box-shadow:0 2px 6px rgba(255,59,48,.3)}
.bt.full{width:100%}

/* Modal — macOS sheet */
#md{
  position:fixed;inset:0;z-index:60;
  background:rgba(0,0,0,.4);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  display:none;align-items:center;justify-content:center;
  padding:20px;overflow-y:auto;
}
#md.on{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.sheet{
  width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow-y:auto;
  background:var(--sf);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  padding:24px;border-radius:var(--r3);
  border:1px solid var(--bd);
  box-shadow:0 24px 80px rgba(0,0,0,.3);
  animation:sheetIn .3s cubic-bezier(.2,.8,.2,1);
  position:relative;margin:auto;
}
@keyframes sheetIn{from{transform:translateY(30px) scale(.96);opacity:0}}
.sheet h2{font-size:20px;margin-bottom:4px;font-weight:700;letter-spacing:-0.03em}
.lead{color:var(--tx2);font-size:14px;margin-bottom:16px}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.ac .full{grid-column:1/-1}
.fs{
  display:flex;align-items:center;gap:14px;width:100%;padding:12px;
  border-radius:12px;text-align:start;background:var(--sf2);
  border:1px solid var(--bd);margin-bottom:8px;transition:.15s;
}
.fs:hover{background:rgba(0,122,255,.06);border-color:rgba(0,122,255,.2)}
.fs.on{background:rgba(0,122,255,.1);border-color:var(--pri)}
.fs .ic{
  width:40px;height:40px;border-radius:10px;
  background:rgba(120,120,128,.15);color:var(--pri);
  display:grid;place-items:center;flex:none;font-size:15px;
}
.fs.on .ic{background:var(--pri);color:#fff}
.fs .nm{flex:1;font-weight:500;word-break:break-word;font-size:14.5px}
.fs .val{color:var(--pri);font-size:12.5px;max-width:55%;text-align:end;font-weight:500}
.fs .n{font-family:var(--fm);background:rgba(120,120,128,.15);padding:2px 10px;border-radius:8px;font-size:12.5px;font-weight:600}
.fs.on .n{background:var(--pri);color:#fff}
.fs .box{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--tx3);display:grid;place-items:center;
  color:transparent;font-size:10px;flex:none;transition:.15s;
}
.fs.on .box{background:var(--pri);border-color:var(--pri);color:#fff}
.fs.clr{border-style:dashed;color:var(--bad)}

function splitCSV(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const h=l[i];if(h==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(h===','&&!q){o.push(c);c=''}else c+=h}o.push(c);return o}
const parseCSV=(txt,type,cat)=>{const cl=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c=>cl(c[1])).map(c=>{const name=cl(c[1]),phone=fmtPhone(cl(c[5])),email=cl(c[6]).toLowerCase();const seed=type+'|'+(email||norm(name)+'|'+phone);let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;return{id:'p'+h.toString(36),name,domaine:cl(c[2])||'Autre',specialite:cl(c[3])||'Général',ville:cl(c[4]),phone,email,web:cl(c[7]),type,categorie:cat}})};
async function fetchCSV(){const g=async u=>{const r=await fetch(u+'&cachebust='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.text()};const[e,f]=await Promise.all([g(CSV_E),g(CSV_F)]);const m=new Map();[...parseCSV(f,'fournisseurs','services'),...parseCSV(e,'experts','yad-amila')].forEach(r=>{if(!m.has(r.id))m.set(r.id,r)});return[...m.values()]}
const lastOf=(db)=>['fournisseurs','experts'].map(t=>db.filter(r=>r.type===t).pop()).filter(Boolean);
const clearFc=()=>{S.fc={};S.facets=null};
async function loadDB(){
  try{const d=await fetchCSV();if(d.length){S.db=d;S.idx=new Map(d.map(r=>[r.id,r]));S.src='csv';const h=hashOf(d);if(S.hash&&S.hash!==h)S.dirty=true;else if(!S.hash){S.hash=h;try{localStorage.setItem('cp-csv-hash',h)}catch{}}S.newM=lastOf(d);try{localStorage.setItem('cp-csv-cache',JSON.stringify({t:Date.now(),d}))}catch{}clearFc();return}}catch(e){console.warn(e)}
  const c=ls('cp-csv-cache',null);if(c&&c.d&&c.d.length){S.db=c.d;S.idx=new Map(S.db.map(r=>[r.id,r]));S.src='cache';S.newM=lastOf(S.db)}clearFc()}

function match(r,skip){for(const k in FLD){if(k===skip)continue;const a=S.f[k];if(a.length&&!a.some(v=>norm(r[FLD[k]])===norm(v)))return false}return S.q?hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.q):true}
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0)+(S.q?1:0);
const clearF=()=>{S.f={type:[],cat:[],dom:[],spe:[],ville:[]};S.q='';S.lim=40;clearFc()};
function facet(k,by='count'){const m=new Map();S.db.filter(r=>match(r,k)).forEach(r=>{const v=(r[FLD[k]]||'').trim();if(v)m.set(v,(m.get(v)||0)+1)});const a=[...m];return by==='count'?a.sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0],'ar')):a.sort((x,y)=>x[0].localeCompare(y[0],'ar'))}
function getFacet(k,by='count'){const key=k+':'+JSON.stringify(S.f)+S.q+by;return S.fc[key]||(S.fc[key]=facet(k,by))}

 if(p)rows.push(['fa-phone','الهاتف',`<span dir="ltr">${esc(p)}</span>`,'tel:'+esc(p)]);if(r.email)rows.push(['fa-envelope','البريد',`<span dir="ltr">${esc(r.email)}</span>`,'mailto:'+esc(r.email)]);if(w)rows.push(['fa-globe','الموقع',`<span dir="ltr">${esc(r.web)}</span>`,esc(w),1]);
 const mine=S.me&&S.me.id===r.id,vis=getVisits(r.id);
 openM(`<div class="ph"><div class="pl"><i class="fa-solid ${domIcon(r.domaine)}"></i></div><div class="pn2">${esc(r.name)} ${r.verified?'<i class="fa-solid fa-circle-check" style="color:#fff;font-size:16px"></i>':''}</div><div class="ps">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div>
 <div class="tags"><span class="tg">${TL[r.type]}</span><span class="tg">${CL[r.categorie]}</span>${vis?`<span class="tg"><i class="fa-solid fa-eye"></i> ${vis}</span>`:''}${r.verified?'<span class="tg">موثّق</span>':''}</div></div>
 <div class="pa">${p?`<a class="ib wa" href="https://wa.me/${esc(waP(p))}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i></a>`:''}<button class="ib" data-a="shr" data-v="${esc(r.id)}"><i class="fa-solid fa-share-nodes"></i></button><button class="ib pdf" data-a="pdf" data-v="${esc(r.id)}"><i class="fa-solid fa-file-pdf"></i></button><button class="ib" data-a="cls"><i class="fa-solid fa-xmark"></i></button></div>
 ${rows.map(([i,k,v,h,ext])=>`<div class="vr">${h?`<a href="${h}"${ext?' target="_blank" rel="noopener"':''}><i class="fa-solid ${i}"></i></a>`:`<i class="fa-solid ${i}"></i>`}<div><small>${k}</small><b>${v}</b></div></div>`).join('')}
 ${mine?'<p class="inf" style="text-align:center;color:var(--ok)"><i class="fa-solid fa-circle-check"></i> هذا حسابك الحالي</p>':''}`);
 setTimeout(()=>{if(S.tab==='dir')dirList();else if(S.tab==='home')home();else if(S.tab==='fav')favShell()},300)}

const SEP='➖➖➖➖➖➖➖➖➖➖➖➖';
async function share(id){const r=byId(id);if(!r)return;const p=fmtPhone(r.phone),w=url(r.web);
 const L=[`👤 ${r.name}`,SEP,`🏷️ النوع: ${TL[r.type]}`,`📂 التصنيف: ${CL[r.categorie]}`];
 if(shown(r.domaine))L.push(`🏭 القطاع: ${r.domaine}`);if(shown(r.specialite))L.push(`🛠️ التخصص: ${r.specialite}`);if(r.ville)L.push(`📍 المدينة: ${r.ville}`);if(p)L.push(`📞 الهاتف: ${p}`);if(r.email)L.push(`✉️ البريد: ${r.email}`);if(w)L.push(`🌐 الموقع: ${w}`);
 const link=baseUrl()?`${baseUrl()}#p=${r.id}`:'';if(link)L.push(SEP,`🔗 ${link}`);const text=L.join('\n');
 if(navigator.share){try{await navigator.share({title:r.name,text});return}catch(e){if(e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(text);toast('تم النسخ')}catch{toast('تعذر النسخ')}
 setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener'),0)}
async function shareLink(v,el){const u=el?.dataset?.url||'',n=el?.dataset?.name||'';if(!/^https?:\/\//i.test(u))return toast('رابط غير صالح');
 if(navigator.share){try{await navigator.share({title:n||'مشاركة',text:n?`${n}\n${u}`:u});return}catch(e){if(e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(u);toast('تم نسخ الرابط')}catch{toast('تعذر النسخ')}}
function toggleFav(id){const i=S.fav.indexOf(id);i>=0?S.fav.splice(i,1):S.fav.push(id);try{localStorage.setItem('cp-fav',JSON.stringify(S.fav))}catch{}toast(i>=0?'أُزيلت من المفضلة':'أُضيفت إلى المفضلة');topbar();if(!$('#md').classList.contains('on'))rerender()}

/* ---------- PDF ---------- */
async function loadPdf(){if(window.html2canvas&&window.jspdf)return;const ld=u=>new Promise((a,b)=>{const e=document.createElement('script');e.src=u;e.onload=a;e.onerror=b;document.head.appendChild(e)});try{await Promise.all([window.html2canvas?0:ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),window.jspdf?0:ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')])}catch{throw new Error('تعذر تحميل مكتبة PDF')}}
function pdfHtml(r){const p=fmtPhone(r.phone),w=url(r.web),rows=[];
 if(shown(r.domaine))rows.push(['fa-industry','القطاع',r.domaine]);if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',r.specialite]);if(r.ville)rows.push(['fa-location-dot','المدينة',r.ville]);if(p)rows.push(['fa-phone','الهاتف',p]);if(r.email)rows.push(['fa-envelope','البريد',r.email]);if(w)rows.push(['fa-globe','الموقع',r.web]);
 const b=baseUrl(),qr=b?`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(b+'#p='+r.id)}&margin=0" crossorigin="anonymous" alt="QR">`:'';
 return`<div class="pc" data-root><div class="pl2"><div class="lg"><i class="fa-solid ${domIcon(r.domaine)}"></i></div><div class="nm">${esc(r.name)}</div><div class="sb">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div></div><div class="pr">${rows.map(([i,k,v])=>`<div class="prw"><div class="ic"><i class="fa-solid ${i}"></i></div><div><div class="k">${k}</div><div class="v">${esc(v)}</div></div></div>`).join('')}</div><div class="pft"><b>RÉSEAU INDUSTRIEL</b>${qr}</div></div>`}
async function makePDF(id){const r=byId(id);if(!r)return;busy(true);let h=null;
 try{await loadPdf();h=document.createElement('div');h.className='pdf-stage';h.innerHTML=pdfHtml(r);document.body.appendChild(h);try{await document.fonts?.ready}catch{}await new Promise(x=>setTimeout(x,700));
  const cv=await html2canvas(h.querySelector('[data-root]'),{scale:2,backgroundColor:'#F5F5F7',useCORS:true,logging:false}),{jsPDF}=window.jspdf,W=200,H=W*cv.height/cv.width;
  const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[W,H]});pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);pdf.save(`Reseau-${r.name.replace(/\s+/g,'_')}.pdf`);toast('تم توليد بطاقة PDF')}
 catch(e){toast(e.message||'خطأ في توليد PDF')}finally{h?.remove();busy(false)}}

/* ---------- Actions ---------- */
const linkItem=(l,s,u,cls,ic)=>`<div class="cho ${cls}"><div class="li"><i class="fa-solid ${ic}"></i></div><div><b>${esc(l)}</b><small>${esc(s)}</small></div><div class="a"><a href="${u}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i></a><button data-a="shrLink" data-url="${esc(u)}" data-name="${esc(l)}"><i class="fa-solid fa-share-nodes"></i></button></div></div>`;
const A={
 theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('cp-theme',d)}catch{}topbar();toast(d==='dark'?'الوضع الداكن':'الوضع الفاتح')},
 pdf:makePDF,cls:closeM,open(id){profile(id)},shr:share,fav:toggleFav,shrLink:shareLink,
 confirmOk(){const cb=S.cb;S.cb=null;closeM();cb&&cb()},
 openForms(){openM(`<h2>نماذج الإدخال</h2><p class="lead">اختر نوع التسجيل — سيُفتح نموذج Google</p>${linkItem('تسجيل خبير','أدخل بياناتك كخبير',FORM_E,'','fa-user-tie')}${linkItem('تسجيل مورّد','أدخل بياناتك كمورّد',FORM_F,'','fa-truck-field')}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
 openSheets(){openM(`<h2>فتح الأوراق</h2><p class="lead">اختر الورقة لعرضها في Google Sheets</p>${linkItem('ورقة الخبراء','عرض جدول الخبراء',SHEET_E,'s','fa-table')}${linkItem('ورقة الموردين','عرض جدول الموردين',SHEET_F,'s','fa-table')}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
 undo(){if(undoFn){undoFn();undoFn=null;$('#ts').classList.remove('on')}},
 tab(v){if(S.tab===v){window.scrollTo({top:0,behavior:'smooth'});if(v==='exp'){S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};explorer()}else if(v==='dir'){clearF();dirShell()}else if(v==='fav')favShell()}else go(v)},
 stat(v){if(v==='f'){openFilter();return}const i=v.indexOf(':');clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];go('dir')},
 bar(v,el){clearF();S.f[el.dataset.k]=[v];go('dir')},
 chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=40;clearFc();dirList()},
 qx(){S.q='';$('#q').value='';S.lim=40;clearFc();dirList()},more(){S.lim+=40;dirList()},dirsort(v){S.dirSort=v;S.lim=40;dirShell()},
 fmodal:()=>openFilter(),fsect(v){S.fp={mode:'pick',key:v};renderFilter()},fback(){S.fp={mode:'sections',key:null};renderFilter()},fsort(v){S.sortF[S.fp.key]=v;renderFilter()},
 fclearsec(){S.f[S.fp.key]=[];S.lim=40;clearFc();renderFilter()},
 fpick(v){const a=S.f[S.fp.key],i=a.findIndex(x=>norm(x)===norm(v));i>=0?a.splice(i,1):a.push(v);S.lim=40;clearFc();renderFilter()},
 fclr(){clearF();renderFilter()},fdone(){closeM();if(S.tab!=='dir'){S.tab='';go('dir')}else dirList()},
 xsort(v){S.exp.sort=v;explorer()},xt:v=>{S.exp={t:v,d:'',s:'',q:'',sort:S.exp.sort};explorer()},xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';explorer()},xs:v=>{S.exp.s=v;S.exp.q='';explorer()},qxexp(){S.exp.q='';explorer()},
 xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:'',sort:x.sort}:v==='t'?{...x,d:'',s:'',q:''}:v==='d'?{...x,s:'',q:''}:x;explorer()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}else if(e.target.id==='md')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v)});
const setOff=o=>$('#off').classList.toggle('on',o);addEventListener('online',()=>setOff(false));addEventListener('offline',()=>setOff(true));if(!navigator.onLine)setOff(true);

(async()=>{
 try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
 await loadDB();await loadVL();S.last=Date.now();go('home');busy(false);topbar();
 const m=location.hash.match(/^#p=(.+)$/);if(m)setTimeout(()=>{const r=byId(m[1]);r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
