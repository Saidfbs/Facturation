<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Réseau Industriel — Maroc</title>
<meta name="theme-color" content="#0078D7">
<meta name="description" content="نربط الموردين والشركات في مكان واحد">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== Réseau Industriel — Windows 10 (Fluent) Design ===== */
:root{
  --pri:#0078D7;--pri2:#005A9E;--pri3:#429CE3;--acc:#FFB900;--ink:#1F1F1F;
  --bg:#F0F0F0;--sf:#fff;--sf2:#F3F3F3;--sf3:#E6E6E6;--bd:#DCDCDC;
  --tx:#1A1A1A;--tx2:#5A5A5A;--tx3:#8A8A8A;
  --ok:#107C10;--bad:#C42B1C;--teal:#00B294;--vio:#8764B8;--wa:#128C7E;--fb:#1877F2;
  --sh:0 1.6px 3.6px rgba(0,0,0,.13),0 .3px .9px rgba(0,0,0,.1);--sh2:0 6.4px 14.4px rgba(0,0,0,.18),0 1.2px 3.6px rgba(0,0,0,.12);
  --r:2px;--ff:'Segoe UI','IBM Plex Sans Arabic',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:light;
}
[data-theme=dark]{--bg:#202020;--sf:#2B2B2B;--sf2:#333;--sf3:#3D3D3D;--bd:#454545;--tx:#F2F2F2;--tx2:#B5B5B5;--tx3:#868686;--pri3:#4CC2FF;--sh:0 1.6px 3.6px rgba(0,0,0,.4);--sh2:0 8px 16px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font:14px/1.6 var(--ff);color:var(--tx);min-height:100vh;background:var(--bg)}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--tx);outline-offset:1px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--tx3);opacity:.5}

/* Title bar */
header{position:fixed;inset:0 0 auto;z-index:30;padding-top:var(--st);background:var(--pri);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;background:#fff;color:var(--pri);display:grid;place-items:center;flex:none;font-size:18px}
.brand b{display:block;font-size:15px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;opacity:.85;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:2px}
.ib{width:40px;height:40px;background:transparent;color:#fff;display:inline-grid;place-items:center;position:relative;transition:background .12s;flex:none;font-size:15px}
.ib:hover{background:rgba(255,255,255,.18)}.ib:active{background:rgba(255,255,255,.3)}
main{max-width:1100px;margin:0 auto;padding:calc(68px + var(--st)) 12px calc(86px + var(--sb))}
.tab{display:none}.tab.on{display:block;animation:fu .22s}@keyframes fu{from{opacity:0;transform:translateY(8px)}}

/* Hero */
.hero{padding:28px 22px;background:linear-gradient(120deg,#0063B1,#0078D7 60%,#2B88D8);color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero::after{content:"\f275";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset-inline-end:-6px;bottom:-34px;font-size:150px;opacity:.12}
.hero>*{position:relative}
.hero span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.2);padding:2px 10px;margin-bottom:10px}
.hero h2{font-size:24px;font-weight:600;line-height:1.3}.hero p{opacity:.9;font-size:13.5px;margin-top:6px;max-width:520px}
.hero .bt{margin-top:16px;background:#fff;color:var(--pri2);border-color:#fff}.hero .bt:hover{background:#E8F2FB}

/* Section heads */
.sh{display:flex;align-items:center;gap:10px;margin:26px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.sh i{width:32px;height:32px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:13px}
.sh b{flex:1;font-size:16px;font-weight:600}.sh small{display:block;color:var(--tx2);font-size:12px;font-weight:400}
.sh em{font-style:normal;background:var(--pri);color:#fff;font-weight:600;font-size:12px;padding:1px 10px;min-width:28px;text-align:center}

/* Live tiles */
.g4{display:grid;gap:6px;grid-template-columns:repeat(2,1fr)}@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{background:var(--pri);color:#fff;padding:12px 14px;min-height:96px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:start;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden;box-shadow:var(--sh)}
.sc:hover{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),var(--sh)}.sc:active{transform:scale(.97)}
.g4 .sc:nth-child(4n+2){background:#00826F}.g4 .sc:nth-child(4n+3){background:#6B4FA0}.g4 .sc:nth-child(4n){background:#CA5010}
.sc i{font-size:22px;opacity:.95}.sc b{font-size:28px;font-weight:600;line-height:1;font-family:var(--fm)}.sc span{font-size:12.5px;font-weight:500;opacity:.95}
.seg{display:flex;height:10px;gap:2px;margin-bottom:8px;background:var(--sf3)}.seg i{display:block}
.cols{display:grid;gap:10px}@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.pn{background:var(--sf);border:1px solid var(--bd);padding:14px;box-shadow:var(--sh)}
.pn>b{display:block;font-size:13px;color:var(--tx2);margin-bottom:8px;font-weight:600}
.sl{max-height:280px;overflow-y:auto}
.bar{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:36px;padding:0 10px;margin-top:4px;background:var(--sf2);overflow:hidden;font-weight:500;font-size:13px;border-inline-start:3px solid var(--pri)}
.bar:hover{background:var(--sf3)}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:rgba(0,120,215,.2)}.bar span,.bar b{position:relative}
.bar b{font-family:var(--fm);font-size:12px;color:var(--pri)}

/* Search / filters */
.sr{display:flex;align-items:center;gap:8px;height:46px;padding:0 4px 0 12px;background:var(--sf);border:2px solid var(--bd);box-shadow:var(--sh)}
.sr:hover{border-color:var(--tx3)}.sr:focus-within{border-color:var(--pri)}.sr>i{color:var(--tx3)}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0}
.sr .x{width:32px;height:32px;color:var(--tx3)}.sr .x:hover{background:var(--sf3)}
.fbtn{width:38px;height:38px;background:var(--pri);color:#fff;display:grid;place-items:center;position:relative}.fbtn:hover{background:var(--pri2)}
.fbtn.has{background:var(--pri2)}
.bub{position:absolute;top:-6px;inset-inline-end:-6px;min-width:18px;height:18px;background:var(--acc);color:#000;font-size:11px;font-weight:700;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 12px;background:var(--sf);color:var(--pri);font-weight:600;font-size:12.5px;border:1px solid var(--pri)}
.chip button{width:22px;height:22px;color:var(--pri);font-size:10px}.chip button:hover{background:var(--pri);color:#fff}
.inf{color:var(--tx2);font-size:12.5px;margin:12px 4px 8px;font-weight:500}
.pill{display:flex;margin:12px 0;background:var(--sf);border:1px solid var(--bd)}
.pill button{flex:1;height:38px;color:var(--tx2);font-weight:500;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:3px solid transparent}
.pill button:hover{background:var(--sf2)}.pill button.on{color:var(--pri);border-bottom-color:var(--pri);background:rgba(0,120,215,.08);font-weight:600}

/* Cards */
.ls{display:grid;gap:8px}@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:12px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer;transition:border-color .12s,background .12s;position:relative;border-inline-start:4px solid var(--pri)}
.card:hover{border-color:var(--pri3);background:var(--sf2)}.card:active{transform:scale(.995)}
.card.exp{border-inline-start-color:var(--teal)}
.card.fv{background:linear-gradient(90deg,rgba(255,185,0,.12),transparent)}
.card.mine{background:rgba(0,120,215,.1)}
.av{width:52px;height:52px;color:#fff;display:grid;place-items:center;font-weight:600;font-size:18px;flex:none;font-family:var(--fm)}
.av.four{background:var(--pri)}.av.exp{background:#00826F}.av.mine{background:#107C10}
.cm{min-width:0;display:flex;flex-direction:column;gap:4px}
.ti{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ti i{color:var(--pri);font-size:12px}
.ir{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--tx2)}.ir i{color:var(--pri);font-size:11px;margin-inline-end:4px;width:12px;text-align:center}
.tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tg{font-size:11px;font-weight:600;padding:1px 8px;background:var(--sf3);color:var(--tx2);display:inline-flex;align-items:center;gap:4px}
.tg.four{background:rgba(0,120,215,.14);color:var(--pri)}.tg.exp{background:rgba(0,178,148,.16);color:#00826F}
[data-theme=dark] .tg.exp{color:#4DD9BF}
.tg.me{background:var(--pri);color:#fff}.tg.v{background:#DFF6DD;color:var(--ok)}
.tg.r{background:rgba(255,185,0,.2);color:#8A5A00}.tg.r i{color:#F5A400}[data-theme=dark] .tg.r{color:#FFD257}
.tg.vw i{color:var(--pri)}
.ca{display:grid;grid-template-columns:repeat(2,32px);gap:4px;align-self:start}
.ca button,.ca a{width:32px;height:32px;background:var(--sf2);color:var(--tx2);display:grid;place-items:center;font-size:13px;transition:.12s}
.ca button:hover,.ca a:hover{background:var(--pri);color:#fff}
.ca .on{color:#E8A200;background:rgba(255,185,0,.18)}.ca .wa{color:var(--wa)}.ca .pdf{color:var(--bad)}
.ca .wa:hover,.ca .pdf:hover{color:#fff}.ca .wa:hover{background:var(--wa)}.ca .pdf:hover{background:var(--bad)}
.chip2{display:flex;align-items:center;gap:12px;padding:10px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer;width:100%;text-align:start;margin-bottom:6px;border-inline-start:4px solid var(--acc)}
.chip2:hover{background:var(--sf2);border-color:var(--pri3)}
.chip2 .av{width:40px;height:40px;font-size:15px}.chip2 .bd{flex:1;min-width:0}
.chip2 b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip2 small{color:var(--tx2);font-size:12px}
.em{text-align:center;padding:40px 16px;border:2px dashed var(--bd);color:var(--tx2);background:var(--sf);grid-column:1/-1}
.em i{font-size:30px;display:block;margin-bottom:8px;color:var(--tx3)}.em b{display:block;color:var(--tx);font-size:16px}

/* Explorer */
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:12px 0}
.cr button{padding:5px 14px;background:var(--sf);border:1px solid var(--bd);font-weight:500;font-size:12.5px}.cr button:hover{background:var(--sf2)}
.cr button:last-child{background:var(--pri);color:#fff;border-color:var(--pri)}.cr i{font-size:9px;color:var(--tx3)}
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin-bottom:6px;background:var(--sf);border:1px solid var(--bd);border-inline-start:4px solid var(--pri);text-align:start;font-weight:500;box-shadow:var(--sh)}
.rw:hover{background:var(--sf2);border-color:var(--pri3);border-inline-start-color:var(--pri)}
.rw>i:first-child{width:40px;height:40px;background:var(--pri);color:#fff;display:grid;place-items:center}
.rw span{flex:1}.rw em{font-style:normal;font-family:var(--fm);background:var(--sf3);padding:1px 12px;font-size:13px;font-weight:700}.rw>i:last-child{font-size:10px;color:var(--tx3)}

/* Buttons */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 22px;font-weight:600;background:var(--pri);color:#fff;border:2px solid var(--pri);transition:.12s}
.bt:hover{background:var(--pri2);border-color:var(--pri2)}.bt:active{transform:scale(.98)}.bt:disabled{opacity:.45;pointer-events:none}
.bt.g{background:var(--sf3);color:var(--tx);border-color:var(--sf3)}.bt.g:hover{border-color:var(--tx3)}.bt.k{background:var(--ink);border-color:var(--ink)}.bt.d{background:var(--bad);border-color:var(--bad)}.bt.full{width:100%}

/* Modal (content dialog) */
#md{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
#md.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:calc(100vh - 28px);overflow-y:auto;background:var(--sf);padding:24px 20px 20px;box-shadow:var(--sh2);border:1px solid var(--bd);border-top:3px solid var(--pri);animation:mi .2s;position:relative;margin:auto}
@keyframes mi{from{transform:translateY(16px) scale(.98);opacity:0}}
.sheet h2{font-size:20px;font-weight:600;margin-bottom:4px}.lead{color:var(--tx2);font-size:13px;margin-bottom:14px}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.ac .full{grid-column:1/-1}
.fs{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;text-align:start;background:var(--sf2);margin-bottom:4px;border-inline-start:3px solid transparent}
.fs:hover{background:var(--sf3)}.fs.on{background:rgba(0,120,215,.12);border-inline-start-color:var(--pri)}
.fs .ic{width:38px;height:38px;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.fs .nm{flex:1;font-weight:500;word-break:break-word}.fs .val{color:var(--pri);font-size:12px;max-width:55%;text-align:end}
.fs .n{font-family:var(--fm);background:var(--sf3);padding:0 8px;font-size:12.5px}.fs.on .n{background:var(--pri);color:#fff}
.fs .box{width:20px;height:20px;border:2px solid var(--tx2);display:grid;place-items:center;color:transparent;font-size:10px;flex:none}.fs.on .box{background:var(--pri);border-color:var(--pri);color:#fff}
.fs.clr{color:var(--bad);justify-content:center}
.fb{color:var(--pri);font-weight:600;padding:6px 10px;margin-bottom:8px}.fb:hover{background:var(--sf2)}
.ff{position:sticky;bottom:-20px;margin:16px -20px -20px;padding:12px 20px;background:var(--sf2);border-top:1px solid var(--bd);display:flex;gap:8px}.ff .bt{flex:1}
.cc{font-family:var(--fm);background:rgba(0,0,0,.2);padding:0 8px}

/* Profile */
.ph{margin:-24px -20px 0;padding:30px 20px 18px;text-align:center;color:#fff;background:linear-gradient(120deg,#0063B1,#0078D7);position:relative}
.pl{width:72px;height:72px;margin:0 auto 10px;background:#fff;color:var(--pri);display:grid;place-items:center;font-size:28px}
.pn2{font-size:20px;font-weight:600}.ps{font-size:12.5px;opacity:.85}.ph .tags{justify-content:center;margin-top:10px}.ph .tg{background:rgba(255,255,255,.2);color:#fff}.ph .tg.r i{color:#FFD257}.ph .tg.r{color:#fff}
.pa{display:flex;gap:6px;justify-content:center;margin:16px 0 6px}
.pa .ib{width:44px;height:44px;background:var(--sf2);color:var(--tx2)}.pa .ib:hover{background:var(--pri);color:#fff}.pa .wa{background:var(--wa);color:#fff}.pa .pdf{color:var(--bad)}.pa .pdf:hover{background:var(--bad);color:#fff}
.rb{margin:12px 0;padding:12px;background:var(--sf2);border-inline-start:4px solid var(--acc);text-align:center}
.rb small{display:block;color:var(--tx2);font-size:12px;margin-bottom:4px}
.rb .avg{font-size:13px;font-weight:600;margin-bottom:4px}.rb .avg i{color:#F5A400}
.stars{display:flex;justify-content:center;gap:2px;direction:ltr}
.stars button{width:42px;height:42px;font-size:26px;color:var(--tx3);transition:.1s}.stars button.on{color:#F5A400}.stars button:hover{transform:scale(1.15);color:#F5A400}
.vr{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.vr:last-child{border:0}
.vr>i,.vr>a{width:40px;height:40px;background:var(--sf2);color:var(--pri);display:grid;place-items:center;flex:none}
.vr>a:hover{background:var(--pri);color:#fff}
.vr small{display:block;color:var(--tx3);font-size:11.5px}.vr b{overflow-wrap:anywhere;font-weight:500}

/* About */
.ah{text-align:center;padding:30px 20px;color:#fff;background:linear-gradient(120deg,#0063B1,#0078D7);margin-bottom:8px;box-shadow:var(--sh)}
.ah .bg{width:68px;height:68px;background:#fff;color:var(--pri);display:grid;place-items:center;margin:0 auto 10px;font-size:28px}
.ah h2{font-size:18px;font-weight:600;letter-spacing:.03em}.ah p{font-size:13px;opacity:.9}
.as{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.as div{text-align:center;padding:12px 4px;background:var(--sf);border-top:3px solid var(--pri);box-shadow:var(--sh)}.as b{display:block;font-family:var(--fm);font-size:22px;color:var(--pri)}.as span{font-size:12px;color:var(--tx2)}
.lk{display:flex;align-items:center;gap:12px;padding:10px;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px;box-shadow:var(--sh)}
.lk .li{width:44px;height:44px;display:grid;place-items:center;color:#fff;font-size:18px}.lk.fb .li{background:var(--fb)}.lk.wa .li{background:var(--wa)}
.lk .bd{flex:1;min-width:0}.lk b{display:block;font-size:14px;font-weight:600}.lk small{color:var(--tx2)}
.lk .a{display:flex;gap:4px}.lk .a a,.lk .a button{width:36px;height:36px;display:grid;place-items:center;background:var(--sf2)}
.lk .a a:hover,.lk .a button:hover{background:var(--pri);color:#fff}
.cho{display:flex;align-items:center;gap:12px;padding:10px;background:var(--sf2);margin-bottom:6px;width:100%;text-align:start;border-inline-start:3px solid var(--pri)}
.cho .li{width:44px;height:44px;display:grid;place-items:center;color:#fff;background:var(--pri);flex:none}.cho.s .li{background:#00826F}
.cho div{flex:1;min-width:0}.cho b{display:block;font-weight:600}.cho small{color:var(--tx2)}.cho .a{display:flex;gap:4px;flex:none}.cho .a a,.cho .a button{width:38px;height:38px;display:grid;place-items:center;background:var(--sf3)}
.cho .a a{background:var(--pri);color:#fff}.cho .a a:hover,.cho .a button:hover{background:var(--pri2);color:#fff}

/* Taskbar nav */
#bn{position:fixed;inset-inline:0;bottom:0;z-index:29;display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px var(--sb);background:rgba(31,31,31,.96);backdrop-filter:blur(20px);box-shadow:0 -2px 8px rgba(0,0,0,.25)}
.bi{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:#B8B8B8;position:relative;transition:background .12s}
.bi i{font-size:18px}.bi:hover{background:rgba(255,255,255,.1)}.bi.on{color:#fff;background:rgba(255,255,255,.12)}
.bi.on::after{content:"";position:absolute;bottom:0;inset-inline:22%;height:3px;background:var(--pri3)}.bi.on i{color:var(--pri3)}
.fvb{position:absolute;top:5px;inset-inline-end:calc(50% - 22px);min-width:16px;height:16px;background:var(--acc);color:#000;font-weight:700;font-size:10px;display:grid;place-items:center}

/* Toast / loader / offline */
#ts{position:fixed;inset-inline:0;bottom:calc(72px + var(--sb));margin:auto;width:max-content;max-width:calc(100% - 32px);z-index:90;background:#2B2B2B;color:#fff;padding:10px 18px;border-inline-start:4px solid var(--pri3);font-weight:500;font-size:13px;display:flex;gap:12px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;box-shadow:var(--sh2)}
#ts.on{opacity:1;transform:none;pointer-events:auto}#ts button{color:var(--pri3);font-weight:700}
#ld{position:fixed;inset:0;z-index:99;background:var(--pri);display:none;place-items:center}#ld.on{display:grid}

function pdfHtml(r){const p=fmtPhone(r.phone),w=url(r.web),t=getRate(r.id),rows=[];
 if(shown(r.domaine))rows.push(['fa-industry','القطاع',r.domaine]);if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',r.specialite]);if(r.ville)rows.push(['fa-location-dot','المدينة',r.ville]);if(p)rows.push(['fa-phone','الهاتف',p]);if(r.email)rows.push(['fa-envelope','البريد',r.email]);if(w)rows.push(['fa-globe','الموقع',r.web]);if(t.n)rows.push(['fa-star','التقييم',`${t.avg.toFixed(1)} / 5  (${t.n})`]);
 const b=baseUrl(),qr=b?`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(b+'#p='+r.id)}&margin=0" crossorigin="anonymous" alt="QR">`:'';
 return`<div class="pc" data-root><div class="pl2"><div class="lg"><i class="fa-solid ${domIcon(r.domaine)}"></i></div><div class="nm">${esc(r.name)}</div><div class="sb">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div></div><div class="pr">${rows.map(([i,k,v])=>`<div class="prw"><div class="ic"><i class="fa-solid ${i}"></i></div><div><div class="k">${k}</div><div class="v">${esc(v)}</div></div></div>`).join('')}</div><div class="pft"><b>RÉSEAU INDUSTRIEL</b>${qr}</div></div>`}
async function makePDF(id){const r=byId(id);if(!r)return;busy(true);let h=null;
 try{await loadPdf();h=document.createElement('div');h.className='pdf-stage';h.innerHTML=pdfHtml(r);document.body.appendChild(h);try{await document.fonts?.ready}catch{}await new Promise(x=>setTimeout(x,700));
  const cv=await html2canvas(h.querySelector('[data-root]'),{scale:2,backgroundColor:'#F0F0F0',useCORS:true,logging:false}),{jsPDF}=window.jspdf,W=200,H=W*cv.height/cv.width;
  const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[W,H]});pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);pdf.save(`Reseau-${r.name.replace(/\s+/g,'_')}.pdf`);toast('تم توليد بطاقة PDF')}
 catch(e){toast(e.message||'خطأ في توليد PDF')}finally{h?.remove();busy(false)}}

/* ---------- Actions ---------- */
const linkItem=(l,s,u,cls,ic)=>`<div class="cho ${cls}"><div class="li"><i class="fa-solid ${ic}"></i></div><div><b>${esc(l)}</b><small>${esc(s)}</small></div><div class="a"><a href="${u}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i></a><button data-a="shrLink" data-url="${esc(u)}" data-name="${esc(l)}"><i class="fa-solid fa-share-nodes"></i></button></div></div>`;
const A={
 theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('cp-theme',d)}catch{}topbar();toast(d==='dark'?'الوضع الداكن':'الوضع الفاتح')},
 pdf:makePDF,cls:closeM,open(id){profile(id)},shr:share,fav:toggleFav,shrLink:shareLink,rate,
 confirmOk(){const cb=S.cb;S.cb=null;closeM();cb&&cb()},
 openForms(){openM(`<h2>نماذج الإدخال</h2><p class="lead">اختر نوع التسجيل — سيُفتح نموذج Google</p>${linkItem('تسجيل خبير','أدخل بياناتك كخبير',FORM_E,'','fa-user-tie')}${linkItem('تسجيل مورّد','أدخل بياناتك كمورّد',FORM_F,'','fa-truck-field')}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
 openSheets(){openM(`<h2>فتح الأوراق</h2><p class="lead">اختر الورقة لعرضها في Google Sheets</p>${linkItem('ورقة الخبراء','عرض جدول الخبراء',SHEET_E,'s','fa-table')}${linkItem('ورقة الموردين','عرض جدول الموردين',SHEET_F,'s','fa-table')}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
 undo(){if(undoFn){undoFn();undoFn=null;$('#ts').classList.remove('on')}},
 tab(v){if(S.tab===v){window.scrollTo({top:0,behavior:'smooth'});if(v==='exp'){S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};explorer()}else if(v==='dir'){clearF();dirShell()}else if(v==='fav')favShell()}else go(v)},
 stat(v){if(v==='f'){openFilter();return}const i=v.indexOf(':');clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];go('dir')},
 bar(v,el){clearF();S.f[el.dataset.k]=[v];go('dir')},
 chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=40;clearFc();dirList()},
 qx(){S.q='';$('#q').value='';S.lim=40;clearFc();dirList()},more(){S.lim+=40;dirList()},dirsort(v){S.dirSort=v;S.lim=40;dirShell()},
 fmodal:()=>openFilter(),fsect(v){S.fp={mode:'pick',key:v};renderFilter()},fback(){S.fp={mode:'sections',key:null};renderFilter()},fsort(v){S.sortF[S.fp.key]=v;renderFilter()},
 fclearsec(){S.f[S.fp.key]=[];S.lim=40;clearFc();renderFilter()},
 fpick(v){const a=S.f[S.fp.key],i=a.findIndex(x=>norm(x)===norm(v));i>=0?a.splice(i,1):a.push(v);S.lim=40;clearFc();renderFilter()},
 fclr(){clearF();renderFilter()},fdone(){closeM();if(S.tab!=='dir'){S.tab='';go('dir')}else dirList()},
 xsort(v){S.exp.sort=v;explorer()},xt:v=>{S.exp={t:v,d:'',s:'',q:'',sort:S.exp.sort};explorer()},xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';explorer()},xs:v=>{S.exp.s=v;S.exp.q='';explorer()},qxexp(){S.exp.q='';explorer()},
 xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:'',sort:x.sort}:v==='t'?{...x,d:'',s:'',q:''}:v==='d'?{...x,s:'',q:''}:x;explorer()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}else if(e.target.id==='md')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v)});
const setOff=o=>$('#off').classList.toggle('on',o);addEventListener('online',()=>setOff(false));addEventListener('offline',()=>setOff(true));if(!navigator.onLine)setOff(true);

(async()=>{
 try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
 await loadDB();await loadVL();S.last=Date.now();go('home');busy(false);topbar();
 const m=location.hash.match(/^#p=(.+)$/);if(m)setTimeout(()=>{const r=byId(m[1]);r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
