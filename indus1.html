<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الشبكة الصناعية المغربية — Réseau Industriel</title>
<meta name="theme-color" content="#008069">
<meta name="description" content="دليل الشركات والخبراء الصناعيين في المغرب — نربط الموردين والشركات في مكان واحد">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ri-theme')||'light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ================= WhatsApp-Inspired Design System ================= */
:root{
  --g:#00A884;--g2:#008069;--g3:#D9FDD3;--gsoft:rgba(0,168,132,.13);
  --bg:#EFEAE2;--sf:#FFFFFF;--sf2:#F0F2F5;--bd:#E3DED4;
  --tx:#111B21;--tx2:#667781;--tx3:#98A5AE;
  --gold:#FFB300;--red:#EA0038;--sky:#2F80C0;--wa:#25D366;--fbm:#1877F2;
  --sh:0 1px 2px rgba(11,20,26,.07),0 1px 3px rgba(11,20,26,.06);
  --sh2:0 2px 10px rgba(11,20,26,.12);
  --r:16px;--rp:999px;
  --ff:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0B141A;--sf:#111B21;--sf2:#202C33;--bd:#2A3942;
  --tx:#E9EDEF;--tx2:#8696A0;--tx3:#667781;--gsoft:rgba(0,168,132,.2);
  --sh:0 1px 3px rgba(0,0,0,.45);--sh2:0 3px 14px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html,body{overflow-x:hidden}
body{
  font-family:var(--ff);font-size:14px;line-height:1.65;color:var(--tx);min-height:100vh;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 22% 28%,rgba(0,128,105,.07) 0 2px,transparent 3px),
    radial-gradient(circle at 72% 68%,rgba(0,168,132,.06) 0 2px,transparent 3px);
  background-size:88px 88px,132px 132px;background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}

/* ---------- Header ---------- */
header{position:fixed;inset:0 0 auto;z-index:30;background:var(--g2);padding-top:var(--st);box-shadow:0 1px 4px rgba(11,20,26,.2)}
[data-theme=dark] header{background:#202C33}
.hin{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:62px}
.logo{width:42px;height:42px;flex:none;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:19px}
.bt-txt{flex:1;min-width:0}
.bt-txt b{display:block;color:#fff;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-txt small{display:block;color:rgba(255,255,255,.75);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px;flex:none}
.ib{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:16px;transition:.15s}
.ib:hover{background:rgba(255,255,255,.28)}
main{max-width:1080px;margin:0 auto;padding:calc(74px + var(--st)) 12px calc(96px + var(--sb))}
.tab{display:none}
.tab.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* ---------- Generic ---------- */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--rp);font-weight:700;font-size:14px;background:var(--g);color:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.bt:active{transform:scale(.97)}
.bt.g{background:var(--sf2);color:var(--tx);box-shadow:none}
.bt.k{background:var(--g2);color:#fff}
.bt.d{background:var(--red);color:#fff}
.bt.full{width:100%}
.bt[disabled]{opacity:.45;pointer-events:none}
.inf{color:var(--tx2);font-size:12.5px;margin:10px 2px 8px;font-weight:600}
.sh{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.sh .shi{width:36px;height:36px;border-radius:50%;background:var(--gsoft);color:var(--g);display:grid;place-items:center;font-size:15px;flex:none}
.sh .sht{flex:1;min-width:0}
.sh .sht b{display:block;font-size:15px;line-height:1.25}
.sh .sht small{display:block;color:var(--tx2);font-size:11.5px;font-weight:500}
.sh .mini{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--rp);background:var(--sf2);color:var(--tx2);font-size:12px;font-weight:700;flex:none}
.sh .mini.del{background:rgba(234,0,56,.1);color:var(--red)}
.em{grid-column:1/-1;text-align:center;padding:44px 16px;border:2px dashed var(--bd);border-radius:var(--r);color:var(--tx2);background:var(--sf)}
.em i{font-size:30px;display:block;margin-bottom:10px;color:var(--tx3)}
.em b{display:block;color:var(--tx);font-size:15px}
.em p{font-size:12.5px;margin-top:4px}

/* ---------- Hero ---------- */
.hero{padding:24px 20px;border-radius:var(--r);color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh);
  background:linear-gradient(135deg,var(--g2) 0%,#00A884 100%);border:1px solid rgba(0,0,0,.06)}
.hero::after{content:"\f275";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset-inline-end:-14px;bottom:-34px;font-size:150px;opacity:.11;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .kick{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:var(--rp);margin-bottom:10px}
.hero h2{font-size:22px;line-height:1.35}
.hero p{font-size:13px;opacity:.9;margin-top:6px;max-width:520px}
.hero .bt{margin-top:16px;background:#fff;color:var(--g2)}

/* ---------- Stats ---------- */
.g4{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{background:var(--sf);border-radius:var(--r);padding:14px 8px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.sc:hover{box-shadow:var(--sh2)}
.sc i{width:38px;height:38px;border-radius:50%;background:var(--gsoft);color:var(--g);display:grid;place-items:center;font-size:15px}
.sc b{font-family:var(--fm);font-size:22px;line-height:1.1}
.sc span{color:var(--tx2);font-size:11.5px;font-weight:600}
.seg{display:flex;height:10px;border-radius:var(--rp);overflow:hidden;gap:3px;margin:4px 0 10px}
.seg i{display:block;border-radius:var(--rp)}

/* ---------- Bars ---------- */
.cols{display:grid;gap:12px}
@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.pn{background:var(--sf);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.pn>b{display:block;font-size:12px;color:var(--tx2);margin-bottom:8px;font-weight:700}
.bar{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:36px;padding:0 10px;margin-top:5px;border-radius:10px;background:var(--sf2);overflow:hidden;font-weight:600;font-size:13px}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--gsoft)}
.bar span,.bar b{position:relative}
.bar b{font-family:var(--fm);background:var(--sf);color:var(--g);border-radius:var(--rp);padding:0 9px;font-size:12px}

/* ---------- Search & chips ---------- */
.sr{display:flex;align-items:center;gap:8px;height:50px;padding:0 6px 0 16px;background:var(--sf);border-radius:var(--rp);box-shadow:var(--sh)}
.sr>i{color:var(--tx3)}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0}
.sr .fbtn{width:38px;height:38px;border-radius:50%;background:var(--sf2);color:var(--tx2);display:grid;place-items:center;position:relative;flex:none;transition:.15s}
.sr .fbtn.has{background:var(--g);color:#fff}
.bub{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;border-radius:var(--rp);background:var(--red);color:#fff;font-family:var(--fm);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:var(--rp);background:var(--gsoft);color:var(--g2);font-weight:700;font-size:12px}
[data-theme=dark] .chip{color:#7FE3C6}
.chip button{width:22px;height:22px;border-radius:50%;background:rgba(0,128,105,.16);color:var(--g2);font-size:9px;display:grid;place-items:center}
.pill{display:flex;gap:4px;padding:4px;background:var(--sf2);border-radius:var(--rp);margin:12px 0}
.pill button{flex:1;height:36px;border-radius:var(--rp);color:var(--tx2);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.pill button.on{background:var(--sf);color:var(--g);box-shadow:var(--sh)}

/* ---------- Cards ---------- */
.ls{display:grid;gap:10px}
@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:12px;background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer;transition:.15s;position:relative}
.card:hover{box-shadow:var(--sh2)}
.card.isfav{box-shadow:inset 0 0 0 2px rgba(255,179,0,.55),var(--sh)}
.av{width:52px;height:52px;border-radius:50%;color:#fff;display:grid;place-items:center;font-family:var(--fm);font-weight:700;font-size:17px;flex:none}
.cm{min-width:0;display:flex;flex-direction:column;gap:3px}
.ti{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tg{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:var(--rp);background:var(--sf2);color:var(--tx2)}
.tg.t-fournisseurs{background:var(--gsoft);color:var(--g2)}
[data-theme=dark] .tg.t-fournisseurs{color:#7FE3C6}
.tg.t-experts{background:rgba(47,128,192,.13);color:var(--sky)}
.tg.ok{background:rgba(255,179,0,.16);color:#B37F00}
[data-theme=dark] .tg.ok{color:var(--gold)}
.row2{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.rchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:var(--rp);background:rgba(255,179,0,.14);color:#B37F00;font-family:var(--fm);font-size:12px;font-weight:700;transition:.15s}
[data-theme=dark] .rchip{color:var(--gold);background:rgba(255,179,0,.13)}
.rchip:hover{background:rgba(255,179,0,.26)}
.rchip.new{background:var(--sf2);color:var(--tx2)}
.rchip .m{opacity:.75;font-size:11px}
.vchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:var(--rp);background:var(--sf2);color:var(--tx2);font-size:11.5px;font-weight:700}
.vchip b{font-family:var(--fm);color:var(--tx)}
.ca{display:grid;grid-template-columns:repeat(2,32px);gap:5px;align-self:start}
.ca button,.ca a{width:32px;height:32px;border-radius:50%;background:var(--sf2);color:var(--tx3);display:grid;place-items:center;font-size:12.5px;transition:.15s}
.ca button:hover,.ca a:hover{background:var(--gsoft);color:var(--g)}
.ca .on{color:var(--gold);background:rgba(255,179,0,.16)}
.ca .del{color:var(--red);background:rgba(234,0,56,.1)}
.ca .wa{color:var(--wa);background:rgba(37,211,102,.12)}
.ca .pdf{color:var(--red)}
.mini-card{display:flex;align-items:center;gap:10px;padding:10px;background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);width:100%;text-align:start;transition:.15s}
.mini-card:hover{box-shadow:var(--sh2)}
.mini-card .av{width:40px;height:40px;font-size:14px}
.mini-card .bd{flex:1;min-width:0}
.mini-card b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-card small{color:var(--tx2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mgrid{display:grid;gap:8px}
@media(min-width:560px){.mgrid{grid-template-columns:1fr 1fr}}

/* ---------- Explorer ---------- */
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:12px 0}
.cr button{padding:6px 14px;border-radius:var(--rp);background:var(--sf);box-shadow:var(--sh);font-weight:600;font-size:12.5px}
.cr button:last-child{background:var(--g);color:#fff}
.cr i{font-size:9px;color:var(--tx3)}
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:8px;border-radius:var(--r);background:var(--sf);box-shadow:var(--sh);text-align:start;font-weight:600;transition:.15s}
.rw:hover{box-shadow:var(--sh2)}
.rw>i:first-child{width:42px;height:42px;border-radius:50%;background:var(--gsoft);color:var(--g);display:grid;place-items:center;flex:none}
.rw span{flex:1}
.rw em{font-style:normal;font-family:var(--fm);background:var(--sf2);color:var(--tx2);border-radius:var(--rp);padding:1px 12px;font-size:12.5px}
.rw>i:last-child{font-size:11px;color:var(--tx3)}

/* ---------- Modal / Bottom Sheet ---------- */
#md{position:fixed;inset:0;z-index:60;background:rgba(11,20,26,.55);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center}
#md.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--sf);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + var(--sb));animation:up .26s cubic-bezier(.2,.8,.3,1);overscroll-behavior:contain}
.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:var(--rp);background:var(--bd);margin:2px auto 14px}
@keyframes up{from{transform:translateY(100%)}}
@media(min-width:640px){
  #md{align-items:center;padding:16px}
  .sheet{border-radius:var(--r);max-height:86vh;animation:pop .2s ease}
  .sheet::before{display:none}
  @keyframes pop{from{transform:scale(.96);opacity:0}}
}
.sheet h2{font-size:19px;line-height:1.3}
.lead{color:var(--tx2);font-size:13px;margin-top:4px;margin-bottom:14px}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.ac .full{grid-column:1/-1}
.cf{text-align:center;padding-top:6px}
.cfi{width:60px;height:60px;border-radius:50%;background:rgba(234,0,56,.1);color:var(--red);display:grid;place-items:center;font-size:26px;margin:0 auto 12px}

/* Stars */
.stars{display:flex;gap:10px;justify-content:center;direction:ltr;margin:18px 0 8px}
.stars .st{font-size:36px;color:var(--bd);transition:.12s}
.stars .st.on{color:var(--gold);transform:scale(1.05)}
.hint{text-align:center;color:var(--tx2);font-size:12.5px}

/* Filter rows */
.fs{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px;text-align:start;background:var(--sf2);margin-bottom:6px;transition:.15s}
.fs.on{background:var(--gsoft)}
.fs .ic{width:38px;height:38px;border-radius:50%;background:var(--sf);color:var(--g);display:grid;place-items:center;flex:none}
.fs.on .ic{background:var(--g);color:#fff}
.fs .nm{flex:1;font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.fs .n{font-family:var(--fm);background:var(--sf);padding:0 9px;border-radius:var(--rp);font-size:12px;color:var(--tx2)}
.fs.on .n{background:var(--g);color:#fff}
.fs .val{color:var(--g);font-size:11.5px;max-width:45%;text-align:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs .box{width:22px;height:22px;border-radius:50%;border:2px solid var(--tx3);display:grid;place-items:center;color:transparent;font-size:10px;flex:none}
.fs.on .box{background:var(--g);border-color:var(--g);color:#fff}
.fs.clr{background:rgba(234,0,56,.08);color:var(--red);justify-content:center;font-weight:700}
.fb{color:var(--g);font-weight:700;padding:6px 0;margin-bottom:6px;font-size:13px}
.ff{position:sticky;bottom:calc(-20px - var(--sb));margin:16px -18px calc(-20px - var(--sb));padding:12px 18px calc(12px + var(--sb));background:var(--sf);display:flex;gap:8px;border-top:1px solid var(--bd)}
.ff .bt{flex:1}
.cc{font-family:var(--fm)}

/* Profile */
.ph{margin:-10px -18px 0;padding:26px 18px 18px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--g2),#00A884)}
.pav{width:74px;height:74px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-family:var(--fm);font-size:24px;font-weight:700;color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
.ph h2{font-size:19px;line-height:1.3}
.ph p{font-size:12.5px;opacity:.85;margin-top:2px}
.ph .tags{justify-content:center;margin-top:10px}
.ph .tg{background:rgba(255,255,255,.18);color:#fff}
.pstats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.pstats>button,.pstats>div{background:var(--sf2);border-radius:14px;padding:10px;text-align:center}
.pstats b{display:block;font-family:var(--fm);font-size:19px;color:var(--g)}
.pstats span{font-size:11.5px;color:var(--tx2);font-weight:600}
.pa{display:flex;gap:8px;justify-content:center;margin:6px 0 14px;flex-wrap:wrap}
.pa .ib{width:44px;height:44px;background:var(--sf2);color:var(--tx2)}
.pa .ib.wa{background:var(--wa);color:#fff}
.pa .ib.pdf{background:rgba(234,0,56,.1);color:var(--red)}
.vr{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.vr:last-child{border:0}
.vr>i,.vr>a{width:40px;height:40px;border-radius:50%;background:var(--sf2);color:var(--g);display:grid;place-items:center;flex:none}
.vr small{display:block;color:var(--tx3);font-size:11px;font-weight:600}
.vr b{overflow-wrap:anywhere;font-weight:600;font-size:13.5px}

/* About */
.ah{text-align:center;padding:26px 18px;border-radius:var(--r);color:#fff;background:linear-gradient(135deg,var(--g2),#00A884);margin-bottom:12px;position:relative;overflow:hidden}
.ah::after{content:"\f0c0";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset-inline-end:-10px;bottom:-30px;font-size:130px;opacity:.1}
.ah .bg{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin:0 auto 10px;font-size:26px;position:relative;z-index:1}
.ah h2{font-size:17px;position:relative;z-index:1}
.ah p{font-size:12.5px;opacity:.88;position:relative;z-index:1}
.as{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.as{grid-template-columns:repeat(4,1fr)}}
.as div{text-align:center;padding:12px 6px;background:var(--sf);border-radius:var(--r);box-shadow:var(--sh)}
.as b{display:block;font-family:var(--fm);font-size:21px;color:var(--g)}
.as span{font-size:11.5px;color:var(--tx2);font-weight:600}
.lk{display:flex;align-items:center;gap:12px;padding:11px;background:var(--sf);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--sh)}
.lk .li{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:17px;flex:none}
.lk.fb .li{background:var(--fbm)}
.lk.wa .li{background:var(--wa)}
.lk .bd{flex:1;min-width:0}
.lk b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk small{color:var(--tx2);font-size:11.5px}
.lk .a{display:flex;gap:4px;flex:none}
.lk .a a,.lk .a button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sf2);color:var(--tx2)}

/* ---------- Bottom nav ---------- */

<script>
/* =========================================================================
   1) PWA BOOTSTRAP — أيقونة + Manifest + Service Worker (كلها ديناميكية)
   ========================================================================= */
(async function initPWA(){
  try{
    /* --- (أ) رسم الأيقونة عبر Canvas --- */
    function drawIcon(size){
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const x = c.getContext('2d');
      x.scale(size/512, size/512);

      // خلفية خضراء (هوية واتساب)
      x.fillStyle = '#008069';
      x.fillRect(0,0,512,512);

      // دائرة بيضاء
      x.fillStyle = '#FFFFFF';
      x.beginPath(); x.arc(256,256,172,0,Math.PI*2); x.fill();

      // ترس صناعي أخضر
      const cx=256, cy=256, R=122, r=92, teeth=8;
      x.fillStyle = '#00A884';
      x.beginPath();
      for(let i=0;i<teeth*2;i++){
        const a = (i/(teeth*2))*Math.PI*2 - Math.PI/2;
        const rad = (i%2===0) ? R : r;
        const px = cx + Math.cos(a)*rad, py = cy + Math.sin(a)*rad;
        i ? x.lineTo(px,py) : x.moveTo(px,py);
      }
      x.closePath(); x.fill();

      // قلب الترس
      x.fillStyle = '#008069';
      x.beginPath(); x.arc(cx,cy,44,0,Math.PI*2); x.fill();

      return c;
    }

    const c512 = drawIcon(512);
    const c192 = drawIcon(192);
    const data512 = c512.toDataURL('image/png');
    const data192 = c192.toDataURL('image/png');

    // Blob URL للأيقونة
    let iconBlobURL = data512;
    try{
      const blob = await new Promise(res => c512.toBlob(res, 'image/png'));
      if(blob) iconBlobURL = URL.createObjectURL(blob);
    }catch(e){ /* fallback إلى dataURL */ }

    /* --- (ب) Manifest ديناميكي --- */
    const manifest = {
      name: 'الشبكة الصناعية المغربية',
      short_name: 'الشبكة الصناعية',
      description: 'دليل الشركات والخبراء الصناعيين في المغرب',
      lang: 'ar', dir: 'rtl',
      start_url: '.', scope: '.',
      display: 'standalone', orientation: 'portrait',
      background_color: '#EFEAE2',
      theme_color: '#008069',
      icons: [
        { src: iconBlobURL, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: data512,     sizes: '512x512', type: 'image/png', purpose: 'maskable' },
        { src: data192,     sizes: '192x192', type: 'image/png', purpose: 'any' }
      ]
    };
    const mBlob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const mURL  = URL.createObjectURL(mBlob);
    const link  = document.createElement('link');
    link.rel = 'manifest';
    link.href = mURL;
    document.head.appendChild(link);

    // أيقونة التبويب أيضاً
    const fav = document.createElement('link');
    fav.rel = 'icon'; fav.href = data192;
    document.head.appendChild(fav);

    /* --- (ج) Service Worker ديناميكي --- */
    const swCode = [
      "self.addEventListener('install',e=>self.skipWaiting());",
      "self.addEventListener('activate',e=>self.clients.claim());",
      "self.addEventListener('fetch',e=>{});"
    ].join('');
    const swURL = URL.createObjectURL(new Blob([swCode], {type:'text/javascript'}));
    if('serviceWorker' in navigator){
      try{ await navigator.serviceWorker.register(swURL); }
      catch(err){ console.warn('[PWA] blob SW registration refused:', err.message); }
    }
  }catch(e){
    console.warn('[PWA] init failed', e);
  }
})();
</script>

    } else if(ch === ',' && !q){ out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
const clean = s => String(s || '').replace(/^["'\s]+|["'\s]+$/g,'').trim();

function parseCSV(text, type, cat){
  const lines = String(text || '').split(/\r?\n/).filter(l => l.trim());
  if(lines.length < 2) return [];
  const rows = [];
  for(let i=1;i<lines.length;i++){
    const c = splitCSV(lines[i]);
    if(c.length < 4) continue;
    const name = clean(c[1]);
    if(!name || name.length < 2 || name.length > 90 || /[<>]/.test(name)) continue;
    const phone = fmtPhone(clean(c[5]));
    const email = clean(c[6]).toLowerCase();
    rows.push({
      id: hashId(type + '|' + (email || norm(name) + '|' + phone)),
      name,
      domaine: clean(c[2]) || 'Autre',
      specialite: clean(c[3]) || 'Général',
      ville: clean(c[4]),
      phone, email,
      web: clean(c[7]),
      type, categorie: cat
    });
  }
  return rows;
}

async function fetchCSV(url, timeout=9000){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try{
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'cb=' + Date.now(), {
      signal: ctrl.signal, cache: 'no-store', redirect: 'follow'
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.text();
  } finally {
    clearTimeout(timer);
  }
}

async function loadDB(){
  try{
    const [a, b] = await Promise.all([
      fetchCSV(CSV_URLS.fournisseurs),
      fetchCSV(CSV_URLS.experts)
    ]);
    const rows = [
      ...parseCSV(a, 'fournisseurs', 'services'),
      ...parseCSV(b, 'experts', 'yad-amila')
    ];
    if(rows.length < 2) throw new Error('CSV فارغ أو غير صالح');

    /* إزالة التكرار */
    const map = new Map();
    rows.forEach(r => { if(!map.has(r.id)) map.set(r.id, r); });
    S.db = [...map.values()];
    S.src = 'csv';
    lsSet('ri-cache', { t: Date.now(), d: S.db });
  }catch(err){
    console.warn('[Data] CSV fetch failed →', err.message);
    const cache = lsGet('ri-cache', null);
    if(cache && Array.isArray(cache.d) && cache.d.length){
      S.db = cache.d;
      S.src = 'cache';
    }else{
      S.db = SEED_RAW.map(x => ({
        id: hashId(x.t + '|' + (x.e || norm(x.n) + '|' + x.p)),
        name: x.n, domaine: x.d, specialite: x.s, ville: x.v,
        phone: fmtPhone(x.p), email: x.e, web: x.w,
        type: x.t, categorie: x.c
      }));
      S.src = 'seed';
    }
  }

  S.idx = new Map(S.db.map(r => [r.id, r]));
  S.newM = S.db.slice(-4).reverse();
  S.last = Date.now();
}

/* --- Firebase: الزيارات --- */
async function loadVisits(){
  if(!S.fb) return;
  try{
    const snap = await S.fb.ref('visits').once('value');
    const v = snap.val() || {};
    S.visits = new Map(Object.entries(v).map(([k, n]) => [k, typeof n === 'number' ? n : (n && (n.count || n.nombre)) || 0]));
  }catch(e){ console.warn('[FB] visits', e.message); }
}

async function recordVisit(id){
  if(S.seen.has(id)) return;
  S.seen.add(id);
  S.visits.set(id, (S.visits.get(id) || 0) + 1);   // تحديث تفاؤلي
  if(!S.fb) return;
  try{
    await S.fb.ref('visits/' + id).transaction(n => (typeof n === 'number' ? n : 0) + 1);
  }catch(e){ console.warn('[FB] visit tx', e.message); }
}

/* --- Firebase: التقييمات --- */
async function loadRatings(){
  /* دمج التقييمات المحلية (fallback) أولاً */
  const local = lsGet('ri-ratings-local', {});
  Object.entries(local).forEach(([id, o]) => S.ratings.set(id, { sum:o.sum||0, count:o.count||0 }));

  if(!S.fb) return;
  try{
    const snap = await S.fb.ref('ratings').once('value');
    const v = snap.val() || {};
    Object.entries(v).forEach(([id, o]) => {
      S.ratings.set(id, { sum: Number(o.sum) || 0, count: Number(o.count) || 0 });
    });
  }catch(e){ console.warn('[FB] ratings', e.message); }
}

function ratingOf(id){
  const r = S.ratings.get(id);
  if(!r || !r.count) return { avg:0, count:0 };
  return { avg: r.sum / r.count, count: r.count };
}

function localRate(id, stars){
  const local = lsGet('ri-ratings-local', {});
  const cur = local[id] || { sum:0, count:0 };
  cur.sum += stars; cur.count += 1;
  local[id] = cur;
  lsSet('ri-ratings-local', local);
  S.ratings.set(id, { sum: cur.sum, count: cur.count });
}

async function submitRating(id, stars){
  if(!(stars >= 1 && stars <= 5)) return;
  if(S.myRatings[id]){ toast('لقد قيّمت هذه الشركة مسبقاً'); return; }

  let ok = false;

  if(S.fb){
    try{
      const res = await S.fb.ref('ratings/' + id).transaction(cur => {
        cur = cur || {};
        const users = cur.users || {};
        if(users[S.deviceId]) return;          // إلغاء المعاملة (منع التكرار)
        users[S.deviceId] = { v: stars, t: Date.now() };
        cur.users = users;
        cur.sum = (Number(cur.sum) || 0) + stars;
        cur.count = (Number(cur.count) || 0) + 1;
        return cur;
      });

      if(!res.committed){
        toast('سبق أن قيّمت هذه الشركة من هذا الجهاز');
        S.myRatings[id] = -1;
        lsSet('ri-my', S.myRatings);
        return;
      }
      const val = res.snapshot.val() || {};
      S.ratings.set(id, { sum: Number(val.sum) || stars, count: Number(val.count) || 1 });
      ok = true;
    }catch(e){
      console.warn('[FB] rating tx', e.message);
    }
  }

  if(!ok) localRate(id, stars);   // حفظ محلي عند فشل الشبكة

  S.myRatings[id] = stars;
  lsSet('ri-my', S.myRatings);
  toast('شكراً لك! تم تسجيل تقييمك ★');
  refresh();
}

function restoreState(){
  const st = lsGet('ri-state', null);

  if(st.f && typeof st.f === 'object'){
    Object.keys(S.f).forEach(k => { if(Array.isArray(st.f[k])) S.f[k] = st.f[k].map(String); });
  }
  if(typeof st.q === 'string') S.q = st.q;
  if(st.sort === 'name' || st.sort === 'visits') S.sort = st.sort;
  if(st.exp && typeof st.exp === 'object'){
    S.exp = {
      t: String(st.exp.t || ''), d: String(st.exp.d || ''),
      s: String(st.exp.s || ''), q: String(st.exp.q || ''),

    };

  if(['home','dir','fav','exp','about'].includes(st.tab)) S.tab = st.tab;
}

/* ==================== 2.6 الفلترة ==================== */
function matchRow(r, skipKey){
  for(const k in FKEY){
    if(k === skipKey) continue;
    const arr = S.f[k];
    if(arr.length && !arr.some(v => norm(r[FKEY[k]]) === norm(v))) return false;
  }
  if(!S.q) return true;
  return hit([r.name, r.domaine, r.specialite, r.ville, r.phone, r.email, TYPE_LBL[r.type], CAT_LBL[r.categorie]].join(' '), S.q);
}

const activeFilters = () => Object.keys(FKEY).reduce((n,k) => n + S.f[k].length, 0) + (S.q.trim() ? 1 : 0);

function clearFilters(){
  S.f = { type:[], cat:[], dom:[], spe:[], ville:[] };
  S.q = '';
  S.lim = 24;
}

function facet(k, by='count'){
  const m = new Map();
  S.db.filter(r => matchRow(r, k)).forEach(r => {
    const v = (r[FKEY[k]] || '').trim();
    if(v) m.set(v, (m.get(v) || 0) + 1);
  });
  const arr = [...m];
  return by === 'count'
    ? arr.sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ar'))
    : arr.sort((a,b) => a[0].localeCompare(b[0], 'ar'));
}

function sortedRows(){
  const arr = S.db.filter(r => matchRow(r));
  if(S.sort === 'visits'){
    arr.sort((a,b) => (S.visits.get(b.id)||0) - (S.visits.get(a.id)||0) || a.name.localeCompare(b.name,'ar'));
  }else{
    arr.sort((a,b) => a.name.localeCompare(b.name,'ar'));
  }
  return arr;
}

function expListHtml(){
  const { t, d, s, sort } = S.exp;
  const base = S.db.filter(r => (!t || r.type === t) && matchExp(r));

  const groupBy = (arr, key) => {

      : list.sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0],'ar'));
  };

  const row = (icon, name, n, action, value) => `
    <button class="rw" data-a="${action}" data-v="${esc(value)}">
      <i class="fa-solid ${icon}"></i>
      <span>${esc(name)}</span>
      <em>${n}</em>
      <i class="fa-solid fa-chevron-left"></i>
    </button>`;

  if(S.exp.q){
    return base.length
      ? `<div class="ls">${base.map(r => card(r)).join('')}</div>`
      : emptyBox('لا نتائج','جرّب كلمة أخرى','fa-magnifying-glass');
  }

  if(!t){
    return ['fournisseurs','experts'].map(k => ({
      k, n: (TYPE_LBL[k] + 'ون'), c: S.db.filter(r => r.type === k).length,
      i: k === 'experts' ? 'fa-user-tie' : 'fa-truck-field'
    })).sort((a,b) => sort === 'name' ? a.n.localeCompare(b.n,'ar') : b.c - a.c)
      .map(x => row(x.i, x.n, x.c, 'xt', x.k)).join('');
  }

  if(!d){
    return groupBy(base, 'domaine').map(g => row(domIcon(g[0]), g[0], g[1], 'xd', g[0])).join('');
  }

  if(!s){
    return groupBy(base.filter(r => r.domaine === d), 'specialite')
      .map(g => row('fa-screwdriver-wrench', g[0], g[1], 'xs', g[0])).join('');
  }

  const final = base.filter(r => r.domaine === d && r.specialite === s);
  return final.length
    ? `<div class="ls">${final.map(r => card(r)).join('')}</div>`
    : emptyBox('لا عناصر','','fa-folder-open');
}

/* ==================== 2.21 المشاركة ==================== */
const SEP = '──────────────';

async function shareCompany(id){
  const r = S.idx.get(id);
  if(!r) return;
  const p = fmtPhone(r.phone);
  const w = safeUrl(r.web);

  const lines = [`👤 ${r.name}`, SEP, `🏷️ النوع: ${TYPE_LBL[r.type] || r.type}`, `📂 التصنيف: ${CAT_LBL[r.categorie] || r.categorie}`];
  if(shown(r.domaine))    lines.push(`🏭 القطاع: ${r.domaine}`);
  if(shown(r.specialite)) lines.push(`🛠️ التخصص: ${r.specialite}`);
  if(r.ville)             lines.push(`📍 المدينة: ${r.ville}`);
  if(p)                   lines.push(`📞 الهاتف: ${p}`);
  if(r.email)             lines.push(`✉️ البريد: ${r.email}`);
  if(w)                   lines.push(`🌐 الموقع: ${w}`);

  const link = location.origin + location.pathname + '#p=' + encodeURIComponent(r.id);
  if(/^https?:/.test(link)) lines.push(SEP, `🔗 ${link}`);

  const text = lines.join('\n');

  if(navigator.share){
    try{ await navigator.share({ title: r.name, text }); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(text); toast('تم نسخ البطاقة'); }
  catch(e){ toast('تعذر النسخ'); }
  setTimeout(() => window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener'), 100);
}

async function shareLink(url, name){
  if(!/^https?:\/\//i.test(url)) return toast('رابط غير صالح');
  if(navigator.share){
    try{ await navigator.share({ title: name || 'مشاركة', text: name ? name + '\n' + url : url }); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(url); toast('تم نسخ الرابط'); }
  catch(e){ toast('تعذر النسخ'); }
}

/* ==================== 2.22 توليد PDF ==================== */
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function ensurePdfLibs(){
  const jobs = [];
  if(!window.html2canvas) jobs.push(loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'));
  if(!window.jspdf) jobs.push(loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'));
  await Promise.all(jobs);
}

function pdfMarkup(r){
  const p = fmtPhone(r.phone);
  const w = safeUrl(r.web);
  const rows = [];
  if(shown(r.domaine))    rows.push(['fa-industry','القطاع', r.domaine]);
  if(shown(r.specialite)) rows.push(['fa-screwdriver-wrench','التخصص', r.specialite]);
  if(r.ville)             rows.push(['fa-location-dot','المدينة', r.ville]);
  if(p)                   rows.push(['fa-phone','الهاتف', p]);
  if(r.email)             rows.push(['fa-envelope','البريد', r.email]);
  if(w)                   rows.push(['fa-globe','الموقع', r.web]);

  const direct = location.origin + location.pathname + '#p=' + encodeURIComponent(r.id);
  const qr = /^https?:/.test(direct)
    ? `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=${encodeURIComponent(direct)}" crossorigin="anonymous" alt="QR">`
    : '';

  return `<div class="pc" data-root>
    <div class="pl2">
      <div class="lg"><i class="fa-solid ${domIcon(r.domaine)}"></i></div>
      <div class="nm">${esc(r.name)}</div>
      <div class="sb">${esc([shown(r.domaine), r.ville].filter(Boolean).join(' · '))}</div>
    </div>
    <div class="pr">
      ${rows.map(([i,k,v]) => `
        <div class="prw">
          <div class="ic"><i class="fa-solid ${i}"></i></div>
          <div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>
        </div>`).join('')}
    </div>
    <div class="pft"><b>RÉSEAU INDUSTRIEL</b>${qr}</div>
  </div>`;
}

async function makePDF(id){
  const r = S.idx.get(id);
  if(!r) return;

  busy(true);
  let stage = null;
  try{
    await ensurePdfLibs();

    stage = document.createElement('div');
    stage.className = 'pdf-stage';
    stage.innerHTML = pdfMarkup(r);
    document.body.appendChild(stage);

    try{ await document.fonts.ready; }catch(e){}
    await new Promise(res => setTimeout(res, 600));

    const node = stage.querySelector('[data-root]');
    const canvas = await html2canvas(node, {
      scale: 2, backgroundColor: '#EFEAE2', useCORS: true, logging: false
    });

    const { jsPDF } = window.jspdf;
    const W = 200, H = W * canvas.height / canvas.width;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [W, H] });
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.94), 'JPEG', 0, 0, W, H);
    pdf.save('Reseau-' + r.name.replace(/[^\p{L}\p{N}]+/gu, '_') + '.pdf');

    toast('تم توليد بطاقة PDF');
  }catch(e){
    console.warn(e);
    toast('تعذر توليد PDF');
  }finally{
    if(stage) stage.remove();
    busy(false);
  }
}

/* ==================== 2.23 الإجراءات (Actions) ==================== */
const ACTIONS = {
  /* التنقل */
  tab(v){
    if(S.tab === v){ window.scrollTo({ top:0, behavior:'smooth' }); return; }
    go(v);
  },

  /* المظهر */
  theme(){
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try{ localStorage.setItem('ri-theme', next); }catch(e){}
    topbar();
    toast(next === 'dark' ? 'الوضع الداكن' : 'الوضع الفاتح');
  },

  /* النوافذ */
  cls(){ closeM(); },
  okc(){
    const fn = S.pending;
    S.pending = null;
    closeM();
    if(typeof fn === 'function') fn();
  },

  /* البطاقات */
  open(id){ profileView(id); },
  fav(id){ toggleFav(id); },
  shr(id){ shareCompany(id); },
  pdf(id){ makePDF(id); },
  shrlink(v, el){ shareLink(el.dataset.url, el.dataset.name); },

  delfav(id){
    const r = S.idx.get(id);
    askConfirm({
      title: 'حذف من المفضلة؟',
      message: `سيتم حذف «${r ? r.name : ''}» من قائمة المفضلة.`,
      okLabel: 'حذف',
      onConfirm(){
        S.fav = S.fav.filter(x => x !== id);
        lsSet('ri-fav', S.fav);
        favView(); topbar();
        toast('تم الحذف من المفضلة');
      }
    });
  },

  clearfav(){
    if(!S.fav.length) return toast('المفضلة فارغة');
    askConfirm({
      title: 'مسح كل المفضلة؟',
      message: `سيتم حذف ${S.fav.length} شركة من قائمة المفضلة نهائياً.`,
      okLabel: 'مسح الكل',
      onConfirm(){
        S.fav = [];
        lsSet('ri-fav', S.fav);
        favView(); topbar();
        toast('تم مسح المفضلة');
      }
    });
  },

  /* التقييم */
  rate(id){ openRate(id); },
  dorate(v, el){
    const id = el.dataset.id;
    closeM();
    submitRating(id, Number(v));
  },

  /* الدليل */
  sort(v){ S.sort = v; S.lim = 24; dirView(); saveState(); },
  more(){ S.lim += 24; dirList(); },
  qclear(){ S.q = ''; const q = $('#q'); if(q) q.value = ''; S.lim = 24; dirList(); saveState(); },
  chipx(v, el){
    const k = el.dataset.k;
    S.f[k] = S.f[k].filter(x => norm(x) !== norm(el.dataset.v));
    S.lim = 24;
    dirList(); saveState();
  },
  stat(v){
    if(v === 'filter'){ openFilter(); return; }
    const parts = v.split(':');
    clearFilters();
    if(parts[1] === 'type') S.f.type = [parts[2]];
    if(parts[1] === 'cat')  S.f.cat  = [parts[2]];
    go('dir');
  },
  bar(v, el){
    clearFilters();
    const k = el.dataset.k;
    if(k === 'domaine') S.f.dom = [v];
    if(k === 'ville')   S.f.ville = [v];
    go('dir');
  },

  /* الفلاتر */
  filter(){ openFilter(); },
  fsect(v){ S.fp = { mode:'pick', key:v }; renderFilter(); },
  fback(){ S.fp = { mode:'sections', key:null }; renderFilter(); },
  fsort(v){ S.fsort[S.fp.key] = v; renderFilter(); },
  fpick(v){
    const arr = S.f[S.fp.key];
    const i = arr.findIndex(x => norm(x) === norm(v));
    if(i >= 0) arr.splice(i, 1); else arr.push(v);
    S.lim = 24;
    renderFilter();
  },
  fclearsec(){ S.f[S.fp.key] = []; S.lim = 24; renderFilter(); },
  fclr(){ clearFilters(); renderFilter(); },
  fdone(){
    closeM();
    if(S.tab !== 'dir') go('dir'); else { dirList(); saveState(); }
  },

  /* المستكشف */
  xsort(v){ S.exp.sort = v; expView(); },
  xt(v){ S.exp = { t:v, d:'', s:'', q:'', sort:S.exp.sort }; expView(); saveState(); },
  xd(v){ S.exp.d = v; S.exp.s = ''; S.exp.q = ''; expView(); saveState(); },
  xs(v){ S.exp.s = v; S.exp.q = ''; expView(); saveState(); },
  xc(v){
    const cur = S.exp;
    if(v === '')      S.exp = { t:'', d:'', s:'', q:'', sort:cur.sort };
    else if(v === 't') S.exp = { ...cur, d:'', s:'', q:'' };
    else if(v === 'd') S.exp = { ...cur, s:'', q:'' };
    expView(); saveState();
  },
  xclear(){ S.exp.q = ''; expView(); saveState(); },

  /* النماذج والأوراق */
  forms(){
    const item = (label, sub, url, icon) => `
      <a class="lk" href="${esc(url)}" target="_blank" rel="noopener" style="text-decoration:none">
        <div class="li" style="background:var(--g)"><i class="fa-solid ${icon}"></i></div>
        <div class="bd"><b>${esc(label)}</b><small>${esc(sub)}</small></div>
        <div class="a"><span style="width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sf2)"><i class="fa-solid fa-arrow-up-right-from-square"></i></span></div>
      </a>`;
    openM(`
      <h2>نماذج التسجيل</h2>
      <p class="lead">اختر نوع التسجيل — سيُفتح نموذج Google في نافذة جديدة</p>
      ${item('تسجيل مورّد', 'أضف شركتك إلى الدليل', FORM_URLS.fournisseurs, 'fa-truck-field')}
      ${item('تسجيل خبير', 'أضف ملفك المهني', FORM_URLS.experts, 'fa-user-tie')}
      <div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`);
  }
};

/* ==================== 2.24 ربط الأحداث ==================== */
document.addEventListener('click', e => {
  /* تجاهل الروابط العادية */
  const anchor = e.target.closest('a[href]');
  if(anchor && !anchor.dataset.a) return;

  const el = e.target.closest('[data-a]');
  if(el){
    const fn = ACTIONS[el.dataset.a];
    if(fn){
      e.preventDefault();
      e.stopPropagation();
      fn(el.dataset.v, el);
      return;
    }
  }

  /* الإغلاق بالضغط على الخلفية */
  if(e.target.id === 'md') closeM();
});

/* إغلاق بمفتاح Escape + فتح البطاقة بالكيبورد */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeM();
  if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('card')){
    ACTIONS.open(e.target.dataset.v);
  }
});

/* تأثير النجوم عند المرور */
document.addEventListener('mouseover', e => {
  const st = e.target.closest && e.target.closest('.stars .st');
  if(!st) return;
  const wrap = st.parentElement;
  const idx = Array.from(wrap.children).indexOf(st);
  Array.from(wrap.children).forEach((b, i) => b.classList.toggle('on', i <= idx));
});
document.addEventListener('mouseout', e => {
  const wrap = e.target.closest && e.target.closest('.stars');
  if(!wrap) return;
  if(wrap.contains(e.relatedTarget)) return;
  const base = Number(wrap.dataset.base) || 0;
  Array.from(wrap.children).forEach((b, i) => b.classList.toggle('on', i < base));
});

/* حالة الاتصال */
const setOffline = on => $('#off').classList.toggle('on', !!on);
window.addEventListener('online',  () => { setOffline(false); toast('تم استعادة الاتصال'); });
window.addEventListener('offline', () => setOffline(true));
if(!navigator.onLine) setOffline(true);

/* ==================== 2.25 الإقلاع ==================== */
(async function boot(){
  busy(true);

  try{
    if(window.firebase){
      firebase.initializeApp(FB_CFG);
      S.fb = firebase.database();
    }
  }catch(e){ console.warn('[FB] init', e.message); }

  restoreState();

  await loadDB();
  await Promise.all([ loadRatings(), loadVisits() ]);

  S.last = Date.now();

  go(S.tab || 'home');
  topbar();
  busy(false);

  /* رابط مباشر لملف: #p=ID */
  const m = location.hash.match(/^#p=(.+)$/);
  if(m){
    const id = decodeURIComponent(m[1]);
    setTimeout(() => {
      if(S.idx.has(id)) profileView(id);
      else toast('الرابط غير صالح');
    }, 350);
  }
})();

})();
</script>
