function splitCSV(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const h=l[i];if(h==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(h===','&&!q){o.push(c);c=''}else c+=h}o.push(c);return o}
const parseCSV=(txt,type,cat)=>{const cl=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c=>cl(c[1])).map(c=>{const name=cl(c[1]),phone=fmtPhone(cl(c[5])),email=cl(c[6]).toLowerCase(),seed=type+'|'+(email||norm(name)+'|'+phone);let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;return{id:'p'+h.toString(36),name,domaine:cl(c[2])||'Autre',specialite:cl(c[3])||'Général',ville:cl(c[4]),phone,email,web:cl(c[7]),type,categorie:cat}})};
async function fetchCSV(){
 const g=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(u+'&cb='+Date.now(),{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(t)}};
 const[e,f]=await Promise.all([g(CSV_E),g(CSV_F)]),m=new Map();
 [...parseCSV(f,'fournisseurs','services'),...parseCSV(e,'experts','yad-amila')].forEach(r=>{if(!m.has(r.id))m.set(r.id,r)});return[...m.values()]}
const lastOf=db=>['fournisseurs','experts'].map(t=>db.filter(r=>r.type===t).pop()).filter(Boolean);
async function loadDB(){
 try{const d=await fetchCSV();if(d.length){S.db=d;S.src='csv';sv('cp-csv-cache',{t:Date.now(),d})}}catch(e){console.warn(e)}
 if(!S.db.length){const c=ls('cp-csv-cache',null);if(c&&c.d){S.db=c.d;S.src='cache'}}
 S.idx=new Map(S.db.map(r=>[r.id,r]));S.newM=lastOf(S.db)}
async function loadFB(){if(!S.fb)return;
 try{const[v,r]=await Promise.all([withTmo(S.fb.ref('visits').once('value')),withTmo(S.fb.ref('ratings').once('value'))]);
  S.vis=new Map(Object.entries(v.val()||{}));const o={};Object.entries(r.val()||{}).forEach(([k,x])=>o[k]={total:x.total||0,count:x.count||0});S.rat=new Map(Object.entries(o));
  sv('cp-vis',Object.fromEntries(S.vis));sv('cp-rat',o)}catch(e){console.warn('FB offline, using cache',e)}}
async function recordVisit(r){if(!S.fb)return;const k=pk(fmtPhone(r.phone));if(!k)return;
 try{const ref=S.fb.ref('visits/'+k),cur=(await withTmo(ref.once('value'))).val()||{},now=Date.now(),u={nom:r.name,telephone:fmtPhone(r.phone),nombre:(cur.nombre||cur.count||0)+1,derniereVisite:now,premiereVisite:cur.premiereVisite||now};
  await withTmo(ref.update(u));S.vis.set(k,u)}catch(e){const c=S.vis.get(k)||{nombre:0};S.vis.set(k,{...c,nombre:(c.nombre||0)+1})}
 sv('cp-vis',Object.fromEntries(S.vis))}
async function rate(id,n){const r=byId(id);if(!r)return;if(!S.fb)return toast('التقييم يتطلب اتصالاً');const k=keyOf(r);let dup=false;
 try{const res=await withTmo(S.fb.ref('ratings/'+k).transaction(c=>{c=c||{total:0,count:0,voters:{}};c.voters=c.voters||{};if(c.voters[dev]){dup=true;return}c.voters[dev]=n;c.total=(c.total||0)+n;c.count=(c.count||0)+1;return c}),10000);
  if(dup||!res.committed)return toast('لقد قمت بتقييم هذه الشركة من قبل');
  const v=res.snapshot.val();S.rat.set(k,{total:v.total,count:v.count});sv('cp-rat',Object.fromEntries(S.rat));toast('شكراً لتقييمك ⭐'+n);profile(id,true)}
 catch(e){toast('تعذر إرسال التقييم')}}

/* ===== Filtering ===== */
function match(r,skip){for(const k in FLD){if(k===skip)continue;const a=S.f[k];if(a.length&&!a.some(v=>norm(r[FLD[k]])===norm(v)))return false}return S.q?hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.q):true}
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0);
const clearF=()=>{S.f={type:[],cat:[],dom:[],ville:[]};S.q='';S.lim=40;save()};
const facet=k=>{const m=new Map();S.db.filter(r=>match(r,k)).forEach(r=>{const v=(r[FLD[k]]||'').trim();if(v&&!['Autre','Général'].includes(v))m.set(v,(m.get(v)||0)+1)});return[...m].sort((a,b)=>b[1]-a[1])};
const lbl=(k,v)=>k==='type'?TL[v]||v:k==='cat'?CL[v]||v:v;
const sorted=()=>{const a=S.db.filter(r=>match(r));a.sort(S.sort==='visits'?(x,y)=>vOf(y)-vOf(x)||x.name.localeCompare(y.name,'ar'):(x,y)=>x.name.localeCompare(y.name,'ar'));return a};

function pdfHtml(r){const p=fmtPhone(r.phone),w=url(r.web),rows=[['القطاع',shown(r.domaine)],['التخصص',shown(r.specialite)],['المدينة',r.ville],['الهاتف',p],['البريد',r.email],['الموقع',w?r.web:'']].filter(x=>x[1]),b=baseUrl()||location.href.split('#')[0];
 const qr=`<img crossorigin="anonymous" style="width:90px;height:90px;background:#fff;padding:4px;border-radius:8px" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=${encodeURIComponent(b+'#p='+r.id)}">`;
 return`<div data-root style="width:1000px;display:flex;direction:rtl;background:#EFEAE2;font-family:'IBM Plex Sans Arabic',sans-serif;color:#111B21;border-bottom:12px solid #00A884"><div style="flex:0 0 340px;background:#008069;color:#fff;padding:40px;text-align:center"><div style="width:110px;height:110px;border-radius:50%;background:#fff;color:#008069;font:700 40px 'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;margin:0 auto 18px">${esc(inits(r.name))}</div><div style="font-size:26px;font-weight:700">${esc(r.name)}</div><div style="opacity:.85;margin-top:6px">${TL[r.type]} · ${CL[r.categorie]}</div><div style="margin-top:14px">${esc(ratTxt(r))}</div></div><div style="flex:1;padding:30px;display:flex;flex-direction:column;gap:10px">${rows.map(([k,v])=>`<div style="background:#fff;border-radius:16px;padding:10px 18px"><div style="font-size:12px;color:#54656F;font-weight:700">${k}</div><div style="font-size:16px;font-weight:600;word-break:break-all">${esc(v)}</div></div>`).join('')}<div style="display:flex;justify-content:space-between;align-items:center;direction:ltr;margin-top:6px"><b style="letter-spacing:.12em">RÉSEAU INDUSTRIEL</b>${qr}</div></div></div>`}
async function makePDF(id){const r=byId(id);if(!r)return;busy(true);let h=null;
 try{await loadPdf();h=document.createElement('div');h.className='pdfs';h.innerHTML=pdfHtml(r);document.body.appendChild(h);try{await document.fonts?.ready}catch{}await new Promise(x=>setTimeout(x,700));
  const cv=await html2canvas(h.firstChild,{scale:2,backgroundColor:'#EFEAE2',useCORS:true,logging:false}),{jsPDF}=window.jspdf,W=200,H=W*cv.height/cv.width,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[W,H]});
  pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);pdf.save(`Reseau-${r.name.replace(/\s+/g,'_')}.pdf`);toast('تم توليد بطاقة PDF')}
 catch(e){toast(e.message||'خطأ في توليد PDF')}finally{h?.remove();busy(false)}}

/* ===== Actions ===== */
const lnk=(l,u,ic)=>`<div class="lk"><div class="li" style="background:var(--pri)"><i class="fa-solid ${ic}"></i></div><div><b>${esc(l)}</b></div><a href="${u}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i></a></div>`;
const A={
 theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('cp-theme',d)}catch{}topbar()},
 pdf:makePDF,cls:closeM,open:id=>profile(id),shr:share,fav:toggleFav,rate:(id,el)=>rate(id,+el.dataset.n),
 ok(){const f=cb;cb=null;closeM();f&&f()},
 favdel(id){const r=byId(id);askConfirm('حذف من المفضلة',`هل تريد حذف «${r?r.name:''}» من المفضلة؟`,'حذف',()=>{S.fav=S.fav.filter(x=>x!==id);sv('cp-fav',S.fav);toast('تم الحذف');topbar();favShell()})},
 favclr(){askConfirm('مسح كل المفضلة',`سيتم حذف ${S.fav.length} عنصر من المفضلة. هل أنت متأكد؟`,'مسح الكل',()=>{S.fav=[];sv('cp-fav',S.fav);toast('تم مسح المفضلة');topbar();favShell()})},
 forms(){openM(`<h2>نماذج الإدخال</h2><p class="lead">اختر نوع التسجيل</p>${lnk('تسجيل خبير',FORM_E,'fa-user-tie')}${lnk('تسجيل مورّد',FORM_F,'fa-truck-field')}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
 sheets(){openM(`<h2>فتح الأوراق</h2><p class="lead">عرض في Google Sheets</p>${lnk('ورقة الخبراء',SHEET_E,'fa-table')}${lnk('ورقة الموردين',SHEET_F,'fa-table')}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
 tab(v){if(S.tab===v){window.scrollTo({top:0,behavior:'smooth'});return}go(v)},
 stat(v){if(v==='f'){S.tab==='dir'||go('dir');renderFilter();$('#md').classList.add('on');document.body.style.overflow='hidden';return}const i=v.indexOf(':');clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];save();go('dir')},
 bar(v,el){clearF();S.f[el.dataset.k]=[v];save();go('dir')},
 chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(v));S.lim=40;save();dirList()},
 more(){S.lim+=40;dirList()},dirsort(v){S.sort=v;S.lim=40;save();dirShell()},
 fmodal(){renderFilter();$('#md').classList.add('on');document.body.style.overflow='hidden'},
 fpick(v,el){const a=S.f[el.dataset.k],i=a.findIndex(x=>norm(x)===norm(v));i>=0?a.splice(i,1):a.push(v);S.lim=40;save();renderFilter()},
 fclr(){clearF();renderFilter()},fdone(){closeM();S.tab==='dir'?dirShell():go('dir')},
 xt:v=>{S.exp={t:v,d:'',s:'',q:''};save();explorer()},xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';save();explorer()},xs:v=>{S.exp.s=v;S.exp.q='';save();explorer()},
 xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:''}:v==='t'?{...x,d:'',s:'',q:''}:v==='d'?{...x,s:'',q:''}:x;save();explorer()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}else if(e.target.id==='md')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.classList?.contains('cd'))A.open(e.target.dataset.v)});

/* ===== Boot ===== */
(async()=>{
 try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
 await loadDB();await loadFB();
 go(['home','dir','fav','exp','about'].includes(S.tab)?S.tab:'home');busy(false);
 const m=location.hash.match(/^#p=(.+)$/);if(m)setTimeout(()=>{const r=byId(m[1]);r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
</script>
</body>
