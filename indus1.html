<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Réseau Industriel — Maroc</title>
<meta name="theme-color" content="#F2F2F7">
<meta name="description" content="نربط الموردين والشركات في مكان واحد">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Réseau Ind">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== Réseau Industriel — iOS-inspired design system ===== */
:root{
  --blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--indigo:#5856D6;--teal:#30B0C7;--pink:#FF2D55;--purple:#AF52DE;--yellow:#FFCC00;
  --bg:#F2F2F7;--sf:#FFFFFF;--sf2:#F2F2F7;--sf3:#E5E5EA;--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --sep:rgba(60,60,67,.18);--tx:#000;--tx2:rgba(60,60,67,.6);--tx3:rgba(60,60,67,.3);
  --bar:rgba(249,249,249,.82);--ov:rgba(0,0,0,.4);--star:#FF9F0A;--fb:#1877F2;--wa:#25D366;
  --ff:-apple-system,BlinkMacSystemFont,'SF Pro Text','IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:light;
}
[data-theme=dark]{
  --blue:#0A84FF;--green:#30D158;--orange:#FF9F0A;--red:#FF453A;--indigo:#5E5CE6;--teal:#40C8E0;--pink:#FF375F;--purple:#BF5AF2;--yellow:#FFD60A;
  --bg:#000;--sf:#1C1C1E;--sf2:#2C2C2E;--sf3:#3A3A3C;--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);
  --sep:rgba(84,84,88,.5);--tx:#fff;--tx2:rgba(235,235,245,.6);--tx3:rgba(235,235,245,.3);--bar:rgba(30,30,30,.8);--ov:rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font:15px/1.5 var(--ff);color:var(--tx);background:var(--bg);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::-webkit-scrollbar{width:0;height:0}

/* Navigation bar (translucent) */
header{position:fixed;inset:0 0 auto;z-index:30;padding-top:var(--st);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--sep)}
.hin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:6px 14px;min-height:50px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,#5AC8FA,#007AFF);color:#fff;display:grid;place-items:center;flex:none;font-size:15px}
.brand b{display:block;font-size:16px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--tx2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:2px}
.ib{width:38px;height:38px;border-radius:50%;color:var(--blue);display:inline-grid;place-items:center;transition:background .15s,opacity .15s;flex:none;font-size:17px}
.ib:active{background:var(--fill)}
main{max-width:760px;margin:0 auto;padding:calc(62px + var(--st)) 16px calc(92px + var(--sb))}
.tab{display:none}.tab.on{display:block;animation:fu .22s ease-out}
@keyframes fu{from{opacity:0;transform:translateY(6px)}}
.lt{font-size:32px;font-weight:700;letter-spacing:-.01em;margin:10px 4px 12px;line-height:1.2}

/* Hero */
.hero{padding:22px 20px 26px;border-radius:22px;background:linear-gradient(150deg,#5AC8FA 0%,#007AFF 55%,#5856D6 100%);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"\f275";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset-inline-end:-18px;bottom:-34px;font-size:150px;opacity:.14}
.hero>*{position:relative}
.hero .bdg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.22);padding:3px 12px;border-radius:12px;margin-bottom:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero h2{font-size:24px;font-weight:700;line-height:1.3}
.hero p{opacity:.9;font-size:14px;margin-top:6px;max-width:520px}
.hero .bt{margin-top:16px;background:#fff;color:#007AFF}
.hero .bt:active{background:#f0f0f0}

/* Section heads */
.sec{display:flex;align-items:center;gap:8px;margin:26px 8px 8px;color:var(--tx2)}
.sec>i{font-size:13px;color:var(--blue)}
.sec b{flex:1;font-size:13px;font-weight:600}
.sec small{font-weight:400;font-size:12px;margin-inline-start:6px}
.sec em{font-style:normal;background:var(--fill);color:var(--tx2);font-weight:600;font-size:12px;padding:0 9px;min-width:22px;height:22px;line-height:22px;border-radius:11px;text-align:center}

/* Stats */
.g4{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{background:var(--sf);padding:12px;border-radius:14px;display:flex;align-items:center;gap:12px;text-align:start;transition:background .12s,transform .12s}
.sc:active{background:var(--sf3);transform:scale(.98)}
.sc>i{width:38px;height:38px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
.g4 .sc:nth-child(4n+2)>i{background:var(--green)}.g4 .sc:nth-child(4n+3)>i{background:var(--purple)}.g4 .sc:nth-child(4n)>i{background:var(--orange)}
.sc b{font-size:22px;font-weight:700;line-height:1.1}.sc span{font-size:12.5px;color:var(--tx2);font-weight:500}
.seg{display:flex;height:8px;gap:2px;margin:2px 0 10px;border-radius:4px;overflow:hidden;background:var(--fill)}.seg i{display:block}

/* Search / filters */
.sr{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 10px;background:var(--fill);border-radius:10px}
.sr>i{color:var(--tx2);font-size:14px}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:16px}
.sr input::placeholder{color:var(--tx2)}
.sr .x{width:26px;height:26px;border-radius:50%;color:var(--tx2);font-size:14px}
.fbtn{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;position:relative;font-size:13px;flex:none}
.bub{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);padding:0 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 12px;border-radius:15px;background:rgba(0,122,255,.14);color:var(--blue);font-weight:600;font-size:13px}
.chip button{width:22px;height:22px;border-radius:50%;font-size:10px;color:var(--blue)}
.inf{color:var(--tx2);font-size:13px;margin:10px 8px 8px}
/* iOS segmented control */
.pill{display:flex;gap:2px;margin:12px 0;padding:2px;background:var(--fill);border-radius:9px;overflow-x:auto}
.pill button{flex:1;min-width:max-content;height:30px;padding:0 12px;border-radius:7px;color:var(--tx);font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.pill button.on{background:var(--sf);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
[data-theme=dark] .pill button.on{background:var(--sf3)}

/* Grouped list rows */
.ls{display:grid;background:var(--sf);border-radius:14px;overflow:hidden}
.card{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;padding:11px 14px;background:var(--sf);cursor:pointer;transition:background .1s;position:relative}
.card::after{content:"";position:absolute;inset-inline:74px 0;bottom:0;height:.5px;background:var(--sep)}
.card:last-child::after{display:none}
.card:active{background:var(--sf3)}
.card.mine{background:rgba(0,122,255,.08)}
.av{width:48px;height:48px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:600;font-size:17px;flex:none;align-self:center}
.cm{min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.ti{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ti i{color:var(--blue);font-size:13px}
.ir{display:flex;flex-wrap:wrap;gap:0 10px;font-size:13px;color:var(--tx2)}.ir i{color:var(--tx3);font-size:11px;margin-inline-end:4px}
/* type + category + visits + rating: always a single line */
.tags{display:flex;flex-wrap:nowrap;gap:4px;align-items:center;overflow-x:auto;white-space:nowrap;margin-top:2px}
.tg{flex:none;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--fill);color:var(--tx2);display:inline-flex;align-items:center;gap:4px}
.tg.four{background:rgba(0,122,255,.14);color:var(--blue)}
.tg.exp{background:rgba(52,199,89,.16);color:#248A3D}[data-theme=dark] .tg.exp{color:var(--green)}
.tg.me{background:var(--green);color:#fff}.tg.v{background:rgba(0,122,255,.14);color:var(--blue)}
.tg.r{background:rgba(255,149,0,.16);color:#B36200}.tg.r i{color:var(--star)}[data-theme=dark] .tg.r{color:var(--yellow)}
.tg.vw i{color:var(--blue)}
.ca{display:grid;grid-template-columns:repeat(2,30px);gap:0;align-self:center}
.ca button,.ca a{width:30px;height:30px;border-radius:50%;color:var(--tx3);display:grid;place-items:center;font-size:14px;transition:.12s}
.ca button:active,.ca a:active{background:var(--fill2)}
.ca .on{color:var(--star)}.ca .wa{color:var(--wa)}
.chip2{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--sf);cursor:pointer;width:100%;text-align:start;position:relative}
.chip2:active{background:var(--sf3)}
.chip2 .av{width:42px;height:42px;font-size:15px}.chip2 .bd{flex:1;min-width:0}
.chip2 b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip2 small{color:var(--tx2);font-size:12.5px}
.stack{background:var(--sf);border-radius:14px;overflow:hidden}
.stack>.chip2+.chip2{box-shadow:inset 0 .5px 0 var(--sep)}
.em{text-align:center;padding:44px 16px;color:var(--tx2);background:var(--sf);grid-column:1/-1}
.em i{font-size:34px;display:block;margin-bottom:10px;color:var(--tx3)}.em b{display:block;color:var(--tx);font-size:17px;font-weight:600}

/* Explorer */
.cr{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;margin:12px 0;overflow-x:auto}
.cr button{flex:none;padding:5px 14px;border-radius:16px;background:var(--fill);font-weight:500;font-size:13px}
.cr button:last-child{background:var(--blue);color:#fff}.cr i{font-size:9px;color:var(--tx3);flex:none}
.rwl{background:var(--sf);border-radius:14px;overflow:hidden}
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;background:var(--sf);text-align:start;font-weight:500;position:relative}
.rw+.rw{box-shadow:inset 0 .5px 0 var(--sep)}
.rw:active{background:var(--sf3)}
.rw>i:first-child{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:14px}
.rw span{flex:1}.rw em{font-style:normal;color:var(--tx2);font-size:14px}
.rw>i:last-child{font-size:11px;color:var(--tx3)}

/* Buttons */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 24px;border-radius:13px;font-weight:600;font-size:16px;background:var(--blue);color:#fff;transition:.12s}
.bt:active{opacity:.7}.bt:disabled{opacity:.4;pointer-events:none}
.bt.g{background:var(--fill);color:var(--blue)}.bt.full{width:100%}

/* Bottom sheet */
#md{position:fixed;inset:0;z-index:60;background:var(--ov);display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .22s}
#md.on{display:flex;opacity:1}
.sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--bg);padding:8px 16px calc(16px + var(--sb));border-radius:14px 14px 0 0;animation:mi .28s cubic-bezier(.2,.8,.2,1);position:relative}
@keyframes mi{from{transform:translateY(100%)}}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 12px}
.sheet h2{font-size:22px;font-weight:700;margin-bottom:2px}.lead{color:var(--tx2);font-size:14px;margin-bottom:14px}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.ac .full{grid-column:1/-1}
.fl{background:var(--sf);border-radius:12px;overflow:hidden}
.fs{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px;text-align:start;position:relative}
.fs+.fs{box-shadow:inset 0 .5px 0 var(--sep)}
.fs:active{background:var(--sf3)}
.fs .ic{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;font-size:13px}
.fs .nm{flex:1;font-weight:500;word-break:break-word}.fs .val{color:var(--tx2);font-size:13px;max-width:50%;text-align:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs .n{color:var(--tx2);font-size:14px}
.fs .box{width:22px;color:transparent;font-size:15px;flex:none;text-align:center}.fs.on .box{color:var(--blue)}
.fs.clr{color:var(--red);justify-content:center;font-weight:500}
.fb{color:var(--blue);font-weight:500;padding:4px 0;margin-bottom:6px}
.ff{position:sticky;bottom:calc(-16px - var(--sb));margin:14px -16px calc(-16px - var(--sb));padding:12px 16px calc(12px + var(--sb));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);display:flex;gap:8px}.ff .bt{flex:1}
.cc{background:rgba(255,255,255,.28);padding:0 8px;border-radius:10px}

/* Profile */
.ph{text-align:center;padding:6px 0 4px}
.pl{width:92px;height:92px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(160deg,#8E8E93,#636366);color:#fff;display:grid;place-items:center;font-size:36px}
.pn2{font-size:22px;font-weight:700;line-height:1.3}.pn2 i{color:var(--blue);font-size:17px}.ps{font-size:14px;color:var(--tx2)}
.ph .tags{justify-content:center;margin-top:10px}
.pa{display:flex;gap:10px;justify-content:center;margin:16px 0 14px}
.pa .ib{flex:1;max-width:90px;height:auto;border-radius:12px;background:var(--sf);flex-direction:column;gap:4px;padding:10px 0 8px;font-size:19px}
.pa .ib small{font-size:11px;font-weight:500}
.pa .wa{color:var(--wa)}
.rb{margin:0 0 14px;padding:14px;background:var(--sf);border-radius:14px;text-align:center}
.rb small{display:block;color:var(--tx2);font-size:13px;margin-bottom:4px}
.rb .avg{font-size:14px;font-weight:600;margin-bottom:4px}
.stars{display:flex;justify-content:center;gap:2px;direction:ltr}
.stars button{width:42px;height:42px;font-size:26px;color:var(--tx3);transition:.1s;border-radius:50%}
.stars button.on{color:var(--star)}.stars button:active{transform:scale(1.15)}
.vl{background:var(--sf);border-radius:14px;overflow:hidden}
.vr{display:flex;gap:12px;align-items:center;padding:10px 14px}
.vr+.vr{box-shadow:inset 0 .5px 0 var(--sep)}
.vr>i,.vr>a{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;font-size:14px}
.vr small{display:block;color:var(--tx2);font-size:12px}.vr b{overflow-wrap:anywhere;font-weight:500}

/* About */
.ah{text-align:center;padding:28px 20px;border-radius:20px;background:linear-gradient(150deg,#5AC8FA,#007AFF 60%,#5856D6);color:#fff;margin-bottom:10px}
.ah .bg{width:68px;height:68px;border-radius:17px;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:30px}
.ah h2{font-size:16px;font-weight:700;letter-spacing:.02em}.ah p{font-size:13.5px;opacity:.92;margin-top:2px}
.as{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.as div{text-align:center;padding:12px 4px;background:var(--sf);border-radius:14px}
.as b{display:block;font-size:22px;color:var(--blue);font-weight:700}.as span{font-size:12.5px;color:var(--tx2)}
.lkl{background:var(--sf);border-radius:14px;overflow:hidden}
.lk{display:flex;align-items:center;gap:12px;padding:10px 14px}
.lk+.lk{box-shadow:inset 0 .5px 0 var(--sep)}
.lk .li{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.lk.fb .li{background:var(--fb)}.lk.wa .li{background:var(--wa)}
.lk .bd{flex:1;min-width:0}.lk b{display:block;font-size:15px;font-weight:600}.lk small{color:var(--tx2);font-size:12.5px}
.lk .a{display:flex;gap:2px}
.lk .a a,.lk .a button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.lk .a a:active,.lk .a button:active{background:var(--fill)}
.wab{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;margin-top:12px;border-radius:14px;background:var(--wa);color:#fff;font-weight:600;font-size:16px;transition:.12s}
.wab:active{opacity:.75}.wab i{font-size:22px}
.cho{display:flex;align-items:center;gap:12px;padding:10px 14px}
.cho+.cho{box-shadow:inset 0 .5px 0 var(--sep)}
.cho .li{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--blue);flex:none}
.cho.s .li{background:var(--green)}
.cho>div:nth-child(2){flex:1;min-width:0}.cho b{display:block;font-weight:600}.cho small{color:var(--tx2);font-size:12.5px}
.cho .a{display:flex;gap:2px;flex:none}
.cho .a a,.cho .a button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.cho .a a:active,.cho .a button:active{background:var(--fill)}

/* Tab bar */
#bn{position:fixed;inset-inline:0;bottom:0;z-index:29;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(4px + var(--sb));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 -.5px 0 var(--sep)}
.bi{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--tx2);position:relative;padding:2px 0;transition:color .15s}
.bi i{font-size:21px;height:26px;display:grid;place-items:center}
.bi.on{color:var(--blue)}.bi:active{opacity:.6}
.fvb{position:absolute;top:-2px;inset-inline-end:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;padding:0 5px}
.fvb[hidden]{display:none}

/* Toast / loader / offline */
#ts{position:fixed;inset-inline:0;top:calc(var(--st) + 66px);margin:auto;width:max-content;max-width:calc(100% - 32px);z-index:90;background:rgba(60,60,67,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;padding:10px 20px;border-radius:22px;font-weight:500;font-size:14px;opacity:0;transform:translateY(-10px);pointer-events:none;transition:.22s}
#ts.on{opacity:1;transform:none}
#ld{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;place-items:center}#ld.on{display:grid}
#ld i{width:34px;height:34px;border-radius:50%;border:3px solid var(--fill2);border-top-color:var(--blue);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#off{position:fixed;top:calc(var(--st) + 56px);inset-inline-end:12px;z-index:80;padding:3px 12px;border-radius:12px;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:none}#off.on{display:block}

/* PWA: dynamic icon + manifest (the old blob-URL service worker was invalid and has been removed) */
(function initPWA(){
  try{
    const cv=document.createElement('canvas');cv.width=cv.height=512;const x=cv.getContext('2d');
    const g=x.createLinearGradient(0,0,512,512);g.addColorStop(0,'#5AC8FA');g.addColorStop(1,'#007AFF');
    x.fillStyle=g;x.fillRect(0,0,512,512);
    x.fillStyle='#fff';
    for(let i=0;i<8;i++){x.save();x.translate(256,256);x.rotate(i*Math.PI/4);x.fillRect(-28,-190,56,70);x.restore()}
    x.beginPath();x.arc(256,256,130,0,Math.PI*2);x.fill();
    x.fillStyle='#007AFF';x.beginPath();x.arc(256,256,70,0,Math.PI*2);x.fill();
    x.fillStyle='#fff';x.beginPath();x.arc(256,256,30,0,Math.PI*2);x.fill();
    const icon=cv.toDataURL('image/png');
    const man={name:'Réseau Industriel Maroc',short_name:'Réseau Ind',start_url:'.',display:'standalone',background_color:'#F2F2F7',theme_color:'#F2F2F7',icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/json'}));document.head.appendChild(l);
    const a=document.createElement('link');a.rel='apple-touch-icon';a.href=icon;document.head.appendChild(a);
  }catch(e){console.warn('PWA init error:',e)}
})();

/* Full CSV parser (handles quoted commas, quotes and line breaks) */
function parseRows(t){const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const h=t[i];
    if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}
    else if(h==='"')q=true;
    else if(h===','){r.push(c);c=''}
    else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=h}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
const parseCSV=(txt,type,cat)=>{const cl=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');
  return parseRows(txt).slice(1).filter(c=>cl(c[1])).map(c=>{
    const name=cl(c[1]),phone=fmtPhone(cl(c[5])),email=cl(c[6]).toLowerCase();
    const seed=type+'|'+(email||norm(name)+'|'+phone);let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
    return{id:'p'+h.toString(36),name,domaine:cl(c[2])||'Autre',specialite:cl(c[3])||'Général',ville:cl(c[4]),phone,email,web:cl(c[7]),type,categorie:cat}})};
async function fetchCSV(){
  const g=async u=>{const r=await fetch(u+'&cachebust='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.text()};
  const[e,f]=await Promise.all([g(CSV_E),g(CSV_F)]);const m=new Map();
  [...parseCSV(f,'fournisseurs','services'),...parseCSV(e,'experts','yad-amila')].forEach(r=>{if(!m.has(r.id))m.set(r.id,r)});
  return[...m.values()]}
const lastOf=db=>['fournisseurs','experts'].map(t=>db.filter(r=>r.type===t).pop()).filter(Boolean);
const clearFc=()=>{S.fc={}};
function setDB(d,src){S.db=d;S.idx=new Map(d.map(r=>[r.id,r]));S.src=src;S.newM=lastOf(d);clearFc()}
async function loadDB(){
  try{const d=await fetchCSV();if(d.length){setDB(d,'csv');lsSet('cp-csv-cache',{t:Date.now(),d});return}}catch(e){console.warn(e)}
  const c=ls('cp-csv-cache',null);if(c&&c.d&&c.d.length)setDB(c.d,'cache')}
async function loadVL(){if(!S.fb)return;
  try{const[v,r]=await Promise.all([S.fb.ref('visits').once('value'),S.fb.ref('ratings').once('value')]);
    S.visits=new Map(Object.entries(v.val()||{}));S.rates=new Map(Object.entries(r.val()||{}))}catch(e){console.warn(e)}}
async function recordVisit(r){if(!r||!S.fb)return;const p=fmtPhone(r.phone),k=pk(p);if(!k)return;
  try{const res=await S.fb.ref('visits/'+k).transaction(c=>{c=c||{};const now=Date.now();c.nom=r.name;c.telephone=p;c.nombre=(c.nombre||c.count||0)+1;c.derniereVisite=now;c.premiereVisite=c.premiereVisite||now;return c});
    if(res.snapshot.val())S.visits.set(k,res.snapshot.val())}catch(e){console.warn(e)}}

/* ================= Filtering ================= */
function match(r,skip){for(const k in FLD){if(k===skip)continue;const a=S.f[k];if(a.length&&!a.some(v=>norm(r[FLD[k]])===norm(v)))return false}
  return S.q?hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.q):true}
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0)+(S.q?1:0);
const clearF=()=>{S.f={type:[],cat:[],dom:[],spe:[],ville:[]};S.q='';S.lim=40;clearFc()};
function facet(k,by='count'){const m=new Map();S.db.filter(r=>match(r,k)).forEach(r=>{const v=(r[FLD[k]]||'').trim();if(v)m.set(v,(m.get(v)||0)+1)});
  const a=[...m];return by==='count'?a.sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0],'ar')):a.sort((x,y)=>x[0].localeCompare(y[0],'ar'))}
function getFacet(k,by='count'){const key=k+':'+JSON.stringify(S.f)+S.q+by;return S.fc[key]||(S.fc[key]=facet(k,by))}

const rateInner=r=>{const t=getRate(r.id),my=S.myR[rk(r)]||0;

async function rate(id,el){const r=byId(id),n=+el.dataset.n;if(!r||!n)return;if(!S.fb)return toast('التقييم غير متاح بدون اتصال');

    S.rates.set(k,res.snapshot.val());S.myR[k]=n;lsSet('cp-my-rates',S.myR);

async function share(id){const r=byId(id);if(!r)return;const p=fmtPhone(r.phone),w=url(r.web),t=getRate(id);

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.classList?.contains('card'))profile(e.target.dataset.v)});
const setOff=o=>$('#off').classList.toggle('on',o);
addEventListener('online',()=>setOff(false));addEventListener('offline',()=>setOff(true));if(!navigator.onLine)setOff(true);

/* ================= Boot ================= */
(async()=>{
  setTheme(document.documentElement.dataset.theme||'light');
  try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
  await loadDB();await loadVL();S.last=Date.now();
  const saved=ls('cp-tab','home');            // restore the last open section
  go(TABS.includes(saved)?saved:'home',true);busy(false);
  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(decodeURIComponent(m[1]));r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
</script>
