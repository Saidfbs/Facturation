<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Réseau Industriel — Maroc</title>
<meta name="theme-color" content="#1B2631">
<meta name="description" content="نربط الموردين والشركات في مكان واحد">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== Réseau Industriel — Industrial Community v5 ===== */
:root{
  --pri:#E85D04;--pri-dk:#C24A00;--pri-lt:#FEF0E6;--pri-soft:rgba(232,93,4,.08);
  --acc:#FAA307;--acc-dk:#D18700;
  --steel:#1B2631;--steel-lt:#2C3E50;--steel-md:#34495E;
  --concrete:#F4F1EC;--concrete-dk:#E8E3DA;
  --rust:#9D3C02;
  --bg:var(--concrete);--bg2:var(--concrete-dk);
  --sf:#FFFFFF;--sf2:#FAF8F5;--sf3:#F0EDE7;
  --bd:#DDD6CB;--bd2:#C9C0B2;
  --tx:#1B2631;--tx2:#5A6673;--tx3:#8B95A2;
  --ok:#16A34A;--ok-bg:#DCFCE7;--ok-bd:#A7E3B8;
  --bad:#DC2626;--bad-bg:#FEE2E2;
  --sky:#2F80C0;--sky-bg:#E0F2FE;
  --wa:#25D366;--wa-dk:#128C7E;--fb:#1877F2;
  --sh-sm:0 1px 2px rgba(27,38,49,.05);
  --sh:0 2px 8px rgba(27,38,49,.07),0 1px 2px rgba(27,38,49,.04);
  --sh-lg:0 8px 24px rgba(27,38,49,.12),0 2px 6px rgba(27,38,49,.06);
  --sh-pri:0 4px 14px rgba(232,93,4,.35);
  --r:8px;--r-lg:12px;--r-xl:16px;--r-full:999px;
  --ff:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --haz:repeating-linear-gradient(-45deg,#FAA307 0 10px,#1B2631 10px 20px);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[data-theme=dark]{
  --steel:#0A0E12;--steel-lt:#151B22;--steel-md:#1F2933;
  --concrete:#0F1318;--concrete-dk:#0A0E12;
  --sf:#151B22;--sf2:#1A222B;--sf3:#202933;
  --bd:#232B35;--bd2:#2E3844;
  --tx:#E7ECF1;--tx2:#9AA7B5;--tx3:#667382;
  --pri-lt:#2A1A0F;--pri-soft:rgba(232,93,4,.12);
  --ok-bg:rgba(22,163,74,.15);--ok-bd:rgba(22,163,74,.35);
  --bad-bg:rgba(220,38,38,.15);
  --sky-bg:rgba(47,128,192,.15);
  --sh-sm:0 1px 2px rgba(0,0,0,.4);
  --sh:0 2px 8px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.3);
  --sh-lg:0 8px 24px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font:14px/1.6 var(--ff);color:var(--tx);min-height:100vh;background-color:var(--bg);
  background-image:linear-gradient(rgba(27,38,49,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(27,38,49,.025) 1px,transparent 1px);
  background-size:32px 32px;
}
[data-theme=dark] body{background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px)}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:4px}
img{max-width:100%;display:block}

header{position:fixed;inset:0 0 auto;z-index:30;padding-top:var(--st);background:var(--steel);border-bottom:1px solid rgba(255,255,255,.06)}
header::after{content:"";position:absolute;inset-inline:0;bottom:-4px;height:4px;background:var(--haz);opacity:.9}
.hin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{width:44px;height:44px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;display:grid;place-items:center;flex:none;font-size:20px;box-shadow:0 0 0 3px rgba(255,255,255,.08),0 4px 12px rgba(232,93,4,.35)}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.2;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--acc);font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:var(--r-lg);background:var(--steel-md);border:1px solid rgba(255,255,255,.08);color:#DCE3EA;display:inline-grid;place-items:center;position:relative;transition:.18s cubic-bezier(.4,0,.2,1);flex:none}
.ib:hover{background:var(--pri);border-color:var(--pri);color:#fff;transform:translateY(-1px)}
.ib:active{transform:translateY(0)}
.ib.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.ib.pri:hover{background:var(--acc);border-color:var(--acc)}
.ib.grn{background:var(--sky);border-color:var(--sky);color:#fff}
.ib.grn:hover{background:#2568A0}

main{max-width:1100px;margin:0 auto;padding:calc(88px + var(--st)) 14px calc(96px + var(--sb))}
.tab{display:none}.tab.on{display:block;animation:fu .3s cubic-bezier(.4,0,.2,1)}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}

.hero{padding:28px 24px;border-radius:var(--r-xl);background:linear-gradient(135deg,var(--steel) 0%,var(--steel-lt) 60%,var(--steel-md) 100%);color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh-lg);border:1px solid rgba(255,255,255,.06)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.hero::after{content:"\f275";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset-inline-end:-20px;bottom:-40px;font-size:180px;opacity:.06;color:var(--acc);transform:rotate(-8deg)}
.hero>*{position:relative;z-index:1}
.hero .badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--acc);color:var(--steel);padding:5px 12px;border-radius:var(--r-full);margin-bottom:12px}
.hero h2{font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.hero p{color:#C3CCD6;font-size:13.5px;margin-top:8px;max-width:520px;line-height:1.65}
.hero .bt{margin-top:18px;background:var(--pri);color:#fff;box-shadow:var(--sh-pri);border:0}
.hero .bt:hover{background:var(--acc);color:var(--steel)}
.hero-stats{display:flex;gap:16px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);flex-wrap:wrap}
.hero-stats div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#C3CCD6}
.hero-stats div i{color:var(--acc);font-size:14px}
.hero-stats div b{color:#fff;font-family:var(--fm);font-weight:700;font-size:15px}

.sh{display:flex;align-items:center;gap:12px;margin:28px 0 14px;padding-bottom:10px;border-bottom:1.5px solid var(--bd2)}
.sh>i{width:38px;height:38px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--steel),var(--steel-md));color:var(--acc);display:grid;place-items:center;font-size:14px;flex:none;box-shadow:var(--sh-sm)}
.sh b{flex:1;font-size:15px;font-weight:700;letter-spacing:.01em}
.sh small{display:block;color:var(--tx2);font-size:12px;font-weight:400;letter-spacing:0;margin-top:1px}
.sh em{font-style:normal;font-family:var(--fm);background:var(--pri);color:#fff;font-weight:700;font-size:12px;padding:3px 12px;border-radius:var(--r-full);box-shadow:0 2px 6px rgba(232,93,4,.3)}

.g4{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px 10px;text-align:center;box-shadow:var(--sh);transition:.2s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;overflow:hidden}
.sc::before{content:"";position:absolute;top:0;inset-inline:0;height:3px;background:linear-gradient(90deg,var(--pri),var(--acc))}
.sc:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:var(--pri)}
.sc i{width:40px;height:40px;border-radius:var(--r-lg);background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-size:16px;margin-bottom:2px}
.sc b{font-family:var(--fm);font-size:26px;line-height:1;color:var(--tx);font-weight:700}
.sc span{color:var(--tx2);font-size:11.5px;font-weight:600}
.seg{display:flex;height:10px;border-radius:var(--r-full);overflow:hidden;gap:2px;margin-bottom:12px;background:var(--bd)}
.seg i{display:block;transition:.3s}
.cols{display:grid;gap:14px}@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.pn{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh)}
.pn>b{display:block;font-size:11.5px;color:var(--tx2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.sl{max-height:300px;overflow-y:auto;padding-inline-end:2px}
.bar{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:38px;padding:0 12px;margin-top:5px;border-radius:var(--r);background:var(--sf2);border:1px solid var(--bd);overflow:hidden;font-weight:600;font-size:13px;transition:.15s}
.bar:hover{border-color:var(--pri);background:var(--pri-lt)}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,rgba(232,93,4,.18),rgba(250,163,7,.1))}
.bar span,.bar b{position:relative}
.bar b{font-family:var(--fm);background:var(--steel);color:var(--acc);border-radius:var(--r-full);padding:2px 10px;font-size:12px;font-weight:700}

.sr{display:flex;align-items:center;gap:10px;height:54px;padding:0 8px 0 16px;background:var(--sf);border:1.5px solid var(--bd2);border-radius:var(--r-lg);box-shadow:var(--sh-sm);transition:.18s}
.sr:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
.sr>i{color:var(--tx3);font-size:15px}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:14px}
.sr input::placeholder{color:var(--tx3)}
.sr .x{width:34px;height:34px;border-radius:var(--r);color:var(--tx3);display:grid;place-items:center}
.sr .x:hover{background:var(--sf2);color:var(--bad)}
.fbtn{width:42px;height:42px;border-radius:var(--r);background:var(--steel);color:var(--acc);display:grid;place-items:center;position:relative;transition:.18s}
.fbtn:hover{background:var(--pri);color:#fff}
.fbtn.has{background:var(--pri);color:#fff}
.bub{position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;border-radius:var(--r-full);background:var(--acc);color:var(--steel);font-family:var(--fm);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--sf)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 14px;border-radius:var(--r-full);background:var(--steel);color:var(--acc);font-weight:600;font-size:12px;transition:.15s}
.chip:hover{background:var(--steel-md)}
.chip button{width:22px;height:22px;border-radius:var(--r-full);background:rgba(255,255,255,.15);color:#fff;font-size:10px;display:grid;place-items:center;transition:.15s}
.chip button:hover{background:var(--bad)}
.inf{color:var(--tx2);font-size:12.5px;margin:14px 4px 10px;font-weight:600}
.pill{display:flex;gap:3px;margin:14px 0;padding:4px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.pill button{flex:1;height:38px;border-radius:var(--r);color:var(--tx2);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.pill button:hover{background:var(--sf2);color:var(--tx)}
.pill button.on{background:var(--steel);color:var(--acc);box-shadow:var(--sh-sm)}

.ls{display:grid;gap:10px}
@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:14px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);cursor:pointer;transition:.2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:var(--pri)}
.card:active{transform:translateY(0)}
.card.fv{border-color:var(--acc);background:linear-gradient(135deg,rgba(250,163,7,.04),transparent 60%)}
.card.mine{border-color:var(--pri);background:linear-gradient(135deg,var(--pri-soft),rgba(250,163,7,.04))}
.card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--pri);opacity:0;transition:.2s}
.card.exp::before{background:var(--sky)}
.card:hover::before,.card.fv::before,.card.mine::before{opacity:1}

.av{width:56px;height:56px;border-radius:var(--r-lg);color:#fff;display:grid;place-items:center;font-family:var(--fm);font-weight:700;font-size:19px;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15),var(--sh-sm);letter-spacing:-.02em}
.av.four{background:linear-gradient(140deg,#C2410C,#E85D04)}
.av.exp{background:linear-gradient(140deg,#2F80C0,#1A4C73)}
.av.mine{background:linear-gradient(140deg,#168A45,#0D6B63)}

.cm{min-width:0;display:flex;flex-direction:column;gap:5px}
.ti{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.ti i{color:var(--pri);font-size:12px}
.ir{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--tx2)}
.ir i{color:var(--pri);font-size:11px;margin-inline-end:4px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.tg{font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--r-full);background:var(--sf3);color:var(--tx2);border:1px solid var(--bd);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tg.a{background:var(--steel);color:var(--acc);border-color:var(--steel)}
.tg.four{background:var(--pri-soft);color:var(--pri-dk);border-color:rgba(232,93,4,.2)}
[data-theme=dark] .tg.four{color:var(--pri)}
.tg.exp{background:var(--sky-bg);color:var(--sky);border-color:rgba(47,128,192,.25)}
.tg.me{background:var(--pri);color:#fff;border-color:var(--pri)}
.tg.v{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}

/* ===== Stats row (rating + visits) ===== */
.card-stats{display:flex;align-items:center;gap:8px;margin-top:5px;padding-top:7px;border-top:1px dashed var(--bd);font-size:11.5px;flex-wrap:wrap}
.cs-item{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--tx2);white-space:nowrap}
.cs-item i{font-size:11px}
.cs-item.rating i{color:var(--acc)}
.cs-item.rating b{color:var(--tx);font-family:var(--fm);font-weight:700;font-size:12.5px;line-height:1}
.cs-item.rating span{color:var(--tx3);font-weight:500;font-size:11px}
.cs-item.rating.mine{color:var(--ok)}
.cs-item.rating.mine i{color:var(--ok)}
.cs-item.visits i{color:var(--sky)}
.cs-item.visits b{color:var(--tx);font-family:var(--fm);font-weight:700;font-size:12.5px;line-height:1}
.cs-item.new{color:var(--tx3);font-weight:500;font-size:11px}
.cs-item.new i{color:var(--bd2);font-size:10px}
.cs-sep{color:var(--bd2);font-weight:300;font-size:14px;line-height:1}

.ca{display:grid;grid-template-columns:repeat(2,32px);gap:5px;align-self:start}
.ca button,.ca a{width:32px;height:32px;border-radius:var(--r);background:var(--sf3);border:1px solid var(--bd);color:var(--tx3);display:grid;place-items:center;font-size:12px;transition:.15s}
.ca button:hover,.ca a:hover{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);transform:scale(1.05)}
.ca .on{color:var(--acc);border-color:var(--acc);background:rgba(250,163,7,.1)}
.ca .del{color:var(--bad)}
.ca .del:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.ca .wa{color:var(--wa-dk)}.ca .wa:hover{background:var(--wa);color:#fff;border-color:var(--wa)}
.ca .pdf{color:var(--bad)}.ca .pdf:hover{background:var(--bad);color:#fff;border-color:var(--bad)}

.chip2{display:flex;align-items:center;gap:12px;padding:12px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh-sm);cursor:pointer;width:100%;text-align:start;margin-bottom:8px;transition:.18s;position:relative;overflow:hidden}
.chip2::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--acc)}
.chip2:hover{border-color:var(--acc);transform:translateX(-2px)}
.chip2 .av{width:42px;height:42px;font-size:16px}
.chip2 .bd{flex:1;min-width:0}
.chip2 b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.chip2 small{color:var(--tx2);font-size:12px}

.em{text-align:center;padding:48px 20px;border:2px dashed var(--bd2);border-radius:var(--r-lg);color:var(--tx2);background:var(--sf);grid-column:1/-1}
.em i{font-size:36px;display:block;margin-bottom:12px;color:var(--tx3)}
.em b{display:block;color:var(--tx);font-size:16px;font-weight:700;margin-bottom:4px}
.em small{display:block;font-size:12.5px;margin-bottom:4px}
.em .bt{margin-top:16px}

.cr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0}
.cr button{padding:7px 14px;border-radius:var(--r-full);background:var(--sf);border:1px solid var(--bd);font-weight:600;font-size:12.5px;transition:.15s}
.cr button:hover{background:var(--pri-soft);border-color:var(--pri)}
.cr button:last-child{background:var(--steel);color:var(--acc);border-color:var(--steel)}
.cr i{font-size:9px;color:var(--tx3)}
.rw{display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin-bottom:8px;border-radius:var(--r-lg);background:var(--sf);border:1px solid var(--bd);text-align:start;font-weight:600;box-shadow:var(--sh-sm);transition:.18s}
.rw:hover{border-color:var(--pri);box-shadow:var(--sh);transform:translateX(-2px)}
.rw>i:first-child{width:44px;height:44px;border-radius:var(--r-lg);background:linear-gradient(135deg,var(--steel),var(--steel-md));color:var(--acc);display:grid;place-items:center;font-size:16px;flex:none}
.rw span{flex:1;font-size:14px}
.rw em{font-style:normal;font-family:var(--fm);background:var(--pri-soft);color:var(--pri-dk);border-radius:var(--r-full);padding:3px 12px;font-size:12.5px;font-weight:700}
[data-theme=dark] .rw em{color:var(--pri)}
.rw>i:last-child{font-size:10px;color:var(--tx3)}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:var(--r-lg);font-weight:700;font-size:14px;background:var(--pri);color:#fff;border:0;transition:.15s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-pri)}
.bt:hover{background:var(--acc);color:var(--steel);transform:translateY(-1px)}
.bt:active{transform:translateY(0);box-shadow:var(--sh-sm)}
.bt:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;transform:none}
.bt.g{background:var(--sf);color:var(--tx);border:1px solid var(--bd);box-shadow:var(--sh-sm)}
.bt.g:hover{background:var(--sf2);border-color:var(--bd2)}
.bt.k{background:var(--steel);color:var(--acc);box-shadow:var(--sh-sm)}
.bt.k:hover{background:var(--steel-md)}
.bt.d{background:var(--bad);color:#fff;box-shadow:0 4px 14px rgba(220,38,38,.3)}

function splitCSV(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const h=l[i];if(h==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(h===','&&!q){o.push(c);c=''}else c+=h}o.push(c);return o}
const parseCSV=(txt,type,cat)=>{const cl=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c=>cl(c[1])).map(c=>{const name=cl(c[1]),phone=fmtPhone(cl(c[5])),email=cl(c[6]).toLowerCase();
  const phoneDigits=phone.replace(/\D/g,'');
  const seed=type+'|'+(email||norm(name)+'|'+phone);let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
  const id=phoneDigits?'p'+phoneDigits:'p'+h.toString(36);
  return{id,name,domaine:cl(c[2])||'Autre',specialite:cl(c[3])||'Général',ville:cl(c[4]),phone,email,web:cl(c[7]),type,categorie:cat}})};
async function fetchCSV(){
  const g=async u=>{const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),10000);try{const r=await fetch(u+'&cachebust='+Date.now(),{cache:'no-store',signal:ctrl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(to)}};
  const[e,f]=await Promise.all([g(CSV_E),g(CSV_F)]);const m=new Map();[...parseCSV(f,'fournisseurs','services'),...parseCSV(e,'experts','yad-amila')].forEach(r=>{if(!m.has(r.id))m.set(r.id,r)});return[...m.values()]}
const lastOf=(db)=>['fournisseurs','experts'].map(t=>db.filter(r=>r.type===t).pop()).filter(Boolean);
const clearFc=()=>{S.fc={}};
async function loadDB(){
  try{const d=await fetchCSV();if(d.length){S.db=d;S.idx=new Map(d.map(r=>[r.id,r]));S.src='csv';const h=hashOf(d);if(S.hash&&S.hash!==h)S.dirty=true;else if(!S.hash){S.hash=h;saveLS('cp-csv-hash',h)}S.newM=lastOf(d);saveLS('cp-csv-cache',JSON.stringify({t:Date.now(),d}));clearFc();return}}catch(e){console.warn(e)}
  const c=ls('cp-csv-cache',null);if(c&&c.d&&c.d.length){S.db=c.d;S.idx=new Map(S.db.map(r=>[r.id,r]));S.src='cache';S.newM=lastOf(S.db)}clearFc()}

async function loadRatings(){
  if(!S.fb)return;
  try{
    const snap=await S.fb.ref('ratings').once('value');
    const data=snap.val()||{};
    S.ratings=new Map();
    for(const[key,v]of Object.entries(data)){
      const count=v.count||0,total=v.total||0;
      const mine=v.votes?.[S.deviceId]?.stars||null;
      S.ratings.set(key,{total,count,avg:count?total/count:0,mine});
    }
  }catch(e){console.warn('loadRatings',e)}
}
function getRating(id){const r=byId(id);if(!r)return{avg:0,count:0,mine:null};return S.ratings.get(pk(fmtPhone(r.phone)))||{avg:0,count:0,mine:null}}
const RECENT=new Set();
async function recordVisit(r){
  if(!r||!S.fb)return;
  if(RECENT.has(r.id))return;
  RECENT.add(r.id);setTimeout(()=>RECENT.delete(r.id),60000);
  const p=fmtPhone(r.phone),k=pk(p);if(!k)return;
  try{const ref=S.fb.ref('visits/'+k),cur=(await ref.once('value')).val()||{},now=Date.now();const u={nom:r.name,telephone:p,nombre:(cur.nombre||cur.count||0)+1,derniereVisite:now,premiereVisite:cur.premiereVisite||now};await ref.update(u);S.visits.set(k,u)}catch(e){console.warn(e)}
}
async function submitRating(id,stars){
  const r=byId(id);if(!r)return;
  if(!S.fb){toast('التقييم يتطلب اتصالاً',null,'err');return}
  if(!(stars>=1&&stars<=5))return;
  const key=pk(fmtPhone(r.phone));
  if(!key){toast('رقم الهاتف مفقود',null,'err');return}
  if(S.ratings.get(key)?.mine){toast('لقد قيّمت هذه الشركة بالفعل',null,'err');return}
  busy(true);
  try{
    const result=await S.fb.ref('ratings/'+key).transaction(cur=>{
      cur=cur||{total:0,count:0,votes:{}};
      cur.votes=cur.votes||{};
      if(cur.votes[S.deviceId])return;
      cur.votes[S.deviceId]={stars,ts:Date.now()};
      cur.total=(cur.total||0)+stars;
      cur.count=(cur.count||0)+1;
      return cur;
    });
    if(!result.committed){toast('تعذر حفظ التقييم',null,'err');return}
    const v=result.snapshot.val();
    S.ratings.set(key,{total:v.total,count:v.count,avg:v.count?v.total/v.count:0,mine:stars});
    toast('شكراً! تم حفظ تقييمك',null,'ok');
    profile(id);
  }catch(e){console.warn(e);toast('خطأ في حفظ التقييم',null,'err')}
  finally{busy(false)}
}

function match(r,skip){for(const k in FLD){if(k===skip)continue;const a=S.f[k];if(a.length&&!a.some(v=>norm(r[FLD[k]])===norm(v)))return false}return S.q?hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.q):true}
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0)+(S.q?1:0);
const clearF=()=>{S.f={type:[],cat:[],dom:[],spe:[],ville:[]};S.q='';S.lim=40;clearFc();persistState()};
function facet(k,by='count'){const m=new Map();S.db.filter(r=>match(r,k)).forEach(r=>{const v=(r[FLD[k]]||'').trim();if(v)m.set(v,(m.get(v)||0)+1)});const a=[...m];return by==='count'?a.sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0],'ar')):a.sort((x,y)=>x[0].localeCompare(y[0],'ar'))}
function getFacet(k,by='count'){const key=k+':'+JSON.stringify(S.f)+S.q+by;if(Object.keys(S.fc).length>100)S.fc={};return S.fc[key]||(S.fc[key]=facet(k,by))}
function sorted(){
  const a=S.db.filter(r=>match(r));
  const byName=(x,y)=>x.name.localeCompare(y.name,'ar');
  a.sort(
    S.dirSort==='rating'?(x,y)=>{
      const rx=getRating(x.id),ry=getRating(y.id);
      const sx=rx.count>=3?rx.avg:(rx.count?rx.avg-5:-99);
      const sy=ry.count>=3?ry.avg:(ry.count?ry.avg-5:-99);
      return sy-sx||ry.count-rx.count||byName(x,y);
    }:
    S.dirSort==='visits'?(x,y)=>getVisits(y.id)-getVisits(x.id)||byName(x,y):
    byName
  );
  return a;
}

/* ===== Stats row ===== */
function statsRow(id){
  const r=getRating(id);
  const visits=getVisits(id);
  const parts=[];
  if(r.count){
    parts.push(`<span class="cs-item rating ${r.mine?'mine':''}"><i class="fa-solid fa-star"></i><b>${r.avg.toFixed(1)}</b><span>(${r.count})</span></span>`);
  }else{
    parts.push(`<span class="cs-item new"><i class="fa-regular fa-star"></i>جديد</span>`);
  }
  if(visits){
    parts.push(`<span class="cs-item visits"><i class="fa-solid fa-eye"></i><b>${visits}</b></span>`);
  }
  return `<div class="card-stats">${parts.join('<span class="cs-sep">·</span>')}</div>`;
}

 if(navigator.canShare&&navigator.canShare({text})){try{await navigator.share({title:n||'مشاركة',text});return}catch(e){if(e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(text);toast('تم نسخ الرابط',null,'ok')}catch{toast('تعذر النسخ',null,'err')}}
function toggleFav(id){const i=S.fav.indexOf(id);i>=0?S.fav.splice(i,1):S.fav.push(id);saveLS('cp-fav',JSON.stringify(S.fav));toast(i>=0?'أُزيلت من المفضلة':'أُضيفت إلى المفضلة',null,'ok');topbar();if(!$('#md').classList.contains('on')){if(S.tab==='dir')dirList();else if(S.tab==='home')home();else if(S.tab==='fav')favShell()}}
function delFav(id){const r=byId(id);if(!r)return;askConfirm({title:'حذف من المفضلة؟',message:`هل تريد إزالة <b>${esc(r.name)}</b> من مفضلتك؟`,icon:'fa-trash',confirmLabel:'حذف',onConfirm:()=>{S.fav=S.fav.filter(x=>x!==id);saveLS('cp-fav',JSON.stringify(S.fav));toast('تم الحذف',null,'ok');topbar();favShell()}})}
function clearFav(){
  const count=S.fav.length;
  if(!count){toast('المفضلة فارغة',null,'info');return}
  askConfirm({
    title:'مسح كل المفضلة؟',
    message:`سيتم إزالة <b>${count}</b> شركة من مفضلتك.`,
    icon:'fa-trash-can',
    confirmLabel:'مسح الكل',
    onConfirm:()=>{
      S.fav=[];
      saveLS('cp-fav','[]');
      toast('تم مسح المفضلة',null,'ok');
      topbar();
      favShell();
    }
  });
}

async function loadPdf(){
  if(window.html2canvas&&window.jspdf?.jsPDF)return;
  const ld=u=>new Promise((a,b)=>{const e=document.createElement('script');e.src=u;e.onload=a;e.onerror=b;document.head.appendChild(e)});
  try{await Promise.all([
    window.html2canvas?0:ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    window.jspdf?.jsPDF?0:ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
  ])}catch{throw new Error('تعذر تحميل مكتبة PDF')}}
function pdfHtml(r){const p=fmtPhone(r.phone),w=url(r.web),rows=[];
 if(shown(r.domaine))rows.push(['fa-industry','القطاع',r.domaine]);if(shown(r.specialite))rows.push(['fa-screwdriver-wrench','التخصص',r.specialite]);if(r.ville)rows.push(['fa-location-dot','المدينة',r.ville]);if(p)rows.push(['fa-phone','الهاتف',p]);if(r.email)rows.push(['fa-envelope','البريد',r.email]);if(w)rows.push(['fa-globe','الموقع',r.web]);
 const{avg,count}=getRating(r.id);if(count)rows.push(['fa-star','التقييم',`${avg.toFixed(1)} / 5 (${count})`]);
 const v=getVisits(r.id);if(v)rows.push(['fa-eye','الزيارات',String(v)]);
 const b=baseUrl(),qr=b?`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(b+'#p='+r.id)}&margin=0" crossorigin="anonymous" alt="QR">`:'';
 return`<div class="pc" data-root><div class="pl2"><div class="lg"><i class="fa-solid ${domIcon(r.domaine)}"></i></div><div class="nm">${esc(r.name)}</div><div class="sb">${esc([shown(r.domaine),r.ville].filter(Boolean).join(' · '))}</div></div><div class="pr">${rows.map(([i,k,v])=>`<div class="prw"><div class="ic"><i class="fa-solid ${i}"></i></div><div><div class="k">${k}</div><div class="v">${esc(v)}</div></div></div>`).join('')}</div><div class="pft"><b>RÉSEAU INDUSTRIEL</b>${qr}</div></div>`}
async function makePDF(id){const r=byId(id);if(!r)return;busy(true);let h=null;
 try{await loadPdf();
  try{await document.fonts.load('700 14px "IBM Plex Sans Arabic"');await document.fonts.load('400 14px "IBM Plex Sans Arabic"');await document.fonts.load('500 14px "IBM Plex Sans Arabic"')}catch{}
  h=document.createElement('div');h.className='pdf-stage';h.innerHTML=pdfHtml(r);document.body.appendChild(h);
  try{await document.fonts?.ready}catch{}
  await new Promise(x=>setTimeout(x,700));
  const cv=await html2canvas(h.querySelector('[data-root]'),{scale:2,backgroundColor:'#F4F1EC',useCORS:true,logging:false}),{jsPDF}=window.jspdf,W=200,H=W*cv.height/cv.width;
  const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[W,H]});pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);pdf.save(`Reseau-${r.name.replace(/\s+/g,'_')}.pdf`);toast('تم توليد بطاقة PDF',null,'ok')}
 catch(e){toast(e.message||'خطأ في توليد PDF',null,'err')}finally{h?.remove();busy(false)}}

const linkItem=(l,s,u,cls,ic)=>`<div class="cho ${cls}"><div class="li"><i class="fa-solid ${ic}"></i></div><div><b>${esc(l)}</b><small>${esc(s)}</small></div><div class="a"><a href="${u}" target="_blank" rel="noopener" aria-label="فتح"><i class="fa-solid fa-arrow-up-right-from-square"></i></a><button data-a="shrLink" data-url="${esc(u)}" data-name="${esc(l)}" aria-label="مشاركة"><i class="fa-solid fa-share-nodes"></i></button></div></div>`;
const A={
 theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;saveLS('cp-theme',d);topbar();toast(d==='dark'?'الوضع الداكن':'الوضع الفاتح',null,'ok')},
 pdf:makePDF,cls:closeM,open(id){profile(id)},shr:share,fav:toggleFav,shrLink:shareLink,
 delFav,clearFav,
 rate:(id,el)=>submitRating(id,Number(el.dataset.n)),
 confirmOk(){const cb=S.cb;S.cb=null;closeM();cb&&cb()},
 openForms(){openM(`<h2>نماذج الإدخال</h2><p class="lead">اختر نوع التسجيل — سيُفتح نموذج Google</p>${linkItem('تسجيل خبير','أدخل بياناتك كخبير',FORM_E,'','fa-user-tie')}${linkItem('تسجيل مورّد','أدخل بياناتك كمورّد',FORM_F,'','fa-truck-field')}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
 openSheets(){openM(`<h2>فتح الأوراق</h2><p class="lead">اختر الورقة لعرضها في Google Sheets</p>${linkItem('ورقة الخبراء','عرض جدول الخبراء',SHEET_E,'s','fa-table')}${linkItem('ورقة الموردين','عرض جدول الموردين',SHEET_F,'s','fa-table')}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
 undo(){if(undoFn){undoFn();undoFn=null;$('#ts').classList.remove('on')}},
 tab(v){if(S.tab===v){window.scrollTo({top:0,behavior:'smooth'});if(v==='exp'){S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};persistState();explorer()}else if(v==='dir'){clearF();dirShell()}else if(v==='fav')favShell()}else go(v)},
 stat(v){if(v==='f'){openFilter();return}const i=v.indexOf(':');clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];persistState();go('dir')},
 bar(v,el){clearF();S.f[el.dataset.k]=[v];persistState();go('dir')},
 chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=40;clearFc();persistState();dirList()},
 qx(){S.q='';const q=$('#q');if(q)q.value='';S.lim=40;clearFc();persistState();dirList()},more(){S.lim+=40;dirList()},dirsort(v){S.dirSort=v;S.lim=40;persistState();dirShell()},
 fmodal:()=>openFilter(),fsect(v){S.fp={mode:'pick',key:v};renderFilter()},fback(){S.fp={mode:'sections',key:null};renderFilter()},fsort(v){S.sortF[S.fp.key]=v;renderFilter()},
 fclearsec(){S.f[S.fp.key]=[];S.lim=40;clearFc();persistState();renderFilter()},
 fpick(v){const a=S.f[S.fp.key],i=a.findIndex(x=>norm(x)===norm(v));i>=0?a.splice(i,1):a.push(v);S.lim=40;clearFc();persistState();renderFilter()},
 fclr(){clearF();renderFilter()},fdone(){closeM();if(S.tab!=='dir'){S.tab='';go('dir')}else dirList()},
 xsort(v){S.exp.sort=v;persistState();explorer()},xt:v=>{S.exp={t:v,d:'',s:'',q:'',sort:S.exp.sort};persistState();explorer()},xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';persistState();explorer()},xs:v=>{S.exp.s=v;S.exp.q='';persistState();explorer()},qxexp(){S.exp.q='';persistState();explorer()},
 xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:'',sort:x.sort}:v==='t'?{...x,d:'',s:'',q:''}:v==='d'?{...x,s:'',q:''}:x;persistState();explorer()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}else if(e.target.id==='md')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v)});
const setOff=o=>$('#off').classList.toggle('on',o);addEventListener('online',()=>setOff(false));addEventListener('offline',()=>setOff(true));if(!navigator.onLine)setOff(true);

(async()=>{
 try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn(e)}
 await loadDB();await loadVL();await loadRatings();
 S.last=Date.now();
 go(S.tab||'home');busy(false);topbar();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 const m=location.hash.match(/^#p=(.+)$/);if(m)setTimeout(()=>{const r=byId(m[1]);r?profile(r.id):toast('الرابط غير صالح',null,'err')},300);
})();
})();
