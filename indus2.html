<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RÉSEAU INDUSTRIEL — Maroc</title>
<meta name="theme-color" content="#1A2332">
<meta name="description" content="نربط الموردين والشركات في مكان واحد">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
:root{
  --steel-950:#0A0F16;--steel-900:#0F1620;--steel-800:#1A2332;--steel-700:#2A3546;--steel-600:#3D4A5C;--steel-500:#5A6878;--steel-400:#8894A4;--steel-300:#B0BAC6;--steel-200:#C9D0D9;--steel-100:#E1E5EB;
  --rust:#EA580C;--rust-dark:#C2410C;--rust-darker:#9A3412;--rust-soft:#FFF1E4;--rust-light:#F97316;
  --yellow:#FFC20E;--yellow-dark:#E5A800;--yellow-soft:#FFF8D6;
  --bg:#E4E1DA;--bg-2:#D6D2C8;--grid:#D0CCC2;
  --surface:#FAF8F3;--surface-2:#EFECE4;--surface-hover:#E6E2D7;
  --border:#CFC9BA;--border-strong:#8B8578;--heavy:#3D3A33;
  --text:#1A1815;--text-2:#57534E;--text-3:#8B8578;
  --success:#15803D;--success-soft:#DCFCE7;
  --danger:#B91C1C;--danger-soft:#FEE2E2;
  --warning:#B45309;--warning-soft:#FEF3C7;
  --wa:#128C7E;--fb:#1877F2;--sky:#0EA5E9;
  --shadow:2px 2px 0 rgba(26,24,21,.16);
  --shadow-md:3px 3px 0 rgba(26,24,21,.2);
  --shadow-lg:6px 6px 0 rgba(26,24,21,.3);
  --r:4px;--r-sm:2px;--r-lg:6px;--r-xl:8px;
  --fh:'Bebas Neue','Oswald',sans-serif;
  --fh2:'Oswald','IBM Plex Sans Arabic',sans-serif;
  --ff:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --header-h:66px;--botnav-h:66px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#0A0F16;--bg-2:#121A24;--grid:#121A24;
  --surface:#151C27;--surface-2:#1C2532;--surface-hover:#252F3D;
  --border:#2E3A4A;--border-strong:#4A5868;--heavy:#5A6878;
  --text:#E8E5DF;--text-2:#A8A29E;--text-3:#78716C;
  --rust-soft:rgba(234,88,12,.16);--yellow-soft:rgba(255,194,14,.12);
  --success-soft:rgba(21,128,61,.2);--danger-soft:rgba(185,28,28,.2);--warning-soft:rgba(180,83,9,.2);
  --shadow:2px 2px 0 rgba(0,0,0,.5);--shadow-md:3px 3px 0 rgba(0,0,0,.55);--shadow-lg:6px 6px 0 rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font:14px/1.55 var(--ff);background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;background-position:-1px -1px;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px}

header{
  position:fixed;inset:0 0 auto;z-index:30;padding-top:var(--st);
  background:var(--steel-900);border-bottom:3px solid var(--yellow);
  box-shadow:0 3px 0 rgba(0,0,0,.3);
}
header::before{
  content:"";position:absolute;inset-inline:0;top:0;height:4px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 20px,var(--steel-900) 20px 40px);
}
.hin{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px 10px;min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{
  width:44px;height:44px;background:var(--rust);color:#fff;display:grid;place-items:center;
  font-size:19px;flex:none;border-radius:var(--r);border:2px solid var(--yellow);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);
}
.brand-text{min-width:0}
.brand b{display:block;font:400 24px/1 var(--fh);letter-spacing:.06em;text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand small{display:block;color:var(--yellow);font:500 11px/1.3 var(--ff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.acts{display:flex;align-items:center;gap:6px;flex:none}
.ib{
  width:42px;height:42px;border-radius:var(--r);background:var(--steel-700);
  border:2px solid var(--steel-600);display:inline-flex;align-items:center;justify-content:center;
  color:var(--steel-200);transition:.12s;position:relative;flex-shrink:0;padding:0;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.3);
}
.ib i{font-size:15px;line-height:1}
.ib:hover{background:var(--steel-600);color:#fff;border-color:var(--yellow)}
.ib:active{transform:translate(1px,1px);box-shadow:none}
.ib.pri{background:var(--rust);border-color:var(--rust-darker);color:#fff}
.ib.pri:hover{background:var(--rust-light);border-color:var(--yellow)}
.ib.grn{background:var(--sky);border-color:#0369A1;color:#fff}
.ib.grn:hover{background:#38BDF8;border-color:var(--yellow)}
.ib.sync-btn.dirty{background:var(--danger);border-color:#7F1D1D;animation:dirtyPulse 1.6s ease-in-out infinite}
.ib.sync-btn.dirty::after{content:"";position:absolute;top:2px;inset-inline-end:2px;width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 2px var(--steel-900);}
@keyframes dirtyPulse{0%,100%{box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),0 0 0 0 rgba(185,28,28,.6)}50%{box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),0 0 0 6px rgba(185,28,28,0)}}
.ib.online-ind{background:rgba(21,128,61,.2);border-color:rgba(34,197,94,.5);color:#22C55E;gap:6px;padding:0 10px;width:auto;min-width:42px;cursor:pointer;transition:.12s}
.ib.online-ind:hover{background:rgba(21,128,61,.35);border-color:#22C55E;color:#fff}
.ib.online-ind .dot{width:8px;height:8px;border-radius:50%;background:#22C55E;animation:livePulse 2s infinite;flex:none}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}50%{box-shadow:0 0 0 5px rgba(34,197,94,0)}}
.ib.online-ind .num{font:400 17px var(--fh);letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1}

main{max-width:1120px;margin:0 auto;padding:calc(var(--header-h) + 20px + var(--st)) 14px calc(var(--botnav-h) + 22px + var(--sb))}
.tab{display:none}
.tab.on{display:block;animation:fadeUp .2s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}}

/* ====== Section headers (cleaner) ====== */
.sec-head{display:flex;align-items:center;gap:10px;margin:22px 0 12px;padding:0 2px}
.sec-head .sh-ic{width:36px;height:36px;border-radius:var(--r);background:var(--steel-800);color:var(--yellow);display:grid;place-items:center;font-size:14px;flex:none;border:2px solid var(--steel-900);box-shadow:var(--shadow)}
.sec-head .sh-body{flex:1;min-width:0}
.sec-head .sh-body b{display:block;font:600 15px var(--ff);color:var(--text);letter-spacing:.01em}
.sec-head .sh-body small{display:block;font:600 11px var(--fh2);color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.sec-head .sh-badge{font:700 11px var(--fh2);background:var(--rust);color:#fff;padding:3px 10px;border-radius:var(--r-sm);border:1px solid var(--rust-darker);letter-spacing:.05em}
.sec-head .sh-count{font:400 18px var(--fh);color:var(--rust);min-width:32px;text-align:center}

/* ====== Hero (cleaner) ====== */
.hero{padding:22px 22px 20px;background:linear-gradient(140deg,var(--surface),var(--surface-2));border-radius:var(--r);border:2px solid var(--heavy);box-shadow:5px 5px 0 var(--steel-800);position:relative;overflow:hidden;max-width:720px;margin:0 auto;}
.hero::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(45deg,var(--rust) 0 10px,var(--yellow) 10px 20px);}
.hero .hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font:700 10.5px var(--fh2);letter-spacing:.1em;text-transform:uppercase;color:var(--rust-dark);background:var(--rust-soft);padding:4px 10px;border-radius:var(--r-sm);border:1px solid var(--rust);margin-inline-start:12px;margin-bottom:10px}
.hero h2{font:400 26px/1.15 var(--fh);letter-spacing:.04em;position:relative;z-index:1;padding-inline-start:12px;text-transform:uppercase;}
.hero p{margin-top:8px;color:var(--text-2);font-size:13px;max-width:520px;position:relative;z-index:1;padding-inline-start:12px;font-weight:500;}
.hero::after{content:"\f013";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset-inline-end:-12px;bottom:-22px;font-size:120px;color:var(--border);opacity:.3;line-height:1;pointer-events:none;animation:spin 40s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ====== Stats cards ====== */
.g4{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-top:12px}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{background:var(--surface);border:2px solid var(--heavy);border-radius:var(--r);padding:14px 10px;text-align:center;box-shadow:var(--shadow-md);transition:.12s;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative;overflow:hidden}
.sc::before{content:"";position:absolute;top:0;inset-inline:0;height:3px;background:var(--steel-800);transition:.12s}
.sc:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--rust);border-color:var(--rust)}
.sc:hover::before{background:var(--rust)}
.sc i{width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;background:var(--steel-800);color:var(--yellow);font-size:15px;border:2px solid var(--steel-900)}
.sc b{font:400 24px/1 var(--fh);letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--text)}
.sc span{color:var(--text-2);font:600 11px var(--fh2);letter-spacing:.04em;text-transform:uppercase}
.seg{display:flex;height:12px;gap:1px;border-radius:var(--r);overflow:hidden;border:2px solid var(--heavy);background:var(--steel-900);margin-top:6px;}
.seg i{display:block;min-width:2px}
.cols{display:grid;gap:12px;grid-template-columns:1fr;margin-top:10px}
@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.pn{background:var(--surface);border:2px solid var(--heavy);border-radius:var(--r);padding:14px;box-shadow:var(--shadow-md);}
.pn>b{font:700 12.5px var(--ff);color:var(--text-2);display:block;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--heavy);text-transform:uppercase;letter-spacing:.06em;}
.sl{max-height:280px;overflow-y:auto;padding-inline-end:2px}
.bar{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:38px;padding:0 10px;border-radius:var(--r);overflow:hidden;margin-top:4px;background:var(--surface-2);font-size:13px;font-weight:600;transition:.12s;border:1px solid var(--border);}
.bar:hover{background:var(--surface-hover);border-color:var(--rust)}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--rust-soft)}
.bar span,.bar b{position:relative}
.bar b{font:400 13px var(--fh);letter-spacing:.04em;background:var(--steel-800);color:var(--yellow);padding:2px 10px;min-width:28px;text-align:center;font-variant-numeric:tabular-nums;}

/* ====== Search ====== */
.sr{display:flex;align-items:center;gap:8px;height:50px;padding:0 6px 0 14px;background:var(--surface);border:2px solid var(--heavy);border-radius:var(--r);box-shadow:var(--shadow-md);transition:.12s;}
.sr:focus-within{border-color:var(--rust);box-shadow:3px 3px 0 var(--rust)}
.sr>i{color:var(--text-3);font-size:14px;flex:none}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font-size:14.5px}
.sr input::placeholder{color:var(--text-3)}
.sr #qx,.sr #xqc{width:32px;height:32px;border-radius:var(--r);color:var(--text-3);display:grid;place-items:center;flex:none;transition:.12s}
.sr #qx:hover,.sr #xqc:hover{background:var(--surface-2);color:var(--text)}
.sr .fbtn{width:38px;height:38px;border-radius:var(--r);background:var(--steel-800);color:var(--yellow);display:grid;place-items:center;flex:none;position:relative;transition:.12s;border:2px solid var(--steel-900);}
.sr .fbtn:hover,.sr .fbtn.has-filters{background:var(--rust);color:#fff;border-color:var(--rust-darker)}
.sr .fbtn .bub{position:absolute;top:-7px;inset-inline-end:-7px;min-width:18px;height:18px;padding:0 4px;border-radius:50%;background:var(--yellow);color:var(--steel-900);font:700 11px var(--fh2);display:grid;place-items:center;border:2px solid var(--surface);}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 10px;border-radius:var(--r);background:var(--rust);color:#fff;font-weight:600;font-size:12px;border:1px solid var(--rust-darker);box-shadow:var(--shadow);}
.chip button{width:21px;height:21px;border-radius:var(--r-sm);color:inherit;font-size:9px;display:grid;place-items:center;background:rgba(0,0,0,.18);transition:.12s}
.chip button:hover{background:rgba(0,0,0,.32)}
.inf{color:var(--text-2);font-size:12.5px;margin:14px 4px 10px;font-weight:600;}

/* ====== My account banner ====== */
.my-account-banner{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;background:linear-gradient(140deg,var(--rust-soft),var(--yellow-soft));border:2px solid var(--rust);border-radius:var(--r);box-shadow:3px 3px 0 var(--rust);margin:14px 0 8px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
.my-account-banner::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(45deg,var(--rust) 0 8px,var(--yellow) 8px 16px)}
.my-account-banner:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--rust-darker);border-color:var(--rust-darker)}
.my-account-banner .ma-av{width:48px;height:48px;border-radius:var(--r);color:#fff;display:grid;place-items:center;font:400 20px var(--fh);flex:none;border:2px solid var(--steel-900);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);margin-inline-start:6px}
.my-account-banner .ma-body{flex:1;min-width:0}
.my-account-banner .ma-body .ma-badge{display:inline-flex;align-items:center;gap:4px;font:700 10.5px var(--fh2);letter-spacing:.06em;color:var(--rust-dark);background:rgba(255,255,255,.6);padding:2px 8px;border-radius:var(--r-sm);text-transform:uppercase;margin-bottom:3px;border:1px solid var(--rust)}
.my-account-banner .ma-body b{display:block;font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my-account-banner .ma-body small{display:block;font-size:12px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.my-account-banner .ma-go{width:36px;height:36px;border-radius:var(--r);background:var(--rust);display:grid;place-items:center;color:#fff;font-size:13px;flex:none;border:2px solid var(--rust-darker);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}

/* ====== Sort bar ====== */
.dir-sortbar{display:flex;gap:4px;margin:12px 0;padding:4px;background:var(--steel-800);border:2px solid var(--steel-900);border-radius:var(--r);box-shadow:var(--shadow);}
.dir-sortbar .sortbtn{flex:1;height:38px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--steel-400);font:600 12.5px var(--ff);display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s;}
.dir-sortbar .sortbtn:hover{background:var(--steel-700);color:#fff}
.dir-sortbar .sortbtn.on{background:var(--rust);color:#fff;border-color:var(--rust-darker)}
.dir-sortbar .sortbtn i{font-size:11px}

/* ====== Redesigned card ====== */
.ls{display:grid;gap:10px}
@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:56px 1fr auto;gap:10px 12px;align-items:start;padding:12px;background:var(--surface);border:2px solid var(--heavy);border-radius:var(--r);box-shadow:var(--shadow-md);cursor:pointer;transition:.14s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--steel-800);transition:.14s}
.card:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--rust);border-color:var(--rust)}
.card:hover::before{background:var(--rust)}
.card.is-fav{border-color:rgba(255,194,14,.5)}
.card.is-fav::before{background:var(--yellow)}
.card .av{width:56px;height:56px;border-radius:var(--r);color:#fff;display:grid;place-items:center;font:400 24px var(--fh);flex:none;border:2px solid var(--steel-900);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);letter-spacing:.04em}
.card .cm{min-width:0;display:flex;flex-direction:column;gap:4px}
.card .cm .title-row{display:flex;align-items:center;gap:6px;min-width:0}
.card .cm .title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .cm .title .vb{color:var(--rust);font-size:13px;flex:none}
.card .cm .info-row{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--text-2);font-weight:500}
.card .cm .info-row .ir-item{display:inline-flex;align-items:center;gap:3px;min-width:0}
.card .cm .info-row .ir-item i{color:var(--rust);font-size:10px;flex:none}
.card .cm .info-row .ir-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.card .cm .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tg{font:600 10.5px var(--fh2);padding:2px 8px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em;}
.tg.a{background:var(--steel-800);color:var(--yellow);border-color:var(--steel-900)}
.tg.v{background:var(--success-soft);color:var(--success);border-color:rgba(21,128,61,.3)}
.tg.vis{background:var(--rust-soft);color:var(--rust-dark);border-color:rgba(234,88,12,.3)}
.tg.me{background:var(--rust);color:#fff;border-color:var(--rust-darker)}
.card .ca{display:grid;grid-template-columns:repeat(2,32px);gap:4px;flex:none;align-self:start}
.card .ca button,.card .ca a{width:32px;height:32px;border-radius:var(--r);color:var(--text-3);font-size:12px;display:grid;place-items:center;transition:.12s;background:var(--surface-2);border:1px solid var(--border);padding:0}
.card .ca button:hover,.card .ca a:hover{background:var(--steel-800);color:var(--yellow);border-color:var(--steel-900)}
.card .ca .fv.on{color:var(--yellow);background:var(--steel-800);border-color:var(--steel-900)}
.card .ca .wa{color:var(--wa)}
.card .ca .wa:hover{background:var(--wa);color:#fff;border-color:var(--wa)}
.card .ca .pdf{color:var(--danger)}
.card .ca .pdf:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

/* ====== Compact list ====== */
.ls-compact{display:flex;flex-direction:column;gap:8px}
.member-chip{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;background:var(--surface);border:2px solid var(--heavy);border-radius:var(--r);box-shadow:var(--shadow-md);cursor:pointer;transition:.14s;position:relative;overflow:hidden;}
.member-chip::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--steel-800);transition:.14s;}
.member-chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--rust);border-color:var(--rust)}
.member-chip:hover::before{background:var(--rust)}
.member-chip .av{width:40px;height:40px;font-size:17px;margin:0;border-radius:var(--r)}
.member-chip .body{flex:1;min-width:0}
.member-chip .body b{display:block;font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-chip .body small{display:block;font-size:11.5px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.member-chip .go{width:32px;height:32px;border-radius:var(--r);background:var(--steel-800);display:grid;place-items:center;color:var(--yellow);font-size:11px;flex:none;transition:.12s;border:1px solid var(--steel-900);}

/* ====== Empty ====== */
.em{text-align:center;padding:44px 16px;border:2px dashed var(--border-strong);border-radius:var(--r);color:var(--text-2);background:var(--surface);}
.em i{font-size:32px;display:block;margin-bottom:12px;color:var(--text-3)}
.em b{display:block;color:var(--text);margin-bottom:4px;font:400 20px var(--fh);letter-spacing:.05em;text-transform:uppercase}
.em small{display:block;font-size:12.5px;margin-top:4px}

/* ====== Explorer breadcrumbs & rows ====== */
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:14px 0;font-size:12.5px}
.cr button{padding:6px 14px;border-radius:var(--r);background:var(--surface);border:2px solid var(--heavy);font:600 12.5px var(--ff);color:var(--text-2);transition:.12s;box-shadow:var(--shadow);}
.cr button:hover{background:var(--surface-hover);color:var(--text);border-color:var(--rust)}
.cr button:last-child{background:var(--steel-800);color:var(--yellow);border-color:var(--steel-900)}
.cr i{font-size:9px;color:var(--text-3)}
.rw{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;margin-bottom:8px;border-radius:var(--r);background:var(--surface);border:2px solid var(--heavy);text-align:start;font-weight:600;transition:.12s;box-shadow:var(--shadow);}
.rw:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--rust);border-color:var(--rust)}
.rw>i:first-child{width:44px;height:44px;border-radius:var(--r);background:var(--steel-800);color:var(--yellow);display:grid;place-items:center;font-size:16px;flex:none;border:2px solid var(--steel-900);}
.rw span{flex:1;font-size:14.5px}
.rw em{font:400 15px var(--fh);font-style:normal;background:var(--steel-800);color:var(--yellow);padding:2px 12px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em;}
.rw>i:last-child{font-size:10px;color:var(--text-3)}
.exp-sortbar{display:flex;gap:4px;margin:14px 0;padding:4px;background:var(--steel-800);border:2px solid var(--steel-900);border-radius:var(--r);box-shadow:var(--shadow);}
.exp-sortbar .sortbtn{flex:1;height:38px;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--steel-400);font:600 12.5px var(--ff);display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s;}
.exp-sortbar .sortbtn:hover{background:var(--steel-700);color:#fff}
.exp-sortbar .sortbtn.on{background:var(--rust);color:#fff;border-color:var(--rust-darker)}
.exp-sortbar .sortbtn i{font-size:11px}

/* ====== Buttons ====== */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:var(--r);font:400 17px var(--fh);letter-spacing:.08em;text-transform:uppercase;background:var(--rust);color:#fff;transition:.12s;border:2px solid var(--rust-darker);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),3px 3px 0 var(--border-strong);min-width:0;}
.bt:hover{background:var(--rust-light)}
.bt:active{transform:translate(2px,2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),1px 1px 0 var(--border-strong)}
.bt:disabled{opacity:.5;cursor:not-allowed}
.bt.g{background:var(--surface-2);color:var(--text);border-color:var(--heavy);font:600 14px var(--ff);letter-spacing:0;text-transform:none}
.bt.g:hover{background:var(--surface-hover)}
.bt.d{background:var(--danger);border-color:#7F1D1D;font:600 14px var(--ff);letter-spacing:0;text-transform:none}
.bt.k{background:var(--steel-800);color:var(--yellow);border-color:var(--steel-900);font:600 14px var(--ff);letter-spacing:0;text-transform:none}
.bt.k:hover{background:var(--steel-700)}
.bt.full{width:100%}
.bt i{font-size:13px}

/* ====== Modal ====== */
#md{position:fixed;inset:0;z-index:60;background:rgba(15,22,32,.75);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
#md.on{display:flex}
#md>.sheet{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);padding:26px 22px 22px;border-radius:var(--r);border:3px solid var(--steel-900);box-shadow:6px 6px 0 var(--rust),6px 6px 0 2px var(--steel-900);animation:modalIn .22s cubic-bezier(.2,.9,.3,1);position:relative;margin:auto;}
#md>.sheet::before{content:"";position:absolute;top:-3px;inset-inline:-3px;height:7px;background:repeating-linear-gradient(90deg,var(--yellow) 0 16px,var(--steel-900) 16px 32px);z-index:6;}
@keyframes modalIn{from{transform:translateY(20px) scale(.96);opacity:0}}
#md>.sheet h2{font:400 26px var(--fh);letter-spacing:.06em;margin:8px 0 6px;text-transform:uppercase}
.lead{color:var(--text-2);font-size:13px;margin-bottom:16px;line-height:1.5}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.ac .full{grid-column:1/-1}

/* Map modal */
#md.map-open{padding:10px;align-items:stretch}
#md.map-open>.sheet{
  max-width:640px;
  height:calc(100vh - 20px);
  max-height:calc(100vh - 20px);
  padding:16px 14px 12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:4px 4px 0 var(--rust),4px 4px 0 2px var(--steel-900);
  margin:auto;
}
#md.map-open>.sheet::before{height:6px}
#md.map-open .fmodal-h{margin-bottom:8px;flex:0 0 auto}
#md.map-open .fmodal-h h2{font-size:20px!important;margin-bottom:1px!important}
#md.map-open .fmodal-h .sub{font-size:11.5px}
#md.map-open .account-bar{margin-bottom:8px;padding:8px 10px;flex:0 0 auto}
#md.map-open .account-bar .ab-av{width:32px;height:32px;font-size:12px}
#md.map-open .account-bar .ab-info b{font-size:12.5px}
#md.map-open .account-bar .ab-info small{font-size:10.5px}
#md.map-open #mapWrap{
  flex:1 1 auto;
  min-height:260px;
  height:auto;
  margin:0;
  display:flex;
}
#md.map-open #mapWrap>#map{flex:1 1 auto;height:100%;width:100%}
#md.map-open .map-footer{flex:0 0 auto;display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#md.map-open .map-footer .bt{min-height:40px;padding:0 12px;font-size:12.5px;flex:1;min-width:90px}

/* Confirm */
.confirm-sheet .confirm-icon{width:60px;height:60px;border-radius:var(--r);display:grid;place-items:center;margin-bottom:14px;font-size:24px;background:var(--rust-soft);color:var(--rust);border:2px solid var(--rust);box-shadow:3px 3px 0 rgba(0,0,0,.2);}
.confirm-sheet .confirm-icon.danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.confirm-sheet .confirm-icon.success{background:var(--success-soft);color:var(--success);border-color:var(--success)}
.confirm-sheet .confirm-icon.warning{background:var(--warning-soft);color:var(--warning);border-color:var(--warning)}
.confirm-sheet p{color:var(--text-2);font-size:13.5px;line-height:1.6;margin-bottom:6px}
.confirm-sheet .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}

/* Choice cards */
.choice-list{display:grid;gap:10px;margin-top:12px}
.choice-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--surface-2);border:2px solid var(--heavy);transition:.12s;box-shadow:var(--shadow);}
.choice-card:hover{background:var(--surface-hover);border-color:var(--rust);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--rust)}
.choice-card .chi{width:46px;height:46px;border-radius:var(--r);display:grid;place-items:center;font-size:18px;flex:none;border:2px solid var(--steel-900);color:#fff;}
.choice-card.form .chi{background:var(--rust)}
.choice-card.sheet .chi{background:var(--sky)}
.choice-card .cht{flex:1;min-width:0}
.choice-card .cht b{display:block;font-size:14.5px;font-weight:700;margin-bottom:1px}
.choice-card .cht small{display:block;font-size:12px;color:var(--text-2)}
.choice-card .ch-actions{display:flex;gap:4px;flex:none}
.choice-card .ch-actions a,.choice-card .ch-actions button{width:38px;height:38px;border-radius:var(--r);display:grid;place-items:center;font-size:14px;transition:.12s;border:2px solid transparent;}
.choice-card.form .ch-actions .open{background:var(--rust);color:#fff;border-color:var(--rust-darker)}
.choice-card.sheet .ch-actions .open{background:var(--sky);color:#fff;border-color:#0369A1}
.choice-card .ch-actions .open:hover{filter:brightness(1.1)}
.choice-card .ch-actions .share{background:var(--surface);color:var(--text-2);border-color:var(--heavy)}
.choice-card .ch-actions .share:hover{background:var(--steel-800);color:var(--yellow);border-color:var(--steel-900)}

/* Filters */
.fmodal-h{margin-bottom:14px}
.fmodal-h h2{font:400 24px var(--fh)!important;letter-spacing:.06em;margin-bottom:2px!important;text-transform:uppercase}
.fmodal-h .sub{font-size:12.5px;color:var(--text-2)}
.fsect,.fopt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:var(--r);text-align:start;background:var(--surface);border:2px solid var(--heavy);margin-bottom:6px;transition:.12s;box-shadow:var(--shadow);}
.fsect:hover,.fopt:hover{background:var(--surface-hover);border-color:var(--rust);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--rust)}
.fsect.on,.fopt.on{background:var(--rust-soft);border-color:var(--rust);box-shadow:3px 3px 0 var(--rust)}
.fsect .ic{width:42px;height:42px;border-radius:var(--r);background:var(--steel-800);color:var(--yellow);display:grid;place-items:center;flex:none;font-size:14px;border:2px solid var(--steel-900);}
.fsect.on .ic{background:var(--rust);color:#fff}
.fsect .name{flex:1;font-weight:600;min-width:0;font-size:14.5px;line-height:1.4;word-break:break-word;}
.fsect.on .name{color:var(--rust-dark);font-weight:700}
.fsect .val{font:600 12px var(--ff);color:var(--rust);max-width:60%;white-space:normal;text-align:end;line-height:1.5;overflow:visible;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.fsect .num,.fopt .n{font:400 14px var(--fh);color:var(--text-2);min-width:30px;text-align:center;background:var(--surface-2);padding:2px 8px;border:1px solid var(--border);font-variant-numeric:tabular-nums;letter-spacing:.04em;}
.fsect.on .num,.fopt.on .n{background:var(--rust);color:#fff;border-color:var(--rust-darker)}
.fsect .chev{color:var(--text-3);font-size:11px}
.fback{display:flex;align-items:center;gap:6px;color:var(--rust-dark);font:600 13.5px var(--ff);margin-bottom:12px;padding:6px 10px;border-radius:var(--r);transition:.12s;width:fit-content;}
.fback:hover{background:var(--rust-soft)}
.sortbar{display:flex;gap:6px;margin-bottom:12px}
.sortbar .sortbtn{flex:1;height:40px;border-radius:var(--r);border:2px solid var(--heavy);background:var(--surface);color:var(--text-2);font:600 12.5px var(--ff);display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s;}
.sortbar .sortbtn:hover{background:var(--surface-hover);border-color:var(--rust)}
.sortbar .sortbtn.on{background:var(--steel-800);border-color:var(--steel-900);color:var(--yellow)}
.fopt .box{width:22px;height:22px;border-radius:var(--r);flex:none;border:2px solid var(--border-strong);display:grid;place-items:center;color:transparent;font-size:10px;transition:.12s;background:var(--surface);}
.fopt.on .box{border-color:var(--rust);background:var(--rust);color:#fff}
.fopt .name{flex:1;min-width:0;white-space:normal;text-align:start;overflow:visible;word-break:break-word;line-height:1.5;font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.fopt.on .name{font-weight:700;color:var(--rust-dark)}
.fopt.clear{border-style:dashed}
.fopt.clear .name{color:var(--danger)}
.filter-footer{position:sticky;bottom:-22px;margin:18px -22px -22px;padding:14px 22px calc(14px + var(--sb));background:var(--surface);border-top:2px solid var(--heavy);display:flex;gap:10px;z-index:5;}
.filter-footer .bt{flex:1;min-height:48px}
.filter-footer .count-badge{display:inline-flex;align-items:center;justify-content:center;background:rgba(0,0,0,.22);padding:0 8px;font:600 14px var(--fh2);margin-inline-start:6px;}
#md.filter-open>.sheet{max-width:620px;}

/* ====== Profile sheet ====== */
.ph{margin:-26px -22px 0;padding:32px 22px 20px;text-align:center;color:#fff;background:var(--steel-900);position:relative;overflow:hidden;background-image:repeating-linear-gradient(45deg,transparent 0 20px,rgba(255,255,255,.03) 20px 40px);border-bottom:4px solid var(--yellow);}
.ph::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(234,88,12,.28),transparent 70%);pointer-events:none;}
.pl{width:78px;height:78px;margin:0 auto 10px;background:var(--rust);color:#fff;display:grid;place-items:center;font-size:28px;position:relative;z-index:1;border-radius:var(--r);border:3px solid var(--yellow);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),4px 4px 0 rgba(0,0,0,.3);}
.pn2{font:400 24px var(--fh);letter-spacing:.05em;position:relative;z-index:1;text-transform:uppercase}
.ps{font-size:12.5px;color:rgba(255,255,255,.75);margin-top:4px;position:relative;z-index:1}
.ph .tags{justify-content:center;position:relative;z-index:1;margin-top:12px;display:flex;gap:5px;flex-wrap:wrap}
.ph .tg{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff}
.pa{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 6px}
.pa .ib{width:44px;height:44px;background:var(--surface-2);border:2px solid var(--heavy);color:var(--text-2);box-shadow:var(--shadow)}
.pa .ib:hover{background:var(--steel-800);color:var(--yellow);border-color:var(--steel-900)}
.pa .ib.wa{background:var(--wa);color:#fff;border-color:#0B5F55}
.pa .ib.wa:hover{background:#0B5F55;color:#fff}
.pa .ib.pdf{color:var(--danger)}
.pa .ib.pdf:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.vr{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.vr:last-child{border:0}
.vr>i,.vr>a{width:42px;height:42px;border-radius:var(--r);background:var(--surface-2);color:var(--rust);display:grid;place-items:center;flex:none;font-size:14px;transition:.12s;border:2px solid var(--heavy);}
.vr>a:hover{background:var(--rust);color:#fff;border-color:var(--rust)}
.vr small{display:block;color:var(--text-3);font:600 11px var(--fh2);margin-bottom:1px;text-transform:uppercase;letter-spacing:.06em}
.vr b{font-weight:600;overflow-wrap:anywhere;font-size:14px}

/* ====== About ====== */
.about-hero{text-align:center;padding:28px 22px;border-radius:var(--r);color:#fff;margin-bottom:16px;box-shadow:5px 5px 0 var(--rust);border:2px solid var(--steel-900);background:var(--steel-900);position:relative;overflow:hidden;background-image:repeating-linear-gradient(45deg,transparent 0 20px,rgba(255,255,255,.03) 20px 40px);}
.about-hero::before,.about-hero::after{content:"";position:absolute;inset-inline:0;height:6px;background:repeating-linear-gradient(90deg,var(--yellow) 0 20px,var(--steel-900) 20px 40px);}
.about-hero::before{top:0}
.about-hero::after{bottom:0}
.about-hero .ai-big{width:72px;height:72px;border-radius:var(--r);background:var(--rust);display:grid;place-items:center;margin:0 auto 10px;font-size:30px;border:3px solid var(--yellow);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3);}
.about-hero h2{font:400 22px/1.2 var(--fh);letter-spacing:.06em;margin-bottom:6px;color:var(--yellow);text-transform:uppercase}
.about-hero p{font-size:13px;line-height:1.6;max-width:440px;margin:0 auto;font-weight:500}
.about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.about-stats .stat-box{text-align:center;padding:12px 6px;background:var(--surface);border:2px solid var(--heavy);border-radius:var(--r);box-shadow:var(--shadow-md);position:relative;}
.about-stats .stat-box::before{content:"";position:absolute;top:0;inset-inline:0;height:3px;background:var(--rust)}
.about-stats .stat-box b{display:block;font:400 24px var(--fh);color:var(--rust);margin-bottom:2px;font-variant-numeric:tabular-nums;letter-spacing:.04em;}
.about-stats .stat-box span{font:600 11px var(--fh2);color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.about-sect{margin-top:20px}
.link-card{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 10px;background:var(--surface);border:2px solid var(--heavy);border-radius:var(--r);margin-bottom:10px;transition:.12s;box-shadow:var(--shadow-md);position:relative;overflow:hidden;}
.link-card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--heavy)}
.link-card.fb::before{background:var(--fb)}
.link-card.wa::before{background:var(--wa)}
.link-card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--rust);border-color:var(--rust)}
.link-card .lc-ic{width:44px;height:44px;margin-inline-start:6px;border-radius:var(--r);display:grid;place-items:center;font-size:18px;flex:none;border:2px solid var(--steel-900);color:#fff;}
.link-card.fb .lc-ic{background:var(--fb)}
.link-card.wa .lc-ic{background:var(--wa)}
.link-card .lc-body{flex:1;min-width:0}
.link-card .lc-body b{display:block;font-size:14px;font-weight:700;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-card .lc-body small{display:block;font-size:12px;color:var(--text-2);font-weight:500}
.link-card .lc-actions{display:flex;gap:4px;flex:none}
.link-card .lc-actions button,.link-card .lc-actions a{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;font-size:13px;transition:.12s;border:2px solid transparent;}
.link-card.fb .lc-actions .open{background:var(--fb);color:#fff;border-color:#0F5FCC}
.link-card.wa .lc-actions .open{background:var(--wa);color:#fff;border-color:#0B5F55}
.link-card .lc-actions .open:hover{filter:brightness(1.1)}
.link-card .lc-actions .share{background:var(--surface-2);color:var(--text-2);border-color:var(--heavy)}
.link-card .lc-actions .share:hover{background:var(--steel-800);color:var(--yellow);border-color:var(--steel-900)}

/* ====== Loc banner ====== */
#loc-banner{position:fixed;inset-inline:12px;bottom:calc(var(--botnav-h) + 18px + var(--sb));z-index:75;background:var(--surface);border:3px solid var(--steel-900);border-radius:var(--r);padding:16px 14px 14px;display:none;align-items:center;gap:12px;box-shadow:4px 4px 0 var(--rust),4px 4px 0 2px var(--steel-900);animation:locIn .3s ease-out;max-width:560px;margin-inline:auto;}
#loc-banner::before{content:"";position:absolute;top:-3px;inset-inline:-3px;height:6px;background:repeating-linear-gradient(90deg,var(--yellow) 0 12px,var(--steel-900) 12px 24px);}
#loc-banner.on{display:flex}
@keyframes locIn{from{opacity:0;transform:translateY(20px)}}
#loc-banner .li{width:46px;height:46px;border-radius:var(--r);background:var(--rust);color:#fff;display:grid;place-items:center;font-size:18px;flex:none;border:2px solid var(--rust-darker);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);}
#loc-banner .lt{flex:1;min-width:0}
#loc-banner .lt b{display:block;font:700 13.5px var(--ff);margin-bottom:2px}
#loc-banner .lt small{display:block;font-size:11.5px;color:var(--text-2)}
#loc-banner .la{display:flex;gap:5px;flex:none}
#loc-banner .la button{padding:0 14px;height:36px;border-radius:var(--r);font:700 12px var(--ff);border:2px solid transparent}
#loc-banner .la .skip{background:var(--surface-2);color:var(--text-2);border-color:var(--heavy)}
#loc-banner .la .allow{background:var(--rust);color:#fff;border-color:var(--rust-darker)}
#loc-banner .la .allow:hover{background:var(--rust-light)}
#loc-banner .la .allow i{font-size:10px;margin-inline-end:4px}

/* ====== Bottom nav ====== */
#bn{position:fixed;inset-inline:0;bottom:0;z-index:29;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + var(--sb));background:var(--steel-900);border-top:3px solid var(--yellow);box-shadow:0 -3px 0 rgba(0,0,0,.3);}
#bn::before{content:"";position:absolute;inset-inline:0;top:-7px;height:4px;background:repeating-linear-gradient(90deg,var(--yellow) 0 14px,var(--steel-900) 14px 28px);}

<script>
(function(){
  const svgIcon=(size)=>`data:image/svg+xml;charset=utf-8,${encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}">
      <rect width="512" height="512" fill="#0F1620" rx="40"/>
      <rect x="20" y="20" width="472" height="472" fill="none" stroke="#FFC20E" stroke-width="12" rx="20"/>
      <rect x="80" y="180" width="352" height="200" fill="#EA580C" rx="6"/>
      <rect x="160" y="140" width="192" height="60" fill="none" stroke="#FAF8F3" stroke-width="18" rx="4"/>
      <rect x="216" y="240" width="80" height="60" fill="#0F1620" rx="4"/>
      <rect x="80" y="360" width="352" height="16" fill="#FFC20E"/>
      <rect x="80" y="180" width="352" height="10" fill="#1A1815" opacity="0.2"/>
    </svg>`
  )}`;
  const manifest={
    name:"RÉSEAU INDUSTRIEL PROFESSIONNEL MAROCAIN",
    short_name:"Réseau Industriel",
    description:"نربط الموردين والشركات في مكان واحد",
    start_url:location.pathname,scope:location.pathname.replace(/[^/]*$/,''),
    display:"standalone",orientation:"portrait",
    background_color:"#0F1620",theme_color:"#1A2332",dir:"rtl",lang:"ar",
    icons:[
      {src:svgIcon(192),sizes:"192x192",type:"image/svg+xml",purpose:"any maskable"},
      {src:svgIcon(512),sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}
    ]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(blob);document.head.appendChild(link);
  const apple=document.createElement('link');apple.rel='apple-touch-icon';apple.href=svgIcon(192);document.head.appendChild(apple);
  const fav=document.createElement('link');fav.rel='icon';fav.type='image/svg+xml';fav.href=svgIcon(32);document.head.appendChild(fav);
})();

(function(){
  if(!('serviceWorker' in navigator))return;
  const swCode=`
    const CACHE='connectpro-v29';
    const ASSETS=[location.pathname,
      'https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap',
      'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css',
      'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
      'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'];
    self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS).catch(()=>{})))});
    self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
    self.addEventListener('fetch',e=>{
      const req=e.request;if(req.method!=='GET')return;
      const isDoc=req.mode==='navigate'||(req.headers.get('accept')||'').includes('text/html');
      if(isDoc){e.respondWith(fetch(req).then(res=>{const c=res.clone();caches.open(CACHE).then(x=>x.put(req,c)).catch(()=>{});return res}).catch(()=>caches.match(req).then(r=>r||caches.match(location.pathname))))}
      else{e.respondWith(caches.match(req).then(r=>r||fetch(req).then(res=>{if(res.status===200){const c=res.clone();caches.open(CACHE).then(x=>x.put(req,c)).catch(()=>{})}return res})))}
    });
  `;
  const blob=new Blob([swCode],{type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob),{scope:'./'}).catch(err=>console.warn('SW register failed',err));
  function setOffline(off){document.getElementById('offline-badge').classList.toggle('on',off)}
  window.addEventListener('online',()=>setOffline(false));
  window.addEventListener('offline',()=>setOffline(true));
  if(!navigator.onLine)setOffline(true);
})();
</script>

const fmtPhone=p=>{let d=String(p||'').replace(/[^\d+]/g,'');if(!d)return'';if(d.startsWith('00'))d='+'+d.slice(2);if(d.startsWith('+'))return d;if(d.startsWith('0'))return'+212'+d.slice(1);if(d.startsWith('212'))return'+'+d;return d};

function splitCSV(l){
  const o=[];let c='',q=false;
  for(let i=0;i<l.length;i++){const h=l[i];
    if(h==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}
    else if(h===','&&!q){o.push(c);c=''}
    else c+=h;
  }
  o.push(c);return o;
}
const parseCSV=(txt,type,cat)=>{
  const cl=s=>(s||'').replace(/^["'\s]+|["'\s]+$/g,'');
  return txt.split(/\r?\n/).slice(1).map(splitCSV).filter(c=>cl(c[1])).map(c=>{
    const name=cl(c[1]);const phone=fmtPhone(cl(c[5]));const email=cl(c[6]).toLowerCase().trim();
    const seed=type+'|'+(email||norm(name)+'|'+phone);
    let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
    return {id:'p'+h.toString(36),name,domaine:cl(c[2])||'Autre',specialite:cl(c[3])||'Général',ville:cl(c[4]),phone,email,web:cl(c[7]),type,categorie:cat};
  });
};
async function fetchFromCSV(){
  const g=async(u)=>{const r=await fetch(u+'&cachebust='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()};
  const [expTxt,fourTxt]=await Promise.all([g(CSV_EXPERTS),g(CSV_FOURNISSEURS)]);
  const experts=parseCSV(expTxt,'experts','yad-amila');
  const fournisseurs=parseCSV(fourTxt,'fournisseurs','services');
  const map=new Map();[...fournisseurs,...experts].forEach(r=>{if(!map.has(r.id))map.set(r.id,r)});
  return [...map.values()];
};
function getNewMembers(db){
  const expertsList=db.filter(r=>r.type==='experts');
  const fournisseursList=db.filter(r=>r.type==='fournisseurs');
  const latestExperts=expertsList.length?[expertsList[expertsList.length-1]]:[];
  const latestFournisseurs=fournisseursList.length?[fournisseursList[fournisseursList.length-1]]:[];
  return [...latestFournisseurs,...latestExperts];
}
async function loadDB(){
  try{
    const data=await fetchFromCSV();
    if(data&&data.length){
      S.db=data;S.dbIndex=new Map(S.db.map(r=>[r.id,r]));S.dataSource='csv';
      const newHash=computeCsvHash(S.db);
      if(S.lastCsvHash&&S.lastCsvHash!==newHash)S.isDirty=true;
      else if(!S.lastCsvHash){S.isDirty=false;S.lastCsvHash=newHash;try{localStorage.setItem('cp-csv-hash',newHash)}catch{}}
      S.newMembers=getNewMembers(S.db);
      try{localStorage.setItem('cp-csv-cache',JSON.stringify({t:Date.now(),d:S.db}))}catch{}
      clearFacetCache();return;
    }
  }catch(e){console.warn('CSV fetch failed',e)}
  try{
    const cached=JSON.parse(localStorage.getItem('cp-csv-cache')||'null');
    if(cached&&cached.d&&cached.d.length){
      S.db=cached.d;S.dbIndex=new Map(S.db.map(r=>[r.id,r]));S.dataSource='cache';
      S.newMembers=getNewMembers(S.db);
    }
  }catch{}
  clearFacetCache();
}

async function recordVisitForProfile(profileRecord){
  if(!profileRecord||!S.fb)return;
  const phone=fmtPhone(profileRecord.phone);const k=phoneKey(phone);
  if(!k)return;
  try{
    const ref=S.fb.ref('visits/'+k);

    const updated={nom:profileRecord.name,telephone:phone,nombre:(cur.nombre||cur.count||0)+1,derniereVisite:now,premiereVisite:cur.premiereVisite||now};
    await ref.update(updated);

  }catch(e){console.warn('record visit failed',e)}
}

async function getGeo(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve(null);const to=setTimeout(()=>resolve(null),10000);navigator.geolocation.getCurrentPosition(p=>{clearTimeout(to);resolve({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)})},()=>{clearTimeout(to);resolve(null)},{enableHighAccuracy:true,timeout:9000,maximumAge:0})})}
async function reverseGeo(lat,lng){
  try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=fr`);if(r.ok){const j=await r.json();const city=j.city||j.locality||j.principalSubdivision||'';if(city)return city}}catch{}
  try{const r2=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=fr`,{headers:{'Accept':'application/json'}});if(r2.ok){const j=await r2.json();const a=j.address||{};return a.city||a.town||a.village||a.state||a.country||''}}catch{}
  return '';
}

function match(r,skip){
  for(const k in FLD){
    if(k===skip)continue;
    const a=S.f[k];
    if(a.length&&!a.some(v=>norm(r[FLD[k]])===norm(v)))return false;
  }
  if(S.q)return hit([r.name,r.domaine,r.specialite,r.ville,r.phone,r.email].join(' '),S.q);
  return true;
}
const results=()=>S.db.filter(r=>match(r)).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const activeCount=()=>Object.keys(FLD).reduce((n,k)=>n+S.f[k].length,0)+(S.q?1:0);

const facetKey=k=>k+':'+S.f.type.length+','+S.f.cat.length+','+S.f.dom.length+','+S.f.spe.length+','+S.f.ville.length+','+S.q;
function facet(k,sortBy='count'){
  const m=new Map();
  S.db.filter(r=>match(r,k)).forEach(r=>{const v=(r[FLD[k]]||'').trim();if(v)m.set(v,(m.get(v)||0)+1)});
  const arr=[...m];
  if(sortBy==='count')return arr.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
  return arr.sort((a,b)=>a[0].localeCompare(b[0],'ar'));
}
function getFacet(k,sortBy='count'){const key=facetKey(k)+':'+sortBy;if(S.facetCache[key])return S.facetCache[key];const v=facet(k,sortBy);S.facetCache[key]=v;return v}
function getFacets(){if(S.facets)return S.facets;const f={};SECTIONS.forEach(s=>{f[s.k]=getFacet(s.k)});S.facets=f;return f}
const clearFacetCache=()=>{S.facetCache={};S.facets=null};

function sortedResults(){
  const arr=S.db.filter(r=>match(r));
  if(S.dirSort==='visits'){
    arr.sort((a,b)=>{const va=getVisits(a.id),vb=getVisits(b.id);if(vb!==va)return vb-va;return a.name.localeCompare(b.name,'ar')});
  }else{
    arr.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  }
  return arr;
}

const SEP_LINE='➖➖➖➖➖➖➖➖➖➖➖➖';
async function share(id){
  const r=byId(id);if(!r)return;
  const p=fmtPhone(r.phone),w=url(r.web);
  const lines=[`👤 ${r.name}`,SEP_LINE,`🏷️ النوع: ${TL[r.type]}`,`📂 التصنيف: ${CL[r.categorie]}`];
  if(shown(r.domaine))lines.push(`🏭 القطاع: ${r.domaine}`);
  if(shown(r.specialite))lines.push(`🛠️ التخصص: ${r.specialite}`);
  if(r.ville)lines.push(`📍 المدينة: ${r.ville}`);
  if(p)lines.push(`📞 الهاتف: ${p}`);
  if(r.email)lines.push(`✉️ البريد: ${r.email}`);
  if(w)lines.push(`🌐 الموقع: ${w}`);
  lines.push(SEP_LINE,`🔗 ${baseUrl()}#p=${r.id}`);
  const text=lines.join('\n');
  if(navigator.share){try{await navigator.share({title:r.name,text});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);toast('تم النسخ')}catch{toast('تعذر النسخ')}
  setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener'),0);
}

async function shareLink(v, el){
  const rawUrl = el?.dataset?.url || (typeof v==='string' && v.startsWith('http') ? v : '');
  const name = el?.dataset?.name || '';
  if(!rawUrl || typeof rawUrl!=='string' || !/^https?:\/\//i.test(rawUrl)){
    return toast('رابط غير صالح');
  }
  const text = name ? `${name}\n${rawUrl}` : rawUrl;
  if(navigator.share){
    try{await navigator.share({title:name||'مشاركة',text,url:rawUrl});return}
    catch(e){if(e.name==='AbortError')return}
  }
  try{await navigator.clipboard.writeText(rawUrl);toast('تم نسخ الرابط')}
  catch{toast('تعذر النسخ')}
  setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener'),0);
}

async function makePDF(id){
  const r=byId(id);if(!r)return;busy(true);let h=null;
  try{
    await loadPdfLibs();
    h=document.createElement('div');h.className='pdf-stage';h.innerHTML=pdfHtml(r);document.body.appendChild(h);
    try{await document.fonts?.ready}catch{}
    await new Promise(res=>setTimeout(res,700));
    const cv=await html2canvas(h.querySelector('[data-pdf-root]'),{scale:2,backgroundColor:'#F4F6F8',useCORS:true,logging:false});
    const{jsPDF}=window.jspdf,W=200,H=W*cv.height/cv.width;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[W,H]});
    pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,W,H);
    pdf.save(`ConnectPro-${r.name.replace(/\s+/g,'_')}.pdf`);
    toast('تم توليد بطاقة PDF');
  }catch(e){console.error(e);toast(e.message||'خطأ في توليد PDF')}
  finally{h?.remove();busy(false)}
}

/* ====== SYNC with improved structure ====== */
async function syncCSV(){
  if(!S.fb)return toast('Firebase غير متاح');
  if(!S.isDirty&&S.lastCsvHash)return toast('كل شيء متزامن بالفعل');
  askConfirm({title:'مزامنة CSV إلى Firebase',message:`سيتم رفع <b>${S.db.length}</b> سجل إلى Firebase كنسخة احتياطية مع فهارس بحث.`,icon:'fa-cloud-arrow-up',tone:'primary',confirmLabel:'مزامنة الآن',onConfirm:async()=>{
    busy(true);
    try{
      const tree={},indexes={};
      S.db.forEach(r=>{const{type,categorie,...x}=r;const T=TK[type],C=CK[categorie];
        tree[T]=tree[T]||{};(tree[T][C]=tree[T][C]||{})[x.id]={...x,createdAt:x.createdAt||Date.now()};
        // ✅ Search index by phone & name
        if(x.phone){const k=phoneKey(x.phone);if(k)indexes[k]={id:x.id,name:x.name,type,categorie,phone:x.phone,ville:x.ville||''}}
      });
      // ✅ New structured tree
      await S.fb.ref('professionnels').set(tree);
      // ✅ Fast lookup index
      await S.fb.ref('index').set(indexes);
      // ✅ Meta
      const newHash=computeCsvHash(S.db);S.lastCsvHash=newHash;
      try{localStorage.setItem('cp-csv-hash',newHash)}catch{}
      S.isDirty=false;
      await S.fb.ref('meta').update({
        derniereSynchronisation:Date.now(),
        totalEnregistrements:S.db.length,
        totalFournisseurs:S.db.filter(r=>r.type==='fournisseurs').length,
        totalExperts:S.db.filter(r=>r.type==='experts').length,
        hash:newHash
      }).catch(()=>{});
      toast(`تم رفع ${S.db.length} سجل + فهرس بحث`);topbar();
    }catch(e){console.error(e);toast('فشلت المزامنة')}
    finally{busy(false)}
  }});
}

function initMap(myLat,myLng,myCity){
  const el=document.getElementById('map');if(!el||!window.L)return;
  try{if(S.map){S.map.remove()}}catch{}
  S.map=L.map('map',{zoomControl:true,attributionControl:false}).setView([31.7917,-7.0926],6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(S.map);
  setTimeout(()=>{try{S.map.invalidateSize()}catch{}},200);
  S.mapMarkers=[];
  const myIcon=L.divIcon({className:'',html:'<div class="my-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});
  const coIcon=L.divIcon({className:'',html:'<div class="co-dot"></div>',iconSize:[14,14],iconAnchor:[7,7]});
  const myKey=S.myAccount?phoneKey(S.myAccount.phone):null;
  if(myLat&&myLng){
    S.myMarker=L.marker([myLat,myLng],{icon:myIcon}).addTo(S.map).bindPopup(`<b>موقعي</b><small>${esc(myCity||'')}</small>`);
  }
  const entries=Object.entries(S.locations||{}).filter(([k,v])=>v&&v.latitude&&v.longitude&&k!==myKey);
  entries.forEach(([k,v])=>{
    const m=L.marker([v.latitude,v.longitude],{icon:coIcon}).addTo(S.map);
    m.bindPopup(`<b>${esc(v.nom||'')}</b><small>${esc(v.ville||'')}</small><br><a class="mp-btn" href="#" onclick="window.__openProfileByPhone('${esc(v.telephone||'')}');return false">فتح الملف</a>`);
    S.mapMarkers.push(m);
  });
  const emptyEl=document.getElementById('mapEmpty');
  const hasOther=entries.length>0;
  if(emptyEl)emptyEl.style.display=hasOther?'none':'flex';
  if(myLat&&myLng)S.map.setView([myLat,myLng],10);
  else if(hasOther){const grp=L.featureGroup(S.mapMarkers);S.map.fitBounds(grp.getBounds().pad(0.2))}
  else S.map.setView([31.7917,-7.0926],6);
}

  mapRecenter(){if(S.myMarker&&S.map)S.map.setView(S.myMarker.getLatLng(),12);else toast('لا يوجد موقع محفوظ')},
  mapRecenterPick(){getGeo().then(g=>{if(g&&S.map)S.map.setView([g.lat,g.lng],12);else toast('لا يمكن تحديد موقعك')})},
  mapRefresh(){loadVisitsAndLocations().then(()=>{const loc=myLoc();initMap(loc?.latitude,loc?.longitude,loc?.ville)})},
  useGPS(){useGPSFlow()},
  pickFromMap(){pickFromMapFlow()},
  confirmPickLocation(){confirmPickLocation()},
  openPickFromMap(){pickFromMapFlow()},
  showOnMap(id){
    const r=byId(id);if(!r)return;
    const k=phoneKey(fmtPhone(r.phone));const loc=k?S.locations[k]:null;
    if(!loc||!loc.latitude)return toast('هذا الحساب لم يشارك موقعه');
    closeM();
    setTimeout(()=>{
      const isMine=S.myAccount&&S.myAccount.id===r.id;
      openMapWindow(isMine?loc.latitude:null,isMine?loc.longitude:null,isMine?loc.ville:null);
      setTimeout(()=>{if(S.map)S.map.setView([loc.latitude,loc.longitude],12)},500);
    },200);
  },
  shareMyLocation(){
    const loc=myLoc();
    if(!loc||!loc.latitude)return toast('لا يوجد موقع محفوظ');
    const t=`📍 ${S.myAccount.name}\n🗺️ https://www.google.com/maps?q=${loc.latitude},${loc.longitude}`;
    if(navigator.share){navigator.share({title:S.myAccount.name,text:t}).catch(()=>{})}
    else{navigator.clipboard.writeText(t).then(()=>toast('تم النسخ')).catch(()=>{})}
  }
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a]){e.stopPropagation();A[el.dataset.a](el.dataset.v,el)}
  else if(e.target.id==='md')closeM();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeM();
  if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v);
});

(async()=>{
  try{if(window.firebase){firebase.initializeApp(FBC);S.fb=firebase.database()}}catch(e){console.warn('Firebase init failed',e)}
  await loadDB();
  await loadVisitsAndLocations();
  S.lastSync=Date.now();
  go('home');
  busy(false);
  topbar();
  const m=location.hash.match(/^#p=(.+)$/);
  if(m)setTimeout(()=>{const r=byId(m[1]);r?profile(r.id):toast('الرابط غير صالح')},300);
})();
})();
</script>
</body>
