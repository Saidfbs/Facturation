<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Réseau Industriel — Maroc</title>
<meta name="theme-color" content="#12171D">
<meta name="description" content="نربط الموردين والشركات في مكان واحد">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cp-theme')||'light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== Réseau Industriel — Industrial Design System =====
   Drop-in replacement for the page stylesheet.
   All class names and ids are unchanged, so every feature keeps working. */
:root{--ink:#12171D;--ink2:#1C242D;--pri:#F26A1B;--pri2:#D4560C;--acc:#FFB800;--bg:#E6E9ED;--sf:#fff;--sf2:#F2F4F6;--bd:#C9D0D8;--tx:#12171D;--tx2:#4A5663;--tx3:#8793A0;--ok:#168A45;--bad:#D32F2F;--sky:#2F80C0;--wa:#128C7E;--fb:#1877F2;
--sh:0 1px 0 rgba(18,23,29,.06),3px 3px 0 rgba(18,23,29,.07);--r:6px;--ff:'IBM Plex Sans Arabic',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,Consolas,monospace;
--haz:repeating-linear-gradient(-45deg,#FFB800 0 10px,#12171D 10px 20px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:light}
[data-theme=dark]{--bg:#0C1015;--sf:#151B22;--sf2:#1B232C;--bd:#2B3641;--tx:#E7ECF1;--tx2:#9AA7B5;--tx3:#667382;--sh:0 1px 0 rgba(0,0,0,.5),3px 3px 0 rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font:14px/1.6 var(--ff);color:var(--tx);min-height:100vh;background-color:var(--bg);
background-image:linear-gradient(rgba(18,23,29,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,23,29,.045) 1px,transparent 1px);background-size:24px 24px}
[data-theme=dark] body{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px)}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Header */
header{position:fixed;inset:0 0 auto;z-index:30;padding-top:var(--st);background:var(--ink);border-bottom:1px solid #000}
header::after{content:"";position:absolute;inset-inline:0;bottom:-6px;height:6px;background:var(--haz)}
.hin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:42px;height:42px;border-radius:var(--r);background:var(--pri);color:#12171D;display:grid;place-items:center;flex:none;font-size:18px;box-shadow:inset 0 0 0 2px #12171D,0 0 0 2px var(--acc)}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.2;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--acc);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:var(--r);background:#242E39;border:1px solid #38444F;color:#DCE3EA;display:inline-grid;place-items:center;position:relative;transition:.15s;flex:none}
.ib:hover{background:#2F3B48;border-color:var(--acc)}.ib.pri{background:var(--pri);border-color:var(--pri);color:#12171D}.ib.grn{background:var(--sky);border-color:var(--sky);color:#fff}
main{max-width:1100px;margin:0 auto;padding:calc(84px + var(--st)) 12px calc(92px + var(--sb))}
.tab{display:none}.tab.on{display:block;animation:fu .25s}@keyframes fu{from{opacity:0;transform:translateY(6px)}}

/* Hero */
.hero{padding:26px 22px;border-radius:var(--r);background:linear-gradient(135deg,#12171D 0,#1F2A36 100%);color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh);border:1px solid #000;border-inline-start:8px solid var(--pri)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
.hero::after{content:"\f275";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;inset-inline-end:-10px;bottom:-30px;font-size:140px;opacity:.09;color:var(--acc)}
.hero>*{position:relative}
.hero span{display:inline-block;font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--acc);color:#12171D;padding:3px 10px;border-radius:3px;margin-bottom:10px}
.hero h2{font-size:23px;line-height:1.3}.hero p{color:#C3CCD6;font-size:13px;margin-top:6px;max-width:520px}
.hero .bt{margin-top:16px}

/* Section heads */
.sh{display:flex;align-items:center;gap:10px;margin:26px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
[data-theme=dark] .sh{border-color:var(--bd)}
.sh i{width:34px;height:34px;border-radius:var(--r);background:var(--ink);color:var(--acc);display:grid;place-items:center;font-size:13px;border:1px solid #000}
.sh b{flex:1;font-size:15px;text-transform:uppercase;letter-spacing:.03em}.sh small{display:block;color:var(--tx2);font-size:11.5px;font-weight:400;text-transform:none;letter-spacing:0}
.sh em{font-style:normal;font-family:var(--fm);background:var(--pri);color:#12171D;font-weight:700;font-size:12px;padding:2px 10px;border-radius:3px}

/* Stats */
.g4{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.sc{background:var(--sf);border:1px solid var(--bd);border-top:4px solid var(--pri);border-radius:var(--r);padding:14px 8px;text-align:center;box-shadow:var(--sh);transition:.15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.sc:hover{transform:translate(-1px,-1px);border-color:var(--pri)}
.sc i{width:38px;height:38px;border-radius:var(--r);background:var(--ink);color:var(--acc);display:grid;place-items:center}
.sc b{font-family:var(--fm);font-size:24px;line-height:1.1}.sc span{color:var(--tx2);font-size:11.5px;font-weight:600}
.seg{display:flex;height:12px;border-radius:3px;overflow:hidden;gap:2px;margin-bottom:10px;border:1px solid var(--ink);background:var(--ink)}.seg i{display:block}
.cols{display:grid;gap:12px}@media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
.pn{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.pn>b{display:block;font-size:12px;color:var(--tx2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.sl{max-height:280px;overflow-y:auto}
.bar{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:36px;padding:0 10px;margin-top:4px;border-radius:4px;background:var(--sf2);border:1px solid var(--bd);overflow:hidden;font-weight:600;font-size:13px}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:repeating-linear-gradient(-45deg,rgba(242,106,27,.22) 0 6px,rgba(242,106,27,.1) 6px 12px)}.bar span,.bar b{position:relative}
.bar b{font-family:var(--fm);background:var(--ink);color:var(--acc);border-radius:3px;padding:0 8px;font-size:12px}

/* Search / filters */
.sr{display:flex;align-items:center;gap:8px;height:52px;padding:0 6px 0 14px;background:var(--sf);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh)}
[data-theme=dark] .sr{border-color:var(--bd)}
.sr:focus-within{border-color:var(--pri)}.sr>i{color:var(--tx3)}
.sr input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0}
.sr .x{width:32px;height:32px;color:var(--tx3)}
.fbtn{width:40px;height:40px;border-radius:var(--r);background:var(--ink);color:var(--acc);display:grid;place-items:center;position:relative}
.fbtn.has{background:var(--pri);color:#12171D}
.bub{position:absolute;top:-7px;inset-inline-end:-7px;min-width:18px;height:18px;border-radius:3px;background:var(--acc);color:var(--ink);font-family:var(--fm);font-size:11px;font-weight:700;display:grid;place-items:center;border:1px solid var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 12px;border-radius:3px;background:var(--ink);color:var(--acc);font-weight:600;font-size:12px;border-inline-start:4px solid var(--pri)}
.chip button{width:22px;height:22px;border-radius:3px;background:rgba(255,255,255,.14);color:#fff;font-size:9px}
.inf{color:var(--tx2);font-size:12.5px;margin:12px 4px 8px;font-weight:600}
.pill{display:flex;gap:0;margin:12px 0;padding:3px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r)}
.pill button{flex:1;height:36px;border-radius:4px;color:var(--tx2);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.pill button.on{background:var(--ink);color:var(--acc)}

/* Cards */
.ls{display:grid;gap:10px}@media(min-width:720px){.ls{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:54px 1fr auto;gap:10px;padding:12px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.card:hover{transform:translate(-1px,-1px);border-color:var(--pri)}
.card.fv{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc),var(--sh)}
.card.mine{border-color:var(--pri);background:linear-gradient(135deg,rgba(242,106,27,.08),rgba(255,184,0,.08))}
.card.exp{border-inline-start:5px solid var(--sky)}
.card.four{border-inline-start:5px solid var(--pri)}
.av{width:54px;height:54px;border-radius:var(--r);color:#fff;display:grid;place-items:center;font-family:var(--fm);font-weight:700;font-size:18px;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.av.four{background:linear-gradient(140deg,#C2410C,#F26A1B)}
.av.exp{background:linear-gradient(140deg,#2F80C0,#17507F)}
.av.mine{background:linear-gradient(140deg,#168A45,#0D6B63)}
.cm{min-width:0;display:flex;flex-direction:column;gap:3px}
.ti{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ti i{color:var(--pri);font-size:12px}
.ir{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--tx2)}.ir i{color:var(--pri);font-size:10px;margin-inline-end:3px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tg{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:3px;background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)}
.tg.a{background:var(--ink);color:var(--acc);border-color:var(--ink)}
.tg.four{background:rgba(242,106,27,.12);color:var(--pri2);border-color:rgba(242,106,27,.35)}
.tg.exp{background:rgba(47,128,192,.12);color:var(--sky);border-color:rgba(47,128,192,.35)}
.tg.me{background:var(--pri);color:#12171D;border-color:var(--pri)}
.tg.v{background:#DDF3E6;color:var(--ok);border-color:#A9DDBD}
.ca{display:grid;grid-template-columns:repeat(2,30px);gap:4px;align-self:start}
.ca button,.ca a{width:30px;height:30px;border-radius:4px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx3);display:grid;place-items:center;font-size:12px}
.ca button:hover,.ca a:hover{border-color:var(--pri)}
.ca .on{color:var(--acc);border-color:var(--acc)}.ca .wa{color:var(--wa)}.ca .pdf{color:var(--bad)}
.chip2{display:flex;align-items:center;gap:12px;padding:10px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer;width:100%;text-align:start;margin-bottom:8px;border-inline-start:4px solid var(--acc)}
.chip2 .av{width:40px;height:40px;font-size:15px}.chip2 .bd{flex:1;min-width:0}
.chip2 b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip2 small{color:var(--tx2);font-size:11.5px}
.mine{background:linear-gradient(135deg,rgba(242,106,27,.1),rgba(255,184,0,.1));border-color:var(--pri)}
.em{text-align:center;padding:40px 16px;border:2px dashed var(--bd);border-radius:var(--r);color:var(--tx2);background:var(--sf);grid-column:1/-1}
.em i{font-size:30px;display:block;margin-bottom:8px;color:var(--tx3)}.em b{display:block;color:var(--tx);font-size:16px}

/* Explorer */
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:12px 0}
.cr button{padding:6px 14px;border-radius:3px;background:var(--sf);border:1px solid var(--bd);font-weight:600;font-size:12.5px}
.cr button:last-child{background:var(--ink);color:var(--acc);border-color:var(--ink)}.cr i{font-size:9px;color:var(--tx3)}
.rw{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:8px;border-radius:var(--r);background:var(--sf);border:1px solid var(--bd);border-inline-start:4px solid var(--ink);text-align:start;font-weight:600;box-shadow:var(--sh)}
.rw:hover{border-color:var(--pri);border-inline-start-color:var(--pri)}.rw>i:first-child{width:42px;height:42px;border-radius:var(--r);background:var(--ink);color:var(--acc);display:grid;place-items:center}
.rw span{flex:1}.rw em{font-style:normal;font-family:var(--fm);background:var(--ink);color:var(--acc);border-radius:3px;padding:1px 12px;font-size:13px}.rw>i:last-child{font-size:10px;color:var(--tx3)}

/* Buttons */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r);font-weight:700;background:var(--pri);color:#12171D;border:2px solid #12171D;box-shadow:3px 3px 0 #12171D;transition:.12s}
.bt:hover{background:var(--acc)}.bt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #12171D}.bt:disabled{opacity:.5;box-shadow:none}
.bt.g{background:var(--sf2);color:var(--tx);border-color:var(--bd);box-shadow:none}.bt.k{background:var(--ink);color:var(--acc)}.bt.d{background:var(--bad);color:#fff}.bt.full{width:100%}
[data-theme=dark] .bt{border-color:#000}

/* Modal */
#md{position:fixed;inset:0;z-index:60;background:rgba(10,14,18,.78);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
#md.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:calc(100vh - 28px);overflow-y:auto;background:var(--sf);padding:26px 20px 20px;border-radius:var(--r);border:2px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.35);animation:mi .22s;position:relative;margin:auto}
.sheet::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--haz)}
@keyframes mi{from{transform:translateY(20px) scale(.97);opacity:0}}
.sheet h2{font-size:20px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}.lead{color:var(--tx2);font-size:13px;margin-bottom:14px}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.ac .full{grid-column:1/-1}
.fs{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:var(--r);text-align:start;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px}
.fs.on{background:rgba(242,106,27,.09);border-color:var(--pri)}
.fs .ic{width:40px;height:40px;border-radius:var(--r);background:var(--ink);color:var(--acc);display:grid;place-items:center;flex:none}.fs.on .ic{background:var(--pri);color:#12171D}
.fs .nm{flex:1;font-weight:600;word-break:break-word}.fs .val{color:var(--pri2);font-size:12px;max-width:55%;text-align:end}
.fs .n{font-family:var(--fm);background:var(--sf2);padding:0 8px;border-radius:3px;font-size:12.5px;border:1px solid var(--bd)}.fs.on .n{background:var(--pri);color:#12171D;border-color:var(--pri)}
.fs .box{width:22px;height:22px;border-radius:3px;border:2px solid var(--tx3);display:grid;place-items:center;color:transparent;font-size:10px;flex:none}.fs.on .box{background:var(--pri);border-color:var(--ink);color:#12171D}
.fs.clr{border-style:dashed;color:var(--bad)}
.fb{color:var(--pri2);font-weight:700;padding:6px 10px;margin-bottom:8px}
.ff{position:sticky;bottom:-20px;margin:16px -20px -20px;padding:12px 20px;background:var(--sf);border-top:2px solid var(--ink);display:flex;gap:8px}.ff .bt{flex:1}
.cc{font-family:var(--fm);background:rgba(0,0,0,.18);padding:0 8px;border-radius:3px}

/* Profile */
.ph{margin:-26px -20px 0;padding:34px 20px 18px;text-align:center;color:#fff;background:linear-gradient(135deg,#12171D,#1F2A36);border-radius:4px 4px 0 0;position:relative}
.ph::after{content:"";position:absolute;inset:auto 0 0;height:4px;background:var(--pri)}
.pl{width:74px;height:74px;margin:0 auto 10px;border-radius:var(--r);background:var(--pri);color:#12171D;display:grid;place-items:center;font-size:28px;box-shadow:inset 0 0 0 3px #12171D,0 0 0 3px var(--acc)}
.pn2{font-size:20px;font-weight:700}.ps{font-size:12.5px;opacity:.75}.ph .tags{justify-content:center;margin-top:10px}.ph .tg{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22)}
.pa{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
.pa .ib{width:44px;height:44px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx2)}.pa .wa{background:var(--wa);border-color:var(--wa);color:#fff}.pa .pdf{color:var(--bad)}
.vr{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd)}.vr:last-child{border:0}
.vr>i,.vr>a{width:40px;height:40px;border-radius:var(--r);background:var(--sf2);border:1px solid var(--bd);color:var(--pri);display:grid;place-items:center;flex:none}
.vr small{display:block;color:var(--tx3);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.vr b{overflow-wrap:anywhere}

/* About */
.ah{text-align:center;padding:30px 20px;border-radius:var(--r);color:#fff;background:linear-gradient(135deg,#12171D,#1F2A36);margin-bottom:12px;border:1px solid #000;border-bottom:6px solid transparent;border-image:var(--haz) 1;border-image-slice:1}
.ah .bg{width:68px;height:68px;border-radius:var(--r);background:var(--pri);color:#12171D;display:grid;place-items:center;margin:0 auto 10px;font-size:28px;box-shadow:inset 0 0 0 3px #12171D,0 0 0 3px var(--acc)}
.ah h2{font-size:18px;color:var(--acc);letter-spacing:.04em}.ah p{font-size:13px;opacity:.85}
.as{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.as div{text-align:center;padding:12px 4px;background:var(--sf);border:1px solid var(--bd);border-top:4px solid var(--acc);border-radius:var(--r);box-shadow:var(--sh)}.as b{display:block;font-family:var(--fm);font-size:22px;color:var(--pri)}.as span{font-size:11.5px;color:var(--tx2)}
.lk{display:flex;align-items:center;gap:12px;padding:12px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--sh)}
.lk .li{width:44px;height:44px;border-radius:var(--r);display:grid;place-items:center;color:#fff;font-size:18px}.lk.fb .li{background:var(--fb)}.lk.wa .li{background:var(--wa)}
.lk .bd{flex:1;min-width:0}.lk b{display:block;font-size:14px}.lk small{color:var(--tx2)}
.lk .a{display:flex;gap:4px}.lk .a a,.lk .a button{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;background:var(--sf2);border:1px solid var(--bd)}
.lk.fb .a a{background:var(--fb);color:#fff;border-color:var(--fb)}.lk.wa .a a{background:var(--wa);color:#fff;border-color:var(--wa)}
.cho{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--sf2);border:1px solid var(--bd);margin-bottom:8px;width:100%;text-align:start}
.cho .li{width:44px;height:44px;border-radius:var(--r);display:grid;place-items:center;color:#12171D;background:var(--pri);flex:none}.cho.s .li{background:var(--sky);color:#fff}
.cho div{flex:1;min-width:0}.cho b{display:block}.cho small{color:var(--tx2)}.cho .a{display:flex;gap:4px;flex:none}.cho .a a,.cho .a button{width:38px;height:38px;border-radius:4px;display:grid;place-items:center;background:var(--sf);border:1px solid var(--bd)}
.cho .a a{background:var(--pri);color:#12171D;border-color:var(--ink)}

/* Bottom nav */

 openSheets(){openM(`<h2>فتح الأوراق</h2><p class="lead">اختر الورقة لعرضها في Google Sheets</p>${linkItem('ورقة الخبراء','عرض جدول الخبراء',SHEET_E,'s','fa-table')}${linkItem('ورقة الموردين','عرض جدول الموردين',SHEET_F,'s','fa-table')}<div class="ac"><button class="bt g full" data-a="cls">إغلاق</button></div>`)},
 undo(){if(undoFn){undoFn();undoFn=null;$('#ts').classList.remove('on')}},
 tab(v){if(S.tab===v){window.scrollTo({top:0,behavior:'smooth'});if(v==='exp'){S.exp={t:'',d:'',s:'',q:'',sort:S.exp.sort};explorer()}else if(v==='dir'){clearF();dirShell()}else if(v==='fav')favShell()}else go(v)},
 stat(v){if(v==='f'){openFilter();return}const i=v.indexOf(':');clearF();S.f[v.slice(0,i)]=[v.slice(i+1)];go('dir')},
 bar(v,el){clearF();S.f[el.dataset.k]=[v];go('dir')},
 chipx(v,el){const k=el.dataset.k;S.f[k]=S.f[k].filter(x=>norm(x)!==norm(el.dataset.v));S.lim=40;clearFc();dirList()},
 qx(){S.q='';$('#q').value='';S.lim=40;clearFc();dirList()},more(){S.lim+=40;dirList()},dirsort(v){S.dirSort=v;S.lim=40;dirShell()},
 fmodal:()=>openFilter(),fsect(v){S.fp={mode:'pick',key:v};renderFilter()},fback(){S.fp={mode:'sections',key:null};renderFilter()},fsort(v){S.sortF[S.fp.key]=v;renderFilter()},
 fclearsec(){S.f[S.fp.key]=[];S.lim=40;clearFc();renderFilter()},
 fpick(v){const a=S.f[S.fp.key],i=a.findIndex(x=>norm(x)===norm(v));i>=0?a.splice(i,1):a.push(v);S.lim=40;clearFc();renderFilter()},
 fclr(){clearF();renderFilter()},fdone(){closeM();if(S.tab!=='dir'){S.tab='';go('dir')}else dirList()},
 xsort(v){S.exp.sort=v;explorer()},xt:v=>{S.exp={t:v,d:'',s:'',q:'',sort:S.exp.sort};explorer()},xd:v=>{S.exp.d=v;S.exp.s='';S.exp.q='';explorer()},xs:v=>{S.exp.s=v;S.exp.q='';explorer()},qxexp(){S.exp.q='';explorer()},
 xc(v){const x=S.exp;S.exp=v===''?{t:'',d:'',s:'',q:'',sort:x.sort}:v==='t'?{...x,d:'',s:'',q:''}:v==='d'?{...x,s:'',q:''}:x;explorer()}
};

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='Enter'&&e.target.classList?.contains('card'))A.open(e.target.dataset.v)});

 const m=location.hash.match(/^#p=(.+)$/);if(m)setTimeout(()=>{const r=byId(m[1]);r?profile(r.id):toast('الرابط غير صالح')},300);
